services:
  app:
    build:
      context: .
    env_file:
      - "${APP_ENV_FILE:-.env}"
    environment:
      APP_DATA_DIR: /data
    ports:
      - "${APP_PORT:-3000}:8000"
    volumes:
      - grounded_growth_data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health/", timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  grounded_growth_data:
