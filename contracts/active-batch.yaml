acceptance:
  - The implementation starts from exact target default-branch commit a1bc79218a9397dcdbf699a1422c6f2881033675 and treats M6C-04 plus its mobile correction as merged; stale target prose describing M6C-04 as a current review branch is corrected only in allowed governance, current-state, and handoff artifacts.
  - Exactly the four competency IDs 08.06, 09.12, 10.02, and 13.02 move from uncovered to individually authored draft packages under the exact protocol stable IDs, domains, families, recommendation-target subsets, and action counts recorded in scope.cohort; no fifth competency is authored, renamed, or silently substituted.
  - Every selected competency is still uncovered at the baseline, every protocol parent and domain match the canonical curriculum, every target lever is a non-empty subset of the complete parent mapping, current protocol display orders remain unique, and all new source, gap, action, protocol, and activation stable IDs are unique and manifest-listed.
  - Each package is RISK-LOW, inactive, editorial draft, runtime_projection none, SP-SHADOW-ONLY, scoring_status shadow_only, and ledgered score_active false with no approved production contract; friendship remains the only score-active protocol.
  - "The four interventions are materially different and competency-specific: a bounded motivation-independent start comparison, a prospective decision record and scheduled update, a weak-component practice-feedback-retry loop, and a bounded non-hazardous home-system audit/redesign. Generic noun substitution, repeated journal prompts, cloned actions, uniform three-action templates, and completion-only evidence fail review."
  - Action independent of motivation does not equate fatigue, depression, disability, caregiving load, pain, rest, or low energy with failure; it excludes unsafe, medically inappropriate, sleep-depriving, or coercive productivity demands and permits defer, reduced scope, support, and recovery without deficit.
  - Decision records store only minimum private decision metadata and allow omission of names, secrets, allegations, credentials, legal privilege, protected work information, and sensitive third-party detail; outcome knowledge does not rewrite the original prediction or assumptions.
  - Deliberate practice is limited to one safe, lawful, low-stakes skill with an observable component; it excludes physical danger, clinical rehabilitation, licensed work, abusive instruction, and high-consequence performance, and feedback never requires a coerced observer or public artifact.
  - Home upkeep is limited to one user-controlled, non-hazardous area or routine; it excludes electrical, gas, structural, fire, mold, biohazard, pest-control, chemical, tenancy, accessibility, or repair work needing an owner, landlord, tradesperson, emergency service, or qualified professional.
  - Each package supplies specific applicability, N/A/defer behavior, readiness, opportunity, prerequisites, burden, low-resource/accessibility/cultural/resource adaptations, privacy, foreseeable misuse, exclusions, pause, stop, escalation, referral, completion, transfer, and mastery boundaries without clinical, psychometric, universal, moral, productivity-worth, or guaranteed-effect claims.
  - Claim-level sources are added to the canonical source registry with stable IDs, authorship or issuing body, date, locator, source class, evidence strength, supported claim, limitations, applicability, retrieval date, and quotation constraints. Primary research, systematic review, official guidance, or professional standards are preferred; snippets and generated prose are not sources, and unresolved review limits remain explicit research gaps.
  - The canonical practice schema and loader add a fail-closed source-only typed-evidence branch for typed-evidence-rules-v1 while preserving practice-observation-v1 byte-for-byte for all five projected legacy packages. A package cannot mix rule versions, project typed rules into the ORM, or use a typed rule without matching protocol/action/competency/policy identities.
  - Typed rules use only explicit bounded normalization. Behavioral rules may use Boolean, count, bounded-frequency, or duration observations; artifact, scenario, and objective rules use allowlisted criteria or bounded indicators without artifact contents, prose length, sentiment, private narrative, observer identity, or a hidden more-is-better assumption.
  - Conspicuously synthetic cohort fixtures replay every new action rule and cover supportive, mixed, contradictory, inconclusive, unknown, not-observed, N/A, deferred, and adverse paths; they demonstrate distinct protocol performance versus direct competency contribution, context and epoch bounds, provenance, recency, repetition, withholding, exact hashes, and no duplicate event application.
  - All new typed results remain pure source/fixture shadow evidence. No typed event is persisted, no legacy event is rewritten or up-converted, no LeverBaseline, LeverState, ScoreSnapshot, context, Personal OS, recommendation, sprint, review, or activation record is written, and no package becomes runtime-available.
  - Deterministic reports show exactly 383 competencies, 9 authored packages, 5 projected legacy packages, 4 M6D-01 draft typed source packages, 374 uncovered competencies, 29 source actions, 15 runtime actions, 8 domains with authored packages, 21 parent-mapped levers, 10 recommendation-target levers, 7 low-risk and 2 moderate-risk packages, 0 release candidates, 0 source-complete packages, 5 runtime protocols, and 1 score-active protocol.
  - Originality output contains no unreviewed exact duplicate action instruction, action title, reflection set, evidence-rule payload, or safety block introduced by this cohort; every near-duplicate and structural warning has a recorded human disposition, and automated lexical overlap is not represented as semantic review.
  - GG-CURRICULUM-EXPANSION-READINESS-1.0 and GG-COMPETENCY-EVIDENCE-READINESS-1.0 are updated to distinguish the expanding source catalog from the frozen five-protocol runtime. A new read-only GG-M6D-01-AUTHORING-READINESS-1.0 verifies the exact cohort, hashes, reports, fixtures, inactive ledger state, pending governance, and no database writes without weakening any prerequisite readiness contract.
  - The frozen runtime projection hash 274f7244630ed56d56a443a6a699399edade6c67fcf964237559e05b72368e35, historical v1 evidence and score replay, M6C behavior, current recommendation outputs, five seeded protocols, fifteen seeded actions, and friendship-only activation remain exact.
  - "M6B governance remains unaccepted: ER-M6A-003 is pending, RG-M6A-002 is open, Decisions 047 through 049 remain proposed, and no content, source, schema, fixture, report, browser, hosted-CI, or Compose result is represented as specialist, accessibility-population, cultural, clinical, psychometric, longitudinal, participant, mastery, release, deployment, or production evidence."
  - Focused tests, all deterministic reports and readiness gates, the complete repository verification contract, unchanged browser journeys, Compose backup/restore/recreation, required hosted CI, retained evidence review, and target owner review pass on the exact candidate commit before merge.
