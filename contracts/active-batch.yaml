schema_version: 1
batch:
  id: M6J-06-ATTENTION-DISCIPLINE-PRACTICES
  title: Tailored attention discipline and legacy presence guidance
  goal: Rewrite ten domain 08 runtime practices and supply one separately validated legacy presence guide; retain 105 earlier rewrites and exactly 268 runtime rewrites pending.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - docs/architecture/0018-tailored-competency-practices.md
    - docs/PRODUCT_DECISIONS.md#decision-053
    - docs/program/M6_CURRICULUM_EXPANSION.md
  milestone: owner-directed-M6J-continuation
  baseline_commit: c3491a4ff4c0ba77c7d8f2244bae7218ae568880
dependencies:
