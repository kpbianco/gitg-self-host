  goal: Add a pure versioned backend engine and read-only readiness contract that rank explicitly context-complete active practice candidates and return deterministic explainable alternatives after not-applicable or defer, while preserving the existing no-context recommendation path, private Personal OS boundaries, historical replay, and friendship-only production activation.
