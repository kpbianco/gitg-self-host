schema_version: 1
batch:
  id: M6B-GOV-AUDIT
  title: Audit the complete 383-package catalog for governance review
  goal: Produce a deterministic finding-complete audit and prioritized review packet for every canonical package without fabricating specialist acceptance resolving human gates or silently changing activation.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - products/gitg-self-host/acceptance.yaml#GG-GOV-M6B
    - owner-direction-2026-08-31
  milestone: products/gitg-self-host/roadmap.yaml#M6B-GOV
  baseline_commit: 85eb9e4da0a34704ddb194c1fca7b32317cd9fb8
dependencies:
  - M6H-02
scope:
  allowed_paths:
    - AGENTS.md
    - README.md
    - Makefile
    - MANIFEST.tsv
    - .github/workflows/**
    - contracts/**
    - data/practices/**
    - reports/practice-content/**
    - scripts/**
    - tests/**
    - docs/**
  forbidden_paths:
    - data/assessment/**
    - data/curriculum/**
    - data/model/**
    - data/notion/**
    - data/evidence/**
    - growth/**
    - templates/**
    - requirements*.txt
    - pyproject.toml
    - Dockerfile
    - docker-compose.yml
acceptance:
  - Objective schema registry source-reference exact-duplicate mapping and deterministic-report defects may be repaired in this batch.
  - Findings requiring semantic cultural accessibility privacy safety measurement legal clinical or intervention judgment remain open and are routed to named reviewers.
  - Exactly 383 canonical packages and 1,151 stable actions receive one deterministic audit row covering identity parent mapping recommendation targets family risk evidence kinds scoring policy activation status sources research gaps expert reviews and content hash.
  - Every package receives explicit automated dispositions for schema completeness stable-ID uniqueness mapping validity evidence-rule executability privacy-field allowlists source metadata exact and near-duplicate candidates accessibility adaptation fields safety stop and escalation fields and activation-review consistency.
  - Every finding has a stable finding ID severity objective evidence affected stable IDs remediation class and status; no finding is dropped because the catalog is runtime active.
  - Objective critical and high structural defects are repaired or remain explicit blockers with regression tests; semantic or specialist findings are never auto-closed.
  - The audit separately reports the five legacy packages 378 typed packages 374 generated additions all risk classes all evidence kinds every domain every lever and every score-active package.
  - The report explicitly identifies the owner-directed all-active versus pending-review boundary and never equates software activation with source completeness safety accessibility cultural fit effectiveness or validation.
  - ER-M6A-003 remains pending and RG-M6A-002 remains open unless actual named reviewers separately complete the manual M6B-GOV contract.
  - A prioritized owner and specialist packet groups findings by required role risk domain protocol family evidence kind and remediation dependency without exposing participant data.
  - Generated JSON CSV and Markdown reports are deterministic manifest-listed and byte-stable on a second run.
  - The complete existing canonical runtime scoring replay browser and Compose regression chain remains green.
validation:
  local:
    - make catalog-governance-audit-check PYTHON=.venv/bin/python
    - make full-frontier-check PYTHON=.venv/bin/python
    - make practice-report-check PYTHON=.venv/bin/python
    - make curriculum-check PYTHON=.venv/bin/python
    - make competency-evidence-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - exact 383 package and 1,151 action audit coverage with stable finding IDs
    - complete domain lever family risk evidence source review gap and activation inventories
    - exact duplicate near-duplicate source metadata privacy safety accessibility and activation-review findings
    - deterministic second-run reports and manifest integrity
    - automated findings never complete specialist roles close ER-M6A-003 or resolve RG-M6A-002
  required_ci:
    - Ruff Django pytest migration drift and manifest verification
    - full frontier practice curriculum and competency-evidence readiness
    - deterministic consolidated audit report regeneration
    - Playwright regression journeys
    - Compose backup restore and replay drill
    - aggregate Pilot readiness gate
risk:
  class: high
  hazards:
    - automated lexical checks are represented as semantic or specialist approval
    - active packages receive lighter review than inactive packages
    - findings are lost through unstable IDs grouping or regeneration
    - objective repairs change evidence scoring or activation semantics
    - participant or owner-private data enters an audit artifact
  stop_conditions:
    - coverage is not exactly 383 packages and 1,151 actions
    - any package action domain lever family risk or evidence kind is omitted
    - a specialist role review date or decision is fabricated
    - a finding lacks reproducible objective evidence
    - an objective repair changes runtime scoring activation or participant state
    - deterministic report regeneration or a required gate fails
rollback:
  strategy: Revert the audit batch as one commit; generated findings do not mutate participant state specialist records research-gap decisions or activation.
evidence:
  output:
    - docs/evidence/M6B-GOV-AUDIT-<date>.md
    - reports/practice-content/catalog_governance_audit_v1.json
    - reports/practice-content/catalog_governance_findings_v1.csv
    - reports/practice-content/catalog_governance_review_queue_v1.csv
    - exact local and hosted CI results
  claim_boundary: Deterministic static and software governance audit only; no specialist owner participant accessibility-population cultural clinical psychometric longitudinal release deployment mastery or intervention-effectiveness acceptance.
