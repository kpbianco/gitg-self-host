acceptance:
  - The implementation starts from exact target commit 713d1a9a23f2102ca6e774f4921d56da5c8eb7b5, recognizes M6C-03 as merged at c7b51c1cd83c41c462c5c8685e80afbe39773d6b, and updates stale target current-state and handoff prose without changing accepted product decisions or canonical source hashes.
  - One authenticated Personal OS browser entry point uses only the latest AssessmentRun owned by the user, redirects a user with no assessment to the assessment journey, and shows a new assessment epoch with no inferred or copied Personal OS or context values.
  - The journey presents the exact five GG-PERSONAL-OS-1.0 identity sections, exact four descriptive Truth/Autopilot Audit prompts, season, and capacity in short staged or progressively disclosed sections rather than one compulsory worksheet; every field may remain unknown, N/A, or deferred, and no completion percentage, alignment score, autopilot score, diagnosis, moral rank, shame, streak, or pressure language is added.
  - Personal OS submissions call the unchanged record_personal_os_revision service and assessment-context submissions call the unchanged record_context_bundle service. Valid changed input appends one revision, an unchanged retry is idempotent, malformed or stale-epoch input writes nothing, POST uses CSRF and POST-redirect-GET, and a retryable SQLite conflict receives a bounded private-value-free response.
  - "A user reviews context for one active manifest-projected practice at a time. The concise form has three explicit modes: provide all six 0-to-4 factors; mark applicability not applicable; or defer by explicitly naming the deferred factor, categorical reason, and optional 1-to-366-day horizon. Uncollected factors are visibly recorded as unknown, numeric values have no preselected default, and the form never derives a factor from Personal OS text, assessment answers, personality, orientation, archetype, pilot feedback, setup-session data, or another factor."
  - The browser presenter supplies GG-CONTEXT-PRIORITY-1.0 only the active canonical practices for which the current assessment epoch has a latest verified PracticeContext revision, and states that its ranking is among those explicitly reviewed practices. It never treats an unreviewed practice as unfavorable, never expands a cohort silently, and never persists the reproducible priority result.
  - With no current-epoch context, the existing build_profile_summary recommendation IDs, base priorities, display order, reasons, and practice behavior remain exact. With missing capacity or no eligible reviewed candidate, the UI says which structured context is missing and does not label the legacy fallback as context-aware or convert unknown, N/A, or defer into zero.
  - When capacity and at least one reviewed candidate are explicitly complete, home, practice-list, and recommendation surfaces show a small context-aware set ordered exactly by the unchanged M6C-03 result. Explanations use a fixed plain-language mapping from allowlisted explanation codes and factor states, distinguish base provisional need from current context fit, avoid exposing raw backend names or false precision, and never imply worth, obligation, diagnosis, mastery, or validated recommendation usefulness.
  - A not-applicable or deferred reviewed candidate can request an alternative through the unchanged AlternativeRequest contract. The browser shows the highest-ranked distinct eligible candidate from only the reviewed cohort, or the explicit no-eligible-alternative state; it does not return the source, invent context, mutate a deficit, start a practice, or author a protocol.
  - Personal OS authored text appears only on the authenticated Personal OS surface for its owner. It is absent from context-priority inputs/results/explanations, home and practice recommendation copy, logs, messages, URL/query data, screenshots retained from non-Personal-OS surfaces, generated reports, telemetry, existing evidence and pilot-feedback exports, evidence/score snapshots, and activation decisions. Committed fixtures, retained evidence, and browser artifacts use conspicuously synthetic text only.
  - The Personal OS page explains before collection that authored values and context are private local data included in normal database backups, asks for minimal detail, and says that this slice adds no dedicated Personal OS/context export, purge, retention automation, remote telemetry, urgent-support monitoring, or participant-release approval. Existing account/assessment lifecycle behavior is not changed or advertised as a new deletion guarantee.
  - All new and changed application pages remain authenticated; keyboard focus, labels, error association, semantic headings, 200-percent zoom, 390-by-844 layout, reduced-motion behavior, and no-horizontal-overflow checks pass without adding an external browser asset or runtime service.
  - A new read-only GG-M6C-PILOT-READINESS-1.0 aggregate verifies the six existing readiness contracts, exact Personal OS/context definition IDs, five active canonical protocols, friendship-only activation, registered authenticated browser routes, and empty or valid optional state without writing data or printing private values. It does not replace or weaken GG-PILOT-READINESS-1.0 or any governance gate.
  - The Compose drill creates only synthetic Personal OS and context revisions through public services, builds a context-priority result, exercises authenticated HTTP access to the new surface, and proves revision/result hashes and friendship-only activation survive container recreation and verified backup/restore. These checks are deployment-drill evidence only, not a release or production deployment.
  - Focused form/view/service/readiness tests, full deterministic validation, new desktop/mobile Playwright journeys, Compose backup/restore, required hosted CI, retained artifact review, and the aggregate Pilot readiness gate all pass on the exact candidate commit before owner merge review.
  - Assessment, canonical content, evidence, typed evidence, competency shadow, score state, existing exports, practice workflow, five-protocol runtime projection, and friendship-only production activation remain exact. No model, migration, backfill, protocol/action, dependency, external service, remote telemetry, weekly execution, or production-score change is added.
  - M6B governance remains pending and no software, browser, fixture, hosted CI, or Compose result is represented as ER-M6A-003 completion, RG-M6A-002 resolution, recommendation usefulness, participant validation, specialist review, accessibility-population validation, cultural safety, clinical or psychometric validity, longitudinal evidence, release, deployment, production, or mastery evidence.
validation:
  local:
    - .venv/bin/python -m pytest tests/test_personal_os_browser.py tests/test_m6c_pilot_readiness.py tests/test_context_models.py tests/test_context_services.py tests/test_personal_os_models.py tests/test_personal_os_services.py tests/test_context_priority.py tests/test_context_priority_readiness.py -q
    - make context-check PYTHON=.venv/bin/python
    - make personal-os-check PYTHON=.venv/bin/python
    - make context-priority-check PYTHON=.venv/bin/python
    - make m6c-pilot-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - make e2e PYTHON=.venv/bin/python
    - make compose-smoke
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - authentication CSRF latest-assessment ownership no-assessment redirect and no reassessment carry-forward
    - exact staged Personal OS prompts states bounds initial values append-only idempotent POST-redirect-GET and private conflict errors
    - assessment season and capacity plus per-practice provide N-A and defer form mappings with no preselected ordinals or inferred factors
    - candidate cohort includes only current-epoch explicitly reviewed active canonical protocols and labels partial coverage honestly
    - no-context legacy recommendation compatibility missing-capacity behavior and exact unchanged context-aware ordering
    - distinct alternative after N-A and defer plus explicit no-eligible-alternative browser states and no score evidence sprint or activation mutation
    - Personal OS sentinel isolation from ranking explanations pages messages logs existing exports reports evidence score snapshots and retained non-private artifacts
    - stale cross-user cross-epoch inactive protocol malformed snapshot and service failure paths fail closed without private values
    - keyboard labels error focus 200-percent zoom mobile overflow reduced-motion and synthetic desktop-mobile walkthrough screenshots
    - M6C aggregate readiness deterministic JSON empty-state pass tamper diagnostics no private output and no database writes
    - Compose synthetic context and Personal OS state priority hash authenticated HTTP recreation backup restore and clean shutdown
  required_ci:
    - Ruff Django pytest and migration-drift confirmation including focused M6C-04 tests
    - pilot readiness
    - curriculum expansion readiness
    - competency evidence readiness
    - context readiness
    - Personal OS readiness
    - context-priority readiness
    - M6C pilot readiness on isolated migrated idempotently seeded state
    - Playwright legacy journeys plus authenticated Personal OS context ranking alternative privacy keyboard mobile and retained-artifact journeys
    - Docker Compose migration seed all seven readiness contracts synthetic browser-slice state authenticated HTTP priority replay recreation backup restore and clean-shutdown drill
    - aggregate Pilot readiness gate
  manual:
    - Owner reviews and accepts the exact staged prompts factor labels state mappings explanation copy privacy notice and partial-cohort language before merge.
    - Owner reviews retained synthetic desktop and mobile artifacts, confirms no real Personal OS or context value is committed or exposed, and records any accessibility privacy safety or critical UX finding.
    - Owner confirms required CI and Compose evidence for the exact candidate commit and decides separately whether an owner-operated private pilot may proceed; batch completion does not release or deploy the application.
    - Target pull request remains human-reviewed and is not marked ready or merged by the implementation agent.
risk:
  class: high
  hazards:
    - a concise flow silently defaults private context or becomes a large compulsory self-optimization worksheet
    - private mission audit context or third-party detail leaks through rendering errors logs artifacts exports backups or explanations
    - ranking a partial reviewed cohort is presented as a comprehensive or validated best choice
    - N-A or defer becomes zero a deficit pressure to answer or the same candidate returned as its own alternative
    - stale cross-user or cross-epoch data influences the browser recommendation after reassessment or concurrent writes
    - browser orchestration changes the frozen M6C-03 formula legacy recommendation semantics evidence score state practice workflow or activation
    - deployment and hosted CI evidence is overstated as participant specialist release or production validation
  stop_conditions:
    - the target checkout does not resolve exactly to baseline 713d1a9a23f2102ca6e774f4921d56da5c8eb7b5 before implementation
    - owner review leaves the staged prompts explicit form-to-contract mapping explanation language privacy notice or partial-cohort semantics unresolved
    - implementation requires a model migration backfill hidden factor default Personal OS text analysis personality modifier or change to an M6C-01 through M6C-03 contract
    - the no-context recommendation IDs priorities reasons or existing practice workflow cannot remain exact
    - a useful alternative cannot be produced through the unchanged M6C-03 contract from explicitly reviewed current-epoch candidates without inventing context or changing canonical content
    - private authored values must enter a log URL retained evidence non-private screenshot existing export report score snapshot telemetry stream or activation decision
    - a required change falls outside allowed paths or touches a forbidden path
    - focused or full deterministic validation required hosted CI Playwright artifact checks Compose recovery or the aggregate Pilot readiness gate fails on the candidate commit
    - a critical authentication privacy data-loss keyboard accessibility or safety finding remains unresolved
    - M6B governance acceptance expanded production score activation recommendation usefulness participant release deployment or a higher validation level is asserted as a prerequisite or result
rollback:
  strategy: Revert the M6C-04 browser presenter, forms, routes, templates, styles, tests, readiness/deployment wiring, documentation, evidence, and manifest changes. The legacy no-context profile and practice surfaces then become the only browser path; all M6C-01 context and M6C-02 Personal OS revisions remain append-only local data for a later corrected UI.
  data_migration: None. Do not delete or rewrite Personal OS context assessment evidence score feedback sprint review or canonical-content data during rollback; any participant-data retention or deletion action requires a separate reviewed operator decision and verified backup handling.
  release_action: No merge release deployment participant-data write score activation or production change follows automatically from implementation completion or rollback.
evidence:
  output:
    - docs/evidence/M6C-04-<date>.md
    - acceptance criterion invariant and exact browser-state mapping
    - exact baseline prerequisite commits changed-path audit and canonical hash comparison
    - synthetic Personal OS context and context-priority revision and result hashes without authored values
    - focused legacy-compatibility cohort alternative privacy ownership reassessment concurrency and no-mutation results
    - M6C aggregate readiness summaries and all six prerequisite readiness results
    - retained synthetic desktop mobile keyboard screenshot and trace artifact identifiers plus human visual-review disposition
    - Compose authenticated HTTP recreation backup restore priority replay state digests and clean-shutdown result
    - exact local and CI commands results environment commit and every failed skipped unavailable or unperformed validation
    - owner manual-gate decisions residual risks and explicit non-validation claims
  claim_boundary: Static unit integration synthetic-fixture deterministic-replay browser-journey and isolated Compose deployment-drill evidence only when actually run; never physical hardware HIL field RT engine signing release production recommendation-usefulness specialist accessibility-population cultural safety clinical psychometric longitudinal participant or mastery validation.
