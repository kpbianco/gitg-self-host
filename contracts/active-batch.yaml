schema_version: 1
batch:
  id: M6F-ALL-ACTIVE
  title: Activate the complete competency runtime
  goal: Project and score-activate all 383 canonical competency protocols under one deterministic, replayable, reversible structured-evidence contract.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - owner-direction-2026-08-26
    - docs/program/M6_CURRICULUM_EXPANSION.md
    - AGENTS.md#product-boundary
  milestone: products/gitg-self-host/roadmap.yaml#M6F
  baseline_commit: c0fcabde4ce71a616b1c90d604e521b8d76146e5
dependencies:
  - M6E-FULL-FRONTIER
scope:
  allowed_paths:
    - AGENTS.md
    - README.md
    - Makefile
    - MANIFEST.tsv
    - .github/workflows/verification.yml
    - contracts/**
    - data/practices/**
    - growth/**
    - templates/**
    - reports/practice-content/**
    - scripts/**
    - tests/**
    - docs/**
  forbidden_paths:
    - data/assessment/**
    - data/curriculum/**
    - data/model/**
    - data/notion/**
    - data/evidence/**
    - requirements*.txt
    - pyproject.toml
    - Dockerfile
    - docker-compose.yml
acceptance:
  - Exactly 383 canonical competencies have exactly one runtime-projected, available, score-active protocol and complete activation-ledger coverage.
  - All 1,151 actions remain stable-ID-addressable; legacy actions replay under practice-observation-v1 and typed actions write and replay under GG-TYPED-EVIDENCE-1.0.
  - Typed check-ins collect explicit measurement state, provenance, and kind-specific structured values without using free text or artifact contents as score input.
  - Every eligible event allocates one competency contribution through the complete canonical parent competency mapping; recommendation-target subsets never replace scoring allocation.
  - Mixed-protocol score projection is deterministic across shared levers, assessment baselines remain immutable, and state writes remain atomic, idempotent, reversible, rebuildable, and hash-audited.
  - Inconclusive, unknown, stale, adverse, unattempted, unobserved, or contract-invalid evidence remains visible but is withheld from score mass without penalty.
  - Completion never establishes mastery and no score represents identity, dignity, clinical status, professional qualification, or human worth.
  - Editorial, semantic, source, originality, accessibility, privacy, safety, specialist, psychometric, clinical, cultural, participant, and longitudinal review remain pending for the owner's consolidated audit and are not represented as passed.
validation:
  local:
    - make full-frontier-check PYTHON=.venv/bin/python
    - make practice-report-check PYTHON=.venv/bin/python
    - make curriculum-check PYTHON=.venv/bin/python
    - make competency-evidence-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - .venv/bin/python manage.py makemigrations --check --dry-run
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - exact 383 runtime and 383 score-active activation projection
    - typed runtime form and immutable evidence-event persistence across every measurement kind
    - mixed-protocol shared-lever aggregation and canonical parent mapping
    - typed withholding, replay, reversal, repair, and privacy-safe export
    - migration forward and rollback coverage for typed check-in observations
  required_ci:
    - Ruff Django pytest and migration-drift verification
    - fresh practice and competency-evidence reports
    - curriculum and full-frontier readiness
    - context Personal OS priority and pilot regression suites
    - Playwright and Compose runtime regression suites
risk:
  class: high
  hazards:
    - a runtime action is scored against recommendation targets instead of its complete parent mapping
    - a typed value, provenance requirement, or withholding condition is silently defaulted
    - free text, artifact contents, identity, dignity, or completion is treated as opaque score input
    - shared-lever contributions are double counted or cross assessment epochs
    - activation is mistaken for specialist, psychometric, clinical, cultural, or intervention validation
  stop_conditions:
    - canonical, runtime, or activation coverage is not exactly 383
    - any submitted event cannot replay exactly or any score transition cannot reverse and rebuild exactly
    - any required assessment baseline is mutated or a malformed mapping is normalized silently
    - any score input includes private narrative or artifact contents
    - a failing required gate is waived
rollback:
  strategy: Revert the M6F batch as one commit, migrate the additive typed-observation field backward, reseed the prior five-protocol runtime, and rebuild score state from immutable baselines and replayable events.
evidence:
  output:
    - docs/evidence/M6F-ALL-ACTIVE-2026-08-26.md
    - reports/practice-content/coverage_summary_v1.json
    - exact local and hosted-CI command results for the candidate commit
  claim_boundary: Owner-directed software activation with deterministic structured evidence, mapping, replay, withholding, migration, score-state, browser, and deployment regression evidence only; never specialist, psychometric, clinical, cultural, longitudinal, participant-effectiveness, mastery, or human-worth validation.
