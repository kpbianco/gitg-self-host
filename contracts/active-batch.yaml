acceptance:
  - Versioned models represent context-factor values as explicit unknown not_applicable deferred or provided states; missing data is never replaced by a hidden neutral or favorable value.
  - Applicability importance readiness urgency opportunity/resources burden season and capacity have bounded typed contracts and plain-language definitions.
  - Defer/not-now stores an explicit reason category and optional bounded review horizon without reducing a baseline current estimate confidence need rank or worth-related value.
  - Records are user and assessment-epoch scoped where required; reassessment never silently transfers stale context.
  - Pure services validate cross-field constraints and return deterministic canonical snapshots and hashes for unchanged input.
  - Migrations are reversible where Django permits, idempotent through normal migrate operations, and do not rewrite existing assessment evidence score pilot-feedback practice or review records.
  - Existing GG-EVIDENCE-1.0 typed evidence shadow score-state need-ranking pilot curriculum and competency-evidence readiness outputs remain exact.
  - Existing recommendation order and all ordinary UI behavior remain unchanged in this batch.
  - Friendship remains the only production score-active protocol; no protocol package action source registry or activation entry changes.
  - Focused boundary migration epoch isolation hashing and no-mutation tests plus the full repository gate pass.
  - Retained evidence distinguishes software contract readiness from user accessibility cultural or longitudinal validation.
  - M6B specialist governance remains pending and is not represented as accepted; this software/content sequence cannot activate production scoring.
validation:
  local:
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
  focused_tests_to_add:
    - state enum and numeric boundary validation
    - unknown N-A and defer remain distinct
    - deterministic snapshot and content hash
    - reassessment epoch isolation
    - migration round trip and existing-row preservation
    - no assessment evidence score recommendation or activation mutation
    - context readiness fail-closed diagnostics
  required_ci:
    - Ruff Django and pytest
    - pilot readiness
    - curriculum expansion readiness
    - competency evidence readiness
    - Playwright core journeys
    - Docker Compose deployment drill
    - aggregate Pilot readiness gate
  manual:
    - Review factor definitions and language for non-judgmental semantics before merge.
risk:
  class: high
  hazards:
    - hidden defaults create false priority precision
    - N-A or defer becomes a deficit
    - context silently carries across assessment epochs
    - migration changes historical state
    - future ranking is accidentally enabled before review
  stop_conditions:
    - a recommendation or score algorithm change is required
    - factor semantics require an unresolved product decision
    - existing evidence or score snapshots must be rewritten
    - ordinary UI changes become necessary
    - source changes outside allowed paths are required
rollback:
  strategy: Revert the batch and migration before later M6C batches depend on it; retain a verified pre-migration backup.
  data_migration: Use normal Django backward migration only after backup and only when no later schema depends on it.
  release_action: No user-facing release claim from this foundation alone.
evidence:
  output:
    - docs/evidence/M6C-01-<date>.md
    - acceptance and invariant mapping
    - migration and replay results
    - exact commands and environment
    - residual factor-definition and validation risks
  claim_boundary: Static migration unit replay package browser and deployment regression evidence only; no user or specialist validation.
