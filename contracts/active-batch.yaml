schema_version: 1
batch:
  id: M6H-01
  title: Integrate weekly execution and proof-based review
  goal: Connect the existing Personal OS, context-priority, active-practice, evidence, and review surfaces into one deterministic seven-day execution loop without adding a human or specialist gate.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - owner-direction-2026-08-27
    - docs/program/M6_CURRICULUM_EXPANSION.md#phase-f--full-product-integration-and-validation
    - AGENTS.md#product-boundary
  milestone: products/gitg-self-host/roadmap.yaml#M6H-01
  baseline_commit: 4301b4f2ac8010dd4a25a85e9143bc5b726937c3
dependencies:
  - M6F-ALL-ACTIVE
scope:
  allowed_paths:
    - AGENTS.md
    - README.md
    - Makefile
    - MANIFEST.tsv
    - .github/workflows/verification.yml
    - contracts/**
    - growth/**
    - templates/**
    - scripts/**
    - tests/**
    - docs/**
  forbidden_paths:
    - data/assessment/**
    - data/curriculum/**
    - data/model/**
    - data/notion/**
    - data/evidence/**
    - data/practices/**
    - requirements*.txt
    - pyproject.toml
    - Dockerfile
    - docker-compose.yml
acceptance:
  - An authenticated user with a current assessment and active practice can create an append-only weekly plan for one exact stable action and one intended date inside the current seven-day window.
  - Replanning appends a contiguous immutable revision; identical retries are idempotent; stale epochs, cross-user objects, malformed snapshots, and concurrent conflicts fail closed without exposing private state.
  - The weekly surface shows only the latest verified Personal OS direction and priority stack, the existing context-ranked recommendations, the current practice, and one upcoming action; authored Personal OS text is not analyzed or copied into scoring, logs, URLs, or readiness output.
  - A weekly review derives its proof only from immutable submitted evidence events for the planned sprint and action after the plan was created and inside its seven-day window.
  - No-proof, supportive, mixed, contradictory, adverse, withheld, and completed evidence remain explicit. The weekly review creates no evidence event, score contribution, mastery claim, completion shortcut, recommendation factor, or pilot-feedback record.
  - Home, Personal OS, practice, weekly, and profile surfaces expose a concise loop without showing a 383-item checklist, adding coercive streak mechanics, or requiring private narrative.
  - The weekly contract is deterministically replayed, migration-forward/rollback tested, browser exercised at desktop/mobile/keyboard/zoom boundaries, and included in the isolated Compose backup/recreate/restore drill.
  - Editorial, semantic, source, accessibility, privacy, safety, specialist, psychometric, clinical, cultural, participant, longitudinal, and intervention-effectiveness review remain pending and are not represented as passed.
validation:
  local:
    - make m6h-weekly-check PYTHON=.venv/bin/python
    - make pilot-check PYTHON=.venv/bin/python
    - make curriculum-check PYTHON=.venv/bin/python
    - make competency-evidence-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - .venv/bin/python manage.py makemigrations --check --dry-run
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - exact weekly-window and stable action linkage
    - append-only idempotent revision and concurrent-write behavior
    - privacy-safe Personal OS integration and cross-user/epoch rejection
    - proof snapshot replay across no-proof supportive mixed contradictory adverse and withheld evidence
    - no scoring evidence ranking completion or mastery side effects
    - migration forward rollback and restored-state readiness
  required_ci:
    - Ruff Django pytest and migration-drift verification
    - all existing M6F readiness and report gates
    - M6H weekly execution readiness
    - Playwright core and weekly journeys
    - Compose runtime backup restore and weekly replay
risk:
  class: moderate
  hazards:
    - weekly planning silently becomes a second recommendation or scoring algorithm
    - a review treats intention completion or authored narrative as evidence
    - proof is attached across users assessment epochs sprints actions or time windows
    - mutable weekly state breaks replay or backup restore
    - private Personal OS text leaks outside its authenticated owner-facing surfaces
  stop_conditions:
    - any weekly write changes evidence score state assessment baseline recommendation order or practice completion
    - any proof snapshot cannot replay exactly from immutable submitted evidence
    - any user can reference another user's assessment sprint action plan or evidence
    - a failing required software gate is waived
rollback:
  strategy: Revert M6H-01, migrate its additive weekly tables backward, and retain all pre-existing Personal OS, context, practice, evidence, and score records byte-for-byte.
evidence:
  output:
    - docs/evidence/M6H-01-2026-08-27.md
    - exact local and hosted-CI command results for the candidate commit
  claim_boundary: Software-only weekly execution integration with deterministic persistence, proof replay, privacy isolation, browser, and deployment-regression evidence; never specialist, participant, psychometric, clinical, cultural, longitudinal, mastery, or intervention-effectiveness validation.
