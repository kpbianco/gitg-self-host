schema_version: 1
batch:
  id: M6I-02-APPLICABILITY-PERSONAL-COVERAGE
  title: Add explicit not-applicable routing and personal-applicable coverage
  goal: Let a person explicitly mark a recommended practice not applicable, receive an immediate distinct-alternative route, and inspect a separately labeled personal-applicable coverage denominator without changing canonical completion coverage or score history.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - products/gitg-self-host/acceptance.yaml#GG-SCORING-DISPOSITION
    - docs/PRODUCT_DECISIONS.md#decision-054--explicit-applicability-and-personal-coverage
  milestone: successor-to-M6I-01-COMPOSITE-CLOSEOUT-SCORING
  baseline_commit: d7b07e732cee34bffdb1e9c64520573e92d85414
dependencies:
  - M6I-01-COMPOSITE-CLOSEOUT-SCORING
scope:
  allowed_paths:
    - AGENTS.md
    - README.md
    - Makefile
    - MANIFEST.tsv
    - .github/workflows/**
    - contracts/**
    - data/practices/registries/source_registry.yaml
    - data/practices/release_manifest.yaml
    - growth/**
    - templates/**
    - static/**
    - scripts/**
    - tests/**
    - docs/**
    - reports/practice-content/**
  forbidden_paths:
    - data/assessment/**
    - data/curriculum/**
    - data/model/**
    - data/notion/**
    - data/practices/protocols/**
    - legacy/**
    - requirements*.txt
    - pyproject.toml
    - Dockerfile
    - docker-compose.yml
acceptance:
  - Decision 054 and ADR 0014 define GG-PERSONAL-APPLICABLE-COVERAGE-1.0 as a read-only assessment-epoch projection.
  - A recommended active practice exposes a direct authenticated CSRF-protected not-applicable action and an immediate route to a distinct alternative.
  - Not applicable creates or reuses an immutable verified PracticeContext revision; a later explicit context revision can make the practice applicable again.
  - The latest verified current-epoch not-applicable revision removes exactly its parent competency from only the personal-applicable denominator.
  - Unknown deferred and zero remain distinct from not applicable and do not alter the personal denominator.
  - Personal-applicable coverage averages existing completion credit over the included competencies; an empty denominator is unavailable rather than 100 percent.
  - Canonical completion coverage composite state hashes snapshots priorities historical score state and assessment baselines remain byte-for-byte unchanged by applicability input.
  - The ordinary UI shows canonical and personal-applicable coverage together with explicit denominator counts and never labels either as mastery.
  - Reassessment starts with a fresh personal denominator and cannot inherit prior-epoch applicability.
  - Invalid ownership scope revision snapshots or hashes fail the personal projection closed while leaving verified canonical coverage visible.
  - Existing private context export backup restore and deletion behavior remains unchanged and no remote telemetry is added.
  - ER-M6A-003 RG-M6A-002 M6B specialist acceptance and all deferred human review gates remain open.
validation:
  local:
    - .venv/bin/python manage.py makemigrations --check --dry-run
    - .venv/bin/python manage.py check
    - .venv/bin/python -m ruff check .
    - .venv/bin/python -m ruff format --check .
    - .venv/bin/pytest tests/test_applicability_coverage.py tests/test_personal_os_browser.py
    - make applicability-coverage-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - personal denominator math including excluded completed credit and empty-denominator behavior
    - direct not-applicable action alternative route reversibility and score-state immutability
    - assessment-epoch isolation unknown/deferred distinction and tamper fail-closed behavior
    - profile labeling accessibility CSRF privacy export and hosted browser journey
  required_ci:
    - Ruff Django pytest migration drift and manifest verification
    - applicability coverage deterministic readiness
    - Playwright direct not-applicable alternative and profile coverage journey
    - Compose migration replay backup restore and persistence drill
    - aggregate Pilot readiness gate
risk:
  class: high
  hazards:
    - a personal denominator is presented as canonical completion or mastery
    - not applicable awards credit or mutates persisted composite score state
    - unknown deferred or zero are silently treated as not applicable
    - applicability leaks across users or reassessment epochs
    - a corrupt context revision silently changes the projection
  stop_conditions:
    - canonical coverage state hash score snapshot recommendation mathematics or historical replay changes
    - a context input awards completion credit or closes a practice
    - a non-current-epoch or non-owned context changes the personal denominator
    - an empty personal denominator displays full coverage
    - a required local or hosted gate fails
rollback:
  strategy: Revert the read-only projection direct action and presentation as one batch; retain immutable PracticeContext revisions composite state evidence assessment and score history.
evidence:
  output:
    - docs/evidence/M6I-02-APPLICABILITY-PERSONAL-COVERAGE-<date>.md
    - exact local and hosted CI results
  claim_boundary: Deterministic owner-directed software and UX implementation only; no specialist psychometric clinical cultural accessibility-population privacy/safety participant longitudinal release deployment mastery or intervention-effectiveness acceptance.
