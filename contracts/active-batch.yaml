acceptance:
  - GG-PERSONAL-OS-1.0 defines exactly five identity sections named mission principles anti_goals twelve_month_direction and priority_stack plus exactly four audit prompts named current_truth autopilot_pattern misalignment_or_fragmentation and deliberate_next_step; it computes no alignment autopilot personality virtue worth or diagnostic score.
  - Every section has an explicit unknown not_applicable deferred or provided state. A non-provided state carries no hidden value; a provided scalar is nonempty and at most 500 characters; provided principles anti-goals and priority-stack values contain one to five ordered unique nonempty items of at most 160 characters each.
  - Prompt definitions and help text keep the audit descriptive and user-authored, ask for minimal private detail, avoid diagnosis destiny shame and moral ranking, and make clear that a reported mismatch is not evidence of failure or diminished worth.
  - One Personal OS revision is scoped to exactly one authenticated user and one immutable AssessmentRun. It does not derive values from answers orientations archetypes lever state evidence practice history or prior assessment epochs, and reassessment never silently carries a revision forward.
  - A pure builder rejects missing extra unknown-version over-bound wrong-type blank duplicate and hidden-value inputs before persistence and emits deterministic canonical UTF-8 JSON and SHA-256 for semantically identical ordered input. The snapshot contains the assessment epoch ID and private user-authored values but excludes user identity database record IDs timestamps assessment answers evidence scores and unrelated narrative.
  - Changed semantic input appends the next immutable contiguous revision; an unchanged retry returns the existing revision; direct save update bulk-update and delete cannot rewrite or remove an existing revision; a concurrent write either produces a valid contiguous result or an explicit retryable conflict without duplicates or partial data.
  - Migration 0009 is schema-only and reversible before later dependencies. It creates only the Personal OS foundation table constraints indexes and foreign keys and does not backfill seed reinterpret delete or rewrite any existing assessment context evidence score pilot-feedback sprint review or canonical-content row.
  - Mission principles anti-goals direction audit text and priority-stack order remain private reflection data only. They are not added to existing evidence or pilot-feedback exports logs generated reports fixtures telemetry recommendation inputs score snapshots or activation decisions in this batch; retained evidence records only synthetic values counts hashes and diagnostics.
  - The existing GG-CONTEXT-1.0 and GG-CONTEXT-READINESS-1.0 behavior remains exact. M6C-02 adds a deterministic read-only GG-PERSONAL-OS-READINESS-1.0 verifier that accepts an empty optional table and fails closed on version ownership epoch bounds field snapshot hash or revision drift without printing private values.
  - Existing assessment GG-EVIDENCE-1.0 typed-evidence competency-shadow score-state need-ranking pilot curriculum and competency-evidence outputs remain exact, recommendations and all ordinary UI remain unchanged, and friendship remains the only production score-active protocol.
  - No form route template browser collection workflow external service remote telemetry protocol package action context-priority formula alternative recommendation weekly execution behavior export deletion or retention policy is added; M6C-03 owns ranking and alternatives and M6C-04 owns the reviewed browser experience.
  - Focused contract model service migration concurrency privacy readiness and no-mutation tests pass together with the complete repository verification contract and required CI deployment regression gates.
  - M6B specialist governance remains pending and is not represented as accepted; automated software migration fixture browser or Compose results do not establish specialist accessibility cultural clinical psychometric longitudinal participant release deployment or production validation.
validation:
  local:
    - .venv/bin/python -m pytest tests/test_personal_os_models.py tests/test_personal_os_services.py tests/test_personal_os_readiness.py -q
    - make context-check PYTHON=.venv/bin/python
    - make personal-os-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - make e2e PYTHON=.venv/bin/python
    - make compose-smoke
    - git diff --check
  focused_tests_to_add:
    - exact five identity sections and four audit prompts with non-judgmental no-score definitions
    - explicit unknown N-A deferred and provided states with no hidden values
    - scalar list count item length ordering uniqueness blank wrong-type and snapshot-size boundaries
    - deterministic golden snapshot and hash with unknown-version missing-field and extra-field rejection
    - user ownership assessment-epoch isolation and no automatic reassessment carry-forward
    - append-only immutability idempotent retry contiguous revision and SQLite concurrent-write behavior
    - migration 0008 to 0009 to 0008 round trip with digest equality for every pre-existing growth row
    - readiness empty-state pass and fail-closed version ownership epoch bound field snapshot hash and revision diagnostics without private text output
    - no mutation of context assessment evidence score recommendation activation feedback practice review canonical data or existing minimized exports
  required_ci:
    - Ruff Django and pytest including focused Personal OS tests and migration drift
    - context readiness and Personal OS readiness on isolated migrated idempotently seeded state
    - pilot readiness
    - curriculum expansion readiness
    - competency evidence readiness
    - Playwright core journeys as unchanged-UI regression evidence
    - Docker Compose migration Personal OS readiness backup restore recreation and clean-shutdown drill
    - aggregate Pilot readiness gate
  manual:
    - Owner reviews and accepts the exact section names prompt wording bounds and non-judgmental identity language before merge.
    - Owner confirms that no real participant Personal OS text appears in committed fixtures retained evidence logs or generated reports.
    - Target pull request remains human-reviewed and is not merged by the implementation agent.
risk:
  class: high
  hazards:
    - the audit becomes a diagnostic shame or worth instrument instead of a bounded reflection
    - mission principles anti-goals or priority order become fixed identity destiny or hidden scoring inputs
    - private user-authored or third-party detail leaks through fixtures logs diagnostics exports reports or retained evidence
    - missing fields are normalized into invented identity or stale values carry across assessment epochs
    - concurrent SQLite writes create duplicate or skipped revisions
    - migration or rollback rewrites existing immutable context evidence or score history
    - foundation work accidentally absorbs M6C-03 ranking or M6C-04 browser scope
    - software checks are represented as M6B governance or participant specialist accessibility cultural clinical psychometric longitudinal deployment or production evidence
  stop_conditions:
    - exact audit prompts identity section semantics or bounds require an unresolved owner product decision
    - implementation requires inferred values opaque automated text analysis personality classification or any worth diagnostic alignment or autopilot score
    - a recommendation score activation protocol canonical-content form route template or ordinary-UI change is required
    - real participant text must enter a fixture log report export telemetry stream or retained repository evidence
    - existing assessment context evidence score pilot-feedback practice review or canonical rows would be backfilled rewritten reinterpreted or deleted
    - migration reversal cannot preserve every pre-existing row or a later migration already depends on 0009 without a reviewed rollback plan
    - append-only revision integrity cannot be made deterministic or explicitly conflict-safe on supported SQLite
    - a required change falls outside allowed paths or touches a forbidden path
    - M6B governance acceptance or expanded production score activation is asserted as a prerequisite or result
rollback:
  strategy: Revert M6C-02 and, only after a verified backup and explicit operator approval, migrate growth from 0009 back to 0008 before any later migration depends on 0009; this removes only M6C-02 Personal OS revisions and must preserve all M6C-01 and earlier rows, canonical data, evidence, score history, and friendship-only activation.
  data_migration: No forward data migration or backfill is permitted. Do not reverse a database containing participant Personal OS data or later dependent migrations without a separately reviewed retention and recovery decision.
  release_action: No release deployment score activation or participant-data deletion follows automatically from rollback or batch completion.
evidence:
  output:
    - docs/evidence/M6C-02-<date>.md
    - acceptance criterion and invariant mapping
    - exact changed-path audit and baseline commit
    - synthetic fixture hashes and readiness summaries without private values
    - migration forward reverse restoration row digests and backup prerequisite
    - focused concurrency immutability epoch isolation privacy and no-mutation results
    - exact local and CI commands results environment and retained artifact identifiers
    - manual gate decisions residual risks and every failed skipped or unperformed validation
  claim_boundary: Static schema migration unit integration synthetic-fixture deterministic-replay browser-regression and Compose evidence only when actually run; never physical hardware HIL field RT engine signing release deployment production specialist accessibility cultural clinical psychometric longitudinal participant or mastery validation.
