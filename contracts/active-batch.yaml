acceptance:
  - The implementation starts from exact target default-branch commit 5a120ddac38db68e0a529b5a687836d61bee4889, recognizes M6D-01 as merged at e8fcd168c391ee3c6c51cc53946af834eedbf378, and treats the later baseline commit as portfolio-harness synchronization only; stale target prose calling M6D-01 current or unmerged is corrected only in allowed governance, current-state, and handoff artifacts.
  - Exactly competency IDs 16.07, 18.07, 20.07, and 22.03 move from uncovered to individually authored draft packages under the exact protocol stable IDs, domains, families, recommendation-target subsets, and 4, 4, 3, and 4 action counts in scope.cohort; no fifth competency is authored, renamed, or substituted.
  - Every selected competency is uncovered at the baseline; the curriculum classifies 18.07 and 22.03 as role-conditional; every package parent and domain match canonical curriculum; each target lever is a non-empty subset of the full canonical parent mapping; all new source, gap, review, action, protocol, and activation IDs are unique and manifest-listed.
  - Every new package is RISK-MODERATE, inactive, editorial draft, runtime_projection none, SP-SHADOW-ONLY, scoring_status shadow_only, and ledgered score_active false with no approved production contract; friendship remains the only score-active protocol.
  - Each package links a new package-scoped pending specialist review plus ER-M6A-003 and a new open package-scoped research gap. Required specialist roles, questions, release effects, and blocking gates are recorded, but no completed role, review date, decision reference, source-complete status, or specialist conclusion is fabricated.
  - "The interventions are materially distinct: a consented low-stakes feedback exchange, a voluntary shared-responsibility agreement and revisability check, a recipient- or community-defined bounded contribution, and a role-authority/dependency audit with one reversible accountability redesign. Generic conversation prompts, noun substitution, cloned consent blocks, uniform action shapes, another person's compliance, and completion-only evidence fail review."
  - The feedback package requires a welcome low-stakes developmental conversation with a freely revocable invitation and a defined participant role; it excludes disciplinary, evaluative, complaint, abuse, retaliation, clinical, legal, safeguarding, compelled-disclosure, and unsafe power contexts. Declined or uncertain consent leads to private rehearsal, a neutral planning artifact, or an appropriate organizational/specialist path without deficit.
  - The shared-role/labor package is limited to one low-stakes, revisable responsibility among consenting adults who can safely disagree; it does not score fairness from another person's labor, agreement, emotion, or disclosure. Sex, reproduction, money, health, care of a dependent, housing security, legal rights, abuse, coercive control, and material dependency use defer, private own-contribution review, or qualified support instead of direct negotiation.
  - The helping-without-paternalism package requires a welcome request or community-defined need, a bounded offer, an explicit right to decline or revise, and a clean exit. It excludes emergencies, medical/legal/financial advice, minors or vulnerable-person safeguarding, surveillance, eligibility decisions, proselytizing, quid-pro-quo help, coercive charity, and claims that the user's action improved another person's safety, capacity, gratitude, or dependence.
  - The ethical-power package is applicable only when the user holds a legitimate, bounded, low-stakes role with a reversible action inside their authority. It inventories formal and informal influence, dependency, affected-party voice, conflict of interest, recourse, and accountability without naming people. Hiring, firing, pay, discipline, grading, clinical or caregiving authority, housing, immigration, policing, complaints, protected disclosure, abuse response, emergency action, and likely retaliation require N/A, defer, policy/ombuds review, or qualified support.
  - All packages make consent state, role authority, power asymmetry, refusal, N/A, defer, pause, stop, escalation, and useful alternatives first-class. Consent cannot be inferred from silence, participation under authority, prior agreement, a role label, or completion, and withdrawing consent or declining a path never creates adverse competency evidence or a deficit.
  - Claim-level sources enter the source registry with authorship or issuing body, date, locator, source class, evidence strength, supported claim, limitations, applicability, retrieval date, and quotation constraints. Use primary research, systematic reviews, official guidance, professional standards, or authoritative participatory/community sources; snippets and generated prose are not sources, and source discovery remains incomplete pending trained and specialist review.
  - The existing practice-content schema, source-only typed-rule loader, GG-TYPED-EVIDENCE-1.0 evaluator, and historical practice-observation-v1 path remain unchanged. Every action uses typed-evidence-rules-v1 with exact sibling protocol, action, competency, and SP-SHADOW-ONLY identities; no mixed or new rule version, evaluator feature, schema relaxation, ORM projection, or runtime field is added.
  - Typed rules use only explicit structured observations and allowlisted criteria. Where consented-observer or attestation provenance is used, the fixture records only an allowlisted attestation ID and explicit consent Boolean; it stores no observer or third-party identity, words, feedback content, relationship label, protected characteristic, allegation, sensitive narrative, artifact contents, sentiment, or covert proxy for agreement or compliance.
  - Fifteen conspicuously synthetic action fixtures replay every new action and cover supportive, mixed, contradictory, inconclusive, unknown, not-observed, N/A, deferred, adverse, stale, repeated, duplicate-origin, role-inapplicable, consent-declined, and unconsented-attestation paths. They preserve context/epoch scope, provenance, recency, repetition, withholding, deterministic hashes, and duplicate-event rejection while keeping protocol performance separate from direct competency contribution.
  - All new typed results remain pure fixture/shadow evidence. No typed event is persisted; no legacy event is rewritten; no LeverBaseline, LeverState, ScoreSnapshot, context, Personal OS, recommendation, sprint, review, participant, or activation record is written; and no new package appears in the ORM runtime or ordinary browser cohort.
  - Deterministic reports show exactly 383 competencies, 13 canonical packages, 44 source actions, 370 uncovered competencies, 12 domains with authored packages, 27 parent-mapped levers, 13 recommendation-target levers, 7 low-risk and 6 moderate-risk packages, 12 SP-SHADOW-ONLY packages, 0 high-risk packages, 0 release candidates, 0 source-complete packages, 5 runtime protocols, 15 runtime actions, and 1 score-active protocol.
  - Originality output contains no exact duplicate action title, instruction, reflection set, evidence-rule payload, consent block, safety block, alternative path, or role-condition block introduced by this cohort. Every near-duplicate and structural warning is retained for final consolidated human disposition; lexical checks are not semantic, consent, cultural, accessibility, power, or specialist review.
  - Existing GG-M6D-01-AUTHORING-READINESS-1.0 remains byte- and behavior-compatible at the advanced catalog frontier. A new read-only GG-M6D-02-AUTHORING-READINESS-1.0 verifies the exact cohort, mappings, package and fixture hashes, pending package-scoped specialist reviews, open gaps, inactive ledger entries, deterministic reports, prerequisite readiness, and zero database writes.
  - The frozen runtime projection hash 274f7244630ed56d56a443a6a699399edade6c67fcf964237559e05b72368e35, five projected legacy package bytes, the four M6D-01 package and fixture bytes, historical v1 evidence and score replay, M6C behavior, existing exports, current recommendations, five seeded protocols, fifteen seeded actions, and friendship-only activation remain exact.
  - "M6B governance remains unaccepted: ER-M6A-003 is pending, RG-M6A-002 is open, Decisions 047 through 049 remain proposed, and all four new package reviews remain pending. No package, source, schema, fixture, report, browser, hosted-CI, or Compose result is represented as semantic approval, consent validation, power-safety review, specialist acceptance, accessibility-population, cultural, clinical, psychometric, longitudinal, participant, mastery, release, deployment, or production evidence."
  - Focused tests, report freshness, both M6D authoring gates, all prerequisite readiness contracts, the complete repository verification contract, unchanged browser journeys, Compose backup/restore/recreation, and required hosted CI pass on the exact candidate commit before merge; retained evidence records every warning and all trained-reviewer and owner dispositions as deferred until the final 383/383 M6B-GOV gate.
