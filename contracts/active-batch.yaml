    - Until the final gate, semantic, originality, accessibility, privacy, consent, role/power safety, source, retained-evidence, specialist, and owner review are recorded as deferred rather than passed.
    - Runtime projection, score activation, participant exposure, release, deployment, production writes, and specialist or validation claims always require separate human approval.
    - Standing owner authorization permits PFSPAM to mark ready and merge this exact source-only cohort only after exact-head required CI succeeds, no unresolved review thread remains, and every inactive, unprojected, score-inactive boundary stays exact.
risk:
  class: high
  hazards:
    - consent language becomes a checkbox that ignores role pressure, dependency, coercion, retaliation, or the right to withdraw
    - feedback, shared labor, helping, or authority practices reward compliance, emotional disclosure, gratitude, agreement, productivity, obedience, or another person's behavior
    - moderate-risk boundaries omit abuse, discrimination, safeguarding, legal, employment, clinical, caregiving, housing, financial, or emergency escalation paths
    - role-conditional content treats having no qualifying relationship, community role, or authority as a deficit
    - artifacts, observer identity, third-party narrative, allegations, protected data, or relationship details enter fixtures, reports, hashes, logs, or evidence inputs
    - pending specialist records or source discovery are overstated as consent, safety, cultural, accessibility, effectiveness, or release review
    - relational typed rules leak into runtime, create a second evidence path, or double count protocol performance and competency contribution
    - catalog expansion changes M6D-01 evidence, legacy hashes, runtime recommendations, historical replay, or friendship-only activation
  stop_conditions:
    - the target checkout does not resolve exactly to 5a120ddac38db68e0a529b5a687836d61bee4889 before implementation
    - any selected competency is no longer uncovered or its canonical identity, domain, role classification, or parent mapping differs from scope.cohort
    - an intervention cannot remain RISK-MODERATE after actual role, power, dependency, consent, exclusion, and foreseeable-consequence review
    - source support is insufficient for a material claim and the claim cannot be narrowed to an explicitly limited product-design judgment with an open gap
    - direct use cannot provide a voluntary refusal and safe alternative without recording a deficit or encouraging unsafe confrontation, negotiation, helping, disclosure, or exercise of authority
    - any evidence design requires another person's compliance, outcome, emotion, gratitude, disclosure, labor, identity, exact words, sensitive narrative, artifact contents, implicit consent, hidden polarity, completion-equals-competence, or lever-to-competency feedback
    - implementation requires changing the practice-content schema, GG-TYPED-EVIDENCE-1.0, practice-observation-v1, historical snapshots, ORM persistence, forms, views, templates, or the five-protocol runtime projection
    - any package-scoped review is marked complete without the named qualified roles, completed date, retained decision reference, and owner-accepted disposition
    - the legacy projection, M6D-01 package or fixture bytes, historical replay, no-context or context-aware recommendation behavior, five seeded protocols, fifteen seeded actions, or friendship-only score activation cannot remain exact
    - a required implementation change falls outside allowed paths or touches a forbidden path
    - an exact duplicate or deterministic originality, consent, privacy, safety, source-record, mapping, schema, forbidden-claim, pending-review, or retained-warning-inventory gate fails; non-machine-verifiable concerns remain explicit for final review
    - focused or full deterministic validation, report freshness, required hosted CI, Playwright regression, Compose recovery, aggregate Pilot readiness, M6D-01 readiness, or M6D-02 readiness fails on the candidate commit
    - M6B governance acceptance, specialist review completion, source completeness, score eligibility, participant release, deployment, or a higher evidence level is asserted without its separate retained decision
rollback:
  strategy: Revert the four M6D-02 packages, their pending review, open gap, source, inactive activation, and manifest entries, the fifteen synthetic fixtures, additive M6D-02 report/readiness/test/verification wiring, regenerated reports, documentation, evidence, and manifest as one batch; regenerate reports from the restored nine-package M6D-01 catalog and rerun both the permanent M6D-01 gate and the frozen runtime and historical replay checks.
  data_migration: None. The batch may not add an ORM migration, persist typed evidence, seed the four source-only packages, or rewrite participant, assessment, context, Personal OS, practice, evidence, score, feedback, sprint, or review data.
  release_action: PFSPAM may merge the exact source-only target PR after all required CI succeeds and the merge head is unchanged. No release, deployment, runtime projection, score activation, participant-data write, production change, specialist acceptance, or validation claim follows from that merge.
evidence:
  output:
    - docs/evidence/M6D-02-<date>.md
    - exact baseline cohort protocol action family role-classification mapping target-lever and changed-path audit
    - before-after canonical and runtime counts hashes release manifest source registry expert review queue research gaps activation ledger and generated report digests
    - claim-to-source mapping retrieval metadata limitations open research gaps named specialist roles and explicit deferred-review status
    - per-protocol typed rule and fifteen-case synthetic fixture hashes plus consent role N-A defer alternative supportive mixed contradictory inconclusive adverse repetition recency and withholding results
    - privacy audit proving no observer identity third-party words sensitive narrative artifact contents compliance or other-person outcome enters typed inputs reports logs or retained evidence
    - legacy projection M6D-01 package-and-fixture historical replay recommendation M6C no-mutation and friendship-only activation comparisons
    - originality duplicate near-duplicate structural consent safety alternative role-condition warning and final-review inventory output
    - M6D-01 M6D-02 and prerequisite readiness summaries with database before-after digests and write-query audit
    - exact local and CI commands results environment candidate commit and every failed skipped unavailable or unperformed validation
    - deferred owner trained-reviewer and specialist gate status residual risks and explicit non-validation claims
  claim_boundary: Individually authored draft content, static schema validation, source classification, pending-review governance, unit/integration, synthetic typed-fixture, deterministic shadow replay, browser-regression, and isolated Compose deployment-drill evidence only when actually run; never physical hardware HIL field RT engine signing release production consent-validity intervention-effectiveness recommendation-usefulness specialist accessibility-population cultural clinical psychometric longitudinal participant or mastery validation.
