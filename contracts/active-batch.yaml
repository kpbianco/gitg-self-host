    - make curriculum-check PYTHON=.venv/bin/python
    - make competency-evidence-check PYTHON=.venv/bin/python
    - make m6d-01-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - make e2e PYTHON=.venv/bin/python
    - make compose-smoke
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - exact four-competency cohort, protocol IDs, domains, families, action counts, parent mappings, target subsets, display orders, and manifest coverage
    - schema and loader dispatch for source-only typed rules with mixed-version, unknown-version, malformed-rule, identity-mismatch, and attempted-runtime-projection rejection
    - exact per-protocol typed rule replay for behavioral, artifact, skill-rehearsal, and audit/redesign evidence without free text, artifact contents, observer identity, or implicit polarity
    - supportive mixed contradictory inconclusive unknown not-observed N-A deferred adverse stale repeated and duplicate-origin fixture outcomes with deterministic materialized hashes
    - draft low-risk governance, open source/review gaps, inactive ledger entries, zero typed persistence, zero new score activation, and release-candidate fail-closed behavior
    - exact 9-package 29-source-action 374-uncovered report counts plus frozen 5-protocol 15-runtime-action projection and friendship-only activation
    - originality detection and reviewed disposition for duplicate action, reflection, evidence-rule, safety, duration, and action-shape candidates
    - M6D-01 readiness deterministic JSON, tamper diagnostics, catalog/runtime distinction, prerequisite readiness preservation, and no database writes
    - legacy practice-observation-v1 fixtures, evidence replay, score state, recommendations, M6C context and Personal OS, existing exports, and five package files remain exact
  required_ci:
    - Ruff Django pytest and migration-drift confirmation including focused M6D-01 schema content fixture report and readiness tests
    - practice report freshness and exact cohort coverage
    - pilot readiness with the unchanged five-protocol runtime
    - curriculum expansion readiness with nine source packages and the frozen five-protocol projection
    - competency evidence readiness with four source-only typed packages and zero typed runtime or production activation
    - context Personal OS context-priority and M6C pilot readiness regression gates
    - M6D-01 authoring readiness on isolated migrated idempotently seeded state
    - Playwright core and M6C journeys as unchanged-runtime browser regression evidence
    - Docker Compose migration seed all prerequisite and M6D readiness contracts evidence replay recreation backup restore and clean-shutdown drill
    - aggregate Pilot readiness gate
  manual:
    - Owner reviews and accepts the exact four competency and protocol stable IDs, family assignments, target-lever subsets, intervention boundaries, and source-only inactive disposition.
    - A trained content reviewer records semantic, originality, accessibility, privacy, and low-risk safety disposition for every package and every automated similarity warning; no specialist completion is inferred.
    - Owner reviews source classifications, claim fit, limitations, retrieval metadata, and unresolved research gaps without treating discovery or citation as intervention validation.
    - Owner reviews required CI and retained synthetic evidence for the exact candidate commit; the target pull request remains human-reviewed and is not marked ready or merged by the implementation agent.
risk:
  class: high
  hazards:
    - polished but generic packages multiply noun-swapped actions, prompts, or evidence rules
    - low-risk labeling hides disability, fatigue, productivity-pressure, privacy, household-hazard, or high-consequence skill contexts
    - outcome knowledge rewrites a decision artifact or artifact prose and completion are treated as proof
    - typed source rules leak into the frozen runtime or are mislabeled as persisted production evidence
    - protocol performance and direct competency evidence are double counted or projected through recommendation targets instead of the complete parent mapping
    - source discovery is overstated as source completeness, specialist review, effectiveness, or validation
    - hard-coded M6A counts are loosened so far that missing or extra packages no longer fail closed
    - content expansion changes legacy hashes, runtime recommendations, historical replay, or friendship-only activation
  stop_conditions:
    - the target checkout does not resolve exactly to a1bc79218a9397dcdbf699a1422c6f2881033675 before implementation
    - any selected competency is no longer uncovered or its canonical identity, domain, or parent mapping differs from scope.cohort
    - a package cannot remain RISK-LOW after its actual intervention, exclusions, and foreseeable consequences are reviewed
    - source support is insufficient for a material claim and the claim cannot be narrowed to an explicitly limited product-design judgment
    - typed rules require changing GG-TYPED-EVIDENCE-1.0, practice-observation-v1, historical snapshots, ORM persistence, forms, views, templates, or the five-protocol runtime projection
    - any evidence design requires free-text analysis, artifact contents, sensitive third-party detail, observer identity, implicit polarity, completion-equals-competence, or lever-to-competency feedback
    - the exact legacy projection, historical replay, no-context or context-aware recommendation behavior, five seeded protocols, fifteen seeded actions, or friendship-only score activation cannot remain exact
    - a required implementation change falls outside allowed paths or touches a forbidden path
    - an unreviewed exact duplicate or material originality, accessibility, privacy, source, safety, mapping, or schema defect remains in the cohort
    - focused or full deterministic validation, report freshness, required hosted CI, Playwright regression, Compose recovery, aggregate Pilot readiness, or M6D-01 readiness fails on the candidate commit
    - M6B governance acceptance, source completeness, score eligibility, participant release, deployment, or a higher evidence level is asserted without its separate retained decision
rollback:
  strategy: Revert the four packages, their inactive activation and source/gap entries, additive typed-package schema/loader branch, fixtures, cohort readiness, reports, documentation, evidence, manifest, and verification wiring as one batch; regenerate all deterministic reports from the restored five-package canonical release and verify the frozen runtime and historical replay hashes.
  data_migration: None. The batch may not add an ORM migration, persist typed evidence, seed the four source-only packages, or rewrite participant, assessment, context, Personal OS, practice, evidence, score, feedback, sprint, or review data.
  release_action: No merge, release, deployment, score activation, participant-data write, or production change follows automatically from implementation completion or rollback.
evidence:
  output:
    - docs/evidence/M6D-01-<date>.md
    - exact baseline cohort protocol action family mapping target-lever and changed-path audit
    - before-after canonical and runtime counts hashes release manifest source registry activation ledger and generated report digests
    - claim-to-source mapping retrieval metadata limitations open research gaps and manual review dispositions
    - per-protocol typed rule and synthetic fixture hashes plus supportive mixed contradictory inconclusive neutral adverse repetition recency and withholding results
    - legacy projection historical replay recommendation M6C no-mutation and friendship-only activation comparisons
    - originality duplicate near-duplicate structural warning and human disposition output
    - M6D-01 and prerequisite readiness summaries with database before-after digests
    - exact local and CI commands results environment candidate commit and every failed skipped unavailable or unperformed validation
    - owner and trained-reviewer manual gate decisions residual risks and explicit non-validation claims
  claim_boundary: Individually authored draft content, static schema, source classification, unit/integration, synthetic typed-fixture, deterministic shadow replay, browser-regression, and isolated Compose deployment-drill evidence only when actually run; never physical hardware HIL field RT engine signing release production intervention-effectiveness recommendation-usefulness specialist accessibility-population cultural clinical psychometric longitudinal participant or mastery validation.
