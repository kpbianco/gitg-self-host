acceptance:
  - GG-CONTEXT-PRIORITY-1.0 is a pure immutable Decimal contract over one explicit assessment epoch, the existing GG-NEED-RANKING-1.0 protocol base priorities, the latest verified GG-CONTEXT-1.0 assessment revision, and exactly one latest verified context revision for each supplied active canonical protocol; mapping order and database query order cannot change its output.
  - The engine validates stable IDs, one user-owned assessment epoch, active manifest-projected protocols, canonical parent weights and recommendation-target subsets, supported contract versions, snapshot hashes, contiguous/latest revisions, finite bounded need and context values, and unique candidate IDs before producing a result; malformed stale cross-user cross-epoch inactive or noncanonical input fails closed.
  - A candidate is eligible only when its disposition is considering and applicability importance readiness urgency opportunity_resources and burden are all explicitly provided; applicability in not_applicable state yields the distinct not_applicable disposition, any deferred factor and deferred candidate disposition yield deferred, and any required unknown or other non-provided state yields missing_context rather than a numeric default.
  - Assessment capacity must be explicitly provided before any context-aware priority is numeric. Season is retained as descriptive context but has no ordering or numeric effect. Missing or non-provided capacity yields missing_context for the ranking result and never falls back to an invented neutral or favorable value.
  - For an eligible candidate, every ordinal x is normalized exactly as Decimal x divided by 4, burden is inverted exactly as 1 minus burden divided by 4, and context priority is quantized half-up to four places from base_priority multiplied by applicability importance readiness urgency opportunity_resources capacity and inverse burden. An explicitly supplied zero may produce zero priority; no floor offset imputation rescaling learned weight personality modifier or free-text analysis is permitted.
  - Eligible candidates sort by descending context priority, then descending unchanged GG-NEED-RANKING-1.0 base priority, then stable protocol ID. Deferred not_applicable and missing_context candidates are withheld from the ranked recommendation set and never sort as zero-valued deficits.
  - A primary recommendation is the first eligible candidate. An alternative request names one supplied candidate and a reason of not_applicable or deferred; it returns the highest-ranked distinct eligible candidate plus the source disposition and explanation codes, or an explicit no_eligible_alternative result. It never silently returns the withheld candidate, fabricates context, authors a protocol, or mutates a need, score, evidence event, sprint, completion, or defer record.
  - The result includes the algorithm and dependency versions, assessment epoch stable ID, ordered candidate stable IDs, base and context priorities, factor-state and contribution breakdowns, disposition and explanation codes, alternative source and target stable IDs, exact input context hashes, canonical compact UTF-8 JSON, and SHA-256. It excludes user identity, database record IDs, timestamps, Personal OS or audit text, assessment answers, free text, private narrative, evidence payloads, and unrelated participant data.
  - Personal OS mission principles anti-goals twelve-month direction priority-stack items and Truth/Autopilot Audit responses never enter eligibility priority alternatives tie-breaking hashes diagnostics fixtures retained evidence or logs. Orientation archetype and personality likewise have no numeric or eligibility effect; ties use the stable protocol ID in this batch and later UI may use reviewed framing without changing rank.
  - Existing build_profile_summary and every ordinary form route view template and browser recommendation remain exactly GG-NEED-RANKING-1.0 behavior in M6C-03. The new service is an explicit backend result for M6C-04 to consume; an empty context state continues to pass existing readiness and cannot be represented as context-aware output.
  - GG-CONTEXT-PRIORITY-READINESS-1.0 is deterministic and read-only. It replays a committed synthetic golden cohort, verifies the actual five-protocol canonical mapping and friendship-only activation boundary, accepts an empty optional runtime context store, and fails closed on persisted context/version/hash/scope/revision drift without printing private values or snapshots.
  - M6C-03 adds no model migration persistence backfill browser collection recommendation display protocol package action canonical report export deletion retention telemetry score-state write or activation entry. Existing context Personal OS assessment evidence typed-evidence competency-shadow score-state pilot curriculum and recommendation replay remain exact.
  - Focused formula eligibility ordering alternative epoch privacy hashing and no-mutation tests pass together with the complete deterministic repository verification contract and required CI browser and Compose regression gates.
  - M6B specialist governance remains pending and is not represented as accepted. Static unit integration synthetic-fixture replay browser or Compose results do not establish recommendation usefulness participant accessibility cultural safety clinical psychometric longitudinal release deployment production or mastery validation.
validation:
  local:
    - .venv/bin/python -m pytest tests/test_context_priority.py tests/test_context_priority_readiness.py -q
    - make context-check PYTHON=.venv/bin/python
    - make personal-os-check PYTHON=.venv/bin/python
    - make context-priority-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - make e2e PYTHON=.venv/bin/python
    - make compose-smoke
    - git diff --check
  focused_tests_to_add:
    - exact Decimal normalization multiplicative formula half-up quantization bounds and stable tie-breaks
    - unknown N-A deferred missing-context and explicit-zero dispositions remain distinct with no hidden defaults
    - complete and partial candidate cohorts plus missing capacity fail-closed behavior
    - deterministic primary and distinct alternative selection after N-A and defer including no-eligible-alternative
    - canonical snapshot hash mapping-order and database-order independence with fixed golden fixture
    - latest-revision user ownership assessment-epoch active-protocol canonical-mapping and stale-hash rejection
    - explanation allowlist and sanitized error chains exclude Personal OS text private narrative user and database identifiers
    - existing no-context profile recommendations priorities exports context Personal OS evidence score state and friendship-only activation remain byte-for-byte or value-for-value unchanged
    - readiness empty-state pass actual five-protocol catalog replay tamper diagnostics and no database writes
  required_ci:
    - Ruff Django and pytest including focused context-priority tests and migration-drift confirmation
    - pilot readiness
    - curriculum expansion readiness
    - competency evidence readiness
    - context readiness
    - Personal OS readiness
    - context-priority readiness on isolated migrated idempotently seeded state
    - Playwright core journeys as unchanged-browser regression evidence
    - Docker Compose migration seed evidence score and all six readiness replays backup restore recreation and clean-shutdown drill
    - aggregate Pilot readiness gate
  manual:
    - Owner reviews and accepts the exact multiplicative formula factor direction eligibility dispositions explanation codes and stable-ID tie-break before merge.
    - Owner confirms that synthetic fixtures retained evidence and diagnostics contain no real participant context or Personal OS values.
    - Owner reviews required CI and retained browser diagnostics, and the target pull request remains human-reviewed and is not merged by the implementation agent.
risk:
  class: high
  hazards:
    - ordinal storage scales acquire opaque or unintended moral developmental or psychometric meaning
    - unknown N-A or defer is coerced to zero or another hidden default and changes priority
    - multiplicative factors create false precision or overstate recommendation fit
    - a deferred or unsuitable candidate leaks back as its own alternative
    - stale cross-user or cross-epoch context influences a recommendation
    - private context or Personal OS text leaks through explanations hashes fixtures diagnostics logs or retained evidence
    - the new engine silently replaces the reviewed legacy profile path before browser collection and explanation are ready
    - recommendation work mutates score state evidence canonical content or friendship-only activation
    - software fixtures are represented as recommendation usefulness specialist participant release deployment or production evidence
  stop_conditions:
    - owner review rejects or leaves unresolved the exact formula factor direction eligibility or alternative semantics
    - implementation requires imputing a missing factor analyzing Personal OS or other free text or using personality as a numeric multiplier
    - deterministic alternatives require a new or materially changed protocol package source risk safety or activation decision
    - the existing GG-NEED-RANKING-1.0 algorithm or no-context profile recommendation output cannot remain exact
    - persisted context cannot be verified and isolated to its authenticated user assessment epoch and latest contiguous revision without exposing private values
    - a model migration persistence backfill ordinary UI export deletion retention telemetry score-state or production-activation change becomes necessary
    - any assessment evidence score snapshot canonical content activation or historical replay would be rewritten reinterpreted or deleted
    - a required change falls outside allowed paths or touches a forbidden path
    - M6B governance acceptance expanded production scoring recommendation usefulness or a higher validation level is asserted as a prerequisite or result
rollback:
  strategy: Revert the M6C-03 code documentation verification and manifest changes. Because the batch adds no migration or persisted priority record, rollback restores the untouched GG-NEED-RANKING-1.0 path and discards only reproducible synthetic priority outputs; preserve all M6C-01 context and M6C-02 Personal OS revisions.
  data_migration: None. Do not delete or rewrite context Personal OS assessment evidence score pilot or canonical-content data during rollback.
  release_action: No release deployment score activation participant-data write or production change follows automatically from implementation completion or rollback.
evidence:
  output:
    - docs/evidence/M6C-03-<date>.md
    - acceptance criterion invariant and exact formula mapping
    - exact changed-path audit and baseline commit
    - synthetic golden cohort canonical snapshot hash and sanitized readiness summary
    - focused disposition alternative ordering epoch privacy no-mutation and legacy-compatibility results
    - preserved canonical release projection activation and pre-M6C-03 replay hashes
    - exact local and CI commands results environment and retained artifact identifiers
    - manual gate decisions residual risks and every failed skipped unavailable or unperformed validation
  claim_boundary: Static unit integration synthetic-fixture deterministic-replay browser-regression and Compose evidence only when actually run; never physical hardware HIL field RT engine signing release deployment production recommendation-usefulness specialist accessibility cultural safety clinical psychometric longitudinal participant or mastery validation.
