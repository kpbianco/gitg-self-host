schema_version: 1
batch:
  id: M6H-02
  title: Harden owner data lifecycle and upgrade operations
  goal: Add deterministic owner export, explicit deletion and retention controls, and verified backup restore upgrade rollback operations without changing curriculum evidence scoring recommendation completion or mastery semantics.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - products/gitg-self-host/acceptance.yaml#GG-OPERATIONS
    - owner-direction-2026-08-31
  milestone: products/gitg-self-host/roadmap.yaml#M6H
  baseline_commit: 85eb9e4da0a34704ddb194c1fca7b32317cd9fb8
dependencies:
  - M6H-01
scope:
  allowed_paths:
    - AGENTS.md
    - README.md
    - Makefile
    - MANIFEST.tsv
    - .env.example
    - .github/workflows/**
    - contracts/**
    - growth/**
    - templates/**
    - scripts/**
    - tests/**
    - docs/**
    - Dockerfile
    - docker-compose.yml
    - docker-entrypoint.sh
  forbidden_paths:
    - data/assessment/**
    - data/curriculum/**
    - data/model/**
    - data/notion/**
    - data/evidence/**
    - data/practices/**
    - requirements*.txt
    - pyproject.toml
acceptance:
  - An authenticated owner can download one versioned deterministic archive of all and only that user-owned assessment profile context Personal OS practice check-in evidence score pilot-feedback and weekly-execution records.
  - The owner archive excludes password hashes secrets session data other users internal database keys and undeclared server metadata; private narrative is included only in the explicitly labeled owner-private payload and never in minimized sharing exports logs URLs or readiness output.
  - Account deletion has authenticated preview explicit irreversible confirmation and transactional execution; it removes exactly the selected user and every user-owned record while preserving canonical seeded content other users migrations and deployment state.
  - Deletion and retention surfaces explain that existing backup copies are separate private artifacts and are not silently rewritten or claimed erased.
  - Retention policy is explicit versioned disabled by default and previewable before application; no hidden timer mutates append-only evidence score context Personal OS weekly or review history.
  - Pre-upgrade backup integrity migration health readiness rollback and restored-state verification are deterministic and exercised through an isolated Compose drill.
  - Backup restore and upgrade replay preserve exact assessment baselines evidence snapshots score hashes Personal OS and context hashes and M6H-01 weekly plan and proof-review hashes.
  - Export deletion retention backup restore and upgrade operations do not change recommendation order evidence eligibility score mathematics activation practice completion archetypes orientations mastery or human-worth boundaries.
  - Desktop mobile keyboard and zoom browser journeys cover owner data management without exposing the 383-item catalog or private values to another user.
  - Editorial specialist participant release deployment psychometric clinical cultural longitudinal and intervention-effectiveness review remain pending and are not represented as passed.
validation:
  local:
    - make m6h-operations-check PYTHON=.venv/bin/python
    - make m6h-weekly-check PYTHON=.venv/bin/python
    - make pilot-check PYTHON=.venv/bin/python
    - make curriculum-check PYTHON=.venv/bin/python
    - make competency-evidence-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - ./scripts/agent-verify.sh full
    - .venv/bin/python manage.py makemigrations --check --dry-run
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - complete same-user owner archive and cross-user privacy isolation
    - export version dispatch determinism private versus minimized field allowlists and hash replay
    - deletion preview explicit confirmation atomic rollback canonical preservation and cross-user preservation
    - disabled-by-default retention preview application and immutable-history boundaries
    - pre-upgrade backup integrity forward migration health readiness rollback and exact restored-state replay
    - browser desktop mobile keyboard zoom and authorization boundaries
  required_ci:
    - Ruff Django pytest migration drift and manifest verification
    - all M6F and M6H-01 readiness and replay gates
    - M6H-02 isolated operations readiness
    - Playwright owner data-management journeys
    - Compose pre-upgrade backup restore rollback and persistence drill
    - aggregate Pilot readiness gate
risk:
  class: critical
  hazards:
    - deletion targets the wrong user or canonical content
    - an export leaks credentials internal identifiers another user or private values into a minimized payload
    - retention silently rewrites append-only evidence or score history
    - upgrade failure leaves the SQLite database or backup unrecoverable
    - restored data passes health checks but fails deterministic replay
  stop_conditions:
    - any destructive operation lacks exact target preview and explicit confirmation
    - another user's record or canonical seeded content changes
    - an owner-private value appears in logs URLs readiness or minimized export
    - backup integrity rollback or restored-state replay cannot be proven
    - any existing scoring evidence recommendation completion or mastery invariant changes
    - a failing required gate is waived
rollback:
  strategy: Revert M6H-02 code and migrations, restore the verified pre-upgrade database backup, and rerun the complete readiness and replay chain before reopening access.
evidence:
  output:
    - docs/evidence/M6H-02-<date>.md
    - exact export field inventories and privacy allowlists
    - deletion and retention preview and rollback results
    - pre-upgrade backup restore migration rollback and replay results
    - desktop and mobile artifact review
    - exact local and hosted CI results
  claim_boundary: Deterministic private-instance owner data lifecycle and upgrade operations only; never specialist participant release deployment psychometric clinical cultural longitudinal mastery or intervention-effectiveness validation.
