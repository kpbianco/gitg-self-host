schema_version: 1
batch:
  id: M6I-05-ASSESSMENT-CALIBRATION-ANALYSIS-READINESS
  title: Add privacy-safe offline calibration analysis readiness
  goal: Validate an M6I-04 consented export and produce a deterministic aggregate sufficiency packet without retaining participant rows or converting software thresholds into validation claims.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - products/gitg-self-host/acceptance.yaml#GG-VALIDATION
    - docs/PRODUCT_DECISIONS.md#decision-055--assessment-calibration-readiness-is-not-validation
    - docs/architecture/0017-private-aggregate-assessment-calibration-analysis.md
    - contracts/assessment-calibration-analysis.yaml
  milestone: successor-to-M6I-04-CONSENTED-ASSESSMENT-CALIBRATION-DATA
  baseline_commit: d2b326e1760f1904487369623bf51dc37b89c426
dependencies:
  - M6I-04-CONSENTED-ASSESSMENT-CALIBRATION-DATA
scope:
  allowed_paths:
    - AGENTS.md
    - README.md
    - Makefile
    - MANIFEST.tsv
    - .github/workflows/**
    - contracts/**
    - docs/**
    - growth/management/commands/analyze_assessment_calibration_dataset.py
    - growth/management/commands/verify_assessment_calibration_analysis.py
    - growth/services/assessment_calibration_analysis.py
    - scripts/verify_assessment_calibration_analysis.sh
    - scripts/verify_compose.sh
    - tests/test_assessment_calibration_analysis.py
    - tests/test_deployment_contract.py
  forbidden_paths:
    - data/**
    - growth/models.py
    - growth/migrations/**
    - growth/static/**
    - growth/templates/**
    - templates/**
    - requirements*.txt
    - pyproject.toml
    - Dockerfile
    - docker-compose.yml
acceptance:
  - ADR 0017 and GG-ASSESSMENT-CALIBRATION-ANALYSIS-READINESS-1.0 define a local operator analysis-readiness aid not a participant evidence or validation result.
  - Input is exactly grounded-growth-assessment-calibration-export-v1 with a verified dataset hash consent/disclosure versions privacy metadata counts participant pseudonyms run sequences intervals sources responses timing and quality allowlists.
  - Unknown missing extra malformed duplicate-key mis-sequenced or hash-drifted input fails closed with no output and without printing a participant reference response timing or other sensitive value.
  - Output contains only exact cohort/source totals suppressed aggregate item distributions timing summaries response-quality summaries exploratory retest summaries and per-axis sufficiency reasons.
  - Participant references participant-level rows raw responses raw timing exact timestamps identity share codes free text Personal OS context practice evidence completion score and derived outputs are absent.
  - Nonzero cells below five are suppressed. Descriptive and linked-retest software thresholds are fixed at thirty participants and are never represented as validation thresholds.
  - Linked retest summaries are exploratory consecutive-pair agreement only and require thirty participants with retests before item metrics are emitted.
  - Completed-run timing is explicitly unable to measure abandonment and the M6I-04 export is explicitly insufficient for external-measure construct validity population-group fairness recommendation fit or longitudinal outcomes.
  - All eight participant evidence axes remain open and not established with completed_axes fixed at zero even when software data thresholds are met.
  - The operator command requires explicit sensitive-input acknowledgement writes a new mode-0600 file refuses overwrite and performs no database read network call or remote upload.
  - Readiness uses conspicuously synthetic in-memory data validates schema determinism thresholds suppression privacy and zero claims and performs no database query or participant-data read.
  - Assessment source scoring recommendation evidence completion score state consent history export behavior owner lifecycle and historical replay remain unchanged.
  - ER-M6A-003 RG-M6A-002 M6B specialist acceptance and every deferred participant qualified-analysis accessibility fairness cultural clinical longitudinal release deployment mastery and effectiveness gate remain open.
validation:
  local:
    - .venv/bin/python -m pytest tests/test_assessment_calibration_analysis.py tests/test_assessment_calibration_consent.py tests/test_deployment_contract.py
    - make assessment-calibration-analysis-check PYTHON=.venv/bin/python
    - make assessment-calibration-collection-check PYTHON=.venv/bin/python
    - make assessment-calibration-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - exact M6I-04 schema hash allowlist and structural validation
    - deterministic aggregate report schema and report hash
    - small-cell suppression and absence of participant rows raw values or pseudonyms
    - fixed descriptive and linked-retest software thresholds with zero completed evidence axes
    - explicit unsupported-input and completed-run-abandonment limitations
    - operator acknowledgement no-overwrite mode-0600 and input-output separation
    - database-free synthetic readiness and unchanged collection export compatibility
  required_ci:
    - Ruff Django pytest migration drift and manifest verification
    - assessment calibration source collection and analysis readiness
    - unchanged Playwright core journeys
    - Compose backup restore recreation and all readiness drills
    - aggregate Pilot readiness gate
risk:
  class: high
  hazards:
    - aggregate output leaks a participant pseudonym or small response cell
    - malformed or foreign input is summarized as trusted calibration data
    - an arbitrary software threshold is mislabeled psychometric or fairness validation
    - completed-run timing is mislabeled abandonment evidence
    - analysis reads the live database or uploads sensitive data
  stop_conditions:
    - any participant-level row pseudonym raw response timing identity timestamp share code or free text appears in the report
    - any nonzero aggregate cell below five is emitted unsuppressed
    - any evidence axis is marked complete or established
    - any database read network call upload telemetry overwrite or background processing is added
    - any assessment scorer source consent collection recommendation evidence completion score or replay behavior changes
    - a required local or hosted gate fails
rollback:
  strategy: Remove the analysis contract schema service commands readiness script and verification wiring; M6I-04 consent and export behavior and all existing application data remain untouched.
evidence:
  output:
    - docs/evidence/M6I-05-ASSESSMENT-CALIBRATION-ANALYSIS-READINESS-<date>.md
    - exact local and hosted CI results
  claim_boundary: Deterministic private aggregate analysis readiness only; no participant evidence axis calibration reliability validity fairness accessibility burden abandonment recommendation-fit longitudinal clinical effectiveness release deployment mastery or specialist claim.
