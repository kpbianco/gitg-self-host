acceptance:
  - All ten nonlegacy domain 08 competencies have individually authored instructions aligned with canonical scope and an explicit bounded exercise goal.
  - The other 373 practice packages remain byte-identical; exactly 115 authored and 268 rewrite-pending rows are reported.
  - Each action supplies observable success criteria and a usable example without requiring the person to design a rubric or exercise.
  - The 08.06 typed evidence rules and original baseline cued-start comparison sequence remain compatible with all frozen M6D fixtures.
  - The frozen 08.02 protocol remains byte-identical; its complete source-only guide is validated separately and remains rewrite-pending in runtime coverage.
  - Guide-only exclusions are restricted to the five known frozen legacy IDs; missing or foreign guides fail closed.
  - Prerequisites materials burden meaningful review and accessible equivalents are explicit.
  - Simulation and preparation do not claim live performance or comprehensive mastery.
  - Deferral N/A and unattempted actions do not satisfy completion.
  - Sources support specific factual claims and do not imply validation of the product-authored exercise.
  - Every canonical scope facet maps to concrete actions or an explicit legitimate pathway choice; a supplied rehearsal never claims live participation.
  - The impulse habit-design and commitment-closeout journeys show readable actions setup and observations; preserve all existing browser journeys and overflow assertions.
  - No deliberate pain exhaustion food restriction sleep loss or deprivation is introduced; ordinary practice retains necessary supports and never overrides consent or safety obligations.
  - All 383 protocol IDs 1151 action IDs parent mappings activation records assessment and scoring mathematics remain unchanged.
  - Existing submitted events replay from their original snapshots and content import refuses to change active or paused practices.
  - Every canonical competency receives an explicit authored-pending-review or rewrite-pending disposition; 13.02 retains its existing typed evidence fixtures and the five frozen legacy runtime packages remain byte-equivalent.
  - ER-M6A-003 RG-M6A-002 and all specialist and empirical validation gates remain truthful and open.
validation:
  local:
    - make full-frontier-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - make practice-report-check PYTHON=.venv/bin/python
    - make catalog-governance-audit-check PYTHON=.venv/bin/python
    - make composite-scoring-catalog-check PYTHON=.venv/bin/python
    - git diff --check
  required_ci:
    - Ruff Django pytest migration drift and manifest verification
    - all readiness and canonical report gates
    - Playwright core journeys
    - Compose backup restore and recreation
    - aggregate Pilot readiness gate
risk:
  class: high
  hazards:
    - noun-swapped content is misrepresented as individually authored
    - revised instructions invalidate an ongoing practice
    - source support is overstated as specialist or empirical validation
    - task completion is confused with mastery
  stop_conditions:
    - historical event replay changes
    - assessment or scoring mathematics changes
    - any missing or generic exercise is hidden by the coverage report
    - a required CI gate fails
rollback:
  strategy: Revert the content release before import or restore the verified pre-upgrade backup; never reinterpret existing event snapshots.
evidence:
  output:
    - docs/evidence/M6J-06-ATTENTION-DISCIPLINE-PRACTICES-2026-09-06.md
    - exact per-competency content coverage and residual gaps
    - exact local and hosted verification results
  claim_boundary: Authored educational practices and software verification; no automatic human review or empirical validation acceptance.
