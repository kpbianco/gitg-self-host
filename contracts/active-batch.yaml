acceptance:
  - All 12 competencies 05.01 through 05.12 have individually authored instructions aligned with canonical scope and an explicit bounded exercise goal.
  - Previously authored domains 01 02 and 13 remain byte-identical; exactly 54 authored and 329 rewrite-pending rows are reported.
  - Each action supplies observable success criteria and a usable example without requiring the person to design a rubric or exercise.
  - Prerequisites materials burden meaningful review and accessible equivalents are explicit.
  - Simulation and preparation do not claim live performance or comprehensive mastery.
  - Deferral N/A and unattempted actions do not satisfy completion.
  - Sources support specific factual claims and do not imply validation of the product-authored exercise.
  - The existing 200 percent mobile zoom test passes with readable wrapping buttons and status labels; retain the overflow assertion and review its screenshot.
  - All 383 protocol IDs 1151 action IDs parent mappings activation records assessment and scoring mathematics remain unchanged.
  - Existing submitted events replay from their original snapshots and content import refuses to change active or paused practices.
  - Every canonical competency receives an explicit authored-pending-review or rewrite-pending disposition; 13.02 retains its existing typed evidence fixtures and the five frozen legacy runtime packages remain byte-equivalent.
  - ER-M6A-003 RG-M6A-002 and all specialist and empirical validation gates remain truthful and open.
