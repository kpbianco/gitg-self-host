schema_version: 1
batch:
  id: M6I-04-CONSENTED-ASSESSMENT-CALIBRATION-DATA
  title: Add explicit-consent local calibration data collection
  goal: Let a person explicitly permit or withdraw one completed assessment from a sensitive pseudonymous local calibration export while preserving ordinary private assessment storage and every scoring runtime boundary.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - products/gitg-self-host/acceptance.yaml#GG-VALIDATION
    - docs/PRODUCT_DECISIONS.md#decision-055--assessment-calibration-readiness-is-not-validation
    - docs/architecture/0016-consented-local-assessment-calibration-data.md
    - contracts/assessment-calibration-consent.yaml
  milestone: successor-to-M6I-03-ASSESSMENT-CALIBRATION-READINESS
  baseline_commit: 306a608990807e34b809b7e86ea94948bd636b42
dependencies:
  - M6I-03-ASSESSMENT-CALIBRATION-READINESS
scope:
  allowed_paths:
    - AGENTS.md
    - README.md
    - Makefile
    - MANIFEST.tsv
    - .github/workflows/**
    - contracts/**
    - docs/**
    - growth/**
    - scripts/**
    - templates/growth/data_management.html
    - tests/**
  forbidden_paths:
    - data/**
    - growth/static/**
    - templates/growth/assessment.html
    - requirements*.txt
    - pyproject.toml
    - Dockerfile
    - docker-compose.yml
acceptance:
  - ADR 0016 and the consent contract define GG-ASSESSMENT-CALIBRATION-CONSENT-1.0 as permission to reuse one already-stored completed assessment in a manual local export, not consent to an assessment or a validation result.
  - No participant-created assessment is enrolled by default and the Pilot 002 demonstration seed is never eligible.
  - Grant withdrawal and later reconsent are explicit authenticated CSRF-protected actions bound to an owned immutable assessment run.
  - Consent history is append-only contiguous deterministic hash-verified and idempotent for an unchanged state.
  - One random pseudonymous participant token links a person's explicitly included retakes while exact account identity database keys timestamps and assessment IDs remain excluded.
  - The export contains only assessment version/source item responses clarifier responses timing response-quality summaries run sequence and whole-day intervals.
  - The export excludes share codes free text Personal OS context practice evidence completion score orientation archetype lever domain and competency outputs.
  - The owner may inspect their exact current contribution; withdrawal removes the run from every future export without changing or deleting the underlying private assessment.
  - The operator export requires an explicit sensitive-data acknowledgement creates a new mode-0600 file and refuses overwrite.
  - Calibration consent participates in the complete owner-private archive account-deletion preview backup restore and schema rollback boundaries and is never an automated retention target.
  - Readiness accepts empty consent state fails closed on ownership revision token snapshot hash assessment or allowlist drift and prints no sensitive values.
  - No assessment item scorer baseline recommendation evidence completion credit score state or historical replay behavior changes and no remote telemetry upload or background job is added.
  - All eight empirical evidence axes remain data_collection_required with zero completed; software collection capability is not participant evidence or qualified analysis.
  - ER-M6A-003 RG-M6A-002 M6B specialist acceptance and every deferred human validation gate remain open.
validation:
  local:
    - .venv/bin/python -m pytest tests/test_assessment_calibration_consent.py tests/test_data_lifecycle.py tests/test_assessment_integration.py
    - make assessment-calibration-collection-check PYTHON=.venv/bin/python
    - ./scripts/agent-verify.sh contract
    - ./scripts/agent-verify.sh quick
    - .venv/bin/python scripts/verify-manifest.py
    - git diff --check
  focused_tests_to_add:
    - no implicit enrollment and Pilot seed exclusion
    - append-only consent withdrawal reconsent idempotency ownership and CSRF
    - deterministic pseudonymous cross-run export with exact allowlist and no identifier or share-code leakage
    - fail-closed consent assessment revision token snapshot and hash tamper cases
    - explicit operator acknowledgement no-overwrite and mode-0600 output
    - owner archive deletion backup migration rollback and readiness integration
  required_ci:
    - Ruff Django pytest migration drift and manifest verification
    - assessment calibration source readiness and consent readiness
    - unchanged Playwright core journeys plus data-management consent journey
    - Compose migration backup restore recreation and readiness drill
    - aggregate Pilot readiness gate
risk:
  class: high
  hazards:
    - ordinary assessment use is silently treated as research participation
    - a supposedly anonymous export retains linkable or identifying fields without warning
    - withdrawal fails to remove a run from a later export
    - consent or export mutates assessment or developmental state
    - software capability is mislabeled collected evidence or validation
  stop_conditions:
    - any assessment source scorer model or canonical content byte changes
    - any participant run is exported without latest explicit consent
    - any identity exact timestamp share code free text or developmental output enters the calibration export
    - any remote upload automatic enrollment background collection or silent overwrite is added
    - any empirical evidence axis is marked complete without retained consented data and qualified analysis
    - a required local or hosted gate fails
rollback:
  strategy: Reverse migration 0013 after removing the consent/export UI service command readiness and owner-archive-v3 changes; all pre-existing assessment evidence score practice and owner-private records remain untouched.
evidence:
  output:
    - docs/evidence/M6I-04-CONSENTED-ASSESSMENT-CALIBRATION-DATA-<date>.md
    - exact local and hosted CI results
  claim_boundary: Deterministic opt-in local collection software only; no anonymous-data participant-sample psychometric fairness accessibility-population clinical cultural longitudinal recommendation-fit abandonment effectiveness release deployment mastery or specialist acceptance.
