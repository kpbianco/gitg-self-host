{% extends "base.html" %}

{% block title %}Change password · Grounded Growth{% endblock %}

{% block content %}
  <section class="narrow-page">
    <p class="eyebrow">Account</p>
    <h1>Change password</h1>
    <p class="lede">Use a unique password of at least ten characters.</p>
    <form method="post" class="stacked-form">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="button" type="submit">Update password</button>
    </form>
  </section>
{% endblock %}
