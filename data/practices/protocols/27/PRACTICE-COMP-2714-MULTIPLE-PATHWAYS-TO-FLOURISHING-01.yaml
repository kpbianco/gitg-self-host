  - c2714_a3_adverse
  adverse_or_contradictory_indicators:
  - The Multiple pathways to flourishing action exceeded consent, authority, privacy, qualification, role,
    burden, or safety boundaries.
  - The evidence contradicted the intended Multiple pathways to flourishing criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Multiple pathways to flourishing explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Multiple pathways to flourishing context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Multiple pathways to flourishing observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Multiple pathways to flourishing rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can define an equivalent pathway when a standard practice is inaccessible, inappropriate, or
    contrary to conscience.—not completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Multiple pathways to flourishing requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Multiple pathways
    to flourishing evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L01
  - L05
  - L31
  - L36
  minimum_evidence_before_state_update: No current-state update is permitted for this Multiple pathways
    to flourishing draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Multiple pathways to flourishing evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The choose a declared frame for multiple pathways to flourishing action was attempted or explicitly
    deferred.
  - The complete two bounded multiple pathways to flourishing practices action was attempted or explicitly
    deferred.
  - The interpret the multiple pathways to flourishing experience modestly action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2714_a1_primary
    - c2714_a2_primary
    - c2714_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Multiple pathways to flourishing only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Multiple pathways to flourishing across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Multiple pathways to flourishing require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Multiple pathways to flourishing criterion is present, absent, mixed, or
      unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can define an equivalent pathway when a standard practice
      is inaccessible, inappropriate, or contrary to conscience.', what contradiction or missing context
      matters most, and should this Multiple pathways to flourishing design be repeated, adapted, deferred,
      stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Multiple pathways to flourishing design only when the context and
      burden remain appropriate.
    adapt: Change the Multiple pathways to flourishing medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Multiple pathways to flourishing when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Multiple pathways to flourishing questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Multiple pathways to flourishing criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Multiple pathways to flourishing criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Multiple pathways to flourishing criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Multiple pathways to flourishing action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
