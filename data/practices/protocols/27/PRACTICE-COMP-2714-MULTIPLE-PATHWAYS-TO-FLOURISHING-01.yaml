  - stable_id: PRACTICE-COMP-2714-MULTIPLE-PATHWAYS-TO-FLOURISHING-01-A2
    sequence: 2
    title: Complete two bounded Multiple pathways to flourishing practices
    instructions: Complete two short, freely chosen Multiple pathways to flourishing practices appropriate
      to the declared frame, such as reading, silence, prayer, observation, ritual, dialogue, or reflection.
      Stop for distress, coercion, altered-state risk, conscience conflict, or pressure from an authority
      or group.
