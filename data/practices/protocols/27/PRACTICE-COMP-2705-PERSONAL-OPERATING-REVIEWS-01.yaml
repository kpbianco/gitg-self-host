  adverse_or_contradictory_indicators:
  - The Personal operating reviews action exceeded consent, authority, privacy, qualification, role, burden,
    or safety boundaries.
  - The evidence contradicted the intended Personal operating reviews criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Personal operating reviews explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Personal operating reviews context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Personal operating reviews observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Personal operating reviews rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Reviews produce decisions, scheduled actions, and removed obligations.—not completion, confidence,
    conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Personal operating reviews requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Personal
    operating reviews contribution under typed evaluation; protocol performance remains distinct and is
    never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L05
  - L10
  - L14
  - L36
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Personal operating reviews evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The audit one bounded personal operating reviews context action was attempted or explicitly deferred.
  - The make one reversible personal operating reviews redesign action was attempted or explicitly deferred.
  - The compare the personal operating reviews context after the change action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2705_a1_primary
    - c2705_a2_primary
    - c2705_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Personal operating reviews only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Personal operating reviews across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Personal operating reviews require in this exact context, what remains outside my
      role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Personal operating reviews criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Reviews produce decisions, scheduled actions, and removed
      obligations.', what contradiction or missing context matters most, and should this Personal operating
      reviews design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Personal operating reviews design only when the context and burden
      remain appropriate.
    adapt: Change the Personal operating reviews medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Personal operating reviews when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Personal operating reviews questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Personal operating reviews criteria were observed with provenance and no adverse
      boundary signal in the selected context.
    mixed: Some Personal operating reviews criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Personal operating reviews criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Personal operating reviews action was deferred, not observed, not applicable, stale,
      insufficiently bounded, or too confounded to interpret.
