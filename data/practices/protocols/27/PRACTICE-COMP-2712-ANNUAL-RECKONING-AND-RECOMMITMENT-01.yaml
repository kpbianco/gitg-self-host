  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Annual reckoning and recommitment; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Annual reckoning and recommitment; assistive technology, interpretation, a support person,
      and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Annual reckoning and recommitment to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Annual reckoning and recommitment opportunity is unavailable or inappropriate, use a
      fictional, historical, public, simulated, or planning-only equivalent and retain the narrower evidence
      classification.
  pause_conditions:
  - Pause Annual reckoning and recommitment when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Annual reckoning and recommitment practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Annual reckoning and recommitment situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Annual reckoning and recommitment actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c2712_a1_primary
  - c2712_a1_boundary
  - c2712_a1_adverse
  - c2712_a2_primary
  - c2712_a2_boundary
  - c2712_a2_adverse
  - c2712_a3_primary
  - c2712_a3_boundary
  - c2712_a3_adverse
  adverse_or_contradictory_indicators:
  - The Annual reckoning and recommitment action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Annual reckoning and recommitment criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Annual reckoning and recommitment explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Annual reckoning and recommitment context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Annual reckoning and recommitment observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Annual reckoning and recommitment rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Produces an honest annual account and a limited set of renewed commitments.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Annual reckoning and recommitment requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Annual
    reckoning and recommitment contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L01
  - L05
  - L10
  - L36
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Annual reckoning and recommitment evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The define indicators for annual reckoning and recommitment action was attempted or explicitly deferred.
  - The observe annual reckoning and recommitment across three checkpoints action was attempted or explicitly
    deferred.
  - The review the limited annual reckoning and recommitment pattern action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2712_a1_primary
    - c2712_a2_primary
    - c2712_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Annual reckoning and recommitment only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Annual reckoning and recommitment across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Annual reckoning and recommitment require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Annual reckoning and recommitment criterion is present, absent, mixed, or
      unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Produces an honest annual account and a limited set of renewed
      commitments.', what contradiction or missing context matters most, and should this Annual reckoning
      and recommitment design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Annual reckoning and recommitment design only when the context and
      burden remain appropriate.
    adapt: Change the Annual reckoning and recommitment medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Annual reckoning and recommitment when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Annual reckoning and recommitment questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Annual reckoning and recommitment criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Annual reckoning and recommitment criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Annual reckoning and recommitment criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Annual reckoning and recommitment action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
presentation:
  setup_copy:
    context_heading: Choose one bounded context for Annual reckoning and recommitment.
    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Annual reckoning
      and recommitment.
  check_in_labels:
    c2712_a1_primary: The bounded Annual reckoning and recommitment criterion for action 1 was observed
    c2712_a1_boundary: Action 1 stayed inside its stated Annual reckoning and recommitment boundary
    c2712_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c2712_a2_primary: The bounded Annual reckoning and recommitment criterion for action 2 was observed
    c2712_a2_boundary: Action 2 stayed inside its stated Annual reckoning and recommitment boundary
    c2712_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c2712_a3_primary: The bounded Annual reckoning and recommitment criterion for action 3 was observed
    c2712_a3_boundary: Action 3 stayed inside its stated Annual reckoning and recommitment boundary
    c2712_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record shows what happened in one limited Annual reckoning and
    recommitment practice, including support, contradiction, defer, no result, or harm.
  display_order: 380
