        expected: true
  - stable_id: PRACTICE-COMP-2712-ANNUAL-RECKONING-AND-RECOMMITMENT-01-A2
    sequence: 2
    title: Observe Annual reckoning and recommitment across three checkpoints
    instructions: Collect up to three brief Annual reckoning and recommitment checkpoints across the selected
      period or contexts. Record unknown, not observed, not applicable, defer, and adverse outcomes as
      valid states; do not infer a trend from prose length, mood, or one unusually good or bad event.
