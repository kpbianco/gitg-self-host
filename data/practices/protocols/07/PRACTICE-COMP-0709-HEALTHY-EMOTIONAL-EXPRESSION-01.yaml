  - c0709_a3_adverse
  adverse_or_contradictory_indicators:
  - The Healthy emotional expression action exceeded consent, authority, privacy, qualification, role,
    burden, or safety boundaries.
  - The evidence contradicted the intended Healthy emotional expression criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Healthy emotional expression explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Healthy emotional expression context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Healthy emotional expression observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Healthy emotional expression rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can disclose a difficult emotional truth to a trustworthy person with clarity and proportion.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Healthy emotional expression requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Healthy
    emotional expression contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L06
  - L07
  - L23
  - L25
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Healthy emotional expression evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The bound the qualified question for healthy emotional expression action was attempted or explicitly
    deferred.
  - The prepare minimum information for healthy emotional expression action was attempted or explicitly
    deferred.
  - The record a bounded healthy emotional expression disposition action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0709_a1_primary
    - c0709_a2_primary
    - c0709_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Healthy emotional expression only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Healthy emotional expression across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Healthy emotional expression require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Healthy emotional expression criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can disclose a difficult emotional truth to a trustworthy
      person with clarity and proportion.', what contradiction or missing context matters most, and should
      this Healthy emotional expression design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Healthy emotional expression design only when the context and burden
      remain appropriate.
    adapt: Change the Healthy emotional expression medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Healthy emotional expression when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Healthy emotional expression questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Healthy emotional expression criteria were observed with provenance and no
      adverse boundary signal in the selected context.
    mixed: Some Healthy emotional expression criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Healthy emotional expression criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Healthy emotional expression action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
