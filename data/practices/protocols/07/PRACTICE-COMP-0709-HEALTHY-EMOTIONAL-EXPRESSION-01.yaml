meaning_and_fit:
  purpose: Communicate an emotionally important truth to a trustworthy and willing person with clear observation,
    proportionate feeling language, a need and a negotiable request.
  why_recommended: Communicate an emotionally important truth to a trustworthy and willing person with
    clear observation, proportionate feeling language, a need and a negotiable request.
  claims:
  - statement: Communicate an emotionally important truth to a trustworthy and willing person with clear
      observation, proportionate feeling language, a need and a negotiable request.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Healthy emotional expression practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Healthy emotional expression as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use text, email, AAC, an interpreter or a consented support person. Rehearse
    with the supplied case when no trustworthy listener is available, while leaving live expression untested.
    Do not disclose to an abusive, retaliatory or coercive person; use safety planning or qualified support
    instead.
  opportunity_considerations: 'Use the default: tell a trusted friend you felt left out when a recurring
    plan changed without notice. Draft four lines—what happened, what you felt and at what intensity,
    what mattered, and one specific request. Choose a private channel and ask whether this is a workable
    time.'
  prerequisites:
  - 'Use the default: tell a trusted friend you felt left out when a recurring plan changed without notice.
    Draft four lines—what happened, what you felt and at what intensity, what mattered, and one specific
    request. Choose a private channel and ask whether this is a workable time.'
  dependencies: []
  safe_alternatives:
  - Use text, email, AAC, an interpreter or a consented support person. Rehearse with the supplied case
    when no trustworthy listener is available, while leaving live expression untested. Do not disclose
    to an abusive, retaliatory or coercive person; use safety planning or qualified support instead.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Healthy emotional expression differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Healthy emotional expression
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default: tell a trusted friend you felt left out when a recurring plan changed without
    notice. Draft four lines—what happened, what you felt and at what intensity, what mattered, and one
    specific request. Choose a private channel and ask whether this is a workable time. Goal: Communicate
    an emotionally important truth to a trustworthy and willing person with clear observation, proportionate
    feeling language, a need and a negotiable request. Scope: One bounded disclosure practices healthy
    expression; it does not require vulnerability with unsafe people, guarantee understanding or resolve
    the wider relationship. Time and effort: Fifteen minutes to prepare, a 5–15 minute conversation or
    rehearsal and a 10-minute review. Adaptation: Use text, email, AAC, an interpreter or a consented
    support person. Rehearse with the supplied case when no trustworthy listener is available, while leaving
    live expression untested. Do not disclose to an abusive, retaliatory or coercive person; use safety
    planning or qualified support instead. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, email, AAC, an interpreter or a consented support person. Rehearse with
    the supplied case when no trustworthy listener is available, while leaving live expression untested.
    Do not disclose to an abusive, retaliatory or coercive person; use safety planning or qualified support
    instead.
  expected_burden: Fifteen minutes to prepare, a 5–15 minute conversation or rehearsal and a 10-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Healthy emotional expression protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Healthy emotional expression action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, email,
    AAC, an interpreter or a consented support person. Rehearse with the supplied case when no trustworthy
    listener is available, while leaving live expression untested. Do not disclose to an abusive, retaliatory
    or coercive person; use safety planning or qualified support instead.
  actions:
  - stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A1
    sequence: 1
    title: Prepare a proportionate truth and a bounded request
    instructions: 'Describe the event without motive claims, choose one or two precise feeling words and
      state the relevant need or value. Make a request the listener can accept, decline or modify. Remove
      threats, mind-reading, strategic withdrawal, exaggerated performance and demands that the listener
      regulate your feeling; keep any boundary focused on your own future action.


      Observation checks: Observation feeling and need are distinguishable; Intensity and detail fit the
      relationship and event; The request allows acceptance refusal or modification; Threats motive claims
      and emotional coercion are absent. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01
      action_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A1
      competency_stable_id: '07.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0709_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0709_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - observation_feeling_and_need_are_distinguishable
        - intensity_and_detail_fit_the_relationship_and_event
        - the_request_allows_acceptance_refusal_or_modification
        - threats_motive_claims_and_emotional_coercion_are_absent
      - measurement_id: c0709_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0709_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A2
    sequence: 2
    title: Ask consent and communicate through an accessible channel
    instructions: 'Ask whether the person is willing and has time to listen. Deliver the four lines in
      speech, writing or an accessible format, then pause. Invite correction of facts and ask what they
      understood before arguing the conclusion. If the person declines, respect that response and choose
      another time, private processing or appropriate support rather than leaking the message indirectly.


      Observation checks: The listener consents to the time and channel; The prepared emotional truth
      is actually communicated; Fact correction and the listener''s understanding are invited; A refusal
      does not trigger pressure or indirect retaliation. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01
      action_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A2
      competency_stable_id: '07.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0709_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0709_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_listener_consents_to_the_time_and_channel
        - the_prepared_emotional_truth_is_actually_communicated
        - fact_correction_and_the_listener_s_understanding_are_invited
        - a_refusal_does_not_trigger_pressure_or_indirect_retaliation
      - measurement_id: c0709_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0709_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A3
    sequence: 3
    title: Review clarity, impact and the next relational action
    instructions: 'Record whether this was live or rehearsed, what the listener actually said and whether
      the request was answered. Note any wording that overstated, minimized or controlled, and repair
      it if welcome. Decide one next action that respects both parties'' agency; an imperfect response
      does not make the original feeling unreal or the request automatically binding.


      Observation checks: Live disclosure and rehearsal are clearly labeled; The listener''s response
      is recorded without interpretation as fact; Any harmful or unclear delivery receives a repair decision;
      The next action preserves both people''s agency. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Which part of the message was both honest and proportionate, and what did the listener
      remain free to decide?


      Examples: Supportive: The person asked for time, named feeling left out, requested future notice
      and heard that the friend could try but could not promise every update.


      Mixed: The feeling was expressed clearly, but the need and request were blended and required clarification.


      Contradictory: Disclosure was used as a threat, loyalty test, public performance or demand that
      the listener remove every difficult feeling.


      Inconclusive: A message was drafted but neither rehearsed nor delivered, while avoidance continued
      through indirect hostility.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01
      action_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A3
      competency_stable_id: '07.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
