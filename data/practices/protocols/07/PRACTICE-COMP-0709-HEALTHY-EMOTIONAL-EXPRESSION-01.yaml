      exchange occurs.
    cultural_context:
    - Adapt the expression of Healthy emotional expression to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use text, sign, AAC, an interpreter or a culturally suitable indirect opening that still makes the
