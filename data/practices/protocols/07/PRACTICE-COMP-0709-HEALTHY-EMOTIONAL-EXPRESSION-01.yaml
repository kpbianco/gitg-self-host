meaning_and_fit:
  purpose: Communicate a difficult emotional truth clearly and proportionately, with a concrete request
    and room for the listener's boundaries.
  why_recommended: Communicate a difficult emotional truth clearly and proportionately, with a concrete
    request and room for the listener's boundaries.
  claims:
  - statement: Communicate a difficult emotional truth clearly and proportionately, with a concrete request
      and room for the listener's boundaries.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Healthy emotional expression practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Healthy emotional expression as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use text, sign, AAC, an interpreter or a culturally suitable indirect opening
    that still makes the request understandable. A trusted communication partner may help convey your
    words without deciding your feelings. Rehearsal is valid preparation; actual disclosure remains untested
    until a suitable exchange occurs.
  opportunity_considerations: 'Choose an ordinary feeling you are willing to share with someone who has
    previously respected boundaries. Default example: repeated last-minute changes leave you disappointed,
    and you would prefer earlier notice. If no suitable listener is available, use an unsent draft and
    rehearsal; do not approach an unsafe person to satisfy the exercise.'
  prerequisites:
  - 'Choose an ordinary feeling you are willing to share with someone who has previously respected boundaries.
    Default example: repeated last-minute changes leave you disappointed, and you would prefer earlier
    notice. If no suitable listener is available, use an unsent draft and rehearsal; do not approach an
    unsafe person to satisfy the exercise.'
  dependencies: []
  safe_alternatives:
  - Use text, sign, AAC, an interpreter or a culturally suitable indirect opening that still makes the
    request understandable. A trusted communication partner may help convey your words without deciding
    your feelings. Rehearsal is valid preparation; actual disclosure remains untested until a suitable
    exchange occurs.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Healthy emotional expression differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Healthy emotional expression
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary feeling you are willing to share with someone who has previously respected
    boundaries. Default example: repeated last-minute changes leave you disappointed, and you would prefer
    earlier notice. If no suitable listener is available, use an unsent draft and rehearsal; do not approach
    an unsafe person to satisfy the exercise. Goal: Communicate a difficult emotional truth clearly and
    proportionately, with a concrete request and room for the listener''s boundaries. Scope: One bounded
    disclosure practices expression and listening. It does not require revealing trauma, making every
    feeling public or proving that another person is trustworthy through a risky disclosure. Time and
    effort: About 10 minutes to prepare, a brief agreed exchange and 10 minutes afterward. Adaptation:
    Use text, sign, AAC, an interpreter or a culturally suitable indirect opening that still makes the
    request understandable. A trusted communication partner may help convey your words without deciding
    your feelings. Rehearsal is valid preparation; actual disclosure remains untested until a suitable
    exchange occurs. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, sign, AAC, an interpreter or a culturally suitable indirect opening that
    still makes the request understandable. A trusted communication partner may help convey your words
    without deciding your feelings. Rehearsal is valid preparation; actual disclosure remains untested
    until a suitable exchange occurs.
  expected_burden: About 10 minutes to prepare, a brief agreed exchange and 10 minutes afterward.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Healthy emotional expression protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Healthy emotional expression action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, sign,
    AAC, an interpreter or a culturally suitable indirect opening that still makes the request understandable.
    A trusted communication partner may help convey your words without deciding your feelings. Rehearsal
    is valid preparation; actual disclosure remains untested until a suitable exchange occurs.
  actions:
  - stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A1
    sequence: 1
    title: Prepare a feeling statement with the right amount of disclosure
    instructions: 'Write four parts: the specific event, your feeling, the need or value involved and
      a feasible request. For the example: When plans change at the last minute, I feel disappointed and
      unsettled. Predictability matters to me; could you let me know earlier when possible? Remove mind-reading,
      global accusations and private details not needed for the request. Identify how the feeling might
      otherwise leak out through unexplained withdrawal, hostility, acting cheerful for approval or attempts
      to control. Choose one direct sentence to replace that pattern without requiring an elaborate emotional
      performance.


      Observation checks: Event feeling need and request are all explicit; The statement avoids mind-reading
      and global accusation; Disclosure is limited to what the person freely chooses; A specific indirect
      expression pattern is replaced. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01
      action_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A1
      competency_stable_id: '07.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0709_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0709_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - event_feeling_need_and_request_are_all_explicit
        - the_statement_avoids_mind_reading_and_global_accusation
        - disclosure_is_limited_to_what_the_person_freely_chooses
        - a_specific_indirect_expression_pattern_is_replaced
      - measurement_id: c0709_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0709_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A2
    sequence: 2
    title: Ask for listening space and communicate the chosen truth
    instructions: 'Ask whether this is a suitable time for a short conversation or message, and whether
      you want listening, advice or a practical answer. Share the prepared statement in your own words.
      Allow the listener to say that now is not a good time or that they cannot meet the request. If you
      are rehearsing, speak or write the statement and practice a response to Not now without pretending
      consent was obtained. Do not increase the disclosure to force engagement, or treat the listener''s
      different feelings as proof that your own were wrong.


      Observation checks: The listener''s availability and willingness are checked; The feeling and concrete
      request are actually communicated or explicitly rehearsed; The preferred kind of response is stated;
      A refusal or different response can be accepted without pressure. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01
      action_stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A2
      competency_stable_id: '07.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0709_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0709_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_listener_s_availability_and_willingness_are_checked
        - the_feeling_and_concrete_request_are_actually_communicated_or_explicitly_rehearsed
        - the_preferred_kind_of_response_is_stated
        - a_refusal_or_different_response_can_be_accepted_without_pressure
      - measurement_id: c0709_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0709_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0709-HEALTHY-EMOTIONAL-EXPRESSION-01-A3
    sequence: 3
    title: Clarify what was understood and agree only what is mutual
    instructions: 'Ask what the listener understood if they are willing, or summarize the practical answer
      you received and invite correction. In the example, earlier notice when possible differs from a
      promise that plans never change. Acknowledge any part you expressed unclearly and restate it once
      without escalating. Record what was shared, what response actually occurred, what was mutually agreed
      and what remains private or unresolved. Check whether the exchange replaced withdrawal, hostility,
      performance or control with clearer communication. Do not equate being heard with having every request
      granted.


      Observation checks: Understanding is checked without demanding a particular emotional response;
      Any agreement is specific and mutual; Unclear wording can be corrected proportionately; Being heard
      is distinguished from having a request granted. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Did you say what mattered in a form the listener could understand and freely respond
      to? Keep the useful wording, clarify one ambiguity or choose a different support route. Disclosure
      itself does not establish intimacy or trustworthiness.


      Examples: Supportive: The person asked for a short conversation, named disappointment and requested
      earlier notice; both agreed on a practical message when plans changed.


      Mixed: The feeling was understood but earlier notice could not always be promised, so the person
      retained that limit and considered their own planning options.


      Contradictory: The disclosure demanded agreement, exposed unwanted private details or used tears
      and accusations to override the listener''s refusal.


      Inconclusive: The person rehearsed the statement alone and accurately recorded preparation, with
      no claim of being heard by another person.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
