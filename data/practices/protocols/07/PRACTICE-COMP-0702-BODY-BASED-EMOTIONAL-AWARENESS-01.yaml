meaning_and_fit:
  purpose: Observe personally accessible physical signals and use an early cue to choose a practical response
    before it becomes an unwanted behavior.
  why_recommended: Observe personally accessible physical signals and use an early cue to choose a practical
    response before it becomes an unwanted behavior.
  claims:
  - statement: Observe personally accessible physical signals and use an early cue to choose a practical
      response before it becomes an unwanted behavior.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Worsening symptoms and severe persistent distress affecting usual activities call for professional
      help; suicidal thoughts or urges to self-harm call for immediate help.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-SELF-HELP-LIMITS
    limitations: Public help-seeking guidance, not a diagnosis or validated product screening tool. The
      source's duration examples are not instructions to wait during danger or deterioration. It does
      not validate the original emotional-awareness, hope or strategy-transfer exercises.
  applicability_question: Does a voluntary, bounded Body-based emotional awareness practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Body-based emotional awareness as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: A visual timer, a pause card or a chosen external behavior can substitute
    for inaccessible body awareness. These alternatives test earlier response selection, not improved
    interoception. Keep prescribed supports and care unchanged; this practice never asks you to ignore
    pain or hold your breath.
  opportunity_considerations: Choose a familiar low-pressure activity such as reading an ordinary message.
    Keep a private note with before, early cue, response and afterward. Observe without changing your
    breathing or provoking stress. If internal attention is uncomfortable, use an external cue such as
    typing speed or an urge to interrupt.
  prerequisites:
  - Choose a familiar low-pressure activity such as reading an ordinary message. Keep a private note with
    before, early cue, response and afterward. Observe without changing your breathing or provoking stress.
    If internal attention is uncomfortable, use an external cue such as typing speed or an urge to interrupt.
  dependencies: []
  safe_alternatives:
  - A visual timer, a pause card or a chosen external behavior can substitute for inaccessible body awareness.
    These alternatives test earlier response selection, not improved interoception. Keep prescribed supports
    and care unchanged; this practice never asks you to ignore pain or hold your breath.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Body-based emotional awareness differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Body-based emotional awareness
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a familiar low-pressure activity such as reading an ordinary message. Keep a private
    note with before, early cue, response and afterward. Observe without changing your breathing or provoking
    stress. If internal attention is uncomfortable, use an external cue such as typing speed or an urge
    to interrupt. Goal: Observe personally accessible physical signals and use an early cue to choose
    a practical response before it becomes an unwanted behavior. Scope: This is brief everyday observation,
    not a diagnostic body scan or a requirement to detect every internal sensation. New or concerning
    symptoms need appropriate medical assessment rather than an emotional explanation. Time and effort:
    Two ordinary opportunities over several days, with less than two minutes of observation at each and
    a short review. Adaptation: A visual timer, a pause card or a chosen external behavior can substitute
    for inaccessible body awareness. These alternatives test earlier response selection, not improved
    interoception. Keep prescribed supports and care unchanged; this practice never asks you to ignore
    pain or hold your breath. Keep personal working notes outside the check-in; record only the listed
    observations.


    Reference support:

    My Mental Health: Do I Need Help?: https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A visual timer, a pause card or a chosen external behavior can substitute for inaccessible
    body awareness. These alternatives test earlier response selection, not improved interoception. Keep
    prescribed supports and care unchanged; this practice never asks you to ignore pain or hold your breath.
  expected_burden: Two ordinary opportunities over several days, with less than two minutes of observation
    at each and a short review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Body-based emotional awareness protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Body-based emotional awareness action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A visual timer,
    a pause card or a chosen external behavior can substitute for inaccessible body awareness. These alternatives
    test earlier response selection, not improved interoception. Keep prescribed supports and care unchanged;
    this practice never asks you to ignore pain or hold your breath.
  actions:
  - stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A1
    sequence: 1
    title: Describe a baseline without interpreting it as an emotional diagnosis
    instructions: 'Before the selected activity, briefly consider breathing, tension, temperature, energy,
      posture, pain and overall activation. For each, write an ordinary description, unchanged, or not
      noticed; do not search repeatedly for a sensation. Activation means your sense of being keyed up,
      settled or slowed down, not a measured nervous-system state. Include ordinary context such as heat,
      an uncomfortable chair or a tiring day. End the observation and start the activity. A tense shoulder
      alone cannot identify an emotion or rule out a physical cause.


      Observation checks: All seven cue categories are considered without forced detection; Unknown or
      unchanged cues are allowed; Ordinary physical context is recorded; Sensations are not used to diagnose
      an emotion or condition. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A1
      competency_stable_id: '07.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0702_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0702_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_seven_cue_categories_are_considered_without_forced_detection
        - unknown_or_unchanged_cues_are_allowed
        - ordinary_physical_context_is_recorded
        - sensations_are_not_used_to_diagnose_an_emotion_or_condition
      - measurement_id: c0702_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0702_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A2
    sequence: 2
    title: Connect one early cue to a specific interruptible behavior
    instructions: 'During the ordinary activity, notice whether one accessible cue appears before a behavior
      you would prefer to choose deliberately. For example, faster typing may precede sending an abrupt
      reply; raised shoulders may accompany continuing an uncomfortable task. If a cue occurs, stop the
      optional behavior briefly, reread the message or adjust the ordinary setup, then choose the next
      step. Record the order of cue, response and behavior afterward. If you noticed only after acting,
      say so; retrospective awareness is useful but is not earlier intervention.


      Observation checks: One cue is linked to a specific behavior; The actual order of events is recorded;
      A practical response is attempted when appropriate; Late recognition is distinguished from early
      intervention. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A2
      competency_stable_id: '07.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0702_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0702_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_cue_is_linked_to_a_specific_behavior
        - the_actual_order_of_events_is_recorded
        - a_practical_response_is_attempted_when_appropriate
        - late_recognition_is_distinguished_from_early_intervention
      - measurement_id: c0702_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0702_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A3
    sequence: 3
    title: Try the cue-response link again and keep its limits visible
    instructions: 'At another natural occurrence of the same activity, use the same cue as a reminder
      to reread, adjust the setup or request a moment before responding. Compare whether the cue appeared,
      whether you caught it earlier, what you did and what happened. If the cue was absent or unreliable,
      select a visible alternative such as reaching for Send rather than inventing a physiological pattern.
      If noticing sensations increases distress or preoccupation, discontinue the internal observation
      and use an external prompt or seek appropriate help. Do not manufacture a stressful event for a
      second trial.


      Observation checks: A second natural opportunity is examined; Earlier recognition is assessed from
      the recorded sequence; An unreliable cue can be replaced by an external prompt; Increased distress
      does not trigger more intensive self-monitoring. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Was the cue observable before action and useful enough to keep? Retain one practical
      reminder, change it or stop monitoring. Do not infer improved health or universal emotional regulation
      from two occasions.


      Examples: Supportive: Faster typing was noticed before an abrupt reply; rereading allowed a factual
      question, and the sequence was observed again later.


      Mixed: Shoulder tension was noticed only afterward on the first occasion, while an external Send
      prompt supported a timely pause on the second.


      Contradictory: A new concerning physical symptom was dismissed as emotion, or repeated checking
      made the activity harder and was intensified.


      Inconclusive: The person planned to watch for tension but recorded no opportunity, cue or response
      sequence.'
    expected_time: 15-25 minutes
