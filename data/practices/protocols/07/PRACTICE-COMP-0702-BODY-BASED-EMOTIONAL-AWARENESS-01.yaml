meaning_and_fit:
  purpose: Notice breathing, tension, temperature, energy, posture, pain or activation early enough to
    choose a safe regulating action before automatic behavior takes over.
  why_recommended: Notice breathing, tension, temperature, energy, posture, pain or activation early enough
    to choose a safe regulating action before automatic behavior takes over.
  claims:
  - statement: Notice breathing, tension, temperature, energy, posture, pain or activation early enough
      to choose a safe regulating action before automatic behavior takes over.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Body-based emotional awareness practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Body-based emotional awareness as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use external cues such as speech speed, hand pressure or pacing if internal
    sensation is hard to access. Choose orienting, movement or consultation instead of breath work when
    breath attention is unpleasant. Do not provoke activation; a neutral scripted scenario tests recognition
    only.
  opportunity_considerations: Choose a recurring low-stakes cue such as opening a crowded inbox. Prepare
    a private six-area scan—breathing, jaw or shoulders, temperature, energy, posture and pain—and one
    optional response such as looking around the room, changing posture, walking briefly or delaying a
    reply. Breath focus is not required.
  prerequisites:
  - Choose a recurring low-stakes cue such as opening a crowded inbox. Prepare a private six-area scan—breathing,
    jaw or shoulders, temperature, energy, posture and pain—and one optional response such as looking
    around the room, changing posture, walking briefly or delaying a reply. Breath focus is not required.
  dependencies: []
  safe_alternatives:
  - Use external cues such as speech speed, hand pressure or pacing if internal sensation is hard to access.
    Choose orienting, movement or consultation instead of breath work when breath attention is unpleasant.
    Do not provoke activation; a neutral scripted scenario tests recognition only.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Body-based emotional awareness differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Body-based emotional awareness
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a recurring low-stakes cue such as opening a crowded inbox. Prepare a private six-area
    scan—breathing, jaw or shoulders, temperature, energy, posture and pain—and one optional response
    such as looking around the room, changing posture, walking briefly or delaying a reply. Breath focus
    is not required. Goal: Notice breathing, tension, temperature, energy, posture, pain or activation
    early enough to choose a safe regulating action before automatic behavior takes over. Scope: This
    compares signals around one manageable stressor, not a medical assessment or a claim that every emotion
    has a distinct bodily signature. Pain and other symptoms may have non-emotional causes. Time and effort:
    A five-minute neutral baseline, two brief natural observations and one 10-minute comparison over several
    days. Adaptation: Use external cues such as speech speed, hand pressure or pacing if internal sensation
    is hard to access. Choose orienting, movement or consultation instead of breath work when breath attention
    is unpleasant. Do not provoke activation; a neutral scripted scenario tests recognition only. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use external cues such as speech speed, hand pressure or pacing if internal sensation
    is hard to access. Choose orienting, movement or consultation instead of breath work when breath attention
    is unpleasant. Do not provoke activation; a neutral scripted scenario tests recognition only.
  expected_burden: A five-minute neutral baseline, two brief natural observations and one 10-minute comparison
    over several days.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Body-based emotional awareness protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Body-based emotional awareness action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use external
    cues such as speech speed, hand pressure or pacing if internal sensation is hard to access. Choose
    orienting, movement or consultation instead of breath work when breath attention is unpleasant. Do
    not provoke activation; a neutral scripted scenario tests recognition only.
  actions:
  - stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A1
    sequence: 1
    title: Record a neutral comparison without trying to relax
    instructions: 'At an ordinary calm-enough moment, scan the six areas once and record noticed, not
      noticed or not accessible. Also note location, activity and time of day. Do not force slower breathing,
      intensify pain or decide what a signal means; this baseline exists only to make later changes easier
      to notice.


      Observation checks: All six signal areas have an honest disposition; Context and time are recorded
      with the scan; The baseline is observed without forcing a state change; Pain or absent sensation
      is not assigned an emotional cause. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A1
      competency_stable_id: '07.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0702_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0702_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_six_signal_areas_have_an_honest_disposition
        - context_and_time_are_recorded_with_the_scan
        - the_baseline_is_observed_without_forcing_a_state_change
        - pain_or_absent_sensation_is_not_assigned_an_emotional_cause
      - measurement_id: c0702_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0702_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A2
    sequence: 2
    title: Catch the earliest change at two natural cues
    instructions: 'When the chosen ordinary cue occurs, pause only if doing so is safe. Repeat the scan
      and identify the first clear change from baseline, its approximate intensity and the behavior beginning
      to follow. On a second natural occurrence, check whether the same signal appears or whether a different
      early cue is more reliable.


      Observation checks: Two natural cue occasions or missing opportunities are recorded; An early change
      is compared with the neutral baseline; The beginning behavior is named without moral judgment; Differences
      between occasions remain visible. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A2
      competency_stable_id: '07.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0702_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0702_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_natural_cue_occasions_or_missing_opportunities_are_recorded
        - an_early_change_is_compared_with_the_neutral_baseline
        - the_beginning_behavior_is_named_without_moral_judgment
        - differences_between_occasions_remain_visible
      - measurement_id: c0702_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0702_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A3
    sequence: 3
    title: Use one early signal as a prompt rather than a diagnosis
    instructions: 'Choose the most observable early signal and pair it with the prepared safe response.
      At the next natural cue, use the response if appropriate and record whether it occurred before,
      during or after the automatic behavior. Keep, change or discard the pairing based on what happened;
      a signal that is new, severe or medically concerning calls for appropriate care.


      Observation checks: One observable signal is paired with a specific response; The response timing
      is recorded on an actual opportunity; The cue-response pairing is retained or revised from evidence;
      Concerning symptoms are not treated as an emotional exercise. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which cue was early and reliable enough to act on, and when did the chosen response
      stop being useful?


      Examples: Supportive: Shoulders rose before rapid inbox replies on both occasions, and standing
      up created enough delay to reread the next message.


      Mixed: A signal appeared, but only after the automatic response on one occasion and before it on
      another.


      Contradictory: Chest pain was presumed to be mere stress and used to avoid appropriate medical attention.


      Inconclusive: A body map was completed once without a natural cue, comparison or tested response.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-0702-BODY-BASED-EMOTIONAL-AWARENESS-01-A3
      competency_stable_id: '07.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
