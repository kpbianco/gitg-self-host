      Body-based emotional awareness; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use external cues such as speech speed, hand pressure or pacing if internal sensation is hard to
      access. Choose orienting, movement or consultation instead of breath work when breath attention
      is unpleasant. Do not provoke activation; a neutral scripted scenario tests recognition only.
    cultural_context:
    - Adapt the expression of Body-based emotional awareness to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use external cues such as speech speed, hand pressure or pacing if internal sensation is hard to
      access. Choose orienting, movement or consultation instead of breath work when breath attention
      is unpleasant. Do not provoke activation; a neutral scripted scenario tests recognition only.
  pause_conditions:
  - Pause Body-based emotional awareness when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Body-based emotional awareness practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Body-based emotional awareness situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
