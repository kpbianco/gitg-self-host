        - completed_work_is_compared_with_the_stated_requirement
        - care_is_assessed_by_its_relation_to_responsible_action
        - further_shortfalls_prompt_communication_or_revision_rather_than_punishment
      - measurement_id: c0710_a3_boundary
        kind: boolean
