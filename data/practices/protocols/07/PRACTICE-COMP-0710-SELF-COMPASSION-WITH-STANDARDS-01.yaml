    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default of missing a self-imposed study session. Divide a page into punishment, indulgence
    and accountable care. Prepare one sentence you would say to a respected peer while still naming the
    missed commitment. Goal: Respond to a setback with the care needed to remain functional while preserving
    accurate responsibility, consequences, effort and a concrete renewed action. Scope: This tests one
    post-failure response; it does not excuse harm, require positive self-esteem or treat severe depression,
    trauma or persistent self-hatred. Time and effort: Two 15-minute passes and one 10–30 minute repair
    or renewed attempt within an appropriate timeframe. Adaptation: Use a voice note, checklist or trusted
    support person. A fictional missed-session case practices the distinction but does not demonstrate
    personal follow-through. When self-criticism includes self-harm risk or severe persistent symptoms,
    use crisis or qualified care rather than this exercise alone. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a voice note, checklist or trusted support person. A fictional missed-session
    case practices the distinction but does not demonstrate personal follow-through. When self-criticism
    includes self-harm risk or severe persistent symptoms, use crisis or qualified care rather than this
    exercise alone.
  expected_burden: Two 15-minute passes and one 10–30 minute repair or renewed attempt within an appropriate
    timeframe.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Self-compassion with standards protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Self-compassion with standards action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a voice
    note, checklist or trusted support person. A fictional missed-session case practices the distinction
    but does not demonstrate personal follow-through. When self-criticism includes self-harm risk or severe
    persistent symptoms, use crisis or qualified care rather than this exercise alone.
  actions:
  - stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A1
    sequence: 1
    title: Write the failure at the level of fact and responsibility
    instructions: 'State what was expected, what occurred, the effect and which choice or constraint mattered.
      Write the punishing response that attacks worth and the indulgent response that denies impact, then
      reject both inaccuracies. Produce an accountable-care sentence such as I missed tonight''s session
      after overscheduling; the work remains, and rest plus a smaller restart is more useful than contempt.


      Observation checks: Expectation event impact and responsibility are specific; Punishment and indulgence
      are identified separately; The revised response neither attacks worth nor erases impact; Constraints
      are included without becoming automatic excuses. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A1
      competency_stable_id: '07.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0710_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0710_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - expectation_event_impact_and_responsibility_are_specific
        - punishment_and_indulgence_are_identified_separately
        - the_revised_response_neither_attacks_worth_nor_erases_impact
        - constraints_are_included_without_becoming_automatic_excuses
      - measurement_id: c0710_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0710_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A2
    sequence: 2
    title: Design care, repair and consequence as distinct actions
    instructions: 'Choose one stabilizing care action, one repair for anyone affected and one proportionate
      consequence or schedule adjustment. Keep care available even when repair is owed. For the default,
      take the needed sleep, tell the study partner the truth and replace the oversized session with a
      defined 20-minute block; do not add punitive deprivation or cancel every standard.


      Observation checks: Care repair and consequence each have a concrete form; Care is not made conditional
      on earning worth; Repair addresses an actual impact without demanding reassurance; The revised standard
      remains meaningful and feasible. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A2
      competency_stable_id: '07.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0710_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0710_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - care_repair_and_consequence_each_have_a_concrete_form
        - care_is_not_made_conditional_on_earning_worth
        - repair_addresses_an_actual_impact_without_demanding_reassurance
        - the_revised_standard_remains_meaningful_and_feasible
      - measurement_id: c0710_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0710_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A3
    sequence: 3
    title: Complete the renewed action and compare its effect
    instructions: 'Carry out the safe repair and the next defined attempt. Compare whether punishment,
      indulgence or accountable care better supported truthful follow-through, using the completed behavior
      rather than mood alone. If the restart fails, keep the evidence and revise task size, support or
      timing; repeated impairment calls for appropriate help, not harsher self-attack.


      Observation checks: A repair and renewed attempt occur or are honestly deferred; Follow-through
      rather than mood alone informs the comparison; A failed restart leads to a specific design revision;
      Persistent impairment is not answered with escalating punishment. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which form of care made responsibility more actionable, and what consequence still
      needs to be carried?


      Examples: Supportive: The person rested, acknowledged the missed commitment, completed a smaller
      restart and retained the real deadline consequence.


      Mixed: The compassionate statement was accurate, but the repair occurred while the renewed attempt
      remained oversized.


      Contradictory: Care was treated as permission to deny harm, or accountability became sleep deprivation
      and global self-condemnation.


      Inconclusive: Kind words were written without identifying responsibility, repair, consequence or
      renewed action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A3
      competency_stable_id: '07.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
