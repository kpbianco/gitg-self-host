meaning_and_fit:
  purpose: Respond to a setback with the care needed to remain functional while preserving accurate responsibility,
    consequences, effort and a concrete renewed action.
  why_recommended: Respond to a setback with the care needed to remain functional while preserving accurate
    responsibility, consequences, effort and a concrete renewed action.
  claims:
