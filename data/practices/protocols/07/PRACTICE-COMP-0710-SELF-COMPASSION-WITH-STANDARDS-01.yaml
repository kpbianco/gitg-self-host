    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Self-compassion with standards practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Self-compassion with standards as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a voice note, checklist or trusted support person. A fictional missed-session
    case practices the distinction but does not demonstrate personal follow-through. When self-criticism
    includes self-harm risk or severe persistent symptoms, use crisis or qualified care rather than this
    exercise alone.
  opportunity_considerations: Use the default of missing a self-imposed study session. Divide a page into
    punishment, indulgence and accountable care. Prepare one sentence you would say to a respected peer
    while still naming the missed commitment.
  prerequisites:
  - Use the default of missing a self-imposed study session. Divide a page into punishment, indulgence
