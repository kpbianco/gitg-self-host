      a responsible plan; they do not have to be earned through distress. This exercise does not adjudicate
      employment, care or legal obligations.
    cultural_context:
    - Adapt the expression of Self-compassion with standards to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use voice notes, a trusted helper or a smaller legitimate scope. Rest and support can be part of
      a responsible plan; they do not have to be earned through distress. This exercise does not adjudicate
      employment, care or legal obligations.
  pause_conditions:
  - Pause Self-compassion with standards when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Self-compassion with standards practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Self-compassion with standards situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
