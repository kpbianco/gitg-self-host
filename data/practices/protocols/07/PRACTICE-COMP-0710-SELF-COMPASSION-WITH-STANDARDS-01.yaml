meaning_and_fit:
  purpose: Offer a humane response to suffering while preserving responsibility, reasonable consequences
    and a concrete renewed effort.
  why_recommended: Offer a humane response to suffering while preserving responsibility, reasonable consequences
    and a concrete renewed effort.
  claims:
  - statement: Offer a humane response to suffering while preserving responsibility, reasonable consequences
      and a concrete renewed effort.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Self-compassion with standards practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Self-compassion with standards as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use voice notes, a trusted helper or a smaller legitimate scope. Rest and
    support can be part of a responsible plan; they do not have to be earned through distress. This exercise
    does not adjudicate employment, care or legal obligations.
  opportunity_considerations: 'Use a manageable disappointment or this case: you missed a promised contribution
    because you took on more than you could realistically do. Someone else had to adjust their plans.
    You feel like either abandoning the commitment or working without rest to make up for it. Use a private
    note and the actual agreed requirement if available.'
  prerequisites:
  - 'Use a manageable disappointment or this case: you missed a promised contribution because you took
    on more than you could realistically do. Someone else had to adjust their plans. You feel like either
    abandoning the commitment or working without rest to make up for it. Use a private note and the actual
    agreed requirement if available.'
  dependencies: []
  safe_alternatives:
  - Use voice notes, a trusted helper or a smaller legitimate scope. Rest and support can be part of a
    responsible plan; they do not have to be earned through distress. This exercise does not adjudicate
    employment, care or legal obligations.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Self-compassion with standards differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Self-compassion with standards
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a manageable disappointment or this case: you missed a promised contribution because you
    took on more than you could realistically do. Someone else had to adjust their plans. You feel like
    either abandoning the commitment or working without rest to make up for it. Use a private note and
    the actual agreed requirement if available. Goal: Offer a humane response to suffering while preserving
    responsibility, reasonable consequences and a concrete renewed effort. Scope: One ordinary failure
    response explores self-compassion with accountability. Kind language alone is not repair, and meeting
    a standard is not a measure of human worth. Time and effort: About 15 minutes of reflection, one feasible
    repair or work step and a later check of the revised commitment. Adaptation: Use voice notes, a trusted
    helper or a smaller legitimate scope. Rest and support can be part of a responsible plan; they do
    not have to be earned through distress. This exercise does not adjudicate employment, care or legal
    obligations. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use voice notes, a trusted helper or a smaller legitimate scope. Rest and support
    can be part of a responsible plan; they do not have to be earned through distress. This exercise does
    not adjudicate employment, care or legal obligations.
  expected_burden: About 15 minutes of reflection, one feasible repair or work step and a later check
    of the revised commitment.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Self-compassion with standards protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Self-compassion with standards action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use voice notes,
    a trusted helper or a smaller legitimate scope. Rest and support can be part of a responsible plan;
    they do not have to be earned through distress. This exercise does not adjudicate employment, care
    or legal obligations.
  actions:
  - stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A1
    sequence: 1
    title: Write a caring response that does not erase the consequence
    instructions: 'Address yourself as you would a person whose dignity matters and whose conduct still
      has effects. Write three sentences: this is difficult because; the specific responsibility I own
      is; and this failure does not establish a verdict on my whole person. For the case, acknowledge
      disappointment and overload while retaining the missed promise and the other person''s inconvenience.
      Remove both punishment such as I must not rest until I deserve it and indulgence such as nobody
      should expect anything from me. If the obligation was impossible or coercive, examine that fact
      rather than automatically accepting its standard.


      Observation checks: Suffering is acknowledged in specific humane language; Real responsibility and
      impact remain visible; Punishment and blanket absolution are both identified; The standard is checked
      for legitimacy and feasibility. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A1
      competency_stable_id: '07.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0710_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0710_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - suffering_is_acknowledged_in_specific_humane_language
        - real_responsibility_and_impact_remain_visible
        - punishment_and_blanket_absolution_are_both_identified
        - the_standard_is_checked_for_legitimacy_and_feasibility
      - measurement_id: c0710_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0710_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A2
    sequence: 2
    title: Define the smallest repair that still respects the real standard
    instructions: 'Specify what needs correction, what acceptable work would contain, what support or
      reduced scope is needed and which consequence cannot simply be undone. In the case, contact the
      affected person with a realistic deliverable and date, ask whether it is still useful and acknowledge
      that their earlier inconvenience remains. Do not promise impossible extra work to purchase relief
      from guilt. If the original contribution is no longer useful, ask about an appropriate correction
      rather than completing it solely to feel redeemed. Keep the standard observable, such as supplying
      the two agreed missing sections, instead of proving you are hardworking.


      Observation checks: The repair targets an actual impact or unmet requirement; Acceptable work is
      concretely defined; Capacity and needed support shape the revised commitment; Unavoidable consequences
      are not denied. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A2
      competency_stable_id: '07.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0710_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0710_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_repair_targets_an_actual_impact_or_unmet_requirement
        - acceptable_work_is_concretely_defined
        - capacity_and_needed_support_shape_the_revised_commitment
        - unavoidable_consequences_are_not_denied
      - measurement_id: c0710_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0710_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A3
    sequence: 3
    title: Attempt the repair and assess whether your inner response supported action
    instructions: 'Do the first feasible part of the agreed correction, or work through a small example
      if the case is fictional. Record what was completed, what remains and whether you used care to support
      effort or to avoid the standard. At the next agreed checkpoint, compare the actual work with the
      stated requirement. If it still falls short, revise scope, obtain help or communicate the delay
      rather than using self-attack as a substitute for action. A reassuring sentence can be retained,
      but only the actual behavior shows whether renewed effort occurred.


      Observation checks: A feasible correction or explicit worked example is attempted; Completed work
      is compared with the stated requirement; Care is assessed by its relation to responsible action;
      Further shortfalls prompt communication or revision rather than punishment. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Did the response make repair more possible while retaining the consequence and a realistic
      standard? Keep the sentence or support that helped and revise one overcommitment. Feeling better
      and performing better remain separate observations.


      Examples: Supportive: The person acknowledged overload and the missed promise, agreed a useful smaller
      deliverable and completed it without a punitive catch-up schedule.


      Mixed: The kinder response supported a first work step, but the revised date was still unrealistic
      and had to be renegotiated.


      Contradictory: Self-compassion was used to deny the effect on others, or accountability became deprivation
      and an impossible promise of perfection.


      Inconclusive: An encouraging statement was written without identifying responsibility, a legitimate
      standard or any attempted correction.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0710-SELF-COMPASSION-WITH-STANDARDS-01-A3
