meaning_and_fit:
  purpose: Name what was lost, what remains and what expectations changed, then make room for sorrow while
    choosing one form of remembrance, support and continued living.
  why_recommended: Name what was lost, what remains and what expectations changed, then make room for
    sorrow while choosing one form of remembrance, support and continued living.
  claims:
  - statement: Name what was lost, what remains and what expectations changed, then make room for sorrow
      while choosing one form of remembrance, support and continued living.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Grief responses vary between people and can follow losses other than bereavement; support
      is available when coping is difficult.
    classification: safety_precaution
    source_ids:
    - SRC-NHS-GRIEF-AND-LOSS
    limitations: Supports acknowledging varied responses and appropriate support. It does not validate
      this educational exercise, prescribe a grief timetable or establish readiness for personal loss
      reflection.
  applicability_question: Does a voluntary, bounded Sadness, grief, and loss practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Sadness, grief, and loss as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use objects, images, music without quoted lyrics, brief dictation or a support
    person. A fictional case practices the structure but is not evidence of grieving a real loss. For
    recent, traumatic, function-impairing or unsafe grief, use appropriate personal, spiritual, medical
    or mental-health support instead.
  opportunity_considerations: Choose a loss safe enough to approach, such as the end of a hobby group,
    a missed opportunity or a familiar place closing. Use a fictional case if personal grief is too close.
    Prepare three headings—lost, remaining and now changed—and one ordinary care obligation that still
    needs attention.
  prerequisites:
  - Choose a loss safe enough to approach, such as the end of a hobby group, a missed opportunity or a
    familiar place closing. Use a fictional case if personal grief is too close. Prepare three headings—lost,
    remaining and now changed—and one ordinary care obligation that still needs attention.
  dependencies: []
  safe_alternatives:
  - Use objects, images, music without quoted lyrics, brief dictation or a support person. A fictional
    case practices the structure but is not evidence of grieving a real loss. For recent, traumatic, function-impairing
    or unsafe grief, use appropriate personal, spiritual, medical or mental-health support instead.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Sadness, grief, and loss differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Sadness, grief, and loss as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a loss safe enough to approach, such as the end of a hobby group, a missed opportunity
    or a familiar place closing. Use a fictional case if personal grief is too close. Prepare three headings—lost,
    remaining and now changed—and one ordinary care obligation that still needs attention. Goal: Name
    what was lost, what remains and what expectations changed, then make room for sorrow while choosing
    one form of remembrance, support and continued living. Scope: This uses a manageable loss and does
    not prescribe a grief timetable, require positive meaning or replace bereavement, medical or mental-health
    support. Time and effort: One private 20-minute reflection, one 10–20 minute remembrance or support
    action and a later 10-minute review. Adaptation: Use objects, images, music without quoted lyrics,
    brief dictation or a support person. A fictional case practices the structure but is not evidence
    of grieving a real loss. For recent, traumatic, function-impairing or unsafe grief, use appropriate
    personal, spiritual, medical or mental-health support instead. Keep personal working notes outside
    the check-in; record only the listed observations.


    Reference support:

    Grief after bereavement or loss: https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/grief-bereavement-loss/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use objects, images, music without quoted lyrics, brief dictation or a support
    person. A fictional case practices the structure but is not evidence of grieving a real loss. For
    recent, traumatic, function-impairing or unsafe grief, use appropriate personal, spiritual, medical
    or mental-health support instead.
  expected_burden: One private 20-minute reflection, one 10–20 minute remembrance or support action and
    a later 10-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Sadness, grief, and loss protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Sadness, grief, and loss action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use objects,
    images, music without quoted lyrics, brief dictation or a support person. A fictional case practices
    the structure but is not evidence of grieving a real loss. For recent, traumatic, function-impairing
    or unsafe grief, use appropriate personal, spiritual, medical or mental-health support instead.
  actions:
  - stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A1
    sequence: 1
    title: Describe the loss without erasing either sorrow or continuity
    instructions: 'Name the person, role, future, place or routine that is absent and the expectation
      that changed. Add what genuinely remains, such as a skill, relationship, responsibility or memory,
      without calling the loss beneficial. Record the present feeling and intensity, and stop if the chosen
      material becomes too destabilizing for self-guided reflection.


      Observation checks: The lost good and changed expectation are specific; What remains is named without
      canceling the loss; Present feeling and intensity receive an honest entry; The exercise stops or
      narrows when self-guided reflection is unsuitable. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01
      action_stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A1
      competency_stable_id: '07.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0706_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0706_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_lost_good_and_changed_expectation_are_specific
        - what_remains_is_named_without_canceling_the_loss
        - present_feeling_and_intensity_receive_an_honest_entry
        - the_exercise_stops_or_narrows_when_self_guided_reflection_is_unsuitable
      - measurement_id: c0706_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
