  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Sadness, grief, and loss explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Sadness, grief, and loss context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Sadness, grief, and loss observation requires a distinct immutable origin; duplicate
