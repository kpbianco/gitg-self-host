meaning_and_fit:
  purpose: Name what has been lost, allow an honest response, and combine remembrance, support and a realistic
    next part of living without demanding that sorrow disappear.
  why_recommended: Name what has been lost, allow an honest response, and combine remembrance, support
    and a realistic next part of living without demanding that sorrow disappear.
  claims:
  - statement: Name what has been lost, allow an honest response, and combine remembrance, support and
      a realistic next part of living without demanding that sorrow disappear.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Worsening symptoms and severe persistent distress affecting usual activities call for professional
      help; suicidal thoughts or urges to self-harm call for immediate help.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-SELF-HELP-LIMITS
    limitations: Public help-seeking guidance, not a diagnosis or validated product screening tool. The
      source's duration examples are not instructions to wait during danger or deterioration. It does
      not validate the original emotional-awareness, hope or strategy-transfer exercises.
  - statement: Grief responses vary between people and can follow losses other than bereavement; support
      is available when coping is difficult.
    classification: safety_precaution
    source_ids:
    - SRC-NHS-GRIEF-AND-LOSS
    limitations: Supports acknowledging varied responses and appropriate support. It does not validate
      this educational exercise, prescribe a grief timetable or establish readiness for personal loss
      reflection.
  applicability_question: Does a voluntary, bounded Sadness, grief, and loss practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Sadness, grief, and loss as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a secular, religious, silent, spoken or sensory-accessible form. For an
    overwhelming or recent loss, use the fictional case or defer and seek suitable support. Persistent
    difficulty coping or impaired functioning deserves qualified help; immediate safety concerns take
    priority over this practice.
  opportunity_considerations: 'Use a loss you freely choose to approach, or this fictional case: a weekly
    community gathering has ended, leaving someone missing companionship and a familiar role. Keep a private
    note and an optional object, image or song that is appropriate to the loss. Read the NHS grief reference
    for the variability of responses and help options.'
  prerequisites:
  - 'Use a loss you freely choose to approach, or this fictional case: a weekly community gathering has
    ended, leaving someone missing companionship and a familiar role. Keep a private note and an optional
    object, image or song that is appropriate to the loss. Read the NHS grief reference for the variability
    of responses and help options.'
  dependencies: []
  safe_alternatives:
  - Use a secular, religious, silent, spoken or sensory-accessible form. For an overwhelming or recent
    loss, use the fictional case or defer and seek suitable support. Persistent difficulty coping or impaired
    functioning deserves qualified help; immediate safety concerns take priority over this practice.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Sadness, grief, and loss differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Sadness, grief, and loss as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a loss you freely choose to approach, or this fictional case: a weekly community gathering
    has ended, leaving someone missing companionship and a familiar role. Keep a private note and an optional
    object, image or song that is appropriate to the loss. Read the NHS grief reference for the variability
    of responses and help options. Goal: Name what has been lost, allow an honest response, and combine
    remembrance, support and a realistic next part of living without demanding that sorrow disappear.
    Scope: A small remembrance-and-continuation practice explores grief and changed expectations. It cannot
    measure recovery, prescribe a grief timetable or require positive meaning from a loss. Time and effort:
    Three brief periods over several days; shorten, postpone or use the fictional case if approaching
    the loss is too much. Adaptation: Use a secular, religious, silent, spoken or sensory-accessible form.
    For an overwhelming or recent loss, use the fictional case or defer and seek suitable support. Persistent
    difficulty coping or impaired functioning deserves qualified help; immediate safety concerns take
    priority over this practice. Keep personal working notes outside the check-in; record only the listed
    observations.


    Reference support:

    My Mental Health: Do I Need Help?: https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help

    Grief after bereavement or loss: https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/grief-bereavement-loss/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a secular, religious, silent, spoken or sensory-accessible form. For an overwhelming
    or recent loss, use the fictional case or defer and seek suitable support. Persistent difficulty coping
    or impaired functioning deserves qualified help; immediate safety concerns take priority over this
    practice.
  expected_burden: Three brief periods over several days; shorten, postpone or use the fictional case
    if approaching the loss is too much.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Sadness, grief, and loss protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Sadness, grief, and loss action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a secular,
    religious, silent, spoken or sensory-accessible form. For an overwhelming or recent loss, use the
    fictional case or defer and seek suitable support. Persistent difficulty coping or impaired functioning
    deserves qualified help; immediate safety concerns take priority over this practice.
  actions:
  - stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A1
    sequence: 1
    title: Name the loss and the expectations that no longer fit
    instructions: 'Complete three statements: what is no longer available; what I miss or feel, including
      numbness or uncertainty; and which ordinary expectation now needs revision. In the supplied case,
      the gathering, casual companionship and the expectation of a ready-made weekly plan are different
      losses. Add what remains without using it to cancel what is gone. Avoid ranking the loss against
      someone else''s or assigning yourself a stage you should have reached. If using the case, distinguish
      the stated loss from an imagined emotional response.


      Observation checks: The loss is named in concrete terms; The present response is allowed without
      a prescribed stage; A changed expectation is identified; What remains does not minimize what was
      lost. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01
      action_stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A1
      competency_stable_id: '07.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0706_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0706_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_loss_is_named_in_concrete_terms
        - the_present_response_is_allowed_without_a_prescribed_stage
        - a_changed_expectation_is_identified
        - what_remains_does_not_minimize_what_was_lost
      - measurement_id: c0706_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0706_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A2
    sequence: 2
    title: Choose a bounded act of remembrance and a form of support
    instructions: 'Choose a small act that fits the loss and your beliefs: write one memory, quietly view
      an image, say a prayer, play a meaningful song or set aside a brief moment without words. Carry
      it out if freely chosen; no public disclosure is required. Then name a support preference, such
      as company without advice or help changing a routine. Ask an appropriate willing person if useful,
      allowing them to decline. For the fictional gathering, draft a short memory and a request to keep
      one existing connection; do not claim that someone received support from a fictional exchange.


      Observation checks: A fitting remembrance or acknowledgment is actually performed; The act follows
      the person''s beliefs and choice; A specific support preference is articulated; A request is distinguished
      from support actually received. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01
      action_stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A2
      competency_stable_id: '07.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0706_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0706_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_fitting_remembrance_or_acknowledgment_is_actually_performed
        - the_act_follows_the_person_s_beliefs_and_choice
        - a_specific_support_preference_is_articulated
        - a_request_is_distinguished_from_support_actually_received
      - measurement_id: c0706_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0706_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A3
    sequence: 3
    title: Carry one valued element into a changed ordinary day
    instructions: 'Choose a modest next action consistent with both the loss and current capacity. In
      the supplied case, carry companionship forward through an invitation to a brief conversation while
      acknowledging that the old gathering cannot be recreated by that invitation. In a personal context,
      attempt the chosen action and note what it made possible and what still hurt. A revised expectation
      might be leaving the former meeting time partly unplanned rather than immediately replacing the
      whole activity. Review whether further support is needed; continued difficulty is not a failure
      of remembrance or effort.


      Observation checks: The next action carries a named value into changed circumstances; Actual action
      and fictional planning remain distinct; Continuing sorrow is recorded without a recovery deadline;
      Support needs and changed expectations are reviewed. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What was lost, what remains, and what do you want to carry forward without pretending
      the loss has been replaced? Keep the support preference and revise one expectation. Completion says
      nothing about how long grief should last.


      Examples: Supportive: A memory of the ended gathering was honored, one connection was contacted
      and the empty weekly time was acknowledged without claiming the loss was solved.


      Mixed: Remembrance mattered but the invitation was declined; the person retained the loss and considered
      a different source of companionship.


      Contradictory: The person forced a cheerful meaning, treated ongoing sorrow as disobedience or demanded
      disclosure to prove they had processed the loss.


      Inconclusive: General advice about moving on was collected without naming the loss, acknowledging
      it or choosing a realistic continuation.'
    expected_time: 15-25 minutes
    due_within_days: 10
