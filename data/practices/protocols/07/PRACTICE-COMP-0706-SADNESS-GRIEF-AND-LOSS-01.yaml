  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Sadness, grief, and loss; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use a secular, religious, silent, spoken or sensory-accessible form. For an overwhelming or recent
      loss, use the fictional case or defer and seek suitable support. Persistent difficulty coping or
      impaired functioning deserves qualified help; immediate safety concerns take priority over this
      practice.
    cultural_context:
    - Adapt the expression of Sadness, grief, and loss to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a secular, religious, silent, spoken or sensory-accessible form. For an overwhelming or recent
      loss, use the fictional case or defer and seek suitable support. Persistent difficulty coping or
      impaired functioning deserves qualified help; immediate safety concerns take priority over this
      practice.
  pause_conditions:
  - Pause Sadness, grief, and loss when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Sadness, grief, and loss practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Sadness, grief, and loss situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
