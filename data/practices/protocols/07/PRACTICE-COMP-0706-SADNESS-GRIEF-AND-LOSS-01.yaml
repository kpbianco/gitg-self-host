        expected: true
  - stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A2
    sequence: 2
    title: Choose remembrance and support that fit this loss
    instructions: 'Complete one bounded act such as saving a photo, writing the group''s final date, visiting
      the place, observing a fitting ritual or telling a willing person what is missed. Also make or accept
      one specific support request, even if it is simply company during a routine task. A private ritual
      is valid; public disclosure, gratitude and closure are not required.


      Observation checks: A concrete remembrance act is completed; One specific support request or accepted
      offer occurs; Participation and disclosure remain voluntary; The action does not demand closure
      or a positive interpretation. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01
      action_stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A2
      competency_stable_id: '07.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0706_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0706_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_concrete_remembrance_act_is_completed
        - one_specific_support_request_or_accepted_offer_occurs
        - participation_and_disclosure_remain_voluntary
        - the_action_does_not_demand_closure_or_a_positive_interpretation
      - measurement_id: c0706_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0706_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0706-SADNESS-GRIEF-AND-LOSS-01-A3
    sequence: 3
    title: Carry one changed responsibility into ordinary life
    instructions: 'Choose one action that continues life under the changed conditions: attend the next
      class elsewhere, update a calendar, care for a remaining responsibility or schedule qualified support.
      Complete it or record why it must wait. Later, name what the action carried forward and what sorrow
      or uncertainty remains rather than claiming resolution.


      Observation checks: A continued-life action fits the changed circumstances; The action is completed
      or honestly deferred; What is carried forward and what remains painful are both named; Need for
      additional support is reviewed without a deadline. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: What deserves remembrance, what still needs carrying, and which expectation now has
      to change?


      Examples: Supportive: The person named the lost weekly group, kept one friendship, archived a photo
      and registered for one replacement session without calling the loss good.


      Mixed: A remembrance was completed and support accepted, but the new routine is not yet workable.


      Contradictory: The loss was minimized, rushed into gratitude or used to impose a required timetable
      for closure.


      Inconclusive: General thoughts about grief were recorded without identifying a loss, remembrance,
      support or changed action.'
    expected_time: 15-25 minutes
