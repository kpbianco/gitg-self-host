        - one_assumption_is_checked_through_an_appropriate_source
        - any_relational_request_preserves_the_other_person_s_agency
        - monitoring_control_and_entitlement_are_rejected
      - measurement_id: c0708_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
