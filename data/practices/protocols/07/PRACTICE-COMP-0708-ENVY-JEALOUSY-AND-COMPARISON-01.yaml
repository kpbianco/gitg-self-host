meaning_and_fit:
  purpose: Distinguish admiration, threatened need, insecurity, scarcity belief, relational fear and possessiveness
    within envy or jealousy, then choose gratitude, learning, a boundary or a goal.
  why_recommended: Distinguish admiration, threatened need, insecurity, scarcity belief, relational fear
    and possessiveness within envy or jealousy, then choose gratitude, learning, a boundary or a goal.
  claims:
  - statement: Distinguish admiration, threatened need, insecurity, scarcity belief, relational fear and
      possessiveness within envy or jealousy, then choose gratitude, learning, a boundary or a goal.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Envy, jealousy, and comparison practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Envy, jealousy, and comparison as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an invented recognition case or an anonymized media comparison. Rehearsal
    can test classification and response selection but not a live relationship. If jealousy occurs with
    coercion, stalking, abuse risk or severe distress, prioritize safety and qualified support.
  opportunity_considerations: Use the default of a peer receiving recognition you wanted. Make six headings—observable
    event, admired quality, threatened need, scarce-resource fact, relationship fear and controlling urge.
    Keep the peer unnamed and do not inspect their private information.
  prerequisites:
  - Use the default of a peer receiving recognition you wanted. Make six headings—observable event, admired
    quality, threatened need, scarce-resource fact, relationship fear and controlling urge. Keep the peer
    unnamed and do not inspect their private information.
  dependencies: []
  safe_alternatives:
  - Use an invented recognition case or an anonymized media comparison. Rehearsal can test classification
    and response selection but not a live relationship. If jealousy occurs with coercion, stalking, abuse
    risk or severe distress, prioritize safety and qualified support.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Envy, jealousy, and comparison differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Envy, jealousy, and comparison
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default of a peer receiving recognition you wanted. Make six headings—observable event,
    admired quality, threatened need, scarce-resource fact, relationship fear and controlling urge. Keep
    the peer unnamed and do not inspect their private information. Goal: Distinguish admiration, threatened
    need, insecurity, scarcity belief, relational fear and possessiveness within envy or jealousy, then
    choose gratitude, learning, a boundary or a goal. Scope: One comparison episode can reveal a useful
    concern; it does not prove another person''s intent, justify control or establish a stable personality
    trait. Time and effort: Two private 10-minute analyses, one 10–20 minute response and a brief later
    review. Adaptation: Use an invented recognition case or an anonymized media comparison. Rehearsal
    can test classification and response selection but not a live relationship. If jealousy occurs with
    coercion, stalking, abuse risk or severe distress, prioritize safety and qualified support. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an invented recognition case or an anonymized media comparison. Rehearsal can
    test classification and response selection but not a live relationship. If jealousy occurs with coercion,
    stalking, abuse risk or severe distress, prioritize safety and qualified support.
  expected_burden: Two private 10-minute analyses, one 10–20 minute response and a brief later review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Envy, jealousy, and comparison protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Envy, jealousy, and comparison action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an invented
    recognition case or an anonymized media comparison. Rehearsal can test classification and response
    selection but not a live relationship. If jealousy occurs with coercion, stalking, abuse risk or severe
    distress, prioritize safety and qualified support.
  actions:
  - stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A1
    sequence: 1
    title: Separate admiration, threat and possession in the comparison
    instructions: 'Record what actually happened and rate the reaction. Under each heading, write a specific
      entry or not present. In the default, admiration may concern preparation, the threatened need may
      be recognition, the scarce resource may be one promotion, and the urge may be to belittle the peer.
      Treat these as hypotheses about your reaction, not claims about the peer.


      Observation checks: The event and reaction intensity are recorded; Admiration need scarcity fear
      and urge each have a disposition; Facts are separated from hypotheses about meaning; No private
      information or hostile motive is assigned. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01
      action_stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A1
      competency_stable_id: '07.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0708_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0708_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_event_and_reaction_intensity_are_recorded
        - admiration_need_scarcity_fear_and_urge_each_have_a_disposition
        - facts_are_separated_from_hypotheses_about_meaning
        - no_private_information_or_hostile_motive_is_assigned
      - measurement_id: c0708_a1_boundary
        kind: boolean
