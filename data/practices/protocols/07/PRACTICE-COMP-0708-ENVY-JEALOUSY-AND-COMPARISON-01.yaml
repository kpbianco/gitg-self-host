        expected: true
  - stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A2
    sequence: 2
    title: Test the scarcity and relationship assumptions
    instructions: 'Identify which desired goods are actually limited and which may have multiple routes.
      Check one available fact, policy or direct clarification without interrogating or monitoring anyone.
      If jealousy concerns a relationship, state the needed boundary or reassurance as a request and recognize
      the other person''s freedom; possession and surveillance are not care.


      Observation checks: Limited and nonexclusive goods are distinguished; One assumption is checked
      through an appropriate source; Any relational request preserves the other person''s agency; Monitoring
      control and entitlement are rejected. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01
      action_stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A2
      competency_stable_id: '07.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
