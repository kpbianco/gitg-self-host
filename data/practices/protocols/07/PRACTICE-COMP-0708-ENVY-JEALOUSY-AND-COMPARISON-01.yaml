        - the_chosen_route_addresses_the_identified_need
        - the_next_step_is_specific_enough_to_attempt
        - the_response_preserves_the_other_person_s_independent_choices
      - measurement_id: c0708_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0708_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A3
    sequence: 3
    title: Act on the chosen route and compare its effect with the original urge
    instructions: 'Perform the modest step: practice the identified technique on your own work, make an
      appropriate invitation, adjust your own comparison exposure or acknowledge a specific present good.
      Record the action and what changed in your choices, even if envy or jealousy remains. For the supplied
      cases, a private skill attempt is real practice, while a drafted invitation is only communication
      preparation until sent appropriately. Check whether the action moved toward the wanted good or merely
      hid competition behind praise. Revise the goal or request if the original interpretation was unsupported.


      Observation checks: A concrete constructive step is actually attempted; Its effect on choices is
      recorded separately from mood; Rehearsed communication is not described as a live agreement; Remaining
      comparison does not justify control or surveillance. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which wanted good became clearer, and did your action pursue it without diminishing
      someone else? Keep one learning step, request or self-directed boundary. Feeling less envy is possible
      but is not required proof of a useful choice.


      Examples: Supportive: Admiration for a peer''s clear explanation led to practicing a concise summary
      instead of undermining the peer''s recognition.


      Mixed: A request for time clarified a need for connection, but the friend was unavailable; the disappointment
      remained without an exclusivity demand.


      Contradictory: Jealousy was used to demand account access, restrict another person''s friendships
      or sabotage an admired person''s work.


      Inconclusive: The person declared comparison unhealthy but did not identify a wanted good or attempt
      a constructive alternative.'
    expected_time: 15-25 minutes
