completion_and_review:
  completion_criteria:
  - The identify the non-emergency boundary for envy, jealousy, and comparison action was attempted or
    explicitly deferred.
  - The prepare one safe envy, jealousy, and comparison support step action was attempted or explicitly
    deferred.
  - The review the envy, jealousy, and comparison plan against stop conditions action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0708_a1_primary
    - c0708_a2_primary
    - c0708_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Envy, jealousy, and comparison only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Envy, jealousy, and comparison across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Envy, jealousy, and comparison require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Envy, jealousy, and comparison criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Converts comparison into gratitude, boundary setting, learning,
      or a chosen goal.', what contradiction or missing context matters most, and should this Envy, jealousy,
      and comparison design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Envy, jealousy, and comparison design only when the context and burden
      remain appropriate.
    adapt: Change the Envy, jealousy, and comparison medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Envy, jealousy, and comparison when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Envy, jealousy, and comparison questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Envy, jealousy, and comparison criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Envy, jealousy, and comparison criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Envy, jealousy, and comparison criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Envy, jealousy, and comparison action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
