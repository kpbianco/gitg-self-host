meaning_and_fit:
  purpose: Identify the need, insecurity or admiration beneath envy or jealousy and choose a constructive
    response that respects both your agency and another person's freedom.
  why_recommended: Identify the need, insecurity or admiration beneath envy or jealousy and choose a constructive
    response that respects both your agency and another person's freedom.
  claims:
  - statement: Identify the need, insecurity or admiration beneath envy or jealousy and choose a constructive
      response that respects both your agency and another person's freedom.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Envy, jealousy, and comparison practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Envy, jealousy, and comparison as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the supplied sentence and technique without obtaining another person's
    work, or use a fictional friendship draft. Spoken or supported writing is suitable. If comparison
    concerns coercion or credible danger, prioritize support and safety rather than treating it as ordinary
    jealousy.
  opportunity_considerations: 'Use a manageable comparison or this case: a peer is praised for a clear
    explanation, and you think there is no room for your contribution. Their technique is to state the
    point before the details: Please reply by Friday so I can arrange the room. Your practice sentence
    is I need to arrange the room and was hoping to hear from you sometime soon; rewrite it with a clear
    request first. A second variation is that a friend spends time with someone else and you want to demand
    exclusive attention. Use a private note; no social-media account or personal disclosure is needed.'
  prerequisites:
  - 'Use a manageable comparison or this case: a peer is praised for a clear explanation, and you think
    there is no room for your contribution. Their technique is to state the point before the details:
    Please reply by Friday so I can arrange the room. Your practice sentence is I need to arrange the
    room and was hoping to hear from you sometime soon; rewrite it with a clear request first. A second
    variation is that a friend spends time with someone else and you want to demand exclusive attention.
    Use a private note; no social-media account or personal disclosure is needed.'
  dependencies: []
  safe_alternatives:
  - Use the supplied sentence and technique without obtaining another person's work, or use a fictional
    friendship draft. Spoken or supported writing is suitable. If comparison concerns coercion or credible
    danger, prioritize support and safety rather than treating it as ordinary jealousy.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Envy, jealousy, and comparison differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Envy, jealousy, and comparison
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a manageable comparison or this case: a peer is praised for a clear explanation, and you
    think there is no room for your contribution. Their technique is to state the point before the details:
    Please reply by Friday so I can arrange the room. Your practice sentence is I need to arrange the
    room and was hoping to hear from you sometime soon; rewrite it with a clear request first. A second
    variation is that a friend spends time with someone else and you want to demand exclusive attention.
    Use a private note; no social-media account or personal disclosure is needed. Goal: Identify the need,
    insecurity or admiration beneath envy or jealousy and choose a constructive response that respects
    both your agency and another person''s freedom. Scope: One comparison episode explores threatened
    needs and a practical response. It does not infer betrayal, diagnose attachment or require gratitude
    to erase a legitimate unmet need. Time and effort: About 20 minutes of analysis, one modest constructive
    action and a brief later review. Adaptation: Use the supplied sentence and technique without obtaining
    another person''s work, or use a fictional friendship draft. Spoken or supported writing is suitable.
    If comparison concerns coercion or credible danger, prioritize support and safety rather than treating
    it as ordinary jealousy. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the supplied sentence and technique without obtaining another person's work,
    or use a fictional friendship draft. Spoken or supported writing is suitable. If comparison concerns
    coercion or credible danger, prioritize support and safety rather than treating it as ordinary jealousy.
  expected_burden: About 20 minutes of analysis, one modest constructive action and a brief later review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Envy, jealousy, and comparison protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Envy, jealousy, and comparison action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the supplied
    sentence and technique without obtaining another person's work, or use a fictional friendship draft.
    Spoken or supported writing is suitable. If comparison concerns coercion or credible danger, prioritize
    support and safety rather than treating it as ordinary jealousy.
  actions:
  - stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A1
    sequence: 1
    title: Separate admiration and threatened needs from a scarcity story
    instructions: 'Describe the visible event, what you want, what you fear losing and what the event
      does not establish. In the praise case, admiration may point to a learnable skill, while the claim
      that another person''s recognition leaves none for you needs evidence. In the friendship variation,
      insecurity about connection differs from proof of betrayal. Examine whether the urge is to learn,
      obtain reassurance, withdraw, compete or control another person''s choices. Name any real scarcity,
      such as a single available role, without extending it into a verdict that all belonging or opportunity
      is scarce.


      Observation checks: The event is separated from a scarcity or betrayal interpretation; A wanted
      good and threatened need are named; Admiration and insecurity are both considered; Possessive or
      controlling urges are identified without justification. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01
      action_stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A1
      competency_stable_id: '07.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0708_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0708_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_event_is_separated_from_a_scarcity_or_betrayal_interpretation
        - a_wanted_good_and_threatened_need_are_named
        - admiration_and_insecurity_are_both_considered
        - possessive_or_controlling_urges_are_identified_without_justification
      - measurement_id: c0708_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0708_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A2
    sequence: 2
    title: Choose the response that fits the actual need
    instructions: 'Compare four routes and select the best fit: appreciate a present good without denying
      the missing one; set a boundary around your own participation; learn a specific admired skill; or
      pursue a chosen goal. For the praise case, identify one technique in the admired work and practice
      it on a small example. For the friendship case, request mutually welcome time rather than passwords,
      surveillance or exclusivity. Write the concrete next step and why it serves the underlying need.
      A boundary states your choices; it does not secretly turn another person''s independent relationship
      into disobedience.


      Observation checks: Appreciation boundary learning and goal routes are considered; The chosen route
      addresses the identified need; The next step is specific enough to attempt; The response preserves
      the other person''s independent choices. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01
      action_stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A2
      competency_stable_id: '07.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0708_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0708_a2_primary
        kind: artifact
        role: primary
        weight: '1'
