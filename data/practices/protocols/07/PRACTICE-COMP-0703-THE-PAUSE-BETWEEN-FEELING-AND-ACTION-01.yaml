meaning_and_fit:
  purpose: Create enough space between a strong feeling and a consequential action to choose deliberately
    while preserving the feeling's information and the issue that needs attention.
  why_recommended: Create enough space between a strong feeling and a consequential action to choose deliberately
    while preserving the feeling's information and the issue that needs attention.
  claims:
  - statement: Create enough space between a strong feeling and a consequential action to choose deliberately
      while preserving the feeling's information and the issue that needs attention.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded The pause between feeling and action practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record The pause between feeling and action as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a visual card, device reminder, prewritten message or support person.
    If speaking is unsafe or inaccessible, leave the situation and use an appropriate communication channel
    later. Do not use a pause to remain in danger, postpone urgent care or force another person to wait
    indefinitely.
  opportunity_considerations: 'Use the default of receiving a frustrating non-urgent message. Prepare
    a three-part pause card: notice one cue, use one 60–120 second action such as orienting, movement,
    prayer, writing or consultation, and state when you will return. Include an exception for emergencies
    and time-sensitive safety decisions.'
  prerequisites:
  - 'Use the default of receiving a frustrating non-urgent message. Prepare a three-part pause card: notice
    one cue, use one 60–120 second action such as orienting, movement, prayer, writing or consultation,
    and state when you will return. Include an exception for emergencies and time-sensitive safety decisions.'
  dependencies: []
  safe_alternatives:
  - Use a visual card, device reminder, prewritten message or support person. If speaking is unsafe or
    inaccessible, leave the situation and use an appropriate communication channel later. Do not use a
    pause to remain in danger, postpone urgent care or force another person to wait indefinitely.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    The pause between feeling and action differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about The pause between feeling
    and action as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default of receiving a frustrating non-urgent message. Prepare a three-part pause card:
    notice one cue, use one 60–120 second action such as orienting, movement, prayer, writing or consultation,
    and state when you will return. Include an exception for emergencies and time-sensitive safety decisions.
    Goal: Create enough space between a strong feeling and a consequential action to choose deliberately
    while preserving the feeling''s information and the issue that needs attention. Scope: A pause can
    interrupt one reaction; it is not emotional suppression, conflict resolution or proof of regulation
    across contexts. Immediate safety action should not be delayed. Time and effort: Fifteen minutes to
    prepare, one naturally occurring use and a 10-minute return-and-review. Adaptation: Use a visual card,
    device reminder, prewritten message or support person. If speaking is unsafe or inaccessible, leave
    the situation and use an appropriate communication channel later. Do not use a pause to remain in
    danger, postpone urgent care or force another person to wait indefinitely. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a visual card, device reminder, prewritten message or support person. If speaking
    is unsafe or inaccessible, leave the situation and use an appropriate communication channel later.
    Do not use a pause to remain in danger, postpone urgent care or force another person to wait indefinitely.
  expected_burden: Fifteen minutes to prepare, one naturally occurring use and a 10-minute return-and-review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the The pause between feeling and action protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed The pause between feeling and action action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a visual
    card, device reminder, prewritten message or support person. If speaking is unsafe or inaccessible,
    leave the situation and use an appropriate communication channel later. Do not use a pause to remain
    in danger, postpone urgent care or force another person to wait indefinitely.
  actions:
  - stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A1
    sequence: 1
    title: Define the reaction and the cost worth interrupting
    instructions: 'Name one likely trigger, early cue, automatic reaction and concrete cost. For the default:
      seeing the message, jaw tension, sending an immediate accusation and creating avoidable escalation.
      Distinguish the reaction you want to delay from the concern you still intend to address, and list
      any situation where pausing would create danger.


      Observation checks: Trigger cue reaction and likely cost are specific; The valid underlying concern
      remains explicit; Emergency or safety exceptions are named; The pause is not framed as permanent
      avoidance. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01
      action_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A1
      competency_stable_id: '07.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0703_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0703_a1_primary
        kind: artifact
