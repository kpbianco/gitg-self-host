        - a_clear_return_time_or_condition_is_stated
        - the_later_response_addresses_the_underlying_issue
        - the_full_sequence_is_rehearsed_twice
      - measurement_id: c0703_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0703_a2_adverse
        kind: boolean
