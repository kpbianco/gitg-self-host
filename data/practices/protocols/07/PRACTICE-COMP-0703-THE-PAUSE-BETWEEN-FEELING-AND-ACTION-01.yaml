      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded The pause between feeling and action practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record The pause between feeling and action as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a written message, supported communication or a longer explicitly agreed
    return period. Skip body-focused methods if they are uncomfortable. During danger, prioritize safety
    and appropriate help; the exercise is for ordinary consequential reactions, not crisis delay.
  opportunity_considerations: 'Use an ordinary low-stakes disagreement or this case: someone writes that
