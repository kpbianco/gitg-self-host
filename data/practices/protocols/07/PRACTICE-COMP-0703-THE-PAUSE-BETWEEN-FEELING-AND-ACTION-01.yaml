        expected: true
  - stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A2
    sequence: 2
    title: Rehearse the complete pause and return sequence
    instructions: 'Read the sample message, notice the cue and do the chosen brief action. Draft a holding
      statement such as I want to answer this carefully; I will reply by 3 p.m. Then write the first sentence
      of the later response, addressing the actual issue without accusation. Repeat once with a slightly
      different message so the sequence is usable rather than merely described.


      Observation checks: A cue activates the selected brief pause; A clear return time or condition is
      stated; The later response addresses the underlying issue; The full sequence is rehearsed twice.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01
      action_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A2
      competency_stable_id: '07.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0703_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0703_a2_primary
        kind: artifact
        role: primary
