        - the_valid_underlying_concern_remains_explicit
        - emergency_or_safety_exceptions_are_named
        - the_pause_is_not_framed_as_permanent_avoidance
      - measurement_id: c0703_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
