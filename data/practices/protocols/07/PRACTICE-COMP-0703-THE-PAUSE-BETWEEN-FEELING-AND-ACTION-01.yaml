intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an ordinary low-stakes disagreement or this case: someone writes that your contribution
    was late, but the agreed deadline was unclear. You want to reply that they are always unfair. Use
    an unsent draft; no real recipient is needed for rehearsal. Goal: Create room between an emotional
    urge and a consequential reaction while preserving both the feeling and a concrete route back to the
    underlying issue. Scope: One pause-and-return sequence practices response choice. It is not a demand
    to be calm before speaking, suppress emotion, tolerate mistreatment or delay urgent protective action.
    Time and effort: About 10 minutes to prepare, a chosen brief pause during one opportunity, and 10
    minutes to review the return. Adaptation: Use a written message, supported communication or a longer
    explicitly agreed return period. Skip body-focused methods if they are uncomfortable. During danger,
    prioritize safety and appropriate help; the exercise is for ordinary consequential reactions, not
    crisis delay. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written message, supported communication or a longer explicitly agreed return
    period. Skip body-focused methods if they are uncomfortable. During danger, prioritize safety and
    appropriate help; the exercise is for ordinary consequential reactions, not crisis delay.
  expected_burden: About 10 minutes to prepare, a chosen brief pause during one opportunity, and 10 minutes
    to review the return.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the The pause between feeling and action protocol to rank worth, coerce participation, demand
