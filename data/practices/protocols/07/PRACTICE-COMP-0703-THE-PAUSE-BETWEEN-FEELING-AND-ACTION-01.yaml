  - stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A2
    sequence: 2
    title: Perform the pause before sending or committing to the reaction
    instructions: 'When the ordinary opportunity occurs, leave the consequential response unsent and carry
      out the selected pause. If another person is waiting, use a direct statement such as I want to answer
      this carefully; I will return to the deadline question this afternoon. Do not require them to soothe
      you or punish them with unexplained silence. In rehearsal, read the fictional message, speak the
      pause statement and actually set aside the draft before reconsidering it. Record whether the pause
      preceded the reaction; imagining a pause afterward is not the same event.


      Observation checks: The chosen pause is actually performed; Its timing relative to the reaction
      is recorded; Any delay is communicated proportionately; Rehearsal is distinguished from a live disagreement.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01
      action_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A2
      competency_stable_id: '07.03'
