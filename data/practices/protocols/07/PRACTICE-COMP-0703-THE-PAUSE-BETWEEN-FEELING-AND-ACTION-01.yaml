        expected: true
  - stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A3
    sequence: 3
    title: Use the pause once and verify that you returned
    instructions: 'At one safe natural opportunity, use the cue, pause action and holding statement as
      needed. Record whether the consequential reaction was delayed, whether you returned when promised
      and how the eventual response handled the issue. If no opportunity occurs, retain this as rehearsal
      evidence only rather than claiming a prevented reaction.


      Observation checks: An actual opportunity or its absence is recorded; The reaction is delayed without
      denying the feeling; The issue receives the promised return; Any failure to return or added harm
      remains visible. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Did the pause improve the eventual action, and what would make returning to the issue
      more reliable?


      Examples: Supportive: The person sent a timed holding message, walked briefly and returned with
      a specific question instead of an accusation.


      Mixed: The immediate reply was prevented, but the promised return was late and needed repair.


      Contradictory: The pause became silent punishment, indefinite avoidance or a delay during an urgent
      safety problem.


      Inconclusive: A calming technique was listed without rehearsing or using the cue–pause–return sequence.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01
