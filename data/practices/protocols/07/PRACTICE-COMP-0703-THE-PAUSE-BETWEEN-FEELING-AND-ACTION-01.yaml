        expected: true
  - stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A3
    sequence: 3
    title: Return with an issue-focused response and assess its consequences
    instructions: 'At the return point, write or say what happened, what still matters and one next request.
      For the case: I understood the deadline differently; can we check what was agreed and set a clear
      date for the remaining work? Retain a legitimate boundary or correction; the pause does not require
      agreement. Compare this response with the original impulse for accusations, clarity and likely practical
      effect. If a real reaction already caused harm, include a specific repair. Record whether you actually
      returned, even if still upset, and what remains unresolved.


      Observation checks: The underlying issue is revisited at the return point; The response makes a
      concrete request or boundary clear; Any earlier harm receives a specific repair proposal; Remaining
      emotion and disagreement are not hidden. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Did the pause change the chosen behavior, and did you return rather than avoid? Keep
      one workable method and one clear return condition. Success means more deliberate action, not mandatory
      calm or agreement.


      Examples: Supportive: The sharp draft remained unsent, the person paused, and they returned to clarify
      the deadline while still feeling annoyed.


      Mixed: The pause prevented an accusation but the promised return was missed; the unresolved issue
      and missed commitment were recorded.


      Contradictory: A pause became days of punitive silence, or the person denied having any concern
      to avoid returning to the disagreement.


      Inconclusive: Several calming methods were listed, but none was performed before a real or explicitly
      rehearsed response.'
    expected_time: 15-25 minutes
    due_within_days: 10
