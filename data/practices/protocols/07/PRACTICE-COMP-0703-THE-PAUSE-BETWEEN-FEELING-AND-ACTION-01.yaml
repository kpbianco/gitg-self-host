  purpose: Create room between an emotional urge and a consequential reaction while preserving both the
    feeling and a concrete route back to the underlying issue.
  why_recommended: Create room between an emotional urge and a consequential reaction while preserving
    both the feeling and a concrete route back to the underlying issue.
