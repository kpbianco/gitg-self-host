  - Treating a completed The pause between feeling and action action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written
    message, supported communication or a longer explicitly agreed return period. Skip body-focused methods
    if they are uncomfortable. During danger, prioritize safety and appropriate help; the exercise is
    for ordinary consequential reactions, not crisis delay.
  actions:
  - stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A1
    sequence: 1
    title: Choose a pause method that leaves the issue available for repair
    instructions: 'Write the feeling, the impulse and what could be damaged by an immediate response.
      Choose one suitable pause: leave the draft unsent and write privately; orient to an ordinary object
      in the room; take comfortable movement; allow an unforced breath; pray if it fits your beliefs;
      or consult a willing trusted person. Do not combine every method into a ritual. State when or under
      what practical condition you will return, such as after rereading the agreement later today. In
      the supplied case, the unresolved issue is the deadline, not whether either person is always unfair.


      Observation checks: Feeling and consequential urge are both named; One accessible pause method is
      selected; A concrete return condition is specified; The underlying issue remains explicit. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01
      action_stable_id: PRACTICE-COMP-0703-THE-PAUSE-BETWEEN-FEELING-AND-ACTION-01-A1
      competency_stable_id: '07.03'
