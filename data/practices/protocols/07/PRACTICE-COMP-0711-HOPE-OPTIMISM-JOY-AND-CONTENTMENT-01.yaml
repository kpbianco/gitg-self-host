        expected: true
  - stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A2
    sequence: 2
    title: Attend to a present good without demanding a particular feeling
    instructions: 'Spend a brief comfortable period with the chosen accessible good. Notice two concrete
      qualities, such as a phrase in the music and the memory it evokes, rather than grading how joyful
      you are. If appreciation, pleasure, neutrality or sadness appears, record it without forcing a replacement
      feeling. Acknowledge another person''s contribution if relevant and freely appropriate, but do not
      turn gratitude into debt. Then name what is enough for this moment, such as enjoying one song without
      searching for a better one; enoughness here does not require abandoning a valued longer-term ambition.


      Observation checks: An accessible present good receives actual attention; Two concrete qualities
      are noticed; Neutral or difficult feelings remain acceptable; Enoughness is distinguished from abandoning
      meaningful ambition. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01
      action_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A2
      competency_stable_id: '07.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0711_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0711_a2_primary
        kind: artifact
        role: primary
