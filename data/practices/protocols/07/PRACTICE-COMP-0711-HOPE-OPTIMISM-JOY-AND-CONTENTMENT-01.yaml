  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Hope, optimism, joy, and contentment; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use photos, objects, sensory description, dictation or a supporter. If joy is inaccessible, record
      a neutral support or reduced burden rather than fabricate gratitude. Severe or persistent loss of
      interest, hopelessness or impaired functioning merits qualified support.
    cultural_context:
    - Adapt the expression of Hope, optimism, joy, and contentment to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use photos, objects, sensory description, dictation or a supporter. If joy is inaccessible, record
      a neutral support or reduced burden rather than fabricate gratitude. Severe or persistent loss of
      interest, hopelessness or impaired functioning merits qualified support.
  pause_conditions:
  - Pause Hope, optimism, joy, and contentment when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Hope, optimism, joy, and contentment practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Hope, optimism, joy, and contentment situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
