meaning_and_fit:
  purpose: Practice realistic hope, receptivity to joy and enoughness without denying hardship, abandoning
    ambition or demanding a positive mood.
  why_recommended: Practice realistic hope, receptivity to joy and enoughness without denying hardship,
    abandoning ambition or demanding a positive mood.
  claims:
  - statement: Practice realistic hope, receptivity to joy and enoughness without denying hardship, abandoning
      ambition or demanding a positive mood.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Hope, optimism, joy, and contentment practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Hope, optimism, joy, and contentment as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use photos, objects, sensory description, dictation or a supporter. If joy
    is inaccessible, record a neutral support or reduced burden rather than fabricate gratitude. Severe
    or persistent loss of interest, hopelessness or impaired functioning merits qualified support.
  opportunity_considerations: 'Use the default of a project delay. Make three columns: hard facts, present
    goods and plausible futures. Add a stopping point for today''s work, such as after sending one status
    update, so contentment means enough for now rather than no further ambition.'
  prerequisites:
  - 'Use the default of a project delay. Make three columns: hard facts, present goods and plausible futures.
    Add a stopping point for today''s work, such as after sending one status update, so contentment means
    enough for now rather than no further ambition.'
  dependencies: []
  safe_alternatives:
  - Use photos, objects, sensory description, dictation or a supporter. If joy is inaccessible, record
    a neutral support or reduced burden rather than fabricate gratitude. Severe or persistent loss of
    interest, hopelessness or impaired functioning merits qualified support.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Hope, optimism, joy, and contentment differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Hope, optimism, joy, and contentment
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default of a project delay. Make three columns: hard facts, present goods and plausible
    futures. Add a stopping point for today''s work, such as after sending one status update, so contentment
    means enough for now rather than no further ambition. Goal: Practice realistic hope, receptivity to
    joy and enoughness without denying hardship, abandoning ambition or demanding a positive mood. Scope:
    One bounded exercise can improve the accuracy of attention and planning; it does not promise optimism,
    treat depression or prove that circumstances will improve. Time and effort: Fifteen minutes to prepare,
    one 10-minute present-good practice and one small future action with later review. Adaptation: Use
    photos, objects, sensory description, dictation or a supporter. If joy is inaccessible, record a neutral
    support or reduced burden rather than fabricate gratitude. Severe or persistent loss of interest,
    hopelessness or impaired functioning merits qualified support. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use photos, objects, sensory description, dictation or a supporter. If joy is inaccessible,
    record a neutral support or reduced burden rather than fabricate gratitude. Severe or persistent loss
    of interest, hopelessness or impaired functioning merits qualified support.
  expected_burden: Fifteen minutes to prepare, one 10-minute present-good practice and one small future
    action with later review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Hope, optimism, joy, and contentment protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Hope, optimism, joy, and contentment action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use photos,
    objects, sensory description, dictation or a supporter. If joy is inaccessible, record a neutral support
    or reduced burden rather than fabricate gratitude. Severe or persistent loss of interest, hopelessness
    or impaired functioning merits qualified support.
  actions:
  - stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A1
    sequence: 1
    title: Write the hard facts without turning them into the whole future
    instructions: 'List verified adverse facts, current uncertainty and consequences. Remove predictions
      disguised as facts and do not soften the real loss. Then list one condition that could make the
      future worse and one that could improve it. For the delayed project, the missed date is a fact;
      permanent career damage may be a fear requiring evidence.


      Observation checks: Verified hardship and uncertainty remain explicit; Predictions are separated
      from current facts; A worsening and improving condition are both named; No required positive interpretation
      is imposed. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01
      action_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A1
      competency_stable_id: '07.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0711_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0711_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - verified_hardship_and_uncertainty_remain_explicit
        - predictions_are_separated_from_current_facts
        - a_worsening_and_improving_condition_are_both_named
        - no_required_positive_interpretation_is_imposed
      - measurement_id: c0711_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0711_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A2
    sequence: 2
    title: Receive one present good without using it to cancel hardship
    instructions: 'Choose an available good such as a meal, a useful tool, a kind message, beauty, rest
      or competent work. Attend to it for several minutes or accept it from another person, then name
      what was actually good. Also write what the good does not fix. Stop at the preset enough-for-now
      boundary instead of converting appreciation into another performance target.


      Observation checks: A specific present good receives actual attention; The experienced good is described
      concretely; The hardship it does not fix remains visible; The enough-for-now boundary is observed
      or honestly missed. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01
      action_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A2
      competency_stable_id: '07.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0711_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0711_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_specific_present_good_receives_actual_attention
        - the_experienced_good_is_described_concretely
        - the_hardship_it_does_not_fix_remains_visible
        - the_enough_for_now_boundary_is_observed_or_honestly_missed
      - measurement_id: c0711_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0711_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A3
    sequence: 3
    title: Act on one plausible future with a fallback
    instructions: 'Choose one valued possibility supported by at least one real path. Complete the smallest
      next action and write a fallback if the hoped-for result does not occur. For the default, send a
      revised status and request a decision by Friday; if denied, preserve the work and re-scope. Review
      hope by whether it supported truthful action, not whether optimism felt intense.


      Observation checks: The hoped-for future has a plausible route; One concrete next action is completed;
      A fallback preserves agency if the result fails; Hope is evaluated without demanding a positive
      mood. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.


      Final review: What remained hard, what was genuinely available now, and which future action stayed
      plausible after both were acknowledged?


      Examples: Supportive: The missed date remained explicit, lunch with a friend was enjoyed without
      calling the delay good, and a revised scope was submitted with a fallback.


      Mixed: A present good was noticed, but the future plan still depended on an unverified optimistic
      assumption.


      Contradictory: Hardship was denied, gratitude was forced or contentment was used to abandon a responsibility
      that still mattered.


      Inconclusive: Positive possibilities were listed without a hard-fact column, present attention or
      completed next action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01
      action_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A3
      competency_stable_id: '07.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
