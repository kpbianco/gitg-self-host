        - reviewed_artifact
        criteria:
        - an_accessible_present_good_receives_actual_attention
        - two_concrete_qualities_are_noticed
        - neutral_or_difficult_feelings_remain_acceptable
        - enoughness_is_distinguished_from_abandoning_meaningful_ambition
      - measurement_id: c0711_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0711_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A3
    sequence: 3
    title: Take one realistic step and set a proportionate stopping point
    instructions: 'Choose and attempt a small action along the possibility identified earlier: revise
      one paragraph of existing work, request factual information about a future opportunity or arrange
      a welcome conversation. Define a stopping point before starting so the action does not become an
      attempt to outrun disappointment. Record the actual result and whether the obstacle changed. End
      by retaining both one present good and one unresolved fact. If no positive feeling followed, do
      not mark the whole exercise as a failure; review whether attention and action were honest and chosen.


      Observation checks: A concrete step toward the realistic possibility is attempted; A proportionate
      stopping point is used; Actual results are separated from hoped-for results; A present good and
      an unresolved hard fact can coexist. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What could you appreciate without denying the hard fact, and which future step was
      justified by reality? Keep enoughness for the present alongside a chosen ambition. This record does
      not establish improved mental health.


      Examples: Supportive: The unavailable opportunity remained disappointing, but the person attended
      to a familiar song and completed a bounded revision of existing work.


      Mixed: The present activity brought no pleasure, yet the person recorded that honestly and took
      a realistic information-seeking step.


      Contradictory: The person used gratitude to dismiss hardship or promised inevitable success while
      ignoring the actual obstacle and their limits.


      Inconclusive: Positive slogans were collected without attending to a present good, facing the hard
      fact or attempting a realistic next step.'
    expected_time: 15-25 minutes
