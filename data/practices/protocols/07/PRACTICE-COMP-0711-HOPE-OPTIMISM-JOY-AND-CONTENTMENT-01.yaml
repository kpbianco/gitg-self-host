meaning_and_fit:
  purpose: Practice appreciation, receptivity to joy and enoughness while building a realistic next possibility
    that does not deny hardship or meaningful ambition.
  why_recommended: Practice appreciation, receptivity to joy and enoughness while building a realistic
    next possibility that does not deny hardship or meaningful ambition.
  claims:
  - statement: Practice appreciation, receptivity to joy and enoughness while building a realistic next
      possibility that does not deny hardship or meaningful ambition.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Worsening symptoms and severe persistent distress affecting usual activities call for professional
      help; suicidal thoughts or urges to self-harm call for immediate help.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-SELF-HELP-LIMITS
    limitations: Public help-seeking guidance, not a diagnosis or validated product screening tool. The
      source's duration examples are not instructions to wait during danger or deterioration. It does
      not validate the original emotional-awareness, hope or strategy-transfer exercises.
  applicability_question: Does a voluntary, bounded Hope, optimism, joy, and contentment practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Hope, optimism, joy, and contentment as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a sensory or social form that is accessible and welcome; solitary appreciation
    is sufficient. No purchase, spiritual belief or public gratitude statement is required. If persistent
    low mood or loss of interest affects functioning, seek qualified support rather than escalating a
    positivity exercise.
  opportunity_considerations: 'Use an ordinary difficult week or this case: a desired opportunity is unavailable,
    but an existing activity and one supportive connection remain. Have a private note and choose an accessible
    ordinary good such as music, daylight, a familiar object or a welcome conversation. Nothing needs
    to be bought.'
  prerequisites:
  - 'Use an ordinary difficult week or this case: a desired opportunity is unavailable, but an existing
    activity and one supportive connection remain. Have a private note and choose an accessible ordinary
    good such as music, daylight, a familiar object or a welcome conversation. Nothing needs to be bought.'
  dependencies: []
  safe_alternatives:
  - Use a sensory or social form that is accessible and welcome; solitary appreciation is sufficient.
    No purchase, spiritual belief or public gratitude statement is required. If persistent low mood or
    loss of interest affects functioning, seek qualified support rather than escalating a positivity exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Hope, optimism, joy, and contentment differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Hope, optimism, joy, and contentment
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an ordinary difficult week or this case: a desired opportunity is unavailable, but an existing
    activity and one supportive connection remain. Have a private note and choose an accessible ordinary
    good such as music, daylight, a familiar object or a welcome conversation. Nothing needs to be bought.
    Goal: Practice appreciation, receptivity to joy and enoughness while building a realistic next possibility
    that does not deny hardship or meaningful ambition. Scope: A brief everyday exercise explores hopeful
    attention and action. It is not a requirement to feel happy, a treatment for low mood or a claim that
    optimism changes external constraints. Time and effort: About 10 minutes to prepare, a short period
    with the chosen good and one modest next action over the following days. Adaptation: Use a sensory
    or social form that is accessible and welcome; solitary appreciation is sufficient. No purchase, spiritual
    belief or public gratitude statement is required. If persistent low mood or loss of interest affects
    functioning, seek qualified support rather than escalating a positivity exercise. Keep personal working
    notes outside the check-in; record only the listed observations.


    Reference support:

    My Mental Health: Do I Need Help?: https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a sensory or social form that is accessible and welcome; solitary appreciation
    is sufficient. No purchase, spiritual belief or public gratitude statement is required. If persistent
    low mood or loss of interest affects functioning, seek qualified support rather than escalating a
    positivity exercise.
  expected_burden: About 10 minutes to prepare, a short period with the chosen good and one modest next
    action over the following days.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Hope, optimism, joy, and contentment protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Hope, optimism, joy, and contentment action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a sensory
    or social form that is accessible and welcome; solitary appreciation is sufficient. No purchase, spiritual
    belief or public gratitude statement is required. If persistent low mood or loss of interest affects
    functioning, seek qualified support rather than escalating a positivity exercise.
  actions:
  - stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A1
    sequence: 1
    title: State the hard fact and a future possibility without guarantees
    instructions: 'Write the unpleasant fact without softening it, then distinguish what is known, what
      is unknown and what remains possible. For the case, this opportunity is unavailable is known; nothing
      worthwhile will ever be available is a forecast. Identify one realistic path and one obstacle, such
      as improving an existing piece of work while acknowledging limited time. Define hope here as a reason
      to take a useful next step under uncertainty, not certainty of success. Keep disappointment visible
      beside the possibility rather than replacing it with a compulsory positive interpretation.


      Observation checks: The unpleasant fact is stated plainly; Known facts and forecasts are distinguished;
      A realistic possibility includes a concrete obstacle; Hope is not presented as a guarantee or denial
      of disappointment. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01
      action_stable_id: PRACTICE-COMP-0711-HOPE-OPTIMISM-JOY-AND-CONTENTMENT-01-A1
      competency_stable_id: '07.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0711_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0711_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_unpleasant_fact_is_stated_plainly
        - known_facts_and_forecasts_are_distinguished
        - a_realistic_possibility_includes_a_concrete_obstacle
        - hope_is_not_presented_as_a_guarantee_or_denial_of_disappointment
      - measurement_id: c0711_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
