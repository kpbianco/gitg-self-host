        expected: true
  - stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A2
    sequence: 2
    title: Verify reachable people and services in the actual location
    instructions: 'Add one willing personal or spiritual support, one routine health or mental-health
      entry point, one specialized route relevant to known needs and the local crisis or emergency route.
      Verify names, current contact methods, eligibility, hours and accessibility from official or direct
      sources. Do not store another person''s sensitive details or assume a service is available because
      it appears in this example.


      Observation checks: Personal routine specialized and emergency routes are listed; Location eligibility
      hours and contact methods are verified; Accessibility or communication needs are addressed; Only
      minimum private information is retained. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01
      action_stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A2
      competency_stable_id: '07.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
