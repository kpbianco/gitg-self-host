meaning_and_fit:
  purpose: Recognize when self-help is insufficient, distinguish different professional and community
    roles, and make a support plan that can be used when functioning or safety is affected.
  why_recommended: Recognize when self-help is insufficient, distinguish different professional and community
    roles, and make a support plan that can be used when functioning or safety is affected.
  claims:
  - statement: Recognize when self-help is insufficient, distinguish different professional and community
      roles, and make a support plan that can be used when functioning or safety is affected.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Worsening symptoms and severe persistent distress affecting usual activities call for professional
      help; suicidal thoughts or urges to self-harm call for immediate help.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-SELF-HELP-LIMITS
    limitations: Public help-seeking guidance, not a diagnosis or validated product screening tool. The
      source's duration examples are not instructions to wait during danger or deterioration. It does
      not validate the original emotional-awareness, hope or strategy-transfer exercises.
  - statement: US life-threatening emergencies call for 911; 988 provides suicide and emotional-crisis
      support by call or text, and ordinary mental health care requires an appropriate provider.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-HELP-ROUTES
    limitations: US public resource guidance only. Local availability, accessibility, eligibility and
      other countries' services need current verification. A resource card or rehearsal is not a clinical
      assessment or emergency-response qualification.
  applicability_question: Does a voluntary, bounded Mental-health literacy and help-seeking practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Mental-health literacy and help-seeking as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use text, relay, interpretation or a trusted helper where the service supports
    it, with the person's permission and privacy preserved. If no local route can be verified, mark the
    plan incomplete and seek official service navigation. Immediate danger requires local emergency help;
    self-harm thoughts or urges warrant immediate crisis support.
  opportunity_considerations: 'Read the NIMH Do I Need Help reference and official service information
    for your actual location. Use three fictional cases: an ordinary difficult day with daily tasks intact;
    persistent distress disrupting sleep and usual tasks; and someone saying they may hurt themselves
    now. Keep only service details and a short request in the practice record, not private symptom narratives
    or another person''s disclosures.'
  prerequisites:
