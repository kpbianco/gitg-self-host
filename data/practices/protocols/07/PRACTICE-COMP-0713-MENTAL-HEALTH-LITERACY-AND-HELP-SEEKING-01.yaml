    instructions: 'Define one planning-only question for Mental-health literacy and help-seeking, the
      hazards that must not be rehearsed, and the local qualified or emergency authority that supersedes
      this source-only protocol. Do not create, approach, or simulate danger: Recognize the limits of
      self-help and signs requiring medical, psychological, spiritual, legal, or emergency support.'
