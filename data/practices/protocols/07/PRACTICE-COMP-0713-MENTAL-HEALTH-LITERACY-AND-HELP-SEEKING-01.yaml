meaning_and_fit:
  purpose: Recognize when self-help is insufficient and prepare usable ordinary, qualified, specialized
    and emergency support routes before functioning or safety is impaired.
  why_recommended: Recognize when self-help is insufficient and prepare usable ordinary, qualified, specialized
    and emergency support routes before functioning or safety is impaired.
  claims:
  - statement: Recognize when self-help is insufficient and prepare usable ordinary, qualified, specialized
      and emergency support routes before functioning or safety is impaired.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: US life-threatening emergencies call for 911; 988 provides suicide and emotional-crisis
      support by call or text, and ordinary mental health care requires an appropriate provider.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-HELP-ROUTES
    limitations: US public resource guidance only. Local availability, accessibility, eligibility and
      other countries' services need current verification. A resource card or rehearsal is not a clinical
      assessment or emergency-response qualification.
  - statement: Severe or distressing symptoms that persist or impair usual tasks are reasons to seek professional
      help; a primary care provider can be an entry point to qualified mental-health care.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-CARE-THRESHOLDS
    limitations: US public guidance used to support help-seeking thresholds, not a diagnostic rule, exhaustive
      symptom screen or substitute for clinical judgment. Duration alone does not determine urgency, and
      immediate safety concerns require current local crisis or emergency action.
  applicability_question: Does a voluntary, bounded Mental-health literacy and help-seeking practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Mental-health literacy and help-seeking as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a wallet card, screen-reader-friendly note, translated resource or trusted
    helper. Keep exact symptoms and identity details off shared devices. When immediate danger is present,
    contact current local emergency services or go to an appropriate emergency setting rather than completing
    the worksheet.
  opportunity_considerations: 'Use a private card with four levels: ordinary support, routine professional
    care, urgent specialized help and emergency response. Record your actual country or region. In the
    United States, verify 988 for suicide or emotional crisis and 911 for life-threatening emergencies;
    elsewhere, replace them with current local services.'
  prerequisites:
  - 'Use a private card with four levels: ordinary support, routine professional care, urgent specialized
    help and emergency response. Record your actual country or region. In the United States, verify 988
    for suicide or emotional crisis and 911 for life-threatening emergencies; elsewhere, replace them
    with current local services.'
  dependencies: []
  safe_alternatives:
  - Use a wallet card, screen-reader-friendly note, translated resource or trusted helper. Keep exact
    symptoms and identity details off shared devices. When immediate danger is present, contact current
    local emergency services or go to an appropriate emergency setting rather than completing the worksheet.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Mental-health literacy and help-seeking differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Mental-health literacy and
    help-seeking as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private card with four levels: ordinary support, routine professional care, urgent specialized
    help and emergency response. Record your actual country or region. In the United States, verify 988
    for suicide or emotional crisis and 911 for life-threatening emergencies; elsewhere, replace them
    with current local services. Goal: Recognize when self-help is insufficient and prepare usable ordinary,
    qualified, specialized and emergency support routes before functioning or safety is impaired. Scope:
    This is support navigation, not diagnosis, triage certification or a substitute for current local
    emergency guidance and professional assessment. Time and effort: Thirty minutes to verify a private
    support card, a 10-minute rehearsal and one immediate real contact when current safety or functioning
    requires it. Adaptation: Use a wallet card, screen-reader-friendly note, translated resource or trusted
    helper. Keep exact symptoms and identity details off shared devices. When immediate danger is present,
    contact current local emergency services or go to an appropriate emergency setting rather than completing
    the worksheet. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Help for Mental Illnesses: https://www.nimh.nih.gov/health/find-help

    Caring for Your Mental Health: https://www.nimh.nih.gov/health/topics/caring-for-your-mental-health'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a wallet card, screen-reader-friendly note, translated resource or trusted
    helper. Keep exact symptoms and identity details off shared devices. When immediate danger is present,
    contact current local emergency services or go to an appropriate emergency setting rather than completing
    the worksheet.
  expected_burden: Thirty minutes to verify a private support card, a 10-minute rehearsal and one immediate
    real contact when current safety or functioning requires it.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Mental-health literacy and help-seeking protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Mental-health literacy and help-seeking action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a wallet
    card, screen-reader-friendly note, translated resource or trusted helper. Keep exact symptoms and
    identity details off shared devices. When immediate danger is present, contact current local emergency
    services or go to an appropriate emergency setting rather than completing the worksheet.
  actions:
  - stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A1
    sequence: 1
    title: Define observable thresholds for each support level
    instructions: 'Write two or three observable signs for each level without assigning a diagnosis. Include
      duration, loss of usual functioning, inability to complete basic tasks, severe distress, immediate
      danger, thoughts of suicide or harm, psychosis-like experiences, abuse or medical concerns where
      relevant. Mark uncertainty as a reason to consult rather than an invitation to self-diagnose.


      Observation checks: All four support levels have observable thresholds; Function duration distress
      and safety are considered; Signs are not converted into a self-diagnosis; Uncertainty has an explicit
      consultation route. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01
      action_stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A1
      competency_stable_id: '07.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0713_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0713_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_four_support_levels_have_observable_thresholds
        - function_duration_distress_and_safety_are_considered
        - signs_are_not_converted_into_a_self_diagnosis
        - uncertainty_has_an_explicit_consultation_route
      - measurement_id: c0713_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0713_a1_adverse
        kind: boolean
        role: adverse
