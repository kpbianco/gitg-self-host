  - stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A3
    sequence: 3
    title: Rehearse the handoff and act now when a threshold is present
    instructions: 'Practice one opening sentence: I have had [observable problem] for [time], it is affecting
      [function], and I need help deciding the next step. Locate the device, transportation, interpreter,
      insurance information or trusted person needed to make contact. If a current threshold on the card
      is met, use the appropriate real route now; a rehearsal never substitutes for urgent or emergency
      action.


      Observation checks: The opening sentence includes observation duration and function; Practical access
      needs for making contact are prepared; A current threshold leads to the appropriate real contact;
      Rehearsal is not counted as receiving professional help. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Could you reach the correct level of help from this card under stress, and which detail
      still needs current local verification?


      Examples: Supportive: The person verified a primary-care entry point, a therapist directory, a trusted
      contact and current local crisis routes, then rehearsed a concise call.


      Mixed: The levels and contacts are complete, but transportation and after-hours accessibility remain
      unresolved.


      Contradictory: The card assigned diagnoses, relied on an unverified hotline or was used to delay
      help despite an immediate safety threshold.


      Inconclusive: Generic advice to seek help was copied without local services, thresholds or a rehearsed
      contact path.'
    expected_time: 15-25 minutes
    due_within_days: 10
