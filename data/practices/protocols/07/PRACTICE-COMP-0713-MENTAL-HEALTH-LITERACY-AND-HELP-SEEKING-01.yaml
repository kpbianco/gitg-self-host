  - stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A2
    sequence: 2
    title: Check that a support route is usable in the person's actual circumstances
    instructions: 'Create a private card with a routine qualified-care route, an urgent mental-health
      route and a life-threatening-emergency route for your location. Verify each on the provider''s or
      public service''s official page, recording contact method, hours, eligibility, cost information
      or unknown, and available accessibility or language options. Add a fallback if the first route is
      closed or unavailable. In the US, NIMH identifies 988 for suicide or emotional-crisis support and
      911 for life-threatening emergencies; do not assume those numbers apply elsewhere. Identify a suitable
      spiritual or legal resource only if relevant, and record its distinct scope.


      Observation checks: Routine urgent and emergency routes are location-specific; Official information
      is checked for contact hours and eligibility; Access cost or language uncertainties remain visible;
      A fallback exists without substituting an unqualified role for urgent care. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01
