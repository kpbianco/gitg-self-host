  - The evidence contradicted the intended Mental-health literacy and help-seeking criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Mental-health literacy and help-seeking explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Mental-health literacy and help-seeking
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Mental-health literacy and help-seeking observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Mental-health literacy and help-seeking rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Maintains a practical support plan and uses qualified help when functioning or safety is impaired.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Mental-health literacy and help-seeking requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: This package is non-scored and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Mental-health
    literacy and help-seeking evidence only under offline typed evaluation; protocol performance remains
    distinct and is never counted twice.
