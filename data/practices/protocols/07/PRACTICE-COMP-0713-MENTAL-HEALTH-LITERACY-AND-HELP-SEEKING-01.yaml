intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Read the NIMH Do I Need Help reference and official service information for your actual location.
    Use three fictional cases: an ordinary difficult day with daily tasks intact; persistent distress
    disrupting sleep and usual tasks; and someone saying they may hurt themselves now. Keep only service
    details and a short request in the practice record, not private symptom narratives or another person''s
    disclosures. Goal: Recognize when self-help is insufficient, distinguish different professional and
    community roles, and make a support plan that can be used when functioning or safety is affected.
    Scope: This is literacy and support preparation, not diagnosis or a clinical risk assessment. A completed
    plan does not demonstrate that help was accessed, and urgent need must never wait for the exercise
    to finish. Time and effort: About 30 minutes to read and check practical routes, then a short non-emergency
    rehearsal. An actual urgent need takes immediate priority. Adaptation: Use text, relay, interpretation
    or a trusted helper where the service supports it, with the person''s permission and privacy preserved.
    If no local route can be verified, mark the plan incomplete and seek official service navigation.
    Immediate danger requires local emergency help; self-harm thoughts or urges warrant immediate crisis
    support. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    My Mental Health: Do I Need Help?: https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help

    Help for Mental Illnesses: https://www.nimh.nih.gov/health/find-help'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, relay, interpretation or a trusted helper where the service supports
    it, with the person's permission and privacy preserved. If no local route can be verified, mark the
    plan incomplete and seek official service navigation. Immediate danger requires local emergency help;
    self-harm thoughts or urges warrant immediate crisis support.
  expected_burden: About 30 minutes to read and check practical routes, then a short non-emergency rehearsal.
    An actual urgent need takes immediate priority.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Mental-health literacy and help-seeking protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Mental-health literacy and help-seeking action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, relay,
    interpretation or a trusted helper where the service supports it, with the person's permission and
    privacy preserved. If no local route can be verified, mark the plan incomplete and seek official service
    navigation. Immediate danger requires local emergency help; self-harm thoughts or urges warrant immediate
    crisis support.
  actions:
  - stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A1
    sequence: 1
    title: Match the level and kind of need to an appropriate support role
    instructions: 'For each case, state what is known about functioning and safety, what is unknown and
      why self-help may or may not be enough. Use NIMH to check that worsening or persistent distress
      and interference with daily life warrant professional attention, while thoughts of self-harm need
      immediate help. Do not interpret a duration example as a requirement to wait. Distinguish medical
      assessment for health concerns, psychological care for mental-health difficulties, spiritual support
      for freely chosen belief-related questions, legal advice for rights or disputes and emergency help
      for immediate danger. Spiritual or legal help may complement care but cannot replace urgent clinical
      support.


      Observation checks: Functioning and safety guide the three case dispositions; Unknown facts are
      not converted into diagnoses; All five support roles and their limits are distinguished; Urgent
      help is not delayed by a duration threshold or worksheet. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01
      action_stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A1
