  - stable_id: PRACTICE-COMP-0713-MENTAL-HEALTH-LITERACY-AND-HELP-SEEKING-01-A3
    sequence: 3
    title: Rehearse a concise request and identify what would trigger actual contact
    instructions: 'Use the persistent-distress case to say or write: I am having difficulty with usual
      tasks and would like an assessment; how can I arrange an appropriate appointment? Add one access
      requirement and ask what to do if the service cannot help. Walk through the urgent case by locating
      the verified urgent or emergency route immediately; do not place a test call to an emergency service.
      For a real current need, use the appropriate service rather than stopping at rehearsal. Record only
      whether contact was attempted, reached or still unavailable, and the next practical step; do not
      award a successful handoff for having a phone number.


      Observation checks: A concise help request is actually rehearsed or appropriately used; An access
      requirement and unavailable-service fallback are included; Emergency services are not contacted
      for a practice drill; Preparation contact and successful access remain distinct. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Could the card be used under stress, and which access uncertainty still needs resolution?
      Keep official details current and leave an unsuccessful contact visible. This exercise does not
      certify a person to assess someone else''s safety or replace professional judgment.


      Examples: Supportive: The person verified local routine and urgent routes, rehearsed an assessment
      request with an access need and identified a fallback without making a test emergency call.


      Mixed: A suitable provider was found, but cost and language access remained unknown; the plan kept
      those questions and another verified route.


      Contradictory: Persistent impairment was treated as a motivation problem, or a person in immediate
      danger was told to finish the plan before seeking help.


      Inconclusive: A generic hotline list was copied without checking location, availability or the difference
      between having a contact and reaching help.'
