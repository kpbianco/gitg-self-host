completion_and_review:
  completion_criteria:
  - The identify the non-emergency boundary for mental-health literacy and help-seeking action was attempted
    or explicitly deferred.
  - The prepare one safe mental-health literacy and help-seeking support step action was attempted or
    explicitly deferred.
  - The review the mental-health literacy and help-seeking plan against stop conditions action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0713_a1_primary
    - c0713_a2_primary
    - c0713_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Mental-health literacy and help-seeking only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Mental-health literacy and help-seeking across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Mental-health literacy and help-seeking require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Mental-health literacy and help-seeking criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Maintains a practical support plan and uses qualified help
      when functioning or safety is impaired.', what contradiction or missing context matters most, and
      should this Mental-health literacy and help-seeking design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Mental-health literacy and help-seeking design only when the context
      and burden remain appropriate.
    adapt: Change the Mental-health literacy and help-seeking medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Mental-health literacy and help-seeking when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Mental-health literacy and help-seeking
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Mental-health literacy and help-seeking criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Mental-health literacy and help-seeking criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Mental-health literacy and help-seeking criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Mental-health literacy and help-seeking action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
