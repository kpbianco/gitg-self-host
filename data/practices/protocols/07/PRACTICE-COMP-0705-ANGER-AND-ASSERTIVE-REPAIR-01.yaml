meaning_and_fit:
  purpose: Distinguish a violated value or boundary from ego threat, lower escalation and communicate
    the issue directly without intimidation, suppression or passive aggression.
  why_recommended: Distinguish a violated value or boundary from ego threat, lower escalation and communicate
    the issue directly without intimidation, suppression or passive aggression.
  claims:
  - statement: Distinguish a violated value or boundary from ego threat, lower escalation and communicate
      the issue directly without intimidation, suppression or passive aggression.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Anger and assertive repair practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Anger and assertive repair as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use writing, AAC, an interpreter or a neutral support person with consent.
    Rehearse against the supplied case when no willing person is available; this does not prove live assertiveness.
    In abusive, discriminatory or retaliatory contexts, prioritize safety, documentation and appropriate
    support over direct confrontation.
  opportunity_considerations: 'Use a minor shared-life default: someone repeatedly leaves a borrowed item
    in the wrong place. Prepare four headings—observable event, impact, value or boundary, and requested
    future action—plus a safe exit plan. Choose rehearsal if direct contact is unwelcome or unsafe.'
  prerequisites:
  - 'Use a minor shared-life default: someone repeatedly leaves a borrowed item in the wrong place. Prepare
    four headings—observable event, impact, value or boundary, and requested future action—plus a safe
    exit plan. Choose rehearsal if direct contact is unwelcome or unsafe.'
  dependencies: []
  safe_alternatives:
  - Use writing, AAC, an interpreter or a neutral support person with consent. Rehearse against the supplied
    case when no willing person is available; this does not prove live assertiveness. In abusive, discriminatory
    or retaliatory contexts, prioritize safety, documentation and appropriate support over direct confrontation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Anger and assertive repair differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Anger and assertive repair
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a minor shared-life default: someone repeatedly leaves a borrowed item in the wrong place.
    Prepare four headings—observable event, impact, value or boundary, and requested future action—plus
    a safe exit plan. Choose rehearsal if direct contact is unwelcome or unsafe. Goal: Distinguish a violated
    value or boundary from ego threat, lower escalation and communicate the issue directly without intimidation,
    suppression or passive aggression. Scope: One low-risk repair practices assertive anger; it does not
    decide who is morally right, repair abuse or require direct contact where retaliation or coercion
    is plausible. Time and effort: Two 15-minute preparation periods, one brief willing conversation or
    rehearsal and a 10-minute follow-up. Adaptation: Use writing, AAC, an interpreter or a neutral support
    person with consent. Rehearse against the supplied case when no willing person is available; this
    does not prove live assertiveness. In abusive, discriminatory or retaliatory contexts, prioritize
    safety, documentation and appropriate support over direct confrontation. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, AAC, an interpreter or a neutral support person with consent. Rehearse
    against the supplied case when no willing person is available; this does not prove live assertiveness.
    In abusive, discriminatory or retaliatory contexts, prioritize safety, documentation and appropriate
    support over direct confrontation.
  expected_burden: Two 15-minute preparation periods, one brief willing conversation or rehearsal and
    a 10-minute follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Anger and assertive repair protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Anger and assertive repair action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    AAC, an interpreter or a neutral support person with consent. Rehearse against the supplied case when
    no willing person is available; this does not prove live assertiveness. In abusive, discriminatory
    or retaliatory contexts, prioritize safety, documentation and appropriate support over direct confrontation.
  actions:
  - stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A1
    sequence: 1
    title: Separate the event, threatened concern and escalation story
    instructions: 'Describe the event without always, never or motive claims. Name the practical impact,
      the value or boundary involved and any status or ego threat that may be amplifying intensity. Write
      one fact that could change your interpretation. Reduce activation before contact through time, movement,
      writing or consultation, but retain the issue for later action.


      Observation checks: The event is described without motive or character claims; Impact value or boundary
      and possible ego threat are separated; A fact that could revise the interpretation is named; Escalation
      is reduced without abandoning the issue. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01
      action_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A1
      competency_stable_id: '07.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0705_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0705_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_event_is_described_without_motive_or_character_claims
        - impact_value_or_boundary_and_possible_ego_threat_are_separated
        - a_fact_that_could_revise_the_interpretation_is_named
        - escalation_is_reduced_without_abandoning_the_issue
      - measurement_id: c0705_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0705_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A2
    sequence: 2
    title: Make a direct request with a proportionate boundary
    instructions: 'Ask whether the person is willing to talk. State the observed event, its effect and
      one specific request: When the tool stays outside, I cannot find it; please return it to the marked
      shelf. If needed, state only a boundary you control, such as lending it only when a return plan
      is agreed. Do not threaten, shame, crowd, monitor or demand emotional agreement.


      Observation checks: The other person is willing to receive the message; Event impact and request
      are stated directly; Any boundary describes the speaker''s own future action; No intimidation punishment
      or forced agreement is used. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01
      action_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A2
      competency_stable_id: '07.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0705_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0705_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_other_person_is_willing_to_receive_the_message
        - event_impact_and_request_are_stated_directly
        - any_boundary_describes_the_speaker_s_own_future_action
        - no_intimidation_punishment_or_forced_agreement_is_used
      - measurement_id: c0705_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0705_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A3
    sequence: 3
    title: Review response, follow-through and remaining repair
    instructions: 'Record whether the message was delivered or only rehearsed, the other person''s actual
      response and your follow-through. Acknowledge any part of your delivery that needs repair without
      withdrawing a legitimate boundary. If the request is declined, choose a safe next action within
      your control rather than escalating or pretending agreement.


      Observation checks: Live communication and rehearsal are distinguished; The actual response is recorded
      without mind-reading; Delivery harm and the substantive boundary are reviewed separately; A declined
      request leads to a controlled next action. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What part of the anger contained useful information, and did the response remain proportionate
      to the actual event?


      Examples: Supportive: The person cooled down, named the missing-tool impact, made one request and
      followed a lending boundary without insults.


      Mixed: The request was clear, but the opening included a motive claim that required a later correction.


      Contradictory: The exercise was used to justify yelling, surveillance, humiliation, revenge or unsafe
      confrontation.


      Inconclusive: Anger was privately analyzed, but no request, boundary, rehearsal or follow-through
      occurred.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01
      action_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A3
      competency_stable_id: '07.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
