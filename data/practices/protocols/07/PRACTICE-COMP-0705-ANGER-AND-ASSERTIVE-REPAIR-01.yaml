    is unsuitable. For coercion or credible retaliation, use an appropriate support route instead of confrontation.
    A boundary can be clear in different cultural communication styles without requiring personal humiliation.
  opportunity_considerations: 'Use a manageable disagreement with a reasonably safe counterpart, or this
