  - stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A3
    sequence: 3
    title: Repair your contribution and follow through on an agreed boundary
    instructions: 'Record the reply and whether a workable agreement exists. If you insulted or threatened
      earlier, acknowledge the specific act and offer a concrete correction without making the apology
      conditional on their apology. In the case, a proportionate follow-through could be declining further
      lending until a return arrangement is reliable; damaging their property would not repair the issue.
      In rehearsal, try both an accepting response and a refusal, then state what you can choose yourself.
      Review whether your expression clarified the concern, escalated it or concealed it. Do not count
      a drafted agreement as accepted by another person.


      Observation checks: The other person''s actual or rehearsed response is recorded accurately; Any
      harmful contribution receives a specific repair; Follow-through stays within the person''s own choices;
      Agreement is not inferred from an unsent draft or silence. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Was anger expressed in a way that protected the legitimate value and respected the
      other person''s agency? Identify one repair, boundary or unresolved issue to carry forward. An unsuccessful
      negotiation does not mean the feeling was illegitimate.


      Examples: Supportive: The person named the borrowing problem, acknowledged an earlier insult and
      agreed a permission-and-return arrangement without attacking character.


      Mixed: The concern was stated clearly but the counterpart refused an agreement; further lending
      was declined without threats.


      Contradictory: The person used anger to demand submission, retaliated against property or hid the
      concern behind sarcasm and punishment.


      Inconclusive: The person wrote that anger was valid but did not identify a violation, state a request
      or rehearse a response.'
    expected_time: 15-25 minutes
    due_within_days: 10
