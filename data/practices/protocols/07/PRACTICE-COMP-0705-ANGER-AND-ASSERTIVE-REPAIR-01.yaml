  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Anger and assertive repair; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use writing, AAC, an interpreter or a neutral support person with consent. Rehearse against the
      supplied case when no willing person is available; this does not prove live assertiveness. In abusive,
      discriminatory or retaliatory contexts, prioritize safety, documentation and appropriate support
      over direct confrontation.
    cultural_context:
    - Adapt the expression of Anger and assertive repair to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use writing, AAC, an interpreter or a neutral support person with consent. Rehearse against the
      supplied case when no willing person is available; this does not prove live assertiveness. In abusive,
      discriminatory or retaliatory contexts, prioritize safety, documentation and appropriate support
      over direct confrontation.
  pause_conditions:
  - Pause Anger and assertive repair when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Anger and assertive repair practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Anger and assertive repair situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
