intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a manageable disagreement with a reasonably safe counterpart, or this case: a shared item
    was used without asking and returned late; you want to call the person selfish. Paper or an unsent
    message is enough for rehearsal. Do not manufacture a violation. Goal: Distinguish a real violation
    from an injured self-image, reduce escalation and state a concrete concern without intimidation, suppression
    or indirect punishment. Scope: One ordinary disagreement tests assertive communication and responsibility
    for impact. It is not mediation for abuse or a requirement to confront a person who may retaliate.
    Time and effort: About 15 minutes of preparation, one suitable conversation or rehearsal, and 10 minutes
    afterward. Adaptation: Use a written exchange, an agreed mediator or rehearsal when direct discussion
    is unsuitable. For coercion or credible retaliation, use an appropriate support route instead of confrontation.
    A boundary can be clear in different cultural communication styles without requiring personal humiliation.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written exchange, an agreed mediator or rehearsal when direct discussion
    is unsuitable. For coercion or credible retaliation, use an appropriate support route instead of confrontation.
    A boundary can be clear in different cultural communication styles without requiring personal humiliation.
  expected_burden: About 15 minutes of preparation, one suitable conversation or rehearsal, and 10 minutes
    afterward.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Anger and assertive repair protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Anger and assertive repair action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written
    exchange, an agreed mediator or rehearsal when direct discussion is unsuitable. For coercion or credible
    retaliation, use an appropriate support route instead of confrontation. A boundary can be clear in
    different cultural communication styles without requiring personal humiliation.
  actions:
  - stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A1
    sequence: 1
    title: Locate the violation without treating anger as proof of intent
    instructions: 'Write what happened, the agreement or value affected, the impact and what remains unknown.
      In the case, permission and access to the item are at issue; the person''s character is not established.
      Then examine the ego-threat possibility: are you upset because an agreement was broken, because
      you were not given special deference, or both? An injured self-image does not erase a real violation,
      and a strong feeling does not create one. Choose a concrete outcome such as return by an agreed
      time or asking permission next time, rather than making the other person feel small.


      Observation checks: The concern is anchored to an event and value or agreement; Impact is separated
      from inferred intent; Possible ego threat is considered without dismissing a real boundary; The
      desired outcome is concrete and proportionate. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01
      action_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A1
      competency_stable_id: '07.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0705_a1_primary
      transfer_disposition: context_bound
      measurements:
