  - stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A2
    sequence: 2
    title: State the concern directly while reducing escalation
    instructions: 'Before a suitable exchange, remove threats, insults, sarcasm and unrelated past grievances
      from the opening. If needed, take a brief communicated pause with a return time. Say or rehearse:
      When the item was used without asking and returned late, I could not use it as planned. I am angry
      about that. Please ask before borrowing it and agree a return time. Invite correction of the facts
      and listen to the reply without surrendering the boundary automatically. Keep volume, distance and
      communication format appropriate; anger need not be disguised as a joke or expressed through withdrawal.


      Observation checks: The statement names behavior impact feeling and request; Intimidation and indirect
      punishment are removed; A factual correction can be heard; The boundary remains explicit without
      requiring agreement. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01
      action_stable_id: PRACTICE-COMP-0705-ANGER-AND-ASSERTIVE-REPAIR-01-A2
      competency_stable_id: '07.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
