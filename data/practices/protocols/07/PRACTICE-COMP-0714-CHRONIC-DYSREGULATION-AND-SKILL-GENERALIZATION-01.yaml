        expected: true
  - stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A3
    sequence: 3
    title: Build a conditional menu and an escalation rule
    instructions: 'Compare which strategy was usable at which intensity and setting. Create if–then guidance,
      such as writing works for remote conflict below 6, while movement is more usable after noisy transitions.
      Mark a strategy ineffective, inaccessible or harmful where warranted, and add a support or professional
      route for persistent dysregulation, worsening effects or loss of function.


      Observation checks: The comparison distinguishes context and intensity; The menu includes at least
      two conditional choices; Ineffective inaccessible or harmful results are retained; A clear escalation
      route covers loss of function or worsening. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which strategy worked under which conditions, and what is the earliest sign that self-guided
      regulation is no longer enough?


      Examples: Supportive: Writing before replying supported the desk marker, movement helped the household
      transition, and the menu recorded where each was unavailable.


      Mixed: Both strategies were used, but three attempts occurred in the same ideal setting, so cross-context
      transfer remains uncertain.


      Contradictory: The person deliberately triggered severe distress, discarded prescribed support or
      treated one technique as universally effective.


      Inconclusive: Several coping skills were listed without natural use, context comparison or a stop-and-escalate
      rule.'
    expected_time: 15-25 minutes
    due_within_days: 10
