meaning_and_fit:
  purpose: Generalize regulation by trying more than one safe strategy across different triggers, relationships,
    stress levels or environments and identifying when each stops helping.
  why_recommended: Generalize regulation by trying more than one safe strategy across different triggers,
    relationships, stress levels or environments and identifying when each stops helping.
  claims:
  - statement: Generalize regulation by trying more than one safe strategy across different triggers,
      relationships, stress levels or environments and identifying when each stops helping.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Chronic dysregulation and skill generalization practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Chronic dysregulation and skill generalization as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use external prompts, AAC, sensory accommodations or a helper, and select
    strategies compatible with existing care. A scripted scenario can test recall of the menu but not
    regulation under stress. Do not change medication, treatment or a clinician's safety plan through
    this exercise.
  opportunity_considerations: 'Choose two recurring manageable contexts, such as deadline tension at a
    desk and irritation during a household transition. Select two already-safe strategies: orient to five
    visible objects, walk or change posture, write before replying, use a brief prayer, or consult a willing
    person. Define a stop condition for rising distress or impaired safety.'
  prerequisites:
  - 'Choose two recurring manageable contexts, such as deadline tension at a desk and irritation during
    a household transition. Select two already-safe strategies: orient to five visible objects, walk or
    change posture, write before replying, use a brief prayer, or consult a willing person. Define a stop
    condition for rising distress or impaired safety.'
  dependencies: []
  safe_alternatives:
  - Use external prompts, AAC, sensory accommodations or a helper, and select strategies compatible with
    existing care. A scripted scenario can test recall of the menu but not regulation under stress. Do
    not change medication, treatment or a clinician's safety plan through this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Chronic dysregulation and skill generalization differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Chronic dysregulation and
    skill generalization as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose two recurring manageable contexts, such as deadline tension at a desk and irritation
    during a household transition. Select two already-safe strategies: orient to five visible objects,
    walk or change posture, write before replying, use a brief prayer, or consult a willing person. Define
    a stop condition for rising distress or impaired safety. Goal: Generalize regulation by trying more
    than one safe strategy across different triggers, relationships, stress levels or environments and
    identifying when each stops helping. Scope: Four low-risk observations can refine a personal strategy
    menu; they do not induce dysregulation, treat chronic symptoms or establish broad effectiveness. Time
    and effort: Fifteen minutes to prepare, four brief natural uses over one to two weeks and a 15-minute
    comparison. Adaptation: Use external prompts, AAC, sensory accommodations or a helper, and select
    strategies compatible with existing care. A scripted scenario can test recall of the menu but not
    regulation under stress. Do not change medication, treatment or a clinician''s safety plan through
    this exercise. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use external prompts, AAC, sensory accommodations or a helper, and select strategies
    compatible with existing care. A scripted scenario can test recall of the menu but not regulation
    under stress. Do not change medication, treatment or a clinician's safety plan through this exercise.
  expected_burden: Fifteen minutes to prepare, four brief natural uses over one to two weeks and a 15-minute
    comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Chronic dysregulation and skill generalization protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Chronic dysregulation and skill generalization action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use external
    prompts, AAC, sensory accommodations or a helper, and select strategies compatible with existing care.
    A scripted scenario can test recall of the menu but not regulation under stress. Do not change medication,
    treatment or a clinician's safety plan through this exercise.
  actions:
  - stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A1
    sequence: 1
    title: Define contexts, strategies and a modest success marker
    instructions: 'Describe each context, its likely trigger, typical intensity and the behavior you want
      enough regulation to choose. Write the exact steps and access needs for both strategies. Use a behavioral
      marker such as reading a message twice before replying rather than calmness or feeling good, and
      name when each strategy is unavailable or should stop.


      Observation checks: Two distinct contexts and triggers are defined; Two strategies have exact usable
      steps; Success is a chosen behavior rather than a required mood; Availability limits and stop conditions
      are explicit. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01
      action_stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A1
      competency_stable_id: '07.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0714_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0714_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_distinct_contexts_and_triggers_are_defined
        - two_strategies_have_exact_usable_steps
        - success_is_a_chosen_behavior_rather_than_a_required_mood
        - availability_limits_and_stop_conditions_are_explicit
      - measurement_id: c0714_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0714_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
