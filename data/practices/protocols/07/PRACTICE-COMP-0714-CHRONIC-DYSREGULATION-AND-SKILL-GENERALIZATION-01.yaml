        criteria:
        - four_natural_uses_or_missing_opportunities_are_recorded
        - each_strategy_and_each_available_context_receives_representation
        - intensity_behavior_and_unwanted_effects_are_observed
        - no_trigger_or_distress_is_deliberately_induced
      - measurement_id: c0714_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
