meaning_and_fit:
  purpose: Practice more than one response strategy across naturally occurring triggers, relationships
    and settings, and identify when a strategy needs adjustment or qualified support.
  why_recommended: Practice more than one response strategy across naturally occurring triggers, relationships
    and settings, and identify when a strategy needs adjustment or qualified support.
  claims:
  - statement: Practice more than one response strategy across naturally occurring triggers, relationships
      and settings, and identify when a strategy needs adjustment or qualified support.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Worsening symptoms and severe persistent distress affecting usual activities call for professional
      help; suicidal thoughts or urges to self-harm call for immediate help.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-SELF-HELP-LIMITS
    limitations: Public help-seeking guidance, not a diagnosis or validated product screening tool. The
      source's duration examples are not instructions to wait during danger or deterioration. It does
      not validate the original emotional-awareness, hope or strategy-transfer exercises.
  applicability_question: Does a voluntary, bounded Chronic dysregulation and skill generalization practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Chronic dysregulation and skill generalization as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible written, spoken or supported communication instead of a specific
    format. If no suitable live contexts occur, rehearse an ordinary message and conversation privately;
    label both rehearsals and leave real-world generalization untested. Severe or persistent dysregulation
    calls for qualified care, not a harder practice challenge.
  opportunity_considerations: 'Choose two already tolerable options: briefly leave a message unsent and
    reread it before responding; and state a concrete need or ask for a short break with a return time.
    Keep a private three-row note with context, trigger, stress level in words, strategy, action and result.
    Use ordinary situations only and preserve any existing care plan.'
  prerequisites:
  - 'Choose two already tolerable options: briefly leave a message unsent and reread it before responding;
    and state a concrete need or ask for a short break with a return time. Keep a private three-row note
    with context, trigger, stress level in words, strategy, action and result. Use ordinary situations
    only and preserve any existing care plan.'
  dependencies: []
  safe_alternatives:
  - Use accessible written, spoken or supported communication instead of a specific format. If no suitable
    live contexts occur, rehearse an ordinary message and conversation privately; label both rehearsals
    and leave real-world generalization untested. Severe or persistent dysregulation calls for qualified
    care, not a harder practice challenge.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Chronic dysregulation and skill generalization differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Chronic dysregulation and
    skill generalization as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose two already tolerable options: briefly leave a message unsent and reread it before responding;
    and state a concrete need or ask for a short break with a return time. Keep a private three-row note
    with context, trigger, stress level in words, strategy, action and result. Use ordinary situations
    only and preserve any existing care plan. Goal: Practice more than one response strategy across naturally
    occurring triggers, relationships and settings, and identify when a strategy needs adjustment or qualified
    support. Scope: This small transfer test examines everyday strategy use, not treatment for chronic
    dysregulation or proof that skills generalize to severe stress. No trigger or conflict should be manufactured.
    Time and effort: About 15 minutes to prepare and three naturally occurring opportunities over one
    or two weeks, with a brief note afterward. Missing opportunities remain pending. Adaptation: Use accessible
    written, spoken or supported communication instead of a specific format. If no suitable live contexts
    occur, rehearse an ordinary message and conversation privately; label both rehearsals and leave real-world
    generalization untested. Severe or persistent dysregulation calls for qualified care, not a harder
    practice challenge. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    My Mental Health: Do I Need Help?: https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible written, spoken or supported communication instead of a specific
    format. If no suitable live contexts occur, rehearse an ordinary message and conversation privately;
    label both rehearsals and leave real-world generalization untested. Severe or persistent dysregulation
    calls for qualified care, not a harder practice challenge.
  expected_burden: About 15 minutes to prepare and three naturally occurring opportunities over one or
    two weeks, with a brief note afterward. Missing opportunities remain pending.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Chronic dysregulation and skill generalization protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Chronic dysregulation and skill generalization action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    written, spoken or supported communication instead of a specific format. If no suitable live contexts
    occur, rehearse an ordinary message and conversation privately; label both rehearsals and leave real-world
    generalization untested. Severe or persistent dysregulation calls for qualified care, not a harder
    practice challenge.
  actions:
  - stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A1
    sequence: 1
    title: Prepare two strategies and the conditions in which each fits
    instructions: 'Describe how to perform both options and where they are suitable. An unsent-message
      pause fits a non-urgent written exchange; a direct need or agreed break fits a reasonably safe interaction
      where clarification can help. Name an early cue for each, such as starting to type an accusation
      or noticing an urge to interrupt. Define signs that an option is not helping: repeated rereading
      becomes stuck rumination, or a requested break becomes indefinite avoidance. Identify a fallback,
      such as ending the optional exchange, using another accessible format or seeking suitable support.


      Observation checks: Two strategies have concrete performance instructions; Their suitable contexts
      and early cues are specified; A recognizable limit is stated for each option; A fallback preserves
      access safety and a route back when appropriate. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01
      action_stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A1
      competency_stable_id: '07.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0714_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0714_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_strategies_have_concrete_performance_instructions
        - their_suitable_contexts_and_early_cues_are_specified
        - a_recognizable_limit_is_stated_for_each_option
        - a_fallback_preserves_access_safety_and_a_route_back_when_appropriate
      - measurement_id: c0714_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0714_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A2
    sequence: 2
    title: Use both options during naturally different ordinary opportunities
    instructions: 'At two suitable opportunities, use each strategy at least once. Record the trigger,
      setting, relationship if any, ordinary stress level and the sequence from cue to chosen action.
      Aim for a genuine difference, such as a written coordination message and a spoken conversation,
      rather than claiming two identical drafts demonstrate broad transfer. Note whether the response
      clarified the issue, delayed it appropriately or failed to help. If all suitable events are very
      low stress, record that narrow range; do not create higher stress or provoke another person to fill
      the record.


      Observation checks: Both strategies are actually attempted in suitable ordinary situations; Trigger
      setting relationship and stress context are recorded; At least one genuine context difference is
      identified; An unobserved stress range is not claimed as tested. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01
      action_stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A2
      competency_stable_id: '07.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0714_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0714_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_strategies_are_actually_attempted_in_suitable_ordinary_situations
        - trigger_setting_relationship_and_stress_context_are_recorded
        - at_least_one_genuine_context_difference_is_identified
        - an_unobserved_stress_range_is_not_claimed_as_tested
      - measurement_id: c0714_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0714_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A3
    sequence: 3
    title: Try a third opportunity and revise a strategy that reaches its limit
    instructions: 'At another naturally occurring event, choose the option that fits the context and record
      why. If it stops helping, use the prepared fallback and note the observable sign rather than repeating
      it more intensely. Compare all three records for differences in triggers, relationships, settings
      and stress levels. Identify one supported transfer claim, one untested context and one revision
      or question for qualified help if difficulties persist or impair functioning. If the third event
      never occurs, retain the two observations and leave this transfer check pending. A strategy''s failure
      in one setting is information, not proof of personal failure.


      Observation checks: A third actual opportunity informs strategy choice; Any observed limit leads
      to an appropriate fallback or revision; Transfer claims are restricted to recorded contexts; Persistent
      impairment prompts qualified support rather than escalating self-help. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which strategy worked where, where did it stop helping, and which contexts remain
      unknown? Keep a conditional choice rather than a universal favorite. Three ordinary attempts cannot
      establish recovery or reliable use during crisis.


      Examples: Supportive: A message pause and a direct request were used in different ordinary situations;
      a third event revealed that repeated rereading was unhelpful, so the person used a clear return
      plan.


      Mixed: Both strategies helped at low stress with familiar people, but no unfamiliar or higher-stress
      context occurred and those limits remained explicit.


      Contradictory: The person provoked conflict to test a skill, intensified an unhelpful strategy or
      claimed low-stress rehearsals proved crisis competence.


      Inconclusive: Two strategies were described but no real use was recorded, so generalization across
      everyday situations remains untested.'
