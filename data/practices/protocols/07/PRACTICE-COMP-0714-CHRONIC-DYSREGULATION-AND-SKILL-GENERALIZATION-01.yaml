        expected: true
  - stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A2
    sequence: 2
    title: Use both strategies in natural nonideal conditions
    instructions: 'Across four natural opportunities, use each strategy at least once and include both
      contexts if they occur. Record context, starting intensity, strategy, whether the behavioral marker
      occurred and any unwanted effect. Do not provoke a trigger or increase intensity for the test. Missing
      opportunities remain missing rather than being replaced by imagined success.


      Observation checks: Four natural uses or missing opportunities are recorded; Each strategy and each
      available context receives representation; Intensity behavior and unwanted effects are observed;
      No trigger or distress is deliberately induced. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01
      action_stable_id: PRACTICE-COMP-0714-CHRONIC-DYSREGULATION-AND-SKILL-GENERALIZATION-01-A2
      competency_stable_id: '07.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0714_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0714_a2_primary
        kind: artifact
        role: primary
        weight: '1'
