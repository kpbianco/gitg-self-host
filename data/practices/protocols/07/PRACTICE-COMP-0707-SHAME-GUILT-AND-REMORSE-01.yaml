  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Shame, guilt, and remorse; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use a private draft or an accessible communication channel. An apology is not required when the
      supposed obligation was coercive or no wrongdoing is established. Seek appropriate professional
      advice for high-stakes responsibility questions; this exercise cannot adjudicate them.
    cultural_context:
    - Adapt the expression of Shame, guilt, and remorse to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a private draft or an accessible communication channel. An apology is not required when the
      supposed obligation was coercive or no wrongdoing is established. Seek appropriate professional
      advice for high-stakes responsibility questions; this exercise cannot adjudicate them.
  pause_conditions:
  - Pause Shame, guilt, and remorse when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Shame, guilt, and remorse practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Shame, guilt, and remorse situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
