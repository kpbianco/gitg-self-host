meaning_and_fit:
  purpose: Separate global self-condemnation from a specific responsibility, make a proportionate repair
    and identify conduct that can change.
  why_recommended: Separate global self-condemnation from a specific responsibility, make a proportionate
    repair and identify conduct that can change.
  claims:
  - statement: Separate global self-condemnation from a specific responsibility, make a proportionate
      repair and identify conduct that can change.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Shame, guilt, and remorse practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Shame, guilt, and remorse as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a private draft or an accessible communication channel. An apology is
    not required when the supposed obligation was coercive or no wrongdoing is established. Seek appropriate
    professional advice for high-stakes responsibility questions; this exercise cannot adjudicate them.
  opportunity_considerations: 'Use an ordinary lapse or this supplied case: you promised to return a borrowed
    book yesterday, forgot and have not yet told its owner. You now think you are an entirely unreliable
    person. Do not select abuse, a legal dispute or a traumatic event for this exercise.'
  prerequisites:
  - 'Use an ordinary lapse or this supplied case: you promised to return a borrowed book yesterday, forgot
    and have not yet told its owner. You now think you are an entirely unreliable person. Do not select
    abuse, a legal dispute or a traumatic event for this exercise.'
  dependencies: []
  safe_alternatives:
  - Use a private draft or an accessible communication channel. An apology is not required when the supposed
    obligation was coercive or no wrongdoing is established. Seek appropriate professional advice for
    high-stakes responsibility questions; this exercise cannot adjudicate them.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Shame, guilt, and remorse differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Shame, guilt, and remorse
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an ordinary lapse or this supplied case: you promised to return a borrowed book yesterday,
    forgot and have not yet told its owner. You now think you are an entirely unreliable person. Do not
    select abuse, a legal dispute or a traumatic event for this exercise. Goal: Separate global self-condemnation
    from a specific responsibility, make a proportionate repair and identify conduct that can change.
    Scope: One manageable lapse exercises remorse and repair. The exercise does not establish legal fault,
    require confession of private history or assume that every guilty feeling reflects actual wrongdoing.
    Time and effort: About 15 minutes to separate claims, one practical repair opportunity, and a short
    review at the next comparable commitment. Adaptation: Use a private draft or an accessible communication
    channel. An apology is not required when the supposed obligation was coercive or no wrongdoing is
    established. Seek appropriate professional advice for high-stakes responsibility questions; this exercise
    cannot adjudicate them. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a private draft or an accessible communication channel. An apology is not required
    when the supposed obligation was coercive or no wrongdoing is established. Seek appropriate professional
    advice for high-stakes responsibility questions; this exercise cannot adjudicate them.
  expected_burden: About 15 minutes to separate claims, one practical repair opportunity, and a short
    review at the next comparable commitment.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Shame, guilt, and remorse protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Shame, guilt, and remorse action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a private
    draft or an accessible communication channel. An apology is not required when the supposed obligation
    was coercive or no wrongdoing is established. Seek appropriate professional advice for high-stakes
    responsibility questions; this exercise cannot adjudicate them.
  actions:
  - stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A1
    sequence: 1
    title: Translate self-condemnation into a checkable account of conduct
    instructions: 'Write the global verdict, then replace it with the specific action or omission, the
      actual agreement, known impact and uncertainty. For the case, I missed the agreed return date is
      supported; I can never be trusted goes beyond the evidence. Ask whether the obligation was freely
      yours and realistic, rather than accepting blame assigned by someone else. If no wrongdoing is supported,
      write a clarification or boundary instead of manufacturing an apology. Where responsibility is real,
      name it plainly without using contextual difficulty as automatic absolution.


      Observation checks: The global verdict is distinguished from a specific act; Responsibility is checked
      against a real obligation; Known impact is separated from imagined blame; Context neither erases
      responsibility nor establishes total badness. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01
      action_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A1
      competency_stable_id: '07.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0707_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0707_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_global_verdict_is_distinguished_from_a_specific_act
        - responsibility_is_checked_against_a_real_obligation
        - known_impact_is_separated_from_imagined_blame
        - context_neither_erases_responsibility_nor_establishes_total_badness
      - measurement_id: c0707_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0707_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A2
    sequence: 2
    title: Offer a repair that addresses the impact without demanding absolution
    instructions: 'For a real lapse, communicate the act you own, its known impact and an achievable correction.
      In the case: I missed the return date and should have told you. I can return the book this afternoon;
      does that work, or is another arrangement needed? Avoid asking the owner to reassure you that you
      are good, explain away the harm or forgive on demand. Carry out the agreed correction if possible
      and record what actually happened. In rehearsal, write the offer and respond to a delayed or declined
      arrangement without inventing acceptance.


      Observation checks: The repair addresses the specific impact; The offer does not demand reassurance
      or forgiveness; Promised correction is distinguished from completed correction; The affected person''s
      response remains their choice. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01
      action_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A2
      competency_stable_id: '07.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0707_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0707_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_repair_addresses_the_specific_impact
        - the_offer_does_not_demand_reassurance_or_forgiveness
        - promised_correction_is_distinguished_from_completed_correction
        - the_affected_person_s_response_remains_their_choice
      - measurement_id: c0707_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0707_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A3
    sequence: 3
    title: Change one repeatable behavior and revisit it at the next opportunity
    instructions: 'Choose a change directly connected to the lapse: record the return date where you will
      see it, agree a date you can meet, or notify the owner before a delay. Put the change in place and
      use it at the next comparable ordinary commitment when available. Compare what you did with the
      earlier pattern, including any repeat lapse. Renew responsibility and adjust the arrangement if
      needed; do not turn a second mistake into proof that change is impossible. If no new opportunity
      occurs, record the installed support and leave changed future conduct untested.


      Observation checks: A prevention change is tied to the original lapse; The change is actually put
      in place; Its use is checked at a real later opportunity when available; A repeat lapse prompts
      specific revision rather than global condemnation. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: What responsibility was yours, what repair occurred and what changed in conduct? Leave
      the other person''s forgiveness and the next opportunity unknown when unavailable. Neither remorse
      nor a completed repair measures total character.


      Examples: Supportive: The late return was acknowledged, the book was returned as agreed and a visible
      reminder was used for the next borrowing arrangement.


      Mixed: The correction was completed but the owner remained upset; the person accepted that response
      and kept the prevention change.


      Contradictory: An apology became a demand for reassurance, or self-hatred replaced returning the
      item and changing the unreliable arrangement.


      Inconclusive: The person wrote that everyone makes mistakes but did not examine responsibility,
      propose a correction or install a conduct change.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01
      action_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A3
      competency_stable_id: '07.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
