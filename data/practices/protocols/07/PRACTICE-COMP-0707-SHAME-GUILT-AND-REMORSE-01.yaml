meaning_and_fit:
  purpose: Separate a condemning identity verdict from responsibility for a particular action, then choose
    proportionate repair, prevention and renewed conduct.
  why_recommended: Separate a condemning identity verdict from responsibility for a particular action,
    then choose proportionate repair, prevention and renewed conduct.
  claims:
  - statement: Separate a condemning identity verdict from responsibility for a particular action, then
      choose proportionate repair, prevention and renewed conduct.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Shame, guilt, and remorse practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Shame, guilt, and remorse as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a private voice note, advisor or fictional case. No disclosure of trauma,
    illegal conduct or identifying details is required. Seek appropriate legal, clinical, safeguarding
    or spiritual counsel for high-stakes harm; do not use this exercise to pressure contact or bypass
    formal accountability.
  opportunity_considerations: 'Use the supplied low-stakes case: you forgot a commitment and caused a
    teammate extra work. Prepare five headings—fact, your choice, impact, context without excuse, and
    what is not established about your worth. Exclude abuse, active legal disputes and unsafe contact
    from self-guided repair.'
  prerequisites:
  - 'Use the supplied low-stakes case: you forgot a commitment and caused a teammate extra work. Prepare
    five headings—fact, your choice, impact, context without excuse, and what is not established about
    your worth. Exclude abuse, active legal disputes and unsafe contact from self-guided repair.'
  dependencies: []
  safe_alternatives:
  - Use a private voice note, advisor or fictional case. No disclosure of trauma, illegal conduct or identifying
    details is required. Seek appropriate legal, clinical, safeguarding or spiritual counsel for high-stakes
    harm; do not use this exercise to pressure contact or bypass formal accountability.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Shame, guilt, and remorse differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Shame, guilt, and remorse
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied low-stakes case: you forgot a commitment and caused a teammate extra work.
    Prepare five headings—fact, your choice, impact, context without excuse, and what is not established
    about your worth. Exclude abuse, active legal disputes and unsafe contact from self-guided repair.
    Goal: Separate a condemning identity verdict from responsibility for a particular action, then choose
    proportionate repair, prevention and renewed conduct. Scope: This addresses one manageable event;
    it does not determine legal culpability, compel confession, require contact with someone harmed or
    erase consequences. Time and effort: Two private 15-minute sessions, one bounded repair or prevention
    action and a 10-minute follow-up. Adaptation: Use a private voice note, advisor or fictional case.
    No disclosure of trauma, illegal conduct or identifying details is required. Seek appropriate legal,
    clinical, safeguarding or spiritual counsel for high-stakes harm; do not use this exercise to pressure
    contact or bypass formal accountability. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a private voice note, advisor or fictional case. No disclosure of trauma, illegal
    conduct or identifying details is required. Seek appropriate legal, clinical, safeguarding or spiritual
    counsel for high-stakes harm; do not use this exercise to pressure contact or bypass formal accountability.
  expected_burden: Two private 15-minute sessions, one bounded repair or prevention action and a 10-minute
    follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Shame, guilt, and remorse protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Shame, guilt, and remorse action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a private
    voice note, advisor or fictional case. No disclosure of trauma, illegal conduct or identifying details
    is required. Seek appropriate legal, clinical, safeguarding or spiritual counsel for high-stakes harm;
    do not use this exercise to pressure contact or bypass formal accountability.
  actions:
  - stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A1
    sequence: 1
    title: Replace the identity verdict with an accountable event record
    instructions: 'Write the observable event and its likely impact. Name the choice or omission you own,
      relevant constraints that explain but do not automatically excuse it, and responsibility that belongs
      elsewhere or remains uncertain. Translate I am useless into I missed the agreed reminder and did
      not notify the team, which created extra work.


      Observation checks: The event and impact replace a global identity verdict; Owned choice and contextual
      constraint are both visible; Responsibility belonging elsewhere is not absorbed; Uncertainty is
      preserved where facts are incomplete. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01
      action_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A1
      competency_stable_id: '07.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0707_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0707_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_event_and_impact_replace_a_global_identity_verdict
        - owned_choice_and_contextual_constraint_are_both_visible
        - responsibility_belonging_elsewhere_is_not_absorbed
        - uncertainty_is_preserved_where_facts_are_incomplete
      - measurement_id: c0707_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0707_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A2
    sequence: 2
    title: Select repair, consequence and prevention separately
    instructions: 'List one repair for the impact, one consequence you may need to accept and one prevention
      change. Check that the repair is wanted, safe and within your authority; an apology does not demand
      forgiveness, restitution does not buy absolution and no contact may be the appropriate boundary.
      For the default, offer to restore the work, accept the schedule consequence and add a shared reminder.


      Observation checks: Repair consequence and prevention are distinct; The proposed repair respects
      consent and safety; Forgiveness or reassurance is not demanded; A concrete prevention change addresses
      the actual failure. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01
      action_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A2
      competency_stable_id: '07.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0707_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0707_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - repair_consequence_and_prevention_are_distinct
        - the_proposed_repair_respects_consent_and_safety
        - forgiveness_or_reassurance_is_not_demanded
        - a_concrete_prevention_change_addresses_the_actual_failure
      - measurement_id: c0707_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0707_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A3
    sequence: 3
    title: Act where appropriate and permit renewed conduct
    instructions: 'Complete the safe repair or prevention step, or document why direct action is unsuitable
      and use an appropriate advisor or process. Record the response without turning acceptance into proof
      of worth. State one standard for the next similar event and carry it out when the opportunity occurs;
      continued self-punishment does not substitute for changed conduct.


      Observation checks: A safe repair prevention or qualified process is used; The other person''s response
      is not controlled or reinterpreted; A next-event standard is explicit; Self-care and accountability
      coexist without erasing consequences. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which responsibility became clearer once the verdict about your whole self was removed,
      and what repair is still owed?


      Examples: Supportive: The person owned the missed reminder, repaired part of the extra work, accepted
      the consequence and changed the notification system.


      Mixed: The apology and prevention step were appropriate, but the person still sought reassurance
      that no consequence should follow.


      Contradictory: Self-condemnation replaced repair, or contextual pressure was used to deny a clearly
      owned action.


      Inconclusive: The person repeated a compassionate phrase without identifying the event, impact or
      any next conduct.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01
      action_stable_id: PRACTICE-COMP-0707-SHAME-GUILT-AND-REMORSE-01-A3
      competency_stable_id: '07.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
