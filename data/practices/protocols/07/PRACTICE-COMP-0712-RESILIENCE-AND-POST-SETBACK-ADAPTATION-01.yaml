      Resilience and post-setback adaptation; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a visual six-box form, dictation or a support person. A fictional failed-task case practices
      analysis only. Do not rush debriefing after trauma, bereavement or medical crisis; use qualified
      support and stabilization before any optional learning exercise.
    cultural_context:
    - Adapt the expression of Resilience and post-setback adaptation to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a visual six-box form, dictation or a support person. A fictional failed-task case practices
      analysis only. Do not rush debriefing after trauma, bereavement or medical crisis; use qualified
      support and stabilization before any optional learning exercise.
  pause_conditions:
  - Pause Resilience and post-setback adaptation when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Resilience and post-setback adaptation practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Resilience and post-setback adaptation situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
