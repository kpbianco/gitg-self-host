meaning_and_fit:
  purpose: Separate facts, responsibility, lessons, support and recovery needs, then make and evaluate
    a concrete adjustment after a setback.
  why_recommended: Separate facts, responsibility, lessons, support and recovery needs, then make and
    evaluate a concrete adjustment after a setback.
  claims:
  - statement: Separate facts, responsibility, lessons, support and recovery needs, then make and evaluate
      a concrete adjustment after a setback.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Resilience and post-setback adaptation practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Resilience and post-setback adaptation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use dictation, an accessible checklist or a willing helper. A small supplied
    writing task is a valid adaptation exercise but does not reproduce resilience after major loss. Do
    not create a stressful failure or withhold support to make a retry harder.
  opportunity_considerations: 'Use a modest real setback, or perform this supplied exercise: in two minutes
    draft a clear invitation containing a purpose, time, place or access route, and a way to reply. Check
    it against those four requirements. If nothing is missing, use the case variation that the proposed
    time is unavailable; do not claim your first draft failed.'
  prerequisites:
  - 'Use a modest real setback, or perform this supplied exercise: in two minutes draft a clear invitation
    containing a purpose, time, place or access route, and a way to reply. Check it against those four
    requirements. If nothing is missing, use the case variation that the proposed time is unavailable;
    do not claim your first draft failed.'
  dependencies: []
  safe_alternatives:
  - Use dictation, an accessible checklist or a willing helper. A small supplied writing task is a valid
    adaptation exercise but does not reproduce resilience after major loss. Do not create a stressful
    failure or withhold support to make a retry harder.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Resilience and post-setback adaptation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Resilience and post-setback
    adaptation as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a modest real setback, or perform this supplied exercise: in two minutes draft a clear invitation
    containing a purpose, time, place or access route, and a way to reply. Check it against those four
    requirements. If nothing is missing, use the case variation that the proposed time is unavailable;
    do not claim your first draft failed. Goal: Separate facts, responsibility, lessons, support and recovery
    needs, then make and evaluate a concrete adjustment after a setback. Scope: One revised attempt practices
    adaptation. It does not require enduring a harmful goal, overcoming structural barriers alone or interpreting
    every disruption as personal failure. Time and effort: About 20 minutes to reconstruct and redesign,
    one bounded retry and a short review. Adaptation: Use dictation, an accessible checklist or a willing
    helper. A small supplied writing task is a valid adaptation exercise but does not reproduce resilience
    after major loss. Do not create a stressful failure or withhold support to make a retry harder. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use dictation, an accessible checklist or a willing helper. A small supplied writing
    task is a valid adaptation exercise but does not reproduce resilience after major loss. Do not create
    a stressful failure or withhold support to make a retry harder.
  expected_burden: About 20 minutes to reconstruct and redesign, one bounded retry and a short review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Resilience and post-setback adaptation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Resilience and post-setback adaptation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use dictation,
    an accessible checklist or a willing helper. A small supplied writing task is a valid adaptation exercise
    but does not reproduce resilience after major loss. Do not create a stressful failure or withhold
    support to make a retry harder.
  actions:
  - stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A1
    sequence: 1
    title: Reconstruct the setback without collapsing every cause into blame
    instructions: 'Describe the intended result, what actually happened and the evidence for the gap.
      Sort contributing factors into choices you controlled, constraints you did not control and questions
      still unresolved. For the invitation, an omitted reply route differs from a recipient''s unavailable
      time. Name your actual responsibility and one recoverable lesson without attributing motives to
      others. Add what recovery requires before a useful retry, such as a break, clarification or reduced
      scope. Do not make exhaustion, shame or immediately working harder the price of showing resilience.


      Observation checks: The intended and actual outcomes are concretely compared; Controlled factors
      constraints and unknowns are separated; Responsibility and a usable lesson are stated proportionately;
      Recovery needs are included before the next attempt. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A1
      competency_stable_id: '07.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0712_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0712_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_intended_and_actual_outcomes_are_concretely_compared
        - controlled_factors_constraints_and_unknowns_are_separated
        - responsibility_and_a_usable_lesson_are_stated_proportionately
        - recovery_needs_are_included_before_the_next_attempt
      - measurement_id: c0712_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0712_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A2
    sequence: 2
    title: Change the mechanism that contributed to the setback
    instructions: 'Select one adjustment with a reason it addresses the observed gap. In the invitation
      example, use a four-item check before sending if information was omitted; ask about availability
      before proposing a single fixed time if timing was the problem. Identify useful support, such as
      a willing reader checking clarity, and ask only if needed. Define the next experiment''s outcome
      before attempting it: all four details are understandable, or a mutually available option is identified.
      If the original goal is no longer worthwhile or safe, explain a reasoned change rather than repeating
      it to prove perseverance.


      Observation checks: The adjustment addresses an observed cause rather than generic effort; Support
      is considered as a legitimate resource; The retry has a concrete outcome criterion; Continuing the
      original goal is checked for suitability. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A2
      competency_stable_id: '07.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0712_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0712_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_adjustment_addresses_an_observed_cause_rather_than_generic_effort
        - support_is_considered_as_a_legitimate_resource
        - the_retry_has_a_concrete_outcome_criterion
        - continuing_the_original_goal_is_checked_for_suitability
      - measurement_id: c0712_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0712_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A3
    sequence: 3
    title: Retry with the adjustment and compare the actual outcomes
    instructions: 'Carry out the revised attempt. For the supplied exercise, produce a new invitation
      and check each required detail; if using the unavailable-time variation, write a message offering
      two feasible alternatives and a way to suggest another. A private draft tests completeness, not
      whether anyone attends. Compare the new outcome with the first, including any remaining defect.
      Retain the adjustment, change it again or close the goal for an explicit reason. Record the renewed
      attempt itself separately from success, so an informative second setback is not hidden.


      Observation checks: A revised attempt is actually performed; The stated criterion is applied to
      its result; Draft quality is distinguished from real-world uptake; Remaining defects inform a concrete
      next decision. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Which adjustment changed the result, what support or recovery mattered and what remains
      outside your control? Keep, revise or end the approach with reasons. Persistence alone is not proof
      that a goal is wise.


      Examples: Supportive: A missing reply route was identified, a four-part check was added and the
      second invitation contained all necessary information.


      Mixed: The revised invitation was complete but no shared time was available; communication improved
      while the real-world constraint remained.


      Contradictory: The person repeated the same approach with more pressure, blamed themselves for another
      person''s availability or ignored the need for recovery.


      Inconclusive: A lesson about trying harder was written without a specific adjustment or a renewed
      attempt.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A3
      competency_stable_id: '07.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0712_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0712_a3_primary
        kind: artifact
        role: primary
