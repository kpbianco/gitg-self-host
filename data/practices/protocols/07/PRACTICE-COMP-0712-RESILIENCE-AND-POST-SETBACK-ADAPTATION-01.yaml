meaning_and_fit:
  purpose: Separate facts, responsibility, lessons, support and recovery after disruption, change one
    controllable variable and test a renewed attempt.
  why_recommended: Separate facts, responsibility, lessons, support and recovery after disruption, change
    one controllable variable and test a renewed attempt.
  claims:
  - statement: Separate facts, responsibility, lessons, support and recovery after disruption, change
      one controllable variable and test a renewed attempt.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Resilience and post-setback adaptation practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Resilience and post-setback adaptation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a visual six-box form, dictation or a support person. A fictional failed-task
    case practices analysis only. Do not rush debriefing after trauma, bereavement or medical crisis;
    use qualified support and stabilization before any optional learning exercise.
  opportunity_considerations: Use the default of failing to finish a planned household task before guests
    arrive. Prepare six headings—facts, effect, my responsibility, outside conditions, recovery need and
    support available. Wait until acute danger or shock has passed.
  prerequisites:
  - Use the default of failing to finish a planned household task before guests arrive. Prepare six headings—facts,
    effect, my responsibility, outside conditions, recovery need and support available. Wait until acute
    danger or shock has passed.
  dependencies: []
  safe_alternatives:
  - Use a visual six-box form, dictation or a support person. A fictional failed-task case practices analysis
