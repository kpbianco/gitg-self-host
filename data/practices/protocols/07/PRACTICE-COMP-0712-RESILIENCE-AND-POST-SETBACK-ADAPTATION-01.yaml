  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Resilience and post-setback adaptation explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Resilience and post-setback adaptation
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Resilience and post-setback adaptation observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Resilience and post-setback adaptation rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Debrief the setback without inventing a clean lesson. Observed checks:
    Facts effects and unknowns are separated; Personal and external contributions are bounded; A recovery
    need and available support are identified; Any lesson is provisional and tied to evidence. Action
    2: Change one controllable variable for the restart. Observed checks: One controllable variable is
    selected from the debrief; The change is specific and feasible; A visible restart result is defined;
    Needed recovery and support are not treated as weakness. Action 3: Attempt, compare and preserve an
    adverse result. Observed checks: A renewed attempt or explicit deferral is recorded; Result effort
    and conditions are compared with the setback; Adverse or null effects remain in the review; The next
    decision follows evidence rather than toughness.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A motivational statement replaced the factual debrief
    and no variable was tested.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Resilience
    and post-setback adaptation contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
