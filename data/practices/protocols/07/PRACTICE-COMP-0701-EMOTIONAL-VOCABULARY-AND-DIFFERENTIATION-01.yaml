        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A3
    sequence: 3
    title: Check whether greater precision changes the next response
    instructions: 'Choose a proportionate response to the leading concern: ask about another date for
      disconnection, state an agreement that needs repair, or postpone an optional discussion until rested.
      Draft or make that response in a suitable real context. Repeat the six-line description at a second
      ordinary moment. For a fictional variation, the friend explains they are ill and offers another
      date; reconsider what changes and what remains unknown. Compare the original urge with the chosen
      response. Keep an unchanged feeling visible; a clearer description can be useful without immediately
      changing mood.


      Observation checks: The response fits the identified concern; A second moment or explicit case variation
      is examined; New information can revise the interpretation; Mood change is not required to claim
      clearer description. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Which distinction changed your response, and which label remains tentative? Keep the
      useful question or response and revisit it after new information. Two descriptions do not establish
      emotional accuracy across relationships.


      Examples: Supportive: A cancelled visit was first called anger; distinguishing hurt and exhaustion
      led to a clear rescheduling request instead of an accusation.


      Mixed: The person identified hurt but still did not know the reason for cancellation, so the interpretation
      stayed provisional.


      Contradictory: A feeling of rejection was recorded as proof that the friend intended harm, and the
      label justified a hostile reply.


      Inconclusive: A list of emotion words was copied without connecting any word to an event, meaning
      or possible response.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
