        expected: true
  - stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A2
    sequence: 2
    title: Distinguish neighboring feelings by the concern each points toward
    instructions: 'Compare these possible meanings: anger about a broken agreement; hurt about disconnection;
      shame about seeing oneself as unwanted; fear about losing the relationship; envy about someone else
      receiving time; grief about an actual loss; and exhaustion about depleted capacity. These are prompts,
      not definitions that fit everyone. Select the one or two best-supported descriptions and explain
      why a nearby label fits less well. In the cancellation case, no evidence yet establishes envy or
      a permanent loss. Write one question that could clarify the situation, such as whether the friend
      wants to reschedule, without demanding that they certify your worth.


      Observation checks: All seven neighboring states are considered; Selected labels have case-specific
      reasons; An unsupported label is left uncertain; A clarifying question addresses the actual concern.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01
      action_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A2
      competency_stable_id: '07.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0701_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0701_a2_primary
        kind: artifact
        role: primary
