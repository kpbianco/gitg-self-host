        - an_unsupported_label_is_left_uncertain
        - a_clarifying_question_addresses_the_actual_concern
      - measurement_id: c0701_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0701_a2_adverse
        kind: boolean
        role: adverse
