    title: Bound the qualified question for Emotional vocabulary and differentiation
    instructions: 'Turn Emotional vocabulary and differentiation into one educational or planning question
      and identify the qualification and jurisdiction needed to answer it. Use the canonical scope to
      separate general learning from diagnosis, treatment, legal advice, financial advice, safeguarding
      decisions, or other professional judgment: Name emotions, intensity, bodily sensations, triggers,
      meanings, and action urges with precision.'
    expected_time: 15-25 minutes
