meaning_and_fit:
  purpose: Separate emotions, physical sensations, interpretations and action urges, then choose a response
    that fits the actual concern.
  why_recommended: Separate emotions, physical sensations, interpretations and action urges, then choose
    a response that fits the actual concern.
  claims:
  - statement: Separate emotions, physical sensations, interpretations and action urges, then choose a
      response that fits the actual concern.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Emotional vocabulary and differentiation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Emotional vocabulary and differentiation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use familiar words in any language, pictures, intensity words or a communication
    partner who does not select feelings for you. Bodily sensations can remain unknown. A fictional comparison
    exercises vocabulary and reasoning, not live emotional regulation.
  opportunity_considerations: 'Use a private note or voice memo and a recent manageable moment, or this
    supplied case: a friend cancels a visit; you feel hot and tired, want to send a sharp message, and
    think you do not matter. The reason for cancellation is unknown. No distressing memory is required.'
  prerequisites:
  - 'Use a private note or voice memo and a recent manageable moment, or this supplied case: a friend
    cancels a visit; you feel hot and tired, want to send a sharp message, and think you do not matter.
    The reason for cancellation is unknown. No distressing memory is required.'
  dependencies: []
  safe_alternatives:
  - Use familiar words in any language, pictures, intensity words or a communication partner who does
    not select feelings for you. Bodily sensations can remain unknown. A fictional comparison exercises
