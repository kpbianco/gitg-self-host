  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Emotional vocabulary and differentiation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private note or voice memo and a recent manageable moment, or this supplied case: a friend
    cancels a visit; you feel hot and tired, want to send a sharp message, and think you do not matter.
    The reason for cancellation is unknown. No distressing memory is required. Goal: Separate emotions,
    physical sensations, interpretations and action urges, then choose a response that fits the actual
    concern. Scope: Two ordinary moments exercise emotional differentiation. Labels are working descriptions,
    not diagnoses or evidence that an interpretation of another person is true. Time and effort: About
    15 minutes for the first description and 10 minutes for a second ordinary moment or case variation.
    Adaptation: Use familiar words in any language, pictures, intensity words or a communication partner
    who does not select feelings for you. Bodily sensations can remain unknown. A fictional comparison
    exercises vocabulary and reasoning, not live emotional regulation. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use familiar words in any language, pictures, intensity words or a communication
    partner who does not select feelings for you. Bodily sensations can remain unknown. A fictional comparison
    exercises vocabulary and reasoning, not live emotional regulation.
  expected_burden: About 15 minutes for the first description and 10 minutes for a second ordinary moment
    or case variation.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Emotional vocabulary and differentiation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Emotional vocabulary and differentiation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use familiar
    words in any language, pictures, intensity words or a communication partner who does not select feelings
    for you. Bodily sensations can remain unknown. A fictional comparison exercises vocabulary and reasoning,
    not live emotional regulation.
  actions:
  - stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A1
    sequence: 1
    title: Separate what happened from what the moment seemed to mean
    instructions: 'Write six short lines: the observable event; possible emotions; their mild, moderate
      or strong intensity; bodily sensations or unknown; the meaning you gave the event; and the action
      urge. For the supplied case, cancellation is the event, feeling unimportant is an interpretation,
      heat is a sensation and sending a sharp reply is an urge. Do not turn I feel ignored into proof
      of the friend''s intention. Allow several feelings and different intensities to coexist. If using
      the fictional case, mark inferred feelings as possibilities rather than claiming to know the person''s
      inner state.


      Observation checks: The observable event is separated from interpretation; Emotions and intensity
      are described provisionally; Sensations are distinguished from action urges; Unknown intentions
      remain unknown. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01
      action_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A1
      competency_stable_id: '07.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0701_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0701_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_observable_event_is_separated_from_interpretation
        - emotions_and_intensity_are_described_provisionally
        - sensations_are_distinguished_from_action_urges
        - unknown_intentions_remain_unknown
      - measurement_id: c0701_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0701_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
