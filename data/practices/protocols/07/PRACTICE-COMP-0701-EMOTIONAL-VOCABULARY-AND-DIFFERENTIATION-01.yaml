meaning_and_fit:
  purpose: Distinguish an emotion's intensity, bodily signals, trigger, meaning and action urge from nearby
    possibilities before deciding what to do.
  why_recommended: Distinguish an emotion's intensity, bodily signals, trigger, meaning and action urge
    from nearby possibilities before deciding what to do.
  claims:
  - statement: Distinguish an emotion's intensity, bodily signals, trigger, meaning and action urge from
      nearby possibilities before deciding what to do.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Emotional vocabulary and differentiation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Emotional vocabulary and differentiation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use icons, a word bank, speech-to-text or only event–urge–response if detailed
    interoception is inaccessible. A fictional case practices classification but is not personal emotional
    evidence. Stop and seek suitable support if attention to the episode becomes overwhelming or unsafe.
  opportunity_considerations: 'Use a private page and the supplied default: a friend changes a plan shortly
    before it starts and you want to send a sharp reply. Make six headings—event, body, intensity, possible
    emotions, meaning and urge. Choose a similarly ordinary event if preferred.'
  prerequisites:
  - 'Use a private page and the supplied default: a friend changes a plan shortly before it starts and
    you want to send a sharp reply. Make six headings—event, body, intensity, possible emotions, meaning
    and urge. Choose a similarly ordinary event if preferred.'
  dependencies: []
  safe_alternatives:
  - Use icons, a word bank, speech-to-text or only event–urge–response if detailed interoception is inaccessible.
    A fictional case practices classification but is not personal emotional evidence. Stop and seek suitable
    support if attention to the episode becomes overwhelming or unsafe.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Emotional vocabulary and differentiation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Emotional vocabulary and differentiation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private page and the supplied default: a friend changes a plan shortly before it starts
    and you want to send a sharp reply. Make six headings—event, body, intensity, possible emotions, meaning
    and urge. Choose a similarly ordinary event if preferred. Goal: Distinguish an emotion''s intensity,
    bodily signals, trigger, meaning and action urge from nearby possibilities before deciding what to
    do. Scope: One ordinary episode practices emotional differentiation; it does not diagnose a condition,
    prove why the feeling occurred or require disclosure of private history. Time and effort: Two private
    10-minute passes over one manageable episode and a five-minute review after the next relevant action.
    Adaptation: Use icons, a word bank, speech-to-text or only event–urge–response if detailed interoception
    is inaccessible. A fictional case practices classification but is not personal emotional evidence.
    Stop and seek suitable support if attention to the episode becomes overwhelming or unsafe. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use icons, a word bank, speech-to-text or only event–urge–response if detailed
    interoception is inaccessible. A fictional case practices classification but is not personal emotional
    evidence. Stop and seek suitable support if attention to the episode becomes overwhelming or unsafe.
  expected_burden: Two private 10-minute passes over one manageable episode and a five-minute review after
    the next relevant action.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Emotional vocabulary and differentiation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Emotional vocabulary and differentiation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use icons,
    a word bank, speech-to-text or only event–urge–response if detailed interoception is inaccessible.
    A fictional case practices classification but is not personal emotional evidence. Stop and seek suitable
    support if attention to the episode becomes overwhelming or unsafe.
  actions:
  - stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A1
    sequence: 1
    title: Record the episode before giving it one label
    instructions: 'Write only the observable event first, then note a 0–10 intensity, bodily sensations
      and the action urge. For the default, the event is the changed plan; a hot face, dropped energy
      or tight jaw are observations, while they do not respect me is an interpretation. If no body signal
      is noticeable, record not noticed rather than inventing one.


      Observation checks: The event is separated from its interpretation; Intensity and action urge receive
      explicit entries; Bodily signals are observed or marked not noticed; No motive or diagnosis is assigned
      to another person. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01
      action_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A1
      competency_stable_id: '07.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0701_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0701_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_event_is_separated_from_its_interpretation
        - intensity_and_action_urge_receive_explicit_entries
        - bodily_signals_are_observed_or_marked_not_noticed
        - no_motive_or_diagnosis_is_assigned_to_another_person
      - measurement_id: c0701_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0701_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A2
    sequence: 2
    title: Compare nearby emotions using the actual evidence
    instructions: 'Consider at least three plausible labels from anger, hurt, shame, fear, envy, grief,
      disappointment and exhaustion. For each, write one feature that fits and one that does not. Select
      a provisional primary and secondary emotion or retain uncertainty; for example, disappointment may
      fit the lost plan while anger fits the urge to protest.


      Observation checks: At least three nearby emotions are compared; Each candidate has fitting and
      nonfitting evidence; A primary and secondary label or principled uncertainty is recorded; The label
      does not become a verdict about character. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01
      action_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A2
      competency_stable_id: '07.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0701_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0701_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - at_least_three_nearby_emotions_are_compared
        - each_candidate_has_fitting_and_nonfitting_evidence
        - a_primary_and_secondary_label_or_principled_uncertainty_is_recorded
        - the_label_does_not_become_a_verdict_about_character
      - measurement_id: c0701_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0701_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A3
    sequence: 3
    title: Let the refined label change one next response
    instructions: 'Choose a response matched to the differentiated episode: rest for exhaustion, clarification
      for uncertainty, a direct request for a violated expectation, or time to grieve a loss. Carry out
      one safe response or rehearse it on the default case, then record what the response addressed and
      what remains unresolved. Revise the label if later evidence points elsewhere.


      Observation checks: The response is linked to the identified emotion or need; A safe action or explicitly
      labeled rehearsal occurs; The underlying issue is not dismissed merely because intensity fell; Later
      evidence is allowed to revise the interpretation. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Which distinction changed the available response, and which part of the episode is
      still uncertain?


      Examples: Supportive: The person distinguished disappointment and hurt from anger, delayed the sharp
      reply and made a direct request about future notice.


      Mixed: Several signals and labels were compared, but the chosen response addressed tiredness while
      the changed expectation remained unspoken.


      Contradictory: A single body sensation was treated as proof of a diagnosis or of another person''s
      hostile motive.


      Inconclusive: Emotion words were selected without a specific event, intensity, urge or resulting
      response.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01
      action_stable_id: PRACTICE-COMP-0701-EMOTIONAL-VOCABULARY-AND-DIFFERENTIATION-01-A3
      competency_stable_id: '07.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0701_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0701_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_response_is_linked_to_the_identified_emotion_or_need
        - a_safe_action_or_explicitly_labeled_rehearsal_occurs
        - the_underlying_issue_is_not_dismissed_merely_because_intensity_fell
        - later_evidence_is_allowed_to_revise_the_interpretation
      - measurement_id: c0701_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
