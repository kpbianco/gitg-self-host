  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Anxiety and courageous exposure; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a written, remote, supported or speech-device version of the same ordinary participation goal.
      If no appropriate live opportunity exists, complete the ladder and one rehearsal but label behavioral
      transfer untested. Do not remove prescribed supports or conduct unsupervised exposure to clinical
      fears.
    cultural_context:
    - Adapt the expression of Anxiety and courageous exposure to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a written, remote, supported or speech-device version of the same ordinary participation goal.
      If no appropriate live opportunity exists, complete the ladder and one rehearsal but label behavioral
      transfer untested. Do not remove prescribed supports or conduct unsupervised exposure to clinical
      fears.
  pause_conditions:
  - Pause Anxiety and courageous exposure when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Anxiety and courageous exposure practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Anxiety and courageous exposure situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
