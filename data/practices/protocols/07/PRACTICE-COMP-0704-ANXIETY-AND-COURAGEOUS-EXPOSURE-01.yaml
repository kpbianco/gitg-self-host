meaning_and_fit:
  purpose: Approach a worthwhile and objectively safe avoided situation in small repeatable steps while
    comparing a specific feared prediction with observable outcomes.
  why_recommended: Approach a worthwhile and objectively safe avoided situation in small repeatable steps
    while comparing a specific feared prediction with observable outcomes.
  claims:
  - statement: Approach a worthwhile and objectively safe avoided situation in small repeatable steps
      while comparing a specific feared prediction with observable outcomes.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Exposure therapy is a psychotherapy used for anxiety disorders in which brief supported
      contact with feared material is repeated over time to build tolerance.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-PSYCHOTHERAPIES-EXPOSURE
    limitations: Supports the boundary between clinician-delivered exposure treatment and this product's
      optional low-stakes approach exercise. It does not prescribe unsupervised exposure, validate the
      supplied meeting example or authorize approaching trauma cues, unsafe people, medical risks or severe
      fear without qualified care.
  applicability_question: Does a voluntary, bounded Anxiety and courageous exposure practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Anxiety and courageous exposure as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a written, remote, supported or speech-device version of the same ordinary
    participation goal. If no appropriate live opportunity exists, complete the ladder and one rehearsal
    but label behavioral transfer untested. Do not remove prescribed supports or conduct unsupervised
    exposure to clinical fears.
  opportunity_considerations: 'Use the supplied low-stakes case: asking one routine clarifying question
    in a familiar meeting. The three-step ladder is writing the question, saying it to a trusted person
    or empty room, and asking it in the meeting. Rate expected distress 0–10 and use only a step at 4
    or below.'
  prerequisites:
  - 'Use the supplied low-stakes case: asking one routine clarifying question in a familiar meeting. The
    three-step ladder is writing the question, saying it to a trusted person or empty room, and asking
    it in the meeting. Rate expected distress 0–10 and use only a step at 4 or below.'
  dependencies: []
  safe_alternatives:
  - Use a written, remote, supported or speech-device version of the same ordinary participation goal.
    If no appropriate live opportunity exists, complete the ladder and one rehearsal but label behavioral
    transfer untested. Do not remove prescribed supports or conduct unsupervised exposure to clinical
    fears.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Anxiety and courageous exposure differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Anxiety and courageous exposure
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied low-stakes case: asking one routine clarifying question in a familiar meeting.
    The three-step ladder is writing the question, saying it to a trusted person or empty room, and asking
    it in the meeting. Rate expected distress 0–10 and use only a step at 4 or below. Goal: Approach a
    worthwhile and objectively safe avoided situation in small repeatable steps while comparing a specific
    feared prediction with observable outcomes. Scope: This is an ordinary comfort-zone experiment, not
    treatment for an anxiety disorder, trauma, OCD, panic, a phobia or another clinical concern. Clinical
    exposure belongs in an appropriate professional plan. Time and effort: Twenty minutes to build the
    ladder, two 5–15 minute attempts at one step and a 10-minute comparison. Adaptation: Use a written,
    remote, supported or speech-device version of the same ordinary participation goal. If no appropriate
    live opportunity exists, complete the ladder and one rehearsal but label behavioral transfer untested.
    Do not remove prescribed supports or conduct unsupervised exposure to clinical fears. Keep personal
    working notes outside the check-in; record only the listed observations.


    Reference support:

    Psychotherapies: https://www.nimh.nih.gov/health/topics/psychotherapies'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written, remote, supported or speech-device version of the same ordinary
    participation goal. If no appropriate live opportunity exists, complete the ladder and one rehearsal
    but label behavioral transfer untested. Do not remove prescribed supports or conduct unsupervised
    exposure to clinical fears.
  expected_burden: Twenty minutes to build the ladder, two 5–15 minute attempts at one step and a 10-minute
    comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Anxiety and courageous exposure protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Anxiety and courageous exposure action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written,
    remote, supported or speech-device version of the same ordinary participation goal. If no appropriate
    live opportunity exists, complete the ladder and one rehearsal but label behavioral transfer untested.
    Do not remove prescribed supports or conduct unsupervised exposure to clinical fears.
  actions:
  - stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A1
    sequence: 1
    title: Bound the fear and choose an objectively safe step
    instructions: 'Write the worthwhile aim, the exact feared prediction and what would be observable
      if it occurred. Check that the situation involves no threat, coercion, trauma cue, medical risk,
      unsafe person or serious consequence. Select the smallest ladder step rated 4 or below; ordinary
      accessibility and communication supports stay in place rather than becoming things to eliminate.


      Observation checks: A worthwhile aim and testable feared prediction are written; The selected step
      is specific and rated manageable; Objective safety and exclusion conditions are checked; Necessary
      access and communication supports remain allowed. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01
      action_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A1
      competency_stable_id: '07.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0704_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0704_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_worthwhile_aim_and_testable_feared_prediction_are_written
        - the_selected_step_is_specific_and_rated_manageable
        - objective_safety_and_exclusion_conditions_are_checked
        - necessary_access_and_communication_supports_remain_allowed
      - measurement_id: c0704_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0704_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A2
    sequence: 2
    title: Approach the same manageable step twice
    instructions: 'Attempt the selected step on two separate safe occasions without escalating merely
      to prove courage. Before each, record the predicted outcome and expected distress; afterward record
      the observed outcome, peak distress and whether you stayed long enough to complete the step. Stop
      if risk changes or distress exceeds the preset limit, and do not count a stopped attempt as failure.


      Observation checks: Two attempts or an explicit safety stop are recorded; Prediction and observed
      outcome are compared each time; Distress stays within the preset boundary or triggers stopping;
      Completion is not equated with fear disappearing. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01
      action_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A2
      competency_stable_id: '07.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0704_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0704_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_attempts_or_an_explicit_safety_stop_are_recorded
        - prediction_and_observed_outcome_are_compared_each_time
        - distress_stays_within_the_preset_boundary_or_triggers_stopping
        - completion_is_not_equated_with_fear_disappearing
      - measurement_id: c0704_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0704_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A3
    sequence: 3
    title: Revise the prediction and decide the next bounded step
    instructions: 'Compare both attempts. Narrow, retain or revise the prediction based on what actually
      happened, including partial feared outcomes. Choose to repeat, take the next small step, defer or
      seek qualified help; give the reason. A rehearsal never counts as completing the real meeting step,
      and worsening or function-limiting anxiety is a reason for professional support.


      Observation checks: Both attempts inform the revised prediction; Partial or adverse outcomes are
      retained; The next step repeat defer or help route has a reason; No treatment or broad anxiety improvement
      is claimed. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What did the two attempts show about the feared prediction, and what is the safest
      honest next step?


      Examples: Supportive: The routine question was rehearsed and asked twice; one answer was brief but
      no ridicule occurred, so the prediction was narrowed rather than erased.


      Mixed: The person completed both attempts, but distress remained high enough that repeating the
      same step is more appropriate than advancing.


      Contradictory: A trauma trigger or dangerous encounter was deliberately provoked, or essential support
      was removed to make the attempt harder.


      Inconclusive: A ladder was written but no step was attempted and rehearsal was reported as real-world
      exposure.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01
      action_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A3
      competency_stable_id: '07.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
