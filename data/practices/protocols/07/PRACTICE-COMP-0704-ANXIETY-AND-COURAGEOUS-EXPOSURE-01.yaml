  pause_conditions:
  - Pause Anxiety and courageous exposure when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Anxiety and courageous exposure practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Anxiety and courageous exposure situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
    care.
