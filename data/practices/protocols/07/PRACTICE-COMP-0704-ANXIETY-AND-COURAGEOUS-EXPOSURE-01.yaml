meaning_and_fit:
  purpose: Approach a worthwhile, suitably safe situation gradually and compare a specific feared outcome
    with what actually happens on repeated attempts.
  why_recommended: Approach a worthwhile, suitably safe situation gradually and compare a specific feared
    outcome with what actually happens on repeated attempts.
  claims:
  - statement: Approach a worthwhile, suitably safe situation gradually and compare a specific feared
      outcome with what actually happens on repeated attempts.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: NHS self-help guidance describes approaching feared situations gradually and repeating
      manageable steps rather than beginning with the most difficult situation.
    classification: safety_precaution
    source_ids:
    - SRC-NHS-GRADUAL-FEAR-APPROACH
    limitations: Supports only the gradual-approach principle. The product-authored ordinary communication
      experiment is not the NHS treatment protocol, does not use its fear-reduction threshold, does not
      remove necessary supports and is not validated anxiety treatment or trauma exposure.
  - statement: Worsening symptoms and severe persistent distress affecting usual activities call for professional
      help; suicidal thoughts or urges to self-harm call for immediate help.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-SELF-HELP-LIMITS
    limitations: Public help-seeking guidance, not a diagnosis or validated product screening tool. The
      source's duration examples are not instructions to wait during danger or deterioration. It does
      not validate the original emotional-awareness, hope or strategy-transfer exercises.
  applicability_question: Does a voluntary, bounded Anxiety and courageous exposure practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Anxiety and courageous exposure as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Text, AAC, an interpreter or another accessible channel can be the actual
    communication route; necessary supports are not failures. With no safe opportunity, work through the
    case privately and label it preparation. An existing clinician-led plan takes precedence; do not alter
    treatment or attempt trauma exposure here.
  opportunity_considerations: Read the NHS Facing your fears reference. Choose a genuinely useful ordinary
    step, such as asking a routine clarification in a setting where questions are welcome. Exclude danger,
    trauma reminders, severe distress, medical challenges and violations of another person's boundaries.
    If suitability is unclear or symptoms impair daily functioning, use qualified help to plan rather
    than starting self-directed exposure.
  prerequisites:
  - Read the NHS Facing your fears reference. Choose a genuinely useful ordinary step, such as asking
    a routine clarification in a setting where questions are welcome. Exclude danger, trauma reminders,
    severe distress, medical challenges and violations of another person's boundaries. If suitability
    is unclear or symptoms impair daily functioning, use qualified help to plan rather than starting self-directed
    exposure.
  dependencies: []
  safe_alternatives:
  - Text, AAC, an interpreter or another accessible channel can be the actual communication route; necessary
    supports are not failures. With no safe opportunity, work through the case privately and label it
    preparation. An existing clinician-led plan takes precedence; do not alter treatment or attempt trauma
    exposure here.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Anxiety and courageous exposure differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Anxiety and courageous exposure
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Read the NHS Facing your fears reference. Choose a genuinely useful ordinary step, such as asking
    a routine clarification in a setting where questions are welcome. Exclude danger, trauma reminders,
    severe distress, medical challenges and violations of another person''s boundaries. If suitability
    is unclear or symptoms impair daily functioning, use qualified help to plan rather than starting self-directed
    exposure. Goal: Approach a worthwhile, suitably safe situation gradually and compare a specific feared
    outcome with what actually happens on repeated attempts. Scope: This is a bounded experiment with
    ordinary mild apprehension, not treatment for an anxiety disorder, trauma, panic or compulsions. Rehearsing
    a fictional case does not demonstrate exposure to a personally feared situation. Time and effort:
    About 15 minutes to prepare, two or more naturally available brief attempts over a week, and 10 minutes
    to compare them. No escalation deadline applies. Adaptation: Text, AAC, an interpreter or another
    accessible channel can be the actual communication route; necessary supports are not failures. With
    no safe opportunity, work through the case privately and label it preparation. An existing clinician-led
    plan takes precedence; do not alter treatment or attempt trauma exposure here. Keep personal working
    notes outside the check-in; record only the listed observations.


    Reference support:

    Facing your fears: https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/facing-your-fears/

    My Mental Health: Do I Need Help?: https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Text, AAC, an interpreter or another accessible channel can be the actual communication
    route; necessary supports are not failures. With no safe opportunity, work through the case privately
    and label it preparation. An existing clinician-led plan takes precedence; do not alter treatment
    or attempt trauma exposure here.
  expected_burden: About 15 minutes to prepare, two or more naturally available brief attempts over a
    week, and 10 minutes to compare them. No escalation deadline applies.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Anxiety and courageous exposure protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Anxiety and courageous exposure action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Text, AAC,
    an interpreter or another accessible channel can be the actual communication route; necessary supports
    are not failures. With no safe opportunity, work through the case privately and label it preparation.
    An existing clinician-led plan takes precedence; do not alter treatment or attempt trauma exposure
    here.
  actions:
  - stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A1
    sequence: 1
    title: Choose the smallest worthwhile step and a prediction you can observe
    instructions: 'Name the value served, such as obtaining information needed to participate. Write two
      or three genuinely feasible versions in increasing personal difficulty: ask a familiar person privately,
      ask a routine question in a welcoming small group, or ask in a larger suitable setting. Start with
      the manageable version, not the most impressive one. Write a testable prediction, such as the person
      will call the question foolish, and what would count as a different outcome. Keep necessary accessibility
      and safety supports. If there is no personally relevant fear, analyze the supplied ladder as preparation
      and leave live attempts unclaimed.


      Observation checks: The step serves a chosen worthwhile purpose; Difficulty is ordered for this
      person rather than assumed; The feared outcome is observable and specific; Suitability and necessary
      supports are preserved. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01
      action_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A1
      competency_stable_id: '07.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0704_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0704_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_step_serves_a_chosen_worthwhile_purpose
        - difficulty_is_ordered_for_this_person_rather_than_assumed
        - the_feared_outcome_is_observable_and_specific
        - suitability_and_necessary_supports_are_preserved
      - measurement_id: c0704_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0704_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A2
    sequence: 2
    title: Make a first ordinary attempt and record the actual response
    instructions: 'At an appropriate opportunity, ask the selected question and allow the ordinary exchange
      to finish without adding an endurance challenge. Record what you predicted, what you actually asked,
      the other person''s observable reply, and any uncertainty. Note whether apprehension was present
      and what you managed while it was present; do not use a required reduction in anxiety as the completion
      rule. A neutral answer can contradict a prediction of ridicule without proving every future interaction
      safe. Stop for actual danger or unmanageable distress and seek suitable support rather than pushing
      through for credit.


      Observation checks: A suitable live attempt actually occurs; Prediction and observable outcome are
      compared; Participation is distinguished from symptom reduction; Uncertainty or a difficult outcome
      is recorded honestly. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01
      action_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A2
      competency_stable_id: '07.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0704_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0704_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_suitable_live_attempt_actually_occurs
        - prediction_and_observable_outcome_are_compared
        - participation_is_distinguished_from_symptom_reduction
        - uncertainty_or_a_difficult_outcome_is_recorded_honestly
      - measurement_id: c0704_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0704_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A3
    sequence: 3
    title: Repeat a suitable step and revise the prediction from both occasions
    instructions: 'Use another natural opportunity for the same manageable step. Repeat rather than automatically
      increasing difficulty; choose a modest next version only if appropriate and freely chosen. Compare
      both predictions with both outcomes, including any dismissive response. If something went badly,
      distinguish the actual problem, such as an unsuitable setting, from a conclusion that all questions
      are unsafe. Decide to repeat, adjust the setting, ask for help or stop this experiment. Keep a missed
      second opportunity pending instead of counting a plan as repeated exposure.


      Observation checks: A second suitable live attempt is recorded; Both outcomes inform the revised
      prediction; Difficulty is not increased automatically; The next choice follows evidence and current
      suitability. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What exactly did each attempt teach about the feared outcome and your ability to participate
      with uncertainty? Retain adverse evidence as well as reassuring evidence. Repeated ordinary attempts
      do not establish treatment success or general fearlessness.


      Examples: Supportive: Two routine questions received usable replies rather than the predicted ridicule;
      apprehension remained, but the person obtained the needed information.


      Mixed: One reply was helpful and one was curt, so the person revised the prediction narrowly and
      considered whether the setting was suitable.


      Contradictory: The person entered an actually unsafe situation or removed a needed communication
      support to make the challenge count as courage.


      Inconclusive: A fear ladder was written or rehearsed, but no personally relevant live attempt occurred,
      so exposure remains untested.'
    expected_time: 15-25 minutes
