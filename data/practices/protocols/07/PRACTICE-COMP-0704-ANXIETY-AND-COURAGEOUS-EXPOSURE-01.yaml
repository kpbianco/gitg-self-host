  performance_rubric: 'Action 1: Bound the fear and choose an objectively safe step. Observed checks:
    A worthwhile aim and testable feared prediction are written; The selected step is specific and rated
    manageable; Objective safety and exclusion conditions are checked; Necessary access and communication
    supports remain allowed. Action 2: Approach the same manageable step twice. Observed checks: Two attempts
    or an explicit safety stop are recorded; Prediction and observed outcome are compared each time; Distress
    stays within the preset boundary or triggers stopping; Completion is not equated with fear disappearing.
    Action 3: Revise the prediction and decide the next bounded step. Observed checks: Both attempts inform
    the revised prediction; Partial or adverse outcomes are retained; The next step repeat defer or help
    route has a reason; No treatment or broad anxiety improvement is claimed.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A ladder was written but no step was attempted and
    rehearsal was reported as real-world exposure.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Anxiety
    and courageous exposure contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
