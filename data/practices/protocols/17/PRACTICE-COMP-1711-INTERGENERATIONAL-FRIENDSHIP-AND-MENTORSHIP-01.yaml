    sequence: 1
    title: Prepare a consent-safe Intergenerational friendship and mentorship interaction
    instructions: 'Choose one welcome, low-stakes relationship context for Intergenerational friendship
      and mentorship. Translate the canonical scope into one observable communication act, identify power
      or retaliation concerns, and obtain or preserve the other person''s freedom not to participate:
      Build reciprocal relationships across ages and life stages, including both giving and receiving
      guidance.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
