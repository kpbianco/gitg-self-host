  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Intergenerational friendship and mentorship; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Intergenerational friendship and mentorship; assistive technology, interpretation, a support
      person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Intergenerational friendship and mentorship to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - When a real Intergenerational friendship and mentorship opportunity is unavailable or inappropriate,
      use a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause Intergenerational friendship and mentorship when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Intergenerational friendship and mentorship practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Intergenerational friendship and mentorship situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Intergenerational friendship and mentorship actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1711_a1_primary
  - c1711_a1_boundary
  - c1711_a1_adverse
  - c1711_a2_primary
  - c1711_a2_boundary
  - c1711_a2_adverse
  - c1711_a3_primary
  - c1711_a3_boundary
  - c1711_a3_adverse
  adverse_or_contradictory_indicators:
  - The Intergenerational friendship and mentorship action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Intergenerational friendship and mentorship criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Intergenerational friendship and mentorship explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Intergenerational friendship and mentorship
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Intergenerational friendship and mentorship observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Intergenerational friendship and mentorship rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Maintains a relationship in which perspective and care flow across generational differences.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Intergenerational friendship and mentorship requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Intergenerational
    friendship and mentorship contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L15
  - L26
  - L28
  - L33
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Intergenerational friendship and mentorship evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The prepare a consent-safe intergenerational friendship and mentorship interaction action was attempted
    or explicitly deferred.
  - The practice one intergenerational friendship and mentorship communication act action was attempted
    or explicitly deferred.
  - The review intergenerational friendship and mentorship without scoring the person action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1711_a1_primary
    - c1711_a2_primary
    - c1711_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Intergenerational friendship and mentorship only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Intergenerational friendship and mentorship across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Intergenerational friendship and mentorship require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Intergenerational friendship and mentorship criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Maintains a relationship in which perspective and care flow
      across generational differences.', what contradiction or missing context matters most, and should
      this Intergenerational friendship and mentorship design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Intergenerational friendship and mentorship design only when the context
      and burden remain appropriate.
    adapt: Change the Intergenerational friendship and mentorship medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Intergenerational friendship and mentorship when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Intergenerational friendship and mentorship
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Intergenerational friendship and mentorship criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Intergenerational friendship and mentorship criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Intergenerational friendship and mentorship
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Intergenerational friendship and mentorship action was deferred, not observed, not
      applicable, stale, insufficiently bounded, or too confounded to interpret.
