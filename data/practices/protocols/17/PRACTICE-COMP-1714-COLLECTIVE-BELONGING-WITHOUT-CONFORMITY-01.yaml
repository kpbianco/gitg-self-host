  - c1714_a3_adverse
  adverse_or_contradictory_indicators:
  - The Collective belonging without conformity action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Collective belonging without conformity criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Collective belonging without conformity explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Collective belonging without conformity
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Collective belonging without conformity observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Collective belonging without conformity rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can contribute loyally without hiding important disagreement or demanding sameness from others.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Collective belonging without conformity requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Collective
    belonging without conformity contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L05
  - L25
  - L26
  - L31
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Collective belonging without conformity evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The listen for a bounded collective belonging without conformity need action was attempted or explicitly
    deferred.
  - The agree and complete one collective belonging without conformity contribution action was attempted
    or explicitly deferred.
  - The review the collective belonging without conformity contribution with proportionate feedback action
    preserved a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1714_a1_primary
    - c1714_a2_primary
    - c1714_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Collective belonging without conformity only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Collective belonging without conformity across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Collective belonging without conformity require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Collective belonging without conformity criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can contribute loyally without hiding important disagreement
      or demanding sameness from others.', what contradiction or missing context matters most, and should
      this Collective belonging without conformity design be repeated, adapted, deferred, stopped, or
      referred?
  review_guidance:
    repeat: Repeat the same bounded Collective belonging without conformity design only when the context
      and burden remain appropriate.
    adapt: Change the Collective belonging without conformity medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Collective belonging without conformity when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Collective belonging without conformity
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Collective belonging without conformity criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Collective belonging without conformity criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Collective belonging without conformity criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Collective belonging without conformity action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
