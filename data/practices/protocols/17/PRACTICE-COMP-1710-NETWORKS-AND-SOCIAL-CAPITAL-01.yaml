  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Networks and social capital; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Networks and social capital; assistive technology, interpretation, a support person, and
      a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Networks and social capital to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Networks and social capital opportunity is unavailable or inappropriate, use a fictional,
      historical, public, simulated, or planning-only equivalent and retain the narrower evidence classification.
  pause_conditions:
  - Pause Networks and social capital when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Networks and social capital practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Networks and social capital situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Networks and social capital actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1710_a1_primary
  - c1710_a1_boundary
  - c1710_a1_adverse
  - c1710_a2_primary
  - c1710_a2_boundary
  - c1710_a2_adverse
  - c1710_a3_primary
  - c1710_a3_boundary
  - c1710_a3_adverse
  adverse_or_contradictory_indicators:
  - The Networks and social capital action exceeded consent, authority, privacy, qualification, role,
    burden, or safety boundaries.
  - The evidence contradicted the intended Networks and social capital criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Networks and social capital explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Networks and social capital context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Networks and social capital observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Networks and social capital rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can mobilize or offer knowledge and help without reducing people to assets.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Networks and social capital requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Networks and
    social capital evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L22
  - L26
  - L30
  - L33
  minimum_evidence_before_state_update: No current-state update is permitted for this Networks and social
    capital draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Networks and social capital evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The listen for a bounded networks and social capital need action was attempted or explicitly deferred.
  - The agree and complete one networks and social capital contribution action was attempted or explicitly
    deferred.
  - The review the networks and social capital contribution with proportionate feedback action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1710_a1_primary
    - c1710_a2_primary
    - c1710_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Networks and social capital only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Networks and social capital across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Networks and social capital require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Networks and social capital criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can mobilize or offer knowledge and help without reducing
      people to assets.', what contradiction or missing context matters most, and should this Networks
      and social capital design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Networks and social capital design only when the context and burden
      remain appropriate.
    adapt: Change the Networks and social capital medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Networks and social capital when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Networks and social capital questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Networks and social capital criteria were observed with provenance and no
      adverse boundary signal in the selected context.
    mixed: Some Networks and social capital criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Networks and social capital criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Networks and social capital action was deferred, not observed, not applicable, stale,
      insufficiently bounded, or too confounded to interpret.
