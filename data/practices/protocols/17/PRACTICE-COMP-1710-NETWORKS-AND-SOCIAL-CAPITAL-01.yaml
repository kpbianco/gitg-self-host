    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Networks
      and social capital.
  check_in_labels:
    c1710_a1_primary: The bounded Networks and social capital criterion for action 1 was observed
    c1710_a1_boundary: Action 1 stayed inside its stated Networks and social capital boundary
    c1710_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c1710_a2_primary: The bounded Networks and social capital criterion for action 2 was observed
    c1710_a2_boundary: Action 2 stayed inside its stated Networks and social capital boundary
    c1710_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c1710_a3_primary: The bounded Networks and social capital criterion for action 3 was observed
    c1710_a3_boundary: Action 3 stayed inside its stated Networks and social capital boundary
    c1710_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Complete the bounded Networks and social capital review without claiming mastery, broad
    transfer, professional validation, or score activation.
  plain_language_evidence: The structured record shows what happened in one limited Networks and social
    capital practice, including support, contradiction, defer, no result, or harm.
