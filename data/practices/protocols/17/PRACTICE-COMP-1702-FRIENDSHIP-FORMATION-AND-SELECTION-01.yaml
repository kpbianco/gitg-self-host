  setup_copy:
    context_heading: Choose one bounded context for Friendship formation and selection.
    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Friendship
      formation and selection.
  check_in_labels:
    c1702_a1_primary: The bounded Friendship formation and selection criterion for action 1 was observed
    c1702_a1_boundary: Action 1 stayed inside its stated Friendship formation and selection boundary
    c1702_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c1702_a2_primary: The bounded Friendship formation and selection criterion for action 2 was observed
    c1702_a2_boundary: Action 2 stayed inside its stated Friendship formation and selection boundary
    c1702_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c1702_a3_primary: The bounded Friendship formation and selection criterion for action 3 was observed
    c1702_a3_boundary: Action 3 stayed inside its stated Friendship formation and selection boundary
    c1702_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record shows what happened in one limited Friendship formation
    and selection practice, including support, contradiction, defer, no result, or harm.
