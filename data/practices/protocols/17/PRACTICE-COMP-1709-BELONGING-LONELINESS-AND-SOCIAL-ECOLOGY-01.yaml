  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Belonging, loneliness, and social ecology explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Belonging, loneliness, and social ecology
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Belonging, loneliness, and social ecology observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Belonging, loneliness, and social ecology rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Social well-being is not dependent on a single person or setting.—not completion, confidence,
    conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Belonging, loneliness, and social ecology requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Belonging,
    loneliness, and social ecology contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
