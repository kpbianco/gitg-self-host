    or explicitly deferred.
  - The practice one belonging, loneliness, and social ecology communication act action was attempted
    or explicitly deferred.
  - The review belonging, loneliness, and social ecology without scoring the person action preserved a
    limited conclusion, contradiction, or inconclusive result.
  completion_rules:
