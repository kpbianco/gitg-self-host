    - c1709_a2_primary
    - c1709_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Belonging, loneliness, and social ecology only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Belonging, loneliness, and social ecology across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Belonging, loneliness, and social ecology require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Belonging, loneliness, and social ecology criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Social well-being is not dependent on a single person or setting.',
      what contradiction or missing context matters most, and should this Belonging, loneliness, and social
      ecology design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Belonging, loneliness, and social ecology design only when the context
      and burden remain appropriate.
    adapt: Change the Belonging, loneliness, and social ecology medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Belonging, loneliness, and social ecology when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Belonging, loneliness, and social ecology
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Belonging, loneliness, and social ecology criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Belonging, loneliness, and social ecology criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Belonging, loneliness, and social ecology
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Belonging, loneliness, and social ecology action was deferred, not observed, not
      applicable, stale, insufficiently bounded, or too confounded to interpret.
