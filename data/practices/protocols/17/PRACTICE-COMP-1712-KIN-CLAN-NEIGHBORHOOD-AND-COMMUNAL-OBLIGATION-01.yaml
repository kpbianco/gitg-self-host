  adverse_or_contradictory_indicators:
  - The Kin, clan, neighborhood, and communal obligation action exceeded consent, authority, privacy,
    qualification, role, burden, or safety boundaries.
  - The evidence contradicted the intended Kin, clan, neighborhood, and communal obligation criterion,
    depended on coercion or hidden private content, or could not distinguish the protocol from contextual
    change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Kin, clan, neighborhood, and communal obligation explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Kin, clan, neighborhood, and communal
    obligation context, action, role, pathway, and assessment epoch; it does not establish cross-context
    reliability.
  repetition_rule: Each Kin, clan, neighborhood, and communal obligation observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Kin, clan, neighborhood, and communal obligation rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can honor legitimate communal duties while identifying limits around harm, exploitation, and
    conscience.—not completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Kin, clan, neighborhood, and communal obligation requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Kin, clan,
    neighborhood, and communal obligation contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
