completion_and_review:
  completion_criteria:
  - The listen for a bounded kin, clan, neighborhood, and communal obligation need action was attempted
    or explicitly deferred.
  - The agree and complete one kin, clan, neighborhood, and communal obligation contribution action was
    attempted or explicitly deferred.
  - The review the kin, clan, neighborhood, and communal obligation contribution with proportionate feedback
    action preserved a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1712_a1_primary
    - c1712_a2_primary
    - c1712_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Kin, clan, neighborhood, and communal obligation only when the
    initial context remained safe, the evidence criteria were usable, burden was acceptable, and a new
    context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Kin, clan, neighborhood, and communal obligation
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Kin, clan, neighborhood, and communal obligation require in this exact context,
      what remains outside my role or authority, and which scope sentence or evidence criterion will keep
      the practice honest?
    during: Which observable Kin, clan, neighborhood, and communal obligation criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can honor legitimate communal duties while identifying limits
      around harm, exploitation, and conscience.', what contradiction or missing context matters most,
      and should this Kin, clan, neighborhood, and communal obligation design be repeated, adapted, deferred,
      stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Kin, clan, neighborhood, and communal obligation design only when
      the context and burden remain appropriate.
    adapt: Change the Kin, clan, neighborhood, and communal obligation medium, scope, support, timing,
      criteria, or context while preserving provenance and the narrower evidence claim.
    stop: Stop Kin, clan, neighborhood, and communal obligation when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Kin, clan, neighborhood, and communal
      obligation questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Kin, clan, neighborhood, and communal obligation criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Kin, clan, neighborhood, and communal obligation criteria were observed while burden,
      support, contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Kin, clan, neighborhood, and communal obligation
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Kin, clan, neighborhood, and communal obligation action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
