        allowed_provenance:
        - reviewed_artifact
        criteria:
        - c2502_a1_indicators_observable
        - c2502_a1_missing_data_rule_present
        - c2502_a1_contradiction_indicator_present
      - measurement_id: c2502_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2502_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01-A2
    sequence: 2
    title: Observe Observation and imagination across three checkpoints
    instructions: Collect up to three brief Observation and imagination checkpoints across the selected
      period or contexts. Record unknown, not observed, not applicable, defer, and adverse outcomes as
      valid states; do not infer a trend from prose length, mood, or one unusually good or bad event.
    expected_time: 15-25 minutes
    due_within_days: 7
