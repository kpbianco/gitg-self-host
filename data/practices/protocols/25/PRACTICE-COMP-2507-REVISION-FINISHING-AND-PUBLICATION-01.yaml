    sequence: 2
    title: Rehearse Revision, finishing, and publication twice
    instructions: Perform two bounded attempts of the selected Revision, finishing, and publication component
      under comparable safe conditions. Use self-review, a consensual observer, or a reviewed artifact;
      do not require public exposure, coerced feedback, licensed work, or high-consequence performance.
