        - c0913_a1_observable_rubric_present
        - c0913_a1_error_or_stop_defined
      - measurement_id: c0913_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0913_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0913-STATISTICAL-LITERACY-01-A2
    sequence: 2
    title: Rehearse Statistical literacy twice
    instructions: Perform two bounded attempts of the selected Statistical literacy component under comparable
      safe conditions. Use self-review, a consensual observer, or a reviewed artifact; do not require
      public exposure, coerced feedback, licensed work, or high-consequence performance.
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
