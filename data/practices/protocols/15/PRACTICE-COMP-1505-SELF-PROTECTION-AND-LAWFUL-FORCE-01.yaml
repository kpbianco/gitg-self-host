completion_and_review:
  completion_criteria:
  - The bound the qualified question for self-protection and lawful force action was attempted or explicitly
    deferred.
  - The prepare minimum information for self-protection and lawful force action was attempted or explicitly
    deferred.
  - The record a bounded self-protection and lawful force disposition action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
