    substantive_markers:
    - c1505_a1_primary
    - c1505_a2_primary
    - c1505_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Self-protection and lawful force only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Self-protection and lawful force across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Self-protection and lawful force require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Self-protection and lawful force criterion is present, absent, mixed, or
      unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Has realistic training and a clear threshold for action rather
      than fantasy or bravado.', what contradiction or missing context matters most, and should this Self-protection
      and lawful force design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Self-protection and lawful force design only when the context and
      burden remain appropriate.
    adapt: Change the Self-protection and lawful force medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Self-protection and lawful force when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Self-protection and lawful force questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Self-protection and lawful force criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Self-protection and lawful force criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Self-protection and lawful force criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Self-protection and lawful force action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
