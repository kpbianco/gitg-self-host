  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Outdoor survival fundamentals explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Outdoor survival fundamentals context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Outdoor survival fundamentals observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Outdoor survival fundamentals rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can complete a safe supervised exercise and explain survival priorities.—not completion, confidence,
    conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Outdoor survival fundamentals requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is non-scored and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Outdoor survival
    fundamentals evidence only under offline typed evaluation; protocol performance remains distinct and
