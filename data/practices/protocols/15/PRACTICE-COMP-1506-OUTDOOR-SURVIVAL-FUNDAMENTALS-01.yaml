completion_and_review:
  completion_criteria:
  - The identify the non-emergency boundary for outdoor survival fundamentals action was attempted or
    explicitly deferred.
  - The prepare one safe outdoor survival fundamentals support step action was attempted or explicitly
    deferred.
  - The review the outdoor survival fundamentals plan against stop conditions action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1506_a1_primary
    - c1506_a2_primary
    - c1506_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Outdoor survival fundamentals only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Outdoor survival fundamentals across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Outdoor survival fundamentals require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Outdoor survival fundamentals criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can complete a safe supervised exercise and explain survival
      priorities.', what contradiction or missing context matters most, and should this Outdoor survival
      fundamentals design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Outdoor survival fundamentals design only when the context and burden
      remain appropriate.
    adapt: Change the Outdoor survival fundamentals medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Outdoor survival fundamentals when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Outdoor survival fundamentals questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Outdoor survival fundamentals criteria were observed with provenance and no
      adverse boundary signal in the selected context.
    mixed: Some Outdoor survival fundamentals criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Outdoor survival fundamentals criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Outdoor survival fundamentals action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
