  - stable_id: PRACTICE-COMP-1506-OUTDOOR-SURVIVAL-FUNDAMENTALS-01-A1
    sequence: 1
    title: Identify the non-emergency boundary for Outdoor survival fundamentals
    instructions: 'Define one planning-only question for Outdoor survival fundamentals, the hazards that
      must not be rehearsed, and the local qualified or emergency authority that supersedes this source-only
      protocol. Do not create, approach, or simulate danger: Secure shelter, water, warmth, navigation,
      signaling, fire, and food priorities.'
