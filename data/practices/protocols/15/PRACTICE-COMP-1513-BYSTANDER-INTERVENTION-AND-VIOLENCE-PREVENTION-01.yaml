meaning_and_fit:
  purpose: 'Practice Bystander intervention and violence prevention through a non-confrontational safety
    preparation bounded by the canonical scope: Recognize harassment, abuse, escalating conflict, and
    unsafe conditions; use direct, distract, delegate, document, or delay strategies.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can choose a safe intervention
    and obtain support without escalating beyond competence. The protocol creates a small opportunity
    to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Bystander intervention and violence prevention
      is a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Bystander intervention and violence prevention practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Bystander intervention and violence prevention as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Bystander intervention
    and violence prevention context, understand the source-only status, and stop without losing safety,
    care, employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Bystander
    intervention and violence prevention; do not manufacture conflict, deprivation, exposure, disclosure,
    danger, urgency, or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Bystander intervention and violence
    prevention.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Bystander intervention and violence
    prevention instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Bystander intervention and violence prevention differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Bystander intervention and
    violence prevention as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Complete three bounded Bystander intervention and violence prevention actions over ten days,
    preserving explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Bystander intervention and violence prevention; copy the canonical scope
    and evidence target into a private working note; define the action boundary, valid supports, privacy
    limit, and stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Bystander
    intervention and violence prevention. Do not store private prose, names, identities, diagnoses, allegations,
    credentials, account data, protected work information, intimate detail, artifact contents, observer
    narrative, or another person's secrets. This source-only draft is not surveillance, professional advice,
    treatment, certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Bystander intervention and violence prevention
    actions, and review; scope may be reduced or deferred for access, care, health, workload, conscience,
    or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Bystander intervention and violence prevention protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Bystander intervention and violence prevention action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Bystander intervention and violence prevention situation involving emergency response, abuse,
    retaliation, illegal conduct, medical treatment, legal representation, financial-loss decisions, safeguarding,
    hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
  actions:
  - stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01-A1
    sequence: 1
    title: Identify the non-emergency boundary for Bystander intervention and violence prevention
    instructions: 'Define one planning-only question for Bystander intervention and violence prevention,
      the hazards that must not be rehearsed, and the local qualified or emergency authority that supersedes
      this source-only protocol. Do not create, approach, or simulate danger: Recognize harassment, abuse,
      escalating conflict, and unsafe conditions; use direct, distract, delegate, document, or delay strategies.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01
      action_stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01-A1
