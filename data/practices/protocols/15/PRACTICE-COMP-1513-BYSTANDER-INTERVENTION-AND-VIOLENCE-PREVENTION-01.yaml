    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Bystander
      intervention and violence prevention.
  check_in_labels:
    c1513_a1_primary: The bounded Bystander intervention and violence prevention criterion for action
      1 was observed
    c1513_a1_boundary: Action 1 stayed inside its stated Bystander intervention and violence prevention
      boundary
    c1513_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c1513_a2_primary: The bounded Bystander intervention and violence prevention criterion for action
      2 was observed
    c1513_a2_boundary: Action 2 stayed inside its stated Bystander intervention and violence prevention
      boundary
    c1513_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c1513_a3_primary: The bounded Bystander intervention and violence prevention criterion for action
      3 was observed
    c1513_a3_boundary: Action 3 stayed inside its stated Bystander intervention and violence prevention
      boundary
    c1513_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record shows what happened in one limited Bystander intervention
    and violence prevention practice, including support, contradiction, defer, no result, or harm.
