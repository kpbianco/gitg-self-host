  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      First aid, CPR, and emergency response; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for First aid, CPR, and emergency response; assistive technology, interpretation, a support
      person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of First aid, CPR, and emergency response to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - When a real First aid, CPR, and emergency response opportunity is unavailable or inappropriate,
      use a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause First aid, CPR, and emergency response when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the First aid, CPR, and emergency response practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a First aid, CPR, and emergency response situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded First aid, CPR, and emergency response actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1501_a1_primary
  - c1501_a1_boundary
  - c1501_a1_adverse
  - c1501_a2_primary
  - c1501_a2_boundary
  - c1501_a2_adverse
  - c1501_a3_primary
  - c1501_a3_boundary
  - c1501_a3_adverse
  adverse_or_contradictory_indicators:
  - The First aid, CPR, and emergency response action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended First aid, CPR, and emergency response criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for First aid, CPR, and emergency response explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen First aid, CPR, and emergency response
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each First aid, CPR, and emergency response observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated First aid, CPR, and emergency response rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Completes recognized training or demonstrates procedures accurately.—not completion, confidence,
    conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for First aid, CPR, and emergency response requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct First
    aid, CPR, and emergency response contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L17
  - L20
  - L28
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse First aid, CPR, and emergency response evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The identify the non-emergency boundary for first aid, cpr, and emergency response action was attempted
    or explicitly deferred.
  - The prepare one safe first aid, cpr, and emergency response support step action was attempted or explicitly
    deferred.
  - The review the first aid, cpr, and emergency response plan against stop conditions action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1501_a1_primary
    - c1501_a2_primary
    - c1501_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden First aid, CPR, and emergency response only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish First aid, CPR, and emergency response across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does First aid, CPR, and emergency response require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable First aid, CPR, and emergency response criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Completes recognized training or demonstrates procedures accurately.',
      what contradiction or missing context matters most, and should this First aid, CPR, and emergency
      response design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded First aid, CPR, and emergency response design only when the context
      and burden remain appropriate.
    adapt: Change the First aid, CPR, and emergency response medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop First aid, CPR, and emergency response when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for First aid, CPR, and emergency response
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded First aid, CPR, and emergency response criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some First aid, CPR, and emergency response criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended First aid, CPR, and emergency response criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The First aid, CPR, and emergency response action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
presentation:
  setup_copy:
    context_heading: Choose one bounded context for First aid, CPR, and emergency response.
    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for First aid,
      CPR, and emergency response.
  check_in_labels:
    c1501_a1_primary: The bounded First aid, CPR, and emergency response criterion for action 1 was observed
    c1501_a1_boundary: Action 1 stayed inside its stated First aid, CPR, and emergency response boundary
    c1501_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c1501_a2_primary: The bounded First aid, CPR, and emergency response criterion for action 2 was observed
    c1501_a2_boundary: Action 2 stayed inside its stated First aid, CPR, and emergency response boundary
    c1501_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c1501_a3_primary: The bounded First aid, CPR, and emergency response criterion for action 3 was observed
    c1501_a3_boundary: Action 3 stayed inside its stated First aid, CPR, and emergency response boundary
    c1501_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record shows what happened in one limited First aid, CPR, and
    emergency response practice, including support, contradiction, defer, no result, or harm.
  display_order: 190
