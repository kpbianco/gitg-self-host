completion_and_review:
  completion_criteria:
  - The identify the non-emergency boundary for cybersecurity, fraud, and identity protection action was
    attempted or explicitly deferred.
  - The prepare one safe cybersecurity, fraud, and identity protection support step action was attempted
    or explicitly deferred.
  - The review the cybersecurity, fraud, and identity protection plan against stop conditions action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1509_a1_primary
    - c1509_a2_primary
    - c1509_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Cybersecurity, fraud, and identity protection only when the
    initial context remained safe, the evidence criteria were usable, burden was acceptable, and a new
    context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Cybersecurity, fraud, and identity protection
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Cybersecurity, fraud, and identity protection require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Cybersecurity, fraud, and identity protection criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Uses strong account security and can respond to a suspected
      compromise.', what contradiction or missing context matters most, and should this Cybersecurity,
      fraud, and identity protection design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Cybersecurity, fraud, and identity protection design only when the
      context and burden remain appropriate.
    adapt: Change the Cybersecurity, fraud, and identity protection medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Cybersecurity, fraud, and identity protection when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Cybersecurity, fraud, and identity protection
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Cybersecurity, fraud, and identity protection criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Cybersecurity, fraud, and identity protection criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Cybersecurity, fraud, and identity protection
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Cybersecurity, fraud, and identity protection action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
