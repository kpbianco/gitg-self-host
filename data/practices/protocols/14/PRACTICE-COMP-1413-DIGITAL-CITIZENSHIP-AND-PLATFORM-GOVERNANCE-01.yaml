  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Digital citizenship and platform governance; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Digital citizenship and platform governance; assistive technology, interpretation, a support
      person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Digital citizenship and platform governance to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - When a real Digital citizenship and platform governance opportunity is unavailable or inappropriate,
      use a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause Digital citizenship and platform governance when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Digital citizenship and platform governance practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Digital citizenship and platform governance situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Digital citizenship and platform governance actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1413_a1_primary
  - c1413_a1_boundary
  - c1413_a1_adverse
  - c1413_a2_primary
  - c1413_a2_boundary
  - c1413_a2_adverse
  - c1413_a3_primary
  - c1413_a3_boundary
  - c1413_a3_adverse
  adverse_or_contradictory_indicators:
  - The Digital citizenship and platform governance action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Digital citizenship and platform governance criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Digital citizenship and platform governance explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Digital citizenship and platform governance
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Digital citizenship and platform governance observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Digital citizenship and platform governance rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can evaluate a platform policy through user safety, free expression, privacy, competition,
    and due process.—not completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Digital citizenship and platform governance requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Digital
    citizenship and platform governance contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L19
  - L30
  - L31
  - L33
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Digital citizenship and platform governance evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The listen for a bounded digital citizenship and platform governance need action was attempted or
    explicitly deferred.
  - The agree and complete one digital citizenship and platform governance contribution action was attempted
    or explicitly deferred.
  - The review the digital citizenship and platform governance contribution with proportionate feedback
    action preserved a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1413_a1_primary
    - c1413_a2_primary
    - c1413_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Digital citizenship and platform governance only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Digital citizenship and platform governance across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Digital citizenship and platform governance require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Digital citizenship and platform governance criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can evaluate a platform policy through user safety, free expression,
      privacy, competition, and due process.', what contradiction or missing context matters most, and
      should this Digital citizenship and platform governance design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Digital citizenship and platform governance design only when the context
      and burden remain appropriate.
    adapt: Change the Digital citizenship and platform governance medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Digital citizenship and platform governance when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Digital citizenship and platform governance
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Digital citizenship and platform governance criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Digital citizenship and platform governance criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Digital citizenship and platform governance
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Digital citizenship and platform governance action was deferred, not observed, not
      applicable, stale, insufficiently bounded, or too confounded to interpret.
presentation:
  setup_copy:
    context_heading: Choose one bounded context for Digital citizenship and platform governance.
    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Digital citizenship
      and platform governance.
  check_in_labels:
    c1413_a1_primary: The bounded Digital citizenship and platform governance criterion for action 1 was
      observed
    c1413_a1_boundary: Action 1 stayed inside its stated Digital citizenship and platform governance boundary
    c1413_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c1413_a2_primary: The bounded Digital citizenship and platform governance criterion for action 2 was
      observed
    c1413_a2_boundary: Action 2 stayed inside its stated Digital citizenship and platform governance boundary
    c1413_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c1413_a3_primary: The bounded Digital citizenship and platform governance criterion for action 3 was
      observed
    c1413_a3_boundary: Action 3 stayed inside its stated Digital citizenship and platform governance boundary
    c1413_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record shows what happened in one limited Digital citizenship
    and platform governance practice, including support, contradiction, defer, no result, or harm.
  display_order: 189
