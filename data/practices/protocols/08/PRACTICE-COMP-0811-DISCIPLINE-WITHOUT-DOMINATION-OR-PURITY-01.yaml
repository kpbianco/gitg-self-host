        expected: true
  - stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01-A2
    sequence: 2
    title: Write a proportionate exception that preserves the underlying value
    instructions: 'Define when the rule should hold, when it should yield and how the valued activity
      can resume without punishment. For the reading case: read during the chosen window; stop at the
      agreed conversation time; mark the next paragraph and return at the next suitable reading period.
      Explain why this protects both learning and the relationship. Avoid an exception so vague that it
      erases the commitment or a catch-up penalty that recreates the original rigidity. If the rule is
      actually a medical, safety or shared obligation, identify the appropriate person to consult rather
      than changing it unilaterally.


      Observation checks: The revised rule states normal use and a specific exception; The underlying
      value remains represented; Resumption does not require punitive compensation; External or safety
      obligations are not changed unilaterally. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01
      action_stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01-A2
      competency_stable_id: '08.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0811_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0811_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_revised_rule_states_normal_use_and_a_specific_exception
        - the_underlying_value_remains_represented
        - resumption_does_not_require_punitive_compensation
        - external_or_safety_obligations_are_not_changed_unilaterally
      - measurement_id: c0811_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0811_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01-A3
    sequence: 3
    title: Use the exception and assess whether flexibility served the purpose
    instructions: 'At a suitable real opportunity, follow the revised rule and record its effects on the
      original value and the competing legitimate need. For the supplied case, rehearse by marking a stopping
      point in a short text, setting it aside and stating when reading would resume; do not claim the
      conversation occurred. Review whether you could stop without a self-attack or a status judgment,
      and whether the next commitment remained feasible. Keep, narrow or revise the exception from the
      evidence. Flexibility is useful when it serves a reason, not merely because every rule should be
      relaxed.


      Observation checks: The revised rule is actually used or explicitly rehearsed; Effects on both the
      original and competing values are assessed; Self-punishment and status judgments are not rewarded;
      Further revision follows practical evidence rather than blanket permissiveness. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Did the structure serve your chosen life, and could it change when the reason changed?
      Keep a rule with a clear purpose and legitimate exception rather than a test of personal purity.


      Examples: Supportive: The reader stopped at the agreed time, marked the next paragraph and resumed
      later without penalizing themselves for respecting the conversation.


      Mixed: The exception protected the conversation, but the next reading period was vague and needed
      a more realistic cue.


      Contradictory: The person treated a missed optional session as moral failure, imposed deprivation
      or judged people with different routines as inferior.


      Inconclusive: The person praised balance but never identified a rule, a legitimate exception or
      an attempted revision.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
