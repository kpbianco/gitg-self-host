meaning_and_fit:
  purpose: Use structure to support chosen health, duty or meaning while recognizing when rigidity, self-punishment
    or superiority requires a more proportionate rule.
  why_recommended: Use structure to support chosen health, duty or meaning while recognizing when rigidity,
    self-punishment or superiority requires a more proportionate rule.
  claims:
  - statement: Use structure to support chosen health, duty or meaning while recognizing when rigidity,
      self-punishment or superiority requires a more proportionate rule.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Discipline without domination or purity practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Discipline without domination or purity as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a written, spoken or supported rule and a fictional case if no appropriate
    personal rule exists. Choose an optional activity; leave prescribed care, safety controls and another
    person's boundaries intact.
  opportunity_considerations: 'Choose an ordinary self-imposed rule or use this case: someone insists
    on finishing every optional reading session even when an important agreed conversation is about to
    start. The reading serves learning, but the rule is now displacing a valued relationship. Use a private
    note; no actual conflict needs to be created.'
  prerequisites:
  - 'Choose an ordinary self-imposed rule or use this case: someone insists on finishing every optional
    reading session even when an important agreed conversation is about to start. The reading serves learning,
    but the rule is now displacing a valued relationship. Use a private note; no actual conflict needs
    to be created.'
  dependencies: []
  safe_alternatives:
  - Use a written, spoken or supported rule and a fictional case if no appropriate personal rule exists.
    Choose an optional activity; leave prescribed care, safety controls and another person's boundaries
    intact.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Discipline without domination or purity differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Discipline without domination
    or purity as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary self-imposed rule or use this case: someone insists on finishing every optional
    reading session even when an important agreed conversation is about to start. The reading serves learning,
    but the rule is now displacing a valued relationship. Use a private note; no actual conflict needs
    to be created. Goal: Use structure to support chosen health, duty or meaning while recognizing when
    rigidity, self-punishment or superiority requires a more proportionate rule. Scope: One optional personal
    rule is examined and revised. This does not authorize changing treatment, safety procedures or obligations
    owed to others without the appropriate agreement. Time and effort: About 15 minutes to examine the
    rule, one appropriate trial or rehearsal and a short review. Adaptation: Use a written, spoken or
    supported rule and a fictional case if no appropriate personal rule exists. Choose an optional activity;
    leave prescribed care, safety controls and another person''s boundaries intact. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written, spoken or supported rule and a fictional case if no appropriate
    personal rule exists. Choose an optional activity; leave prescribed care, safety controls and another
    person's boundaries intact.
  expected_burden: About 15 minutes to examine the rule, one appropriate trial or rehearsal and a short
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Discipline without domination or purity protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Discipline without domination or purity action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written,
    spoken or supported rule and a fictional case if no appropriate personal rule exists. Choose an optional
    activity; leave prescribed care, safety controls and another person's boundaries intact.
  actions:
  - stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01-A1
    sequence: 1
    title: Compare the rule's purpose with its actual costs
    instructions: 'Write the rule, the freedom or value it originally supported and its observed effects.
      Consider health, duties and meaning separately so a visible streak does not become the only criterion.
      In the case, regular reading supports learning, while never stopping can undermine an agreed conversation.
      Look for concrete signs of domination: insults toward yourself after a miss, escalating penalties,
      inability to revise an optional rule or judging other people as inferior. Distinguish these from
      ordinary effort and a legitimate commitment. Do not infer a clinical condition from a single rigid
      habit.


      Observation checks: The rule is connected to its original purpose; Effects on health duties and
      meaning are considered; Concrete rigidity or superiority signs are examined; Ordinary effort is
      distinguished from punishment and diagnosis. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01
      action_stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01-A1
      competency_stable_id: '08.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0811_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0811_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_rule_is_connected_to_its_original_purpose
        - effects_on_health_duties_and_meaning_are_considered
        - concrete_rigidity_or_superiority_signs_are_examined
        - ordinary_effort_is_distinguished_from_punishment_and_diagnosis
      - measurement_id: c0811_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0811_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
