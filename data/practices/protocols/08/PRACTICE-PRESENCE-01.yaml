    boundary_heading: Presence is not stillness, perfection, or surveillance.
    timing_hint: Choose a date when a safe, low-stakes attention window is realistic.
    context_help: Use a short private label for the activity. Do not record another person or the content
      of a private interaction.
    applicability_heading: One repeatable activity with one changeable condition
    applicability_yes_label: Yes, I have a safe 15-minute activity I can repeat
    completion_signal_label: Usual and changed conditions compared, then the more workable condition repeated
      within seven days
    history_marker_label: completed attention window
    boundary_acknowledgement: I will use a safe, low-stakes activity, keep supports and alerts needed
      for access or safety, and treat distraction as information—not failure.
    check_in_labels:
      user_initiated: I deliberately began the planned attention window
      moved_beyond_transactional: I completed the full attention window
      follow_up_question_asked: I noticed attention drift and deliberately returned
      meaningful_information_shared: I compared the usual and changed condition
      follow_up_within_seven_days: I repeated the more workable condition within seven days
  check_in_labels:
    user_initiated: I deliberately began the planned attention window
    moved_beyond_transactional: I completed the full attention window
    follow_up_question_asked: I noticed attention drift and deliberately returned
    meaningful_information_shared: I compared the usual and changed condition
    follow_up_within_seven_days: I repeated the more workable condition within seven days
    internal_resistance: I noticed how workable or effortful the condition felt
  completion_copy: Review the condition comparison without scoring productivity, stillness, or distraction.
    One experiment does not establish broad attention mastery.
  plain_language_evidence: The record compares how noticing and returning attention worked in one activity
    under two conditions, including no difference or a worse result.
  display_order: 5
