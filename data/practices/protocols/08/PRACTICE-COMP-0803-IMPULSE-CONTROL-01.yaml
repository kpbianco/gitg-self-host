        - the_urge_is_acknowledged_without_a_judgment_of_worth
        - a_proceed_postpone_or_redirect_choice_has_an_explicit_reason
        - rehearsal_and_a_real_choice_point_remain_distinct
      - measurement_id: c0803_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0803_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A3
    sequence: 3
    title: Repeat and examine whether the choice remained yours
    instructions: 'Use the same choice point at another natural opportunity. Record whether the pause
      happened, what you chose and whether the original reason still fit. If continuing the task was no
      longer sensible, choose differently rather than obeying the pause rule mechanically. Compare both
      occasions for a workable cue, excessive delay or a rebound into unchosen behavior. Retain a small
      useful pause or change it. Do not create temptation or deprive yourself of a need to complete a
      second trial; an unavailable occasion remains pending.


      Observation checks: A second suitable opportunity is actually examined; The reason is reconsidered
      rather than obeyed mechanically; Costs or rebound behavior are recorded if observed; Missing opportunities
      are not counted as successful restraint. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Did the pause give you a real choice, and what reason did that choice serve? Keep
      the smallest useful cue. Restraint on two occasions does not establish broad impulse control.


      Examples: Supportive: The person noticed the tab-opening urge twice, finished the selected paragraph
      and then deliberately chose whether to switch.


      Mixed: The pause worked once but became unnecessary delay later; the person revised the rule to
      fit the actual task.


      Contradictory: Control was defined as ignoring hunger, refusing a necessary stop or pressuring someone
      after consent was withdrawn.


      Inconclusive: A promise to be disciplined was recorded without a reversible choice point or an attempted
      pause.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01
      action_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A3
      competency_stable_id: '08.03'
