  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Impulse control explicitly; support can enable access and never reduces dignity or silently changes
    the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Impulse control context, action, role,
    pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Impulse control observation requires a distinct immutable origin; duplicate origins
    are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Impulse control rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Locate a choice point before the impulse becomes a commitment. Observed
    checks: The seven possible contexts are considered without compulsory enactment; One suitable reversible
    choice point is identified; The reason for delay is consciously endorsed; Legitimate needs and protective
    choices are distinguished from optional urges. Action 2: Perform a brief pause and choose what serves
