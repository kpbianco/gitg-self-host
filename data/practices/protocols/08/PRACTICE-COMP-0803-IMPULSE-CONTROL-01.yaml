meaning_and_fit:
  purpose: Create a brief choice point before an impulsive action, then act or decline for a reason you
    can explain rather than because the urge feels compulsory.
  why_recommended: Create a brief choice point before an impulsive action, then act or decline for a reason
    you can explain rather than because the urge feels compulsory.
  claims:
  - statement: Create a brief choice point before an impulsive action, then act or decline for a reason
      you can explain rather than because the urge feels compulsory.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Impulse control practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Impulse control as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use a visual prompt, dictation or a supported communication route. Apply this
    only to optional ordinary behavior; maintain food, rest, prescribed care and necessary supports. Distressing
    or unsafe loss of control belongs with qualified support, not a harder willpower challenge.
  opportunity_considerations: Choose a harmless recurring urge, such as opening an unrelated tab during
    a chosen task. Have a private note labeled urge, reason, choice and result. Use an unsent ordinary
    message as rehearsal if no suitable live opportunity occurs. No purchase, food restriction or sexual
    situation is needed.
  prerequisites:
  - Choose a harmless recurring urge, such as opening an unrelated tab during a chosen task. Have a private
    note labeled urge, reason, choice and result. Use an unsent ordinary message as rehearsal if no suitable
    live opportunity occurs. No purchase, food restriction or sexual situation is needed.
  dependencies: []
  safe_alternatives:
  - Use a visual prompt, dictation or a supported communication route. Apply this only to optional ordinary
    behavior; maintain food, rest, prescribed care and necessary supports. Distressing or unsafe loss
    of control belongs with qualified support, not a harder willpower challenge.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Impulse control differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Impulse control as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a harmless recurring urge, such as opening an unrelated tab during a chosen task. Have
    a private note labeled urge, reason, choice and result. Use an unsent ordinary message as rehearsal
    if no suitable live opportunity occurs. No purchase, food restriction or sexual situation is needed.
    Goal: Create a brief choice point before an impulsive action, then act or decline for a reason you
    can explain rather than because the urge feels compulsory. Scope: One low-stakes impulse is practiced
    twice. This is not treatment for compulsions or a requirement to delay basic needs, consent decisions
    or urgent protective action. Time and effort: About 10 minutes to prepare and two naturally occurring
    choice points, with a short note afterward. Adaptation: Use a visual prompt, dictation or a supported
    communication route. Apply this only to optional ordinary behavior; maintain food, rest, prescribed
    care and necessary supports. Distressing or unsafe loss of control belongs with qualified support,
    not a harder willpower challenge. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a visual prompt, dictation or a supported communication route. Apply this only
    to optional ordinary behavior; maintain food, rest, prescribed care and necessary supports. Distressing
    or unsafe loss of control belongs with qualified support, not a harder willpower challenge.
  expected_burden: About 10 minutes to prepare and two naturally occurring choice points, with a short
    note afterward.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Impulse control protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Impulse control action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a visual
    prompt, dictation or a supported communication route. Apply this only to optional ordinary behavior;
    maintain food, rest, prescribed care and necessary supports. Distressing or unsafe loss of control
    belongs with qualified support, not a harder willpower challenge.
  actions:
  - stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A1
    sequence: 1
    title: Locate a choice point before the impulse becomes a commitment
    instructions: 'Consider how impulses can arise in speech, spending, eating, sex, anger, quitting and
      novelty seeking. These are possible contexts, not a requirement to practice every one. Select one
      appropriate low-stakes context and identify the last reversible moment, such as before opening the
      tab or sending the message. State the chosen reason for delaying: I want to finish this paragraph
      before switching. Distinguish an optional urge from hunger, a safety need, a withdrawal of consent
      or a legitimate decision to stop. Those do not have to be overridden to demonstrate control.


      Observation checks: The seven possible contexts are considered without compulsory enactment; One
      suitable reversible choice point is identified; The reason for delay is consciously endorsed; Legitimate
      needs and protective choices are distinguished from optional urges. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01
      action_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A1
      competency_stable_id: '08.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0803_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0803_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_seven_possible_contexts_are_considered_without_compulsory_enactment
        - one_suitable_reversible_choice_point_is_identified
        - the_reason_for_delay_is_consciously_endorsed
        - legitimate_needs_and_protective_choices_are_distinguished_from_optional_urges
      - measurement_id: c0803_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
