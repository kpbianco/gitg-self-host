  - stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A2
    sequence: 2
    title: Perform a brief pause and choose what serves the actual reason
    instructions: 'At the selected choice point, leave the optional action uncommitted while you finish
      one small unit or read the drafted sentence once. Name the urge privately without arguing that having
      it makes you bad. Then choose to proceed, postpone or redirect and state why. For the tab example,
      finishing the paragraph before deciding whether to switch is sufficient; you need not forbid the
      tab for the rest of the day. For an unsent-message rehearsal, write both the impulsive reply and
      a considered alternative, and mark that the interaction itself did not occur.


      Observation checks: A pause occurs before the optional commitment; The urge is acknowledged without
      a judgment of worth; A proceed postpone or redirect choice has an explicit reason; Rehearsal and
      a real choice point remain distinct. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01
      action_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A2
      competency_stable_id: '08.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0803_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0803_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
