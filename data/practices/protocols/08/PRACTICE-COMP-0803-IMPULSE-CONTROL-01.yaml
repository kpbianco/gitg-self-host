  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Impulse control; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use a visual prompt, dictation or a supported communication route. Apply this only to optional ordinary
      behavior; maintain food, rest, prescribed care and necessary supports. Distressing or unsafe loss
      of control belongs with qualified support, not a harder willpower challenge.
    cultural_context:
    - Adapt the expression of Impulse control to direct or indirect communication, collective or individual
      decision structures, local norms, faith or secular commitments, and role obligations while preserving
      consent and dignity.
    resource_variants:
    - Use a visual prompt, dictation or a supported communication route. Apply this only to optional ordinary
      behavior; maintain food, rest, prescribed care and necessary supports. Distressing or unsafe loss
      of control belongs with qualified support, not a harder willpower challenge.
  pause_conditions:
  - Pause Impulse control when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Impulse control practice for harm, coercion, retaliation risk, emergency conditions, unsafe
    exposure, worsening symptoms, protected information, legal or policy conflict, or pressure to exceed
    the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Impulse control situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
