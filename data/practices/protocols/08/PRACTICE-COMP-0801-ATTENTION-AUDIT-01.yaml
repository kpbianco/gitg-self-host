  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Attention audit explicitly; support can enable access and never reduces dignity or silently changes
    the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Attention audit context, action, role,
    pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Attention audit observation requires a distinct immutable origin; duplicate origins
    are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Attention audit rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Sample actual attention and distinguish choice from unwanted drift. Observed
    checks: Three actual transitions are sampled; All six attention categories are considered with unknowns
    allowed; Chosen leisure and necessary interruption are distinguished from unwanted drift; A concrete
    cue or uncertainty is recorded. Action 2: Redesign one recurring setting around the observed cue.
    Observed checks: The redesign targets an observed pattern or a labeled exploratory comparison; Exactly
    one controllable feature changes; Necessary communication and accessibility supports remain available;
    A useful result is defined in observable terms. Action 3: Try the changed setting and compare its
    practical effect. Observed checks: The changed setting is actually used; Its result is compared with
    a usual occurrence; Relevant context differences and costs remain visible; The next environmental
    choice follows the observation.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A general belief about screen time replaced actual
    samples, and no changed setting was tried.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Attention
    audit contribution under typed evaluation; protocol performance remains distinct and is never counted
    twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
