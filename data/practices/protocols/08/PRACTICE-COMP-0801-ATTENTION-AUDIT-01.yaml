meaning_and_fit:
  purpose: Observe where attention goes, distinguish chosen engagement from unwanted drift, and redesign
    one recurring setting without treating all leisure as wasted time.
  why_recommended: Observe where attention goes, distinguish chosen engagement from unwanted drift, and
    redesign one recurring setting without treating all leisure as wasted time.
  claims:
  - statement: Observe where attention goes, distinguish chosen engagement from unwanted drift, and redesign
      one recurring setting without treating all leisure as wasted time.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Attention audit practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Attention audit as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use spoken notes, symbols or a trusted recorder without exposing private content.
    Sample fewer details if recall is difficult. A planned comparison is preparation until performed;
    do not create a stressful interruption to obtain data.
  opportunity_considerations: Keep a private six-line note headed devices, entertainment, work, relationships,
    repetitive worry, and deliberate practice. Sample three ordinary transitions today, such as finishing
    breakfast, finishing a work period and beginning leisure. No monitoring app or access to anyone else's
    device is needed.
  prerequisites:
  - Keep a private six-line note headed devices, entertainment, work, relationships, repetitive worry,
    and deliberate practice. Sample three ordinary transitions today, such as finishing breakfast, finishing
    a work period and beginning leisure. No monitoring app or access to anyone else's device is needed.
  dependencies: []
  safe_alternatives:
  - Use spoken notes, symbols or a trusted recorder without exposing private content. Sample fewer details
    if recall is difficult. A planned comparison is preparation until performed; do not create a stressful
    interruption to obtain data.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Attention audit differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Attention audit as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Keep a private six-line note headed devices, entertainment, work, relationships, repetitive
    worry, and deliberate practice. Sample three ordinary transitions today, such as finishing breakfast,
    finishing a work period and beginning leisure. No monitoring app or access to anyone else''s device
    is needed. Goal: Observe where attention goes, distinguish chosen engagement from unwanted drift,
    and redesign one recurring setting without treating all leisure as wasted time. Scope: A short sample
    identifies one testable attention pattern. It is not continuous monitoring, a productivity score or
    a diagnosis of attention difficulty. Time and effort: Three brief notes on one day, about 15 minutes
    of review and one comparable trial of a changed setting. Adaptation: Use spoken notes, symbols or
    a trusted recorder without exposing private content. Sample fewer details if recall is difficult.
    A planned comparison is preparation until performed; do not create a stressful interruption to obtain
    data. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use spoken notes, symbols or a trusted recorder without exposing private content.
    Sample fewer details if recall is difficult. A planned comparison is preparation until performed;
    do not create a stressful interruption to obtain data.
  expected_burden: Three brief notes on one day, about 15 minutes of review and one comparable trial of
    a changed setting.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Attention audit protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Attention audit action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use spoken
    notes, symbols or a trusted recorder without exposing private content. Sample fewer details if recall
    is difficult. A planned comparison is preparation until performed; do not create a stressful interruption
    to obtain data.
  actions:
  - stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A1
    sequence: 1
    title: Sample actual attention and distinguish choice from unwanted drift
    instructions: 'At each chosen transition, recall the activity you intended, what actually held your
      attention and whether the change was freely chosen, necessary or unwanted. Place it under the six
      headings; leave unsampled categories unknown. For example, checking an essential message is different
      from opening unrelated feeds after the reply, and a welcome conversation is not a leak merely because
      work paused. For repetitive worry, describe only its effect on the activity, not private thought
      content. Record a concrete cue where available, such as a visible notification, and avoid reconstructing
      an entire day from memory.


      Observation checks: Three actual transitions are sampled; All six attention categories are considered
      with unknowns allowed; Chosen leisure and necessary interruption are distinguished from unwanted
      drift; A concrete cue or uncertainty is recorded. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01
      action_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A1
      competency_stable_id: '08.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0801_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0801_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_actual_transitions_are_sampled
        - all_six_attention_categories_are_considered_with_unknowns_allowed
        - chosen_leisure_and_necessary_interruption_are_distinguished_from_unwanted_drift
        - a_concrete_cue_or_uncertainty_is_recorded
      - measurement_id: c0801_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0801_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A2
    sequence: 2
    title: Redesign one recurring setting around the observed cue
    instructions: 'Choose an unwanted pattern that appeared in the sample and state the activity you want
      to protect. Change one controllable feature: close an unrelated tab before reading, place the needed
      page in view, silence only nonessential alerts or keep a note for later worries beside the task.
      If no pattern appeared, use a separate explicit experiment comparing reading with and without an
      unrelated visible tab; do not invent a personal leak. Preserve emergency contact, accessibility
      and caregiving needs. Write what would count as a useful change, such as returning to the selected
      page without opening the unrelated tab.


      Observation checks: The redesign targets an observed pattern or a labeled exploratory comparison;
      Exactly one controllable feature changes; Necessary communication and accessibility supports remain
      available; A useful result is defined in observable terms. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01
      action_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A2
      competency_stable_id: '08.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0801_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0801_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_redesign_targets_an_observed_pattern_or_a_labeled_exploratory_comparison
        - exactly_one_controllable_feature_changes
        - necessary_communication_and_accessibility_supports_remain_available
        - a_useful_result_is_defined_in_observable_terms
      - measurement_id: c0801_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0801_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A3
    sequence: 3
    title: Try the changed setting and compare its practical effect
    instructions: 'Use the changed setting during a comparable ordinary activity. Afterward, note whether
      the cue occurred, where attention went and how readily you returned. Compare it with a sampled usual
      occurrence while retaining differences in fatigue, urgency or interruptions. If the change blocked
      a legitimate need or merely moved the distraction elsewhere, record that cost. Keep the adjustment,
      revise it or restore the original setting based on the actual comparison. A single better occasion
      supports a local possibility, not a conclusion that all devices, entertainment or drifting thoughts
      are harmful.


      Observation checks: The changed setting is actually used; Its result is compared with a usual occurrence;
      Relevant context differences and costs remain visible; The next environmental choice follows the
      observation. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Which cue repeatedly pulled attention away from a chosen purpose, and did the redesign
      help without blocking a real need? Retain one useful change and leave unsampled parts of life unknown.


      Examples: Supportive: Unrelated tabs repeatedly drew attention after an essential reply; closing
      one before reading made returning to the page easier on the trial.


      Mixed: Silencing an alert reduced unwanted checking but also obscured a needed message, so the setting
      required a narrower exception.


      Contradictory: All conversation and leisure were classified as failure, or an essential accessibility
      alert was removed to improve apparent focus.


      Inconclusive: A general belief about screen time replaced actual samples, and no changed setting
      was tried.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01
      action_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A3
      competency_stable_id: '08.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0801_a3_primary
