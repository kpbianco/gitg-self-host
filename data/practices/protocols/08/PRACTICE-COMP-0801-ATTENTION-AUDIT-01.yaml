  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Attention audit; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use spoken notes, symbols or a trusted recorder without exposing private content. Sample fewer details
      if recall is difficult. A planned comparison is preparation until performed; do not create a stressful
      interruption to obtain data.
    cultural_context:
    - Adapt the expression of Attention audit to direct or indirect communication, collective or individual
      decision structures, local norms, faith or secular commitments, and role obligations while preserving
      consent and dignity.
    resource_variants:
    - Use spoken notes, symbols or a trusted recorder without exposing private content. Sample fewer details
      if recall is difficult. A planned comparison is preparation until performed; do not create a stressful
      interruption to obtain data.
  pause_conditions:
  - Pause Attention audit when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Attention audit practice for harm, coercion, retaliation risk, emergency conditions, unsafe
    exposure, worsening symptoms, protected information, legal or policy conflict, or pressure to exceed
    the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Attention audit situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
