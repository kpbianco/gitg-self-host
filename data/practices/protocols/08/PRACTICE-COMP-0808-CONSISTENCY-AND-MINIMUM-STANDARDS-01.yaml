  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Consistency and minimum standards; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use dictation or a diagram with the same informational requirements. Choose another genuinely flexible
      activity if writing is unsuitable. External obligations need agreement before their required standard
      changes.
    cultural_context:
    - Adapt the expression of Consistency and minimum standards to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use dictation or a diagram with the same informational requirements. Choose another genuinely flexible
      activity if writing is unsuitable. External obligations need agreement before their required standard
      changes.
  pause_conditions:
  - Pause Consistency and minimum standards when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Consistency and minimum standards practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Consistency and minimum standards situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
