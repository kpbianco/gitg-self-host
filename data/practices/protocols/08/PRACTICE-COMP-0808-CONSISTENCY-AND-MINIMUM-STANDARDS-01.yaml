  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Consistency and minimum standards explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Consistency and minimum standards context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Consistency and minimum standards observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Consistency and minimum standards rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Write two observable standards and name what the minimum leaves out.
    Observed checks: Normal and minimum standards are both observable; The minimum retains a meaningful
    part of the purpose; Omitted requirements are named explicitly; Reduced scope is limited to contexts
    where it is legitimate. Action 2: Perform both versions and check that the minimum is still substantive.
    Observed checks: Both versions are actually attempted; Each is checked against its own requirements;
    The minimum includes substantive work rather than symbolic attendance; A design trial is distinguished
    from an actual constrained day. Action 3: Choose the fitting standard and review continuity honestly.
    Observed checks: The selected standard follows actual circumstances; The achieved level and omissions
    are recorded honestly; Missing constrained-day evidence stays unknown; Repeated reduced scope prompts
    review of the larger purpose.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The person endorsed doing a little every day without
    defining either level or trying the proposed minimum.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Consistency
    and minimum standards contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
