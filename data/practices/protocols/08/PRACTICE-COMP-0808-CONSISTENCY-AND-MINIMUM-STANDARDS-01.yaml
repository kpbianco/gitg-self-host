meaning_and_fit:
  purpose: Maintain a meaningful thread of a chosen commitment during constrained days while keeping minimum,
    normal performance and unmet requirements visibly different.
  why_recommended: Maintain a meaningful thread of a chosen commitment during constrained days while keeping
    minimum, normal performance and unmet requirements visibly different.
  claims:
  - statement: Maintain a meaningful thread of a chosen commitment during constrained days while keeping
      minimum, normal performance and unmet requirements visibly different.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Consistency and minimum standards practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Consistency and minimum standards as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use dictation or a diagram with the same informational requirements. Choose
    another genuinely flexible activity if writing is unsuitable. External obligations need agreement
    before their required standard changes.
  opportunity_considerations: 'Choose a flexible personal learning task. Default: explain this instruction
    in your own words and give an example: A useful reminder states the action, when it is needed and
    where it applies. Have two short note spaces labeled normal and minimum.'
  prerequisites:
  - 'Choose a flexible personal learning task. Default: explain this instruction in your own words and
    give an example: A useful reminder states the action, when it is needed and where it applies. Have
    two short note spaces labeled normal and minimum.'
  dependencies: []
  safe_alternatives:
  - Use dictation or a diagram with the same informational requirements. Choose another genuinely flexible
    activity if writing is unsuitable. External obligations need agreement before their required standard
    changes.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Consistency and minimum standards differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Consistency and minimum standards
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a flexible personal learning task. Default: explain this instruction in your own words
    and give an example: A useful reminder states the action, when it is needed and where it applies.
    Have two short note spaces labeled normal and minimum. Goal: Maintain a meaningful thread of a chosen
    commitment during constrained days while keeping minimum, normal performance and unmet requirements
    visibly different. Scope: One normal and one reduced attempt test a practical standard. A minimum
    is appropriate only where reduced scope is legitimate; it cannot replace safety-critical or externally
    required work without agreement. Time and effort: About 15 minutes to define and try both versions,
    followed by a review at a naturally constrained opportunity if one occurs. Adaptation: Use dictation
    or a diagram with the same informational requirements. Choose another genuinely flexible activity
    if writing is unsuitable. External obligations need agreement before their required standard changes.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use dictation or a diagram with the same informational requirements. Choose another
    genuinely flexible activity if writing is unsuitable. External obligations need agreement before their
    required standard changes.
  expected_burden: About 15 minutes to define and try both versions, followed by a review at a naturally
    constrained opportunity if one occurs.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Consistency and minimum standards protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Consistency and minimum standards action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use dictation
    or a diagram with the same informational requirements. Choose another genuinely flexible activity
    if writing is unsuitable. External obligations need agreement before their required standard changes.
  actions:
  - stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A1
    sequence: 1
    title: Write two observable standards and name what the minimum leaves out
    instructions: 'For the normal version, write a three-sentence explanation and an example reminder
      containing an action, time and place. For the minimum, write one accurate sentence naming the three
      components. Explain why that still serves learning and what remains untested: producing a usable
      example and explaining the idea more fully. State when reduced scope fits, such as limited discretionary
      time, and when stopping or renegotiation is needed instead. Do not turn a minimum into permission
      to omit essential care, safety steps or work promised to someone else.


      Observation checks: Normal and minimum standards are both observable; The minimum retains a meaningful
      part of the purpose; Omitted requirements are named explicitly; Reduced scope is limited to contexts
      where it is legitimate. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A1
      competency_stable_id: '08.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0808_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0808_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - normal_and_minimum_standards_are_both_observable
        - the_minimum_retains_a_meaningful_part_of_the_purpose
        - omitted_requirements_are_named_explicitly
        - reduced_scope_is_limited_to_contexts_where_it_is_legitimate
      - measurement_id: c0808_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0808_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A2
    sequence: 2
    title: Perform both versions and check that the minimum is still substantive
    instructions: 'Produce the normal explanation and example, then separately produce the minimum sentence.
      Check each against its own stated criteria. A usable normal example is Return the library book tomorrow
      at 3 pm to the front desk; the minimum might say A reminder needs an action, a time and a place.
      If the minimum is only opening the note or writing a title, it does not yet demonstrate this learning
      purpose. Label this a design trial when no actual difficult day is involved, rather than claiming
      continuity through hardship from an easy rehearsal.


      Observation checks: Both versions are actually attempted; Each is checked against its own requirements;
      The minimum includes substantive work rather than symbolic attendance; A design trial is distinguished
      from an actual constrained day. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A2
      competency_stable_id: '08.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0808_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0808_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_versions_are_actually_attempted
        - each_is_checked_against_its_own_requirements
        - the_minimum_includes_substantive_work_rather_than_symbolic_attendance
        - a_design_trial_is_distinguished_from_an_actual_constrained_day
      - measurement_id: c0808_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0808_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A3
    sequence: 3
    title: Choose the fitting standard and review continuity honestly
    instructions: 'At the next natural opportunity, choose normal, minimum, or a reasoned pause based
      on actual circumstances. Attempt the selected version if appropriate, and record which standard
      it met, what was omitted and what the next opportunity needs. If no constrained day occurs, keep
      the trial result and leave difficult-day continuity unknown. Do not create a debt requiring punitive
      catch-up after every minimum day. If reduced scope repeatedly fails the larger purpose, revise the
      commitment or seek needed support rather than hiding the gap behind an unbroken streak.


      Observation checks: The selected standard follows actual circumstances; The achieved level and omissions
      are recorded honestly; Missing constrained-day evidence stays unknown; Repeated reduced scope prompts
      review of the larger purpose. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Did the minimum preserve meaningful continuity, and which normal requirements remained
      unmet? Keep two clearly labeled standards or revise the commitment. A reduced attempt is not full
      performance.


      Examples: Supportive: A short accurate sentence preserved the learning purpose on a constrained
      day, and the person clearly recorded that the full example was not produced.


      Mixed: Both versions worked in rehearsal, but no difficult-day opportunity occurred, so continuity
      under constraint remained untested.


      Contradictory: Opening a notebook was counted as learning, or the minimum was used to conceal repeatedly
      unmet essential requirements.


      Inconclusive: The person endorsed doing a little every day without defining either level or trying
      the proposed minimum.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A3
      competency_stable_id: '08.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0808_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0808_a3_primary
