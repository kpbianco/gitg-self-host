        - the_response_addresses_that_obstacle_rather_than_generic_effort
        - a_justified_reason_to_end_remains_distinct_from_automatic_switching
      - measurement_id: c0810_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0810_a2_adverse
        kind: boolean
        role: adverse
