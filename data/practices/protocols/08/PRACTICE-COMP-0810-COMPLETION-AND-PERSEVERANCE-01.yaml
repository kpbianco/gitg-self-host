        expected: true
  - stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A2
    sequence: 2
    title: Work through a specific plateau instead of switching goals automatically
    instructions: 'Begin the next action and compare progress with the endpoint. If you stall, name the
      actual obstacle: missing information, a decision, an oversized step, boredom or loss of usefulness.
      For the invitation, use the supplied facts rather than polishing an opening indefinitely. Choose
      a matching response, such as drafting the missing reply line, asking a relevant question or reducing
      nonessential embellishment. Continue within the chosen limit when appropriate. If the task is unsafe,
      obsolete or no longer justified, prepare a reasoned ending instead of disguising avoidance as a
      new exciting project.


      Observation checks: A concrete next action is actually attempted; Any plateau is described as a
      specific obstacle; The response addresses that obstacle rather than generic effort; A justified
      reason to end remains distinct from automatic switching. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01
      action_stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A2
      competency_stable_id: '08.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0810_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0810_a2_primary
        kind: artifact
        role: primary
