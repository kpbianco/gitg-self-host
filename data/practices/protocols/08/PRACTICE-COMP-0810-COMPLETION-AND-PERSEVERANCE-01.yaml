        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A3
    sequence: 3
    title: Close the loop and communicate any consequences
    instructions: 'Check the finished work against every stated requirement. For the default, confirm
      the purpose, Saturday time, community room and Thursday reply route are all present; label the result
      a draft. For a real commitment that should end, record the reason, unresolved effects, any handoff
      and an appropriate message to people relying on it. Do not claim cancellation occurred if the necessary
      communication was never made. Record finished, explicitly ended or still open accurately, and remove
      or reschedule reminders accordingly. A stopped work session is not automatically a closed commitment.


      Observation checks: The final disposition is finished explicitly ended or still open; Completion
      is checked against all stated requirements; A reasoned ending addresses affected people and remaining
      effects; Reminders and next actions match the actual disposition. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What made this loop genuinely closed, and which obstacle-handling choice was useful?
      Keep unfinished effects visible and select the next commitment deliberately rather than expanding
      the active list.


      Examples: Supportive: The invitation draft was checked for all four facts and closed as a complete
      draft, without pretending a fictional gathering had been arranged.


      Mixed: Most of a real task was finished but a required reply was still missing, so it remained open
      with one concrete next step.


      Contradictory: An obsolete task was pursued for status, or a commitment affecting others was abandoned
      without addressing its consequences.


      Inconclusive: The person worked for a set time but never defined or checked what would make the
      commitment complete.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01
