  performance_rubric: 'Action 1: Choose one open loop and define an honest endpoint. Observed checks:
    One meaningful open loop is selected from a limited list; Competing commitments are explicitly deferred
    for the work period; Done and affected people are identified concretely; The goal''s continued usefulness
    is checked. Action 2: Work through a specific plateau instead of switching goals automatically. Observed
