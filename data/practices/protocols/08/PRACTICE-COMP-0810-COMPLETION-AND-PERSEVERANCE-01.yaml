  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Completion and perseverance; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use a smaller legitimate deliverable, dictation or agreed assistance. A task involving others may
      need renegotiation before it can end; the exercise does not cancel obligations on their behalf.
      Retain safety and care needs over a completion target.
    cultural_context:
    - Adapt the expression of Completion and perseverance to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a smaller legitimate deliverable, dictation or agreed assistance. A task involving others may
      need renegotiation before it can end; the exercise does not cancel obligations on their behalf.
      Retain safety and care needs over a completion target.
  pause_conditions:
  - Pause Completion and perseverance when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Completion and perseverance practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Completion and perseverance situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
