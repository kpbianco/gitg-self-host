meaning_and_fit:
  purpose: Limit competing work, define done, address a specific obstacle and either finish a meaningful
    commitment or explicitly end it for a defensible reason.
  why_recommended: Limit competing work, define done, address a specific obstacle and either finish a
    meaningful commitment or explicitly end it for a defensible reason.
  claims:
  - statement: Limit competing work, define done, address a specific obstacle and either finish a meaningful
      commitment or explicitly end it for a defensible reason.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Completion and perseverance practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Completion and perseverance as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a smaller legitimate deliverable, dictation or agreed assistance. A task
    involving others may need renegotiation before it can end; the exercise does not cancel obligations
    on their behalf. Retain safety and care needs over a completion target.
  opportunity_considerations: 'Choose one modest open personal commitment. Default: finish an invitation
    containing purpose, time, place or access route, and a way to reply. Use these facts: a voluntary
    reading discussion, Saturday 2 pm, community room, reply to the organizer by Thursday. A private draft
    is sufficient for the supplied task; do not send a fictional event invitation.'
  prerequisites:
  - 'Choose one modest open personal commitment. Default: finish an invitation containing purpose, time,
    place or access route, and a way to reply. Use these facts: a voluntary reading discussion, Saturday
    2 pm, community room, reply to the organizer by Thursday. A private draft is sufficient for the supplied
    task; do not send a fictional event invitation.'
  dependencies: []
  safe_alternatives:
  - Use a smaller legitimate deliverable, dictation or agreed assistance. A task involving others may
    need renegotiation before it can end; the exercise does not cancel obligations on their behalf. Retain
    safety and care needs over a completion target.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Completion and perseverance differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Completion and perseverance
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose one modest open personal commitment. Default: finish an invitation containing purpose,
    time, place or access route, and a way to reply. Use these facts: a voluntary reading discussion,
    Saturday 2 pm, community room, reply to the organizer by Thursday. A private draft is sufficient for
    the supplied task; do not send a fictional event invitation. Goal: Limit competing work, define done,
    address a specific obstacle and either finish a meaningful commitment or explicitly end it for a defensible
    reason. Scope: One closed loop tests follow-through and judgment. It does not require finishing a
    harmful or obsolete goal, and quietly abandoning a promise is not the same as a reasoned ending. Time
    and effort: About 15 minutes to choose and define done, one bounded work period and a short closeout.
    Adaptation: Use a smaller legitimate deliverable, dictation or agreed assistance. A task involving
    others may need renegotiation before it can end; the exercise does not cancel obligations on their
    behalf. Retain safety and care needs over a completion target. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a smaller legitimate deliverable, dictation or agreed assistance. A task involving
    others may need renegotiation before it can end; the exercise does not cancel obligations on their
    behalf. Retain safety and care needs over a completion target.
  expected_burden: About 15 minutes to choose and define done, one bounded work period and a short closeout.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Completion and perseverance protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Completion and perseverance action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a smaller
    legitimate deliverable, dictation or agreed assistance. A task involving others may need renegotiation
    before it can end; the exercise does not cancel obligations on their behalf. Retain safety and care
    needs over a completion target.
  actions:
  - stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A1
    sequence: 1
    title: Choose one open loop and define an honest endpoint
    instructions: 'List up to three current open commitments and choose one meaningful item to address
      now. Put the others explicitly on hold for this work period so novelty does not silently replace
      the selected task. Define done in observable terms and identify anyone affected by its completion
      or cancellation. For the supplied task, done is a complete four-part invitation draft, not an event
      that actually happens. Name the next physical action and a reasonable work limit. Check whether
      the goal still serves a purpose before committing to finish it.


      Observation checks: One meaningful open loop is selected from a limited list; Competing commitments
      are explicitly deferred for the work period; Done and affected people are identified concretely;
      The goal''s continued usefulness is checked. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01
      action_stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A1
      competency_stable_id: '08.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0810_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0810_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_meaningful_open_loop_is_selected_from_a_limited_list
        - competing_commitments_are_explicitly_deferred_for_the_work_period
        - done_and_affected_people_are_identified_concretely
        - the_goal_s_continued_usefulness_is_checked
      - measurement_id: c0810_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0810_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
