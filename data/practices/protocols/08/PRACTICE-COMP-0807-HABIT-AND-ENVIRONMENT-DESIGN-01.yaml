meaning_and_fit:
  purpose: Use a cue, default, manageable friction, a checklist and physical arrangement to support a
    chosen behavior, with optional accountability that preserves agency.
  why_recommended: Use a cue, default, manageable friction, a checklist and physical arrangement to support
    a chosen behavior, with optional accountability that preserves agency.
  claims:
  - statement: Use a cue, default, manageable friction, a checklist and physical arrangement to support
      a chosen behavior, with optional accountability that preserves agency.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Habit and environment design practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Habit and environment design as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use tactile, visual or spoken cues and a reachable safe location. A helper
    may assist with the physical placement while you retain the choices. Keep accessibility aids, medication
    arrangements and emergency access unchanged.
  opportunity_considerations: 'Choose putting an ordinary needed item in its departure place, such as
    a notebook by your bag, or an equivalent recurring action. Use a card with three checks: item ready,
    necessary contents present, departure place suitable. Select a safe location that does not obstruct
    movement.'
  prerequisites:
  - 'Choose putting an ordinary needed item in its departure place, such as a notebook by your bag, or
    an equivalent recurring action. Use a card with three checks: item ready, necessary contents present,
    departure place suitable. Select a safe location that does not obstruct movement.'
  dependencies: []
  safe_alternatives:
  - Use tactile, visual or spoken cues and a reachable safe location. A helper may assist with the physical
    placement while you retain the choices. Keep accessibility aids, medication arrangements and emergency
    access unchanged.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Habit and environment design differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Habit and environment design
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose putting an ordinary needed item in its departure place, such as a notebook by your bag,
    or an equivalent recurring action. Use a card with three checks: item ready, necessary contents present,
    departure place suitable. Select a safe location that does not obstruct movement. Goal: Use a cue,
    default, manageable friction, a checklist and physical arrangement to support a chosen behavior, with
    optional accountability that preserves agency. Scope: Two opportunities test one local design. They
    do not establish a lasting habit, and reliability must not depend on removing necessary supports or
    recruiting someone to police behavior. Time and effort: About 15 minutes to design and install, two
    natural uses and a short review. Adaptation: Use tactile, visual or spoken cues and a reachable safe
    location. A helper may assist with the physical placement while you retain the choices. Keep accessibility
    aids, medication arrangements and emergency access unchanged. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use tactile, visual or spoken cues and a reachable safe location. A helper may
    assist with the physical placement while you retain the choices. Keep accessibility aids, medication
    arrangements and emergency access unchanged.
  expected_burden: About 15 minutes to design and install, two natural uses and a short review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Habit and environment design protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Habit and environment design action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use tactile,
    visual or spoken cues and a reachable safe location. A helper may assist with the physical placement
    while you retain the choices. Keep accessibility aids, medication arrangements and emergency access
    unchanged.
  actions:
  - stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A1
    sequence: 1
    title: Map the current cue and the practical point where the action fails
    instructions: 'Describe one actual occurrence or the supplied case: the notebook is remembered at
      departure but left elsewhere after use. Identify the cue, the current default, friction that hinders
      the desired action and competing friction that makes forgetting easy. Consider layout and a short
      checklist, not just determination. Optional accountability could be a willing person''s single agreed
      reminder, never surveillance or punishment. Choose one design hypothesis, such as placing the checklist
      beside the bag when putting work away will make the notebook easier to prepare. Leave uncertain
      causes as hypotheses.


      Observation checks: A specific recurring action and current cue are identified; Defaults and friction
      are distinguished from motivation; Layout checklist and optional accountability are considered;
      One testable design hypothesis is selected. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01
      action_stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A1
      competency_stable_id: '08.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0807_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0807_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_specific_recurring_action_and_current_cue_are_identified
        - defaults_and_friction_are_distinguished_from_motivation
        - layout_checklist_and_optional_accountability_are_considered
        - one_testable_design_hypothesis_is_selected
      - measurement_id: c0807_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0807_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A2
    sequence: 2
    title: Install the smallest change that supports the intended behavior
    instructions: 'Put the card and the needed item in the selected safe place. Make the desired next
      action obvious: after finishing with the notebook, check its contents and place it by the bag. Keep
      the three checks short enough to use at the moment of action. If another person is involved, ask
      for the exact reminder and let them decline. Do not reorganize the whole room or add unrelated goals.
      Record what changed so the next comparison tests an installed arrangement rather than an attractive
      plan. Preserve shared access and other people''s belongings.


      Observation checks: The selected arrangement is actually installed; The next action is visible at
      a meaningful cue; The checklist remains brief and task-specific; Shared access and any helper''s
      consent are preserved. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01
      action_stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A2
      competency_stable_id: '08.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0807_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0807_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_selected_arrangement_is_actually_installed
        - the_next_action_is_visible_at_a_meaningful_cue
        - the_checklist_remains_brief_and_task_specific
        - shared_access_and_any_helper_s_consent_are_preserved
      - measurement_id: c0807_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0807_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A3
    sequence: 3
    title: Use the arrangement twice and revise the failed link
    instructions: 'At two natural opportunities, use the cue and three checks, then record whether the
      item was ready when needed. Note whether the card was seen, the action followed and the location
      remained workable. If it failed, identify the particular link: invisible cue, unsuitable place,
      missing contents or an action that was too burdensome. Change that link or restore the previous
      arrangement if the costs outweigh the benefit. Do not count two checks performed immediately after
      installation as two independent recurring opportunities, or treat a helper''s reminder as unaided
      success.


      Observation checks: Two separate recurring opportunities are recorded; The cue action and practical
      result are distinguished; A failure is traced to a specific design link; Support and costs remain
      explicit in the comparison. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Which part of the environment carried some of the remembering or preparation burden?
      Keep one useful arrangement, revise one failed link or remove an unhelpful design. Two uses are
      not proof of a permanent habit.


      Examples: Supportive: The card was visible while putting work away, and the notebook was ready at
      two later departures with its contents checked.


      Mixed: The item was ready once but the location obstructed a shared surface, so the placement was
      revised.


      Contradictory: A helper was made responsible for policing compliance, or the new layout blocked
      access in pursuit of a tidier routine.


      Inconclusive: The arrangement was described but not installed, or both claimed uses occurred during
      the same setup rather than later opportunities.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
