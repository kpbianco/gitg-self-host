  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Habit and environment design; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use tactile, visual or spoken cues and a reachable safe location. A helper may assist with the physical
      placement while you retain the choices. Keep accessibility aids, medication arrangements and emergency
      access unchanged.
    cultural_context:
    - Adapt the expression of Habit and environment design to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use tactile, visual or spoken cues and a reachable safe location. A helper may assist with the physical
      placement while you retain the choices. Keep accessibility aids, medication arrangements and emergency
      access unchanged.
  pause_conditions:
  - Pause Habit and environment design when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Habit and environment design practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Habit and environment design situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Habit and environment design actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0807_a1_primary
  - c0807_a1_boundary
  - c0807_a1_adverse
  - c0807_a2_primary
  - c0807_a2_boundary
  - c0807_a2_adverse
  - c0807_a3_primary
  - c0807_a3_boundary
  - c0807_a3_adverse
  adverse_or_contradictory_indicators:
  - A helper was made responsible for policing compliance, or the new layout blocked access in pursuit
    of a tidier routine.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Habit and environment design explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Habit and environment design context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Habit and environment design observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Habit and environment design rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Map the current cue and the practical point where the action fails. Observed
    checks: A specific recurring action and current cue are identified; Defaults and friction are distinguished
    from motivation; Layout checklist and optional accountability are considered; One testable design
    hypothesis is selected. Action 2: Install the smallest change that supports the intended behavior.
    Observed checks: The selected arrangement is actually installed; The next action is visible at a meaningful
    cue; The checklist remains brief and task-specific; Shared access and any helper''s consent are preserved.
    Action 3: Use the arrangement twice and revise the failed link. Observed checks: Two separate recurring
    opportunities are recorded; The cue action and practical result are distinguished; A failure is traced
    to a specific design link; Support and costs remain explicit in the comparison.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The arrangement was described but not installed, or
    both claimed uses occurred during the same setup rather than later opportunities.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Habit
    and environment design contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L14
  - L18
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Habit and environment design evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
