meaning_and_fit:
  purpose: Begin useful work without making inspiration or confidence a prerequisite, while respecting
    actual capacity and legitimate reasons to revise the plan.
  why_recommended: Begin useful work without making inspiration or confidence a prerequisite, while respecting
    actual capacity and legitimate reasons to revise the plan.
  claims:
  - statement: Naming a specific situation and intended response is a reasonable design basis for this
      bounded start experiment.
    classification: empirical_finding
    source_ids:
    - SRC-M6D-MOTIVATION-IMPLEMENTATION-INTENTIONS
    limitations: Implementation-intention research does not establish that this exact protocol works for
      every person, task, disability, health state, or caregiving context.
  - statement: Begin useful work without making inspiration or confidence a prerequisite, while respecting
      actual capacity and legitimate reasons to revise the plan.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Is there one safe, lawful, low-stakes, genuinely necessary task that can be
    reduced to a two-to-five-minute start in two chosen windows without sacrificing sleep, care, health,
    or recovery?
  not_applicable_behavior: Record not applicable or defer without penalty when no safe or necessary task
    fits; do not infer avoidance, laziness, low discipline, or deficit.
  readiness_considerations: Use dictation, prepared materials, supported communication or a smaller legitimate
    task. Existing care and rest needs take precedence over the chosen cue. The exercise does not prescribe
    pushing through illness or impaired functioning.
  opportunity_considerations: 'Choose a necessary low-stakes task and a reversible two-to-five-minute
    first step. Default: start a useful coordination note by writing its item, time and place; use library
    book, tomorrow 3 pm, front desk. Select two naturally occurring, suitable low-motivation windows.
    The first uses usual conditions; the second adds exactly one cue, such as materials placed safely
    in view. Do not record private task contents in the check-in.'
  prerequisites:
  - 'Choose a necessary low-stakes task and a reversible two-to-five-minute first step. Default: start
    a useful coordination note by writing its item, time and place; use library book, tomorrow 3 pm, front
    desk. Select two naturally occurring, suitable low-motivation windows. The first uses usual conditions;
    the second adds exactly one cue, such as materials placed safely in view. Do not record private task
    contents in the check-in.'
  dependencies: []
  safe_alternatives:
  - Use dictation, prepared materials, supported communication or a smaller legitimate task. Existing
    care and rest needs take precedence over the chosen cue. The exercise does not prescribe pushing through
    illness or impaired functioning.
  role_conditions:
  - Caregiving, employment, study, and household roles do not override sleep, health, access, consent,
    or emergency responsibilities.
  pathway_conditions:
  - Prompts, body doubling, assistive technology, pacing, seated or remote options, and another person's
    practical help are valid supports and must be recorded without moral judgment.
  worldview_conditions:
  - The practice does not require a productivity ethic or belief that effort, output, self-denial, or
    constant action establishes worth.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 7
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a necessary low-stakes task and a reversible two-to-five-minute first step. Default:
    start a useful coordination note by writing its item, time and place; use library book, tomorrow 3
    pm, front desk. Select two naturally occurring, suitable low-motivation windows. The first uses usual
    conditions; the second adds exactly one cue, such as materials placed safely in view. Do not record
    private task contents in the check-in. Goal: Begin useful work without making inspiration or confidence
    a prerequisite, while respecting actual capacity and legitimate reasons to revise the plan. Scope:
    Two starts test beginning under the motivation actually present. They do not show endurance, productivity
    or an ability to override illness and exhaustion. Time and effort: About 20 to 30 minutes across setup,
    two bounded starts and comparison within seven days; either start may end after its planned two-to-five-minute
    step. Adaptation: Use dictation, prepared materials, supported communication or a smaller legitimate
    task. Existing care and rest needs take precedence over the chosen cue. The exercise does not prescribe
    pushing through illness or impaired functioning. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use dictation, prepared materials, supported communication or a smaller legitimate
    task. Existing care and rest needs take precedence over the chosen cue. The exercise does not prescribe
    pushing through illness or impaired functioning.
  expected_burden: About 20 to 30 minutes across setup, two bounded starts and comparison within seven
    days; either start may end after its planned two-to-five-minute step.
  action_count_rationale: null
  foreseeable_misuse:
  - Treating every low-energy state as resistance to overcome or using the practice to demand unpaid,
    unsafe, coercive, or excessive work.
  - Extending the start into an unplanned work session or ranking people by speed, output, persistence,
    or support needs.
  exclusions:
  - Unsafe, medically inappropriate, sleep-depriving, coercive, illegal, high-consequence, or crisis tasks.
  - Tasks whose delay, attempt, or partial start could create a safety, employment, legal, financial,
    caregiving, or health hazard.
  actions:
  - stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A1
    sequence: 1
    title: Observe the first bounded start under usual conditions
    instructions: 'In the first suitable low-motivation window, use your usual safe conditions without
      adding a new cue. Attempt the previously defined two-to-five-minute first step, such as beginning
      the coordination note with its item. Record whether the physical or communication start actually
      occurred and its duration, separately from any later output. End at the chosen boundary; continuing
      is optional and is not measured here. Record any capacity or safety concern honestly and stop when
      appropriate. If no suitable low-motivation window occurs, retain the deferral rather than manufacturing
      fatigue or calling an enthusiastic start evidence of low-motivation action.


      Observation checks: The first window uses usual conditions without an added cue; Whether the chosen
      start occurred is recorded directly; The start duration is recorded against its planned boundary;
      Capacity concerns and deferral remain explicit. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 5 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01
      action_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A1
      competency_stable_id: '08.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 30
      competency_measurement_ids:
      - baseline_start_occurred
      transfer_disposition: context_bound
      measurements:
      - measurement_id: baseline_start_occurred
        kind: boolean
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: baseline_scope_respected
        kind: duration
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        direction: at_most
        minimum: '0'
        target: '5'
        maximum: '15'
        unit: minutes
      - measurement_id: baseline_capacity_harm
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A2
    sequence: 2
    title: Try the same sized start with one concrete cue
    instructions: 'At a separate suitable low-motivation opportunity, use the same sized first step with
      exactly one chosen cue or support. A cue can be the needed material placed safely in view, a calendar
      prompt or a willing helper''s agreed reminder. Record whether the start occurred and the cue category,
      without private task content or the helper''s identity. Keep necessary supports in both windows;
      the comparison is not independent versus unsupported. Defer if capacity, safety or responsibilities
      have changed. A missed or deferred start remains visible and cannot be replaced with a claim that
      preparing the cue was itself starting the task.


      Observation checks: The second opportunity is separate and suitable; Exactly one cue or support
      category is identified; Whether the cued start occurred is recorded directly; Private content and
      changed-capacity deferral are preserved. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 5 minutes
    due_within_days: 6
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01
      action_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A2
      competency_stable_id: '08.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 30
      competency_measurement_ids:
      - cued_start_occurred
      transfer_disposition: context_bound
      measurements:
      - measurement_id: cued_start_occurred
        kind: boolean
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: cue_category_recorded
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - cue_selected
        - one_cue_only
        - no_private_content
      - measurement_id: cued_capacity_harm
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A3
    sequence: 3
    title: Compare the two starts without judging output or capacity
    instructions: 'Review the two structured records and state whether zero, one or two chosen starts
      actually occurred. Compare the cue as more workable, less workable or indistinguishable, giving
      an observed reason rather than a productivity judgment. Keep differences in timing, energy, pain,
      care duties and access visible as context; do not score them as character. The supplied note may
      still be unfinished because the evidence concerns beginning, not output. If both suitable windows
      did not occur, leave the comparison inconclusive. Decide to retain, adapt, defer or discard the
      cue; a stronger challenge or longer work period is not the automatic next step.


      Observation checks: The count reflects zero one or two actual starts; The two windows and any deferral
      are distinguished; The cue comparison is bounded by observed context differences; Capacity output
      and worth are not treated as performance scores. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Did a chosen start occur in each naturally suitable low-motivation window, and did
      one cue make access more workable? Retain the existing Boolean start observations, duration, count
      and supporting checks. Keep missing windows inconclusive and choose whether to retain, adapt, defer
      or discard the arrangement; two starts do not establish broad reliability.


      Examples: Supportive: Both bounded starts occurred, one under usual conditions and one with a visible-material
      cue; the comparison retained timing and capacity differences without scoring output.


      Mixed: The usual-condition start occurred but the cued window was safely deferred; the record retained
      one actual start and an inconclusive comparison.


      Contradictory: The cue added pressure or the bounded start displaced a needed support; the adverse
      effect was recorded instead of being called discipline.


      Inconclusive: No comparable low-motivation windows occurred, or start occurrence was unknown, so
      preparation alone did not establish repeated starting.'
    expected_time: 10 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01
      action_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A3
      competency_stable_id: '08.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 30
      competency_measurement_ids:
      - chosen_start_count
      transfer_disposition: context_bound
      measurements:
      - measurement_id: chosen_start_count
        kind: count
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        direction: at_least
        minimum: '0'
        target: '2'
        maximum: '2'
      - measurement_id: comparison_boundaries_present
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_windows_distinguished
        - defer_preserved
        - capacity_not_scored
      - measurement_id: comparison_used_for_coercion
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use a free calendar cue, an existing object placed safely, or a self-written non-private task label;
      no app, purchase, reward, or accountability service is required.
    accessibility:
    - Use dictation, prepared materials, supported communication or a smaller legitimate task. Existing
      care and rest needs take precedence over the chosen cue. The exercise does not prescribe pushing
      through illness or impaired functioning.
    cultural_context:
    - Choose a necessary task and support arrangement consistent with the person's roles, collective responsibilities,
      rest norms, and authority to decide.
    resource_variants:
    - Use dictation, prepared materials, supported communication or a smaller legitimate task. Existing
      care and rest needs take precedence over the chosen cue. The exercise does not prescribe pushing
      through illness or impaired functioning.
  pause_conditions:
  - Pause when pain, fatigue, low energy, depression symptoms, distress, care duties, access needs, illness,
    sleep need, or changed circumstances make the chosen start unwise.
  stop_conditions:
  - Stop if the task becomes unsafe, coercive, medically inappropriate, sleep-depriving, high-consequence,
    or harmful, or if another person uses the record for surveillance or pressure.
  escalation_conditions:
  - Escalate an unsafe workplace, care, housing, or interpersonal demand to an appropriate support channel
    rather than using this practice to comply.
  professional_referral_conditions:
  - Seek appropriately qualified support when persistent low energy, depression, pain, sleep disruption,
    disability barriers, or functional difficulty is distressing or safety-affecting; this protocol is
    not diagnosis or treatment.
evidence_and_scoring:
  accepted_evidence_types:
  - structured firsthand behavioral start
  - privacy-minimized cue-criteria artifact
  - bounded two-window comparison
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - baseline_start_occurred
  - baseline_scope_respected
  - baseline_capacity_harm
  - cued_start_occurred
  - cue_category_recorded
  - cued_capacity_harm
  - chosen_start_count
  - comparison_boundaries_present
  - comparison_used_for_coercion
  adverse_or_contradictory_indicators:
  - The cue added pressure or the bounded start displaced a needed support; the adverse effect was recorded
    instead of being called discipline.
  independence_rule: Record self-directed, planning-aid, or guided support explicitly; support can make
    a start accessible and never reduces dignity or silently changes a typed value.
  context_transfer_rule: Evidence is limited to the chosen task, two windows, stated capacity, and cue;
    it does not establish motivation-independent action across roles or health states.
  repetition_rule: Each start is a separate immutable origin and later repeats use the typed contract's
    explicit diminishing multipliers; duplicate origins are rejected.
  recency_rule: Rules withhold observations older than the explicit 30-day bound; no unrecorded retention
    assumption applies.
  performance_rubric: 'Action 1: Observe the first bounded start under usual conditions. Observed checks:
    The first window uses usual conditions without an added cue; Whether the chosen start occurred is
    recorded directly; The start duration is recorded against its planned boundary; Capacity concerns
    and deferral remain explicit. Action 2: Try the same sized start with one concrete cue. Observed checks:
    The second opportunity is separate and suitable; Exactly one cue or support category is identified;
    Whether the cued start occurred is recorded directly; Private content and changed-capacity deferral
    are preserved. Action 3: Compare the two starts without judging output or capacity. Observed checks:
    The count reflects zero one or two actual starts; The two windows and any deferral are distinguished;
    The cue comparison is bounded by observed context differences; Capacity output and worth are not treated
    as performance scores.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. No comparable low-motivation windows occurred, or start
    occurrence was unknown, so preparation alone did not establish repeated starting.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated typed primary measurements may produce context-bound direct competency
    shadow evidence only; protocol performance remains distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse evidence under the typed contract.
  - Withhold any record that contains private task content, health narrative, another person's identity,
    implicit motivation judgment, or evidence outside its assessment epoch.
