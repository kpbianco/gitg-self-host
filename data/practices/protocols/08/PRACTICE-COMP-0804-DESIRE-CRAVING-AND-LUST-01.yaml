        expected: true
  - stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A3
    sequence: 3
    title: Make a bounded choice while allowing the desire to remain
    instructions: 'Choose a suitable action: continue the chosen task, take a freely chosen ordinary leisure
      break, keep using the existing item or decline an optional acquisition. Perform that choice and
      review later whether wanting remained and whether the action served your reasons. In the supplied
      case, return to an actual activity using what you already have; a purchase is unnecessary. If the
      desire returned, note the recurrence without turning it into a failed purity test. Record any unchosen
      checking or pressure honestly and revise the situation rather than defending it as irresistible.


      Observation checks: A bounded ordinary choice is actually performed; The choice has reasons beyond
      immediate wanting; Continuing desire does not automatically invalidate the action; Unchosen behavior
      or pressure is recorded without justification. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What did desire hide, and could you choose with the fuller picture available? Keep
      a useful reminder without claiming that appreciating or experiencing desire is itself wrong.


      Examples: Supportive: The new item still appealed, but the person noticed the existing item''s function
      and deliberately returned to using it.


      Mixed: The choice fit the person''s reasons, yet repeated browsing continued; that unresolved pattern
      was retained for review.


      Contradictory: Wanting was used to justify pressuring another person or dismissing every fact that
      complicated an acquisition.


      Inconclusive: The person condemned desire in general without examining a specific promise, neglected
      fact or chosen action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01
      action_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A3
