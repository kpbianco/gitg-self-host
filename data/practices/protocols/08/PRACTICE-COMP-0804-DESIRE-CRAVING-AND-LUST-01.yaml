        - another_person_s_independent_boundaries_are_preserved_where_relevant
        - desire_is_not_treated_as_entitlement
        - a_concrete_broader_view_statement_is_written
      - measurement_id: c0804_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
