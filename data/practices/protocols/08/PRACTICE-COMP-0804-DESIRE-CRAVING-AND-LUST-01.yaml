meaning_and_fit:
  purpose: Notice how wanting narrows attention and shapes judgment, then make a bounded choice that respects
    people and goods beyond their usefulness to the desire.
  why_recommended: Notice how wanting narrows attention and shapes judgment, then make a bounded choice
    that respects people and goods beyond their usefulness to the desire.
  claims:
  - statement: Notice how wanting narrows attention and shapes judgment, then make a bounded choice that
      respects people and goods beyond their usefulness to the desire.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Desire, craving, and lust practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Desire, craving, and lust as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the accessory case or a nonsexual ordinary desire. Privacy, consent and
    necessities remain intact. If craving concerns dependence or distressing compulsive behavior, seek
    suitable care rather than abruptly changing substance use or imposing deprivation through this exercise.
  opportunity_considerations: 'Use an ordinary desire such as checking an entertaining feed, or this case:
    an attractive new accessory seems essential even though an existing one serves its function. Use a
    private note; do not buy anything or view provocative material for the exercise.'
  prerequisites:
  - 'Use an ordinary desire such as checking an entertaining feed, or this case: an attractive new accessory
    seems essential even though an existing one serves its function. Use a private note; do not buy anything
    or view provocative material for the exercise.'
  dependencies: []
  safe_alternatives:
  - Use the accessory case or a nonsexual ordinary desire. Privacy, consent and necessities remain intact.
    If craving concerns dependence or distressing compulsive behavior, seek suitable care rather than
    abruptly changing substance use or imposing deprivation through this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Desire, craving, and lust differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Desire, craving, and lust
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an ordinary desire such as checking an entertaining feed, or this case: an attractive new
    accessory seems essential even though an existing one serves its function. Use a private note; do
    not buy anything or view provocative material for the exercise. Goal: Notice how wanting narrows attention
    and shapes judgment, then make a bounded choice that respects people and goods beyond their usefulness
    to the desire. Scope: A harmless ordinary desire illustrates attention and choice. It does not require
    sexual disclosure, abstinence from necessities, deliberate craving or treatment of addiction. Time
    and effort: About 15 minutes for observation and one ordinary choice, followed by a short later review.
    Adaptation: Use the accessory case or a nonsexual ordinary desire. Privacy, consent and necessities
    remain intact. If craving concerns dependence or distressing compulsive behavior, seek suitable care
    rather than abruptly changing substance use or imposing deprivation through this exercise. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the accessory case or a nonsexual ordinary desire. Privacy, consent and necessities
    remain intact. If craving concerns dependence or distressing compulsive behavior, seek suitable care
    rather than abruptly changing substance use or imposing deprivation through this exercise.
  expected_burden: About 15 minutes for observation and one ordinary choice, followed by a short later
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Desire, craving, and lust protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Desire, craving, and lust action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the accessory
    case or a nonsexual ordinary desire. Privacy, consent and necessities remain intact. If craving concerns
    dependence or distressing compulsive behavior, seek suitable care rather than abruptly changing substance
    use or imposing deprivation through this exercise.
  actions:
  - stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A1
    sequence: 1
    title: Describe what wanting makes prominent and what it hides
    instructions: 'Write the wanted experience, the promised benefit and the details receiving most attention.
      Then name two neglected facts, such as the existing item''s usefulness or another commitment that
      matters. Separate I want this from I must have this and from a claim that obtaining it will settle
      your identity. In the case, attractive design may be a real preference without making the accessory
      necessary. Notice whether the desire changes what evidence you accept. Record the desire''s presence
      without trying to intensify it or insisting it vanish before you can choose.


      Observation checks: The wanted experience and promised benefit are specific; Two neglected facts
      broaden the picture; Wanting is separated from necessity and identity claims; Changes in attention
      or evidence selection are identified. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01
      action_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A1
      competency_stable_id: '08.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0804_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0804_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_wanted_experience_and_promised_benefit_are_specific
        - two_neglected_facts_broaden_the_picture
        - wanting_is_separated_from_necessity_and_identity_claims
        - changes_in_attention_or_evidence_selection_are_identified
      - measurement_id: c0804_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0804_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A2
    sequence: 2
    title: Check whether a person or good is being reduced to a means
    instructions: 'Ask what else matters about the person or object beyond satisfying the urge. For an
      object, consider its actual function, care and place among other chosen commitments. For a relational
      or sexual example considered privately, another person''s preferences, boundaries and right to decline
      remain independent of your wanting; attraction creates no entitlement. Do not contact someone to
      test this. Write a sentence that restores the broader view, such as I can appreciate this design
      while using what already works, or Their choice is theirs even when I feel disappointed.


      Observation checks: The person or good is considered beyond satisfying the urge; Another person''s
      independent boundaries are preserved where relevant; Desire is not treated as entitlement; A concrete
      broader-view statement is written. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01
      action_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A2
      competency_stable_id: '08.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0804_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0804_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
