  - stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01-A2
    sequence: 2
    title: Perform the simplification without turning discomfort into the objective
    instructions: 'During the chosen period, do the ordinary activity with only the selected optional
      feature absent. Notice what you miss, what remains available and whether you can choose how to respond.
      You may restore the feature if the omission interferes with a legitimate need; record why. Do not
      increase the duration because the trial seems too easy, seek an audience for toughness or withhold
      ordinary care. If nothing significant happens, retain that neutral result. The action is the bounded
      simplification, not achieving a required amount of boredom or deprivation.


      Observation checks: Only the chosen optional feature is omitted; The ordinary activity remains safe
      and accessible; Actual effects including neutrality are recorded; Duration or hardship is not escalated
      to make the trial impressive. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01
      action_stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01-A2
