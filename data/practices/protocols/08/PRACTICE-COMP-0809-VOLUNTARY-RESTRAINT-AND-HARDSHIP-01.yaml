meaning_and_fit:
  purpose: Choose a safe optional restraint, observe its effect on choice and appreciation, and stop or
    revise it if it becomes pride, compulsion or needless burden.
  why_recommended: Choose a safe optional restraint, observe its effect on choice and appreciation, and
    stop or revise it if it becomes pride, compulsion or needless burden.
  claims:
  - statement: Choose a safe optional restraint, observe its effect on choice and appreciation, and stop
      or revise it if it becomes pride, compulsion or needless burden.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Voluntary restraint and hardship practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Voluntary restraint and hardship as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Choose another optional feature if quiet is uncomfortable or background sound
    is an access support. Do not remove food, water, sleep, medication, temperature protection or needed
    human contact. Health-related restraint belongs with suitable qualified guidance rather than this
    generic trial.
  opportunity_considerations: Choose one ordinary ten-minute period without optional background entertainment
    while doing a suitable routine activity. Keep communication, accessibility aids and anything needed
    for care or safety available. No personal hardship needs to be created.
  prerequisites:
  - Choose one ordinary ten-minute period without optional background entertainment while doing a suitable
    routine activity. Keep communication, accessibility aids and anything needed for care or safety available.
    No personal hardship needs to be created.
  dependencies: []
  safe_alternatives:
  - Choose another optional feature if quiet is uncomfortable or background sound is an access support.
    Do not remove food, water, sleep, medication, temperature protection or needed human contact. Health-related
    restraint belongs with suitable qualified guidance rather than this generic trial.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Voluntary restraint and hardship differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Voluntary restraint and hardship
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose one ordinary ten-minute period without optional background entertainment while doing
    a suitable routine activity. Keep communication, accessibility aids and anything needed for care or
    safety available. No personal hardship needs to be created. Goal: Choose a safe optional restraint,
    observe its effect on choice and appreciation, and stop or revise it if it becomes pride, compulsion
    or needless burden. Scope: This practice chooses simplicity or reduced optional stimulation. It does
    not prescribe fasting, sleep loss, deprivation, pain or strenuous training; those are not interchangeable
    demonstrations of freedom. Time and effort: About 10 minutes of preparation, one ten-minute optional
    simplification and a short review. Adaptation: Choose another optional feature if quiet is uncomfortable
    or background sound is an access support. Do not remove food, water, sleep, medication, temperature
    protection or needed human contact. Health-related restraint belongs with suitable qualified guidance
    rather than this generic trial. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Choose another optional feature if quiet is uncomfortable or background sound is
    an access support. Do not remove food, water, sleep, medication, temperature protection or needed
    human contact. Health-related restraint belongs with suitable qualified guidance rather than this
    generic trial.
  expected_burden: About 10 minutes of preparation, one ten-minute optional simplification and a short
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Voluntary restraint and hardship protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Voluntary restraint and hardship action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Choose another
    optional feature if quiet is uncomfortable or background sound is an access support. Do not remove
    food, water, sleep, medication, temperature protection or needed human contact. Health-related restraint
    belongs with suitable qualified guidance rather than this generic trial.
  actions:
  - stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01-A1
    sequence: 1
    title: Choose restraint for a purpose and compare legitimate alternatives
    instructions: 'Consider simplicity, silence, abstaining from an optional activity and reduced comfort
      as possible forms; fasting and difficult training involve additional health and context questions
      and are not selected here. State the purpose of this modest trial, such as noticing what you usually
      seek from background entertainment. Define the exact optional feature you will omit and what will
      stay available. Set the end time and a stopping reason, such as interference with an access need.
      Keep the choice voluntary; another person''s different practice or decision not to participate is
      not a lower moral standard.


      Observation checks: Different forms of restraint are considered without treating them as equivalent;
      One modest optional omission has a concrete purpose; End time stopping reason and retained necessities
      are explicit; Participation remains voluntary without ranking other people. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01
      action_stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01-A1
      competency_stable_id: '08.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0809_a1_primary
      transfer_disposition: context_bound
      measurements:
