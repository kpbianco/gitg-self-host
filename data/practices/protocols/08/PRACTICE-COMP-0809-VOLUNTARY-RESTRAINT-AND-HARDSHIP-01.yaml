        - one_modest_optional_omission_has_a_concrete_purpose
        - end_time_stopping_reason_and_retained_necessities_are_explicit
        - participation_remains_voluntary_without_ranking_other_people
      - measurement_id: c0809_a1_boundary
        kind: boolean
