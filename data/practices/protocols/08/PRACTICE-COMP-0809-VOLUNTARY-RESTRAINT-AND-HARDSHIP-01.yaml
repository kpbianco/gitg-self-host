  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Voluntary restraint and hardship; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Choose another optional feature if quiet is uncomfortable or background sound is an access support.
      Do not remove food, water, sleep, medication, temperature protection or needed human contact. Health-related
      restraint belongs with suitable qualified guidance rather than this generic trial.
    cultural_context:
    - Adapt the expression of Voluntary restraint and hardship to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Choose another optional feature if quiet is uncomfortable or background sound is an access support.
      Do not remove food, water, sleep, medication, temperature protection or needed human contact. Health-related
      restraint belongs with suitable qualified guidance rather than this generic trial.
  pause_conditions:
  - Pause Voluntary restraint and hardship when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Voluntary restraint and hardship practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Voluntary restraint and hardship situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
