  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Tolerance of discomfort; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Tolerance of discomfort; assistive technology, interpretation, a support person, and a
      deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Tolerance of discomfort to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Tolerance of discomfort opportunity is unavailable or inappropriate, use a fictional,
      historical, public, simulated, or planning-only equivalent and retain the narrower evidence classification.
  pause_conditions:
  - Pause Tolerance of discomfort when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Tolerance of discomfort practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
