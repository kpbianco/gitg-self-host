        expected: true
  - stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A2
    sequence: 2
    title: Attempt the bounded work without first negotiating away every feeling
    instructions: 'Begin the reminder and include the item, time and destination. If boredom, uncertainty
      or an urge to switch appears, name it briefly and return to the next concrete word or dictated phrase.
      Do not spend the whole window measuring discomfort. Use the supplied facts instead of searching
      for a perfect sentence. If no discomfort appears, simply complete the task and record that this
      occasion did not test tolerance. Respect the stopping boundary or use an accessible format if needed.
      An unfinished attempt remains visible rather than being redefined as success.


      Observation checks: The useful task is actually attempted; Any ordinary discomfort is recorded without
      required provocation; Attention returns to a concrete next step when appropriate; Completion absence
      of discomfort and stopping remain distinct. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01
      action_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A2
      competency_stable_id: '08.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0805_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0805_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_useful_task_is_actually_attempted
        - any_ordinary_discomfort_is_recorded_without_required_provocation
        - attention_returns_to_a_concrete_next_step_when_appropriate
        - completion_absence_of_discomfort_and_stopping_remain_distinct
      - measurement_id: c0805_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0805_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A3
    sequence: 3
    title: Check the work and separate willingness from endurance
    instructions: 'Compare the reminder with the three facts, correcting any omission. Record whether
      ordinary discomfort was present, whether you continued appropriately and what made the task workable.
      For example, Return the library book tomorrow at 3 pm to the front desk meets the requirement without
      elegant wording. If you stopped for a legitimate limit, identify an accessible next arrangement
      rather than prescribing a longer exposure. Choose whether this small method is useful for another
      ordinary task. Completing a trivial exercise does not demonstrate tolerance of pain, fatigue or
      a major uncertain situation.


      Observation checks: The result is checked against all three supplied facts; Actual willingness is
      distinguished from imagined endurance; A legitimate stop leads to adaptation rather than punishment;
      Transfer claims stay within the observed ordinary task. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Could a small useful action proceed while ordinary discomfort was present, and where
      did stopping or support make more sense? Keep the practical lesson without making suffering the
      goal.


      Examples: Supportive: The person felt bored, returned to the three facts and completed an actionable
      reminder without waiting to become interested.


      Mixed: The reminder was finished easily, so task completion was observed but discomfort tolerance
      was not tested on this occasion.


      Contradictory: Pain or worsening distress was deliberately ignored to make the task count as toughness,
      or the time limit was repeatedly extended.


      Inconclusive: The person planned to endure boredom but neither attempted the supplied task nor recorded
      a legitimate stopping decision.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01
