completion_and_review:
  completion_criteria:
  - The audit one bounded tolerance of discomfort context action was attempted or explicitly deferred.
  - The make one reversible tolerance of discomfort redesign action was attempted or explicitly deferred.
  - The compare the tolerance of discomfort context after the change action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0805_a1_primary
    - c0805_a2_primary
    - c0805_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Tolerance of discomfort only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Tolerance of discomfort across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Tolerance of discomfort require in this exact context, what remains outside my role
      or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Tolerance of discomfort criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Completes worthwhile action while discomfort is present and
      reviews what was learned.', what contradiction or missing context matters most, and should this
      Tolerance of discomfort design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Tolerance of discomfort design only when the context and burden remain
      appropriate.
    adapt: Change the Tolerance of discomfort medium, scope, support, timing, criteria, or context while
      preserving provenance and the narrower evidence claim.
    stop: Stop Tolerance of discomfort when the practice becomes coercive, unsafe, privacy-invasive, role-inappropriate,
      professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Tolerance of discomfort questions beyond
      this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Tolerance of discomfort criteria were observed with provenance and no adverse
      boundary signal in the selected context.
    mixed: Some Tolerance of discomfort criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Tolerance of discomfort criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Tolerance of discomfort action was deferred, not observed, not applicable, stale,
      insufficiently bounded, or too confounded to interpret.
