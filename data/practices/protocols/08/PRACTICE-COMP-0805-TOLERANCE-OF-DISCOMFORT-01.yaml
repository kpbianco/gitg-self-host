      Tolerance of discomfort; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use dictation, symbols or a helper transcribing your choices. Do not select an activity that aggravates
      pain or requires ignoring care guidance. A task completed without discomfort shows task performance
      only.
    cultural_context:
    - Adapt the expression of Tolerance of discomfort to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use dictation, symbols or a helper transcribing your choices. Do not select an activity that aggravates
      pain or requires ignoring care guidance. A task completed without discomfort shows task performance
      only.
  pause_conditions:
  - Pause Tolerance of discomfort when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Tolerance of discomfort practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Tolerance of discomfort situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
