meaning_and_fit:
  purpose: Distinguish tolerable ordinary discomfort from a reason to stop, then complete a bounded useful
    action without requiring boredom or frustration to disappear.
  why_recommended: Distinguish tolerable ordinary discomfort from a reason to stop, then complete a bounded
    useful action without requiring boredom or frustration to disappear.
  claims:
  - statement: Distinguish tolerable ordinary discomfort from a reason to stop, then complete a bounded
      useful action without requiring boredom or frustration to disappear.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Tolerance of discomfort practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Tolerance of discomfort as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use dictation, symbols or a helper transcribing your choices. Do not select
    an activity that aggravates pain or requires ignoring care guidance. A task completed without discomfort
    shows task performance only.
  opportunity_considerations: 'Use this two-minute task: rewrite the vague note Bring the stuff later
    into an actionable reminder naming the item, time and destination. Supply these facts: library book,
    tomorrow at 3 pm, front desk. Paper or dictation is sufficient. If you use a personal task, make it
    comparably small and appropriate.'
  prerequisites:
  - 'Use this two-minute task: rewrite the vague note Bring the stuff later into an actionable reminder
    naming the item, time and destination. Supply these facts: library book, tomorrow at 3 pm, front desk.
    Paper or dictation is sufficient. If you use a personal task, make it comparably small and appropriate.'
  dependencies: []
  safe_alternatives:
  - Use dictation, symbols or a helper transcribing your choices. Do not select an activity that aggravates
    pain or requires ignoring care guidance. A task completed without discomfort shows task performance
    only.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Tolerance of discomfort differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Tolerance of discomfort as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this two-minute task: rewrite the vague note Bring the stuff later into an actionable reminder
    naming the item, time and destination. Supply these facts: library book, tomorrow at 3 pm, front desk.
    Paper or dictation is sufficient. If you use a personal task, make it comparably small and appropriate.
    Goal: Distinguish tolerable ordinary discomfort from a reason to stop, then complete a bounded useful
    action without requiring boredom or frustration to disappear. Scope: This exercise uses low-stakes
    boredom or uncertainty, not pain exposure, exhaustion training or a test of how much distress someone
    can endure. Time and effort: About 10 minutes including preparation, the bounded task and review.
    Adaptation: Use dictation, symbols or a helper transcribing your choices. Do not select an activity
    that aggravates pain or requires ignoring care guidance. A task completed without discomfort shows
    task performance only. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use dictation, symbols or a helper transcribing your choices. Do not select an
    activity that aggravates pain or requires ignoring care guidance. A task completed without discomfort
    shows task performance only.
  expected_burden: About 10 minutes including preparation, the bounded task and review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Tolerance of discomfort protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Tolerance of discomfort action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use dictation,
    symbols or a helper transcribing your choices. Do not select an activity that aggravates pain or requires
    ignoring care guidance. A task completed without discomfort shows task performance only.
  actions:
  - stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A1
    sequence: 1
    title: Choose useful discomfort and define a stopping boundary
    instructions: 'Consider boredom, uncertainty, frustration, embarrassment, fatigue, craving and temporary
      pain as different experiences rather than one demand to push through. Choose ordinary boredom or
      uncertainty for this task; do not induce the others. Name the useful result and a short stopping
      point. For the supplied note, success is a reminder containing all three given facts. Identify a
      reason to stop or adapt, such as pain, worsening distress or an inaccessible writing method. Stopping
      for such a reason protects the task''s purpose; it is not evidence of moral weakness.


      Observation checks: The seven kinds of discomfort are distinguished without inducing them; The selected
      task has a useful concrete result; A short stopping point is stated; Safety and accessibility limits
      are explicit. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01
      action_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A1
      competency_stable_id: '08.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0805_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0805_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_seven_kinds_of_discomfort_are_distinguished_without_inducing_them
        - the_selected_task_has_a_useful_concrete_result
        - a_short_stopping_point_is_stated
        - safety_and_accessibility_limits_are_explicit
      - measurement_id: c0805_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0805_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
