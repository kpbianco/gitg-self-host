  - c0501_a3_adverse
  adverse_or_contradictory_indicators:
  - One mistake was converted into a verdict of worthlessness, or an advantage was hidden to make success
    appear entirely self-made.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for An honest personal inventory explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen An honest personal inventory context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each An honest personal inventory observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated An honest personal inventory rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Separate a description from its evidence. Observed checks: All nine headings
    have a disposition; Positive and difficult events are both represented; Observations are distinguished
    from interpretations. Action 2: Challenge an overstatement in each direction. Observed checks: A flattering
    overstatement is qualified; A condemning overstatement is qualified; One recurring outcome has a tentative
    contextual explanation. Action 3: Check one inventory claim against the next occasion. Observed checks:
    A prediction and possible counterexample precede the occasion; An actual outcome or missing opportunity
    is recorded; The claim is retained or revised with a reason.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Nine labels were filled in without examples or an observed
    follow-up opportunity.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct An honest
    personal inventory contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L05
  - L13
  - L36
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse An honest personal inventory evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
