meaning_and_fit:
  purpose: Describe present strengths, difficulties, supports and responsibilities using concrete observations
    instead of a flattering or condemning identity verdict.
  why_recommended: Describe present strengths, difficulties, supports and responsibilities using concrete
    observations instead of a flattering or condemning identity verdict.
  claims:
  - statement: Describe present strengths, difficulties, supports and responsibilities using concrete
      observations instead of a flattering or condemning identity verdict.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: In this study, the relative accuracy of self and other personality judgments differed by
      the traits examined; neither perspective was uniformly best.
    classification: empirical_finding
    source_ids:
    - SRC-VAZIRE-SELF-OTHER-2010
    limitations: One study of 165 participants with friend and stranger ratings and behavioral criteria.
      It does not establish the truth of any individual feedback, validate this inventory or conversation
      exercise, or make another person's view authoritative.
  applicability_question: Does a voluntary, bounded An honest personal inventory practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record An honest personal inventory as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Dictate privately or use brief symbols. You may omit identifying details and
    use an invented appointment case for rehearsal; that does not establish a personal inventory. Stop
    if reflection becomes distressing and choose a neutral topic or appropriate support.
  opportunity_considerations: 'Use a private page with nine headings: strengths, limitations, fears, past
    difficulties, advantages, habits, obligations, dependencies, and recurring outcomes. Use the last
    two weeks and an ordinary example such as keeping appointments; no painful memory retrieval is needed.'
  prerequisites:
  - 'Use a private page with nine headings: strengths, limitations, fears, past difficulties, advantages,
    habits, obligations, dependencies, and recurring outcomes. Use the last two weeks and an ordinary
    example such as keeping appointments; no painful memory retrieval is needed.'
  dependencies: []
  safe_alternatives:
  - Dictate privately or use brief symbols. You may omit identifying details and use an invented appointment
    case for rehearsal; that does not establish a personal inventory. Stop if reflection becomes distressing
    and choose a neutral topic or appropriate support.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    An honest personal inventory differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about An honest personal inventory
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private page with nine headings: strengths, limitations, fears, past difficulties, advantages,
    habits, obligations, dependencies, and recurring outcomes. Use the last two weeks and an ordinary
    example such as keeping appointments; no painful memory retrieval is needed. Goal: Describe present
    strengths, difficulties, supports and responsibilities using concrete observations instead of a flattering
    or condemning identity verdict. Scope: This is a current-life sample, not a diagnosis or complete
    autobiography. Sensitive history can remain undescribed; an unknown or private entry does not mean
    that part of life is absent. Time and effort: Two 15-minute sessions and one brief check during the
    next ordinary week. Adaptation: Dictate privately or use brief symbols. You may omit identifying details
    and use an invented appointment case for rehearsal; that does not establish a personal inventory.
    Stop if reflection becomes distressing and choose a neutral topic or appropriate support. Keep personal
    working notes outside the check-in; record only the listed observations.


    Reference support:

    Who Knows What About a Person? The Self–Other Knowledge Asymmetry (SOKA) Model: https://www.simine.com/docs/Vazire_JPSP_2010.pdf'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Dictate privately or use brief symbols. You may omit identifying details and use
    an invented appointment case for rehearsal; that does not establish a personal inventory. Stop if
    reflection becomes distressing and choose a neutral topic or appropriate support.
  expected_burden: Two 15-minute sessions and one brief check during the next ordinary week.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the An honest personal inventory protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed An honest personal inventory action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Dictate privately
    or use brief symbols. You may omit identifying details and use an invented appointment case for rehearsal;
    that does not establish a personal inventory. Stop if reflection becomes distressing and choose a
    neutral topic or appropriate support.
  actions:
  - stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01-A1
    sequence: 1
    title: Separate a description from its evidence
    instructions: 'Put one observation, unknown, or deliberately private entry under each heading. For
      observations, record an event and its limits: I arrived on time twice when reminders were set, rather
      than I am always dependable. Include one thing that went well, one that did not, and help or access
      that mattered. Describe fear as your present experience, not proof that its prediction is true.


      Observation checks: All nine headings have a disposition; Positive and difficult events are both
      represented; Observations are distinguished from interpretations. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01
      action_stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01-A1
      competency_stable_id: '05.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0501_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0501_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_nine_headings_have_a_disposition
        - positive_and_difficult_events_are_both_represented
        - observations_are_distinguished_from_interpretations
      - measurement_id: c0501_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0501_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01-A2
    sequence: 2
    title: Challenge an overstatement in each direction
    instructions: 'Find the most flattering and most condemning sentence. For each, identify an exception,
      missing context, or uncertainty and rewrite it proportionately. Connect a recurring result to a
      habit, obligation, resource or dependency without assuming that connection proves causation. Example:
      lateness after an extra care task suggests a scheduling constraint, not total irresponsibility.


      Observation checks: A flattering overstatement is qualified; A condemning overstatement is qualified;
      One recurring outcome has a tentative contextual explanation. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01
      action_stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01-A2
      competency_stable_id: '05.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0501_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0501_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_flattering_overstatement_is_qualified
        - a_condemning_overstatement_is_qualified
        - one_recurring_outcome_has_a_tentative_contextual_explanation
      - measurement_id: c0501_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0501_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01-A3
    sequence: 3
    title: Check one inventory claim against the next occasion
    instructions: 'Choose one ordinary claim that has an upcoming opportunity. Before it occurs, write
      what you expect and what would count against it. At the opportunity, use normal supports and record
      what actually happened; then retain, narrow or revise the claim. If no occasion occurs, leave the
      claim untested instead of counting a prediction as observation.


      Observation checks: A prediction and possible counterexample precede the occasion; An actual outcome
      or missing opportunity is recorded; The claim is retained or revised with a reason. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which statement became more accurate, what remains unknown, and what practical support
      does this inventory suggest?


      Examples: Supportive: The claim about unreliability was narrowed to appointments without travel
      time, and the next recorded appointment tested that distinction.


      Mixed: The inventory includes strengths and difficulties, but a recurring outcome still has several
      plausible explanations.


      Contradictory: One mistake was converted into a verdict of worthlessness, or an advantage was hidden
      to make success appear entirely self-made.


      Inconclusive: Nine labels were filled in without examples or an observed follow-up opportunity.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01
      action_stable_id: PRACTICE-COMP-0501-AN-HONEST-PERSONAL-INVENTORY-01-A3
      competency_stable_id: '05.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0501_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0501_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_prediction_and_possible_counterexample_precede_the_occasion
        - an_actual_outcome_or_missing_opportunity_is_recorded
        - the_claim_is_retained_or_revised_with_a_reason
      - measurement_id: c0501_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0501_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      An honest personal inventory; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Dictate privately or use brief symbols. You may omit identifying details and use an invented appointment
      case for rehearsal; that does not establish a personal inventory. Stop if reflection becomes distressing
      and choose a neutral topic or appropriate support.
    cultural_context:
    - Adapt the expression of An honest personal inventory to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Dictate privately or use brief symbols. You may omit identifying details and use an invented appointment
      case for rehearsal; that does not establish a personal inventory. Stop if reflection becomes distressing
      and choose a neutral topic or appropriate support.
  pause_conditions:
  - Pause An honest personal inventory when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the An honest personal inventory practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a An honest personal inventory situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded An honest personal inventory actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
