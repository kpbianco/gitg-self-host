    Positive and difficult events are both represented; Observations are distinguished from interpretations.'
  - 'Action 2: Challenge an overstatement in each direction. Observed checks: A flattering overstatement
    is qualified; A condemning overstatement is qualified; One recurring outcome has a tentative contextual
    explanation.'
  - 'Action 3: Check one inventory claim against the next occasion. Observed checks: A prediction and
    possible counterexample precede the occasion; An actual outcome or missing opportunity is recorded;
    The claim is retained or revised with a reason.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
