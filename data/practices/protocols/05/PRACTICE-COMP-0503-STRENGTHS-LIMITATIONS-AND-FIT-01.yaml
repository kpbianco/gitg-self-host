  - c0503_a3_adverse
  adverse_or_contradictory_indicators:
  - A necessary aid was removed or one difficult session was used to declare permanent incapacity.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Strengths, limitations, and fit explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Strengths, limitations, and fit context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Strengths, limitations, and fit observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Strengths, limitations, and fit rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Describe the task and its operating conditions. Observed checks: A visible
    task result is defined before the session; Capability and constraint are distinguished; First-session
    result effort and help are recorded. Action 2: Try a supported version of the difficult part. Observed
    checks: One deliberate support change is tried; The difficult component receives a bounded attempt;
    Comparable results and other changed conditions are recorded. Action 3: Write a usable fit recommendation.
    Observed checks: The recommendation connects contribution and conditions; A supported development
    step is specified; An alternative explanation limits the conclusion.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A preferred role was chosen without trying or observing
    the task.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Strengths,
    limitations, and fit contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L05
  - L32
  - L36
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Strengths, limitations, and fit evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Describe the task and its operating conditions. Observed checks: A visible task result
    is defined before the session; Capability and constraint are distinguished; First-session result effort
    and help are recorded.'
  - 'Action 2: Try a supported version of the difficult part. Observed checks: One deliberate support
    change is tried; The difficult component receives a bounded attempt; Comparable results and other
    changed conditions are recorded.'
  - 'Action 3: Write a usable fit recommendation. Observed checks: The recommendation connects contribution
    and conditions; A supported development step is specified; An alternative explanation limits the conclusion.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0503_a1_primary
    - c0503_a2_primary
    - c0503_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: What should you use deliberately, what should you design around, and what deserves
    another supported attempt?
  transfer_limit: Two ordinary sessions can suggest a better fit; they do not establish a stable trait,
    disability, career verdict or causal effect. Accommodations and assistance remain legitimate parts
    of performance.
  reflection:
    before: 'What would count as doing this honestly? Goal: Use a small performance comparison to distinguish
      capability, energy, environment and support, then adapt one role or task accordingly.'
    during: Which checks have actually been observed? The second result improved, but better sleep and
      a simpler text make the reason uncertain.
    after: What should you use deliberately, what should you design around, and what deserves another
      supported attempt?
  review_guidance:
    repeat: Repeat the same bounded Strengths, limitations, and fit design only when the context and burden
      remain appropriate.
    adapt: Use seated, spoken, tactile or assisted work suited to you. Scale the task down rather than
      pushing through pain or exhaustion. Planning an inaccessible task is preparation and cannot substitute
      for the two performance observations.
    stop: Stop Strengths, limitations, and fit when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A checklist reduced missing steps while a verbal explanation used an existing strength;
      the participant kept both supports for another trial.
    mixed: The second result improved, but better sleep and a simpler text make the reason uncertain.
    contradictory: A necessary aid was removed or one difficult session was used to declare permanent
      incapacity.
    inconclusive: A preferred role was chosen without trying or observing the task.
