meaning_and_fit:
  purpose: Use a small performance comparison to distinguish capability, energy, environment and support,
    then adapt one role or task accordingly.
  why_recommended: Use a small performance comparison to distinguish capability, energy, environment and
    support, then adapt one role or task accordingly.
  claims:
  - statement: Use a small performance comparison to distinguish capability, energy, environment and support,
      then adapt one role or task accordingly.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Three experience-sampling studies found substantial within-person variation in Big Five
      related states alongside stable individual differences in their central tendencies.
    classification: empirical_finding
    source_ids:
    - SRC-FLEESON-STATES-2001
    limitations: Observational findings over two to three weeks do not establish causation, equal validity
      across personality models, or effectiveness of these product-authored trials. Two personal observations
      cannot validate a trait or instrument.
  applicability_question: Does a voluntary, bounded Strengths, limitations, and fit practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Strengths, limitations, and fit as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use seated, spoken, tactile or assisted work suited to you. Scale the task
    down rather than pushing through pain or exhaustion. Planning an inaccessible task is preparation
    and cannot substitute for the two performance observations.
  opportunity_considerations: Choose a harmless repeatable task, such as summarizing a short text or arranging
    a shelf. Keep necessary aids. Define one visible result, such as three accurate points or items easy
    to retrieve, and note available time and energy.
  prerequisites:
  - Choose a harmless repeatable task, such as summarizing a short text or arranging a shelf. Keep necessary
    aids. Define one visible result, such as three accurate points or items easy to retrieve, and note
    available time and energy.
  dependencies: []
  safe_alternatives:
  - Use seated, spoken, tactile or assisted work suited to you. Scale the task down rather than pushing
    through pain or exhaustion. Planning an inaccessible task is preparation and cannot substitute for
    the two performance observations.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Strengths, limitations, and fit differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Strengths, limitations, and
    fit as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a harmless repeatable task, such as summarizing a short text or arranging a shelf. Keep
    necessary aids. Define one visible result, such as three accurate points or items easy to retrieve,
    and note available time and energy. Goal: Use a small performance comparison to distinguish capability,
    energy, environment and support, then adapt one role or task accordingly. Scope: Two ordinary sessions
    can suggest a better fit; they do not establish a stable trait, disability, career verdict or causal
    effect. Accommodations and assistance remain legitimate parts of performance. Time and effort: Two
    10–20 minute task sessions on different occasions and a 10-minute comparison. Adaptation: Use seated,
    spoken, tactile or assisted work suited to you. Scale the task down rather than pushing through pain
    or exhaustion. Planning an inaccessible task is preparation and cannot substitute for the two performance
    observations. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Toward a Structure- and Process-Integrated View of Personality: Traits as Density Distributions of
    States: https://simine.com/407/readings/Fleeson_2001.pdf'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use seated, spoken, tactile or assisted work suited to you. Scale the task down
    rather than pushing through pain or exhaustion. Planning an inaccessible task is preparation and cannot
    substitute for the two performance observations.
  expected_burden: Two 10–20 minute task sessions on different occasions and a 10-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Strengths, limitations, and fit protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Strengths, limitations, and fit action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use seated,
    spoken, tactile or assisted work suited to you. Scale the task down rather than pushing through pain
    or exhaustion. Planning an inaccessible task is preparation and cannot substitute for the two performance
    observations.
  actions:
  - stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01-A1
    sequence: 1
    title: Describe the task and its operating conditions
    instructions: 'Name a capability the task uses, a part you find harder, and one constraint such as
      interruptions, reach, language or fatigue. Before the first session, state the visible result you
      will check. Complete the short session and record the result, effort and help used, including a
      strength that contributed.


      Observation checks: A visible task result is defined before the session; Capability and constraint
      are distinguished; First-session result effort and help are recorded. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01
      action_stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01-A1
      competency_stable_id: '05.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0503_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0503_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_visible_task_result_is_defined_before_the_session
        - capability_and_constraint_are_distinguished
        - first_session_result_effort_and_help_are_recorded
      - measurement_id: c0503_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0503_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01-A2
    sequence: 2
    title: Try a supported version of the difficult part
    instructions: 'Keep the same kind of task and change one feasible support: a quieter time, a written
      checklist, accessible placement or a smaller step. Practice the difficult component once with that
      support. Record the same result and effort checks, plus anything else that differed between sessions.
      Do not remove a needed aid to prove independence.


      Observation checks: One deliberate support change is tried; The difficult component receives a bounded
      attempt; Comparable results and other changed conditions are recorded. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01
      action_stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01-A2
      competency_stable_id: '05.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0503_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0503_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_deliberate_support_change_is_tried
        - the_difficult_component_receives_a_bounded_attempt
        - comparable_results_and_other_changed_conditions_are_recorded
      - measurement_id: c0503_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0503_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01-A3
    sequence: 3
    title: Write a usable fit recommendation
    instructions: 'Compare both attempts. Write I can contribute X under conditions Y; I need support
      Z; I will develop W through this small next step. Name one alternative explanation for the difference
      and the next opportunity that could test the recommendation. Keep it provisional if the sessions
      disagree.


      Observation checks: The recommendation connects contribution and conditions; A supported development
      step is specified; An alternative explanation limits the conclusion. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What should you use deliberately, what should you design around, and what deserves
      another supported attempt?


      Examples: Supportive: A checklist reduced missing steps while a verbal explanation used an existing
      strength; the participant kept both supports for another trial.


      Mixed: The second result improved, but better sleep and a simpler text make the reason uncertain.


      Contradictory: A necessary aid was removed or one difficult session was used to declare permanent
      incapacity.


      Inconclusive: A preferred role was chosen without trying or observing the task.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01
      action_stable_id: PRACTICE-COMP-0503-STRENGTHS-LIMITATIONS-AND-FIT-01-A3
      competency_stable_id: '05.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0503_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0503_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_recommendation_connects_contribution_and_conditions
        - a_supported_development_step_is_specified
        - an_alternative_explanation_limits_the_conclusion
      - measurement_id: c0503_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0503_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Strengths, limitations, and fit; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use seated, spoken, tactile or assisted work suited to you. Scale the task down rather than pushing
      through pain or exhaustion. Planning an inaccessible task is preparation and cannot substitute for
      the two performance observations.
    cultural_context:
    - Adapt the expression of Strengths, limitations, and fit to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use seated, spoken, tactile or assisted work suited to you. Scale the task down rather than pushing
      through pain or exhaustion. Planning an inaccessible task is preparation and cannot substitute for
      the two performance observations.
  pause_conditions:
  - Pause Strengths, limitations, and fit when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Strengths, limitations, and fit practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Strengths, limitations, and fit situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Strengths, limitations, and fit actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
