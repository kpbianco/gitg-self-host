meaning_and_fit:
  purpose: Notice a possible avoidance or self-protective explanation in an ordinary moment and choose
    a more accurate, responsible response.
  why_recommended: Notice a possible avoidance or self-protective explanation in an ordinary moment and
    choose a more accurate, responsible response.
  claims:
  - statement: Notice a possible avoidance or self-protective explanation in an ordinary moment and choose
      a more accurate, responsible response.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Defenses and self-deception practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Defenses and self-deception as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an impersonal scheduling task and private shorthand. Rehearse the supplied
    draft-message case if no real cue occurs, labeling it rehearsal. Stop if the task invites rumination,
    forced confession or unsafe disclosure.
  opportunity_considerations: Choose a low-stakes unfinished task or minor correction. Use the default
    case of delaying a short message while repeatedly polishing it. Keep legitimate constraints such as
    safety, access, care and workload visible.
  prerequisites:
  - Choose a low-stakes unfinished task or minor correction. Use the default case of delaying a short
    message while repeatedly polishing it. Keep legitimate constraints such as safety, access, care and
    workload visible.
  dependencies: []
  safe_alternatives:
  - Use an impersonal scheduling task and private shorthand. Rehearse the supplied draft-message case
    if no real cue occurs, labeling it rehearsal. Stop if the task invites rumination, forced confession
    or unsafe disclosure.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Defenses and self-deception differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Defenses and self-deception
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a low-stakes unfinished task or minor correction. Use the default case of delaying a
    short message while repeatedly polishing it. Keep legitimate constraints such as safety, access, care
    and workload visible. Goal: Notice a possible avoidance or self-protective explanation in an ordinary
    moment and choose a more accurate, responsible response. Scope: This examines one observable habit
    of explanation. It does not diagnose an unconscious defense, expose hidden motives or require you
    to accept someone else''s accusation. Time and effort: About 15 minutes of preparation, one natural
    opportunity, and a brief private review. Adaptation: Use an impersonal scheduling task and private
    shorthand. Rehearse the supplied draft-message case if no real cue occurs, labeling it rehearsal.
    Stop if the task invites rumination, forced confession or unsafe disclosure. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an impersonal scheduling task and private shorthand. Rehearse the supplied
    draft-message case if no real cue occurs, labeling it rehearsal. Stop if the task invites rumination,
    forced confession or unsafe disclosure.
  expected_burden: About 15 minutes of preparation, one natural opportunity, and a brief private review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Defenses and self-deception protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Defenses and self-deception action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an impersonal
    scheduling task and private shorthand. Rehearse the supplied draft-message case if no real cue occurs,
    labeling it rehearsal. Stop if the task invites rumination, forced confession or unsafe disclosure.
  actions:
  - stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01-A1
    sequence: 1
    title: Compare the explanation with the sequence of actions
    instructions: 'Write the task, what you did instead, and the explanation you gave yourself. Ask what
      facts support it and what facts it leaves out. In the message case, distinguishing an unclear request
      from fear of an imperfect reply prevents both unfair self-blame and an automatic excuse. Offer two
      possible explanations rather than claiming to know a hidden motive.


      Observation checks: Actions and explanation are recorded separately; Supporting and omitted facts
      are considered; Two plausible explanations remain distinguishable. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01
      action_stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01-A1
      competency_stable_id: '05.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0505_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0505_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - actions_and_explanation_are_recorded_separately
        - supporting_and_omitted_facts_are_considered
        - two_plausible_explanations_remain_distinguishable
      - measurement_id: c0505_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0505_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01-A2
    sequence: 2
    title: Use an honest sentence at the next cue
    instructions: 'Choose a visible cue, such as opening the draft for another unnecessary rewrite. At
      the next natural occurrence, pause and state the narrower truth privately: I have enough information
      for a short reply, but I am reluctant to send it. Then send a reasonable reply, ask one necessary
      question, or state an actual capacity limit. Do not manufacture a conflict to obtain evidence.


      Observation checks: A natural cue is noticed during an attempt; A narrower honest statement replaces
      the first explanation; A proportionate response is taken. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01
      action_stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01-A2
      competency_stable_id: '05.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0505_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0505_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_natural_cue_is_noticed_during_an_attempt
        - a_narrower_honest_statement_replaces_the_first_explanation
        - a_proportionate_response_is_taken
      - measurement_id: c0505_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0505_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01-A3
    sequence: 3
    title: Review the response without creating a new excuse
    instructions: 'Record what happened after your response and whether the original explanation still
      fits. If someone was affected, consider a brief correction or repair within your responsibility;
      do not demand reassurance. Identify the next early cue and one condition under which pausing or
      declining would be reasonable rather than avoidance.


      Observation checks: The response has an observed consequence; Responsibility is considered without
      demanding reassurance; Legitimate limits are distinguished from the repeated excuse. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What became more honest at the cue, and how can you keep both accountability and legitimate
      limits?


      Examples: Supportive: The writer noticed a fourth cosmetic edit, sent a concise accurate reply,
      and retained a genuine boundary on additional work.


      Mixed: An excuse was noticed only afterward; the next cue is clearer but the real-time alternative
      remains untested.


      Contradictory: Every reluctance was labeled cowardice or another person''s criticism was treated
      as certain knowledge of hidden motives.


      Inconclusive: A defense was named in general without an observable moment or different response.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01
      action_stable_id: PRACTICE-COMP-0505-DEFENSES-AND-SELF-DECEPTION-01-A3
      competency_stable_id: '05.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
