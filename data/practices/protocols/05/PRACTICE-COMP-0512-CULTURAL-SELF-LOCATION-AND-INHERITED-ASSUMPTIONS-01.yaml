meaning_and_fit:
  purpose: Identify an assumption that feels natural through familiarity, compare a different situated
    account and choose a reasoned present stance.
  why_recommended: Identify an assumption that feels natural through familiarity, compare a different
    situated account and choose a reasoned present stance.
  claims:
  - statement: Identify an assumption that feels natural through familiarity, compare a different situated
      account and choose a reasoned present stance.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Cultural self-location and inherited assumptions practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cultural self-location and inherited assumptions as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use a public first-person written or audio account and avoid naming people.
    If none is accessible, compare the two supplied guest rules as fictional cases and label the cultural
    comparison unverified. No travel, religious change or disclosure of family conflict is required.
  opportunity_considerations: Use the default norm that a guest should immediately decline an offer before
    accepting it, or choose a familiar norm about privacy, authority, emotion or success. Find a voluntary
    first-person account or public source describing a different practice; retain its context privately.
  prerequisites:
  - Use the default norm that a guest should immediately decline an offer before accepting it, or choose
    a familiar norm about privacy, authority, emotion or success. Find a voluntary first-person account
    or public source describing a different practice; retain its context privately.
  dependencies: []
  safe_alternatives:
  - Use a public first-person written or audio account and avoid naming people. If none is accessible,
    compare the two supplied guest rules as fictional cases and label the cultural comparison unverified.
    No travel, religious change or disclosure of family conflict is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cultural self-location and inherited assumptions differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cultural self-location and
    inherited assumptions as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default norm that a guest should immediately decline an offer before accepting it, or
    choose a familiar norm about privacy, authority, emotion or success. Find a voluntary first-person
    account or public source describing a different practice; retain its context privately. Goal: Identify
    an assumption that feels natural through familiarity, compare a different situated account and choose
    a reasoned present stance. Scope: One comparison examines a particular norm, not a whole culture.
    People disagree within cultures, and neither unfamiliarity nor tradition automatically makes a practice
    better. Time and effort: About 30 minutes of reflection and comparison, plus one small low-stakes
    application. Adaptation: Use a public first-person written or audio account and avoid naming people.
    If none is accessible, compare the two supplied guest rules as fictional cases and label the cultural
    comparison unverified. No travel, religious change or disclosure of family conflict is required. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a public first-person written or audio account and avoid naming people. If
    none is accessible, compare the two supplied guest rules as fictional cases and label the cultural
    comparison unverified. No travel, religious change or disclosure of family conflict is required.
  expected_burden: About 30 minutes of reflection and comparison, plus one small low-stakes application.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cultural self-location and inherited assumptions protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Cultural self-location and inherited assumptions action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a public
    first-person written or audio account and avoid naming people. If none is accessible, compare the
    two supplied guest rules as fictional cases and label the cultural comparison unverified. No travel,
    religious change or disclosure of family conflict is required.
  actions:
  - stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01-A1
    sequence: 1
    title: Make the familiar rule visible
    instructions: 'State the rule as a behavior and expectation, not everyone knows. Record where you
      learned it, what good it protects, how it is enforced, and someone within your own setting who follows
      it differently. In the guest case, polite refusal may signal restraint but may also leave a host
      uncertain about a real preference.


      Observation checks: A familiar assumption becomes an explicit behavioral rule; Its origin and protected
      good are considered; Variation within the familiar setting is acknowledged. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01
      action_stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01-A1
      competency_stable_id: '05.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0512_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0512_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_familiar_assumption_becomes_an_explicit_behavioral_rule
        - its_origin_and_protected_good_are_considered
        - variation_within_the_familiar_setting_is_acknowledged
      - measurement_id: c0512_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0512_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01-A2
    sequence: 2
    title: Understand a different rule on its own terms
    instructions: 'Read or listen to the selected account. Note who is describing which setting, what
      behavior they consider appropriate, and why. Separate their actual description from your interpretation.
      Compare one real difference and one shared concern, and identify what the account cannot tell you
      about other people in that culture. Do not request intimate cultural explanations from an unwilling
      person.


      Observation checks: The comparison account has a specific perspective and setting; A real difference
      and shared concern are explained; Limits on cultural generalization are explicit. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01
      action_stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01-A2
      competency_stable_id: '05.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0512_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0512_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_comparison_account_has_a_specific_perspective_and_setting
        - a_real_difference_and_shared_concern_are_explained
        - limits_on_cultural_generalization_are_explicit
      - measurement_id: c0512_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0512_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01-A3
    sequence: 3
    title: Choose and try a context-sensitive response
    instructions: 'Retain, revise or hold the original norm provisionally, giving a reason. Try one respectful
      clarification in an ordinary context, such as saying I would enjoy some, thank you instead of expecting
      a host to decode repeated refusal. Notice the response and revise your assumption if needed; ask
      preferences rather than assigning a rule based on identity.


      Observation checks: The norm has a reasoned present disposition; A clarification receives an ordinary
      attempt; The response is reviewed without assigning identity-based preferences. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which assumption stopped being invisible, and what can you now ask instead of treating
      familiarity as universality?


      Examples: Supportive: The participant understood two meanings of polite refusal, asked a host''s
      preference, and retained uncertainty about wider cultural norms.


      Mixed: The account clarified a difference, but the participant has not yet tried a respectful clarification.


      Contradictory: The comparison ranked entire cultures or assumed someone''s preferred behavior from
      their identity.


      Inconclusive: An unfamiliar custom was collected as trivia without examining a personal norm or
      its application.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01
      action_stable_id: PRACTICE-COMP-0512-CULTURAL-SELF-LOCATION-AND-INHERITED-ASSUMPTIONS-01-A3
      competency_stable_id: '05.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
