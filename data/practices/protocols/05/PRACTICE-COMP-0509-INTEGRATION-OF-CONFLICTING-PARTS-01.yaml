meaning_and_fit:
  purpose: Recognize the legitimate concern on both sides of an internal tension and try a practical arrangement
    that does not silence either side.
  why_recommended: Recognize the legitimate concern on both sides of an internal tension and try a practical
    arrangement that does not silence either side.
  claims:
  - statement: Recognize the legitimate concern on both sides of an internal tension and try a practical
      arrangement that does not silence either side.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Integration of conflicting parts practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Integration of conflicting parts as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use two objects or spoken sentences instead of columns. A solo arrangement
    can combine independent choice with reading or listening to a community contribution. A fictional
    trial is design rehearsal, not evidence of an integrated routine.
  opportunity_considerations: Use the default tension between doing a hobby independently and wanting
    companionship. Alternatively choose a manageable conflict such as ambition and rest. Draw two columns
    named for the concerns rather than good self and bad self.
  prerequisites:
  - Use the default tension between doing a hobby independently and wanting companionship. Alternatively
    choose a manageable conflict such as ambition and rest. Draw two columns named for the concerns rather
    than good self and bad self.
  dependencies: []
  safe_alternatives:
  - Use two objects or spoken sentences instead of columns. A solo arrangement can combine independent
    choice with reading or listening to a community contribution. A fictional trial is design rehearsal,
    not evidence of an integrated routine.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Integration of conflicting parts differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Integration of conflicting
    parts as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default tension between doing a hobby independently and wanting companionship. Alternatively
    choose a manageable conflict such as ambition and rest. Draw two columns named for the concerns rather
    than good self and bad self. Goal: Recognize the legitimate concern on both sides of an internal tension
    and try a practical arrangement that does not silence either side. Scope: Parts means competing concerns
    in ordinary language, not a clinical model or separate identities. One arrangement explores one tension;
    some values cannot be fully satisfied together. Time and effort: About 20 minutes to design an arrangement,
    one ordinary trial, and a 10-minute review. Adaptation: Use two objects or spoken sentences instead
    of columns. A solo arrangement can combine independent choice with reading or listening to a community
    contribution. A fictional trial is design rehearsal, not evidence of an integrated routine. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use two objects or spoken sentences instead of columns. A solo arrangement can
    combine independent choice with reading or listening to a community contribution. A fictional trial
    is design rehearsal, not evidence of an integrated routine.
  expected_burden: About 20 minutes to design an arrangement, one ordinary trial, and a 10-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Integration of conflicting parts protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Integration of conflicting parts action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use two objects
    or spoken sentences instead of columns. A solo arrangement can combine independent choice with reading
    or listening to a community contribution. A fictional trial is design rehearsal, not evidence of an
    integrated routine.
  actions:
  - stable_id: PRACTICE-COMP-0509-INTEGRATION-OF-CONFLICTING-PARTS-01-A1
    sequence: 1
    title: State each concern in its strongest fair form
    instructions: 'For each side, write what it protects, what it fears losing, and how it can become
      excessive. In the hobby case, independence protects choice but can become isolation; belonging protects
      connection but can become constant permission-seeking. Identify one legitimate need on each side
      and any non-negotiable practical limit.


      Observation checks: Both concerns have a legitimate need; Each concern has a possible excess; Practical
      limits are explicit. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0509-INTEGRATION-OF-CONFLICTING-PARTS-01
      action_stable_id: PRACTICE-COMP-0509-INTEGRATION-OF-CONFLICTING-PARTS-01-A1
      competency_stable_id: '05.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0509_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0509_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_concerns_have_a_legitimate_need
        - each_concern_has_a_possible_excess
        - practical_limits_are_explicit
      - measurement_id: c0509_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0509_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0509-INTEGRATION-OF-CONFLICTING-PARTS-01-A2
    sequence: 2
    title: Build a trial with room for both
    instructions: 'Design a small arrangement with separate observable room for each need. For example,
      choose the project privately, then invite a willing friend for one agreed session with an easy refusal.
      State what is being sacrificed, how much time is available, and when you will stop or revise the
      trial. Do not make another person responsible for resolving the tension.


      Observation checks: The arrangement gives each need a concrete place; A real tradeoff is acknowledged;
      Consent and a revision point are included. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0509-INTEGRATION-OF-CONFLICTING-PARTS-01
      action_stable_id: PRACTICE-COMP-0509-INTEGRATION-OF-CONFLICTING-PARTS-01-A2
      competency_stable_id: '05.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0509_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0509_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_arrangement_gives_each_need_a_concrete_place
        - a_real_tradeoff_is_acknowledged
        - consent_and_a_revision_point_are_included
      - measurement_id: c0509_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0509_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0509-INTEGRATION-OF-CONFLICTING-PARTS-01-A3
    sequence: 3
    title: Try it and listen for the neglected side
    instructions: 'Carry out the arrangement once. Compare what each side actually received with what
      you intended, noting effort, resentment or a remaining unmet need without treating those feelings
      as proof. Change one part of the arrangement for a future attempt, or conclude that a clearer choice
      is needed rather than a compromise.


      Observation checks: The arrangement receives an actual trial; Both needs are reviewed against the
      experience; The next decision follows the unresolved tradeoff. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which concern was easy to dismiss, and what did the trial reveal about a fairer arrangement?


      Examples: Supportive: The participant chose a project independently and shared one welcomed session,
      then reduced the session length to preserve quiet work.


      Mixed: Both needs received time, but the transition cost made the arrangement difficult to repeat.


      Contradictory: One concern was labeled weak or another person was pressured into supplying belonging.


      Inconclusive: Both needs were named but no arrangement was tried or observed.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
