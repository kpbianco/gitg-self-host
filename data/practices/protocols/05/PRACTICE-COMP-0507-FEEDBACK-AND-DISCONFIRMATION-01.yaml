  - c0507_a3_adverse
  adverse_or_contradictory_indicators:
  - The giver was pressured to retract feedback, or a demeaning identity label was accepted as established
    fact.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Feedback and disconfirmation explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Feedback and disconfirmation context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Feedback and disconfirmation observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Feedback and disconfirmation rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Ask about an event rather than your worth. Observed checks: Feedback
    is voluntary and about one shared event; An observable example is requested; Intended effect is distinguished
    from reported impact. Action 2: Check understanding before judging the advice. Observed checks: The
    giver can correct the summary; Observation and interpretation are distinguished; Agreement and uncertainty
    are both permitted. Action 3: Test a small change against the reported effect. Observed checks: A
    change addresses the specific feedback; A comparable interaction contains an actual attempt; An observed
    result informs the next decision.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Advice was collected but no accurate summary or later
    behavioral attempt occurred.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Feedback
    and disconfirmation contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L05
  - L13
  - L15
  - L23
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Feedback and disconfirmation evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Ask about an event rather than your worth. Observed checks: Feedback is voluntary and about
    one shared event; An observable example is requested; Intended effect is distinguished from reported
    impact.'
  - 'Action 2: Check understanding before judging the advice. Observed checks: The giver can correct the
    summary; Observation and interpretation are distinguished; Agreement and uncertainty are both permitted.'
  - 'Action 3: Test a small change against the reported effect. Observed checks: A change addresses the
    specific feedback; A comparable interaction contains an actual attempt; An observed result informs
    the next decision.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0507_a1_primary
    - c0507_a2_primary
    - c0507_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: What did you learn about the gap between intention and impact, and which part
    still needs checking?
  transfer_limit: One person's observation supplies a perspective on one interaction. It is not an objective
    identity verdict, and accurately hearing feedback does not require accepting abuse or agreeing with
    every interpretation.
  reflection:
    before: 'What would count as doing this honestly? Goal: Compare intended and observed impact, represent
      another person''s feedback accurately and test a bounded change while retaining your judgment.'
    during: Which checks have actually been observed? The feedback was summarized accurately, but the
      next interaction differed too much to assess the change.
    after: What did you learn about the gap between intention and impact, and which part still needs checking?
  review_guidance:
    repeat: Repeat the same bounded Feedback and disconfirmation design only when the context and burden
      remain appropriate.
    adapt: Use an accessible written exchange. Without a safe willing person, use the supplied directions
      example to rehearse listening and revision; label it rehearsal and leave actual interpersonal feedback
      untested. Never solicit criticism from a coercive person for this exercise.
    stop: Stop Feedback and disconfirmation when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: The summary was corrected, the speaker led with the first step next time, and the listener
      could begin without another explanation.
    mixed: The feedback was summarized accurately, but the next interaction differed too much to assess
      the change.
    contradictory: The giver was pressured to retract feedback, or a demeaning identity label was accepted
      as established fact.
    inconclusive: Advice was collected but no accurate summary or later behavioral attempt occurred.
