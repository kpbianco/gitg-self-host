meaning_and_fit:
  purpose: Compare intended and observed impact, represent another person's feedback accurately and test
    a bounded change while retaining your judgment.
  why_recommended: Compare intended and observed impact, represent another person's feedback accurately
    and test a bounded change while retaining your judgment.
  claims:
  - statement: Compare intended and observed impact, represent another person's feedback accurately and
      test a bounded change while retaining your judgment.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: In this study, the relative accuracy of self and other personality judgments differed by
      the traits examined; neither perspective was uniformly best.
    classification: empirical_finding
    source_ids:
    - SRC-VAZIRE-SELF-OTHER-2010
    limitations: One study of 165 participants with friend and stranger ratings and behavioral criteria.
      It does not establish the truth of any individual feedback, validate this inventory or conversation
      exercise, or make another person's view authoritative.
  applicability_question: Does a voluntary, bounded Feedback and disconfirmation practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Feedback and disconfirmation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible written exchange. Without a safe willing person, use the
    supplied directions example to rehearse listening and revision; label it rehearsal and leave actual
    interpersonal feedback untested. Never solicit criticism from a coercive person for this exercise.
  opportunity_considerations: Choose a safe person who can disagree with you and one low-stakes shared
    event, such as explaining directions or coordinating a plan. Ask whether they are willing to give
    one concrete observation; a refusal ends the request.
  prerequisites:
  - Choose a safe person who can disagree with you and one low-stakes shared event, such as explaining
    directions or coordinating a plan. Ask whether they are willing to give one concrete observation;
    a refusal ends the request.
  dependencies: []
  safe_alternatives:
  - Use an accessible written exchange. Without a safe willing person, use the supplied directions example
    to rehearse listening and revision; label it rehearsal and leave actual interpersonal feedback untested.
    Never solicit criticism from a coercive person for this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Feedback and disconfirmation differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Feedback and disconfirmation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a safe person who can disagree with you and one low-stakes shared event, such as explaining
    directions or coordinating a plan. Ask whether they are willing to give one concrete observation;
    a refusal ends the request. Goal: Compare intended and observed impact, represent another person''s
    feedback accurately and test a bounded change while retaining your judgment. Scope: One person''s
    observation supplies a perspective on one interaction. It is not an objective identity verdict, and
    accurately hearing feedback does not require accepting abuse or agreeing with every interpretation.
    Time and effort: A voluntary 10-minute exchange, one later interaction, and a five-minute review.
    Adaptation: Use an accessible written exchange. Without a safe willing person, use the supplied directions
    example to rehearse listening and revision; label it rehearsal and leave actual interpersonal feedback
    untested. Never solicit criticism from a coercive person for this exercise. Keep personal working
    notes outside the check-in; record only the listed observations.


    Reference support:

    Who Knows What About a Person? The Self–Other Knowledge Asymmetry (SOKA) Model: https://www.simine.com/docs/Vazire_JPSP_2010.pdf'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible written exchange. Without a safe willing person, use the supplied
    directions example to rehearse listening and revision; label it rehearsal and leave actual interpersonal
    feedback untested. Never solicit criticism from a coercive person for this exercise.
  expected_burden: A voluntary 10-minute exchange, one later interaction, and a five-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Feedback and disconfirmation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Feedback and disconfirmation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    written exchange. Without a safe willing person, use the supplied directions example to rehearse listening
    and revision; label it rehearsal and leave actual interpersonal feedback untested. Never solicit criticism
    from a coercive person for this exercise.
  actions:
  - stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01-A1
    sequence: 1
    title: Ask about an event rather than your worth
    instructions: 'State the event and ask: what did I do that helped, and what made the task harder?
      Request an example rather than a trait label. Before asking, note your intention privately. Listen
      to the described behavior and effect without preparing a defense; do not record or upload the person''s
      words or identity.


      Observation checks: Feedback is voluntary and about one shared event; An observable example is requested;
      Intended effect is distinguished from reported impact. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01
      action_stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01-A1
      competency_stable_id: '05.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0507_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0507_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - feedback_is_voluntary_and_about_one_shared_event
        - an_observable_example_is_requested
        - intended_effect_is_distinguished_from_reported_impact
      - measurement_id: c0507_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0507_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01-A2
    sequence: 2
    title: Check understanding before judging the advice
    instructions: 'Summarize what you heard in your own words and ask whether the summary is accurate.
      Example: my directions were detailed, but you could not tell which step came first. Separate the
      observation from an inferred motive or proposed solution. Identify what you accept, question or
      need to check, without requiring the person to reassure you.


      Observation checks: The giver can correct the summary; Observation and interpretation are distinguished;
      Agreement and uncertainty are both permitted. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01
      action_stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01-A2
      competency_stable_id: '05.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0507_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0507_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_giver_can_correct_the_summary
        - observation_and_interpretation_are_distinguished
        - agreement_and_uncertainty_are_both_permitted
      - measurement_id: c0507_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0507_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01-A3
    sequence: 3
    title: Test a small change against the reported effect
    instructions: 'Choose one change responsive to the example, such as leading with the first step before
      adding detail. Try it in a comparable ordinary interaction. Check an observable result, and ask
      for brief follow-up only if welcomed. Retain, revise or reject the change with a reason; missing
      follow-up is not evidence of success.


      Observation checks: A change addresses the specific feedback; A comparable interaction contains
      an actual attempt; An observed result informs the next decision. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What did you learn about the gap between intention and impact, and which part still
      needs checking?


      Examples: Supportive: The summary was corrected, the speaker led with the first step next time,
      and the listener could begin without another explanation.


      Mixed: The feedback was summarized accurately, but the next interaction differed too much to assess
      the change.


      Contradictory: The giver was pressured to retract feedback, or a demeaning identity label was accepted
      as established fact.


      Inconclusive: Advice was collected but no accurate summary or later behavioral attempt occurred.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01
      action_stable_id: PRACTICE-COMP-0507-FEEDBACK-AND-DISCONFIRMATION-01-A3
      competency_stable_id: '05.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0507_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0507_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_change_addresses_the_specific_feedback
        - a_comparable_interaction_contains_an_actual_attempt
        - an_observed_result_informs_the_next_decision
      - measurement_id: c0507_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0507_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Feedback and disconfirmation; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use an accessible written exchange. Without a safe willing person, use the supplied directions example
      to rehearse listening and revision; label it rehearsal and leave actual interpersonal feedback untested.
      Never solicit criticism from a coercive person for this exercise.
    cultural_context:
    - Adapt the expression of Feedback and disconfirmation to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use an accessible written exchange. Without a safe willing person, use the supplied directions example
      to rehearse listening and revision; label it rehearsal and leave actual interpersonal feedback untested.
      Never solicit criticism from a coercive person for this exercise.
  pause_conditions:
  - Pause Feedback and disconfirmation when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Feedback and disconfirmation practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Feedback and disconfirmation situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Feedback and disconfirmation actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
