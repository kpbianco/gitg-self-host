  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Humility and proportionate self-regard; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a private collaborative task or a consented written exchange. If no safe partner is available,
      rehearse with a supplied correction such as this label is unclear; live help and feedback then remain
      untested. No deference to mistreatment is required.
    cultural_context:
    - Adapt the expression of Humility and proportionate self-regard to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a private collaborative task or a consented written exchange. If no safe partner is available,
      rehearse with a supplied correction such as this label is unclear; live help and feedback then remain
      untested. No deference to mistreatment is required.
  pause_conditions:
  - Pause Humility and proportionate self-regard when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Humility and proportionate self-regard practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Humility and proportionate self-regard situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
