  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Humility and proportionate self-regard explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Humility and proportionate self-regard
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Humility and proportionate self-regard observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Humility and proportionate self-regard rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Account for your part without claiming the whole result. Observed checks:
    Your contribution is stated accurately; Dependencies and a limit remain visible; Praise and correction
    responses are explicitly rehearsed. Action 2: Receive correction or useful help in a real task. Observed
    checks: A real exchange concerns useful help or a concrete check; Your response preserves both judgment
    and acknowledgment; One practical consequence of the exchange is observed. Action 3: Do useful work
    without using recognition as the verdict. Observed checks: A bounded contribution is completed; Recognition
    and actual value are distinguished; Both fair self-credit and dependence appear in the review.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A modest-sounding statement was rehearsed but neither
    a real exchange nor a contribution occurred.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Humility
    and proportionate self-regard contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
