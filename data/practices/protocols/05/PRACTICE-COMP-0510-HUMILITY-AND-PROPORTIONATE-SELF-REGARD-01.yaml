meaning_and_fit:
  purpose: Acknowledge your contribution and dependence while responding to correction, help, praise and
    a lack of recognition without inflation or self-erasure.
  why_recommended: Acknowledge your contribution and dependence while responding to correction, help,
    praise and a lack of recognition without inflation or self-erasure.
  claims:
  - statement: Acknowledge your contribution and dependence while responding to correction, help, praise
      and a lack of recognition without inflation or self-erasure.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Humility and proportionate self-regard practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Humility and proportionate self-regard as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a private collaborative task or a consented written exchange. If no safe
    partner is available, rehearse with a supplied correction such as this label is unclear; live help
    and feedback then remain untested. No deference to mistreatment is required.
  opportunity_considerations: 'Choose a shared household, study, hobby or volunteer task. Use a private
    note with three headings: my contribution, other contributions, and limits. No status loss, humiliation
    or public confession is required.'
  prerequisites:
  - 'Choose a shared household, study, hobby or volunteer task. Use a private note with three headings:
    my contribution, other contributions, and limits. No status loss, humiliation or public confession
    is required.'
  dependencies: []
  safe_alternatives:
  - Use a private collaborative task or a consented written exchange. If no safe partner is available,
    rehearse with a supplied correction such as this label is unclear; live help and feedback then remain
    untested. No deference to mistreatment is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Humility and proportionate self-regard differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Humility and proportionate
    self-regard as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a shared household, study, hobby or volunteer task. Use a private note with three headings:
    my contribution, other contributions, and limits. No status loss, humiliation or public confession
    is required. Goal: Acknowledge your contribution and dependence while responding to correction, help,
    praise and a lack of recognition without inflation or self-erasure. Scope: A small set of exchanges
    practices proportion, not a humility score. Rehearsed responses remain distinct from live responses,
    and obscurity is not inherently virtuous. Time and effort: About 15 minutes of preparation, two brief
    ordinary occasions, and a 10-minute review. Adaptation: Use a private collaborative task or a consented
    written exchange. If no safe partner is available, rehearse with a supplied correction such as this
    label is unclear; live help and feedback then remain untested. No deference to mistreatment is required.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a private collaborative task or a consented written exchange. If no safe partner
    is available, rehearse with a supplied correction such as this label is unclear; live help and feedback
    then remain untested. No deference to mistreatment is required.
  expected_burden: About 15 minutes of preparation, two brief ordinary occasions, and a 10-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Humility and proportionate self-regard protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Humility and proportionate self-regard action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a private
    collaborative task or a consented written exchange. If no safe partner is available, rehearse with
    a supplied correction such as this label is unclear; live help and feedback then remain untested.
    No deference to mistreatment is required.
  actions:
  - stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01-A1
    sequence: 1
    title: Account for your part without claiming the whole result
    instructions: 'Describe what you actually contributed, one limit or mistake, and help, tools or circumstances
      that mattered. Practice saying thank you, I did spend time on that when praised, without exaggerating
      or erasing your work. Also practice acknowledging one specific correction without appending a defense.
      Mark these sentences as rehearsal.


      Observation checks: Your contribution is stated accurately; Dependencies and a limit remain visible;
      Praise and correction responses are explicitly rehearsed. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01
      action_stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01-A1
      competency_stable_id: '05.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0510_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0510_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - your_contribution_is_stated_accurately
        - dependencies_and_a_limit_remain_visible
        - praise_and_correction_responses_are_explicitly_rehearsed
      - measurement_id: c0510_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0510_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01-A2
    sequence: 2
    title: Receive correction or useful help in a real task
    instructions: 'At a safe ordinary opportunity, ask for a concrete check or accept a welcomed offer
      of help. Clarify what is useful, act on one sound correction or use the help, and acknowledge the
      contribution. You may question an inaccurate correction or refuse unsuitable help politely; agreement
      is not the objective.


      Observation checks: A real exchange concerns useful help or a concrete check; Your response preserves
      both judgment and acknowledgment; One practical consequence of the exchange is observed. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01
      action_stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01-A2
      competency_stable_id: '05.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0510_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0510_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_real_exchange_concerns_useful_help_or_a_concrete_check
        - your_response_preserves_both_judgment_and_acknowledgment
        - one_practical_consequence_of_the_exchange_is_observed
      - measurement_id: c0510_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0510_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01-A3
    sequence: 3
    title: Do useful work without using recognition as the verdict
    instructions: 'Complete one modest appropriate contribution whether or not anyone notices. Record
      its actual value and cost, then review how you responded to any praise, silence or correction. Do
      not conceal work needed for fair credit or tolerate exploitation. Name one place where you can claim
      your part plainly and one where you can recognize dependence.


      Observation checks: A bounded contribution is completed; Recognition and actual value are distinguished;
      Both fair self-credit and dependence appear in the review. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Where did you inflate or erase your part, and what would a proportionate response
      sound like next time?


      Examples: Supportive: The participant credited their preparation, used a helpful correction, and
      recognized a colleague''s contribution without denying their own.


      Mixed: Help was used, but disappointment about missing praise remained and was acknowledged.


      Contradictory: Humility became accepting humiliation, hiding deserved credit or making others reassure
      the participant.


      Inconclusive: A modest-sounding statement was rehearsed but neither a real exchange nor a contribution
      occurred.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01
      action_stable_id: PRACTICE-COMP-0510-HUMILITY-AND-PROPORTIONATE-SELF-REGARD-01-A3
      competency_stable_id: '05.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
