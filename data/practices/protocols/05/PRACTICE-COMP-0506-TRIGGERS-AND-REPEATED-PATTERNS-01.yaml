meaning_and_fit:
  purpose: Trace a recurring everyday reaction from situation through early cue to consequence, then test
    one feasible alternative before the usual pattern completes.
  why_recommended: Trace a recurring everyday reaction from situation through early cue to consequence,
    then test one feasible alternative before the usual pattern completes.
  claims:
  - statement: Trace a recurring everyday reaction from situation through early cue to consequence, then
      test one feasible alternative before the usual pattern completes.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Triggers and repeated patterns practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Triggers and repeated patterns as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use words, icons or a trusted person's voluntary practical help. No breath
    control, bodily monitoring or eye closing is required. If the reaction is overwhelming, stop the exercise
    and seek support appropriate to the situation; repeating distress is not progress.
  opportunity_considerations: Use a manageable annoyance such as agreeing too quickly to a minor request
    or withdrawing when a plan changes. Avoid frightening, traumatic, abusive or overwhelming situations;
    choose a neutral fictional scheduling example instead.
  prerequisites:
  - Use a manageable annoyance such as agreeing too quickly to a minor request or withdrawing when a plan
    changes. Avoid frightening, traumatic, abusive or overwhelming situations; choose a neutral fictional
    scheduling example instead.
  dependencies: []
  safe_alternatives:
  - Use words, icons or a trusted person's voluntary practical help. No breath control, bodily monitoring
    or eye closing is required. If the reaction is overwhelming, stop the exercise and seek support appropriate
    to the situation; repeating distress is not progress.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Triggers and repeated patterns differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Triggers and repeated patterns
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a manageable annoyance such as agreeing too quickly to a minor request or withdrawing when
    a plan changes. Avoid frightening, traumatic, abusive or overwhelming situations; choose a neutral
    fictional scheduling example instead. Goal: Trace a recurring everyday reaction from situation through
    early cue to consequence, then test one feasible alternative before the usual pattern completes. Scope:
    This is a small observation of an ordinary habit, not trauma processing, exposure therapy or an explanation
    of a mental health condition. A pattern map is a hypothesis about these occasions. Time and effort:
    About 15 minutes to compare two past occasions, one naturally occurring opportunity, and a five-minute
    review. Adaptation: Use words, icons or a trusted person''s voluntary practical help. No breath control,
    bodily monitoring or eye closing is required. If the reaction is overwhelming, stop the exercise and
    seek support appropriate to the situation; repeating distress is not progress. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use words, icons or a trusted person's voluntary practical help. No breath control,
    bodily monitoring or eye closing is required. If the reaction is overwhelming, stop the exercise and
    seek support appropriate to the situation; repeating distress is not progress.
  expected_burden: About 15 minutes to compare two past occasions, one naturally occurring opportunity,
    and a five-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Triggers and repeated patterns protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Triggers and repeated patterns action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use words,
    icons or a trusted person's voluntary practical help. No breath control, bodily monitoring or eye
    closing is required. If the reaction is overwhelming, stop the exercise and seek support appropriate
    to the situation; repeating distress is not progress.
  actions:
  - stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01-A1
    sequence: 1
    title: Locate the earliest observable link
    instructions: 'For two ordinary occasions, record the situation, earliest noticed thought or bodily
      cue, action, immediate result and later cost. Include a non-triggering exception if available. For
      a rushed request, the cue might be typing yes before checking the calendar. Keep uncertain sensations
      or motives marked uncertain.


      Observation checks: Two occasions include cue action and consequences; An exception or lack of one
      is recorded; The earliest usable cue is identified. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01
      action_stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01-A1
      competency_stable_id: '05.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0506_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0506_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_occasions_include_cue_action_and_consequences
        - an_exception_or_lack_of_one_is_recorded
        - the_earliest_usable_cue_is_identified
      - measurement_id: c0506_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0506_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01-A2
    sequence: 2
    title: Prepare and try a smaller alternative
    instructions: 'At that cue, use one concrete alternative: check availability before replying, ask
      for the request in writing, or say I will answer after checking. Rehearse the sentence once, then
      try it only at a naturally occurring safe opportunity. Record whether the cue was noticed in time
      and what you actually did; do not deliberately provoke the reaction.


      Observation checks: An alternative is rehearsed in concrete terms; A safe natural opportunity is
      attempted or remains unavailable; Timing and actual response are recorded. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01
      action_stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01-A2
      competency_stable_id: '05.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0506_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0506_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_alternative_is_rehearsed_in_concrete_terms
        - a_safe_natural_opportunity_is_attempted_or_remains_unavailable
        - timing_and_actual_response_are_recorded
      - measurement_id: c0506_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0506_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01-A3
    sequence: 3
    title: Revise the map using what happened
    instructions: 'Compare the alternative''s immediate and later results with the earlier occasions.
      Keep, simplify or replace the response, and name a resource or condition that made it easier or
      harder. If the cue was missed, move the reminder earlier; if no opportunity occurred, retain an
      untested plan rather than claiming a successful change.


      Observation checks: Immediate and later consequences are compared; A response revision follows the
      observation; Untested or missed opportunities remain explicit. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which earlier cue gives you a usable choice, and what remains uncertain about the
      pattern?


      Examples: Supportive: The person checked a calendar before accepting a request and observed less
      last-minute rescheduling on that occasion.


      Mixed: The pause occurred after agreement; the person renegotiated honestly but has not yet tested
      an earlier pause.


      Contradictory: A distressing situation was deliberately recreated or the map was used to blame someone
      for an involuntary response.


      Inconclusive: Only an emotion name was recorded, without a situation, sequence or attempted alternative.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01
      action_stable_id: PRACTICE-COMP-0506-TRIGGERS-AND-REPEATED-PATTERNS-01-A3
      competency_stable_id: '05.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
