    accessibility:
    - Use words, icons or a trusted person's voluntary practical help. No breath control, bodily monitoring
      or eye closing is required. If the reaction is overwhelming, stop the exercise and seek support
      appropriate to the situation; repeating distress is not progress.
    cultural_context:
    - Adapt the expression of Triggers and repeated patterns to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use words, icons or a trusted person's voluntary practical help. No breath control, bodily monitoring
      or eye closing is required. If the reaction is overwhelming, stop the exercise and seek support
      appropriate to the situation; repeating distress is not progress.
  pause_conditions:
