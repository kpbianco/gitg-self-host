  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Embodied and socially situated identity explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Embodied and socially situated identity
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Embodied and socially situated identity observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Embodied and socially situated identity rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Trace where conditions change the experience. Observed checks: The process
    has concrete steps; Personal choices and external conditions are distinguished; Observed barriers
    and unknowns are labeled separately. Action 2: Compare a changed condition without impersonating a
    group. Observed checks: One changed condition has a concrete consequence; Available information and
    assumptions are separated; The comparison avoids claims about an entire group. Action 3: Act where
    you have agency and name the remaining barrier. Observed checks: A feasible response is actually tried;
    The result and remaining barrier are recorded; The account preserves agency support and structural
