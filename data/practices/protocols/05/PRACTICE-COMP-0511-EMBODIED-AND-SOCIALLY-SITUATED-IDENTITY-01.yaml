meaning_and_fit:
  purpose: Explain how access, embodiment, social position and institutions shape a concrete experience
    while identifying real agency without blaming or reducing a person to a category.
  why_recommended: Explain how access, embodiment, social position and institutions shape a concrete experience
    while identifying real agency without blaming or reducing a person to a category.
  claims:
  - statement: Explain how access, embodiment, social position and institutions shape a concrete experience
      while identifying real agency without blaming or reducing a person to a category.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Embodied and socially situated identity practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Embodied and socially situated identity as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a familiar process from home, public information, dictation or voluntary
    assistance. No travel, demographic disclosure, discriminatory encounter or test of physical endurance
    is needed. A wholly fictional case demonstrates analysis only.
  opportunity_considerations: Choose an ordinary process you know, such as reaching a library, joining
    a free event or using a public form. Use a private sketch. Consider time, body and access needs, language,
    cost, transport, rules and social expectations; unknown is acceptable.
  prerequisites:
  - Choose an ordinary process you know, such as reaching a library, joining a free event or using a public
    form. Use a private sketch. Consider time, body and access needs, language, cost, transport, rules
    and social expectations; unknown is acceptable.
  dependencies: []
  safe_alternatives:
  - Use a familiar process from home, public information, dictation or voluntary assistance. No travel,
    demographic disclosure, discriminatory encounter or test of physical endurance is needed. A wholly
    fictional case demonstrates analysis only.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Embodied and socially situated identity differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Embodied and socially situated
    identity as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary process you know, such as reaching a library, joining a free event or using
    a public form. Use a private sketch. Consider time, body and access needs, language, cost, transport,
    rules and social expectations; unknown is acceptable. Goal: Explain how access, embodiment, social
    position and institutions shape a concrete experience while identifying real agency without blaming
    or reducing a person to a category. Scope: One route or process offers a situated example. It does
    not establish what every member of a group experiences or require disclosure of protected or sensitive
    identity information. Time and effort: About 25 minutes to trace a familiar process and one small
    accessible trial or information check. Adaptation: Use a familiar process from home, public information,
    dictation or voluntary assistance. No travel, demographic disclosure, discriminatory encounter or
    test of physical endurance is needed. A wholly fictional case demonstrates analysis only. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a familiar process from home, public information, dictation or voluntary assistance.
    No travel, demographic disclosure, discriminatory encounter or test of physical endurance is needed.
    A wholly fictional case demonstrates analysis only.
  expected_burden: About 25 minutes to trace a familiar process and one small accessible trial or information
    check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Embodied and socially situated identity protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Embodied and socially situated identity action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a familiar
    process from home, public information, dictation or voluntary assistance. No travel, demographic disclosure,
    discriminatory encounter or test of physical endurance is needed. A wholly fictional case demonstrates
    analysis only.
  actions:
  - stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01-A1
    sequence: 1
    title: Trace where conditions change the experience
    instructions: 'Walk through the process on paper from start to finish. At each step note a choice
      you can make and a condition you do not individually control. Consider whether age, disability,
      sex, race, class, culture or geography matters in this case without inferring anyone''s identity
      or inventing a barrier. Distinguish observed conditions from questions needing information.


      Observation checks: The process has concrete steps; Personal choices and external conditions are
      distinguished; Observed barriers and unknowns are labeled separately. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01
      action_stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01-A1
      competency_stable_id: '05.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0511_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0511_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_process_has_concrete_steps
        - personal_choices_and_external_conditions_are_distinguished
        - observed_barriers_and_unknowns_are_labeled_separately
      - measurement_id: c0511_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0511_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01-A2
    sequence: 2
    title: Compare a changed condition without impersonating a group
    instructions: 'Change one condition in the case: the bus does not run at that hour, instructions are
      unfamiliar, or the entrance requires stairs. Explain how the route changes and what remains possible.
      Use actual public access information where available, and do not simulate a disability or claim
      to know a group''s lived experience from this thought experiment.


      Observation checks: One changed condition has a concrete consequence; Available information and
      assumptions are separated; The comparison avoids claims about an entire group. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01
      action_stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01-A2
      competency_stable_id: '05.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0511_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0511_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_changed_condition_has_a_concrete_consequence
        - available_information_and_assumptions_are_separated
        - the_comparison_avoids_claims_about_an_entire_group
      - measurement_id: c0511_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0511_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01-A3
    sequence: 3
    title: Act where you have agency and name the remaining barrier
    instructions: 'Try one feasible response: check accessible opening information, request an alternate
      format, or choose a suitable route. Record the result and anything the individual choice could not
      resolve. Write a short account linking effort, support and structure; do not turn success into proof
      that everyone can overcome the same condition.


      Observation checks: A feasible response is actually tried; The result and remaining barrier are
      recorded; The account preserves agency support and structural limits. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which part was yours to choose, which depended on access or institutions, and what
      would improve the process beyond your individual workaround?


      Examples: Supportive: A later opening time made one library route possible, while the review retained
      the transport barrier for people on other schedules.


      Mixed: Public information suggested an accessible entrance, but actual access remained unverified.


      Contradictory: One successful workaround was used to blame others or a presumed identity was treated
      as the whole explanation.


      Inconclusive: Identity categories were listed without tracing a process or checking any condition.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01
      action_stable_id: PRACTICE-COMP-0511-EMBODIED-AND-SOCIALLY-SITUATED-IDENTITY-01-A3
      competency_stable_id: '05.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0511_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0511_a3_primary
        kind: artifact
