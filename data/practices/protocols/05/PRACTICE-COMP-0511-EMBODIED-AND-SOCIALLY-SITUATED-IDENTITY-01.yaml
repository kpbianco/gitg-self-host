        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Embodied and socially situated identity; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a familiar process from home, public information, dictation or voluntary assistance. No travel,
      demographic disclosure, discriminatory encounter or test of physical endurance is needed. A wholly
      fictional case demonstrates analysis only.
    cultural_context:
    - Adapt the expression of Embodied and socially situated identity to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a familiar process from home, public information, dictation or voluntary assistance. No travel,
      demographic disclosure, discriminatory encounter or test of physical endurance is needed. A wholly
      fictional case demonstrates analysis only.
  pause_conditions:
  - Pause Embodied and socially situated identity when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Embodied and socially situated identity practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Embodied and socially situated identity situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
