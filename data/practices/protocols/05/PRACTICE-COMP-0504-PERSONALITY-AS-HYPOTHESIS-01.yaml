meaning_and_fit:
  purpose: Turn a personality description into a revisable prediction, seek a counterexample and practice
    one capacity the label might otherwise discourage.
  why_recommended: Turn a personality description into a revisable prediction, seek a counterexample and
    practice one capacity the label might otherwise discourage.
  claims:
  - statement: Turn a personality description into a revisable prediction, seek a counterexample and practice
      one capacity the label might otherwise discourage.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Three experience-sampling studies found substantial within-person variation in Big Five
      related states alongside stable individual differences in their central tendencies.
    classification: empirical_finding
    source_ids:
    - SRC-FLEESON-STATES-2001
    limitations: Observational findings over two to three weeks do not establish causation, equal validity
      across personality models, or effectiveness of these product-authored trials. Two personal observations
      cannot validate a trait or instrument.
  applicability_question: Does a voluntary, bounded Personality as hypothesis practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Personality as hypothesis as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use writing instead of speech or a trusted person's consented role-play. Role-play
    tests rehearsal only. Do not reinterpret disability, access needs, distress or a clinician's advice
    as a personality obstacle to overcome.
  opportunity_considerations: Choose a label you already use, or the ordinary statement I prefer to prepare
    before speaking. No paid questionnaire is needed. Use low-stakes settings such as a familiar discussion
    and a short planning conversation.
  prerequisites:
  - Choose a label you already use, or the ordinary statement I prefer to prepare before speaking. No
    paid questionnaire is needed. Use low-stakes settings such as a familiar discussion and a short planning
    conversation.
  dependencies: []
  safe_alternatives:
  - Use writing instead of speech or a trusted person's consented role-play. Role-play tests rehearsal
    only. Do not reinterpret disability, access needs, distress or a clinician's advice as a personality
    obstacle to overcome.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Personality as hypothesis differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Personality as hypothesis
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a label you already use, or the ordinary statement I prefer to prepare before speaking.
    No paid questionnaire is needed. Use low-stakes settings such as a familiar discussion and a short
    planning conversation. Goal: Turn a personality description into a revisable prediction, seek a counterexample
    and practice one capacity the label might otherwise discourage. Scope: This tests one practical prediction,
    not the validity of a personality instrument. Different models are not interchangeable; no type, attachment
    label or trait score establishes destiny or diagnosis. Time and effort: About 15 minutes of preparation,
    two ordinary opportunities, and a 10-minute comparison. Adaptation: Use writing instead of speech
    or a trusted person''s consented role-play. Role-play tests rehearsal only. Do not reinterpret disability,
    access needs, distress or a clinician''s advice as a personality obstacle to overcome. Keep personal
    working notes outside the check-in; record only the listed observations.


    Reference support:

    Toward a Structure- and Process-Integrated View of Personality: Traits as Density Distributions of
    States: https://simine.com/407/readings/Fleeson_2001.pdf'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing instead of speech or a trusted person's consented role-play. Role-play
    tests rehearsal only. Do not reinterpret disability, access needs, distress or a clinician's advice
    as a personality obstacle to overcome.
  expected_burden: About 15 minutes of preparation, two ordinary opportunities, and a 10-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Personality as hypothesis protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Personality as hypothesis action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing
    instead of speech or a trusted person's consented role-play. Role-play tests rehearsal only. Do not
    reinterpret disability, access needs, distress or a clinician's advice as a personality obstacle to
    overcome.
  actions:
  - stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01-A1
    sequence: 1
    title: Make the label risk being wrong
    instructions: 'Translate the label into a specific prediction and name the context: without notes
      I expect to struggle to make one useful contribution. Write what an observer could notice and what
      would contradict the prediction. Distinguish a preference, a learned skill, and a constraint; the
      label alone cannot decide which explains the behavior.


      Observation checks: A label becomes a context-specific prediction; An observable counterexample
      is stated; Preference skill and constraint are distinguished. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01
      action_stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01-A1
      competency_stable_id: '05.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0504_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0504_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_label_becomes_a_context_specific_prediction
        - an_observable_counterexample_is_stated
        - preference_skill_and_constraint_are_distinguished
      - measurement_id: c0504_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0504_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01-A2
    sequence: 2
    title: Observe a usual and a contrasting opportunity
    instructions: 'Use two safe everyday opportunities with different demands. In each, record whether
      the predicted behavior occurred, what preparation or support was available, and one exception. Do
      not manipulate others or force unwanted social exposure. If the opportunities do not differ meaningfully,
      say that the contrast remains untested.


      Observation checks: Two opportunities are described with their conditions; Predicted behavior and
      exceptions are recorded; Limits of the comparison are explicit. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01
      action_stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01-A2
      competency_stable_id: '05.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0504_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0504_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_opportunities_are_described_with_their_conditions
        - predicted_behavior_and_exceptions_are_recorded
        - limits_of_the_comparison_are_explicit
      - measurement_id: c0504_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0504_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01-A3
    sequence: 3
    title: Practice a capacity outside the label
    instructions: 'Choose one modest opposite capacity suggested by the comparison. A habitual preparer
      might ask one unplanned clarifying question; an improviser might use three written points. Try it
      once, record usefulness and cost, and rewrite the label as a conditional description that includes
      what you can practice. An uncomfortable attempt need not be repeated.


      Observation checks: A contrasting capacity receives an actual attempt; Usefulness and cost are considered;
      The identity description becomes conditional. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Where did the label help you predict, where did it fail, and what option does the
      revised description leave open?


      Examples: Supportive: The preparer contributed a useful question without notes and changed always
      need preparation to prefer notes for unfamiliar presentations.


      Mixed: The label predicted one situation but noise and familiarity may explain the other.


      Contradictory: A type was used to excuse dismissing others or to require an inaccessible activity.


      Inconclusive: A quiz result was repeated without a prediction, comparison or attempted contrasting
      capacity.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01
      action_stable_id: PRACTICE-COMP-0504-PERSONALITY-AS-HYPOTHESIS-01-A3
      competency_stable_id: '05.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0504_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0504_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_contrasting_capacity_receives_an_actual_attempt
        - usefulness_and_cost_are_considered
        - the_identity_description_becomes_conditional
      - measurement_id: c0504_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0504_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Personality as hypothesis; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use writing instead of speech or a trusted person's consented role-play. Role-play tests rehearsal
      only. Do not reinterpret disability, access needs, distress or a clinician's advice as a personality
      obstacle to overcome.
    cultural_context:
    - Adapt the expression of Personality as hypothesis to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use writing instead of speech or a trusted person's consented role-play. Role-play tests rehearsal
      only. Do not reinterpret disability, access needs, distress or a clinician's advice as a personality
      obstacle to overcome.
  pause_conditions:
  - Pause Personality as hypothesis when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Personality as hypothesis practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Personality as hypothesis situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Personality as hypothesis actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0504_a1_primary
  - c0504_a1_boundary
  - c0504_a1_adverse
  - c0504_a2_primary
  - c0504_a2_boundary
  - c0504_a2_adverse
  - c0504_a3_primary
  - c0504_a3_boundary
  - c0504_a3_adverse
  adverse_or_contradictory_indicators:
  - A type was used to excuse dismissing others or to require an inaccessible activity.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Personality as hypothesis explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Personality as hypothesis context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Personality as hypothesis observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Personality as hypothesis rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Make the label risk being wrong. Observed checks: A label becomes a context-specific
    prediction; An observable counterexample is stated; Preference skill and constraint are distinguished.
    Action 2: Observe a usual and a contrasting opportunity. Observed checks: Two opportunities are described
    with their conditions; Predicted behavior and exceptions are recorded; Limits of the comparison are
    explicit. Action 3: Practice a capacity outside the label. Observed checks: A contrasting capacity
    receives an actual attempt; Usefulness and cost are considered; The identity description becomes conditional.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A quiz result was repeated without a prediction, comparison
    or attempted contrasting capacity.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Personality
    as hypothesis contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L05
  - L11
  - L13
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Personality as hypothesis evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Make the label risk being wrong. Observed checks: A label becomes a context-specific prediction;
    An observable counterexample is stated; Preference skill and constraint are distinguished.'
  - 'Action 2: Observe a usual and a contrasting opportunity. Observed checks: Two opportunities are described
    with their conditions; Predicted behavior and exceptions are recorded; Limits of the comparison are
    explicit.'
  - 'Action 3: Practice a capacity outside the label. Observed checks: A contrasting capacity receives
    an actual attempt; Usefulness and cost are considered; The identity description becomes conditional.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0504_a1_primary
    - c0504_a2_primary
    - c0504_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Where did the label help you predict, where did it fail, and what option does
    the revised description leave open?
  transfer_limit: This tests one practical prediction, not the validity of a personality instrument. Different
    models are not interchangeable; no type, attachment label or trait score establishes destiny or diagnosis.
  reflection:
    before: 'What would count as doing this honestly? Goal: Turn a personality description into a revisable
      prediction, seek a counterexample and practice one capacity the label might otherwise discourage.'
    during: Which checks have actually been observed? The label predicted one situation but noise and
      familiarity may explain the other.
    after: Where did the label help you predict, where did it fail, and what option does the revised description
      leave open?
  review_guidance:
    repeat: Repeat the same bounded Personality as hypothesis design only when the context and burden
      remain appropriate.
    adapt: Use writing instead of speech or a trusted person's consented role-play. Role-play tests rehearsal
      only. Do not reinterpret disability, access needs, distress or a clinician's advice as a personality
      obstacle to overcome.
    stop: Stop Personality as hypothesis when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: The preparer contributed a useful question without notes and changed always need preparation
      to prefer notes for unfamiliar presentations.
    mixed: The label predicted one situation but noise and familiarity may explain the other.
    contradictory: A type was used to excuse dismissing others or to require an inaccessible activity.
    inconclusive: A quiz result was repeated without a prediction, comparison or attempted contrasting
      capacity.
