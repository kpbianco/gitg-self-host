  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Self-worth beyond performance; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Speak the two headings privately or use a neutral fictional case. No affirmations, disclosure, forced
      positive feeling or comparison of human value is required. Stop if the topic becomes overwhelming
      and use support suited to your needs.
    cultural_context:
    - Adapt the expression of Self-worth beyond performance to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Speak the two headings privately or use a neutral fictional case. No affirmations, disclosure, forced
      positive feeling or comparison of human value is required. Stop if the topic becomes overwhelming
      and use support suited to your needs.
  pause_conditions:
  - Pause Self-worth beyond performance when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Self-worth beyond performance practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Self-worth beyond performance situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
