  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Self-worth beyond performance explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Self-worth beyond performance context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Self-worth beyond performance observation requires a distinct immutable origin;
