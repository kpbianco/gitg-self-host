    multipliers.
  recency_rule: Generated Self-worth beyond performance rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Keep the result smaller than the person. Observed checks: The outcome
    has a bounded factual description; A global judgment or its absence is identified; Consequences are
    separated from dignity. Action 2: Choose accountability and ordinary care together. Observed checks:
    The same standard can apply to another person; A proportionate responsible action is taken; An ordinary
    need is not made conditional on achievement. Action 3: Check what you did while feelings remained
    unsettled. Observed checks: Conduct and remaining feelings are distinguished; Care and any unfinished
    responsibility are reviewed; The conclusion avoids a total worth verdict.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A reassuring sentence was copied without examining
    an outcome or taking a proportionate action.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Self-worth
    beyond performance contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
