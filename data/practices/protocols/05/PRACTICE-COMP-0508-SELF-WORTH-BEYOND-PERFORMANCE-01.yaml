meaning_and_fit:
  purpose: Separate an ordinary success or setback from a total judgment of dignity, while preserving
    realistic responsibility and needed care.
  why_recommended: Separate an ordinary success or setback from a total judgment of dignity, while preserving
    realistic responsibility and needed care.
  claims:
  - statement: Separate an ordinary success or setback from a total judgment of dignity, while preserving
      realistic responsibility and needed care.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Self-worth beyond performance practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Self-worth beyond performance as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Speak the two headings privately or use a neutral fictional case. No affirmations,
    disclosure, forced positive feeling or comparison of human value is required. Stop if the topic becomes
    overwhelming and use support suited to your needs.
  opportunity_considerations: 'Use a low-stakes event such as receiving praise for a meal or making an
    error in a hobby. Create two headings: what happened, and what I am making it mean about me. A fictional
    missed deadline is available if personal reflection feels unsafe.'
  prerequisites:
  - 'Use a low-stakes event such as receiving praise for a meal or making an error in a hobby. Create
    two headings: what happened, and what I am making it mean about me. A fictional missed deadline is
    available if personal reflection feels unsafe.'
  dependencies: []
  safe_alternatives:
  - Speak the two headings privately or use a neutral fictional case. No affirmations, disclosure, forced
    positive feeling or comparison of human value is required. Stop if the topic becomes overwhelming
    and use support suited to your needs.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Self-worth beyond performance differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Self-worth beyond performance
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a low-stakes event such as receiving praise for a meal or making an error in a hobby. Create
    two headings: what happened, and what I am making it mean about me. A fictional missed deadline is
    available if personal reflection feels unsafe. Goal: Separate an ordinary success or setback from
    a total judgment of dignity, while preserving realistic responsibility and needed care. Scope: This
    rehearses a response to one outcome. It does not measure self-worth, promise an emotional change or
    treat persistent distress. Dignity is not an earned score. Time and effort: About 15 minutes after
    a manageable outcome and one short later check. Adaptation: Speak the two headings privately or use
    a neutral fictional case. No affirmations, disclosure, forced positive feeling or comparison of human
    value is required. Stop if the topic becomes overwhelming and use support suited to your needs. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Speak the two headings privately or use a neutral fictional case. No affirmations,
    disclosure, forced positive feeling or comparison of human value is required. Stop if the topic becomes
    overwhelming and use support suited to your needs.
  expected_burden: About 15 minutes after a manageable outcome and one short later check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Self-worth beyond performance protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Self-worth beyond performance action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Speak the two
    headings privately or use a neutral fictional case. No affirmations, disclosure, forced positive feeling
    or comparison of human value is required. Stop if the topic becomes overwhelming and use support suited
    to your needs.
  actions:
  - stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01-A1
    sequence: 1
    title: Keep the result smaller than the person
    instructions: 'Describe the outcome and its concrete consequences without always, never, superior
      or worthless. Under the second heading, write any total judgment you notice and identify the jump
      from event to identity. For a success, distinguish satisfaction from entitlement; for an error,
      distinguish responsibility from condemnation. Noticing no global judgment is also a valid observation.


      Observation checks: The outcome has a bounded factual description; A global judgment or its absence
      is identified; Consequences are separated from dignity. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01
      action_stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01-A1
      competency_stable_id: '05.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0508_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0508_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_outcome_has_a_bounded_factual_description
        - a_global_judgment_or_its_absence_is_identified
        - consequences_are_separated_from_dignity
      - measurement_id: c0508_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0508_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01-A2
    sequence: 2
    title: Choose accountability and ordinary care together
    instructions: 'Write the response you would consider fair for another person in the same circumstances,
      then apply that standard to yourself. Take one proportionate action: correct an error, thank someone
      who helped, or accept praise plainly. Keep an ordinary need such as rest, food or connection available
      regardless of the result; care is not a reward for achievement.


      Observation checks: The same standard can apply to another person; A proportionate responsible action
      is taken; An ordinary need is not made conditional on achievement. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01
      action_stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01-A2
      competency_stable_id: '05.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0508_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0508_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_same_standard_can_apply_to_another_person
        - a_proportionate_responsible_action_is_taken
        - an_ordinary_need_is_not_made_conditional_on_achievement
      - measurement_id: c0508_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0508_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01-A3
    sequence: 3
    title: Check what you did while feelings remained unsettled
    instructions: 'Later that day or the next, review the action and the remaining feeling separately.
      Record whether you continued ordinary care and whether any repair remains. Rewrite the conclusion
      as I did or experienced X; I can respond with Y, leaving your whole worth out of it. Persistent
      disappointment or pride does not make the practice a failure.


      Observation checks: Conduct and remaining feelings are distinguished; Care and any unfinished responsibility
      are reviewed; The conclusion avoids a total worth verdict. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Can you acknowledge the real result and choose a responsible next action without putting
      your dignity on trial?


      Examples: Supportive: A hobby mistake was corrected, ordinary rest continued, and disappointment
      remained a feeling rather than a verdict on the person.


      Mixed: The practical response was fair, but a global self-judgment still recurred and was recorded
      honestly.


      Contradictory: Care was withheld as punishment or dignity was used as a reason to avoid repairing
      a real mistake.


      Inconclusive: A reassuring sentence was copied without examining an outcome or taking a proportionate
      action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01
      action_stable_id: PRACTICE-COMP-0508-SELF-WORTH-BEYOND-PERFORMANCE-01-A3
