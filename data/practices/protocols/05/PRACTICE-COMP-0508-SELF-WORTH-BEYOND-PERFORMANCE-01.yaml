completion_and_review:
  completion_criteria:
  - 'Action 1: Keep the result smaller than the person. Observed checks: The outcome has a bounded factual
    description; A global judgment or its absence is identified; Consequences are separated from dignity.'
  - 'Action 2: Choose accountability and ordinary care together. Observed checks: The same standard can
    apply to another person; A proportionate responsible action is taken; An ordinary need is not made
    conditional on achievement.'
  - 'Action 3: Check what you did while feelings remained unsettled. Observed checks: Conduct and remaining
    feelings are distinguished; Care and any unfinished responsibility are reviewed; The conclusion avoids
    a total worth verdict.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0508_a1_primary
    - c0508_a2_primary
    - c0508_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Can you acknowledge the real result and choose a responsible next action without
    putting your dignity on trial?
  transfer_limit: This rehearses a response to one outcome. It does not measure self-worth, promise an
    emotional change or treat persistent distress. Dignity is not an earned score.
  reflection:
    before: 'What would count as doing this honestly? Goal: Separate an ordinary success or setback from
      a total judgment of dignity, while preserving realistic responsibility and needed care.'
    during: Which checks have actually been observed? The practical response was fair, but a global self-judgment
      still recurred and was recorded honestly.
    after: Can you acknowledge the real result and choose a responsible next action without putting your
      dignity on trial?
  review_guidance:
    repeat: Repeat the same bounded Self-worth beyond performance design only when the context and burden
      remain appropriate.
    adapt: Speak the two headings privately or use a neutral fictional case. No affirmations, disclosure,
      forced positive feeling or comparison of human value is required. Stop if the topic becomes overwhelming
      and use support suited to your needs.
    stop: Stop Self-worth beyond performance when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A hobby mistake was corrected, ordinary rest continued, and disappointment remained a
      feeling rather than a verdict on the person.
    mixed: The practical response was fair, but a global self-judgment still recurred and was recorded
      honestly.
    contradictory: Care was withheld as punishment or dignity was used as a reason to avoid repairing
      a real mistake.
    inconclusive: A reassuring sentence was copied without examining an outcome or taking a proportionate
      action.
