  - c0502_a3_adverse
  adverse_or_contradictory_indicators:
  - The story excuses a harmful choice by deleting agency or pressures its author to call mistreatment
    a gift.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Narrative identity explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Narrative identity context, action, role,
    pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Narrative identity observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Narrative identity rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Write the chapter without a final verdict. Observed checks: Three moments
    have concrete events; Memory and interpretation are separated; Agency help and unchosen circumstances
    are included. Action 2: Restore what the first telling left out. Observed checks: A one-sided role
    is identified; An omitted fact changes the account; Responsibility and real constraints remain visible.
    Action 3: Let the ending stay revisable. Observed checks: A later reread informs the ending; Change
    and continuity are both named; A next choice leaves room for revision.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A polished slogan replaced the chapter without examining
    any event.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Narrative
    identity contribution under typed evaluation; protocol performance remains distinct and is never counted
    twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L01
  - L05
  - L16
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Narrative identity evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Write the chapter without a final verdict. Observed checks: Three moments have concrete
    events; Memory and interpretation are separated; Agency help and unchosen circumstances are included.'
  - 'Action 2: Restore what the first telling left out. Observed checks: A one-sided role is identified;
    An omitted fact changes the account; Responsibility and real constraints remain visible.'
  - 'Action 3: Let the ending stay revisable. Observed checks: A later reread informs the ending; Change
    and continuity are both named; A next choice leaves room for revision.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0502_a1_primary
    - c0502_a2_primary
    - c0502_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: What became more truthful when you included both your choices and the conditions
    around them?
  transfer_limit: A short chapter practices narrative balance; it cannot verify uncertain memories, recover
    hidden history or explain an entire identity. There is no required redemptive ending.
  reflection:
    before: 'What would count as doing this honestly? Goal: Create a balanced account of one life chapter
      that includes choices, help, constraints, chance and change without forcing a heroic or failed-self
      story.'
    during: Which checks have actually been observed? The revised story includes help but still treats
      every later event as inevitable.
    after: What became more truthful when you included both your choices and the conditions around them?
  review_guidance:
    repeat: Repeat the same bounded Narrative identity design only when the context and burden remain
      appropriate.
    adapt: Use a three-picture sequence or a private voice note. No public storytelling, confrontation,
      forgiveness, disclosure of harm, or positive reinterpretation of adversity is required. Fiction
      exercises interpretation only.
    stop: Stop Narrative identity when the practice becomes coercive, unsafe, privacy-invasive, role-inappropriate,
      professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A learning story retained persistence, acknowledged instruction and access, and included
      an unresolved setback.
    mixed: The revised story includes help but still treats every later event as inevitable.
    contradictory: The story excuses a harmful choice by deleting agency or pressures its author to call
      mistreatment a gift.
    inconclusive: A polished slogan replaced the chapter without examining any event.
