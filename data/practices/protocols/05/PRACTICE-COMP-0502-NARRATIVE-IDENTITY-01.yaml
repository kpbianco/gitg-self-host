meaning_and_fit:
  purpose: Create a balanced account of one life chapter that includes choices, help, constraints, chance
    and change without forcing a heroic or failed-self story.
  why_recommended: Create a balanced account of one life chapter that includes choices, help, constraints,
    chance and change without forcing a heroic or failed-self story.
  claims:
  - statement: Create a balanced account of one life chapter that includes choices, help, constraints,
      chance and change without forcing a heroic or failed-self story.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Narrative identity practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Narrative identity as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use a three-picture sequence or a private voice note. No public storytelling,
    confrontation, forgiveness, disclosure of harm, or positive reinterpretation of adversity is required.
    Fiction exercises interpretation only.
  opportunity_considerations: 'Choose a manageable chapter such as learning a hobby, moving rooms, or
    joining a group. Draw three points: before, turning point, and now. Use a fictional learner if personal
    history feels too exposed.'
  prerequisites:
  - 'Choose a manageable chapter such as learning a hobby, moving rooms, or joining a group. Draw three
    points: before, turning point, and now. Use a fictional learner if personal history feels too exposed.'
  dependencies: []
  safe_alternatives:
  - Use a three-picture sequence or a private voice note. No public storytelling, confrontation, forgiveness,
    disclosure of harm, or positive reinterpretation of adversity is required. Fiction exercises interpretation
    only.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Narrative identity differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Narrative identity as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a manageable chapter such as learning a hobby, moving rooms, or joining a group. Draw
    three points: before, turning point, and now. Use a fictional learner if personal history feels too
    exposed. Goal: Create a balanced account of one life chapter that includes choices, help, constraints,
    chance and change without forcing a heroic or failed-self story. Scope: A short chapter practices
    narrative balance; it cannot verify uncertain memories, recover hidden history or explain an entire
    identity. There is no required redemptive ending. Time and effort: About 25 minutes to draft and revise,
    then a 10-minute reread on another day. Adaptation: Use a three-picture sequence or a private voice
    note. No public storytelling, confrontation, forgiveness, disclosure of harm, or positive reinterpretation
    of adversity is required. Fiction exercises interpretation only. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a three-picture sequence or a private voice note. No public storytelling, confrontation,
    forgiveness, disclosure of harm, or positive reinterpretation of adversity is required. Fiction exercises
    interpretation only.
  expected_burden: About 25 minutes to draft and revise, then a 10-minute reread on another day.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Narrative identity protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Narrative identity action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a three-picture
    sequence or a private voice note. No public storytelling, confrontation, forgiveness, disclosure of
    harm, or positive reinterpretation of adversity is required. Fiction exercises interpretation only.
  actions:
  - stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01-A1
    sequence: 1
    title: Write the chapter without a final verdict
    instructions: 'Describe what happened at each of the three points. Mark remembered events, interpretation,
      and uncertain details separately. Include a choice you made, a circumstance you did not choose,
      help received, and something that went differently than hoped. Harm may be acknowledged without
      detail; do not invent harm or require gratitude for it.


      Observation checks: Three moments have concrete events; Memory and interpretation are separated;
      Agency help and unchosen circumstances are included. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01
      action_stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01-A1
      competency_stable_id: '05.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0502_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0502_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_moments_have_concrete_events
        - memory_and_interpretation_are_separated
        - agency_help_and_unchosen_circumstances_are_included
      - measurement_id: c0502_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0502_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01-A2
    sequence: 2
    title: Restore what the first telling left out
    instructions: 'Underline places where the narrator becomes only a hero, victim, failure or exceptional
      case. Add one omitted fact that complicates that role without denying responsibility or real harm.
      For example, I taught myself the instrument can become I practiced persistently using a borrowed
      instrument and a friend''s corrections. Keep an unresolved loss unresolved.


      Observation checks: A one-sided role is identified; An omitted fact changes the account; Responsibility
      and real constraints remain visible. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01
      action_stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01-A2
      competency_stable_id: '05.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0502_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0502_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_one_sided_role_is_identified
        - an_omitted_fact_changes_the_account
        - responsibility_and_real_constraints_remain_visible
      - measurement_id: c0502_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0502_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01-A3
    sequence: 3
    title: Let the ending stay revisable
    instructions: 'Reread the account on another day. Write what changed in your conduct or understanding,
      what has not changed, and one next ordinary choice the chapter informs. If the story now sounds
      too neat, restore the uncertainty. Finish with a possible next chapter rather than a prediction
      that your identity is fixed.


      Observation checks: A later reread informs the ending; Change and continuity are both named; A next
      choice leaves room for revision. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What became more truthful when you included both your choices and the conditions around
      them?


      Examples: Supportive: A learning story retained persistence, acknowledged instruction and access,
      and included an unresolved setback.


      Mixed: The revised story includes help but still treats every later event as inevitable.


      Contradictory: The story excuses a harmful choice by deleting agency or pressures its author to
      call mistreatment a gift.


      Inconclusive: A polished slogan replaced the chapter without examining any event.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01
      action_stable_id: PRACTICE-COMP-0502-NARRATIVE-IDENTITY-01-A3
