meaning_and_fit:
  purpose: Recognize dependence, gifts, contingency, sacrifice and inheritance in an ordinary good, then
    express gratitude through appropriate care, remembrance or generosity.
  why_recommended: Recognize dependence, gifts, contingency, sacrifice and inheritance in an ordinary
    good, then express gratitude through appropriate care, remembrance or generosity.
  claims:
  - statement: Recognize dependence, gifts, contingency, sacrifice and inheritance in an ordinary good,
      then express gratitude through appropriate care, remembrance or generosity.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Gratitude and received life practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Gratitude and received life as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use spoken recollection or a simple object instead of writing. Choose an impersonal
    public good or a safe historical contribution when direct relationships are difficult. A private acknowledgment
    can replace contact; do not give money or labor you cannot reasonably spare.
  opportunity_considerations: Use a skill someone taught you, a book available to you, a useful tool or
    an ordinary meal. The default is a learned household skill such as mending a loose button or organizing
    a cupboard. No purchase, public thanks or religious interpretation is needed. Keep names and personal
    histories in your private notes.
  prerequisites:
  - Use a skill someone taught you, a book available to you, a useful tool or an ordinary meal. The default
    is a learned household skill such as mending a loose button or organizing a cupboard. No purchase,
    public thanks or religious interpretation is needed. Keep names and personal histories in your private
    notes.
  dependencies: []
  safe_alternatives:
  - Use spoken recollection or a simple object instead of writing. Choose an impersonal public good or
    a safe historical contribution when direct relationships are difficult. A private acknowledgment can
    replace contact; do not give money or labor you cannot reasonably spare.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Gratitude and received life differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Gratitude and received life
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a skill someone taught you, a book available to you, a useful tool or an ordinary meal.
    The default is a learned household skill such as mending a loose button or organizing a cupboard.
    No purchase, public thanks or religious interpretation is needed. Keep names and personal histories
    in your private notes. Goal: Recognize dependence, gifts, contingency, sacrifice and inheritance in
    an ordinary good, then express gratitude through appropriate care, remembrance or generosity. Scope:
    Gratitude concerns a specific received good, not a duty to feel grateful for harm. Recognizing help
    does not erase your work, create unlimited debt or require contact with an unsafe benefactor. Time
    and effort: About 20 minutes to trace a good, one modest response, and a 15-minute review after a
    later use. Adaptation: Use spoken recollection or a simple object instead of writing. Choose an impersonal
    public good or a safe historical contribution when direct relationships are difficult. A private acknowledgment
    can replace contact; do not give money or labor you cannot reasonably spare. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use spoken recollection or a simple object instead of writing. Choose an impersonal
    public good or a safe historical contribution when direct relationships are difficult. A private acknowledgment
    can replace contact; do not give money or labor you cannot reasonably spare.
  expected_burden: About 20 minutes to trace a good, one modest response, and a 15-minute review after
    a later use.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Gratitude and received life protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Gratitude and received life action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use spoken
    recollection or a simple object instead of writing. Choose an impersonal public good or a safe historical
    contribution when direct relationships are difficult. A private acknowledgment can replace contact;
    do not give money or labor you cannot reasonably spare.
  actions:
  - stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01-A1
    sequence: 1
    title: Trace the good beyond your own contribution
    instructions: 'Draw a short chain from the good you now use to people, inherited knowledge, materials
      and circumstances that made it possible. Mark your own effort too. Identify one gift or unearned
      advantage, one dependence, one contingent opportunity, one cost someone may have borne and one inheritance
      worth preserving. Label an unknown cost as unknown rather than inventing a sacrifice. For the learned
      skill, distinguish a teacher''s time from the practice you supplied and the tools that happened
      to be available.


      Observation checks: The chain includes personal effort and dependence; Gift contingency and inheritance
      are considered; A cost or sacrifice is identified without invention; Unknown parts of the chain
      remain explicit. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01
      action_stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01-A1
      competency_stable_id: '03.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0305_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0305_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_chain_includes_personal_effort_and_dependence
        - gift_contingency_and_inheritance_are_considered
        - a_cost_or_sacrifice_is_identified_without_invention
        - unknown_parts_of_the_chain_remain_explicit
      - measurement_id: c0305_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0305_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01-A2
    sequence: 2
    title: Respond in a way that serves the good
    instructions: 'Choose a response from this concrete menu: use a borrowed item carefully and return
      it; thank a willing recipient for a specific help; maintain a tool you own; teach the skill to someone
      who wants it; or preserve a short private remembrance of a contribution. State why the response
      is suitable and what it will cost in time or effort. Carry it out without expecting recognition,
      access or forgiveness in return. If the benefactor also caused harm, acknowledge the limited good
      without surrendering a needed boundary.


      Observation checks: The response fits the particular received good; A real response is completed;
      The response does not demand a return favor; Gratitude preserves any necessary boundary. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01
      action_stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01-A2
      competency_stable_id: '03.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0305_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0305_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_response_fits_the_particular_received_good
        - a_real_response_is_completed
        - the_response_does_not_demand_a_return_favor
        - gratitude_preserves_any_necessary_boundary
      - measurement_id: c0305_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0305_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01-A3
    sequence: 3
    title: Let remembrance guide the next ordinary use
    instructions: 'When you next use the skill, object or opportunity, recall one part of the chain and
      make a concrete choice about care, restraint, sharing or preservation. Compare this conduct with
      your original expression of thanks. Ask whether you erased someone, overstated another person''s
      sacrifice or made gratitude into self-accusation. Retain one truthful acknowledgment and one sustainable
      future behavior. A quiet act of care is sufficient; warm feelings and public display are not required.


      Observation checks: A later ordinary use is reviewed; Remembrance has a concrete consequence for
      conduct; An omission or overstatement is checked; The continuing response remains proportionate.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Which received contribution became visible, and what did you actually do differently
      because of it?


      Examples: Supportive: The learner credited a teacher and their own practice, maintained a tool and
      later shared the skill with someone who had requested help.


      Mixed: A specific thanks was offered, but the contribution chain still contained unknowns and no
      later use had occurred.


      Contradictory: Gratitude was used to demand obedience, excuse harm or impose a debt that the recipient
      had never accepted.


      Inconclusive: A gratitude list was written without tracing a particular good or taking any related
      action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01
      action_stable_id: PRACTICE-COMP-0305-GRATITUDE-AND-RECEIVED-LIFE-01-A3
      competency_stable_id: '03.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0305_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0305_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_later_ordinary_use_is_reviewed
        - remembrance_has_a_concrete_consequence_for_conduct
        - an_omission_or_overstatement_is_checked
        - the_continuing_response_remains_proportionate
      - measurement_id: c0305_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0305_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Gratitude and received life; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use spoken recollection or a simple object instead of writing. Choose an impersonal public good
      or a safe historical contribution when direct relationships are difficult. A private acknowledgment
      can replace contact; do not give money or labor you cannot reasonably spare.
    cultural_context:
    - Adapt the expression of Gratitude and received life to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use spoken recollection or a simple object instead of writing. Choose an impersonal public good
      or a safe historical contribution when direct relationships are difficult. A private acknowledgment
      can replace contact; do not give money or labor you cannot reasonably spare.
  pause_conditions:
  - Pause Gratitude and received life when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Gratitude and received life practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Gratitude and received life situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
