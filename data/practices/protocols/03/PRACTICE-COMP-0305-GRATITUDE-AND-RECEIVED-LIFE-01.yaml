  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Gratitude and received life explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Gratitude and received life context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Gratitude and received life observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Gratitude and received life rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Trace the good beyond your own contribution. Observed checks: The chain
    includes personal effort and dependence; Gift contingency and inheritance are considered; A cost or
    sacrifice is identified without invention; Unknown parts of the chain remain explicit. Action 2: Respond
    in a way that serves the good. Observed checks: The response fits the particular received good; A
    real response is completed; The response does not demand a return favor; Gratitude preserves any necessary
    boundary. Action 3: Let remembrance guide the next ordinary use. Observed checks: A later ordinary
    use is reviewed; Remembrance has a concrete consequence for conduct; An omission or overstatement
    is checked; The continuing response remains proportionate.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A gratitude list was written without tracing a particular
    good or taking any related action.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
