        - coordination_is_distinguished_from_compelled_belief
        - a_coercive_escalation_has_an_appropriately_different_response
      - measurement_id: c0311_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0311_a2_adverse
        kind: boolean
