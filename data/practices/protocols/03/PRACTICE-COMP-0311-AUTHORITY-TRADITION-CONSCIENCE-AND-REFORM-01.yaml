        expected: true
  - stable_id: PRACTICE-COMP-0311-AUTHORITY-TRADITION-CONSCIENCE-AND-REFORM-01-A2
    sequence: 2
    title: Test legitimate direction and signs of coercion
    instructions: 'Give the strongest fair reason for shared words and the strongest fair reason for voluntary
      silence. Examine the demand against its proper scope, the stated visitor policy, truthful assent,
      proportionality and an available appeal. Distinguish ordinary coordination, such as ending on time,
      from compelled belief or punishment for respectful refusal. Consider a counterfactual: if the coordinator
      threatens exclusion from essential support for silence, the issue exceeds a meeting preference and
      requires safety-conscious outside advice. Do not rehearse a confrontation with a threatening authority.


      Observation checks: Both sides receive a fair reason; Scope consent and accountability are examined;
      Coordination is distinguished from compelled belief; A coercive escalation has an appropriately
      different response. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0311-AUTHORITY-TRADITION-CONSCIENCE-AND-REFORM-01
      action_stable_id: PRACTICE-COMP-0311-AUTHORITY-TRADITION-CONSCIENCE-AND-REFORM-01-A2
      competency_stable_id: '03.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0311_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0311_a2_primary
