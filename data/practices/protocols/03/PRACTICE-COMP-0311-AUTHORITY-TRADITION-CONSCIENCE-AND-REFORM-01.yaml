        expected: true
  - stable_id: PRACTICE-COMP-0311-AUTHORITY-TRADITION-CONSCIENCE-AND-REFORM-01-A3
    sequence: 3
    title: Give a principled process and test it against a changed case
    instructions: 'Write a short proposed response: identify the text or policy to clarify, explain the
      conscientious concern, propose spoken words or respectful silence, and ask the coordinator to review
      the procedure through a fair route. State when you would comply, decline, seek independent advice
      or leave. Then change one fact: the group advertises a members-only rite and offers a separate open
      gathering. Re-evaluate without insisting that every form must be open to everyone. End with a reasoned
      disposition and an unresolved question, not a verdict that all tradition or all dissent is good.


      Observation checks: A concrete clarification and review process is proposed; Compliance dissent
      and exit have stated conditions; The changed case produces a reasoned reassessment; A conclusion
      and remaining question preserve conscience and the rights of others. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which authority was legitimate for which question, and what makes your process principled
      rather than convenient agreement or reflexive opposition?


      Examples: Supportive: The proposal preserved shared gratitude and honest silence, used the policy
      review route, and distinguished an open gathering from an appropriately restricted rite.


      Mixed: The reasoning recognized conscience but could not verify the cited text, so that interpretive
      question remained open.


      Contradictory: Respect for tradition became permission to coerce belief, or personal discomfort
      was treated as authority to erase every community boundary.


      Inconclusive: A preferred answer was announced without distinguishing authority roles, considering
      an objection or specifying a review process.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0311-AUTHORITY-TRADITION-CONSCIENCE-AND-REFORM-01
