meaning_and_fit:
  purpose: Distinguish the legitimate roles and limits of texts, teachers, institutions, inherited practice,
    experience and conscience, then give a principled process for agreement, dissent or reform.
  why_recommended: Distinguish the legitimate roles and limits of texts, teachers, institutions, inherited
    practice, experience and conscience, then give a principled process for agreement, dissent or reform.
  claims:
  - statement: Distinguish the legitimate roles and limits of texts, teachers, institutions, inherited
      practice, experience and conscience, then give a principled process for agreement, dissent or reform.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Authority, tradition, conscience, and reform practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Authority, tradition, conscience, and reform as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use spoken reasoning, six labeled objects or the supplied case without personal
    disclosure. In an actual coercive or abusive setting, do not use this exercise to investigate, negotiate
    safety or confront an authority; use independent support appropriate to the circumstances. No complaint,
    confession or change of belief is required.
  opportunity_considerations: 'Use this fictional case: a community reading circle traditionally ends
    with a statement of gratitude. A respected teacher proposes requiring every visitor to say the same
    words, citing unity and a valued text. One visitor wants to remain silent honestly. The written visitor
    policy permits observation, and the coordinator can review meeting procedures. No real group needs
    to be contacted.'
  prerequisites:
  - 'Use this fictional case: a community reading circle traditionally ends with a statement of gratitude.
    A respected teacher proposes requiring every visitor to say the same words, citing unity and a valued
    text. One visitor wants to remain silent honestly. The written visitor policy permits observation,
    and the coordinator can review meeting procedures. No real group needs to be contacted.'
  dependencies: []
  safe_alternatives:
  - Use spoken reasoning, six labeled objects or the supplied case without personal disclosure. In an
    actual coercive or abusive setting, do not use this exercise to investigate, negotiate safety or confront
    an authority; use independent support appropriate to the circumstances. No complaint, confession or
    change of belief is required.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Authority, tradition, conscience, and reform differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Authority, tradition, conscience,
    and reform as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: a community reading circle traditionally ends with a statement of gratitude.
    A respected teacher proposes requiring every visitor to say the same words, citing unity and a valued
    text. One visitor wants to remain silent honestly. The written visitor policy permits observation,
    and the coordinator can review meeting procedures. No real group needs to be contacted. Goal: Distinguish
    the legitimate roles and limits of texts, teachers, institutions, inherited practice, experience and
    conscience, then give a principled process for agreement, dissent or reform. Scope: The supplied low-stakes
    fictional case practices discernment. It neither adjudicates a real abuse allegation nor makes this
    app a religious, legal or safeguarding authority. A thoughtful decision is not measured by obedience
    or dissent alone. Time and effort: Three sessions of about 20 minutes, using the supplied case or
    a comparably safe ordinary disagreement. Adaptation: Use spoken reasoning, six labeled objects or
    the supplied case without personal disclosure. In an actual coercive or abusive setting, do not use
    this exercise to investigate, negotiate safety or confront an authority; use independent support appropriate
    to the circumstances. No complaint, confession or change of belief is required. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use spoken reasoning, six labeled objects or the supplied case without personal
    disclosure. In an actual coercive or abusive setting, do not use this exercise to investigate, negotiate
    safety or confront an authority; use independent support appropriate to the circumstances. No complaint,
    confession or change of belief is required.
  expected_burden: Three sessions of about 20 minutes, using the supplied case or a comparably safe ordinary
    disagreement.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Authority, tradition, conscience, and reform protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Authority, tradition, conscience, and reform action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use spoken
    reasoning, six labeled objects or the supplied case without personal disclosure. In an actual coercive
    or abusive setting, do not use this exercise to investigate, negotiate safety or confront an authority;
    use independent support appropriate to the circumstances. No complaint, confession or change of belief
    is required.
  actions:
  - stable_id: PRACTICE-COMP-0311-AUTHORITY-TRADITION-CONSCIENCE-AND-REFORM-01-A1
    sequence: 1
    title: Map the sources of authority without treating them as identical
    instructions: 'Make six entries for the case: text, teacher, institution, inherited practice, experience
      and conscience. State what each contributes and what it cannot settle by itself. The text may guide
      gratitude but needs interpretation; the teacher may explain it but not rewrite the visitor policy
      alone; the coordinator manages procedure; tradition carries shared meaning; the visitor describes
      their own experience; conscience addresses sincere assent and conduct. Identify the exact disputed
      demand, who is affected and which facts are missing. Do not invent the text''s wording to win the
      argument.


      Observation checks: All six sources of authority have distinct roles and limits; The disputed demand
      and affected people are specific; Interpretation is separated from an actual rule; Missing facts
      are retained rather than invented. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0311-AUTHORITY-TRADITION-CONSCIENCE-AND-REFORM-01
      action_stable_id: PRACTICE-COMP-0311-AUTHORITY-TRADITION-CONSCIENCE-AND-REFORM-01-A1
      competency_stable_id: '03.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0311_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0311_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_six_sources_of_authority_have_distinct_roles_and_limits
        - the_disputed_demand_and_affected_people_are_specific
        - interpretation_is_separated_from_an_actual_rule
        - missing_facts_are_retained_rather_than_invented
      - measurement_id: c0311_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0311_a1_adverse
        kind: boolean
        role: adverse
