meaning_and_fit:
  purpose: 'Practice Metaphysical and spiritual inquiry through a pluralist meaning practice bounded by
    the canonical scope: Examine religious, spiritual, philosophical, and naturalistic accounts of God,
    consciousness, soul, freedom, providence, and transcendence.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can state a position
    or principled uncertainty without pretending proof or dismissing alternatives. The protocol creates
    a small opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Metaphysical and spiritual inquiry is
      a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Metaphysical and spiritual inquiry practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Metaphysical and spiritual inquiry as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Metaphysical and
    spiritual inquiry context, understand the source-only status, and stop without losing safety, care,
    employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Metaphysical
    and spiritual inquiry; do not manufacture conflict, deprivation, exposure, disclosure, danger, urgency,
    or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Metaphysical and spiritual inquiry.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Metaphysical and spiritual inquiry
    instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Metaphysical and spiritual inquiry differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Metaphysical and spiritual
    inquiry as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Complete three bounded Metaphysical and spiritual inquiry actions over ten days, preserving
    explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Metaphysical and spiritual inquiry; copy the canonical scope and evidence
    target into a private working note; define the action boundary, valid supports, privacy limit, and
    stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Metaphysical
    and spiritual inquiry. Do not store private prose, names, identities, diagnoses, allegations, credentials,
    account data, protected work information, intimate detail, artifact contents, observer narrative,
    or another person's secrets. This source-only draft is not surveillance, professional advice, treatment,
    certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Metaphysical and spiritual inquiry actions,
    and review; scope may be reduced or deferred for access, care, health, workload, conscience, or resource
    reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Metaphysical and spiritual inquiry protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Metaphysical and spiritual inquiry action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Metaphysical and spiritual inquiry situation involving emergency response, abuse, retaliation,
    illegal conduct, medical treatment, legal representation, financial-loss decisions, safeguarding,
    hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
  actions:
  - stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01-A1
    sequence: 1
    title: Choose a declared frame for Metaphysical and spiritual inquiry
    instructions: 'Select a religious, spiritual, philosophical, cultural, or secular frame through which
      to explore Metaphysical and spiritual inquiry. State the frame, one alternative, and the limits
      of personal authority using this canonical scope: Examine religious, spiritual, philosophical, and
      naturalistic accounts of God, consciousness, soul, freedom, providence, and transcendence.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01
      action_stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01-A1
      competency_stable_id: '03.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
