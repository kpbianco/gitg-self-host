meaning_and_fit:
  purpose: Compare religious, spiritual, philosophical and naturalistic accounts of ultimate questions,
    then state a reasoned position or uncertainty that represents alternatives fairly.
  why_recommended: Compare religious, spiritual, philosophical and naturalistic accounts of ultimate questions,
    then state a reasoned position or uncertainty that represents alternatives fairly.
  claims:
  - statement: Compare religious, spiritual, philosophical and naturalistic accounts of ultimate questions,
      then state a reasoned position or uncertainty that represents alternatives fairly.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: These selected passages connect judgments and choice with assigned roles and a providential
      account of the gods.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-EPICTETUS-ENCHIRIDION
    limitations: Historical philosophical positions, not established scientific findings. The archive
      credits Elizabeth Carter; this exercise uses the displayed edition without reproducing its wording.
      No claim that all Stoics agree or that ancient prescriptions about suffering and obedience should
      govern present conduct.
  applicability_question: Does a voluntary, bounded Metaphysical and spiritual inquiry practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Metaphysical and spiritual inquiry as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the supplied coincidence instead of personal religious experiences. Definitions
    can be read aloud; a drawing can separate observation from explanation. A chosen faith commitment
    and principled nonbelief are both possible outcomes. Leave questions open or use N/A if this pathway
    is consciously unchosen.
  opportunity_considerations: 'Use paper, dictation or a private note. No religious affiliation or previous
    philosophy study is required. Start with the supplied question: does the feeling that a helpful coincidence
    was meant to happen justify believing it was providential? Use the constructed viewpoints below as
    starting positions, not descriptions of every believer or nonbeliever.'
  prerequisites:
  - 'Use paper, dictation or a private note. No religious affiliation or previous philosophy study is
    required. Start with the supplied question: does the feeling that a helpful coincidence was meant
    to happen justify believing it was providential? Use the constructed viewpoints below as starting
    positions, not descriptions of every believer or nonbeliever.'
  dependencies: []
  safe_alternatives:
  - Use the supplied coincidence instead of personal religious experiences. Definitions can be read aloud;
    a drawing can separate observation from explanation. A chosen faith commitment and principled nonbelief
    are both possible outcomes. Leave questions open or use N/A if this pathway is consciously unchosen.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Metaphysical and spiritual inquiry differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Metaphysical and spiritual
    inquiry as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper, dictation or a private note. No religious affiliation or previous philosophy study
    is required. Start with the supplied question: does the feeling that a helpful coincidence was meant
    to happen justify believing it was providential? Use the constructed viewpoints below as starting
    positions, not descriptions of every believer or nonbeliever. Goal: Compare religious, spiritual,
    philosophical and naturalistic accounts of ultimate questions, then state a reasoned position or uncertainty
    that represents alternatives fairly. Scope: The six-question map covers God, consciousness, soul,
    freedom, providence and transcendence; one comparison receives deeper examination. A reasoned position
    is an inquiry result, not a proof, conversion, or comprehensive survey of traditions. Time and effort:
    Three sessions of about 20 minutes, with an optional later return to an unresolved question. Adaptation:
    Use the supplied coincidence instead of personal religious experiences. Definitions can be read aloud;
    a drawing can separate observation from explanation. A chosen faith commitment and principled nonbelief
    are both possible outcomes. Leave questions open or use N/A if this pathway is consciously unchosen.
    Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Enchiridion: sections 1, 17 and 31: https://classics.mit.edu/Epictetus/epicench.html'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the supplied coincidence instead of personal religious experiences. Definitions
    can be read aloud; a drawing can separate observation from explanation. A chosen faith commitment
    and principled nonbelief are both possible outcomes. Leave questions open or use N/A if this pathway
    is consciously unchosen.
  expected_burden: Three sessions of about 20 minutes, with an optional later return to an unresolved
    question.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Metaphysical and spiritual inquiry protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Metaphysical and spiritual inquiry action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the supplied
    coincidence instead of personal religious experiences. Definitions can be read aloud; a drawing can
    separate observation from explanation. A chosen faith commitment and principled nonbelief are both
    possible outcomes. Leave questions open or use N/A if this pathway is consciously unchosen.
  actions:
  - stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01-A1
    sequence: 1
    title: Separate six questions that are easily collapsed together
    instructions: 'Make six short entries and consider a contrast for each: God as a personal creator
      versus impersonal ultimate reality or no divinity; consciousness as physically explained versus
      having an irreducible experiential aspect; soul as a persisting immaterial self versus a changing
      embodied pattern; freedom as acting from reasons within causes versus requiring another kind of
      agency; providence as guiding intention versus events without such direction; transcendence as contact
      with ultimate reality versus going beyond ordinary self-concern. These are constructed contrasts,
      not exhaustive accounts or labels for entire traditions. For each, state what the disagreement is
      and a present view or honest question. Separate experience, explanation, moral commitment and claims
      about reality; feeling awe alone does not answer all six.


      Observation checks: All six questions include a considered contrast; Experience and interpretation
      are distinguished; Present uncertainty is recorded rather than concealed; The focused question is
      stated in ordinary language. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01
      action_stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01-A1
      competency_stable_id: '03.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0301_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0301_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_six_questions_include_a_considered_contrast
        - experience_and_interpretation_are_distinguished
        - present_uncertainty_is_recorded_rather_than_concealed
        - the_focused_question_is_stated_in_ordinary_language
      - measurement_id: c0301_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0301_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01-A2
    sequence: 2
    title: Give competing accounts their strongest reasons
    instructions: 'Apply four constructed accounts to the coincidence: a personal God may guide events;
      an impersonal spiritual order may make the event meaningful; a philosophical skeptic asks which
      inference is justified; a naturalistic account examines ordinary causes and attention to memorable
      events. Write a reason each proponent might offer and a serious difficulty for each. Ask what observation
      would distinguish the accounts, and which disagreement may remain metaphysical rather than experimentally
      decidable. Read Enchiridion 31 through the supplied reference for one actual providential account,
      and keep that author''s claim separate from your reconstruction.


      Observation checks: Four distinct accounts are represented fairly; Each account has a reason and
      a difficulty; A possible discriminator or its absence is stated; A source-backed claim is distinguished
      from constructed viewpoints. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01
      action_stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01-A2
      competency_stable_id: '03.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0301_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0301_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - four_distinct_accounts_are_represented_fairly
        - each_account_has_a_reason_and_a_difficulty
        - a_possible_discriminator_or_its_absence_is_stated
        - a_source_backed_claim_is_distinguished_from_constructed_viewpoints
      - measurement_id: c0301_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0301_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01-A3
    sequence: 3
    title: State what you believe and how you could revise it
    instructions: 'Write or speak a short conclusion with five parts: my current view or suspension of
      judgment; my strongest reason; the strongest remaining objection; what could change my view; and
      one practical consequence that does not require others to agree. Revisit the other five entries
      and note whether the conclusion actually changes them. In the coincidence case, you might appreciate
      the help and thank the person while leaving divine intention unresolved. Explain an alternative
      without sarcasm before defending your own conclusion.


      Observation checks: The conclusion includes a reason and an unresolved objection; A revision condition
      is explicit; Practical conduct does not require manufactured agreement; Implications for the other
      questions are checked. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Can someone who disagrees recognize their view in your account, and can you say why
      you hold or withhold your conclusion without pretending proof?


      Examples: Supportive: The inquiry separated a meaningful experience from an explanation, represented
      four alternatives, and retained uncertainty about providence while identifying a reasoned next question.


      Mixed: The competing accounts were fair, but the supposed discriminator would not actually separate
      them and the conclusion stayed provisional.


      Contradictory: The intensity of a feeling was presented as decisive proof, or a competing worldview
      was reduced to stupidity or moral inferiority.


      Inconclusive: Definitions were copied without comparing reasons or stating a position, objection
      or principled uncertainty.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01
