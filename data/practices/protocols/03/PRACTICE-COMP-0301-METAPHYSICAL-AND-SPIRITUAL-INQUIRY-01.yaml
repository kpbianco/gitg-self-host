  - stable_id: PRACTICE-COMP-0301-METAPHYSICAL-AND-SPIRITUAL-INQUIRY-01-A2
    sequence: 2
    title: Complete two bounded Metaphysical and spiritual inquiry practices
    instructions: Complete two short, freely chosen Metaphysical and spiritual inquiry practices appropriate
      to the declared frame, such as reading, silence, prayer, observation, ritual, dialogue, or reflection.
      Stop for distress, coercion, altered-state risk, conscience conflict, or pressure from an authority
      or group.
    expected_time: 15-25 minutes
