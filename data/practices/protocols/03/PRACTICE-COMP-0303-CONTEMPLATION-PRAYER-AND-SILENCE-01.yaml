meaning_and_fit:
  purpose: Establish a freely chosen prayer, reading, silence or attention practice and examine whether
    it supports honesty, attention, gratitude, resolve or peace in ordinary conduct.
  why_recommended: Establish a freely chosen prayer, reading, silence or attention practice and examine
    whether it supports honesty, attention, gratitude, resolve or peace in ordinary conduct.
  claims:
  - statement: Establish a freely chosen prayer, reading, silence or attention practice and examine whether
      it supports honesty, attention, gratitude, resolve or peace in ordinary conduct.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Meditation can involve negative experiences; health concerns should not be managed by replacing
      appropriate care with meditation.
    classification: safety_precaution
    source_ids:
    - SRC-NCCIH-MEDITATION-SAFETY
    limitations: Supports a cautious stop-and-support boundary only. It does not establish safety or effectiveness
      of this product's short pause, classify a spiritual experience, or validate individual outcomes.
  applicability_question: Does a voluntary, bounded Contemplation, prayer, and silence practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Contemplation, prayer, and silence as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Attend to touch, sound or an ordinary task using a comfortable posture; keep
    eyes open if preferred. Use a familiar prayer only by choice. No fasting, sleep deprivation, breath
    manipulation, isolation or altered-state induction belongs to this exercise. Stop an upsetting practice
    and seek suitable support if distress persists.
  opportunity_considerations: 'Choose a familiar safe place and an ordinary daily cue. The usable default
    is an eyes-open three-minute pause: notice the room, attend to one ordinary sound or object, then
    name one honest next action. Prayer, sacred reading, examen or quiet recitation may replace the middle
    minute if already suitable to your tradition. No special posture, breath control, equipment or belief
    is required.'
  prerequisites:
  - 'Choose a familiar safe place and an ordinary daily cue. The usable default is an eyes-open three-minute
    pause: notice the room, attend to one ordinary sound or object, then name one honest next action.
    Prayer, sacred reading, examen or quiet recitation may replace the middle minute if already suitable
    to your tradition. No special posture, breath control, equipment or belief is required.'
  dependencies: []
  safe_alternatives:
  - Attend to touch, sound or an ordinary task using a comfortable posture; keep eyes open if preferred.
    Use a familiar prayer only by choice. No fasting, sleep deprivation, breath manipulation, isolation
    or altered-state induction belongs to this exercise. Stop an upsetting practice and seek suitable
    support if distress persists.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Contemplation, prayer, and silence differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Contemplation, prayer, and
    silence as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-REPEATED-HABIT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a familiar safe place and an ordinary daily cue. The usable default is an eyes-open three-minute
    pause: notice the room, attend to one ordinary sound or object, then name one honest next action.
    Prayer, sacred reading, examen or quiet recitation may replace the middle minute if already suitable
    to your tradition. No special posture, breath control, equipment or belief is required. Goal: Establish
    a freely chosen prayer, reading, silence or attention practice and examine whether it supports honesty,
    attention, gratitude, resolve or peace in ordinary conduct. Scope: Five brief occasions provide an
    initial pattern, not reliable clinical or spiritual efficacy. The practice may be useful, neutral
    or unwelcome; concentration, calm and religious feeling are not scores of worth. Time and effort:
    About 15 minutes to prepare, five three-minute occasions during a week, and a 15-minute review. Adaptation:
    Attend to touch, sound or an ordinary task using a comfortable posture; keep eyes open if preferred.
    Use a familiar prayer only by choice. No fasting, sleep deprivation, breath manipulation, isolation
    or altered-state induction belongs to this exercise. Stop an upsetting practice and seek suitable
    support if distress persists. Keep personal working notes outside the check-in; record only the listed
    observations.


    Reference support:

    Meditation and Mindfulness: Effectiveness and Safety: https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Attend to touch, sound or an ordinary task using a comfortable posture; keep eyes
    open if preferred. Use a familiar prayer only by choice. No fasting, sleep deprivation, breath manipulation,
    isolation or altered-state induction belongs to this exercise. Stop an upsetting practice and seek
    suitable support if distress persists.
  expected_burden: About 15 minutes to prepare, five three-minute occasions during a week, and a 15-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Contemplation, prayer, and silence protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Contemplation, prayer, and silence action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Attend to touch,
    sound or an ordinary task using a comfortable posture; keep eyes open if preferred. Use a familiar
    prayer only by choice. No fasting, sleep deprivation, breath manipulation, isolation or altered-state
    induction belongs to this exercise. Stop an upsetting practice and seek suitable support if distress
    persists.
  actions:
  - stable_id: PRACTICE-COMP-0303-CONTEMPLATION-PRAYER-AND-SILENCE-01-A1
    sequence: 1
    title: Define a practice small enough to repeat honestly
    instructions: 'Write the cue, the three-minute sequence and one conduct marker: for example, notice
      that you do not know before making a claim, thank a helper specifically, or return attention to
      the next task. Choose one of honesty, attention, gratitude, resolve or peace as the focus, while
      checking that the others are not being undermined. State how to stop comfortably. Rehearse the sequence
      once; record an interrupted rehearsal as interrupted rather than stretching it until it looks successful.


      Observation checks: A cue and exact short sequence are defined; One observable conduct marker is
      selected; A comfortable stopping option is available; One rehearsal is recorded accurately. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0303-CONTEMPLATION-PRAYER-AND-SILENCE-01
      action_stable_id: PRACTICE-COMP-0303-CONTEMPLATION-PRAYER-AND-SILENCE-01-A1
      competency_stable_id: '03.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0303_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0303_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_cue_and_exact_short_sequence_are_defined
        - one_observable_conduct_marker_is_selected
        - a_comfortable_stopping_option_is_available
        - one_rehearsal_is_recorded_accurately
      - measurement_id: c0303_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0303_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0303-CONTEMPLATION-PRAYER-AND-SILENCE-01-A2
    sequence: 2
    title: Repeat without requiring a special internal state
    instructions: 'On five available occasions, follow the sequence or record why it was missed. After
      each, privately note the setting, whether you actually practiced, what happened to the chosen marker
      in the next ordinary activity, and any discomfort or distraction. If attention wanders, gently return
      once; wandering is information rather than misconduct. Do not increase intensity to force an effect.
      If the practice becomes distressing, stop, return to an ordinary activity and record that it was
      unsuitable.


      Observation checks: Five opportunities are accounted for without inventing attempts; Actual practice
      and missed opportunities are separated; Conduct after practice is observed; Discomfort and distractions
      remain in the record. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0303-CONTEMPLATION-PRAYER-AND-SILENCE-01
      action_stable_id: PRACTICE-COMP-0303-CONTEMPLATION-PRAYER-AND-SILENCE-01-A2
      competency_stable_id: '03.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0303_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0303_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - five_opportunities_are_accounted_for_without_inventing_attempts
        - actual_practice_and_missed_opportunities_are_separated
        - conduct_after_practice_is_observed
        - discomfort_and_distractions_remain_in_the_record
      - measurement_id: c0303_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0303_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0303-CONTEMPLATION-PRAYER-AND-SILENCE-01-A3
    sequence: 3
    title: Choose a sustainable next step from the whole pattern
    instructions: 'Compare the actual occasions, including neutral and difficult ones. Ask whether any
      apparent change could instead reflect sleep, workload, company or expectations. Look separately
      at honest acknowledgment, sustained attention, appreciation, follow-through and ease; do not require
      every effect. Keep, shorten, change or stop the sequence for a stated reason. A useful result might
      be admitting uncertainty twice even though you never felt peaceful. Describe the pattern as a small
      personal observation, not proof that this practice works for everyone.


      Observation checks: Helpful neutral and difficult occasions are compared; At least one competing
      explanation is considered; A specific keep adapt or stop decision follows; The conclusion stays
      within the observed pattern. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: What happened to your chosen conduct marker, what did the practice cost, and is the
      next version justified by your actual experience?


      Examples: Supportive: Four brief attempts were recorded, one was missed, and two later conversations
      included honest acknowledgment of uncertainty; no general effectiveness claim was made.


      Mixed: The pause sometimes helped attention but also felt burdensome, so the participant shortened
      it and retained the uncertainty.


      Contradictory: A participant extended an upsetting session to force calm, concealed missed occasions
      or treated distraction as spiritual failure.


      Inconclusive: A preferred routine was planned but no actual occasions or later conduct were observed.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0303-CONTEMPLATION-PRAYER-AND-SILENCE-01
