  performance_rubric: 'Action 1: Turn a large cause into a useful and bounded promise. Observed checks:
    A chosen good has a specific beneficiary or future use; A real need and permission are checked; A
    deliverable and finish date are explicit; A proportionate cost is acknowledged without neglecting
    duties. Action 2: Deliver something another person can actually use. Observed checks: The promised
    work receives both actual work periods; Content or workmanship is checked against its intended use;
    The deliverable reaches the agreed recipient or place; Other contributions and permissions are respected.
    Action 3: Review service against benefit and actual cost. Observed checks: Benefit is checked or explicitly
    remains unknown; Actual sacrifice is compared with the promise; A needed bounded correction is addressed;
    Continuation or closure has a reason.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A noble cause and intended sacrifice were described
    without completing an agreed piece of work.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Vocation
    and service beyond self contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
