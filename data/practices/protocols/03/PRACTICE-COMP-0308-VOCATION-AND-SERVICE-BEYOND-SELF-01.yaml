  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Vocation and service beyond self; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Offer spoken or large-print instructions, a simple diagram or another requested accessible format.
      Use a familiar safe item and the authority you actually have. No money, unpaid professional work,
      recruitment, public credit or irreversible life commitment is required. A private future-use guide
      does not count as observed benefit to a community.
    cultural_context:
    - Adapt the expression of Vocation and service beyond self to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Offer spoken or large-print instructions, a simple diagram or another requested accessible format.
      Use a familiar safe item and the authority you actually have. No money, unpaid professional work,
      recruitment, public credit or irreversible life commitment is required. A private future-use guide
      does not count as observed benefit to a community.
  pause_conditions:
  - Pause Vocation and service beyond self when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Vocation and service beyond self practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Vocation and service beyond self situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
