meaning_and_fit:
  purpose: Choose a freely endorsed commitment to truth, faith, community, craft, a cause or future people
    and let it make a real, proportionate claim on your time, comfort, resources or status.
  why_recommended: Choose a freely endorsed commitment to truth, faith, community, craft, a cause or future
    people and let it make a real, proportionate claim on your time, comfort, resources or status.
  claims:
  - statement: Choose a freely endorsed commitment to truth, faith, community, craft, a cause or future
      people and let it make a real, proportionate claim on your time, comfort, resources or status.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Vocation and service beyond self practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Vocation and service beyond self as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Offer spoken or large-print instructions, a simple diagram or another requested
    accessible format. Use a familiar safe item and the authority you actually have. No money, unpaid
    professional work, recruitment, public credit or irreversible life commitment is required. A private
    future-use guide does not count as observed benefit to a community.
  opportunity_considerations: Choose a good you actually endorse and an appropriate recipient or future
    user. The default is preparing a clear care-and-return instruction card for a shared item, with the
    responsible person's permission. Use an item you know how to handle safely; do not invent technical
    instructions. A private reusable guide for your future household can substitute when no shared setting
    is available, with its narrower benefit stated.
  prerequisites:
  - Choose a good you actually endorse and an appropriate recipient or future user. The default is preparing
    a clear care-and-return instruction card for a shared item, with the responsible person's permission.
    Use an item you know how to handle safely; do not invent technical instructions. A private reusable
    guide for your future household can substitute when no shared setting is available, with its narrower
    benefit stated.
  dependencies: []
  safe_alternatives:
  - Offer spoken or large-print instructions, a simple diagram or another requested accessible format.
    Use a familiar safe item and the authority you actually have. No money, unpaid professional work,
    recruitment, public credit or irreversible life commitment is required. A private future-use guide
    does not count as observed benefit to a community.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Vocation and service beyond self differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Vocation and service beyond
    self as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a good you actually endorse and an appropriate recipient or future user. The default
    is preparing a clear care-and-return instruction card for a shared item, with the responsible person''s
    permission. Use an item you know how to handle safely; do not invent technical instructions. A private
    reusable guide for your future household can substitute when no shared setting is available, with
    its narrower benefit stated. Goal: Choose a freely endorsed commitment to truth, faith, community,
    craft, a cause or future people and let it make a real, proportionate claim on your time, comfort,
    resources or status. Scope: A small completed commitment tests service and follow-through, not discovery
    of a permanent calling or the moral value of a person. Service must meet a real use rather than treating
    recipients as props for identity. Time and effort: About 20 minutes to choose and agree the work,
    two 15-minute work periods within a week, and a 15-minute review. Adaptation: Offer spoken or large-print
    instructions, a simple diagram or another requested accessible format. Use a familiar safe item and
    the authority you actually have. No money, unpaid professional work, recruitment, public credit or
    irreversible life commitment is required. A private future-use guide does not count as observed benefit
    to a community. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Offer spoken or large-print instructions, a simple diagram or another requested
    accessible format. Use a familiar safe item and the authority you actually have. No money, unpaid
    professional work, recruitment, public credit or irreversible life commitment is required. A private
    future-use guide does not count as observed benefit to a community.
  expected_burden: About 20 minutes to choose and agree the work, two 15-minute work periods within a
    week, and a 15-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Vocation and service beyond self protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Vocation and service beyond self action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Offer spoken
    or large-print instructions, a simple diagram or another requested accessible format. Use a familiar
    safe item and the authority you actually have. No money, unpaid professional work, recruitment, public
    credit or irreversible life commitment is required. A private future-use guide does not count as observed
    benefit to a community.
  actions:
  - stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01-A1
    sequence: 1
    title: Turn a large cause into a useful and bounded promise
    instructions: 'Name which good calls for your effort and who or what should benefit. Confirm one real
      need with the responsible person or observable use, such as repeated uncertainty about where a shared
      item belongs. Define a small deliverable, its recipient, an agreement or authority to act, and a
      finish date. Identify the real cost: two short blocks that displace optional leisure, a minor inconvenience,
      or giving another contributor due credit. Protect essential needs and existing commitments; a demanding
      promise is not automatically a better one.


      Observation checks: A chosen good has a specific beneficiary or future use; A real need and permission
      are checked; A deliverable and finish date are explicit; A proportionate cost is acknowledged without
      neglecting duties. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01
      action_stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01-A1
      competency_stable_id: '03.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0308_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0308_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_chosen_good_has_a_specific_beneficiary_or_future_use
        - a_real_need_and_permission_are_checked
        - a_deliverable_and_finish_date_are_explicit
        - a_proportionate_cost_is_acknowledged_without_neglecting_duties
      - measurement_id: c0308_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0308_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01-A2
    sequence: 2
    title: Deliver something another person can actually use
    instructions: 'Use the first work period to make the instruction card: where the item is kept, how
      an authorized user checks it, and how it is returned or a problem reported. Verify each statement
      from known instructions or the responsible person. Use the second period to check readability and
      completeness with an intended user if willing, then hand it over or place it only where permitted.
      Credit contributions. Keep promises small enough to finish rather than turning the work into an
      impressive public project.


      Observation checks: The promised work receives both actual work periods; Content or workmanship
      is checked against its intended use; The deliverable reaches the agreed recipient or place; Other
      contributions and permissions are respected. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01
      action_stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01-A2
      competency_stable_id: '03.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0308_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0308_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_promised_work_receives_both_actual_work_periods
        - content_or_workmanship_is_checked_against_its_intended_use
        - the_deliverable_reaches_the_agreed_recipient_or_place
        - other_contributions_and_permissions_are_respected
      - measurement_id: c0308_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0308_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01-A3
    sequence: 3
    title: Review service against benefit and actual cost
    instructions: 'Ask whether the deliverable was useful, or record that actual use remains unknown.
      Compare the time and convenience you gave up with the promise and the needs it served. Identify
      one correction, such as a missing return location, and make it if still within scope. Decide whether
      this commitment deserves continuation, a different form or a clear ending. A negative review of
      the deliverable is information about service, not proof that you lack a vocation.


      Observation checks: Benefit is checked or explicitly remains unknown; Actual sacrifice is compared
      with the promise; A needed bounded correction is addressed; Continuation or closure has a reason.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: What received something useful, what did the commitment really cost, and what would
      justify continuing it?


      Examples: Supportive: Two short leisure periods produced a checked return card that an intended
      user could follow, and a missing location was corrected.


      Mixed: The work was delivered and cost real effort, but no later use had occurred, so benefit remained
      unverified.


      Contradictory: The helper ignored the recipient''s actual request, sought recognition over usefulness
      or neglected essential responsibilities to prove devotion.


      Inconclusive: A noble cause and intended sacrifice were described without completing an agreed piece
      of work.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01
      action_stable_id: PRACTICE-COMP-0308-VOCATION-AND-SERVICE-BEYOND-SELF-01-A3
      competency_stable_id: '03.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
