    religious disclosure, interfaith event or contact with an unwilling person is required. Unchosen participation
    is N/A, not deficient tolerance.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Religious pluralism and interfaith humility differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Religious pluralism and interfaith
    humility as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Read the Vatican-hosted Nicene Creed and Humanists UK''s Humanism introduction using the provided
    references. The first affirms a divine creator; the second presents a nonreligious account centered
    on reason and human welfare. Neither summary is a complete tradition. Use the fictional shared-library
    event below or a willing person''s own account; never assign someone''s beliefs from a group label.
    Goal: Describe another tradition accurately from its own account, state a genuine disagreement without
    contempt and define shared conduct that does not require deceptive consensus. Scope: The default compares
    two identified accounts, not every Christian or every humanist. A dialogue rehearsal tests understanding
    and cooperation design; it does not establish interfaith relationship skill until a real voluntary
    exchange occurs. Time and effort: About 20 minutes of reading, a 15-minute rehearsal or voluntary
    conversation and a 15-minute cooperation review. Adaptation: Read the sources with text to speech
    or use an accurate accessible edition. If access is missing, the supplied summaries support rehearsal
    only; source-accuracy checks remain unverified. No debate, religious disclosure, interfaith event
    or contact with an unwilling person is required. Unchosen participation is N/A, not deficient tolerance.
    Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    The Credo: Nicene Creed: https://www.vatican.va/archive/ENG0015/__P13.HTM

    Humanism: https://humanists.uk/humanism/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Read the sources with text to speech or use an accurate accessible edition. If
    access is missing, the supplied summaries support rehearsal only; source-accuracy checks remain unverified.
    No debate, religious disclosure, interfaith event or contact with an unwilling person is required.
    Unchosen participation is N/A, not deficient tolerance.
  expected_burden: About 20 minutes of reading, a 15-minute rehearsal or voluntary conversation and a
    15-minute cooperation review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Religious pluralism and interfaith humility protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Religious pluralism and interfaith humility action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Read the sources
    with text to speech or use an accurate accessible edition. If access is missing, the supplied summaries
    support rehearsal only; source-accuracy checks remain unverified. No debate, religious disclosure,
    interfaith event or contact with an unwilling person is required. Unchosen participation is N/A, not
    deficient tolerance.
  actions:
  - stable_id: PRACTICE-COMP-0312-RELIGIOUS-PLURALISM-AND-INTERFAITH-HUMILITY-01-A1
    sequence: 1
    title: State each account so its proponent could recognize it
    instructions: 'Read both named accounts. For each, record one actual claim, its source location, one
      implication and one question the account does not answer for you. State the disagreement about a
      divine creator plainly; do not reduce it to different words for the same belief. Also identify a
      possible practical shared concern, such as care for neighbors, without pretending that its reasons
      must be identical. Correct your own summary against the source before evaluating it. With a willing
      conversation partner, ask them to correct their own view rather than speak for a whole tradition.


      Observation checks: Two accounts are traced to their own sources; Each summary is checked for accuracy;
      A real disagreement is stated without caricature; Shared conduct is distinguished from shared reasons.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0312-RELIGIOUS-PLURALISM-AND-INTERFAITH-HUMILITY-01
      action_stable_id: PRACTICE-COMP-0312-RELIGIOUS-PLURALISM-AND-INTERFAITH-HUMILITY-01-A1
      competency_stable_id: '03.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0312_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0312_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_accounts_are_traced_to_their_own_sources
        - each_summary_is_checked_for_accuracy
        - a_real_disagreement_is_stated_without_caricature
        - shared_conduct_is_distinguished_from_shared_reasons
      - measurement_id: c0312_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0312_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
