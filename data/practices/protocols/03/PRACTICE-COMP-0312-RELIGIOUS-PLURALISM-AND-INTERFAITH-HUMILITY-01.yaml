        expected: true
  - stable_id: PRACTICE-COMP-0312-RELIGIOUS-PLURALISM-AND-INTERFAITH-HUMILITY-01-A2
    sequence: 2
    title: Practice a conversation that makes disagreement speakable
    instructions: 'Use this fictional case: two volunteers disagree about belief in God while organizing
      a library event. One requests an optional prayer before setup; the other asks not to be included
      in prayer or described as endorsing it. Rehearse both positions in three turns each: a fair summary,
      a sincere disagreement and a curious clarifying question. Replace you people with this claim or
      my view. Give neither side a conversion goal. If using a real willing partner, agree time and topic
      in advance and stop if either person wants to end. Label rehearsal and live dialogue separately.


      Observation checks: Both positions receive a fair summary and sincere disagreement; Questions invite
      clarification rather than a trap; No group is treated with contempt; Rehearsal or live dialogue
      is identified honestly. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0312-RELIGIOUS-PLURALISM-AND-INTERFAITH-HUMILITY-01
      action_stable_id: PRACTICE-COMP-0312-RELIGIOUS-PLURALISM-AND-INTERFAITH-HUMILITY-01-A2
      competency_stable_id: '03.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0312_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0312_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_positions_receive_a_fair_summary_and_sincere_disagreement
        - questions_invite_clarification_rather_than_a_trap
        - no_group_is_treated_with_contempt
        - rehearsal_or_live_dialogue_is_identified_honestly
      - measurement_id: c0312_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0312_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0312-RELIGIOUS-PLURALISM-AND-INTERFAITH-HUMILITY-01-A3
    sequence: 3
    title: Design cooperation that does not borrow another person's assent
    instructions: 'For the library case, agree a shared practical task, optional prayer outside required
      work, truthful descriptions of who participates, and equal ability to help without worship. Identify
      any real venue rule that would need checking; do not invent permission. Test the arrangement against
      two changes: someone declines prayer, and someone asks to discuss belief during the task. State
      how each can decline without punishment. In a real opportunity, agree and carry out a comparably
      modest task; otherwise retain the result as a cooperation design and leave live cooperation untested.


      Observation checks: A useful shared task and voluntary boundaries are specified; Participation is
      described without false endorsement; The arrangement handles two concrete disagreements; Designed
      cooperation is separated from any actual joint work. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What disagreement stayed real, what understanding improved, and exactly what could
      you do together without either person pretending agreement?


      Examples: Supportive: Both sourced accounts were represented fairly and the library arrangement
      let people cooperate while prayer and assent remained voluntary; live cooperation was not claimed
      from rehearsal.


      Mixed: The disagreement was respectful, but an assumed venue rule still needed checking before the
      arrangement could be used.


      Contradictory: One person''s silence was presented as assent, a tradition was caricatured or cooperation
      was made conditional on conversion.


      Inconclusive: Everyone was declared basically the same without examining a real claim, disagreement
      or workable shared task.'
    expected_time: 15-25 minutes
