meaning_and_fit:
  purpose: Distinguish choice, influence and uncontrollable conditions, tolerate remaining uncertainty
    and dependence, and act on a proportionate responsibility without pretending to control the outcome.
  why_recommended: Distinguish choice, influence and uncontrollable conditions, tolerate remaining uncertainty
    and dependence, and act on a proportionate responsibility without pretending to control the outcome.
  claims:
  - statement: Distinguish choice, influence and uncontrollable conditions, tolerate remaining uncertainty
      and dependence, and act on a proportionate responsibility without pretending to control the outcome.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Surrender and limits of control practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Surrender and limits of control as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a solo weather-dependent plan or the fictional invitation for analysis
    when no suitable live uncertainty exists. Fictional planning does not demonstrate release during a
    real wait. Prayer or secular language may frame acceptance; neither replaces necessary care, advocacy
    or professional support.
  opportunity_considerations: 'Use an unanswered nonurgent invitation, a hobby plan affected by weather,
    or the supplied case: you have invited a friend to a free activity but do not yet know whether they
    will attend. No serious loss, health concern, emergency or manufactured deprivation is needed.'
  prerequisites:
  - 'Use an unanswered nonurgent invitation, a hobby plan affected by weather, or the supplied case: you
    have invited a friend to a free activity but do not yet know whether they will attend. No serious
    loss, health concern, emergency or manufactured deprivation is needed.'
  dependencies: []
  safe_alternatives:
  - Use a solo weather-dependent plan or the fictional invitation for analysis when no suitable live uncertainty
    exists. Fictional planning does not demonstrate release during a real wait. Prayer or secular language
    may frame acceptance; neither replaces necessary care, advocacy or professional support.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Surrender and limits of control differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Surrender and limits of control
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an unanswered nonurgent invitation, a hobby plan affected by weather, or the supplied case:
    you have invited a friend to a free activity but do not yet know whether they will attend. No serious
    loss, health concern, emergency or manufactured deprivation is needed. Goal: Distinguish choice, influence
    and uncontrollable conditions, tolerate remaining uncertainty and dependence, and act on a proportionate
    responsibility without pretending to control the outcome. Scope: One low-stakes uncertainty practices
    the relation between acceptance and action. It does not prescribe passivity about injustice or claim
    that feelings, bodies and circumstances are entirely controllable. Time and effort: About 15 minutes
    to prepare, one ordinary action, and two brief reviews within a week. Adaptation: Use a solo weather-dependent
    plan or the fictional invitation for analysis when no suitable live uncertainty exists. Fictional
    planning does not demonstrate release during a real wait. Prayer or secular language may frame acceptance;
    neither replaces necessary care, advocacy or professional support. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a solo weather-dependent plan or the fictional invitation for analysis when
    no suitable live uncertainty exists. Fictional planning does not demonstrate release during a real
    wait. Prayer or secular language may frame acceptance; neither replaces necessary care, advocacy or
    professional support.
  expected_burden: About 15 minutes to prepare, one ordinary action, and two brief reviews within a week.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Surrender and limits of control protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Surrender and limits of control action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a solo
    weather-dependent plan or the fictional invitation for analysis when no suitable live uncertainty
    exists. Fictional planning does not demonstrate release during a real wait. Prayer or secular language
    may frame acceptance; neither replaces necessary care, advocacy or professional support.
  actions:
  - stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01-A1
    sequence: 1
    title: Sort choice influence and the outcome you cannot promise
    instructions: 'Make three columns. Under choice, put a respectful invitation and your own fallback
      plan. Under influence, put clear timing and an easy way to decline. Under outside my control, put
      the other person''s availability, preference and eventual answer. Add an uncertainty you must live
      with and a limit on your time or energy. Identify any appropriate help you depend on. Check whether
      acceptance is becoming an excuse to omit a responsibility, or whether planning is becoming a claim
      that you can guarantee the reply.


      Observation checks: Choice influence and uncontrollable conditions are separated; An unresolved
      uncertainty and personal limit are explicit; Relevant dependence or help is acknowledged; Both passivity
      and false control are checked. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01
      action_stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01-A1
      competency_stable_id: '03.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0306_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0306_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - choice_influence_and_uncontrollable_conditions_are_separated
        - an_unresolved_uncertainty_and_personal_limit_are_explicit
        - relevant_dependence_or_help_is_acknowledged
        - both_passivity_and_false_control_are_checked
      - measurement_id: c0306_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0306_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01-A2
    sequence: 2
    title: Take the action and stop at the agreed boundary
    instructions: 'Make or clarify the ordinary invitation once, with a reasonable decision point and
      an easy refusal. Prepare a satisfying solo or alternative activity. Until the decision point, return
      to another ordinary task rather than repeatedly demanding a reply. If new information requires action,
      respond proportionately; releasing control is not a ban on useful follow-up. Observe what you actually
      did when the urge to check or pressure appeared, without demanding that the feeling disappear.


      Observation checks: A proportionate action is actually taken; A fallback and decision point are
      available; The other person remains free to choose; The response to uncertainty is observed without
      forcing calm. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01
      action_stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01-A2
      competency_stable_id: '03.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0306_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0306_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_proportionate_action_is_actually_taken
        - a_fallback_and_decision_point_are_available
        - the_other_person_remains_free_to_choose
        - the_response_to_uncertainty_is_observed_without_forcing_calm
      - measurement_id: c0306_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0306_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01-A3
    sequence: 3
    title: Review your conduct separately from whether you got your way
    instructions: 'At the decision point, follow the available plan, then review again a day or two later.
      State the outcome, your contribution, help or constraints, and what remained outside your control.
      If the reply was disappointing, name the disappointment without using it as proof that acceptance
      failed. If it was favorable, do not infer that your attitude caused it. Decide whether to repeat
      the approach, change the invitation or leave the matter alone, giving a practical reason.


      Observation checks: The decision point leads to a real next step; Conduct and outcome are evaluated
      separately; Remaining emotion and dependence are acknowledged; The next decision follows the observed
      limits. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.


      Final review: What did you release, what remained yours to do, and how did the result test that
      distinction?


      Examples: Supportive: The participant invited once, accepted a refusal and used the fallback while
      remaining disappointed but respectful.


      Mixed: The fallback worked, but repeated checking continued and became a specific target for a later
      attempt.


      Contradictory: Acceptance was used to abandon a responsibility, or surrender was demanded from someone
      facing mistreatment.


      Inconclusive: The control columns were completed for a fictional case but no real action or period
      of uncertainty was observed.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01
      action_stable_id: PRACTICE-COMP-0306-SURRENDER-AND-LIMITS-OF-CONTROL-01-A3
      competency_stable_id: '03.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0306_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0306_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_decision_point_leads_to_a_real_next_step
        - conduct_and_outcome_are_evaluated_separately
        - remaining_emotion_and_dependence_are_acknowledged
        - the_next_decision_follows_the_observed_limits
      - measurement_id: c0306_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
