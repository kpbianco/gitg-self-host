  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Surrender and limits of control; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a solo weather-dependent plan or the fictional invitation for analysis when no suitable live
      uncertainty exists. Fictional planning does not demonstrate release during a real wait. Prayer or
      secular language may frame acceptance; neither replaces necessary care, advocacy or professional
      support.
    cultural_context:
    - Adapt the expression of Surrender and limits of control to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a solo weather-dependent plan or the fictional invitation for analysis when no suitable live
      uncertainty exists. Fictional planning does not demonstrate release during a real wait. Prayer or
      secular language may frame acceptance; neither replaces necessary care, advocacy or professional
      support.
  pause_conditions:
  - Pause Surrender and limits of control when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Surrender and limits of control practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Surrender and limits of control situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
