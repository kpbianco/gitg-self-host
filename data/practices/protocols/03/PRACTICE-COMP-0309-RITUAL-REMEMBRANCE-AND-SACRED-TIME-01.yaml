        expected: true
  - stable_id: PRACTICE-COMP-0309-RITUAL-REMEMBRANCE-AND-SACRED-TIME-01-A3
    sequence: 3
    title: Check the action and revise the next observance
    instructions: 'Before the next occasion, check whether you did the named action and what prevented
      it if not. Repeat the ritual once, preserving or changing one element for a reason: an object may
      now remind you to return the borrowed item, while an ornate speech may be removed. Ask what identity
      or belonging the sequence expresses and whether your conduct supports it. A ritual can be sincere
      without strong emotion; repeated symbolism does not replace a repair or practical promise.


      Observation checks: The promised action is checked against what happened; A second observance is
      recorded; One retained or revised element has a reason; Symbolic meaning is compared with actual
      conduct. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What did the sequence help you remember, and what changed outside the ceremony?


      Examples: Supportive: The weekly pause recalled help received, prompted return of a borrowed item
      and made room for rest; the second observance removed an empty flourish.


      Mixed: The sequence felt meaningful, but the next action was missed and the review made that gap
      explicit.


      Contradictory: A ceremony substituted for making a needed repair, pressured others to disclose grief
      or borrowed a restricted practice without permission.


      Inconclusive: A ritual was described beautifully but never performed or linked to an observed action.'
    expected_time: 15-25 minutes
