  - stable_id: PRACTICE-COMP-0309-RITUAL-REMEMBRANCE-AND-SACRED-TIME-01-A2
    sequence: 2
    title: Perform the sequence with attention and freedom
    instructions: 'On the chosen occasion, follow the five-part sequence at a comfortable pace. Name a
      concrete good and unfinished matter, then choose a small next action such as returning an item or
      correcting a misunderstanding. Begin the planned rest rather than turning the ceremony into more
      work. Notice which element helped you remember and which felt empty. If others join, explain the
      sequence first and make speaking, silence and declining equally available; do not require disclosure
      of grief, guilt or belief.


      Observation checks: The defined sequence is actually performed; Remembrance refers to a concrete
      good or event; A specific next action is named; Rest and any participant choice are respected. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0309-RITUAL-REMEMBRANCE-AND-SACRED-TIME-01
      action_stable_id: PRACTICE-COMP-0309-RITUAL-REMEMBRANCE-AND-SACRED-TIME-01-A2
      competency_stable_id: '03.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
