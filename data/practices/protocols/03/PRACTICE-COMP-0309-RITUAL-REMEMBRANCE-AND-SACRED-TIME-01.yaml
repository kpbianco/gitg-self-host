meaning_and_fit:
  purpose: Create or freely adopt a meaningful sequence for a transition, remembrance or shared value,
    then examine whether its repetition supports memory, identity and practical conduct.
  why_recommended: Create or freely adopt a meaningful sequence for a transition, remembrance or shared
    value, then examine whether its repetition supports memory, identity and practical conduct.
  claims:
  - statement: Create or freely adopt a meaningful sequence for a transition, remembrance or shared value,
      then examine whether its repetition supports memory, identity and practical conduct.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Ritual, remembrance, and sacred time practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Ritual, remembrance, and sacred time as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a tactile cue, a brief written line or a silent accessible pause. For
    grief or repentance, choose a manageable event or defer; no forced disclosure, forgiveness or reenactment
    belongs here. A familiar religious ritual may be used within its community's rules and your conscience.
  opportunity_considerations: 'The default is a weekly closing ritual using an ordinary object you own:
    set it down, name one received good, acknowledge one unfinished matter, state one next action, then
    begin a short period of rest. No flame, food restriction, purchase, sacred object or public performance
    is required. Use private notes if speaking aloud is unsuitable.'
  prerequisites:
  - 'The default is a weekly closing ritual using an ordinary object you own: set it down, name one received
    good, acknowledge one unfinished matter, state one next action, then begin a short period of rest.
    No flame, food restriction, purchase, sacred object or public performance is required. Use private
    notes if speaking aloud is unsuitable.'
  dependencies: []
  safe_alternatives:
  - Use a tactile cue, a brief written line or a silent accessible pause. For grief or repentance, choose
    a manageable event or defer; no forced disclosure, forgiveness or reenactment belongs here. A familiar
    religious ritual may be used within its community's rules and your conscience.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Ritual, remembrance, and sacred time differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Ritual, remembrance, and sacred
    time as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'The default is a weekly closing ritual using an ordinary object you own: set it down, name one
    received good, acknowledge one unfinished matter, state one next action, then begin a short period
    of rest. No flame, food restriction, purchase, sacred object or public performance is required. Use
    private notes if speaking aloud is unsuitable. Goal: Create or freely adopt a meaningful sequence
    for a transition, remembrance or shared value, then examine whether its repetition supports memory,
    identity and practical conduct. Scope: Beginnings, endings, grief, gratitude, rest, commitment, repentance,
    celebration and belonging have different purposes. One appropriate ritual is practiced; painful loss
    or religious obligation need not be introduced to cover every possible use. Time and effort: About
    20 minutes to prepare, two five-minute occasions and a 15-minute review. Adaptation: Use a tactile
    cue, a brief written line or a silent accessible pause. For grief or repentance, choose a manageable
    event or defer; no forced disclosure, forgiveness or reenactment belongs here. A familiar religious
    ritual may be used within its community''s rules and your conscience. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a tactile cue, a brief written line or a silent accessible pause. For grief
    or repentance, choose a manageable event or defer; no forced disclosure, forgiveness or reenactment
    belongs here. A familiar religious ritual may be used within its community's rules and your conscience.
  expected_burden: About 20 minutes to prepare, two five-minute occasions and a 15-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Ritual, remembrance, and sacred time protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Ritual, remembrance, and sacred time action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a tactile
    cue, a brief written line or a silent accessible pause. For grief or repentance, choose a manageable
    event or defer; no forced disclosure, forgiveness or reenactment belongs here. A familiar religious
    ritual may be used within its community's rules and your conscience.
  actions:
  - stable_id: PRACTICE-COMP-0309-RITUAL-REMEMBRANCE-AND-SACRED-TIME-01-A1
    sequence: 1
    title: Give each part of the sequence a purpose
    instructions: 'Choose a real beginning, ending or recurring pause. Briefly distinguish remembering
      a loss, expressing thanks, making repair, celebrating, belonging and committing: they ask different
      things of a ritual. For the default, map the object to an ending, thanks to remembrance, the unfinished
      matter to honesty, the next action to commitment and the final pause to rest. State when the ritual
      starts and ends and what it does not promise. If borrowing a tradition''s form, verify that it is
      appropriate for you to use; otherwise keep the supplied ordinary sequence.


      Observation checks: The occasion and purpose are specific; Each chosen element has an intelligible
      meaning; Different ritual purposes are not collapsed together; Use of objects and any borrowed form
      is appropriate. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0309-RITUAL-REMEMBRANCE-AND-SACRED-TIME-01
      action_stable_id: PRACTICE-COMP-0309-RITUAL-REMEMBRANCE-AND-SACRED-TIME-01-A1
      competency_stable_id: '03.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0309_a1_primary
      transfer_disposition: context_bound
      measurements:
