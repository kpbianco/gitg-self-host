  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Reverence and the sacred explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Reverence and the sacred context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Reverence and the sacred observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Reverence and the sacred rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
