    A particular object of reverence and reason are identified; The chosen pathway is distinguished from
    required belief; Appropriate conduct is specified; Other people retain consent and interpretive freedom.
    Action 2: Attend sincerely while keeping observation and meaning separate. Observed checks: Three
    details come from an actual encounter; A remaining question is acknowledged; Feeling and explanation
