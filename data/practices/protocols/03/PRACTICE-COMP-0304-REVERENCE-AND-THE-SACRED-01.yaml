meaning_and_fit:
  purpose: Recognize what merits reverent attention and respond with care while retaining conscience,
    factual judgment and respect for people who understand sacredness differently.
  why_recommended: Recognize what merits reverent attention and respond with care while retaining conscience,
    factual judgment and respect for people who understand sacredness differently.
  claims:
  - statement: Recognize what merits reverent attention and respond with care while retaining conscience,
      factual judgment and respect for people who understand sacredness differently.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Reverence and the sacred practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Reverence and the sacred as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use familiar music, a described object, a tactile item you own or an accessible
    view. No contact with sacred objects, restricted practices, wildlife or unwilling people is required.
    If nothing feels reverent, honest attention can be observed without claiming awe; this pathway may
    also be unchosen.
  opportunity_considerations: 'Use something safely accessible: a plant, the sky through a window, a piece
    of music you may play, an inherited object, or a freely chosen familiar ritual. The default is observing
    an ordinary plant without touching or removing it. No special journey, purchase, emotional response
    or religious assent is needed.'
  prerequisites:
  - 'Use something safely accessible: a plant, the sky through a window, a piece of music you may play,
    an inherited object, or a freely chosen familiar ritual. The default is observing an ordinary plant
    without touching or removing it. No special journey, purchase, emotional response or religious assent
    is needed.'
  dependencies: []
  safe_alternatives:
  - Use familiar music, a described object, a tactile item you own or an accessible view. No contact with
    sacred objects, restricted practices, wildlife or unwilling people is required. If nothing feels reverent,
    honest attention can be observed without claiming awe; this pathway may also be unchosen.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Reverence and the sacred differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Reverence and the sacred as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use something safely accessible: a plant, the sky through a window, a piece of music you may
    play, an inherited object, or a freely chosen familiar ritual. The default is observing an ordinary
    plant without touching or removing it. No special journey, purchase, emotional response or religious
    assent is needed. Goal: Recognize what merits reverent attention and respond with care while retaining
    conscience, factual judgment and respect for people who understand sacredness differently. Scope:
    Life, nature, persons, ritual, truth, beauty and what is held holy are possible objects of reverence,
    not a required belief list. One chosen encounter tests sincere attention and conduct; it cannot establish
    the truth of a sacred claim. Time and effort: Three short sessions of about 15 minutes, including
    one ordinary encounter and a later care action. Adaptation: Use familiar music, a described object,
    a tactile item you own or an accessible view. No contact with sacred objects, restricted practices,
    wildlife or unwilling people is required. If nothing feels reverent, honest attention can be observed
    without claiming awe; this pathway may also be unchosen. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use familiar music, a described object, a tactile item you own or an accessible
    view. No contact with sacred objects, restricted practices, wildlife or unwilling people is required.
    If nothing feels reverent, honest attention can be observed without claiming awe; this pathway may
    also be unchosen.
  expected_burden: Three short sessions of about 15 minutes, including one ordinary encounter and a later
    care action.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Reverence and the sacred protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Reverence and the sacred action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use familiar
    music, a described object, a tactile item you own or an accessible view. No contact with sacred objects,
    restricted practices, wildlife or unwilling people is required. If nothing feels reverent, honest
    attention can be observed without claiming awe; this pathway may also be unchosen.
  actions:
  - stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01-A1
    sequence: 1
    title: Name what deserves attention and what respect requires
    instructions: 'Consider the seven possibilities in the scope and choose one that matters to you. Describe
      what you value about this particular example rather than calling everything sacred. For the plant,
      consider its living processes and dependence on its surroundings. State appropriate conduct: observe
      without damage, follow access rules, and leave other people''s interpretation free. If the object
      involves a person or tradition, distinguish your admiration from permission to photograph, touch,
      imitate or demand disclosure.


      Observation checks: A particular object of reverence and reason are identified; The chosen pathway
      is distinguished from required belief; Appropriate conduct is specified; Other people retain consent
      and interpretive freedom. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01
      action_stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01-A1
      competency_stable_id: '03.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0304_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0304_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_particular_object_of_reverence_and_reason_are_identified
        - the_chosen_pathway_is_distinguished_from_required_belief
        - appropriate_conduct_is_specified
        - other_people_retain_consent_and_interpretive_freedom
      - measurement_id: c0304_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0304_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01-A2
    sequence: 2
    title: Attend sincerely while keeping observation and meaning separate
    instructions: 'Spend five comfortable minutes with the chosen example. Notice three concrete details
      and one question you cannot answer. Describe any awe, gratitude, indifference or discomfort without
      forcing it. Then add your interpretation separately: for instance, the branching leaf pattern prompted
      care for living things, but did not prove a supernatural account. If a claim conflicts with evidence
      or conscience, record the disagreement while behaving respectfully; sincerity does not require saying
      something you believe false.


      Observation checks: Three details come from an actual encounter; A remaining question is acknowledged;
      Feeling and explanation are recorded separately; Respectful conduct preserves factual and conscientious
      judgment. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01
      action_stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01-A2
      competency_stable_id: '03.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0304_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0304_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_details_come_from_an_actual_encounter
        - a_remaining_question_is_acknowledged
        - feeling_and_explanation_are_recorded_separately
        - respectful_conduct_preserves_factual_and_conscientious_judgment
      - measurement_id: c0304_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0304_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01-A3
    sequence: 3
    title: Carry the attention into one proportionate act of care
    instructions: 'Within two days, take a small action that follows from the value you named: care correctly
      for your own plant, avoid damaging a shared place, listen attentively to a willing person, or return
      a meaningful object to its proper place. For the default, leave the plant undisturbed and improve
      care of something you are responsible for. Review whether the action served that good or mainly
      displayed your own sensitivity. State how someone who holds nothing holy in the same way still deserves
      equal respect.


      Observation checks: A proportionate care action is actually taken; The action relates to the stated
      value; Care and self-display are distinguished; Respect extends to people outside the chosen pathway.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Did attention change how you treated something, and could you retain that care without
      forcing your interpretation on others?


      Examples: Supportive: The participant noticed details of a plant, left its meaning open, and changed
      how they cared for a living thing in their responsibility.


      Mixed: The encounter felt ordinary rather than moving, but the participant still acted carefully
      and reported the lack of awe.


      Contradictory: A moving experience was used to overrule another person''s conscience, claim unsupported
      truth or damage a place while seeking a dramatic photograph.


      Inconclusive: A value was named without an actual attentive encounter or any related conduct.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01
      action_stable_id: PRACTICE-COMP-0304-REVERENCE-AND-THE-SACRED-01-A3
      competency_stable_id: '03.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
