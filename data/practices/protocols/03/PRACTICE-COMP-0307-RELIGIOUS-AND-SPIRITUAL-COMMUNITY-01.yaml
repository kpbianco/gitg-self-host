  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Religious and spiritual community; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - A suitable online group may offer a small accessible task. If no safe community is available, use
      a fictional open reading circle to prepare questions and boundaries; leave live contribution and
      participation checks unmarked. No travel, donation, doctrinal assent, private interview or contact
      with an unsafe group is required.
    cultural_context:
    - Adapt the expression of Religious and spiritual community to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - A suitable online group may offer a small accessible task. If no safe community is available, use
      a fictional open reading circle to prepare questions and boundaries; leave live contribution and
      participation checks unmarked. No travel, donation, doctrinal assent, private interview or contact
      with an unsafe group is required.
  pause_conditions:
  - Pause Religious and spiritual community when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Religious and spiritual community practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Religious and spiritual community situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Religious and spiritual community actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0307_a1_primary
  - c0307_a1_boundary
  - c0307_a1_adverse
  - c0307_a2_primary
  - c0307_a2_boundary
  - c0307_a2_adverse
  - c0307_a3_primary
  - c0307_a3_boundary
  - c0307_a3_adverse
  adverse_or_contradictory_indicators:
  - Help was treated as consent to escalating demands, or a boundary was framed as disloyalty or spiritual
    inferiority.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Religious and spiritual community explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Religious and spiritual community context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Religious and spiritual community observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Religious and spiritual community rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Learn how this community practices care and accountability. Observed
    checks: Shared practice care and celebration have concrete examples; An accountability route or its
    absence is identified; Visitor participation and a contribution are agreed; A personal limit and exit
    option are explicit. Action 2: Make a useful contribution without purchasing belonging. Observed checks:
    An agreed contribution is actually made; A shared practice is joined or explicitly observed; An ordinary
    correction or care interaction is noticed; Time and personal boundaries remain intact. Action 3: Decide
    whether further participation is warranted. Observed checks: Stated values and observed conduct are
    compared; A strength and concern or unknown are retained; The treatment of a boundary is reviewed;
    Further participation has a reasoned voluntary decision.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A group was researched but no agreed contribution or
    shared practice was experienced.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Religious
    and spiritual community contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
