  - stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01-A1
    sequence: 1
    title: Identify the non-emergency boundary for Religious and spiritual community
    instructions: 'Define one planning-only question for Religious and spiritual community, the hazards
      that must not be rehearsed, and the local qualified or emergency authority that supersedes this
