meaning_and_fit:
  purpose: Take part in a freely chosen community's shared practice, service, care and accountability,
    then examine whether belonging and celebration coexist with boundaries against coercion.
  why_recommended: Take part in a freely chosen community's shared practice, service, care and accountability,
    then examine whether belonging and celebration coexist with boundaries against coercion.
  claims:
  - statement: Take part in a freely chosen community's shared practice, service, care and accountability,
      then examine whether belonging and celebration coexist with boundaries against coercion.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Religious and spiritual community practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Religious and spiritual community as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: A suitable online group may offer a small accessible task. If no safe community
    is available, use a fictional open reading circle to prepare questions and boundaries; leave live
    contribution and participation checks unmarked. No travel, donation, doctrinal assent, private interview
    or contact with an unsafe group is required.
  opportunity_considerations: Choose an existing community you can approach safely, such as a faith group,
    meditation circle, philosophical discussion group or mutual-care gathering. The default contribution
    is helping prepare or restore the space for an open gathering after asking the organizer. Confirm
    visitor access, an exit route and that participation does not require a donation, confession, private
    disclosure or agreement you do not hold.
  prerequisites:
  - Choose an existing community you can approach safely, such as a faith group, meditation circle, philosophical
    discussion group or mutual-care gathering. The default contribution is helping prepare or restore
    the space for an open gathering after asking the organizer. Confirm visitor access, an exit route
    and that participation does not require a donation, confession, private disclosure or agreement you
    do not hold.
  dependencies: []
  safe_alternatives:
  - A suitable online group may offer a small accessible task. If no safe community is available, use
    a fictional open reading circle to prepare questions and boundaries; leave live contribution and participation
    checks unmarked. No travel, donation, doctrinal assent, private interview or contact with an unsafe
    group is required.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Religious and spiritual community differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Religious and spiritual community
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an existing community you can approach safely, such as a faith group, meditation circle,
    philosophical discussion group or mutual-care gathering. The default contribution is helping prepare
    or restore the space for an open gathering after asking the organizer. Confirm visitor access, an
    exit route and that participation does not require a donation, confession, private disclosure or agreement
    you do not hold. Goal: Take part in a freely chosen community''s shared practice, service, care and
    accountability, then examine whether belonging and celebration coexist with boundaries against coercion.
    Scope: One community contact and contribution can begin participation; they do not establish a trustworthy
    institution or lasting belonging. A secular ethical or contemplative community is a legitimate chosen
    pathway, and declining community participation remains possible. Time and effort: About 20 minutes
    of preparation, an agreed small contribution of up to 30 minutes, and a 15-minute review. Adaptation:
    A suitable online group may offer a small accessible task. If no safe community is available, use
    a fictional open reading circle to prepare questions and boundaries; leave live contribution and participation
    checks unmarked. No travel, donation, doctrinal assent, private interview or contact with an unsafe
    group is required. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A suitable online group may offer a small accessible task. If no safe community
    is available, use a fictional open reading circle to prepare questions and boundaries; leave live
    contribution and participation checks unmarked. No travel, donation, doctrinal assent, private interview
    or contact with an unsafe group is required.
  expected_burden: About 20 minutes of preparation, an agreed small contribution of up to 30 minutes,
    and a 15-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Religious and spiritual community protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Religious and spiritual community action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A suitable
    online group may offer a small accessible task. If no safe community is available, use a fictional
    open reading circle to prepare questions and boundaries; leave live contribution and participation
    checks unmarked. No travel, donation, doctrinal assent, private interview or contact with an unsafe
    group is required.
  actions:
  - stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01-A1
    sequence: 1
    title: Learn how this community practices care and accountability
    instructions: 'Use public information or a voluntary brief question to learn the gathering''s purpose,
      a shared practice, how help is requested, how achievements or important occasions are marked, and
      where concerns can be raised. Ask what a newcomer may join or observe. Write one contribution you
      can genuinely offer and one limit, such as leaving after the agreed time. Treat an unanswered accountability
      question as missing information. Pressure for secrecy, isolation or personal access is a reason
      to pause, not a test of devotion.


      Observation checks: Shared practice care and celebration have concrete examples; An accountability
      route or its absence is identified; Visitor participation and a contribution are agreed; A personal
      limit and exit option are explicit. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01
      action_stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01-A1
      competency_stable_id: '03.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0307_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0307_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - shared_practice_care_and_celebration_have_concrete_examples
        - an_accountability_route_or_its_absence_is_identified
        - visitor_participation_and_a_contribution_are_agreed
        - a_personal_limit_and_exit_option_are_explicit
      - measurement_id: c0307_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0307_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01-A2
    sequence: 2
    title: Make a useful contribution without purchasing belonging
    instructions: 'Carry out the agreed bounded help, such as setting out permitted materials or restoring
      the room. Ask how the work should be done and accept an ordinary correction when sound. Join or
      respectfully observe one permitted shared practice, and notice how participants acknowledge effort
      or care for someone who needs help. Do not record identifying details. Keep the promised time limit;
      contribution is not consent to membership, proselytizing, unpaid ongoing work or another person''s
      authority over your life.


      Observation checks: An agreed contribution is actually made; A shared practice is joined or explicitly
      observed; An ordinary correction or care interaction is noticed; Time and personal boundaries remain
      intact. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01
      action_stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01-A2
      competency_stable_id: '03.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0307_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0307_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_agreed_contribution_is_actually_made
        - a_shared_practice_is_joined_or_explicitly_observed
        - an_ordinary_correction_or_care_interaction_is_noticed
        - time_and_personal_boundaries_remain_intact
      - measurement_id: c0307_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0307_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01-A3
    sequence: 3
    title: Decide whether further participation is warranted
    instructions: 'Compare what the group said with what you observed about welcome, care, celebration
      and accountability. Record one appreciated feature, one concern or unknown, and the response to
      your stated limit. If appropriate, ask one modest clarifying question or offer factual feedback
      through the stated route; do not confront a coercive situation. Choose return, a smaller role, another
      community or no further contact. A warm welcome is not proof of safety, and discomfort with an unfamiliar
      form is not by itself proof of abuse.


      Observation checks: Stated values and observed conduct are compared; A strength and concern or unknown
      are retained; The treatment of a boundary is reviewed; Further participation has a reasoned voluntary
      decision. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Was the contribution useful, could you say no, and what evidence supports the amount
      of trust you are considering next?


      Examples: Supportive: The visitor helped restore a room, observed a shared reading, received a clear
      answer about concerns and left at the agreed time without pressure.


      Mixed: The group was welcoming and the task useful, but its accountability route remained unclear
      and further commitment was deferred.


      Contradictory: Help was treated as consent to escalating demands, or a boundary was framed as disloyalty
      or spiritual inferiority.


      Inconclusive: A group was researched but no agreed contribution or shared practice was experienced.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01
      action_stable_id: PRACTICE-COMP-0307-RELIGIOUS-AND-SPIRITUAL-COMMUNITY-01-A3
