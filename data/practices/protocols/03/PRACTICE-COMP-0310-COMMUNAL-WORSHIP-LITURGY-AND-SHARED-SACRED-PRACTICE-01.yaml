  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Communal worship, liturgy, and shared sacred practice; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Use an accessible online gathering if participation and privacy expectations are clear. The consented
      ten-minute fallback needs no travel, money, sacred language or disclosure of recent loss. With no
      willing companion or suitable group, prepare the map but leave communal participation untested;
      observing a recording is not a live shared occasion.
    cultural_context:
    - Adapt the expression of Communal worship, liturgy, and shared sacred practice to direct or indirect
      communication, collective or individual decision structures, local norms, faith or secular commitments,
      and role obligations while preserving consent and dignity.
    resource_variants:
    - Use an accessible online gathering if participation and privacy expectations are clear. The consented
      ten-minute fallback needs no travel, money, sacred language or disclosure of recent loss. With no
      willing companion or suitable group, prepare the map but leave communal participation untested;
      observing a recording is not a live shared occasion.
  pause_conditions:
  - Pause Communal worship, liturgy, and shared sacred practice when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Communal worship, liturgy, and shared sacred practice practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Communal worship, liturgy, and shared sacred practice situation
    exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
