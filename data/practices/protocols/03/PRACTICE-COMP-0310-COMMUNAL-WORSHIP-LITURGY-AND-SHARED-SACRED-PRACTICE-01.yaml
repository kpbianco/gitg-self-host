  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Communal worship, liturgy, and shared sacred practice explicitly; support can enable access and
    never reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Communal worship, liturgy, and shared
    sacred practice context, action, role, pathway, and assessment epoch; it does not establish cross-context
    reliability.
  repetition_rule: Each Communal worship, liturgy, and shared sacred practice observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Communal worship, liturgy, and shared sacred practice rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can participate with understanding and sincerity while respecting conscience, safety, and the
    freedom of others.—not completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Communal worship, liturgy, and shared sacred practice requires
    a bounded context, allowlisted observations, provenance, contradiction and adverse handling, and preserved
    uncertainty; free text and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Communal worship,
    liturgy, and shared sacred practice evidence only under offline typed evaluation; protocol performance
    remains distinct and is never counted twice.
