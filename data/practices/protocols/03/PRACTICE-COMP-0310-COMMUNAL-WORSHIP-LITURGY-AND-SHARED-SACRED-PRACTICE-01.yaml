        expected: true
  - stable_id: PRACTICE-COMP-0310-COMMUNAL-WORSHIP-LITURGY-AND-SHARED-SACRED-PRACTICE-01-A2
    sequence: 2
    title: Take part only in what you can sincerely undertake
    instructions: 'Attend the suitable gathering or hold the agreed fallback. Follow visitor guidance,
      join only permitted and freely endorsed elements, and decline words or acts you cannot sincerely
      affirm. For the fallback, acknowledge why the shared subject matters, each offer an optional specific
      recollection, pause quietly and name one modest act of care before closing. Notice the other person''s
      freedom and contribution. Do not photograph, record, evaluate devotion or turn the event into a
      test of someone else''s belief. Record observer status honestly if you only watched.


      Observation checks: An actual communal occasion takes place; Participation or observation is described
      accurately; Endorsed elements are undertaken sincerely; Other people retain privacy and freedom
      to decline. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0310-COMMUNAL-WORSHIP-LITURGY-AND-SHARED-SACRED-PRACTICE-01
      action_stable_id: PRACTICE-COMP-0310-COMMUNAL-WORSHIP-LITURGY-AND-SHARED-SACRED-PRACTICE-01-A2
      competency_stable_id: '03.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
