        - words_gestures_and_leadership_have_an_understood_purpose
        - eligibility_and_an_honest_role_are_established
        - consent_access_and_leaving_are_considered_in_advance
      - measurement_id: c0310_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
