  - stable_id: PRACTICE-COMP-0310-COMMUNAL-WORSHIP-LITURGY-AND-SHARED-SACRED-PRACTICE-01-A3
    sequence: 3
    title: Relate the experience to community and later conduct
    instructions: 'Afterwards, explain how one actual element connected the individual to the community''s
      story, commitments or sacred meaning. Distinguish what you understood, what you did and what you
      still question. Ask one respectful question through an appropriate willing person if clarification
      is useful. Within two days, carry out the modest act of care or responsibility you endorsed; if
      none was promised, choose one consistent with the form''s meaning. Decide whether future participation
      fits your conscience and circumstances without ranking other pathways.


      Observation checks: An experienced element is connected to shared meaning; Understanding action
      and remaining questions are distinguished; A related ordinary responsibility receives an attempt;
      Future participation remains a conscientious choice. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What did you understand and sincerely join, how did it locate you in a shared story,
      and what freedom did you preserve for yourself and others?


      Examples: Supportive: Two willing people used the plainly named remembrance, shared a specific story,
      honored silence and later carried out a modest care commitment.


      Mixed: A visitor understood the gathering better but chose to observe a restricted element and kept
      that limit explicit.


      Contradictory: Participation required a false profession of belief, a restricted rite was imitated
      without permission or another person''s conscience was dismissed.


      Inconclusive: A video was watched alone and then recorded as evidence of taking part in a live communal
      practice.'
