meaning_and_fit:
  purpose: Understand a community's chosen form of worship or remembrance, participate in an eligible
    and sincere way, and relate the experience to its tradition while preserving conscience and others'
    freedom.
  why_recommended: Understand a community's chosen form of worship or remembrance, participate in an eligible
    and sincere way, and relate the experience to its tradition while preserving conscience and others'
    freedom.
  claims:
  - statement: Understand a community's chosen form of worship or remembrance, participate in an eligible
      and sincere way, and relate the experience to its tradition while preserving conscience and others'
      freedom.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Communal worship, liturgy, and shared sacred practice
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Communal worship, liturgy, and shared sacred practice as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use an accessible online gathering if participation and privacy expectations
    are clear. The consented ten-minute fallback needs no travel, money, sacred language or disclosure
    of recent loss. With no willing companion or suitable group, prepare the map but leave communal participation
    untested; observing a recording is not a live shared occasion.
  opportunity_considerations: Choose an open, familiar and freely endorsed communal service, recitation,
    shared silence or remembrance. Ask or read what visitors may do, its meaning, access needs and how
    to leave. A secular shared remembrance is suitable when that is your pathway. The supplied fallback
    below is a new shared remembrance with a willing companion, explicitly a small chosen form rather
    than membership in an established tradition.
  prerequisites:
  - Choose an open, familiar and freely endorsed communal service, recitation, shared silence or remembrance.
    Ask or read what visitors may do, its meaning, access needs and how to leave. A secular shared remembrance
    is suitable when that is your pathway. The supplied fallback below is a new shared remembrance with
    a willing companion, explicitly a small chosen form rather than membership in an established tradition.
  dependencies: []
  safe_alternatives:
  - Use an accessible online gathering if participation and privacy expectations are clear. The consented
    ten-minute fallback needs no travel, money, sacred language or disclosure of recent loss. With no
    willing companion or suitable group, prepare the map but leave communal participation untested; observing
    a recording is not a live shared occasion.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Communal worship, liturgy, and shared sacred practice differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Communal worship, liturgy,
    and shared sacred practice as inferiority; competing reasonable interpretations and conscientious
    refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an open, familiar and freely endorsed communal service, recitation, shared silence or
    remembrance. Ask or read what visitors may do, its meaning, access needs and how to leave. A secular
    shared remembrance is suitable when that is your pathway. The supplied fallback below is a new shared
    remembrance with a willing companion, explicitly a small chosen form rather than membership in an
    established tradition. Goal: Understand a community''s chosen form of worship or remembrance, participate
    in an eligible and sincere way, and relate the experience to its tradition while preserving conscience
    and others'' freedom. Scope: One permitted communal form is practiced, not every sacrament, pilgrimage
    or liturgy. Observation can develop understanding but remains distinct from participation. No one
    must profess belief, enter a restricted rite or convert to complete a checklist. Time and effort:
    About 20 minutes of preparation, a suitable short gathering or segment, and a 15-minute review; defer
    if no fitting occasion is available. Adaptation: Use an accessible online gathering if participation
    and privacy expectations are clear. The consented ten-minute fallback needs no travel, money, sacred
    language or disclosure of recent loss. With no willing companion or suitable group, prepare the map
    but leave communal participation untested; observing a recording is not a live shared occasion. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible online gathering if participation and privacy expectations are
    clear. The consented ten-minute fallback needs no travel, money, sacred language or disclosure of
    recent loss. With no willing companion or suitable group, prepare the map but leave communal participation
    untested; observing a recording is not a live shared occasion.
  expected_burden: About 20 minutes of preparation, a suitable short gathering or segment, and a 15-minute
    review; defer if no fitting occasion is available.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Communal worship, liturgy, and shared sacred practice protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Communal worship, liturgy, and shared sacred practice action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    online gathering if participation and privacy expectations are clear. The consented ten-minute fallback
    needs no travel, money, sacred language or disclosure of recent loss. With no willing companion or
    suitable group, prepare the map but leave communal participation untested; observing a recording is
    not a live shared occasion.
  actions:
  - stable_id: PRACTICE-COMP-0310-COMMUNAL-WORSHIP-LITURGY-AND-SHARED-SACRED-PRACTICE-01-A1
    sequence: 1
    title: Understand what participation means before joining
    instructions: 'Identify the gathering''s tradition or shared story, the purpose of its words and gestures,
      who leads, and which parts require belief, preparation or membership. Choose your honest role: eligible
      participant, respectful observer or decline. For the fallback, invite a willing companion to a ten-minute
      remembrance of a shared teacher, place or event: explain an opening acknowledgment, optional shared
      recollections, one quiet pause and a closing commitment to care. Both people choose the subject
      and can omit any part. Do not label this invented form as another tradition''s rite.


      Observation checks: The form has an identified tradition or honestly named shared story; Words gestures
      and leadership have an understood purpose; Eligibility and an honest role are established; Consent
      access and leaving are considered in advance. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0310-COMMUNAL-WORSHIP-LITURGY-AND-SHARED-SACRED-PRACTICE-01
      action_stable_id: PRACTICE-COMP-0310-COMMUNAL-WORSHIP-LITURGY-AND-SHARED-SACRED-PRACTICE-01-A1
      competency_stable_id: '03.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0310_a1_primary
      transfer_disposition: context_bound
      measurements:
