completion_and_review:
  completion_criteria:
  - The choose a declared frame for communal worship, liturgy, and shared sacred practice action was attempted
    or explicitly deferred.
  - The complete two bounded communal worship, liturgy, and shared sacred practice practices action was
    attempted or explicitly deferred.
  - The interpret the communal worship, liturgy, and shared sacred practice experience modestly action
    preserved a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0310_a1_primary
    - c0310_a2_primary
    - c0310_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Communal worship, liturgy, and shared sacred practice only when
    the initial context remained safe, the evidence criteria were usable, burden was acceptable, and a
    new context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Communal worship, liturgy, and shared sacred
    practice across roles, cultures, relationships, seasons, stress levels, disability states, institutions,
    or high-consequence settings.
  reflection:
    before: What does Communal worship, liturgy, and shared sacred practice require in this exact context,
      what remains outside my role or authority, and which scope sentence or evidence criterion will keep
      the practice honest?
    during: Which observable Communal worship, liturgy, and shared sacred practice criterion is present,
      absent, mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can participate with understanding and sincerity while respecting
      conscience, safety, and the freedom of others.', what contradiction or missing context matters most,
      and should this Communal worship, liturgy, and shared sacred practice design be repeated, adapted,
      deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Communal worship, liturgy, and shared sacred practice design only
      when the context and burden remain appropriate.
    adapt: Change the Communal worship, liturgy, and shared sacred practice medium, scope, support, timing,
      criteria, or context while preserving provenance and the narrower evidence claim.
    stop: Stop Communal worship, liturgy, and shared sacred practice when the practice becomes coercive,
      unsafe, privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Communal worship, liturgy, and shared
      sacred practice questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Communal worship, liturgy, and shared sacred practice criteria were observed
      with provenance and no adverse boundary signal in the selected context.
    mixed: Some Communal worship, liturgy, and shared sacred practice criteria were observed while burden,
      support, contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Communal worship, liturgy, and shared sacred
      practice criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Communal worship, liturgy, and shared sacred practice action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
