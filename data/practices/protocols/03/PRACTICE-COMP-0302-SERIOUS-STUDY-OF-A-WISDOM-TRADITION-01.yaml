  - c0302_a3_adverse
  adverse_or_contradictory_indicators:
  - The Serious study of a wisdom tradition action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Serious study of a wisdom tradition criterion, depended on
    coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Serious study of a wisdom tradition explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Serious study of a wisdom tradition context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Serious study of a wisdom tradition observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Serious study of a wisdom tradition rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can explain at least one tradition from the inside and distinguish it from popular caricature.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Serious study of a wisdom tradition requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Serious study
    of a wisdom tradition evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L03
  - L15
  - L31
  minimum_evidence_before_state_update: No current-state update is permitted for this Serious study of
    a wisdom tradition draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Serious study of a wisdom tradition evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The choose a declared frame for serious study of a wisdom tradition action was attempted or explicitly
    deferred.
  - The complete two bounded serious study of a wisdom tradition practices action was attempted or explicitly
    deferred.
  - The interpret the serious study of a wisdom tradition experience modestly action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0302_a1_primary
    - c0302_a2_primary
    - c0302_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Serious study of a wisdom tradition only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Serious study of a wisdom tradition across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Serious study of a wisdom tradition require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Serious study of a wisdom tradition criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can explain at least one tradition from the inside and distinguish
      it from popular caricature.', what contradiction or missing context matters most, and should this
      Serious study of a wisdom tradition design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Serious study of a wisdom tradition design only when the context and
      burden remain appropriate.
    adapt: Change the Serious study of a wisdom tradition medium, scope, support, timing, criteria, or
      context while preserving provenance and the narrower evidence claim.
    stop: Stop Serious study of a wisdom tradition when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Serious study of a wisdom tradition questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Serious study of a wisdom tradition criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Serious study of a wisdom tradition criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Serious study of a wisdom tradition criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Serious study of a wisdom tradition action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
