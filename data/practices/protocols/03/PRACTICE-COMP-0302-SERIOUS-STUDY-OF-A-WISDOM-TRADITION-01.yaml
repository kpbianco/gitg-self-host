  dependencies: []
  safe_alternatives:
  - Use text to speech or divide the named sections into short readings. If source access fails, use the
    included summaries only for orientation and leave primary-text and community-study checks unmarked
    until the sources are available; do not invent a substitute quotation. No visit, membership, donation
    or assent is needed.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Serious study of a wisdom tradition differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Serious study of a wisdom
    tradition as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the linked Enchiridion sections 1, 17 and 31; Marcus Aurelius, Meditations Book One, opening
    entries through Rusticus; and Modern Stoicism''s About Us page. The numbered passages and prompts
    below define the unit. Paper or spoken notes suffice. Another chosen tradition needs an accessible
    primary passage, historical context, an exemplar and a self-described living community before substitution;
    otherwise use this default. Goal: Build an account of one tradition from primary passages, historical
    setting, an exemplar, practice, internal differences and a present community''s own account. Scope:
    This is a small study unit, not completion of a tradition. The default examines ancient Stoic texts
    and a contemporary organization; one organization never represents all adherents. Study does not require
    adopting the beliefs. Time and effort: Three study sessions of about 25 minutes over a week; allow
    more time or split the reading if needed. Adaptation: Use text to speech or divide the named sections
    into short readings. If source access fails, use the included summaries only for orientation and leave
    primary-text and community-study checks unmarked until the sources are available; do not invent a
    substitute quotation. No visit, membership, donation or assent is needed. Keep personal working notes
    outside the check-in; record only the listed observations.


    Reference support:

    Enchiridion: sections 1, 17 and 31: https://classics.mit.edu/Epictetus/epicench.html

    Meditations: Book One, opening entries through Rusticus: https://classics.mit.edu/Antoninus/meditations.1.one.html

    About Modern Stoicism: https://modernstoicism.com/about-us/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text to speech or divide the named sections into short readings. If source
    access fails, use the included summaries only for orientation and leave primary-text and community-study
    checks unmarked until the sources are available; do not invent a substitute quotation. No visit, membership,
    donation or assent is needed.
  expected_burden: Three study sessions of about 25 minutes over a week; allow more time or split the
    reading if needed.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Serious study of a wisdom tradition protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Serious study of a wisdom tradition action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text to
    speech or divide the named sections into short readings. If source access fails, use the included
    summaries only for orientation and leave primary-text and community-study checks unmarked until the
    sources are available; do not invent a substitute quotation. No visit, membership, donation or assent
    is needed.
  actions:
  - stable_id: PRACTICE-COMP-0302-SERIOUS-STUDY-OF-A-WISDOM-TRADITION-01-A1
    sequence: 1
    title: Read a primary passage inside its setting
    instructions: 'Read the three Enchiridion sections and the opening Meditations entries. Record author,
      work and section so you can find each again. Contrast the handbook''s counsel about choice, assigned
      roles and providential gods with Marcus''s acknowledgments of teachers and family. Locate the ancient
      texts before the contemporary organization in a simple timeline; use the archive''s dating as an
      approximate guide. In your own words, explain what kind of life these selected passages commend
      and what conception of the world supports it. Mark an unfamiliar term instead of silently translating
      it into a modern slogan.


      Observation checks: Primary passages have retrievable locations; Ancient and contemporary settings
      are distinguished; A way of life and its underlying view are connected; An unfamiliar term or assumption
      is investigated. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0302-SERIOUS-STUDY-OF-A-WISDOM-TRADITION-01
      action_stable_id: PRACTICE-COMP-0302-SERIOUS-STUDY-OF-A-WISDOM-TRADITION-01-A1
      competency_stable_id: '03.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0302_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0302_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - primary_passages_have_retrievable_locations
        - ancient_and_contemporary_settings_are_distinguished
        - a_way_of_life_and_its_underlying_view_are_connected
        - an_unfamiliar_term_or_assumption_is_investigated
      - measurement_id: c0302_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0302_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0302-SERIOUS-STUDY-OF-A-WISDOM-TRADITION-01-A2
    sequence: 2
    title: Test an interpretation through a modest practice
    instructions: 'Use Marcus''s account of Rusticus as the selected exemplar: careful reading and accepting
      correction matter more than displaying learned words. Re-read one passage and correct your first
      interpretation using its actual wording. Then try one ordinary action inspired by the texts, such
      as preparing a clear request while leaving the other person''s reply to them. Record what you did
      and whether it served the stated purpose. Do not adopt ancient claims about illness, enslavement
      or obedience as instructions to dismiss suffering or tolerate abuse; explain that interpretive limit
      explicitly.


      Observation checks: An exemplar is connected to a concrete teaching; The first interpretation is
      checked against the passage; An ordinary practice receives an actual attempt; An ethical or historical
      limitation remains visible. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0302-SERIOUS-STUDY-OF-A-WISDOM-TRADITION-01
      action_stable_id: PRACTICE-COMP-0302-SERIOUS-STUDY-OF-A-WISDOM-TRADITION-01-A2
      competency_stable_id: '03.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0302_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0302_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_exemplar_is_connected_to_a_concrete_teaching
        - the_first_interpretation_is_checked_against_the_passage
        - an_ordinary_practice_receives_an_actual_attempt
        - an_ethical_or_historical_limitation_remains_visible
      - measurement_id: c0302_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0302_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0302-SERIOUS-STUDY-OF-A-WISDOM-TRADITION-01-A3
    sequence: 3
    title: Explain the tradition with its live differences intact
    instructions: 'Read Modern Stoicism''s own description of its origins, activities and range of religious
      views. Compare that contemporary range with Enchiridion 31''s providential account: identify the
      interpretive question rather than declaring them identical. Prepare a two-minute explanation with
      one primary teaching, its historical setting, an exemplar, your trial, this difference, and the
      organization''s present activities. End by correcting a caricature, such as treating Stoicism as
      simply hiding every feeling, using the selected passages. Name what further reading or a voluntary
      community conversation would need to check.


      Observation checks: A present community is described from its own account; A real interpretive difference
      is preserved; The explanation connects all six study elements; A caricature is corrected without
      claiming total expertise. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Could a beginner distinguish this account from a motivational slogan, and which claim
      would you most want a knowledgeable practitioner or scholar to correct?


      Examples: Supportive: The learner connected passage, setting, exemplar, a request they actually
      made, a disagreement over providence and a current organization''s self-description.


      Mixed: The primary passages and practice were examined, but a contemporary community''s account
      was unavailable and that part remained unverified.


      Contradictory: One modern adaptation was called the whole tradition, or an ancient prescription
      was used to excuse mistreatment without examination.


      Inconclusive: An attractive quotation was collected without its context, a practical attempt, or
      examination of interpretive differences.'
    expected_time: 15-25 minutes
    due_within_days: 10
