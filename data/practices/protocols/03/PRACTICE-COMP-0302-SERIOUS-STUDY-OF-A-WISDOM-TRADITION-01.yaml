meaning_and_fit:
  purpose: Build an account of one tradition from primary passages, historical setting, an exemplar, practice,
    internal differences and a present community's own account.
  why_recommended: Build an account of one tradition from primary passages, historical setting, an exemplar,
    practice, internal differences and a present community's own account.
  claims:
  - statement: Build an account of one tradition from primary passages, historical setting, an exemplar,
      practice, internal differences and a present community's own account.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: These selected passages connect judgments and choice with assigned roles and a providential
      account of the gods.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-EPICTETUS-ENCHIRIDION
    limitations: Historical philosophical positions, not established scientific findings. The archive
      credits Elizabeth Carter; this exercise uses the displayed edition without reproducing its wording.
      No claim that all Stoics agree or that ancient prescriptions about suffering and obedience should
      govern present conduct.
  - statement: Marcus identifies lessons received from family and teachers; the Rusticus entry includes
      careful reading and a willingness to recognize a need for correction.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-MARCUS-MEDITATIONS-BOOK-ONE
    limitations: A particular author's account of exemplars, not evidence that every claim in the text
      is accurate or that the product's study and practice unit develops virtue.
  - statement: This organization describes a project originating in 2012 and welcomes different religious
      views and interpretations within its contemporary Stoic activities.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-MODERN-STOICISM-SELF-DESCRIPTION
    limitations: The organization's own description is a primary account of its stated approach, not independent
      verification of its practices, a representation of all Stoics or endorsement of its research claims.
  applicability_question: Does a voluntary, bounded Serious study of a wisdom tradition practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Serious study of a wisdom tradition as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use text to speech or divide the named sections into short readings. If source
    access fails, use the included summaries only for orientation and leave primary-text and community-study
    checks unmarked until the sources are available; do not invent a substitute quotation. No visit, membership,
    donation or assent is needed.
  opportunity_considerations: Use the linked Enchiridion sections 1, 17 and 31; Marcus Aurelius, Meditations
    Book One, opening entries through Rusticus; and Modern Stoicism's About Us page. The numbered passages
    and prompts below define the unit. Paper or spoken notes suffice. Another chosen tradition needs an
    accessible primary passage, historical context, an exemplar and a self-described living community
    before substitution; otherwise use this default.
  prerequisites:
  - Use the linked Enchiridion sections 1, 17 and 31; Marcus Aurelius, Meditations Book One, opening entries
    through Rusticus; and Modern Stoicism's About Us page. The numbered passages and prompts below define
    the unit. Paper or spoken notes suffice. Another chosen tradition needs an accessible primary passage,
