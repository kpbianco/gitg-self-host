meaning_and_fit:
  purpose: Separate a vivid experience from claims about its meaning and integrate it through careful
    reasoning, an appropriate outside perspective, ordinary conduct and later review.
  why_recommended: Separate a vivid experience from claims about its meaning and integrate it through
    careful reasoning, an appropriate outside perspective, ordinary conduct and later review.
  claims:
  - statement: Separate a vivid experience from claims about its meaning and integrate it through careful
      reasoning, an appropriate outside perspective, ordinary conduct and later review.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Meditation can involve negative experiences; health concerns should not be managed by replacing
      appropriate care with meditation.
    classification: safety_precaution
    source_ids:
    - SRC-NCCIH-MEDITATION-SAFETY
    limitations: Supports a cautious stop-and-support boundary only. It does not establish safety or effectiveness
      of this product's short pause, classify a spiritual experience, or validate individual outcomes.
  applicability_question: Does a voluntary, bounded Mystical, ecstatic, and peak experience practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Mystical, ecstatic, and peak experience as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use the fictional case, spoken notes or a simple three-column diagram. Do
    not re-enter an upsetting state to obtain evidence. If an experience is frightening, disrupts ordinary
    functioning or seems to demand dangerous action, stop this educational exercise and seek suitable
    professional support; immediate danger needs urgent local help.
  opportunity_considerations: 'Use the supplied fictional case: after music and a striking sky, a person
    feels deeply connected to others and wonders whether they have been given a special mission. No unusual
    experience is required. A settled, non-distressing memory may replace the case if freely chosen. Do
    not seek substances, deprivation, hyperventilation, intense meditation or sensory overload.'
  prerequisites:
  - 'Use the supplied fictional case: after music and a striking sky, a person feels deeply connected
    to others and wonders whether they have been given a special mission. No unusual experience is required.
    A settled, non-distressing memory may replace the case if freely chosen. Do not seek substances, deprivation,
    hyperventilation, intense meditation or sensory overload.'
  dependencies: []
  safe_alternatives:
  - Use the fictional case, spoken notes or a simple three-column diagram. Do not re-enter an upsetting
    state to obtain evidence. If an experience is frightening, disrupts ordinary functioning or seems
    to demand dangerous action, stop this educational exercise and seek suitable professional support;
    immediate danger needs urgent local help.
  role_conditions:
  - This competency is pathway dependent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Mystical, ecstatic, and peak experience differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Mystical, ecstatic, and peak
    experience as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied fictional case: after music and a striking sky, a person feels deeply connected
    to others and wonders whether they have been given a special mission. No unusual experience is required.
    A settled, non-distressing memory may replace the case if freely chosen. Do not seek substances, deprivation,
    hyperventilation, intense meditation or sensory overload. Goal: Separate a vivid experience from claims
    about its meaning and integrate it through careful reasoning, an appropriate outside perspective,
    ordinary conduct and later review. Scope: Awe, unity, devotion, revelation and transcendence describe
    different experiences and interpretations. Intensity does not automatically establish truth or authority.
    This exercise interprets a manageable past or fictional event; it does not induce altered states or
    assess mental health. Time and effort: About 20 minutes initially, one short perspective check and
    ordinary action, then a 15-minute review after several days. Adaptation: Use the fictional case, spoken
    notes or a simple three-column diagram. Do not re-enter an upsetting state to obtain evidence. If
    an experience is frightening, disrupts ordinary functioning or seems to demand dangerous action, stop
    this educational exercise and seek suitable professional support; immediate danger needs urgent local
    help. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Meditation and Mindfulness: Effectiveness and Safety: https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case, spoken notes or a simple three-column diagram. Do not re-enter
    an upsetting state to obtain evidence. If an experience is frightening, disrupts ordinary functioning
    or seems to demand dangerous action, stop this educational exercise and seek suitable professional
    support; immediate danger needs urgent local help.
  expected_burden: About 20 minutes initially, one short perspective check and ordinary action, then a
    15-minute review after several days.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Mystical, ecstatic, and peak experience protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Mystical, ecstatic, and peak experience action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case, spoken notes or a simple three-column diagram. Do not re-enter an upsetting state to obtain
    evidence. If an experience is frightening, disrupts ordinary functioning or seems to demand dangerous
    action, stop this educational exercise and seek suitable professional support; immediate danger needs
    urgent local help.
  actions:
  - stable_id: PRACTICE-COMP-0313-MYSTICAL-ECSTATIC-AND-PEAK-EXPERIENCE-01-A1
    sequence: 1
    title: Separate what happened from what it seems to mean
    instructions: 'Make three headings: experienced, interpreted and proposed action. In the case, music,
      the sky and a feeling of connection belong under experienced; a special mission is an interpretation;
      quitting commitments would be a proposed action. Distinguish awe, a sense of unity, devotion and
      an apparent revelation rather than treating them as one proof. Write at least two possible accounts,
      such as personally meaningful emotion and a spiritual interpretation, and identify what the experience
      alone cannot decide. Include context such as tiredness only if known.


      Observation checks: Experience interpretation and proposed action are separated; Different kinds
      of intense experience are distinguished; At least two possible accounts remain available; Unknown
      context and limits of inference are explicit. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0313-MYSTICAL-ECSTATIC-AND-PEAK-EXPERIENCE-01
      action_stable_id: PRACTICE-COMP-0313-MYSTICAL-ECSTATIC-AND-PEAK-EXPERIENCE-01-A1
      competency_stable_id: '03.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0313_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0313_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - experience_interpretation_and_proposed_action_are_separated
        - different_kinds_of_intense_experience_are_distinguished
        - at_least_two_possible_accounts_remain_available
        - unknown_context_and_limits_of_inference_are_explicit
      - measurement_id: c0313_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0313_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0313-MYSTICAL-ECSTATIC-AND-PEAK-EXPERIENCE-01-A2
    sequence: 2
    title: Check an interpretation without outsourcing judgment
    instructions: 'For a personal memory, discuss only what you choose with a trusted willing person who
      can question the interpretation without pressure; this might be a thoughtful peer or appropriate
      community member. Ask what would support the claim, what would count against it and whether the
      proposed action serves others responsibly. For the fictional case, compare two supplied responses:
      the feeling proves a unique mission, versus the feeling may matter while its explanation stays uncertain.
      Explain why reassurance, charisma or agreement alone does not settle the claim. No private disclosure
      or authority endorsement is required.


      Observation checks: An outside perspective or explicitly fictional comparison is considered; Supporting
      and disconfirming reasons are requested; Authority and agreement are not treated as proof; Disclosure
      and participation remain voluntary. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0313-MYSTICAL-ECSTATIC-AND-PEAK-EXPERIENCE-01
      action_stable_id: PRACTICE-COMP-0313-MYSTICAL-ECSTATIC-AND-PEAK-EXPERIENCE-01-A2
      competency_stable_id: '03.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0313_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0313_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_outside_perspective_or_explicitly_fictional_comparison_is_considered
        - supporting_and_disconfirming_reasons_are_requested
        - authority_and_agreement_are_not_treated_as_proof
        - disclosure_and_participation_remain_voluntary
      - measurement_id: c0313_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0313_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0313-MYSTICAL-ECSTATIC-AND-PEAK-EXPERIENCE-01-A3
    sequence: 3
    title: Integrate through a reversible action and a later review
    instructions: 'Choose one ordinary action consistent with the constructive meaning but reasonable
      under either interpretation: return something borrowed, keep an existing promise or offer a small
      welcome that is wanted. For the default case, try one such action in your own ordinary life without
      claiming the fictional experience as yours. After several days, compare the action''s effects, the
      remaining meaning and any revised explanation. Maintain ordinary responsibilities and postpone major
      commitments based solely on the experience. Conclude what you can retain and what remains uncertain;
      an enduring feeling still does not prove a metaphysical claim.


      Observation checks: A proportionate reversible action is actually attempted; Existing responsibilities
      are preserved; A later review examines conduct and interpretation separately; Retained meaning does
      not become automatic proof. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: What meaning survived patient examination, what changed in ordinary conduct, and what
      claim still lacks evidence?


      Examples: Supportive: The person retained a sense of connection, kept an ordinary promise, welcomed
      a questioning perspective and left the proposed special mission unproven after later review.


      Mixed: The small action was constructive, but the interpretation remained uncertain and the outside
      perspective was only a fictional comparison.


      Contradictory: An intense feeling became unquestionable authority for a major commitment, or a skeptical
      question was treated as evidence that outsiders were hostile.


      Inconclusive: The event was described vividly without separating interpretation, checking a perspective
      or reviewing any ordinary action over time.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0313-MYSTICAL-ECSTATIC-AND-PEAK-EXPERIENCE-01
