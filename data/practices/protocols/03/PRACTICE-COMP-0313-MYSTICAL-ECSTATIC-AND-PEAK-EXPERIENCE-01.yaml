    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Mystical, ecstatic, and peak experience; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use the fictional case, spoken notes or a simple three-column diagram. Do not re-enter an upsetting
      state to obtain evidence. If an experience is frightening, disrupts ordinary functioning or seems
      to demand dangerous action, stop this educational exercise and seek suitable professional support;
      immediate danger needs urgent local help.
    cultural_context:
    - Adapt the expression of Mystical, ecstatic, and peak experience to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use the fictional case, spoken notes or a simple three-column diagram. Do not re-enter an upsetting
      state to obtain evidence. If an experience is frightening, disrupts ordinary functioning or seems
      to demand dangerous action, stop this educational exercise and seek suitable professional support;
      immediate danger needs urgent local help.
  pause_conditions:
  - Pause Mystical, ecstatic, and peak experience when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Mystical, ecstatic, and peak experience practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Mystical, ecstatic, and peak experience situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
