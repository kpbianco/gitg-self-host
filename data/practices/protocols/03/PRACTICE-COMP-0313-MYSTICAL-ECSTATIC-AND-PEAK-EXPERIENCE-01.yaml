  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Mystical, ecstatic, and peak experience explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Mystical, ecstatic, and peak experience
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Mystical, ecstatic, and peak experience observation requires a distinct immutable
