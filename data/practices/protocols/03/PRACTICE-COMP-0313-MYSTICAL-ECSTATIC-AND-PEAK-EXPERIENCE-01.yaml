    interpretation and proposed action are separated; Different kinds of intense experience are distinguished;
    At least two possible accounts remain available; Unknown context and limits of inference are explicit.
    Action 2: Check an interpretation without outsourcing judgment. Observed checks: An outside perspective
    or explicitly fictional comparison is considered; Supporting and disconfirming reasons are requested;
