  - stable_id: PRACTICE-COMP-1210-RECOVERY-FATIGUE-AND-INJURY-PREVENTION-01-A1
    sequence: 1
    title: Bound the qualified question for Recovery, fatigue, and injury prevention
    instructions: 'Turn Recovery, fatigue, and injury prevention into one educational or planning question
      and identify the qualification and jurisdiction needed to answer it. Use the canonical scope to
      separate general learning from diagnosis, treatment, legal advice, financial advice, safeguarding
      decisions, or other professional judgment: Distinguish productive stress from overtraining, pain,
      illness, and structural injury.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1210-RECOVERY-FATIGUE-AND-INJURY-PREVENTION-01
