  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Recovery, fatigue, and injury prevention; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Recovery, fatigue, and injury prevention; assistive technology, interpretation, a support
      person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Recovery, fatigue, and injury prevention to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - When a real Recovery, fatigue, and injury prevention opportunity is unavailable or inappropriate,
      use a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause Recovery, fatigue, and injury prevention when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Recovery, fatigue, and injury prevention practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Recovery, fatigue, and injury prevention situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Health and exercise content must be adapted to the person and does not replace licensed medical care.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Recovery, fatigue, and injury prevention actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1210_a1_primary
  - c1210_a1_boundary
  - c1210_a1_adverse
  - c1210_a2_primary
  - c1210_a2_boundary
  - c1210_a2_adverse
  - c1210_a3_primary
  - c1210_a3_boundary
  - c1210_a3_adverse
  adverse_or_contradictory_indicators:
  - The Recovery, fatigue, and injury prevention action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Recovery, fatigue, and injury prevention criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Recovery, fatigue, and injury prevention explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Recovery, fatigue, and injury prevention
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Recovery, fatigue, and injury prevention observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Recovery, fatigue, and injury prevention rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Adjusts load, sleep, nutrition, and care before temporary strain becomes lasting damage.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Recovery, fatigue, and injury prevention requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: This package is non-scored and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Recovery,
    fatigue, and injury prevention evidence only under offline typed evaluation; protocol performance
    remains distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L11
  - L17
  minimum_evidence_before_state_update: No current-state update is permitted for this Recovery, fatigue,
    and injury prevention draft under SP-NON-SCORED-REFLECTION, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Recovery, fatigue, and injury prevention evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The bound the qualified question for recovery, fatigue, and injury prevention action was attempted
    or explicitly deferred.
  - The prepare minimum information for recovery, fatigue, and injury prevention action was attempted
    or explicitly deferred.
  - The record a bounded recovery, fatigue, and injury prevention disposition action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1210_a1_primary
    - c1210_a2_primary
    - c1210_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Recovery, fatigue, and injury prevention only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Recovery, fatigue, and injury prevention across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Recovery, fatigue, and injury prevention require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Recovery, fatigue, and injury prevention criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Adjusts load, sleep, nutrition, and care before temporary
      strain becomes lasting damage.', what contradiction or missing context matters most, and should
      this Recovery, fatigue, and injury prevention design be repeated, adapted, deferred, stopped, or
      referred?
  review_guidance:
    repeat: Repeat the same bounded Recovery, fatigue, and injury prevention design only when the context
      and burden remain appropriate.
    adapt: Change the Recovery, fatigue, and injury prevention medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Recovery, fatigue, and injury prevention when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Recovery, fatigue, and injury prevention
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Recovery, fatigue, and injury prevention criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Recovery, fatigue, and injury prevention criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Recovery, fatigue, and injury prevention criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Recovery, fatigue, and injury prevention action was deferred, not observed, not
      applicable, stale, insufficiently bounded, or too confounded to interpret.
