  adverse_or_contradictory_indicators:
  - The Grooming, dress, and presentation action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Grooming, dress, and presentation criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Grooming, dress, and presentation explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Grooming, dress, and presentation context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Grooming, dress, and presentation observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Grooming, dress, and presentation rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Presentation supports dignity and purpose without becoming the basis of worth.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Grooming, dress, and presentation requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is non-scored and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Grooming,
    dress, and presentation evidence only under offline typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L16
  - L17
  - L23
  - L32
  minimum_evidence_before_state_update: No current-state update is permitted for this Grooming, dress,
    and presentation draft under SP-NON-SCORED-REFLECTION, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Grooming, dress, and presentation evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The bound the qualified question for grooming, dress, and presentation action was attempted or explicitly
    deferred.
  - The prepare minimum information for grooming, dress, and presentation action was attempted or explicitly
    deferred.
  - The record a bounded grooming, dress, and presentation disposition action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1213_a1_primary
    - c1213_a2_primary
    - c1213_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Grooming, dress, and presentation only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Grooming, dress, and presentation across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Grooming, dress, and presentation require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Grooming, dress, and presentation criterion is present, absent, mixed, or
      unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Presentation supports dignity and purpose without becoming
      the basis of worth.', what contradiction or missing context matters most, and should this Grooming,
      dress, and presentation design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Grooming, dress, and presentation design only when the context and
      burden remain appropriate.
    adapt: Change the Grooming, dress, and presentation medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Grooming, dress, and presentation when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Grooming, dress, and presentation questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Grooming, dress, and presentation criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Grooming, dress, and presentation criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Grooming, dress, and presentation criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Grooming, dress, and presentation action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
