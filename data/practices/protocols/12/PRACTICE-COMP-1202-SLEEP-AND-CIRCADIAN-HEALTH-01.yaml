  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Sleep and circadian health; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Sleep and circadian health; assistive technology, interpretation, a support person, and
      a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Sleep and circadian health to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Sleep and circadian health opportunity is unavailable or inappropriate, use a fictional,
      historical, public, simulated, or planning-only equivalent and retain the narrower evidence classification.
  pause_conditions:
  - Pause Sleep and circadian health when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Sleep and circadian health practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Sleep and circadian health situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Health and exercise content must be adapted to the person and does not replace licensed medical care.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Sleep and circadian health actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1202_a1_primary
  - c1202_a1_boundary
  - c1202_a1_adverse
  - c1202_a2_primary
  - c1202_a2_boundary
  - c1202_a2_adverse
  - c1202_a3_primary
  - c1202_a3_boundary
  - c1202_a3_adverse
  adverse_or_contradictory_indicators:
  - The Sleep and circadian health action exceeded consent, authority, privacy, qualification, role, burden,
    or safety boundaries.
  - The evidence contradicted the intended Sleep and circadian health criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Sleep and circadian health explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Sleep and circadian health context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Sleep and circadian health observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Sleep and circadian health rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Sleep is regular enough to support cognition, mood, and physical function.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Sleep and circadian health requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is non-scored and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Sleep and
    circadian health evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L17
  minimum_evidence_before_state_update: No current-state update is permitted for this Sleep and circadian
    health draft under SP-NON-SCORED-REFLECTION, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Sleep and circadian health evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The bound the qualified question for sleep and circadian health action was attempted or explicitly
    deferred.
  - The prepare minimum information for sleep and circadian health action was attempted or explicitly
    deferred.
  - The record a bounded sleep and circadian health disposition action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1202_a1_primary
    - c1202_a2_primary
    - c1202_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Sleep and circadian health only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Sleep and circadian health across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Sleep and circadian health require in this exact context, what remains outside my
      role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Sleep and circadian health criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Sleep is regular enough to support cognition, mood, and physical
      function.', what contradiction or missing context matters most, and should this Sleep and circadian
      health design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Sleep and circadian health design only when the context and burden
      remain appropriate.
    adapt: Change the Sleep and circadian health medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Sleep and circadian health when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Sleep and circadian health questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Sleep and circadian health criteria were observed with provenance and no adverse
      boundary signal in the selected context.
    mixed: Some Sleep and circadian health criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Sleep and circadian health criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Sleep and circadian health action was deferred, not observed, not applicable, stale,
      insufficiently bounded, or too confounded to interpret.
