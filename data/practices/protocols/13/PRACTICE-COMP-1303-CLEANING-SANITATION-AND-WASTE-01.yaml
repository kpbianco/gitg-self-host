meaning_and_fit:
  purpose: Match a cleaning method to a surface and soil while controlling exposure, cross-contamination
    and waste.
  why_recommended: Match a cleaning method to a surface and soil while controlling exposure, cross-contamination
    and waste.
  claims:
  - statement: Match a cleaning method to a surface and soil while controlling exposure, cross-contamination
      and waste.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Mixing bleach with ammonia, acids or other cleaners can cause serious injury; product directions
      must be read before use.
    classification: safety_precaution
    source_ids:
    - SRC-WADOH-CLEANER-MIXING
    limitations: Supports the cleaner-mixing boundary, not a universal surface treatment, exposure response
      or evaluation of this exercise.
  applicability_question: Does a voluntary, bounded Cleaning, sanitation, and waste practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cleaning, sanitation, and waste as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a small reachable patch, fragrance-free compatible product or a helper
    for handling. If suitable equipment or ventilation is unavailable, compare labels and rehearse the
    sequence without applying anything.
  opportunity_considerations: Choose an ordinary washable table or counter, its care instructions, a cloth
    and one compatible household cleaner. Exclude bodily fluids, pests, unknown mold, hazardous waste
    and specialist remediation.
  prerequisites:
  - Choose an ordinary washable table or counter, its care instructions, a cloth and one compatible household
    cleaner. Exclude bodily fluids, pests, unknown mold, hazardous waste and specialist remediation.
  dependencies: []
  safe_alternatives:
  - Use a small reachable patch, fragrance-free compatible product or a helper for handling. If suitable
    equipment or ventilation is unavailable, compare labels and rehearse the sequence without applying
    anything.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cleaning, sanitation, and waste differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cleaning, sanitation, and
    waste as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary washable table or counter, its care instructions, a cloth and one compatible
    household cleaner. Exclude bodily fluids, pests, unknown mold, hazardous waste and specialist remediation.
    Goal: Match a cleaning method to a surface and soil while controlling exposure, cross-contamination
    and waste. Scope: One compatible washable surface practices method selection and contamination control.
    It does not demonstrate sanitation of hazardous materials or all household surfaces. Time and effort:
    About 10 minutes to read directions and 15–25 minutes to clean and inspect one surface. Adaptation:
    Use a small reachable patch, fragrance-free compatible product or a helper for handling. If suitable
    equipment or ventilation is unavailable, compare labels and rehearse the sequence without applying
    anything. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Dangers of Mixing Bleach with Cleaners: https://doh.wa.gov/community-and-environment/contaminants/bleach-mixing-dangers'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a small reachable patch, fragrance-free compatible product or a helper for
    handling. If suitable equipment or ventilation is unavailable, compare labels and rehearse the sequence
    without applying anything.
  expected_burden: About 10 minutes to read directions and 15–25 minutes to clean and inspect one surface.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cleaning, sanitation, and waste protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Cleaning, sanitation, and waste action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a small
    reachable patch, fragrance-free compatible product or a helper for handling. If suitable equipment
    or ventilation is unavailable, compare labels and rehearse the sequence without applying anything.
  actions:
  - stable_id: PRACTICE-COMP-1303-CLEANING-SANITATION-AND-WASTE-01-A1
    sequence: 1
    title: Read the surface and product instructions
    instructions: 'Identify the surface material, visible soil, product compatibility, required ventilation
      and any protective equipment on the label. Distinguish removing dirt from a separate disinfecting
      claim. Never mix products or decant them into food containers. If the material or residue is unknown,
      stop and identify it before treatment.


      Observation checks: Surface and soil are identified; Product directions and compatibility are checked;
      Mixing and hazardous residues are excluded. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1303-CLEANING-SANITATION-AND-WASTE-01
      action_stable_id: PRACTICE-COMP-1303-CLEANING-SANITATION-AND-WASTE-01-A1
      competency_stable_id: '13.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1303_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1303_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - surface_and_soil_are_identified
        - product_directions_and_compatibility_are_checked
        - mixing_and_hazardous_residues_are_excluded
      - measurement_id: c1303_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1303_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1303-CLEANING-SANITATION-AND-WASTE-01-A2
    sequence: 2
    title: Work from a clean area toward the soil
    instructions: 'Remove ordinary loose debris, test the compatible method on a small unobtrusive area,
      then clean the chosen surface using label directions. Keep the dirty cloth away from food and clean
      items. Rinse only if required and allow the surface to dry; do not interpret a fragrance as evidence
      of sanitation.


      Observation checks: A small compatibility test is completed; The labelled cleaning method is followed;
      Dirty materials are kept separate. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1303-CLEANING-SANITATION-AND-WASTE-01
      action_stable_id: PRACTICE-COMP-1303-CLEANING-SANITATION-AND-WASTE-01-A2
      competency_stable_id: '13.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1303_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1303_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_small_compatibility_test_is_completed
        - the_labelled_cleaning_method_is_followed
        - dirty_materials_are_kept_separate
      - measurement_id: c1303_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1303_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1303-CLEANING-SANITATION-AND-WASTE-01-A3
    sequence: 3
    title: Inspect and reset the cleaning materials
    instructions: 'Inspect under ordinary light for remaining residue and material damage. Clean or dispose
      of the cloth as appropriate, close the product and put it in its designated safe storage. Follow
      local disposal instructions for packaging or residues. Note what should change next time without
      adding stronger chemicals by default.


      Observation checks: Residue and damage are inspected; Materials are safely cleaned or discarded;
      Product storage and disposal are checked. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Was the original soil removed without introducing a new material, exposure or contamination
      problem?


      Examples: Supportive: A washable surface was cleaned with one compatible product and the dirty cloth
      was safely handled.


      Mixed: Most soil was removed but a residue requires checking the manufacturer''s instructions.


      Contradictory: Products were mixed or a damaged finish was ignored because the surface smelled clean.


      Inconclusive: A product was selected but no compatible surface was cleaned or inspected.'
    expected_time: 15-25 minutes
    due_within_days: 10
