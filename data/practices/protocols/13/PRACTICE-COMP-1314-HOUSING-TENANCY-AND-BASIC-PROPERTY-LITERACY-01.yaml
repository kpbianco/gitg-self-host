meaning_and_fit:
  purpose: Identify the documents, responsibilities, costs and local advice needed to address a housing
    issue.
  why_recommended: Identify the documents, responsibilities, costs and local advice needed to address
    a housing issue.
  claims:
  - statement: Identify the documents, responsibilities, costs and local advice needed to address a housing
      issue.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Housing, tenancy, and basic property literacy practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Housing, tenancy, and basic property literacy as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a public sample lease or an accessible translated explanation with a trusted
    adviser. Do not upload agreements, addresses, account numbers, landlord identities or evidence about
    a dispute.
  opportunity_considerations: Use your own housing agreement privately or a sample lease, one fictional
    non-emergency maintenance problem and the relevant local housing authority's information. Rules vary
    by location and housing arrangement.
  prerequisites:
  - Use your own housing agreement privately or a sample lease, one fictional non-emergency maintenance
    problem and the relevant local housing authority's information. Rules vary by location and housing
    arrangement.
  dependencies: []
  safe_alternatives:
  - Use a public sample lease or an accessible translated explanation with a trusted adviser. Do not upload
    agreements, addresses, account numbers, landlord identities or evidence about a dispute.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Housing, tenancy, and basic property literacy differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Housing, tenancy, and basic
    property literacy as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use your own housing agreement privately or a sample lease, one fictional non-emergency maintenance
    problem and the relevant local housing authority''s information. Rules vary by location and housing
    arrangement. Goal: Identify the documents, responsibilities, costs and local advice needed to address
    a housing issue. Scope: The worksheet develops housing-document literacy and a clear question. It
    does not interpret local law, establish legal rights or replace qualified advice about a dispute.
    Time and effort: About 30–45 minutes to inspect a document and prepare one question; allow additional
    time for a qualified response. Adaptation: Use a public sample lease or an accessible translated explanation
    with a trusted adviser. Do not upload agreements, addresses, account numbers, landlord identities
    or evidence about a dispute. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a public sample lease or an accessible translated explanation with a trusted
    adviser. Do not upload agreements, addresses, account numbers, landlord identities or evidence about
    a dispute.
  expected_burden: About 30–45 minutes to inspect a document and prepare one question; allow additional
    time for a qualified response.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Housing, tenancy, and basic property literacy protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Housing, tenancy, and basic property literacy action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a public
    sample lease or an accessible translated explanation with a trusted adviser. Do not upload agreements,
    addresses, account numbers, landlord identities or evidence about a dispute.
  actions:
  - stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01-A1
    sequence: 1
    title: Locate the relevant obligations and records
    instructions: 'Find the agreement''s rent or payment terms, notice route, maintenance responsibilities,
      deposit terms and utility allocation. For the chosen issue, mark what the document says, what is
      unclear and what local rules may affect. Do not assume a lease clause is enforceable simply because
      it is printed.


      Observation checks: Relevant clauses and records are located; Responsibilities are distinguished;
      Uncertainty about local rules remains explicit. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01
      action_stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01-A1
      competency_stable_id: '13.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1314_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1314_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - relevant_clauses_and_records_are_located
        - responsibilities_are_distinguished
        - uncertainty_about_local_rules_remains_explicit
      - measurement_id: c1314_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1314_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01-A2
    sequence: 2
    title: Prepare a factual maintenance request
    instructions: 'Describe the problem, when it was observed, its practical effect and the requested
      response. Keep copies privately and use the agreement''s stated communication route where appropriate.
      Example: a recurring non-emergency fixture issue needs a dated description and repair request, not
      a guessed legal conclusion or a withheld payment.


      Observation checks: The issue is described factually; The request and recordkeeping route are explicit;
      Unsupported legal action is avoided. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01
      action_stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01-A2
      competency_stable_id: '13.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1314_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1314_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_issue_is_described_factually
        - the_request_and_recordkeeping_route_are_explicit
        - unsupported_legal_action_is_avoided
      - measurement_id: c1314_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1314_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01-A3
    sequence: 3
    title: Find the next legitimate escalation path
    instructions: 'Locate a current local housing authority, tenant advice service, housing counselor
      or qualified adviser appropriate to the arrangement. Write what information they would need and
      what question remains unresolved. For urgent threats to health or safety, use the appropriate emergency
      or local service rather than waiting for this exercise''s review.


      Observation checks: A relevant local assistance route is identified; The unresolved question is
      specific; Urgent issues have a separate response. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Can you distinguish what you know from the document, what requires local advice, and
      the next proportionate action?


      Examples: Supportive: A dated repair request and the local advice contact were prepared with the
      unclear responsibility identified.


      Mixed: The agreement is located but the relevant local assistance service has not been verified.


      Contradictory: A lease clause was treated as universal law or payment was withheld on the exercise''s
      authority.


      Inconclusive: A list of housing terms was copied without connecting them to a specific issue.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01
      action_stable_id: PRACTICE-COMP-1314-HOUSING-TENANCY-AND-BASIC-PROPERTY-LITERACY-01-A3
      competency_stable_id: '13.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
