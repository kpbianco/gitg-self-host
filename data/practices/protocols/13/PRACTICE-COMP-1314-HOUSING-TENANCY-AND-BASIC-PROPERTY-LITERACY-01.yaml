  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Housing, tenancy, and basic property literacy explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Housing, tenancy, and basic property literacy
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Housing, tenancy, and basic property literacy observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Housing, tenancy, and basic property literacy rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Locate the relevant obligations and records. Observed checks: Relevant
    clauses and records are located; Responsibilities are distinguished; Uncertainty about local rules
    remains explicit. Action 2: Prepare a factual maintenance request. Observed checks: The issue is described
    factually; The request and recordkeeping route are explicit; Unsupported legal action is avoided.
    Action 3: Find the next legitimate escalation path. Observed checks: A relevant local assistance route
    is identified; The unresolved question is specific; Urgent issues have a separate response.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A list of housing terms was copied without connecting
    them to a specific issue.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Housing,
    tenancy, and basic property literacy contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
