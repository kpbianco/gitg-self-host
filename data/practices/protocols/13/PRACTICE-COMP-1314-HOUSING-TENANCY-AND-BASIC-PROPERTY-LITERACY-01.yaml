    The request and recordkeeping route are explicit; Unsupported legal action is avoided.'
  - 'Action 3: Find the next legitimate escalation path. Observed checks: A relevant local assistance
    route is identified; The unresolved question is specific; Urgent issues have a separate response.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
