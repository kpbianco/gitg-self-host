  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Housing, tenancy, and basic property literacy; no purchase, subscription, travel, credential, or
      public artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Housing, tenancy, and basic property literacy; assistive technology, interpretation, a
      support person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Housing, tenancy, and basic property literacy to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - When a real Housing, tenancy, and basic property literacy opportunity is unavailable or inappropriate,
      use a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause Housing, tenancy, and basic property literacy when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Housing, tenancy, and basic property literacy practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Housing, tenancy, and basic property literacy situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Housing, tenancy, and basic property literacy actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1314_a1_primary
  - c1314_a1_boundary
  - c1314_a1_adverse
  - c1314_a2_primary
  - c1314_a2_boundary
  - c1314_a2_adverse
  - c1314_a3_primary
  - c1314_a3_boundary
  - c1314_a3_adverse
  adverse_or_contradictory_indicators:
  - The Housing, tenancy, and basic property literacy action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Housing, tenancy, and basic property literacy criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Housing, tenancy, and basic property literacy explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Housing, tenancy, and basic property literacy
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Housing, tenancy, and basic property literacy observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Housing, tenancy, and basic property literacy rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can identify rights, obligations, costs, and escalation paths in a housing problem.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Housing, tenancy, and basic property literacy requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Housing,
    tenancy, and basic property literacy contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L18
  - L20
  - L21
  - L31
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Housing, tenancy, and basic property literacy evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The define indicators for housing, tenancy, and basic property literacy action was attempted or explicitly
    deferred.
  - The observe housing, tenancy, and basic property literacy across three checkpoints action was attempted
    or explicitly deferred.
  - The review the limited housing, tenancy, and basic property literacy pattern action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1314_a1_primary
    - c1314_a2_primary
    - c1314_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Housing, tenancy, and basic property literacy only when the
    initial context remained safe, the evidence criteria were usable, burden was acceptable, and a new
    context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Housing, tenancy, and basic property literacy
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Housing, tenancy, and basic property literacy require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Housing, tenancy, and basic property literacy criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can identify rights, obligations, costs, and escalation paths
      in a housing problem.', what contradiction or missing context matters most, and should this Housing,
      tenancy, and basic property literacy design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Housing, tenancy, and basic property literacy design only when the
      context and burden remain appropriate.
    adapt: Change the Housing, tenancy, and basic property literacy medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Housing, tenancy, and basic property literacy when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Housing, tenancy, and basic property
      literacy questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Housing, tenancy, and basic property literacy criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Housing, tenancy, and basic property literacy criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Housing, tenancy, and basic property literacy
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Housing, tenancy, and basic property literacy action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
