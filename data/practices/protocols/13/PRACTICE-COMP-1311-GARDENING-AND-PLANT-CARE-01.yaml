meaning_and_fit:
  purpose: Use plant-specific information and observations to plan care and respond to a small growing
    trial.
  why_recommended: Use plant-specific information and observations to plan care and respond to a small
    growing trial.
  claims:
  - statement: Use plant-specific information and observations to plan care and respond to a small growing
      trial.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Houseplant care should respond to observed light, moisture, drainage and growth conditions;
      watering solely by calendar can miss the plant's actual needs.
    classification: professional_or_public_standard
    source_ids:
    - SRC-UMN-HOUSEPLANT-CARE
    limitations: Seasonal Upper Midwest houseplant guidance, not a universal watering or growing schedule
      for all species, climates or cultivation methods.
  applicability_question: Does a voluntary, bounded Gardening and plant care practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Gardening and plant care as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Observe an existing shared plant with permission, use accessible raised placement,
    or build a species-specific care plan without buying anything. Planning alone does not show that a
    plant was sustained.
  opportunity_considerations: Choose an existing plant or a small seed trial that fits your space. Identify
    the species and obtain guidance from a local extension service, botanic garden or reliable supplier.
    Check toxicity where children or animals have access.
  prerequisites:
  - Choose an existing plant or a small seed trial that fits your space. Identify the species and obtain
    guidance from a local extension service, botanic garden or reliable supplier. Check toxicity where
    children or animals have access.
  dependencies: []
  safe_alternatives:
  - Observe an existing shared plant with permission, use accessible raised placement, or build a species-specific
    care plan without buying anything. Planning alone does not show that a plant was sustained.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Gardening and plant care differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Gardening and plant care as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an existing plant or a small seed trial that fits your space. Identify the species and
    obtain guidance from a local extension service, botanic garden or reliable supplier. Check toxicity
    where children or animals have access. Goal: Use plant-specific information and observations to plan
    care and respond to a small growing trial. Scope: A small plant trial connects species, place, care
    and observation. Early observations are not a completed growing cycle or proof of long-term cultivation
    skill. Time and effort: About 30 minutes to identify conditions and set up, then brief observations
    over a suitable week; a full growing cycle may take much longer. Adaptation: Observe an existing shared
    plant with permission, use accessible raised placement, or build a species-specific care plan without
    buying anything. Planning alone does not show that a plant was sustained. Keep personal working notes
    outside the check-in; record only the listed observations.


    Reference support:

    Spring houseplant care: https://extension.umn.edu/garden-and-home/yard-and-garden/gardening-in-minnesota/houseplants/spring-houseplant-care'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Observe an existing shared plant with permission, use accessible raised placement,
    or build a species-specific care plan without buying anything. Planning alone does not show that a
    plant was sustained.
  expected_burden: About 30 minutes to identify conditions and set up, then brief observations over a
    suitable week; a full growing cycle may take much longer.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Gardening and plant care protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Gardening and plant care action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Observe an
    existing shared plant with permission, use accessible raised placement, or build a species-specific
    care plan without buying anything. Planning alone does not show that a plant was sustained.
  actions:
  - stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01-A1
    sequence: 1
    title: Compare the plant's needs with the site
    instructions: 'Record actual light exposure, container drainage, growing medium and seasonal temperature
      conditions. Compare them with the chosen plant''s guidance, including watering and mature size.
      Example: a sunny windowsill may still vary markedly between seasons. If the conditions do not fit,
      choose a different site or plant instead of compensating with more fertilizer.


      Observation checks: Plant identity and guidance are explicit; Site conditions are observed; A mismatch
      has a proportionate response. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01
      action_stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01-A1
      competency_stable_id: '13.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1311_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1311_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - plant_identity_and_guidance_are_explicit
        - site_conditions_are_observed
        - a_mismatch_has_a_proportionate_response
      - measurement_id: c1311_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1311_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01-A2
    sequence: 2
    title: Establish a condition-based care routine
    instructions: 'Follow the plant''s instructions for planting or routine care and record a baseline
      observation. Check moisture before watering using a method suitable for that medium and plant; do
      not water solely because a calendar alarm rings. Keep drainage usable and avoid unneeded pesticide
      or fertilizer applications.


      Observation checks: Care follows the selected plant''s requirements; A baseline observation is recorded;
      Watering responds to observed conditions. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01
      action_stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01-A2
      competency_stable_id: '13.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1311_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1311_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - care_follows_the_selected_plant_s_requirements
        - a_baseline_observation_is_recorded
        - watering_responds_to_observed_conditions
      - measurement_id: c1311_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1311_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01-A3
    sequence: 3
    title: Review a growing interval and the next stage
    instructions: 'After the plant-appropriate interval, compare new growth, wilting, discoloration, moisture
      and any pest signs with the baseline. Investigate one plausible cause with the reference before
      changing care. Set checkpoints for the rest of the plant''s season or life cycle; this short exercise
      does not demonstrate a complete growing cycle.


      Observation checks: Observations are compared over time; One care change is evidence-linked; The
      unobserved stages and next checkpoints are explicit. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Did the routine fit this plant in this location, and what evidence would distinguish
      too much water from another problem?


      Examples: Supportive: A light mismatch was corrected and subsequent observations informed the next
      care decision.


      Mixed: The plant survived the interval but a new leaf problem has several possible causes.


      Contradictory: Water or chemicals were added repeatedly without checking conditions or product directions.


      Inconclusive: A generic watering schedule was written without identifying the plant or observing
      its site.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01
      action_stable_id: PRACTICE-COMP-1311-GARDENING-AND-PLANT-CARE-01-A3
      competency_stable_id: '13.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1311_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1311_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - observations_are_compared_over_time
        - one_care_change_is_evidence_linked
        - the_unobserved_stages_and_next_checkpoints_are_explicit
      - measurement_id: c1311_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1311_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Gardening and plant care; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Observe an existing shared plant with permission, use accessible raised placement, or build a species-specific
      care plan without buying anything. Planning alone does not show that a plant was sustained.
    cultural_context:
    - Adapt the expression of Gardening and plant care to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Observe an existing shared plant with permission, use accessible raised placement, or build a species-specific
      care plan without buying anything. Planning alone does not show that a plant was sustained.
  pause_conditions:
  - Pause Gardening and plant care when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Gardening and plant care practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Gardening and plant care situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Gardening and plant care actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1311_a1_primary
  - c1311_a1_boundary
  - c1311_a1_adverse
  - c1311_a2_primary
  - c1311_a2_boundary
  - c1311_a2_adverse
  - c1311_a3_primary
  - c1311_a3_boundary
  - c1311_a3_adverse
  adverse_or_contradictory_indicators:
  - Water or chemicals were added repeatedly without checking conditions or product directions.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Gardening and plant care explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Gardening and plant care context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Gardening and plant care observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Gardening and plant care rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Compare the plant''s needs with the site. Observed checks: Plant identity
    and guidance are explicit; Site conditions are observed; A mismatch has a proportionate response.
    Action 2: Establish a condition-based care routine. Observed checks: Care follows the selected plant''s
    requirements; A baseline observation is recorded; Watering responds to observed conditions. Action
    3: Review a growing interval and the next stage. Observed checks: Observations are compared over time;
    One care change is evidence-linked; The unobserved stages and next checkpoints are explicit.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A generic watering schedule was written without identifying
    the plant or observing its site.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Gardening
    and plant care contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L16
  - L17
  - L18
  - L35
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Gardening and plant care evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
