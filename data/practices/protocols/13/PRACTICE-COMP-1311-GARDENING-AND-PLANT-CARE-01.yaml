  completion_criteria:
  - 'Action 1: Compare the plant''s needs with the site. Observed checks: Plant identity and guidance
    are explicit; Site conditions are observed; A mismatch has a proportionate response.'
  - 'Action 2: Establish a condition-based care routine. Observed checks: Care follows the selected plant''s
    requirements; A baseline observation is recorded; Watering responds to observed conditions.'
  - 'Action 3: Review a growing interval and the next stage. Observed checks: Observations are compared
    over time; One care change is evidence-linked; The unobserved stages and next checkpoints are explicit.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1311_a1_primary
    - c1311_a2_primary
    - c1311_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Did the routine fit this plant in this location, and what evidence would distinguish
    too much water from another problem?
  transfer_limit: A small plant trial connects species, place, care and observation. Early observations
    are not a completed growing cycle or proof of long-term cultivation skill.
  reflection:
    before: 'What would count as doing this honestly? Goal: Use plant-specific information and observations
      to plan care and respond to a small growing trial.'
    during: Which checks have actually been observed? The plant survived the interval but a new leaf problem
      has several possible causes.
    after: Did the routine fit this plant in this location, and what evidence would distinguish too much
      water from another problem?
  review_guidance:
    repeat: Repeat the same bounded Gardening and plant care design only when the context and burden remain
      appropriate.
    adapt: Observe an existing shared plant with permission, use accessible raised placement, or build
      a species-specific care plan without buying anything. Planning alone does not show that a plant
      was sustained.
    stop: Stop Gardening and plant care when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A light mismatch was corrected and subsequent observations informed the next care decision.
    mixed: The plant survived the interval but a new leaf problem has several possible causes.
    contradictory: Water or chemicals were added repeatedly without checking conditions or product directions.
    inconclusive: A generic watering schedule was written without identifying the plant or observing its
      site.
