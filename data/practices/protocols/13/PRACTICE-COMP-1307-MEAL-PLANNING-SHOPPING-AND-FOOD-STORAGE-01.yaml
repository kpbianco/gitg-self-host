meaning_and_fit:
  purpose: Connect meals, quantities, shopping, preparation and storage into a workable short food plan.
  why_recommended: Connect meals, quantities, shopping, preparation and storage into a workable short
    food plan.
  claims:
  - statement: Connect meals, quantities, shopping, preparation and storage into a workable short food
      plan.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Refrigerate perishable leftovers within two hours, or one hour above 32 C (90 F); use shallow
      containers, keep refrigerated leftovers for three to four days, and reheat to 74 C (165 F).
    classification: safety_precaution
    source_ids:
    - SRC-USDA-LEFTOVER-SAFETY
    limitations: General household guidance, not an assurance about a particular ingredient, interrupted
      cold chain or a person's dietary needs. This source does not test the bean-skillet exercise.
  applicability_question: Does a voluntary, bounded Meal planning, shopping, and food storage practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Meal planning, shopping, and food storage as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use shelf-stable single-meal ingredients when refrigeration is unreliable,
    no-cook suitable foods when cooking is unavailable, and community food resources where appropriate.
    Planning with a sample list tests coordination but does not establish actual food access.
  opportunity_considerations: Choose three upcoming meals and a realistic spending limit. Use your own
    dietary requirements, household preferences, available cooking equipment and existing food. No particular
    diet or number of eaters is assumed.
  prerequisites:
  - Choose three upcoming meals and a realistic spending limit. Use your own dietary requirements, household
    preferences, available cooking equipment and existing food. No particular diet or number of eaters
    is assumed.
  dependencies: []
  safe_alternatives:
  - Use shelf-stable single-meal ingredients when refrigeration is unreliable, no-cook suitable foods
    when cooking is unavailable, and community food resources where appropriate. Planning with a sample
    list tests coordination but does not establish actual food access.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Meal planning, shopping, and food storage differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Meal planning, shopping, and
    food storage as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose three upcoming meals and a realistic spending limit. Use your own dietary requirements,
    household preferences, available cooking equipment and existing food. No particular diet or number
    of eaters is assumed. Goal: Connect meals, quantities, shopping, preparation and storage into a workable
    short food plan. Scope: Three meals connect inventory, quantities, cost and storage. This short plan
    does not establish nutritional adequacy for every person or solve unreliable access to food. Time
    and effort: About 25 minutes of planning, ordinary shopping or price checking, and one meal''s preparation
    time. Adaptation: Use shelf-stable single-meal ingredients when refrigeration is unreliable, no-cook
    suitable foods when cooking is unavailable, and community food resources where appropriate. Planning
    with a sample list tests coordination but does not establish actual food access. Keep personal working
    notes outside the check-in; record only the listed observations.


    Reference support:

    Leftovers and Food Safety: https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use shelf-stable single-meal ingredients when refrigeration is unreliable, no-cook
    suitable foods when cooking is unavailable, and community food resources where appropriate. Planning
    with a sample list tests coordination but does not establish actual food access.
  expected_burden: About 25 minutes of planning, ordinary shopping or price checking, and one meal's preparation
    time.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Meal planning, shopping, and food storage protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Meal planning, shopping, and food storage action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use shelf-stable
    single-meal ingredients when refrigeration is unreliable, no-cook suitable foods when cooking is unavailable,
    and community food resources where appropriate. Planning with a sample list tests coordination but
    does not establish actual food access.
  actions:
  - stable_id: PRACTICE-COMP-1307-MEAL-PLANNING-SHOPPING-AND-FOOD-STORAGE-01-A1
    sequence: 1
    title: Build three meals from a checked inventory
    instructions: 'List usable food already available, noting opened or perishable items first. Plan three
      meals with a filling staple, a suitable protein source and produce where available. Example: beans
      and vegetables in a skillet, a wrap using the remaining beans, and a soup using the remaining vegetables.
      Check portion needs and ingredient suitability.


      Observation checks: Inventory and perishables are checked; Three meals match household requirements;
      Shared ingredients have realistic quantities. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1307-MEAL-PLANNING-SHOPPING-AND-FOOD-STORAGE-01
      action_stable_id: PRACTICE-COMP-1307-MEAL-PLANNING-SHOPPING-AND-FOOD-STORAGE-01-A1
      competency_stable_id: '13.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1307_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1307_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - inventory_and_perishables_are_checked
        - three_meals_match_household_requirements
        - shared_ingredients_have_realistic_quantities
      - measurement_id: c1307_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1307_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1307-MEAL-PLANNING-SHOPPING-AND-FOOD-STORAGE-01-A2
    sequence: 2
    title: Write and use a gap-only shopping list
    instructions: 'Subtract what you already have from the meal quantities. List only the gaps, estimate
      their total cost, and identify an affordable substitution for an unavailable item. Shop or price
      the list within your limit, comparing usable quantity rather than package price alone. Skip a bargain
      if it exceeds storage or likely consumption.


      Observation checks: Existing supplies are subtracted; The list has a cost limit and substitution;
      Package quantity fits likely use. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1307-MEAL-PLANNING-SHOPPING-AND-FOOD-STORAGE-01
      action_stable_id: PRACTICE-COMP-1307-MEAL-PLANNING-SHOPPING-AND-FOOD-STORAGE-01-A2
      competency_stable_id: '13.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1307_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1307_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - existing_supplies_are_subtracted
        - the_list_has_a_cost_limit_and_substitution
        - package_quantity_fits_likely_use
      - measurement_id: c1307_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1307_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1307-MEAL-PLANNING-SHOPPING-AND-FOOD-STORAGE-01-A3
    sequence: 3
    title: Prepare one meal and schedule the remaining food
    instructions: 'Prepare one planned meal using safe instructions, then compare actual portions and
      time with the plan. Label and promptly refrigerate or freeze suitable leftovers using the linked
      food-safety guidance. Put the remaining meals in an order that uses perishables first and revise
      the list if food or time was wasted.


      Observation checks: One planned meal is attempted; Safe storage and next-use timing are explicit;
      Actual cost or waste informs a revision. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which ingredient was used efficiently, and what assumption about appetite, cost, storage
      or time needs correcting?


      Examples: Supportive: Three meals used the planned quantities, and leftover beans were safely stored
      for the next meal.


      Mixed: The meals fit the budget but preparation took longer than available and one meal needs simplification.


      Contradictory: The plan relied on unsafe storage or bought excess food merely because the unit price
      was lower.


      Inconclusive: Meal names were listed without quantities, purchasing gaps or a storage plan.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
