  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Resource maintenance and repair culture; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a hypothetical damaged bag and local published repair prices if you cannot authorize work. Borrowing
      or continuing to use a safe imperfect item may be the best available option.
    cultural_context:
    - Adapt the expression of Resource maintenance and repair culture to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a hypothetical damaged bag and local published repair prices if you cannot authorize work. Borrowing
      or continuing to use a safe imperfect item may be the best available option.
  pause_conditions:
  - Pause Resource maintenance and repair culture when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Resource maintenance and repair culture practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Resource maintenance and repair culture situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
