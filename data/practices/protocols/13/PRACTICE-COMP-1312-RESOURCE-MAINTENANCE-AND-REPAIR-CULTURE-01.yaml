meaning_and_fit:
  purpose: Compare function, repairability, total cost and waste before replacing a possession.
  why_recommended: Compare function, repairability, total cost and waste before replacing a possession.
  claims:
  - statement: Compare function, repairability, total cost and waste before replacing a possession.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Resource maintenance and repair culture practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Resource maintenance and repair culture as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a hypothetical damaged bag and local published repair prices if you cannot
    authorize work. Borrowing or continuing to use a safe imperfect item may be the best available option.
  opportunity_considerations: Choose an ordinary low-risk item such as a bag, chair cushion or storage
    container. Exclude safety-critical equipment and anything with electrical, structural or hazardous-material
    damage.
  prerequisites:
  - Choose an ordinary low-risk item such as a bag, chair cushion or storage container. Exclude safety-critical
    equipment and anything with electrical, structural or hazardous-material damage.
  dependencies: []
  safe_alternatives:
  - Use a hypothetical damaged bag and local published repair prices if you cannot authorize work. Borrowing
    or continuing to use a safe imperfect item may be the best available option.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Resource maintenance and repair culture differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Resource maintenance and repair
    culture as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary low-risk item such as a bag, chair cushion or storage container. Exclude
    safety-critical equipment and anything with electrical, structural or hazardous-material damage. Goal:
    Compare function, repairability, total cost and waste before replacing a possession. Scope: One item
    tests maintain, repair and replace reasoning. Broader material stewardship includes repeated maintenance,
    access constraints and disposal practices over time. Time and effort: About 30 minutes of inspection
    and comparison, plus one small authorized upkeep or enquiry. Adaptation: Use a hypothetical damaged
    bag and local published repair prices if you cannot authorize work. Borrowing or continuing to use
    a safe imperfect item may be the best available option. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a hypothetical damaged bag and local published repair prices if you cannot
    authorize work. Borrowing or continuing to use a safe imperfect item may be the best available option.
  expected_burden: About 30 minutes of inspection and comparison, plus one small authorized upkeep or
    enquiry.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Resource maintenance and repair culture protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Resource maintenance and repair culture action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a hypothetical
    damaged bag and local published repair prices if you cannot authorize work. Borrowing or continuing
    to use a safe imperfect item may be the best available option.
  actions:
  - stable_id: PRACTICE-COMP-1312-RESOURCE-MAINTENANCE-AND-REPAIR-CULTURE-01-A1
    sequence: 1
    title: Name the failed function and remaining life
    instructions: 'Describe what the item must do, what has failed, and what still works. Distinguish
      appearance, wear and a functional defect. Look for care instructions, replaceable parts and repair
      information. Example: a bag with a loose seam may need a small repair while a damaged safety harness
      must not be treated similarly.


      Observation checks: Required function and failure are distinguished; Care or repair information
      is checked; Safety-critical uses are excluded. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1312-RESOURCE-MAINTENANCE-AND-REPAIR-CULTURE-01
      action_stable_id: PRACTICE-COMP-1312-RESOURCE-MAINTENANCE-AND-REPAIR-CULTURE-01-A1
      competency_stable_id: '13.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1312_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1312_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - required_function_and_failure_are_distinguished
        - care_or_repair_information_is_checked
        - safety_critical_uses_are_excluded
      - measurement_id: c1312_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1312_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1312-RESOURCE-MAINTENANCE-AND-REPAIR-CULTURE-01-A2
    sequence: 2
    title: Compare three realistic options
    instructions: 'Compare maintaining the item, arranging a repair, and replacing it with a durable or
      secondhand alternative. Include money, time, transport, tools, likely remaining service and disposal.
      Do not assume repairing is always cheaper or that a person with little time can supply unpaid labor.


      Observation checks: Three dispositions are compared; Total resource cost is considered; Expected
      service and disposal are included. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1312-RESOURCE-MAINTENANCE-AND-REPAIR-CULTURE-01
      action_stable_id: PRACTICE-COMP-1312-RESOURCE-MAINTENANCE-AND-REPAIR-CULTURE-01-A2
      competency_stable_id: '13.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1312_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1312_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_dispositions_are_compared
        - total_resource_cost_is_considered
        - expected_service_and_disposal_are_included
      - measurement_id: c1312_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1312_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1312-RESOURCE-MAINTENANCE-AND-REPAIR-CULTURE-01-A3
    sequence: 3
    title: Act on the selected disposition
    instructions: 'Perform only a safe care step already described by the maker, request a repair estimate,
      or arrange an appropriate replacement or disposal. Set one maintenance cue for the kept item. Afterward
      check whether it actually serves the required function and record any cost you underestimated.


      Observation checks: A safe disposition is acted on; Function or the next dependency is checked;
      A maintenance cue or disposal plan is set. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which option best serves the needed function with your actual resources, and what
      would change that decision?


      Examples: Supportive: A modest repair restored a bag''s function and a recurring seam check was
      added.


      Mixed: Repair is feasible but travel and time make the apparent saving uncertain.


      Contradictory: An unsafe item was retained to avoid waste or a cosmetic preference was presented
      as unavoidable replacement.


      Inconclusive: Prices were compared without specifying the needed function or taking any next step.'
    expected_time: 15-25 minutes
    due_within_days: 10
