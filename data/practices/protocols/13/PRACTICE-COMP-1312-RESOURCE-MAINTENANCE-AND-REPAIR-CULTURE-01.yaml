    for Resource maintenance and repair culture explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Resource maintenance and repair culture
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Resource maintenance and repair culture observation requires a distinct immutable
