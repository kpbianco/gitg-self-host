meaning_and_fit:
  purpose: Coordinate preparation, gentle heat, seasoning and cleanup while producing a simple meal that
    fits the eater.
  why_recommended: Coordinate preparation, gentle heat, seasoning and cleanup while producing a simple
    meal that fits the eater.
  claims:
  - statement: Coordinate preparation, gentle heat, seasoning and cleanup while producing a simple meal
      that fits the eater.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Refrigerate perishable leftovers within two hours, or one hour above 32 C (90 F); use shallow
      containers, keep refrigerated leftovers for three to four days, and reheat to 74 C (165 F).
    classification: safety_precaution
    source_ids:
    - SRC-USDA-LEFTOVER-SAFETY
    limitations: General household guidance, not an assurance about a particular ingredient, interrupted
      cold chain or a person's dietary needs. This source does not test the bean-skillet exercise.
  applicability_question: Does a voluntary, bounded Cooking fundamentals practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cooking fundamentals as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use a microwave-safe covered vessel according to the appliance instructions,
    pre-cut ingredients or an agreed helper. With no safe heating access, assemble suitable labelled ready-to-eat
    ingredients and record that heat management was not practiced.
  opportunity_considerations: For one or two portions use a drained can of ready-to-eat beans, a cup of
    suitable chopped or frozen vegetables, a little oil and water, a pan and a spoon. Check labels, dietary
    restrictions and access needs; obtain help if handling heat or tools is unsafe.
  prerequisites:
  - For one or two portions use a drained can of ready-to-eat beans, a cup of suitable chopped or frozen
    vegetables, a little oil and water, a pan and a spoon. Check labels, dietary restrictions and access
    needs; obtain help if handling heat or tools is unsafe.
  dependencies: []
  safe_alternatives:
  - Use a microwave-safe covered vessel according to the appliance instructions, pre-cut ingredients or
    an agreed helper. With no safe heating access, assemble suitable labelled ready-to-eat ingredients
    and record that heat management was not practiced.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cooking fundamentals differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cooking fundamentals as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'For one or two portions use a drained can of ready-to-eat beans, a cup of suitable chopped or
    frozen vegetables, a little oil and water, a pan and a spoon. Check labels, dietary restrictions and
    access needs; obtain help if handling heat or tools is unsafe. Goal: Coordinate preparation, gentle
    heat, seasoning and cleanup while producing a simple meal that fits the eater. Scope: The skillet
    practices preparation, sequencing, heat, moisture and seasoning. It samples cooking fundamentals;
    it does not establish knife proficiency, raw-meat handling or every cooking method. Time and effort:
    About 10 minutes of preparation, 15–25 minutes of cooking, and 10 minutes for cleanup and review.
    Adaptation: Use a microwave-safe covered vessel according to the appliance instructions, pre-cut ingredients
    or an agreed helper. With no safe heating access, assemble suitable labelled ready-to-eat ingredients
    and record that heat management was not practiced. Keep personal working notes outside the check-in;
    record only the listed observations.


    Reference support:

    Leftovers and Food Safety: https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a microwave-safe covered vessel according to the appliance instructions, pre-cut
    ingredients or an agreed helper. With no safe heating access, assemble suitable labelled ready-to-eat
    ingredients and record that heat management was not practiced.
  expected_burden: About 10 minutes of preparation, 15–25 minutes of cooking, and 10 minutes for cleanup
    and review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cooking fundamentals protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Cooking fundamentals action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a microwave-safe
    covered vessel according to the appliance instructions, pre-cut ingredients or an agreed helper. With
    no safe heating access, assemble suitable labelled ready-to-eat ingredients and record that heat management
    was not practiced.
  actions:
  - stable_id: PRACTICE-COMP-1305-COOKING-FUNDAMENTALS-01-A1
    sequence: 1
    title: Prepare ingredients and a safe work area
    instructions: 'Wash hands, clear a stable work area, read ingredient labels and gather everything
      before heating. Rinse fresh produce under running water. Use pre-cut vegetables if knife work is
      unfamiliar, or cut on a stable board with fingers away from the blade. Separate waste and reserve
      a clean serving utensil.


      Observation checks: Ingredients and equipment are ready; Dietary and handling restrictions are checked;
      Work surfaces and utensils are kept clean. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1305-COOKING-FUNDAMENTALS-01
      action_stable_id: PRACTICE-COMP-1305-COOKING-FUNDAMENTALS-01-A1
      competency_stable_id: '13.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1305_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1305_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - ingredients_and_equipment_are_ready
        - dietary_and_handling_restrictions_are_checked
        - work_surfaces_and_utensils_are_kept_clean
      - measurement_id: c1305_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1305_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1305-COOKING-FUNDAMENTALS-01-A2
    sequence: 2
    title: Cook in a deliberate sequence
    instructions: 'Soften the vegetables over gentle heat in a little oil, stirring and adding a splash
      of water if they stick. Add the drained beans and warm through, following any package cooking requirements.
      Taste with a clean utensil, adjust seasoning modestly, and note how texture and aroma change. Never
      leave the pan unattended.


      Observation checks: Vegetables and beans follow an intentional sequence; Heat and moisture are adjusted
      to observations; Seasoning and doneness are checked appropriately. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1305-COOKING-FUNDAMENTALS-01
      action_stable_id: PRACTICE-COMP-1305-COOKING-FUNDAMENTALS-01-A2
      competency_stable_id: '13.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1305_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1305_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - vegetables_and_beans_follow_an_intentional_sequence
        - heat_and_moisture_are_adjusted_to_observations
        - seasoning_and_doneness_are_checked_appropriately
      - measurement_id: c1305_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1305_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1305-COOKING-FUNDAMENTALS-01-A3
    sequence: 3
    title: Serve and improve one element
    instructions: 'Serve the meal and inspect flavor, texture and timing. Identify one adjustment, such
      as smaller vegetable pieces or adding a little water earlier, and test it on another portion or
      later attempt. Clean the work area; promptly handle leftovers using the linked food-safety guidance
      rather than judging safety by smell.


      Observation checks: A meal is prepared and evaluated; One cooking adjustment follows an observation;
      Cleanup and leftover handling are completed. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which preparation or heat decision most affected the result, and can you explain the
      adjustment without simply memorizing a recipe?


      Examples: Supportive: The meal was produced safely and adding water earlier corrected sticking in
      a second portion.


      Mixed: The food was prepared but uneven vegetable sizes caused inconsistent texture.


      Contradictory: An allergen warning was ignored, heat was left unattended or unsafe leftovers were
      treated as safe by smell.


      Inconclusive: Ingredients were gathered but no meal or explicitly limited no-heat alternative was
      prepared.'
    expected_time: 15-25 minutes
    due_within_days: 10
