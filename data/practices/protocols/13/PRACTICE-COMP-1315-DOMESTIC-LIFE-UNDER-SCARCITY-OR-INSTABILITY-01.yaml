completion_and_review:
  completion_criteria:
  - The define observable criteria for domestic life under scarcity or instability action was attempted
    or explicitly deferred.
  - The rehearse domestic life under scarcity or instability twice action was attempted or explicitly
    deferred.
  - The use feedback for one domestic life under scarcity or instability retry action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1315_a1_primary
    - c1315_a2_primary
    - c1315_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Domestic life under scarcity or instability only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Domestic life under scarcity or instability across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Domestic life under scarcity or instability require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Domestic life under scarcity or instability criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can create a realistic minimum-function plan that uses available
      community and public supports.', what contradiction or missing context matters most, and should
      this Domestic life under scarcity or instability design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Domestic life under scarcity or instability design only when the context
      and burden remain appropriate.
    adapt: Change the Domestic life under scarcity or instability medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Domestic life under scarcity or instability when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Domestic life under scarcity or instability
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Domestic life under scarcity or instability criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Domestic life under scarcity or instability criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Domestic life under scarcity or instability
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Domestic life under scarcity or instability action was deferred, not observed, not
      applicable, stale, insufficiently bounded, or too confounded to interpret.
