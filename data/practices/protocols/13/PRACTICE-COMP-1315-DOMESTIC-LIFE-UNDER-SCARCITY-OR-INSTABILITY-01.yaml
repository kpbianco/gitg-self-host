meaning_and_fit:
  purpose: Prioritize immediate domestic needs using actual resources and reachable support.
  why_recommended: Prioritize immediate domestic needs using actual resources and reachable support.
  claims:
  - statement: Prioritize immediate domestic needs using actual resources and reachable support.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Domestic life under scarcity or instability practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Domestic life under scarcity or instability as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a fictional case if current hardship makes planning burdensome. A supporter
    can help make calls or organize information with consent; the plan may appropriately depend on other
    people and institutions.
  opportunity_considerations: Work with your present resources or a fictional constrained week. Consider
    safe shelter, food, hygiene, essential transport, communication and document access. This is not an
    exercise in deprivation or proof of self-sufficiency.
  prerequisites:
  - Work with your present resources or a fictional constrained week. Consider safe shelter, food, hygiene,
    essential transport, communication and document access. This is not an exercise in deprivation or
    proof of self-sufficiency.
  dependencies: []
  safe_alternatives:
  - Use a fictional case if current hardship makes planning burdensome. A supporter can help make calls
    or organize information with consent; the plan may appropriately depend on other people and institutions.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Domestic life under scarcity or instability differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Domestic life under scarcity
    or instability as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Work with your present resources or a fictional constrained week. Consider safe shelter, food,
    hygiene, essential transport, communication and document access. This is not an exercise in deprivation
    or proof of self-sufficiency. Goal: Prioritize immediate domestic needs using actual resources and
    reachable support. Scope: One constrained-week plan tests provisioning and contingency choices. A
    feasible paper plan is distinct from actually obtaining food, shelter, utilities and support. Time
    and effort: About 30 minutes to map needs and options, then one realistic resource check and a brief
    revision. Adaptation: Use a fictional case if current hardship makes planning burdensome. A supporter
    can help make calls or organize information with consent; the plan may appropriately depend on other
    people and institutions. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a fictional case if current hardship makes planning burdensome. A supporter
    can help make calls or organize information with consent; the plan may appropriately depend on other
    people and institutions.
  expected_burden: About 30 minutes to map needs and options, then one realistic resource check and a
    brief revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Domestic life under scarcity or instability protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Domestic life under scarcity or instability action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a fictional
    case if current hardship makes planning burdensome. A supporter can help make calls or organize information
    with consent; the plan may appropriately depend on other people and institutions.
  actions:
  - stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01-A1
    sequence: 1
    title: Identify the next essential gaps
    instructions: 'For the next day and week, separate needs that are already met from gaps that could
      interrupt safety or basic function. Note actual money, time, storage, utilities, transport and help
      available. Pick the most immediate gap; do not create a plan that assumes a refrigerator, car, stable
      address or spare cash you do not have.


      Observation checks: Immediate and later needs are distinguished; Actual constraints are recorded;
      One essential gap is prioritized. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01
      action_stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01-A1
      competency_stable_id: '13.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1315_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1315_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - immediate_and_later_needs_are_distinguished
        - actual_constraints_are_recorded
        - one_essential_gap_is_prioritized
      - measurement_id: c1315_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1315_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01-A2
    sequence: 2
    title: Match the gap to a reachable option
    instructions: 'Identify one available public, community or personal support and verify its hours,
      eligibility, location and access route. Examples include a food distribution point, laundry access,
      a housing service or a document-replacement adviser. Plan how to contact or reach it and a fallback
      if it is closed or unsuitable.


      Observation checks: The option addresses the priority gap; Access conditions are checked; A fallback
      respects the same constraints. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01
      action_stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01-A2
      competency_stable_id: '13.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1315_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1315_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_option_addresses_the_priority_gap
        - access_conditions_are_checked
        - a_fallback_respects_the_same_constraints
      - measurement_id: c1315_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1315_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01-A3
    sequence: 3
    title: Take one feasible step and revise the week
    instructions: 'Make the contact, prepare the required non-sensitive information, or arrange agreed
      assistance. Update the plan using what was actually available, and identify the next unresolved
      need. Do not mark a need resolved merely because a phone number was found or an application was
      submitted.


      Observation checks: One feasible access step is attempted; Confirmed support and pending requests
      are separated; The next unmet need remains visible. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which need is actually better supported now, and which assumption about available
      help proved wrong?


      Examples: Supportive: A reachable service confirmed assistance and the plan was updated without
      assuming unavailable transport.


      Mixed: A contact was made but eligibility or capacity remains uncertain, so the gap is still open.


      Contradictory: The plan required unsafe food storage, skipped essential care or treated lack of
      resources as a character failure.


      Inconclusive: A generic resource list was assembled without checking whether any option could be
      accessed.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01
      action_stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01-A3
      competency_stable_id: '13.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
