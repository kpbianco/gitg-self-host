meaning_and_fit:
  purpose: 'Practice Domestic life under scarcity or instability through a low-stakes skill rehearsal
    bounded by the canonical scope: Prioritize hygiene, food, safety, storage, transportation, and documents
    when money, housing, time, or utilities are insecure.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can create a realistic
    minimum-function plan that uses available community and public supports. The protocol creates a small
    opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Domestic life under scarcity or instability
      is a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Domestic life under scarcity or instability practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Domestic life under scarcity or instability as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Domestic life under
    scarcity or instability context, understand the source-only status, and stop without losing safety,
    care, employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Domestic
    life under scarcity or instability; do not manufacture conflict, deprivation, exposure, disclosure,
    danger, urgency, or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Domestic life under scarcity or
    instability.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Domestic life under scarcity or
    instability instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Domestic life under scarcity or instability differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Domestic life under scarcity
    or instability as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Complete three bounded Domestic life under scarcity or instability actions over ten days, preserving
    explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Domestic life under scarcity or instability; copy the canonical scope
    and evidence target into a private working note; define the action boundary, valid supports, privacy
    limit, and stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Domestic
    life under scarcity or instability. Do not store private prose, names, identities, diagnoses, allegations,
    credentials, account data, protected work information, intimate detail, artifact contents, observer
    narrative, or another person's secrets. This source-only draft is not surveillance, professional advice,
    treatment, certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Domestic life under scarcity or instability
    actions, and review; scope may be reduced or deferred for access, care, health, workload, conscience,
    or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Domestic life under scarcity or instability protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Domestic life under scarcity or instability action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Domestic life under scarcity or instability situation involving emergency response, abuse, retaliation,
    illegal conduct, medical treatment, legal representation, financial-loss decisions, safeguarding,
    hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
  actions:
  - stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01-A1
    sequence: 1
    title: Define observable criteria for Domestic life under scarcity or instability
    instructions: 'Select one safe, lawful, low-stakes component of Domestic life under scarcity or instability.
      Build a three-to-five-item rubric from this scope, including an error or stop criterion: Prioritize
      hygiene, food, safety, storage, transportation, and documents when money, housing, time, or utilities
      are insecure.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1315-DOMESTIC-LIFE-UNDER-SCARCITY-OR-INSTABILITY-01
