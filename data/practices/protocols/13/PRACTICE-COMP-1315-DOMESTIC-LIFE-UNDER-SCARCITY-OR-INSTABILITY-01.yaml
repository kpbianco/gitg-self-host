  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Domestic life under scarcity or instability; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a fictional case if current hardship makes planning burdensome. A supporter can help make calls
      or organize information with consent; the plan may appropriately depend on other people and institutions.
    cultural_context:
    - Adapt the expression of Domestic life under scarcity or instability to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a fictional case if current hardship makes planning burdensome. A supporter can help make calls
      or organize information with consent; the plan may appropriately depend on other people and institutions.
  pause_conditions:
  - Pause Domestic life under scarcity or instability when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Domestic life under scarcity or instability practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Domestic life under scarcity or instability situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
