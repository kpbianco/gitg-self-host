  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Utilities and household systems; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a provider's accessible guide or a sample internet setup where property access is restricted.
      The card can direct a landlord or support person to act; the participant need not operate utility
      controls.
    cultural_context:
    - Adapt the expression of Utilities and household systems to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a provider's accessible guide or a sample internet setup where property access is restricted.
      The card can direct a landlord or support person to act; the participant need not operate utility
      controls.
  pause_conditions:
  - Pause Utilities and household systems when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Utilities and household systems practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Utilities and household systems situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
