completion_and_review:
  completion_criteria:
  - 'Action 1: Map the service and its permitted controls. Observed checks: The system and responsible
    contact are identified; User controls are distinguished from internal parts; Emergency and professional
    boundaries are stated.'
  - 'Action 2: Walk through one ordinary interruption. Observed checks: Device and service-level faults
    are distinguished; Steps come from the applicable instructions; The sequence has a clear stop point.'
  - 'Action 3: Test the response card from a scenario. Observed checks: A scenario tests the response
    order; Help can be contacted with useful information; Sensitive credentials remain separate.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1310_a1_primary
    - c1310_a2_primary
    - c1310_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: At what exact point would you stop troubleshooting, and could you obtain help
    without improvising?
  transfer_limit: A response card rehearses understanding and safe escalation for one utility. It does
    not qualify anyone to repair an installation or operate emergency controls.
  reflection:
    before: 'What would count as doing this honestly? Goal: Distinguish a simple user-level interruption
      from a utility problem requiring immediate or qualified help.'
    during: Which checks have actually been observed? The sequence is usable but the responsible property
      contact is not yet verified.
    after: At what exact point would you stop troubleshooting, and could you obtain help without improvising?
  review_guidance:
    repeat: Repeat the same bounded Utilities and household systems design only when the context and burden
      remain appropriate.
    adapt: Use a provider's accessible guide or a sample internet setup where property access is restricted.
      The card can direct a landlord or support person to act; the participant need not operate utility
      controls.
    stop: Stop Utilities and household systems when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: The card distinguished a device issue from a provider outage and supplied a clear support
      contact.
    mixed: The sequence is usable but the responsible property contact is not yet verified.
    contradictory: A panel was opened or an unknown valve or protection device was operated for practice.
    inconclusive: Contacts were listed without a tested decision sequence or stop point.
