  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Utilities and household systems explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Utilities and household systems context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Utilities and household systems observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Utilities and household systems rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Map the service and its permitted controls. Observed checks: The system
    and responsible contact are identified; User controls are distinguished from internal parts; Emergency
    and professional boundaries are stated. Action 2: Walk through one ordinary interruption. Observed
    checks: Device and service-level faults are distinguished; Steps come from the applicable instructions;
    The sequence has a clear stop point. Action 3: Test the response card from a scenario. Observed checks:
    A scenario tests the response order; Help can be contacted with useful information; Sensitive credentials
    remain separate.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Contacts were listed without a tested decision sequence
    or stop point.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Utilities
    and household systems contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
