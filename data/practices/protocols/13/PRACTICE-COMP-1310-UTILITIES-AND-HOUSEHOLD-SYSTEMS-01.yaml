meaning_and_fit:
  purpose: Distinguish a simple user-level interruption from a utility problem requiring immediate or
    qualified help.
  why_recommended: Distinguish a simple user-level interruption from a utility problem requiring immediate
    or qualified help.
  claims:
  - statement: Distinguish a simple user-level interruption from a utility problem requiring immediate
      or qualified help.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Utilities and household systems practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Utilities and household systems as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a provider's accessible guide or a sample internet setup where property
    access is restricted. The card can direct a landlord or support person to act; the participant need
    not operate utility controls.
  opportunity_considerations: Choose one household system and its instructions or provider information.
    Work from accessible safe locations only. Do not open covers, touch wiring or plumbing, operate unknown
    shutoffs, or create a fault for practice.
  prerequisites:
  - Choose one household system and its instructions or provider information. Work from accessible safe
    locations only. Do not open covers, touch wiring or plumbing, operate unknown shutoffs, or create
    a fault for practice.
  dependencies: []
  safe_alternatives:
  - Use a provider's accessible guide or a sample internet setup where property access is restricted.
    The card can direct a landlord or support person to act; the participant need not operate utility
    controls.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Utilities and household systems differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Utilities and household systems
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose one household system and its instructions or provider information. Work from accessible
    safe locations only. Do not open covers, touch wiring or plumbing, operate unknown shutoffs, or create
    a fault for practice. Goal: Distinguish a simple user-level interruption from a utility problem requiring
    immediate or qualified help. Scope: A response card rehearses understanding and safe escalation for
    one utility. It does not qualify anyone to repair an installation or operate emergency controls. Time
    and effort: About 30 minutes to prepare the card and 10 minutes to test one fictional interruption.
    Adaptation: Use a provider''s accessible guide or a sample internet setup where property access is
    restricted. The card can direct a landlord or support person to act; the participant need not operate
    utility controls. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a provider's accessible guide or a sample internet setup where property access
    is restricted. The card can direct a landlord or support person to act; the participant need not operate
    utility controls.
  expected_burden: About 30 minutes to prepare the card and 10 minutes to test one fictional interruption.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Utilities and household systems protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Utilities and household systems action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a provider's
    accessible guide or a sample internet setup where property access is restricted. The card can direct
    a landlord or support person to act; the participant need not operate utility controls.
  actions:
  - stable_id: PRACTICE-COMP-1310-UTILITIES-AND-HOUSEHOLD-SYSTEMS-01-A1
    sequence: 1
    title: Map the service and its permitted controls
    instructions: 'Identify the system, provider or responsible person, normal operating indicators and
      controls the manufacturer explicitly permits users to operate. For internet, distinguish the provider
      connection, modem, router and your device. For energy or water, identify the emergency contact and
      the boundary beyond which you leave the area and obtain help.


      Observation checks: The system and responsible contact are identified; User controls are distinguished
      from internal parts; Emergency and professional boundaries are stated. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1310-UTILITIES-AND-HOUSEHOLD-SYSTEMS-01
      action_stable_id: PRACTICE-COMP-1310-UTILITIES-AND-HOUSEHOLD-SYSTEMS-01-A1
      competency_stable_id: '13.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1310_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1310_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_system_and_responsible_contact_are_identified
        - user_controls_are_distinguished_from_internal_parts
        - emergency_and_professional_boundaries_are_stated
      - measurement_id: c1310_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1310_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1310-UTILITIES-AND-HOUSEHOLD-SYSTEMS-01-A2
    sequence: 2
    title: Walk through one ordinary interruption
    instructions: 'Use a fictional loss of internet or an unresponsive appliance. Check the sequence:
      is it one device or the whole service, is there an announced outage, and what safe user-level step
      does the manual permit? Record a decision tree with a stop point. Never test electrical safety by
      touch or repeatedly reset a tripping protection device.


      Observation checks: Device and service-level faults are distinguished; Steps come from the applicable
      instructions; The sequence has a clear stop point. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1310-UTILITIES-AND-HOUSEHOLD-SYSTEMS-01
      action_stable_id: PRACTICE-COMP-1310-UTILITIES-AND-HOUSEHOLD-SYSTEMS-01-A2
      competency_stable_id: '13.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1310_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1310_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - device_and_service_level_faults_are_distinguished
        - steps_come_from_the_applicable_instructions
        - the_sequence_has_a_clear_stop_point
      - measurement_id: c1310_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1310_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1310-UTILITIES-AND-HOUSEHOLD-SYSTEMS-01-A3
    sequence: 3
    title: Test the response card from a scenario
    instructions: 'Have yourself or a willing household member follow the card for the fictional interruption.
      Verify that contact information, necessary account access and symptom notes can be found privately.
      Revise any ambiguous step and keep emergency information accessible without exposing passwords or
      sensitive account data.


      Observation checks: A scenario tests the response order; Help can be contacted with useful information;
      Sensitive credentials remain separate. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: At what exact point would you stop troubleshooting, and could you obtain help without
      improvising?


      Examples: Supportive: The card distinguished a device issue from a provider outage and supplied
      a clear support contact.


      Mixed: The sequence is usable but the responsible property contact is not yet verified.


      Contradictory: A panel was opened or an unknown valve or protection device was operated for practice.


      Inconclusive: Contacts were listed without a tested decision sequence or stop point.'
    expected_time: 15-25 minutes
    due_within_days: 10
