meaning_and_fit:
  purpose: Connect a vehicle or machine symptom to its manual, service history and a clear maintenance
    request.
  why_recommended: Connect a vehicle or machine symptom to its manual, service history and a clear maintenance
    request.
  claims:
  - statement: Connect a vehicle or machine symptom to its manual, service history and a clear maintenance
      request.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Mechanical and vehicle literacy practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Mechanical and vehicle literacy as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a publicly available manual for a familiar bicycle or appliance and a
    fictional service record. This practices maintenance literacy and communication, not mechanical repair
    competence.
  opportunity_considerations: Choose a vehicle, bicycle or ordinary machine you use, its exact owner's
    manual and an existing maintenance record if available. Observe only from a safe stationary position;
    do not crawl beneath equipment or inspect running machinery.
  prerequisites:
  - Choose a vehicle, bicycle or ordinary machine you use, its exact owner's manual and an existing maintenance
    record if available. Observe only from a safe stationary position; do not crawl beneath equipment
    or inspect running machinery.
  dependencies: []
  safe_alternatives:
  - Use a publicly available manual for a familiar bicycle or appliance and a fictional service record.
    This practices maintenance literacy and communication, not mechanical repair competence.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Mechanical and vehicle literacy differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Mechanical and vehicle literacy
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a vehicle, bicycle or ordinary machine you use, its exact owner''s manual and an existing
    maintenance record if available. Observe only from a safe stationary position; do not crawl beneath
    equipment or inspect running machinery. Goal: Connect a vehicle or machine symptom to its manual,
    service history and a clear maintenance request. Scope: The brief develops maintenance literacy and
    communication about one system. It neither diagnoses every fault nor demonstrates hands-on servicing
    of a vehicle or machine. Time and effort: About 30–45 minutes to locate the manual, inspect safely
    and prepare the service request. Adaptation: Use a publicly available manual for a familiar bicycle
    or appliance and a fictional service record. This practices maintenance literacy and communication,
    not mechanical repair competence. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a publicly available manual for a familiar bicycle or appliance and a fictional
    service record. This practices maintenance literacy and communication, not mechanical repair competence.
  expected_burden: About 30–45 minutes to locate the manual, inspect safely and prepare the service request.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Mechanical and vehicle literacy protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Mechanical and vehicle literacy action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a publicly
    available manual for a familiar bicycle or appliance and a fictional service record. This practices
    maintenance literacy and communication, not mechanical repair competence.
  actions:
  - stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01-A1
    sequence: 1
    title: Identify the system and manual guidance
    instructions: 'Choose one routine item such as tire condition, a service interval or an existing warning
      indicator. Locate its meaning and recommended response in the exact manual, including when use should
      stop. Separate what you directly observed from what you suspect. Do not reproduce a warning by deliberately
      operating faulty equipment.


      Observation checks: The exact equipment manual is identified; The relevant system and response are
      located; Observation and suspected cause are separated. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01
      action_stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01-A1
      competency_stable_id: '13.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1309_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1309_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_exact_equipment_manual_is_identified
        - the_relevant_system_and_response_are_located
        - observation_and_suspected_cause_are_separated
      - measurement_id: c1309_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1309_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01-A2
    sequence: 2
    title: Compare condition with the maintenance record
    instructions: 'From a safe position, note visible condition and the last recorded service for that
      item. For tires, record only observations you can make safely and use the manufacturer''s specifications;
      do not guess inflation or repair limits. Mark missing history as unknown and identify a user-level
      check versus a technician-only task.


      Observation checks: Condition and service history are compared; Missing history remains unknown;
      User and technician responsibilities are separated. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01
      action_stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01-A2
      competency_stable_id: '13.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1309_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1309_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - condition_and_service_history_are_compared
        - missing_history_remains_unknown
        - user_and_technician_responsibilities_are_separated
      - measurement_id: c1309_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1309_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01-A3
    sequence: 3
    title: Prepare a useful service message
    instructions: 'Write a concise request containing equipment identification, symptom, when it occurs,
      relevant service history and the manual''s instruction. Ask for diagnosis, proposed work, cost and
      authorization before repair. Example: a warning appeared while stationary; the manual says stop
      use; the next step is arranging appropriate service, not test-driving it.


      Observation checks: The message contains actionable observations; Diagnosis is requested without
      asserting a cause; Continued-use and authorization decisions are explicit. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Could a technician understand the symptom without guessing, and have you avoided treating
      an unknown condition as safe?


      Examples: Supportive: A manual-based service need was identified and the request separated facts
      from a suspected fault.


      Mixed: The symptom is clear but maintenance history is missing and must remain uncertain.


      Contradictory: The equipment was operated despite a stop-use instruction or a diagnosis was asserted
      without evidence.


      Inconclusive: A generic maintenance checklist was copied without identifying the actual equipment.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01
      action_stable_id: PRACTICE-COMP-1309-MECHANICAL-AND-VEHICLE-LITERACY-01-A3
      competency_stable_id: '13.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
