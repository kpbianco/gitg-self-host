  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Mechanical and vehicle literacy; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a publicly available manual for a familiar bicycle or appliance and a fictional service record.
      This practices maintenance literacy and communication, not mechanical repair competence.
    cultural_context:
    - Adapt the expression of Mechanical and vehicle literacy to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a publicly available manual for a familiar bicycle or appliance and a fictional service record.
      This practices maintenance literacy and communication, not mechanical repair competence.
  pause_conditions:
  - Pause Mechanical and vehicle literacy when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Mechanical and vehicle literacy practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Mechanical and vehicle literacy situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Mechanical and vehicle literacy actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1309_a1_primary
  - c1309_a1_boundary
  - c1309_a1_adverse
  - c1309_a2_primary
  - c1309_a2_boundary
  - c1309_a2_adverse
  - c1309_a3_primary
  - c1309_a3_boundary
  - c1309_a3_adverse
  adverse_or_contradictory_indicators:
  - The equipment was operated despite a stop-use instruction or a diagnosis was asserted without evidence.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Mechanical and vehicle literacy explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Mechanical and vehicle literacy context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Mechanical and vehicle literacy observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Mechanical and vehicle literacy rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Identify the system and manual guidance. Observed checks: The exact equipment
    manual is identified; The relevant system and response are located; Observation and suspected cause
    are separated. Action 2: Compare condition with the maintenance record. Observed checks: Condition
    and service history are compared; Missing history remains unknown; User and technician responsibilities
    are separated. Action 3: Prepare a useful service message. Observed checks: The message contains actionable
    observations; Diagnosis is requested without asserting a cause; Continued-use and authorization decisions
    are explicit.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A generic maintenance checklist was copied without
    identifying the actual equipment.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Mechanical
    and vehicle literacy contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L15
  - L18
  - L20
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Mechanical and vehicle literacy evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Identify the system and manual guidance. Observed checks: The exact equipment manual is
    identified; The relevant system and response are located; Observation and suspected cause are separated.'
  - 'Action 2: Compare condition with the maintenance record. Observed checks: Condition and service history
    are compared; Missing history remains unknown; User and technician responsibilities are separated.'
  - 'Action 3: Prepare a useful service message. Observed checks: The message contains actionable observations;
    Diagnosis is requested without asserting a cause; Continued-use and authorization decisions are explicit.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1309_a1_primary
    - c1309_a2_primary
    - c1309_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Could a technician understand the symptom without guessing, and have you avoided
    treating an unknown condition as safe?
  transfer_limit: The brief develops maintenance literacy and communication about one system. It neither
    diagnoses every fault nor demonstrates hands-on servicing of a vehicle or machine.
  reflection:
    before: 'What would count as doing this honestly? Goal: Connect a vehicle or machine symptom to its
      manual, service history and a clear maintenance request.'
    during: Which checks have actually been observed? The symptom is clear but maintenance history is
      missing and must remain uncertain.
    after: Could a technician understand the symptom without guessing, and have you avoided treating an
      unknown condition as safe?
  review_guidance:
    repeat: Repeat the same bounded Mechanical and vehicle literacy design only when the context and burden
      remain appropriate.
    adapt: Use a publicly available manual for a familiar bicycle or appliance and a fictional service
      record. This practices maintenance literacy and communication, not mechanical repair competence.
    stop: Stop Mechanical and vehicle literacy when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A manual-based service need was identified and the request separated facts from a suspected
      fault.
    mixed: The symptom is clear but maintenance history is missing and must remain uncertain.
    contradictory: The equipment was operated despite a stop-use instruction or a diagnosis was asserted
      without evidence.
    inconclusive: A generic maintenance checklist was copied without identifying the actual equipment.
