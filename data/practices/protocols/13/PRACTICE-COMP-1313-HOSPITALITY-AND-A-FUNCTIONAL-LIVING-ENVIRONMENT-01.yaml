    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Hospitality and a functional living environment only when the
    initial context remained safe, the evidence criteria were usable, burden was acceptable, and a new
    context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Hospitality and a functional living environment
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Hospitality and a functional living environment require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Hospitality and a functional living environment criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'The environment reliably serves household needs and can receive
      others with dignity.', what contradiction or missing context matters most, and should this Hospitality
      and a functional living environment design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Hospitality and a functional living environment design only when the
      context and burden remain appropriate.
    adapt: Change the Hospitality and a functional living environment medium, scope, support, timing,
      criteria, or context while preserving provenance and the narrower evidence claim.
    stop: Stop Hospitality and a functional living environment when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Hospitality and a functional living environment
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Hospitality and a functional living environment criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Hospitality and a functional living environment criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Hospitality and a functional living environment
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Hospitality and a functional living environment action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
