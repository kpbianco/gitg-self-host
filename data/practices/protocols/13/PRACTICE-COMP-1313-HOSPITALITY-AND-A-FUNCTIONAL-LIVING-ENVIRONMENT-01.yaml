  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Hospitality and a functional living environment explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Hospitality and a functional living environment
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Hospitality and a functional living environment observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Hospitality and a functional living environment rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Map the needs of residents and a visitor. Observed checks: Resident and
    visitor needs are considered; A privacy or rest boundary is explicit; Access questions avoid unnecessary
    disclosure. Action 2: Arrange one modest welcome. Observed checks: The arrangement supports safe ordinary
    use; A modest welcome is prepared; Shared property and boundaries are respected. Action 3: Try the
    arrangement and reset the space. Observed checks: The visit sequence is tested; A practical barrier
    is noticed or checked; The household function is restored afterward.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The space looked attractive but arrival, access and
    ordinary household use were not tested.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Hospitality
    and a functional living environment contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
