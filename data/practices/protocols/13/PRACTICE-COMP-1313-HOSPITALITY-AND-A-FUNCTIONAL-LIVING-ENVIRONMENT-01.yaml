  adverse_or_contradictory_indicators:
  - The Hospitality and a functional living environment action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Hospitality and a functional living environment criterion,
    depended on coercion or hidden private content, or could not distinguish the protocol from contextual
    change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Hospitality and a functional living environment explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Hospitality and a functional living environment
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Hospitality and a functional living environment observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Hospitality and a functional living environment rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—The environment reliably serves household needs and can receive others with dignity.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Hospitality and a functional living environment requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Hospitality
    and a functional living environment evidence only under offline typed evaluation; protocol performance
    remains distinct and is never counted twice.
