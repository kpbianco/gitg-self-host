meaning_and_fit:
  purpose: Balance rest, practical use, privacy and welcome in one shared living area.
  why_recommended: Balance rest, practical use, privacy and welcome in one shared living area.
  claims:
  - statement: Balance rest, practical use, privacy and welcome in one shared living area.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Hospitality and a functional living environment practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Hospitality and a functional living environment as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Welcome someone in an accessible shared or public place, use a remote visit,
    or offer a brief doorstep exchange. Record which home functions the alternative does not test.
  opportunity_considerations: Choose a small space you may arrange and a real or fictional short visit.
    Consider the household's own use first; hospitality does not require a large home, expensive food
    or access to private rooms.
  prerequisites:
  - Choose a small space you may arrange and a real or fictional short visit. Consider the household's
    own use first; hospitality does not require a large home, expensive food or access to private rooms.
  dependencies: []
  safe_alternatives:
  - Welcome someone in an accessible shared or public place, use a remote visit, or offer a brief doorstep
    exchange. Record which home functions the alternative does not test.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Hospitality and a functional living environment differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Hospitality and a functional
    living environment as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a small space you may arrange and a real or fictional short visit. Consider the household''s
    own use first; hospitality does not require a large home, expensive food or access to private rooms.
    Goal: Balance rest, practical use, privacy and welcome in one shared living area. Scope: One space
    trial practices functional hospitality, comfort and shared use. It does not establish interior-design
    expertise or universal aesthetic preferences. Time and effort: About 20–40 minutes to plan and make
    a reversible change, plus one ordinary use and review. Adaptation: Welcome someone in an accessible
    shared or public place, use a remote visit, or offer a brief doorstep exchange. Record which home
    functions the alternative does not test. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Welcome someone in an accessible shared or public place, use a remote visit, or
    offer a brief doorstep exchange. Record which home functions the alternative does not test.
  expected_burden: About 20–40 minutes to plan and make a reversible change, plus one ordinary use and
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Hospitality and a functional living environment protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Hospitality and a functional living environment action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Welcome someone
    in an accessible shared or public place, use a remote visit, or offer a brief doorstep exchange. Record
    which home functions the alternative does not test.
  actions:
  - stable_id: PRACTICE-COMP-1313-HOSPITALITY-AND-A-FUNCTIONAL-LIVING-ENVIRONMENT-01-A1
    sequence: 1
    title: Map the needs of residents and a visitor
    instructions: 'List where people can sit, move, place belongings, rest and use necessary facilities.
      Identify one household need that must remain protected, such as quiet, medication access or a private
      area. Ask about a willing visitor''s access or dietary needs without demanding medical details.


      Observation checks: Resident and visitor needs are considered; A privacy or rest boundary is explicit;
      Access questions avoid unnecessary disclosure. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1313-HOSPITALITY-AND-A-FUNCTIONAL-LIVING-ENVIRONMENT-01
      action_stable_id: PRACTICE-COMP-1313-HOSPITALITY-AND-A-FUNCTIONAL-LIVING-ENVIRONMENT-01-A1
      competency_stable_id: '13.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1313_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1313_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - resident_and_visitor_needs_are_considered
        - a_privacy_or_rest_boundary_is_explicit
        - access_questions_avoid_unnecessary_disclosure
      - measurement_id: c1313_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1313_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1313-HOSPITALITY-AND-A-FUNCTIONAL-LIVING-ENVIRONMENT-01-A2
    sequence: 2
    title: Arrange one modest welcome
    instructions: 'Clear a safe passage, offer a usable seat or equivalent resting place, and make a simple
      welcome plan such as water and a short conversation. Use existing materials. Explain practical boundaries
      kindly, including visit length or shared-space rules, and avoid moving another resident''s belongings
      without agreement.


      Observation checks: The arrangement supports safe ordinary use; A modest welcome is prepared; Shared
      property and boundaries are respected. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1313-HOSPITALITY-AND-A-FUNCTIONAL-LIVING-ENVIRONMENT-01
      action_stable_id: PRACTICE-COMP-1313-HOSPITALITY-AND-A-FUNCTIONAL-LIVING-ENVIRONMENT-01-A2
      competency_stable_id: '13.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1313_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1313_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_arrangement_supports_safe_ordinary_use
        - a_modest_welcome_is_prepared
        - shared_property_and_boundaries_are_respected
      - measurement_id: c1313_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1313_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1313-HOSPITALITY-AND-A-FUNCTIONAL-LIVING-ENVIRONMENT-01-A3
    sequence: 3
    title: Try the arrangement and reset the space
    instructions: 'Walk through arrival, belongings, seating, conversation and departure, with a willing
      guest or as a rehearsal. Notice awkward reaches, noise, blocked movement or unclear boundaries.
      Restore the space for household use afterward and change one detail that would make a future welcome
      easier.


      Observation checks: The visit sequence is tested; A practical barrier is noticed or checked; The
      household function is restored afterward. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Did someone feel practically accommodated while the household''s privacy, rest and
      care needs remained intact?


      Examples: Supportive: A short visit had a clear seat, route and end time, and the room returned
      easily to ordinary use.


      Mixed: The guest was comfortable but resetting the space placed too much work on one resident.


      Contradictory: Hospitality required unwanted disclosure, an inaccessible route or overriding another
      resident''s boundary.


      Inconclusive: The space looked attractive but arrival, access and ordinary household use were not
      tested.'
    expected_time: 15-25 minutes
    due_within_days: 10
