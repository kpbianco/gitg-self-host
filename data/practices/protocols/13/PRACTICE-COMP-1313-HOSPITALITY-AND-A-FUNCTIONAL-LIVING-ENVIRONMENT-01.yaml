completion_and_review:
  completion_criteria:
  - The prepare a consent-safe hospitality and a functional living environment interaction action was
    attempted or explicitly deferred.
  - The practice one hospitality and a functional living environment communication act action was attempted
    or explicitly deferred.
  - The review hospitality and a functional living environment without scoring the person action preserved
