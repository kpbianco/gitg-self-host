  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Hospitality and a functional living environment; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Welcome someone in an accessible shared or public place, use a remote visit, or offer a brief doorstep
      exchange. Record which home functions the alternative does not test.
    cultural_context:
    - Adapt the expression of Hospitality and a functional living environment to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Welcome someone in an accessible shared or public place, use a remote visit, or offer a brief doorstep
      exchange. Record which home functions the alternative does not test.
  pause_conditions:
  - Pause Hospitality and a functional living environment when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Hospitality and a functional living environment practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Hospitality and a functional living environment situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
