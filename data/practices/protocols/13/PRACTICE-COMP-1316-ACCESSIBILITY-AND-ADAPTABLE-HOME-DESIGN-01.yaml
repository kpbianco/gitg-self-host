meaning_and_fit:
  purpose: Improve a real household task by changing the environment in a way the affected person can
    evaluate.
  why_recommended: Improve a real household task by changing the environment in a way the affected person
    can evaluate.
  claims:
  - statement: Improve a real household task by changing the environment in a way the affected person
      can evaluate.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Accessibility and adaptable home design practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Accessibility and adaptable home design as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use photographs or a paper layout only with permission when physical rearrangement
    is unavailable. A planning exercise may identify options, but it does not establish that a real barrier
    was reduced.
  opportunity_considerations: Choose one non-hazardous task such as finding a commonly used object, reading
    a label or reaching a light item. Work with the affected person's consent and preferences; do not
    simulate disability to guess their needs.
  prerequisites:
  - Choose one non-hazardous task such as finding a commonly used object, reading a label or reaching
    a light item. Work with the affected person's consent and preferences; do not simulate disability
    to guess their needs.
  dependencies: []
  safe_alternatives:
  - Use photographs or a paper layout only with permission when physical rearrangement is unavailable.
    A planning exercise may identify options, but it does not establish that a real barrier was reduced.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Accessibility and adaptable home design differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Accessibility and adaptable
    home design as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose one non-hazardous task such as finding a commonly used object, reading a label or reaching
    a light item. Work with the affected person''s consent and preferences; do not simulate disability
    to guess their needs. Goal: Improve a real household task by changing the environment in a way the
    affected person can evaluate. Scope: One user-led change tests an environmental barrier. Broader accessible
    design requires varied tasks, changing needs and expertise for structural or fitted adaptations. Time
    and effort: About 15 minutes to observe, 15–30 minutes to try a change, and a short user evaluation.
    Adaptation: Use photographs or a paper layout only with permission when physical rearrangement is
    unavailable. A planning exercise may identify options, but it does not establish that a real barrier
    was reduced. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use photographs or a paper layout only with permission when physical rearrangement
    is unavailable. A planning exercise may identify options, but it does not establish that a real barrier
    was reduced.
  expected_burden: About 15 minutes to observe, 15–30 minutes to try a change, and a short user evaluation.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Accessibility and adaptable home design protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Accessibility and adaptable home design action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use photographs
    or a paper layout only with permission when physical rearrangement is unavailable. A planning exercise
    may identify options, but it does not establish that a real barrier was reduced.
  actions:
  - stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01-A1
    sequence: 1
    title: Observe the task and ask about the barrier
    instructions: 'Walk through the task from its user''s ordinary position and communication mode. Ask
      where effort, confusion, glare, reach or interruption occurs. Record the function that matters,
      such as finding medication information without moving the medication itself. Separate the person''s
      account from assumptions about what should be easy.


      Observation checks: The task is described from its user''s perspective; A specific environmental
      barrier is identified; Preferences and consent guide the observation. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01
      action_stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01-A1
      competency_stable_id: '13.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1316_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1316_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_task_is_described_from_its_user_s_perspective
        - a_specific_environmental_barrier_is_identified
        - preferences_and_consent_guide_the_observation
      - measurement_id: c1316_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1316_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01-A2
    sequence: 2
    title: Try one reversible environmental change
    instructions: 'Agree on a small change using existing materials: clearer labels, a lighter container,
      more visible contrast or relocating an ordinary item to a reachable position. Preserve exits, supports
      and shared access. Structural changes, electrical work, medication handling and fitted assistive
      equipment require appropriate expertise beyond this trial.


      Observation checks: The change directly addresses the barrier; It is reversible and agreed; Safety
      and shared access are preserved. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01
      action_stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01-A2
      competency_stable_id: '13.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1316_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1316_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_change_directly_addresses_the_barrier
        - it_is_reversible_and_agreed
        - safety_and_shared_access_are_preserved
      - measurement_id: c1316_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1316_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01-A3
    sequence: 3
    title: Have the user evaluate the same task again
    instructions: 'Repeat the original task and ask whether effort, clarity, comfort or independence changed
      in the way the person wanted. Check for new difficulties elsewhere. Keep, revise or undo the change
      based on their assessment, and identify any need for a qualified accessibility professional.


      Observation checks: The same task is compared; The affected person''s evaluation determines success;
      New barriers and professional needs are considered. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Did the change solve the person''s stated problem, and would it remain usable when
      their needs or the household''s needs change?


      Examples: Supportive: The user found the labelled item more easily and preferred keeping the reversible
      change.


      Mixed: Visibility improved but the new location introduced an uncomfortable reach.


      Contradictory: The arrangement was imposed despite the user''s objection or blocked a necessary
      route.


      Inconclusive: A redesign was proposed without observing the original task or obtaining the user''s
      evaluation.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01
      action_stable_id: PRACTICE-COMP-1316-ACCESSIBILITY-AND-ADAPTABLE-HOME-DESIGN-01-A3
      competency_stable_id: '13.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
