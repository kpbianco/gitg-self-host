  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Accessibility and adaptable home design; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use photographs or a paper layout only with permission when physical rearrangement is unavailable.
      A planning exercise may identify options, but it does not establish that a real barrier was reduced.
    cultural_context:
    - Adapt the expression of Accessibility and adaptable home design to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use photographs or a paper layout only with permission when physical rearrangement is unavailable.
      A planning exercise may identify options, but it does not establish that a real barrier was reduced.
  pause_conditions:
  - Pause Accessibility and adaptable home design when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Accessibility and adaptable home design practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Accessibility and adaptable home design situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Accessibility and adaptable home design actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1316_a1_primary
  - c1316_a1_boundary
  - c1316_a1_adverse
  - c1316_a2_primary
  - c1316_a2_boundary
  - c1316_a2_adverse
  - c1316_a3_primary
  - c1316_a3_boundary
  - c1316_a3_adverse
  adverse_or_contradictory_indicators:
  - The arrangement was imposed despite the user's objection or blocked a necessary route.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Accessibility and adaptable home design explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Accessibility and adaptable home design
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Accessibility and adaptable home design observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Accessibility and adaptable home design rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Observe the task and ask about the barrier. Observed checks: The task
    is described from its user''s perspective; A specific environmental barrier is identified; Preferences
    and consent guide the observation. Action 2: Try one reversible environmental change. Observed checks:
    The change directly addresses the barrier; It is reversible and agreed; Safety and shared access are
    preserved. Action 3: Have the user evaluate the same task again. Observed checks: The same task is
    compared; The affected person''s evaluation determines success; New barriers and professional needs
    are considered.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A redesign was proposed without observing the original
    task or obtaining the user's evaluation.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Accessibility
    and adaptable home design contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L17
  - L18
  - L28
  - L31
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Accessibility and adaptable home design evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Observe the task and ask about the barrier. Observed checks: The task is described from
    its user''s perspective; A specific environmental barrier is identified; Preferences and consent guide
    the observation.'
  - 'Action 2: Try one reversible environmental change. Observed checks: The change directly addresses
    the barrier; It is reversible and agreed; Safety and shared access are preserved.'
  - 'Action 3: Have the user evaluate the same task again. Observed checks: The same task is compared;
    The affected person''s evaluation determines success; New barriers and professional needs are considered.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1316_a1_primary
    - c1316_a2_primary
    - c1316_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Did the change solve the person's stated problem, and would it remain usable when
    their needs or the household's needs change?
  transfer_limit: One user-led change tests an environmental barrier. Broader accessible design requires
    varied tasks, changing needs and expertise for structural or fitted adaptations.
  reflection:
    before: 'What would count as doing this honestly? Goal: Improve a real household task by changing
      the environment in a way the affected person can evaluate.'
    during: Which checks have actually been observed? Visibility improved but the new location introduced
      an uncomfortable reach.
    after: Did the change solve the person's stated problem, and would it remain usable when their needs
      or the household's needs change?
  review_guidance:
    repeat: Repeat the same bounded Accessibility and adaptable home design design only when the context
      and burden remain appropriate.
    adapt: Use photographs or a paper layout only with permission when physical rearrangement is unavailable.
      A planning exercise may identify options, but it does not establish that a real barrier was reduced.
    stop: Stop Accessibility and adaptable home design when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: The user found the labelled item more easily and preferred keeping the reversible change.
    mixed: Visibility improved but the new location introduced an uncomfortable reach.
    contradictory: The arrangement was imposed despite the user's objection or blocked a necessary route.
    inconclusive: A redesign was proposed without observing the original task or obtaining the user's
      evaluation.
