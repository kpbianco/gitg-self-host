meaning_and_fit:
  purpose: Use fabric-care information to clean, dry, inspect and store a garment without preventable
    damage.
  why_recommended: Use fabric-care information to clean, dry, inspect and store a garment without preventable
    damage.
  claims:
  - statement: Use fabric-care information to clean, dry, inspect and store a garment without preventable
      damage.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Garment care labels describe suitable washing, bleaching, drying and ironing methods and
      warnings about harmful treatments.
    classification: safety_precaution
    source_ids:
    - SRC-FTC-GARMENT-CARE
    limitations: US labeling guidance; legal labeling requirements vary elsewhere. Supports reading the
      actual label, not any invented treatment for an unknown textile.
  applicability_question: Does a voluntary, bounded Laundry and clothing care practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Laundry and clothing care as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible laundry controls, a smaller load, line drying or an agreed
    helper. If laundry access is absent, make the label-based plan and identify an available service;
    practical laundering remains untested.
  opportunity_considerations: Choose an ordinary washable garment with a readable care label, compatible
    detergent, drying space and your normal laundry access. Use an old low-value item for any repair practice.
  prerequisites:
  - Choose an ordinary washable garment with a readable care label, compatible detergent, drying space
    and your normal laundry access. Use an old low-value item for any repair practice.
  dependencies: []
  safe_alternatives:
  - Use accessible laundry controls, a smaller load, line drying or an agreed helper. If laundry access
    is absent, make the label-based plan and identify an available service; practical laundering remains
    untested.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Laundry and clothing care differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Laundry and clothing care
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary washable garment with a readable care label, compatible detergent, drying
    space and your normal laundry access. Use an old low-value item for any repair practice. Goal: Use
    fabric-care information to clean, dry, inspect and store a garment without preventable damage. Scope:
    One garment practices interpreting care instructions and using an appropriate method. Sewing, stain
    diagnosis and specialist textile care require additional practice. Time and effort: About 15 minutes
    of preparation and review plus the garment''s specified washing and drying time. Adaptation: Use accessible
    laundry controls, a smaller load, line drying or an agreed helper. If laundry access is absent, make
    the label-based plan and identify an available service; practical laundering remains untested. Keep
    personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Clothes Captioning — Complying with the Care Labeling Rule: https://www.ftc.gov/business-guidance/resources/clothes-captioning-complying-care-labeling-rule'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible laundry controls, a smaller load, line drying or an agreed helper.
    If laundry access is absent, make the label-based plan and identify an available service; practical
    laundering remains untested.
  expected_burden: About 15 minutes of preparation and review plus the garment's specified washing and
    drying time.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Laundry and clothing care protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Laundry and clothing care action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    laundry controls, a smaller load, line drying or an agreed helper. If laundry access is absent, make
    the label-based plan and identify an available service; practical laundering remains untested.
  actions:
  - stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01-A1
    sequence: 1
    title: Turn the care label into a plan
    instructions: 'Read washing, bleaching, drying and ironing restrictions. Check pockets, fasteners,
      colors and any stain, then choose a compatible load or separate treatment. Example: a cool-wash,
      air-dry garment should not be added to a hot wash and high-heat dryer simply because its color matches.


      Observation checks: Care restrictions are interpreted; Pockets and garment condition are checked;
      The load and drying method fit the label. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01
      action_stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01-A1
      competency_stable_id: '13.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1304_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1304_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - care_restrictions_are_interpreted
        - pockets_and_garment_condition_are_checked
        - the_load_and_drying_method_fit_the_label
      - measurement_id: c1304_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1304_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01-A2
    sequence: 2
    title: Wash and dry without improvising chemistry
    instructions: 'Follow the garment and product directions for the selected method and detergent amount.
      Separate unsuitable items and do not mix stain treatments. After washing, use the specified drying
      method and check whether the item is actually dry before storage. If a stain remains, check care
      guidance before applying heat or another treatment.


      Observation checks: The selected care method is followed; Drying respects the garment restriction;
      Remaining stain and moisture are checked. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01
      action_stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01-A2
      competency_stable_id: '13.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1304_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1304_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_selected_care_method_is_followed
        - drying_respects_the_garment_restriction
        - remaining_stain_and_moisture_are_checked
      - measurement_id: c1304_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1304_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01-A3
    sequence: 3
    title: Inspect serviceability and plan a repair
    instructions: 'Check seams, closures, shape and cleanliness. Fold or hang appropriately. For a loose
      button or seam, identify the repair needed and either follow a supplied repair guide on a spare
      item or arrange suitable help; do not practice on protective or safety-critical clothing. Record
      whether care preserved function and what needs follow-up.


      Observation checks: Cleanliness and structural condition are inspected; Storage matches the garment;
      Repair needs have a proportionate disposition. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which care decision prevented damage, and what would you do differently for another
      fabric?


      Examples: Supportive: A restricted garment was washed compatibly, air-dried and stored dry with
      a loose seam flagged.


      Mixed: The garment is clean but shrinking or a persistent stain suggests the care plan needs review.


      Contradictory: A warning label was ignored or a damp garment was sealed away.


      Inconclusive: The label was read but no care cycle or clearly labelled planning alternative was
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01
      action_stable_id: PRACTICE-COMP-1304-LAUNDRY-AND-CLOTHING-CARE-01-A3
      competency_stable_id: '13.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
