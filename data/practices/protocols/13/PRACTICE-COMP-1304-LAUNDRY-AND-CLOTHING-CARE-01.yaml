  - c1304_a3_adverse
  adverse_or_contradictory_indicators:
  - The Laundry and clothing care action exceeded consent, authority, privacy, qualification, role, burden,
    or safety boundaries.
  - The evidence contradicted the intended Laundry and clothing care criterion, depended on coercion or
    hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Laundry and clothing care explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Laundry and clothing care context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Laundry and clothing care observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Laundry and clothing care rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Clothing remains clean, serviceable, and appropriately repaired.—not completion, confidence,
    conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Laundry and clothing care requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Laundry and
    clothing care evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L18
  minimum_evidence_before_state_update: No current-state update is permitted for this Laundry and clothing
    care draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Laundry and clothing care evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The define observable criteria for laundry and clothing care action was attempted or explicitly deferred.
  - The rehearse laundry and clothing care twice action was attempted or explicitly deferred.
  - The use feedback for one laundry and clothing care retry action preserved a limited conclusion, contradiction,
    or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1304_a1_primary
    - c1304_a2_primary
    - c1304_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Laundry and clothing care only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Laundry and clothing care across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Laundry and clothing care require in this exact context, what remains outside my
      role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Laundry and clothing care criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Clothing remains clean, serviceable, and appropriately repaired.',
      what contradiction or missing context matters most, and should this Laundry and clothing care design
      be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Laundry and clothing care design only when the context and burden
      remain appropriate.
    adapt: Change the Laundry and clothing care medium, scope, support, timing, criteria, or context while
      preserving provenance and the narrower evidence claim.
    stop: Stop Laundry and clothing care when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Laundry and clothing care questions beyond
      this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Laundry and clothing care criteria were observed with provenance and no adverse
      boundary signal in the selected context.
    mixed: Some Laundry and clothing care criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Laundry and clothing care criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Laundry and clothing care action was deferred, not observed, not applicable, stale,
      insufficiently bounded, or too confounded to interpret.
