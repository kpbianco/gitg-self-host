  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Laundry and clothing care; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use accessible laundry controls, a smaller load, line drying or an agreed helper. If laundry access
      is absent, make the label-based plan and identify an available service; practical laundering remains
      untested.
    cultural_context:
    - Adapt the expression of Laundry and clothing care to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use accessible laundry controls, a smaller load, line drying or an agreed helper. If laundry access
      is absent, make the label-based plan and identify an available service; practical laundering remains
      untested.
  pause_conditions:
  - Pause Laundry and clothing care when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Laundry and clothing care practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Laundry and clothing care situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Laundry and clothing care actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
