  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Laundry and clothing care explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Laundry and clothing care context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Laundry and clothing care observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Laundry and clothing care rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Turn the care label into a plan. Observed checks: Care restrictions are
    interpreted; Pockets and garment condition are checked; The load and drying method fit the label.
    Action 2: Wash and dry without improvising chemistry. Observed checks: The selected care method is
    followed; Drying respects the garment restriction; Remaining stain and moisture are checked. Action
    3: Inspect serviceability and plan a repair. Observed checks: Cleanliness and structural condition
    are inspected; Storage matches the garment; Repair needs have a proportionate disposition.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The label was read but no care cycle or clearly labelled
    planning alternative was completed.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Laundry
    and clothing care contribution under typed evaluation; protocol performance remains distinct and is
    never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L18
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Laundry and clothing care evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Turn the care label into a plan. Observed checks: Care restrictions are interpreted; Pockets
    and garment condition are checked; The load and drying method fit the label.'
  - 'Action 2: Wash and dry without improvising chemistry. Observed checks: The selected care method is
    followed; Drying respects the garment restriction; Remaining stain and moisture are checked.'
  - 'Action 3: Inspect serviceability and plan a repair. Observed checks: Cleanliness and structural condition
    are inspected; Storage matches the garment; Repair needs have a proportionate disposition.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1304_a1_primary
    - c1304_a2_primary
    - c1304_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Which care decision prevented damage, and what would you do differently for another
    fabric?
  transfer_limit: One garment practices interpreting care instructions and using an appropriate method.
    Sewing, stain diagnosis and specialist textile care require additional practice.
  reflection:
    before: 'What would count as doing this honestly? Goal: Use fabric-care information to clean, dry,
      inspect and store a garment without preventable damage.'
    during: Which checks have actually been observed? The garment is clean but shrinking or a persistent
      stain suggests the care plan needs review.
    after: Which care decision prevented damage, and what would you do differently for another fabric?
  review_guidance:
    repeat: Repeat the same bounded Laundry and clothing care design only when the context and burden
      remain appropriate.
    adapt: Use accessible laundry controls, a smaller load, line drying or an agreed helper. If laundry
      access is absent, make the label-based plan and identify an available service; practical laundering
      remains untested.
    stop: Stop Laundry and clothing care when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A restricted garment was washed compatibly, air-dried and stored dry with a loose seam
      flagged.
    mixed: The garment is clean but shrinking or a persistent stain suggests the care plan needs review.
    contradictory: A warning label was ignored or a damp garment was sealed away.
    inconclusive: The label was read but no care cycle or clearly labelled planning alternative was completed.
