    boundary_heading: No repair, hazard work, private home contents, or judgment of cleanliness.
    timing_hint: Plan one reversible change and two natural upkeep opportunities within 14 days.
    applicability_heading: One safe area or routine within your authority
  check_in_labels:
    home_system_audit_criteria: Audit criteria present
