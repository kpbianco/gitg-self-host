        expected: true
      - measurement_id: c1306_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1306-BAKING-AND-FOOD-CHEMISTRY-01-A2
    sequence: 2
    title: Cook both samples under comparable conditions
    instructions: 'Roll equal portions to about 6 mm thickness. In a lightly oiled skillet, cook for roughly
      two to three minutes on the first side and two on the second; lower heat if the outside darkens
      before the center cooks. Cut a sample to check for uncooked dough and continue cooking if needed;
      color alone is insufficient. Never taste uncooked dough. Wash hands, tools and surfaces after raw-flour
      contact, and label the cooked samples.


      Observation checks: Sample size and method are comparable; Both samples are cooked through; Finished
      samples remain identifiable. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1306-BAKING-AND-FOOD-CHEMISTRY-01
      action_stable_id: PRACTICE-COMP-1306-BAKING-AND-FOOD-CHEMISTRY-01-A2
      competency_stable_id: '13.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
