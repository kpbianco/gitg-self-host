        expected: true
  - stable_id: PRACTICE-COMP-1306-BAKING-AND-FOOD-CHEMISTRY-01-A3
    sequence: 3
    title: Connect the result to the formulation
    instructions: 'Compare height, flexibility, crumb and flavor after cooling. Explain which difference
      might follow from leavening and which could come from uneven thickness or heat. Note that flour
      choice and mixing affect structure, while a different liquid-to-flour ratio would test hydration
      instead. Propose one subsequent change, not a whole new recipe.


      Observation checks: Observable differences are compared; Confounding factors are acknowledged; One
      next controlled change is proposed. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What did the comparison support about the chosen variable, and what would you need
      to control better next time?


      Examples: Supportive: The leavened sample differed in texture while the cook identified uneven thickness
      as a possible confound.


      Mixed: The samples differed but flour or water quantities also changed, preventing attribution.


      Contradictory: Raw dough was tasted or a flour was used despite a known dietary restriction.


      Inconclusive: A preference was reported without keeping quantities or identifying the two samples.'
    expected_time: 15-25 minutes
    due_within_days: 10
