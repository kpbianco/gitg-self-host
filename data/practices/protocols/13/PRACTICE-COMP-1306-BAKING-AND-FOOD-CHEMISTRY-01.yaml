intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a flour tolerated by the eater, water, a little oil, baking powder labelled for that use,
    measuring tools and a safe cooking surface. For an unfamiliar flour or restricted diet, use a compatible
    manufacturer''s flatbread formula as the baseline and record that choice. Goal: Use a controlled cooking
    comparison to connect measurement, hydration and leavening to a finished food. Scope: Two flatbreads
    illustrate measurement, leavening, dough structure and heat control. Yeast fermentation, oven baking,
    pastry and reliable repeated execution remain further skills. Time and effort: About 45–60 minutes
    including measurement, cooking, comparison and cleaning; allow more with assistance. Adaptation: Use
    an existing compatible recipe and halve it, or compare the ingredient functions in two labelled baked
    products when cooking is inaccessible. Product comparison does not demonstrate execution of baking
    techniques. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Flour Is a Raw Food and Other Safety Facts: https://www.fda.gov/consumers/consumer-updates/flour-raw-food-and-other-safety-facts

    Skillet Flatbreads: https://www.kingarthurbaking.com/recipes/skillet-flatbreads-recipe'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an existing compatible recipe and halve it, or compare the ingredient functions
    in two labelled baked products when cooking is inaccessible. Product comparison does not demonstrate
    execution of baking techniques.
  expected_burden: About 45–60 minutes including measurement, cooking, comparison and cleaning; allow
    more with assistance.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Baking and food chemistry protocol to rank worth, coerce participation, demand disclosure,
