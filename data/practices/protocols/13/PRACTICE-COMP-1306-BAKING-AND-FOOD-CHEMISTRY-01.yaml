  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an existing
    compatible recipe and halve it, or compare the ingredient functions in two labelled baked products
    when cooking is inaccessible. Product comparison does not demonstrate execution of baking techniques.
  actions:
  - stable_id: PRACTICE-COMP-1306-BAKING-AND-FOOD-CHEMISTRY-01-A1
    sequence: 1
    title: Measure a baseline and choose one variable
    instructions: 'For a familiar wheat-flour baseline, mix 100 g flour, about 60 mL water, one teaspoon
      oil and a pinch of salt into a soft dough. Divide it equally. Leave one half plain and knead one
      eighth teaspoon baking powder into the other. Keep thickness and cooking method alike. Do not taste
      raw flour or dough.


      Observation checks: Quantities and flour choice are recorded; Only the intended leavening variable
      differs; Raw dough is not tasted. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1306-BAKING-AND-FOOD-CHEMISTRY-01
      action_stable_id: PRACTICE-COMP-1306-BAKING-AND-FOOD-CHEMISTRY-01-A1
      competency_stable_id: '13.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
