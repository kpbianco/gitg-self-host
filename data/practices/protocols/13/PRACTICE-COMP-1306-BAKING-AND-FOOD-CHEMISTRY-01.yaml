meaning_and_fit:
  purpose: Use a controlled cooking comparison to connect measurement, hydration and leavening to a finished
    food.
  why_recommended: Use a controlled cooking comparison to connect measurement, hydration and leavening
    to a finished food.
  claims:
  - statement: Use a controlled cooking comparison to connect measurement, hydration and leavening to
      a finished food.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Raw flour and dough can contain harmful germs; do not taste them, and clean hands, equipment
      and surfaces after handling them.
    classification: safety_precaution
    source_ids:
    - SRC-FDA-RAW-FLOUR
    limitations: Food-handling support only; does not validate the educational comparison or establish
      that appearance alone proves a flour product safe.
  - statement: A published skillet-flatbread method rolls portions to about 6 mm thickness and cooks each
      side for several minutes; thickness and heat need to be controlled together.
    classification: professional_or_public_standard
    source_ids:
    - SRC-KAB-SKILLET-TECHNIQUE
    limitations: Technique reference only. The product's smaller two-sample formulation and leavening
      comparison are original educational designs, not tested or endorsed by the source.
  applicability_question: Does a voluntary, bounded Baking and food chemistry practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Baking and food chemistry as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an existing compatible recipe and halve it, or compare the ingredient
    functions in two labelled baked products when cooking is inaccessible. Product comparison does not
    demonstrate execution of baking techniques.
  opportunity_considerations: Use a flour tolerated by the eater, water, a little oil, baking powder labelled
    for that use, measuring tools and a safe cooking surface. For an unfamiliar flour or restricted diet,
    use a compatible manufacturer's flatbread formula as the baseline and record that choice.
