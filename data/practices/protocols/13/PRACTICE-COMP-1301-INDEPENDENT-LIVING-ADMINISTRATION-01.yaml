  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Independent-living administration; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a single envelope and paper calendar, dictation, translated labels or a trusted supporter. If
      documents are inaccessible, work with fictional appointment and renewal notices; this tests the
      system rather than resolving the real obligation.
    cultural_context:
    - Adapt the expression of Independent-living administration to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a single envelope and paper calendar, dictation, translated labels or a trusted supporter. If
      documents are inaccessible, work with fictional appointment and renewal notices; this tests the
      system rather than resolving the real obligation.
  pause_conditions:
  - Pause Independent-living administration when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Independent-living administration practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Independent-living administration situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Independent-living administration actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1301_a1_primary
  - c1301_a1_boundary
  - c1301_a1_adverse
  - c1301_a2_primary
  - c1301_a2_boundary
  - c1301_a2_adverse
  - c1301_a3_primary
  - c1301_a3_boundary
  - c1301_a3_adverse
  adverse_or_contradictory_indicators:
  - Sensitive identification details were copied into a shared task list or an unread form was submitted.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Independent-living administration explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Independent-living administration context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Independent-living administration observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Independent-living administration rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Sort three obligations by next action. Observed checks: Three items have
    next actions; Dates or absence of a deadline are explicit; Sensitive contents remain private. Action
    2: Complete one action and file its proof. Observed checks: One authorized action is completed; Confirmation
    has a retrieval location; The next dependency is identified. Action 3: Test retrieval and the next
    review. Observed checks: The confirmation can be found; The deadline can be found; A sustainable review
    cue is chosen.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Folders were created but no obligation was handled
    or retrieved.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Independent-living
    administration contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L18
  - L21
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Independent-living administration evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Sort three obligations by next action. Observed checks: Three items have next actions;
    Dates or absence of a deadline are explicit; Sensitive contents remain private.'
  - 'Action 2: Complete one action and file its proof. Observed checks: One authorized action is completed;
    Confirmation has a retrieval location; The next dependency is identified.'
  - 'Action 3: Test retrieval and the next review. Observed checks: The confirmation can be found; The
    deadline can be found; A sustainable review cue is chosen.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1301_a1_primary
    - c1301_a2_primary
    - c1301_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Which obligation became easier to act on, and where could an item still disappear?
  transfer_limit: Three obligations test capture, action and retrieval. A complete administration system
    also needs secure records, recurring renewals and handling of complex obligations over time.
  reflection:
    before: 'What would count as doing this honestly? Goal: Retrieve an essential record and handle one
      obligation before it becomes a crisis.'
    during: Which checks have actually been observed? The records are searchable but the calendar reminder
      was set for the wrong day.
    after: Which obligation became easier to act on, and where could an item still disappear?
  review_guidance:
    repeat: Repeat the same bounded Independent-living administration design only when the context and
      burden remain appropriate.
    adapt: Use a single envelope and paper calendar, dictation, translated labels or a trusted supporter.
      If documents are inaccessible, work with fictional appointment and renewal notices; this tests the
      system rather than resolving the real obligation.
    stop: Stop Independent-living administration when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: An appointment was confirmed and its confirmation and travel reminder were found on the
      next check.
    mixed: The records are searchable but the calendar reminder was set for the wrong day.
    contradictory: Sensitive identification details were copied into a shared task list or an unread form
      was submitted.
    inconclusive: Folders were created but no obligation was handled or retrieved.
