meaning_and_fit:
  purpose: Retrieve an essential record and handle one obligation before it becomes a crisis.
  why_recommended: Retrieve an essential record and handle one obligation before it becomes a crisis.
  claims:
  - statement: Retrieve an essential record and handle one obligation before it becomes a crisis.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Independent-living administration practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Independent-living administration as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a single envelope and paper calendar, dictation, translated labels or
    a trusted supporter. If documents are inaccessible, work with fictional appointment and renewal notices;
    this tests the system rather than resolving the real obligation.
  opportunity_considerations: Use three non-sensitive examples of mail, appointments, forms or renewals,
    a folder or envelope, and a calendar you already use. Keep identity numbers and document contents
    out of the application.
  prerequisites:
  - Use three non-sensitive examples of mail, appointments, forms or renewals, a folder or envelope, and
    a calendar you already use. Keep identity numbers and document contents out of the application.
  dependencies: []
  safe_alternatives:
  - Use a single envelope and paper calendar, dictation, translated labels or a trusted supporter. If
    documents are inaccessible, work with fictional appointment and renewal notices; this tests the system
    rather than resolving the real obligation.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Independent-living administration differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Independent-living administration
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use three non-sensitive examples of mail, appointments, forms or renewals, a folder or envelope,
    and a calendar you already use. Keep identity numbers and document contents out of the application.
    Goal: Retrieve an essential record and handle one obligation before it becomes a crisis. Scope: Three
    obligations test capture, action and retrieval. A complete administration system also needs secure
    records, recurring renewals and handling of complex obligations over time. Time and effort: About
    30 minutes to sort and handle an item, then 5 minutes for a separate retrieval check. Adaptation:
    Use a single envelope and paper calendar, dictation, translated labels or a trusted supporter. If
    documents are inaccessible, work with fictional appointment and renewal notices; this tests the system
    rather than resolving the real obligation. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a single envelope and paper calendar, dictation, translated labels or a trusted
    supporter. If documents are inaccessible, work with fictional appointment and renewal notices; this
    tests the system rather than resolving the real obligation.
  expected_burden: About 30 minutes to sort and handle an item, then 5 minutes for a separate retrieval
    check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Independent-living administration protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Independent-living administration action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a single
    envelope and paper calendar, dictation, translated labels or a trusted supporter. If documents are
    inaccessible, work with fictional appointment and renewal notices; this tests the system rather than
    resolving the real obligation.
  actions:
  - stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01-A1
    sequence: 1
    title: Sort three obligations by next action
    instructions: 'For each item identify the sender, required action, due date, and where confirmation
      will be kept. Use these categories: act, waiting for someone, keep as a record, or safely discard.
      Example: an appointment letter needs a calendar entry, travel preparation, and a confirmation location;
      it is not merely a document to file.


      Observation checks: Three items have next actions; Dates or absence of a deadline are explicit;
      Sensitive contents remain private. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01
      action_stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01-A1
      competency_stable_id: '13.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1301_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1301_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_items_have_next_actions
        - dates_or_absence_of_a_deadline_are_explicit
        - sensitive_contents_remain_private
      - measurement_id: c1301_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1301_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01-A2
    sequence: 2
    title: Complete one action and file its proof
    instructions: 'Handle the smallest due item within your authority: confirm an appointment, cancel
      an unwanted reminder, or prepare a form for checking. Store the confirmation in one named location
      and record the next dependency. Do not submit a legal or financial form whose meaning you do not
      understand.


      Observation checks: One authorized action is completed; Confirmation has a retrieval location; The
      next dependency is identified. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01
      action_stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01-A2
      competency_stable_id: '13.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1301_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1301_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_authorized_action_is_completed
        - confirmation_has_a_retrieval_location
        - the_next_dependency_is_identified
      - measurement_id: c1301_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1301_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01-A3
    sequence: 3
    title: Test retrieval and the next review
    instructions: 'After putting the materials away, find the confirmation and next deadline without reconstructing
      the whole process. Check whether another reminder is necessary and reserve a short recurring inbox
      review. If retrieval fails, rename or simplify the folder before adding more records.


      Observation checks: The confirmation can be found; The deadline can be found; A sustainable review
      cue is chosen. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Which obligation became easier to act on, and where could an item still disappear?


      Examples: Supportive: An appointment was confirmed and its confirmation and travel reminder were
      found on the next check.


      Mixed: The records are searchable but the calendar reminder was set for the wrong day.


      Contradictory: Sensitive identification details were copied into a shared task list or an unread
      form was submitted.


      Inconclusive: Folders were created but no obligation was handled or retrieved.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01
      action_stable_id: PRACTICE-COMP-1301-INDEPENDENT-LIVING-ADMINISTRATION-01-A3
      competency_stable_id: '13.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
