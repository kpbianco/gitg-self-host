intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a non-structural handle you own or have permission to service, adequate light and a correctly
    fitting hand screwdriver. Exclude doors used for fire safety, electrical equipment, sharp machinery,
    drilling and load-bearing repairs. Goal: Use observation, tool selection and a reversible repair to
    solve a minor fastener problem within clear limits. Scope: A non-structural handle practices diagnosis,
    tool fit and testing. Plumbing, wiring, structural work and damaged mounting materials remain outside
    this minor repair. Time and effort: About 10 minutes to inspect and 10–20 minutes to adjust, test
    and put tools away. Adaptation: Use a tabletop assembly or demonstrate tool fit with an unpowered
    practice fastener if no suitable fixture or hand control is available. A helper may supply force while
    the person directs diagnosis and checks; note that supported role. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a tabletop assembly or demonstrate tool fit with an unpowered practice fastener
    if no suitable fixture or hand control is available. A helper may supply force while the person directs
    diagnosis and checks; note that supported role.
  expected_burden: About 10 minutes to inspect and 10–20 minutes to adjust, test and put tools away.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Basic tools and household repair protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Basic tools and household repair action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a tabletop
    assembly or demonstrate tool fit with an unpowered practice fastener if no suitable fixture or hand
    control is available. A helper may supply force while the person directs diagnosis and checks; note
    that supported role.
  actions:
  - stable_id: PRACTICE-COMP-1308-BASIC-TOOLS-AND-HOUSEHOLD-REPAIR-01-A1
    sequence: 1
    title: Inspect before reaching for a tool
    instructions: 'Open the empty cabinet or drawer safely and locate the handle fasteners. Check for
      missing parts, damaged screw heads, cracked material or a handle that is not simply loose. Identify
      the screwdriver shape and size by fit. If threads or the mounting material are damaged, stop tightening
      and seek an appropriate replacement or repair guide.


      Observation checks: The cause is distinguished from visible movement; Tool fit is checked; Damage
      and excluded work have a stop decision. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1308-BASIC-TOOLS-AND-HOUSEHOLD-REPAIR-01
      action_stable_id: PRACTICE-COMP-1308-BASIC-TOOLS-AND-HOUSEHOLD-REPAIR-01-A1
      competency_stable_id: '13.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1308_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1308_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_cause_is_distinguished_from_visible_movement
        - tool_fit_is_checked
        - damage_and_excluded_work_have_a_stop_decision
      - measurement_id: c1308_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1308_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1308-BASIC-TOOLS-AND-HOUSEHOLD-REPAIR-01-A2
    sequence: 2
    title: Make the smallest permitted adjustment
    instructions: 'Support the handle with one hand and turn the screw gently with the fitting tool. Stop
      when the handle is secure; do not force a spinning screw, crush the panel or use a power driver
      to overcome uncertainty. Keep small parts away from children and record which fastener was adjusted.


      Observation checks: The handle is supported during adjustment; Only a suitable hand tool is used;
      Tightening stops without force or material damage. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1308-BASIC-TOOLS-AND-HOUSEHOLD-REPAIR-01
      action_stable_id: PRACTICE-COMP-1308-BASIC-TOOLS-AND-HOUSEHOLD-REPAIR-01-A2
      competency_stable_id: '13.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1308_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1308_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_handle_is_supported_during_adjustment
        - only_a_suitable_hand_tool_is_used
        - tightening_stops_without_force_or_material_damage
      - measurement_id: c1308_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1308_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1308-BASIC-TOOLS-AND-HOUSEHOLD-REPAIR-01-A3
    sequence: 3
    title: Test function and report the repair
    instructions: 'Operate the handle normally several times and inspect for wobble, rubbing or renewed
      looseness. Explain the original symptom, adjustment and test in three short statements. If it loosens
      again, identify the unresolved issue instead of repeatedly tightening. Return tools and decide whether
      a competent repairer is needed.


      Observation checks: Normal operation is tested; Symptom and intervention are documented; Persistent
      failure has a next disposition. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Did the adjustment address the cause, and what observation would tell you this is
      beyond a simple tightening repair?


      Examples: Supportive: A fitting screwdriver secured the loose handle and repeated ordinary use produced
      no wobble.


      Mixed: The handle improved but a damaged thread means the repair is temporary.


      Contradictory: A slipping tool damaged the screw or force was increased after the fastener spun
      freely.


      Inconclusive: The handle was touched but the cause or post-repair function was not checked.'
    expected_time: 15-25 minutes
    due_within_days: 10
