    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Basic tools and household repair practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Basic tools and household repair as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a tabletop assembly or demonstrate tool fit with an unpowered practice
    fastener if no suitable fixture or hand control is available. A helper may supply force while the
    person directs diagnosis and checks; note that supported role.
  opportunity_considerations: Use a non-structural handle you own or have permission to service, adequate
    light and a correctly fitting hand screwdriver. Exclude doors used for fire safety, electrical equipment,
    sharp machinery, drilling and load-bearing repairs.
  prerequisites:
