meaning_and_fit:
  purpose: Articulate present convictions, unresolved questions, and conditions for revising them.
  why_recommended: Articulate present convictions, unresolved questions, and conditions for revising them.
  claims:
  - statement: Articulate present convictions, unresolved questions, and conditions for revising them.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Socratic inquiry examines beliefs through questions and recognizes the limits of what one
      knows.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-SOCRATIC-INQUIRY
    limitations: Historical philosophical context only; does not validate this worldview worksheet, promise
      psychological benefit, or require acceptance of Socrates' conclusions.
  applicability_question: Does a voluntary, bounded A provisional worldview practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record A provisional worldview as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Keep this private, dictate it, or use fictional positions if disclosure is
    unsafe. No conversion, debate, trauma disclosure, or resolution of every philosophical question is
    needed.
  opportunity_considerations: 'Use six headings: reality, human nature, knowledge, morality, suffering,
    and freedom/responsibility. Uncertainty is an acceptable entry under every heading.'
  prerequisites:
  - 'Use six headings: reality, human nature, knowledge, morality, suffering, and freedom/responsibility.
    Uncertainty is an acceptable entry under every heading.'
  dependencies: []
  safe_alternatives:
  - Keep this private, dictate it, or use fictional positions if disclosure is unsafe. No conversion,
    debate, trauma disclosure, or resolution of every philosophical question is needed.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    A provisional worldview differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about A provisional worldview as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use six headings: reality, human nature, knowledge, morality, suffering, and freedom/responsibility.
    Uncertainty is an acceptable entry under every heading. Goal: Articulate present convictions, unresolved
    questions, and conditions for revising them. Scope: The six headings connect the principal worldview
    questions. One tension check develops coherence; it cannot establish the truth of every belief or
    replace sustained philosophical study. Time and effort: About 30 minutes to draft and examine one
    tension; 10 minutes for a later reread. Adaptation: Keep this private, dictate it, or use fictional
    positions if disclosure is unsafe. No conversion, debate, trauma disclosure, or resolution of every
    philosophical question is needed. Keep personal working notes outside the check-in; record only the
    listed observations.


    Reference support:

    Introduction to Philosophy, 1.3 Socrates as a Paradigmatic Historical Philosopher: https://openstax.org/books/introduction-philosophy/pages/1-3-socrates-as-a-paradigmatic-historical-philosopher'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Keep this private, dictate it, or use fictional positions if disclosure is unsafe.
    No conversion, debate, trauma disclosure, or resolution of every philosophical question is needed.
  expected_burden: About 30 minutes to draft and examine one tension; 10 minutes for a later reread.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the A provisional worldview protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed A provisional worldview action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Keep this private,
    dictate it, or use fictional positions if disclosure is unsafe. No conversion, debate, trauma disclosure,
    or resolution of every philosophical question is needed.
  actions:
  - stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01-A1
    sequence: 1
    title: State convictions and uncertainty separately
    instructions: 'Under each heading write one current belief or open question, one reason for it, and
      how confident you are in ordinary language. Distinguish experience, trusted testimony, inference,
      and faith. Example: people can change; a repaired relationship supports this; the circumstances
      that make change possible remain uncertain.


      Observation checks: All six headings are addressed; Reasons are distinguished from convictions;
      Uncertainty is explicit. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01
      action_stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01-A1
      competency_stable_id: '01.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0102_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0102_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_six_headings_are_addressed
        - reasons_are_distinguished_from_convictions
        - uncertainty_is_explicit
      - measurement_id: c0102_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0102_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01-A2
    sequence: 2
    title: Examine one tension between beliefs
    instructions: 'Select two entries that could conflict, such as strong personal responsibility and
      unequal opportunity. Describe one case in which both matter. Explain whether the beliefs genuinely
      contradict, apply at different levels, or require revision. Include the strongest objection you
      can fairly state.


      Observation checks: Two beliefs are compared; A concrete case tests their relationship; A serious
      objection is represented. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01
      action_stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01-A2
      competency_stable_id: '01.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0102_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0102_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_beliefs_are_compared
        - a_concrete_case_tests_their_relationship
        - a_serious_objection_is_represented
      - measurement_id: c0102_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0102_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01-A3
    sequence: 3
    title: Add a revision clause and one implication
    instructions: 'Rewrite one entry after the tension check. State what evidence, experience, reasoning,
      or unresolved question could change your view, and one small decision affected by it. Schedule a
      later reread; agreement with a particular worldview is never a completion criterion.


      Observation checks: A revision condition is stated; A practical implication is identified; A dated
      reread is chosen. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.


      Final review: Which conviction is better supported now, and which is simply more clearly uncertain?


      Examples: Supportive: Responsibility was retained while the decision rule explicitly accounted for
      resources and constraints.


      Mixed: The worldview is coherent on paper but no imaginable revision condition was identified.


      Contradictory: Disagreement was treated as proof of another person''s ignorance or lesser dignity.


      Inconclusive: Six slogans were copied without reasons, questions, or implications.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01
      action_stable_id: PRACTICE-COMP-0102-A-PROVISIONAL-WORLDVIEW-01-A3
      competency_stable_id: '01.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0102_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0102_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_revision_condition_is_stated
        - a_practical_implication_is_identified
        - a_dated_reread_is_chosen
      - measurement_id: c0102_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0102_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
