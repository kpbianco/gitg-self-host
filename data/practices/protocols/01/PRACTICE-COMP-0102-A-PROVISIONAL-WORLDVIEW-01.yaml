    accessibility:
    - Keep this private, dictate it, or use fictional positions if disclosure is unsafe. No conversion,
      debate, trauma disclosure, or resolution of every philosophical question is needed.
    cultural_context:
    - Adapt the expression of A provisional worldview to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Keep this private, dictate it, or use fictional positions if disclosure is unsafe. No conversion,
      debate, trauma disclosure, or resolution of every philosophical question is needed.
  pause_conditions:
  - Pause A provisional worldview when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the A provisional worldview practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a A provisional worldview situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
