        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Purpose and calling; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Receiving care, maintaining a home, or offering attentive presence can be meaningful contributions.
      Use a fictional service plan if a real opportunity is unavailable; label it preparation.
    cultural_context:
    - Adapt the expression of Purpose and calling to direct or indirect communication, collective or individual
      decision structures, local norms, faith or secular commitments, and role obligations while preserving
      consent and dignity.
    resource_variants:
    - Receiving care, maintaining a home, or offering attentive presence can be meaningful contributions.
      Use a fictional service plan if a real opportunity is unavailable; label it preparation.
  pause_conditions:
  - Pause Purpose and calling when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Purpose and calling practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Purpose and calling situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Purpose and calling actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0105_a1_primary
  - c0105_a1_boundary
  - c0105_a1_adverse
  - c0105_a2_primary
  - c0105_a2_boundary
  - c0105_a2_adverse
  - c0105_a3_primary
  - c0105_a3_boundary
  - c0105_a3_adverse
  adverse_or_contradictory_indicators:
  - Help was imposed despite refusal or essential personal care was sacrificed to prove purpose.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Purpose and calling explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Purpose and calling context, action, role,
    pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Purpose and calling observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Purpose and calling rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Form a contribution hypothesis. Observed checks: A contribution and recipient
    are specified; Usefulness has a way to be checked; Permission and limits are considered. Action 2:
    Deliver a modest piece of useful work. Observed checks: An agreed contribution is attempted; Its actual
    demands are recorded; The recipient can decline or redirect it. Action 3: Decide whether to deepen
    the commitment. Observed checks: Fit and cost are both reviewed; A next disposition is chosen; The
    commitment has a bounded review point.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. An inspiring mission sentence was written without testing
    a contribution.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Purpose
    and calling contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L01
  - L32
  - L36
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Purpose and calling evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Form a contribution hypothesis. Observed checks: A contribution and recipient are specified;
    Usefulness has a way to be checked; Permission and limits are considered.'
  - 'Action 2: Deliver a modest piece of useful work. Observed checks: An agreed contribution is attempted;
    Its actual demands are recorded; The recipient can decline or redirect it.'
  - 'Action 3: Decide whether to deepen the commitment. Observed checks: Fit and cost are both reviewed;
    A next disposition is chosen; The commitment has a bounded review point.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0105_a1_primary
    - c0105_a2_primary
    - c0105_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Did the work serve something you value, and what would make continued commitment
    sustainable?
  transfer_limit: One contribution tests the fit of a possible calling. Sustained vocation also involves
    repeated service, changing responsibilities and long-term costs that this trial cannot establish.
  reflection:
    before: 'What would count as doing this honestly? Goal: Explore purpose through a useful contribution
      and honest reflection on its fit and demands.'
    during: Which checks have actually been observed? The work mattered but its time cost requires a smaller
      role.
    after: Did the work serve something you value, and what would make continued commitment sustainable?
  review_guidance:
    repeat: Repeat the same bounded Purpose and calling design only when the context and burden remain
      appropriate.
    adapt: Receiving care, maintaining a home, or offering attentive presence can be meaningful contributions.
      Use a fictional service plan if a real opportunity is unavailable; label it preparation.
    stop: Stop Purpose and calling when the practice becomes coercive, unsafe, privacy-invasive, role-inappropriate,
      professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A welcomed contribution was delivered and followed by a realistic recurring commitment.
    mixed: The work mattered but its time cost requires a smaller role.
    contradictory: Help was imposed despite refusal or essential personal care was sacrificed to prove
      purpose.
    inconclusive: An inspiring mission sentence was written without testing a contribution.
