meaning_and_fit:
  purpose: Explore purpose through a useful contribution and honest reflection on its fit and demands.
  why_recommended: Explore purpose through a useful contribution and honest reflection on its fit and
    demands.
  claims:
  - statement: Explore purpose through a useful contribution and honest reflection on its fit and demands.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Purpose and calling practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Purpose and calling as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Receiving care, maintaining a home, or offering attentive presence can be
    meaningful contributions. Use a fictional service plan if a real opportunity is unavailable; label
    it preparation.
  opportunity_considerations: List one responsibility you hold, one problem you care about, and one ability
    or form of presence you can offer. Reserve a small amount of time that does not displace essential
    obligations.
  prerequisites:
  - List one responsibility you hold, one problem you care about, and one ability or form of presence
    you can offer. Reserve a small amount of time that does not displace essential obligations.
  dependencies: []
  safe_alternatives:
  - Receiving care, maintaining a home, or offering attentive presence can be meaningful contributions.
    Use a fictional service plan if a real opportunity is unavailable; label it preparation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Purpose and calling differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Purpose and calling as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'List one responsibility you hold, one problem you care about, and one ability or form of presence
    you can offer. Reserve a small amount of time that does not displace essential obligations. Goal:
    Explore purpose through a useful contribution and honest reflection on its fit and demands. Scope:
    One contribution tests the fit of a possible calling. Sustained vocation also involves repeated service,
    changing responsibilities and long-term costs that this trial cannot establish. Time and effort: About
    15 minutes to plan, a contribution small enough for current capacity, and a 10-minute review. Adaptation:
    Receiving care, maintaining a home, or offering attentive presence can be meaningful contributions.
    Use a fictional service plan if a real opportunity is unavailable; label it preparation. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Receiving care, maintaining a home, or offering attentive presence can be meaningful
    contributions. Use a fictional service plan if a real opportunity is unavailable; label it preparation.
  expected_burden: About 15 minutes to plan, a contribution small enough for current capacity, and a 10-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Purpose and calling protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Purpose and calling action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Receiving care,
    maintaining a home, or offering attentive presence can be meaningful contributions. Use a fictional
    service plan if a real opportunity is unavailable; label it preparation.
  actions:
  - stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01-A1
    sequence: 1
    title: Form a contribution hypothesis
    instructions: 'Complete this sentence: I may contribute to this person, community, craft, or problem
      by doing this specific useful act. Include who defines usefulness and what permission or competence
      is needed. Example: help a willing neighbor organize a shared notice, rather than decide what the
      neighbor needs without asking.


      Observation checks: A contribution and recipient are specified; Usefulness has a way to be checked;
      Permission and limits are considered. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01
      action_stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01-A1
      competency_stable_id: '01.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0105_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0105_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_contribution_and_recipient_are_specified
        - usefulness_has_a_way_to_be_checked
        - permission_and_limits_are_considered
      - measurement_id: c0105_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0105_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01-A2
    sequence: 2
    title: Deliver a modest piece of useful work
    instructions: 'Offer and, if welcomed, complete one bounded contribution. It may be listening, repairing
      a small document, sharing a resource, or doing an existing responsibility more attentively. Keep
      the recipient free to decline. Record what was delivered and the actual demand on time, energy,
      and other duties.


      Observation checks: An agreed contribution is attempted; Its actual demands are recorded; The recipient
      can decline or redirect it. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01
      action_stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01-A2
      competency_stable_id: '01.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0105_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0105_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_agreed_contribution_is_attempted
        - its_actual_demands_are_recorded
        - the_recipient_can_decline_or_redirect_it
      - measurement_id: c0105_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0105_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01-A3
    sequence: 3
    title: Decide whether to deepen the commitment
    instructions: 'Compare expected meaning with what the contribution actually required. Seek brief feedback
      if appropriate without demanding gratitude. Choose continue, change role, or stop; name a realistic
      next commitment and a review point. One unpleasant attempt neither disproves a calling nor obliges
      lifelong persistence.


      Observation checks: Fit and cost are both reviewed; A next disposition is chosen; The commitment
      has a bounded review point. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Did the work serve something you value, and what would make continued commitment sustainable?


      Examples: Supportive: A welcomed contribution was delivered and followed by a realistic recurring
      commitment.


      Mixed: The work mattered but its time cost requires a smaller role.


      Contradictory: Help was imposed despite refusal or essential personal care was sacrificed to prove
      purpose.


      Inconclusive: An inspiring mission sentence was written without testing a contribution.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01
      action_stable_id: PRACTICE-COMP-0105-PURPOSE-AND-CALLING-01-A3
      competency_stable_id: '01.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0105_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0105_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - fit_and_cost_are_both_reviewed
        - a_next_disposition_is_chosen
        - the_commitment_has_a_bounded_review_point
      - measurement_id: c0105_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
