meaning_and_fit:
  purpose: Distinguish inherited commitments from values consciously reaffirmed, revised, or declined.
  why_recommended: Distinguish inherited commitments from values consciously reaffirmed, revised, or declined.
  claims:
  - statement: Distinguish inherited commitments from values consciously reaffirmed, revised, or declined.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Chosen and inherited values practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Chosen and inherited values as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use broad labels such as family or school without naming anyone. Keep the
    exercise private where disagreeing could threaten safety, housing, employment, or belonging.
  opportunity_considerations: Choose three values affecting a small decision, such as reliability, independence,
    generosity, privacy, or achievement. Use a private page; identifying relatives or communities is unnecessary.
  prerequisites:
  - Choose three values affecting a small decision, such as reliability, independence, generosity, privacy,
    or achievement. Use a private page; identifying relatives or communities is unnecessary.
  dependencies: []
  safe_alternatives:
  - Use broad labels such as family or school without naming anyone. Keep the exercise private where disagreeing
    could threaten safety, housing, employment, or belonging.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Chosen and inherited values differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Chosen and inherited values
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose three values affecting a small decision, such as reliability, independence, generosity,
    privacy, or achievement. Use a private page; identifying relatives or communities is unnecessary.
    Goal: Distinguish inherited commitments from values consciously reaffirmed, revised, or declined.
    Scope: Three values provide a sample of family, cultural and personal influences. Deliberate endorsement
    requires later conduct as well as this initial historical account. Time and effort: About 25 minutes
    of reflection, one small ordinary choice, and a brief review. Adaptation: Use broad labels such as
    family or school without naming anyone. Keep the exercise private where disagreeing could threaten
    safety, housing, employment, or belonging. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use broad labels such as family or school without naming anyone. Keep the exercise
    private where disagreeing could threaten safety, housing, employment, or belonging.
  expected_burden: About 25 minutes of reflection, one small ordinary choice, and a brief review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Chosen and inherited values protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Chosen and inherited values action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use broad labels
    such as family or school without naming anyone. Keep the exercise private where disagreeing could
    threaten safety, housing, employment, or belonging.
  actions:
  - stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01-A1
    sequence: 1
    title: Draw each value's history
    instructions: 'For each value, note where you encountered it, an experience that strengthened or challenged
      it, and a current behavior it influences. Separate admiration or belonging from fear of disapproval.
      Example: reliability came from a household expectation and now affects how quickly you accept requests.


      Observation checks: Three origins are traced; Experiences are distinguished from assumptions; Each
      value connects to behavior. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01
      action_stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01-A1
      competency_stable_id: '01.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0103_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0103_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_origins_are_traced
        - experiences_are_distinguished_from_assumptions
        - each_value_connects_to_behavior
      - measurement_id: c0103_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0103_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01-A2
    sequence: 2
    title: Decide what you actually endorse
    instructions: 'Mark each value retain, reinterpret, question, or decline. Give a reason you endorse
      today and a boundary against its excess. Reliability might mean making fewer realistic promises
      rather than accepting every request. Inherited values may be freely reaffirmed; rejecting tradition
      earns no extra credit.


      Observation checks: Each value has a present disposition; Endorsement has a current reason; An excess
      or boundary is identified. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01
      action_stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01-A2
      competency_stable_id: '01.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0103_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0103_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - each_value_has_a_present_disposition
        - endorsement_has_a_current_reason
        - an_excess_or_boundary_is_identified
      - measurement_id: c0103_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0103_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01-A3
    sequence: 3
    title: Act on one deliberate interpretation
    instructions: 'Apply one revised interpretation to a low-stakes request, purchase, schedule, or conversation.
      Record the choice and its cost privately, then check whether it reflects your reason rather than
      merely reversing an old expectation. A role-play can rehearse the decision but does not demonstrate
      changed conduct.


      Observation checks: A specific choice is made; The choice traces to a stated value; Real action
      and rehearsal are distinguished. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What did you choose freely to retain, and what behavior will reveal whether the reinterpretation
      lasts?


      Examples: Supportive: Reliability was reaffirmed and one unrealistic promise was renegotiated before
      its deadline.


      Mixed: The reasoning changed but the first opportunity to act has not occurred.


      Contradictory: The exercise became an accusation against relatives or pressure to reject a tradition.


      Inconclusive: Values were listed without origins, present reasons, or a decision.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01
      action_stable_id: PRACTICE-COMP-0103-CHOSEN-AND-INHERITED-VALUES-01-A3
      competency_stable_id: '01.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
