  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Chosen and inherited values; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use broad labels such as family or school without naming anyone. Keep the exercise private where
      disagreeing could threaten safety, housing, employment, or belonging.
    cultural_context:
    - Adapt the expression of Chosen and inherited values to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use broad labels such as family or school without naming anyone. Keep the exercise private where
      disagreeing could threaten safety, housing, employment, or belonging.
  pause_conditions:
  - Pause Chosen and inherited values when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Chosen and inherited values practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Chosen and inherited values situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Chosen and inherited values actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0103_a1_primary
  - c0103_a1_boundary
  - c0103_a1_adverse
  - c0103_a2_primary
  - c0103_a2_boundary
  - c0103_a2_adverse
  - c0103_a3_primary
  - c0103_a3_boundary
  - c0103_a3_adverse
  adverse_or_contradictory_indicators:
  - The exercise became an accusation against relatives or pressure to reject a tradition.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Chosen and inherited values explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Chosen and inherited values context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Chosen and inherited values observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Chosen and inherited values rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Draw each value''s history. Observed checks: Three origins are traced;
    Experiences are distinguished from assumptions; Each value connects to behavior. Action 2: Decide
    what you actually endorse. Observed checks: Each value has a present disposition; Endorsement has
    a current reason; An excess or boundary is identified. Action 3: Act on one deliberate interpretation.
    Observed checks: A specific choice is made; The choice traces to a stated value; Real action and rehearsal
    are distinguished.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Values were listed without origins, present reasons,
    or a decision.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Chosen
    and inherited values contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L02
  - L05
  - L31
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Chosen and inherited values evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Draw each value''s history. Observed checks: Three origins are traced; Experiences are
    distinguished from assumptions; Each value connects to behavior.'
  - 'Action 2: Decide what you actually endorse. Observed checks: Each value has a present disposition;
    Endorsement has a current reason; An excess or boundary is identified.'
  - 'Action 3: Act on one deliberate interpretation. Observed checks: A specific choice is made; The choice
    traces to a stated value; Real action and rehearsal are distinguished.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0103_a1_primary
    - c0103_a2_primary
    - c0103_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: What did you choose freely to retain, and what behavior will reveal whether the
    reinterpretation lasts?
  transfer_limit: Three values provide a sample of family, cultural and personal influences. Deliberate
    endorsement requires later conduct as well as this initial historical account.
  reflection:
    before: 'What would count as doing this honestly? Goal: Distinguish inherited commitments from values
      consciously reaffirmed, revised, or declined.'
    during: Which checks have actually been observed? The reasoning changed but the first opportunity
      to act has not occurred.
    after: What did you choose freely to retain, and what behavior will reveal whether the reinterpretation
      lasts?
  review_guidance:
    repeat: Repeat the same bounded Chosen and inherited values design only when the context and burden
      remain appropriate.
    adapt: Use broad labels such as family or school without naming anyone. Keep the exercise private
      where disagreeing could threaten safety, housing, employment, or belonging.
    stop: Stop Chosen and inherited values when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: Reliability was reaffirmed and one unrealistic promise was renegotiated before its deadline.
    mixed: The reasoning changed but the first opportunity to act has not occurred.
    contradictory: The exercise became an accusation against relatives or pressure to reject a tradition.
    inconclusive: Values were listed without origins, present reasons, or a decision.
