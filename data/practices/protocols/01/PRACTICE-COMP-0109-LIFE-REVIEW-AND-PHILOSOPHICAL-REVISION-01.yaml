meaning_and_fit:
  purpose: Turn a recurring life review into a concrete revision of conduct or belief.
  why_recommended: Turn a recurring life review into a concrete revision of conduct or belief.
  claims:
  - statement: Turn a recurring life review into a concrete revision of conduct or belief.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Socratic inquiry examines beliefs through questions and recognizes the limits of what one
      knows.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-SOCRATIC-INQUIRY
    limitations: Historical philosophical context only; does not validate this worldview worksheet, promise
      psychological benefit, or require acceptance of Socrates' conclusions.
  applicability_question: Does a voluntary, bounded Life review and philosophical revision practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Life review and philosophical revision as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Review aloud, with a trusted supporter, or using three calendar symbols. A
    week dominated by illness or caregiving can justify a smaller expectation rather than another task.
  opportunity_considerations: Choose one stated priority and reconstruct three ordinary moments from the
    last week. Use memory or your own calendar; no surveillance, detailed diary, or productivity scoring
    is needed.
  prerequisites:
  - Choose one stated priority and reconstruct three ordinary moments from the last week. Use memory or
    your own calendar; no surveillance, detailed diary, or productivity scoring is needed.
  dependencies: []
  safe_alternatives:
  - Review aloud, with a trusted supporter, or using three calendar symbols. A week dominated by illness
    or caregiving can justify a smaller expectation rather than another task.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Life review and philosophical revision differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Life review and philosophical
    revision as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose one stated priority and reconstruct three ordinary moments from the last week. Use memory
    or your own calendar; no surveillance, detailed diary, or productivity scoring is needed. Goal: Turn
    a recurring life review into a concrete revision of conduct or belief. Scope: The weekly loop connects
    belief and conduct across several moments. A lasting philosophical revision requires later reviews
    and evidence from more than one week. Time and effort: About 20 minutes now, one small adjustment,
    and 10 minutes at the following week''s review. Adaptation: Review aloud, with a trusted supporter,
    or using three calendar symbols. A week dominated by illness or caregiving can justify a smaller expectation
    rather than another task. Keep personal working notes outside the check-in; record only the listed
    observations.


    Reference support:

    Introduction to Philosophy, 1.3 Socrates as a Paradigmatic Historical Philosopher: https://openstax.org/books/introduction-philosophy/pages/1-3-socrates-as-a-paradigmatic-historical-philosopher'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Review aloud, with a trusted supporter, or using three calendar symbols. A week
    dominated by illness or caregiving can justify a smaller expectation rather than another task.
  expected_burden: About 20 minutes now, one small adjustment, and 10 minutes at the following week's
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Life review and philosophical revision protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Life review and philosophical revision action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Review aloud,
    with a trusted supporter, or using three calendar symbols. A week dominated by illness or caregiving
    can justify a smaller expectation rather than another task.
  actions:
  - stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01-A1
    sequence: 1
    title: Collect supporting and conflicting moments
    instructions: 'Write one moment that reflected the priority, one that did not, and one that is ambiguous.
      For each, note circumstances, competing obligations, and available choices. Example: valuing friendship
      may appear in checking on someone, while a missed call may reflect a necessary care duty rather
      than indifference.


      Observation checks: Three different observations are considered; Context accompanies each observation;
      Conduct is not reduced to a total identity judgment. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01
      action_stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01-A1
      competency_stable_id: '01.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0109_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0109_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_different_observations_are_considered
        - context_accompanies_each_observation
        - conduct_is_not_reduced_to_a_total_identity_judgment
      - measurement_id: c0109_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0109_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01-A2
    sequence: 2
    title: Revise the belief or its expression
    instructions: 'Decide whether the mismatch calls for a behavior change, a more realistic priority,
      or acceptance of a legitimate tradeoff. Make one specific adjustment, such as arranging a ten-minute
      call or admitting that rest takes precedence this week. Explain why that adjustment addresses the
      actual mismatch.


      Observation checks: A mismatch is interpreted rather than assumed; One concrete adjustment is chosen;
      The adjustment follows the evidence. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01
      action_stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01-A2
      competency_stable_id: '01.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0109_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0109_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_mismatch_is_interpreted_rather_than_assumed
        - one_concrete_adjustment_is_chosen
        - the_adjustment_follows_the_evidence
      - measurement_id: c0109_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0109_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01-A3
    sequence: 3
    title: Close the review loop
    instructions: 'Try the adjustment and set a brief review for the following week. At that review, record
      whether it happened and whether it helped express the priority. Keep, modify, or remove it. Do not
      accumulate corrective tasks when the evidence calls for fewer obligations.


      Observation checks: An adjustment is tried; A follow-up review occurs; The resulting disposition
      is recorded. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What changed because you reviewed your life, and what did you learn about the belief
      itself?


      Examples: Supportive: A vague friendship priority became one realistic call, then was reviewed for
      fit.


      Mixed: The adjustment occurred but competed with needed rest and should be reduced.


      Contradictory: The review produced escalating self-criticism and more obligations without acknowledging
      constraints.


      Inconclusive: The same priority was restated without an adjustment or follow-up.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01
      action_stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01-A3
      competency_stable_id: '01.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
