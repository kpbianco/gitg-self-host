completion_and_review:
  completion_criteria:
  - 'Action 1: Collect supporting and conflicting moments. Observed checks: Three different observations
    are considered; Context accompanies each observation; Conduct is not reduced to a total identity judgment.'
  - 'Action 2: Revise the belief or its expression. Observed checks: A mismatch is interpreted rather
    than assumed; One concrete adjustment is chosen; The adjustment follows the evidence.'
  - 'Action 3: Close the review loop. Observed checks: An adjustment is tried; A follow-up review occurs;
    The resulting disposition is recorded.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0109_a1_primary
    - c0109_a2_primary
    - c0109_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: What changed because you reviewed your life, and what did you learn about the
    belief itself?
  transfer_limit: The weekly loop connects belief and conduct across several moments. A lasting philosophical
    revision requires later reviews and evidence from more than one week.
  reflection:
    before: 'What would count as doing this honestly? Goal: Turn a recurring life review into a concrete
      revision of conduct or belief.'
    during: Which checks have actually been observed? The adjustment occurred but competed with needed
      rest and should be reduced.
    after: What changed because you reviewed your life, and what did you learn about the belief itself?
  review_guidance:
    repeat: Repeat the same bounded Life review and philosophical revision design only when the context
      and burden remain appropriate.
    adapt: Review aloud, with a trusted supporter, or using three calendar symbols. A week dominated by
      illness or caregiving can justify a smaller expectation rather than another task.
    stop: Stop Life review and philosophical revision when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A vague friendship priority became one realistic call, then was reviewed for fit.
    mixed: The adjustment occurred but competed with needed rest and should be reduced.
    contradictory: The review produced escalating self-criticism and more obligations without acknowledging
      constraints.
    inconclusive: The same priority was restated without an adjustment or follow-up.
