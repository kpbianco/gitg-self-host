  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Life review and philosophical revision; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Review aloud, with a trusted supporter, or using three calendar symbols. A week dominated by illness
      or caregiving can justify a smaller expectation rather than another task.
    cultural_context:
    - Adapt the expression of Life review and philosophical revision to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Review aloud, with a trusted supporter, or using three calendar symbols. A week dominated by illness
      or caregiving can justify a smaller expectation rather than another task.
  pause_conditions:
  - Pause Life review and philosophical revision when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Life review and philosophical revision practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Life review and philosophical revision situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
