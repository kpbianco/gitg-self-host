  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Life review and philosophical revision explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Life review and philosophical revision
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Life review and philosophical revision observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Life review and philosophical revision rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Collect supporting and conflicting moments. Observed checks: Three different
    observations are considered; Context accompanies each observation; Conduct is not reduced to a total
    identity judgment. Action 2: Revise the belief or its expression. Observed checks: A mismatch is interpreted
    rather than assumed; One concrete adjustment is chosen; The adjustment follows the evidence. Action
    3: Close the review loop. Observed checks: An adjustment is tried; A follow-up review occurs; The
    resulting disposition is recorded.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The same priority was restated without an adjustment
    or follow-up.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Life review
    and philosophical revision contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
