  - stable_id: PRACTICE-COMP-0109-LIFE-REVIEW-AND-PHILOSOPHICAL-REVISION-01-A2
    sequence: 2
    title: Observe Life review and philosophical revision across three checkpoints
    instructions: Collect up to three brief Life review and philosophical revision checkpoints across
      the selected period or contexts. Record unknown, not observed, not applicable, defer, and adverse
      outcomes as valid states; do not infer a trend from prose length, mood, or one unusually good or
      bad event.
