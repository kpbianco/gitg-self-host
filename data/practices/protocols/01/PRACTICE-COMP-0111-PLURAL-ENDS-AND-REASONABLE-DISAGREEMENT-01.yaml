  adverse_or_contradictory_indicators:
  - The Plural ends and reasonable disagreement action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Plural ends and reasonable disagreement criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Plural ends and reasonable disagreement explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Plural ends and reasonable disagreement
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Plural ends and reasonable disagreement observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Plural ends and reasonable disagreement rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can explain a competing vision of the good fairly and state where cooperation remains possible.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Plural ends and reasonable disagreement requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Plural
    ends and reasonable disagreement contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L01
  - L13
  - L24
  - L31
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Plural ends and reasonable disagreement evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The choose a declared frame for plural ends and reasonable disagreement action was attempted or explicitly
    deferred.
  - The complete two bounded plural ends and reasonable disagreement practices action was attempted or
    explicitly deferred.
  - The interpret the plural ends and reasonable disagreement experience modestly action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0111_a1_primary
    - c0111_a2_primary
    - c0111_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Plural ends and reasonable disagreement only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Plural ends and reasonable disagreement across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Plural ends and reasonable disagreement require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Plural ends and reasonable disagreement criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can explain a competing vision of the good fairly and state
      where cooperation remains possible.', what contradiction or missing context matters most, and should
      this Plural ends and reasonable disagreement design be repeated, adapted, deferred, stopped, or
      referred?
  review_guidance:
    repeat: Repeat the same bounded Plural ends and reasonable disagreement design only when the context
      and burden remain appropriate.
    adapt: Change the Plural ends and reasonable disagreement medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Plural ends and reasonable disagreement when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Plural ends and reasonable disagreement
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Plural ends and reasonable disagreement criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Plural ends and reasonable disagreement criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Plural ends and reasonable disagreement criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Plural ends and reasonable disagreement action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
