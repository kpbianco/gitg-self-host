meaning_and_fit:
  purpose: 'Practice Meaning after disillusionment through a pluralist meaning practice bounded by the
    canonical scope: Reconstruct meaning when success, institutions, relationships, faith, or prior identity
    no longer sustain the life story.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can name what failed,
    what remains true, and a next commitment that does not depend on restoring the old certainty. The
    protocol creates a small opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Meaning after disillusionment is a traceable
      product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Meaning after disillusionment practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Meaning after disillusionment as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Meaning after disillusionment
    context, understand the source-only status, and stop without losing safety, care, employment, housing,
    services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Meaning after
    disillusionment; do not manufacture conflict, deprivation, exposure, disclosure, danger, urgency,
    or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Meaning after disillusionment.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Meaning after disillusionment instead
    of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Meaning after disillusionment differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Meaning after disillusionment
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Complete three bounded Meaning after disillusionment actions over ten days, preserving explicit
    not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Meaning after disillusionment; copy the canonical scope and evidence target
    into a private working note; define the action boundary, valid supports, privacy limit, and stop condition
    before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Meaning
    after disillusionment. Do not store private prose, names, identities, diagnoses, allegations, credentials,
    account data, protected work information, intimate detail, artifact contents, observer narrative,
    or another person's secrets. This source-only draft is not surveillance, professional advice, treatment,
    certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Meaning after disillusionment actions,
    and review; scope may be reduced or deferred for access, care, health, workload, conscience, or resource
    reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Meaning after disillusionment protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Meaning after disillusionment action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Meaning after disillusionment situation involving emergency response, abuse, retaliation, illegal
    conduct, medical treatment, legal representation, financial-loss decisions, safeguarding, hazardous
    equipment, or other consequences beyond a reversible source-only exercise.
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
  actions:
  - stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A1
    sequence: 1
    title: Choose a declared frame for Meaning after disillusionment
    instructions: 'Select a religious, spiritual, philosophical, cultural, or secular frame through which
      to explore Meaning after disillusionment. State the frame, one alternative, and the limits of personal
      authority using this canonical scope: Reconstruct meaning when success, institutions, relationships,
      faith, or prior identity no longer sustain the life story.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01
      action_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A1
      competency_stable_id: '01.10'
      scoring_policy_id: SP-SHADOW-ONLY
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0110_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0110_a1_primary
        kind: conceptual
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - c0110_a1_frame_declared
        - c0110_a1_alternative_acknowledged
        - c0110_a1_authority_limited
      - measurement_id: c0110_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0110_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A2
    sequence: 2
    title: Complete two bounded Meaning after disillusionment practices
    instructions: Complete two short, freely chosen Meaning after disillusionment practices appropriate
      to the declared frame, such as reading, silence, prayer, observation, ritual, dialogue, or reflection.
      Stop for distress, coercion, altered-state risk, conscience conflict, or pressure from an authority
      or group.
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01
      action_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A2
      competency_stable_id: '01.10'
      scoring_policy_id: SP-SHADOW-ONLY
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0110_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0110_a2_primary
        kind: count
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        direction: at_least
        minimum: '0'
        target: '1'
        maximum: '3'
      - measurement_id: c0110_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0110_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A3
    sequence: 3
    title: Interpret the Meaning after disillusionment experience modestly
    instructions: 'Review what was noticed without treating intensity, calm, certainty, group agreement,
      or unusual experience as automatic truth. Compare the limited record with this evidence target:
      Can name what failed, what remains true, and a next commitment that does not depend on restoring
      the old certainty.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01
      action_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A3
      competency_stable_id: '01.10'
      scoring_policy_id: SP-SHADOW-ONLY
