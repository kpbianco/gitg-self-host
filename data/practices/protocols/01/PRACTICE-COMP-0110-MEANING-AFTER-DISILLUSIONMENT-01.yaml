  performance_rubric: 'Action 1: Separate the failed promise from the whole story. Observed checks: The
    failed expectation is specific; The loss is acknowledged; A broader totalizing conclusion is questioned.
    Action 2: Identify what remains worth protecting. Observed checks: A remaining good or support is
    identified; Its value is independent of the old outcome; Uncertainty is permitted. Action 3: Make
    a commitment small enough to keep. Observed checks: A modest action is attempted; Its limited effect
    is described; Further support or review is considered.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
