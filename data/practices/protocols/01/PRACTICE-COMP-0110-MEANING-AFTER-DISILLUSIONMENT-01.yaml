meaning_and_fit:
  purpose: Identify what a disappointed expectation no longer supports and choose one modest commitment
    that remains worthwhile.
  why_recommended: Identify what a disappointed expectation no longer supports and choose one modest commitment
    that remains worthwhile.
  claims:
  - statement: Identify what a disappointed expectation no longer supports and choose one modest commitment
      that remains worthwhile.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Meaning after disillusionment practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Meaning after disillusionment as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a fictional disappointed achievement, respond by drawing, or ask a trusted
    person to help identify practical support. Distress is not material that must be mined for growth.
  opportunity_considerations: Use a manageable disappointment such as an unrewarding achievement or a
    group that no longer fits. Do not revisit traumatic detail; choose a fictional case or stop if the
    reflection is destabilizing.
  prerequisites:
  - Use a manageable disappointment such as an unrewarding achievement or a group that no longer fits.
    Do not revisit traumatic detail; choose a fictional case or stop if the reflection is destabilizing.
  dependencies: []
  safe_alternatives:
  - Use a fictional disappointed achievement, respond by drawing, or ask a trusted person to help identify
    practical support. Distress is not material that must be mined for growth.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Meaning after disillusionment differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Meaning after disillusionment
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a manageable disappointment such as an unrewarding achievement or a group that no longer
    fits. Do not revisit traumatic detail; choose a fictional case or stop if the reflection is destabilizing.
    Goal: Identify what a disappointed expectation no longer supports and choose one modest commitment
    that remains worthwhile. Scope: A manageable disappointment provides a first step in rebuilding meaning.
    Catastrophic loss, trauma and persistent impairment call for support beyond this bounded reflection.
    Time and effort: About 15 minutes of optional reflection and one low-demand commitment; pause whenever
    needed. Adaptation: Use a fictional disappointed achievement, respond by drawing, or ask a trusted
    person to help identify practical support. Distress is not material that must be mined for growth.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a fictional disappointed achievement, respond by drawing, or ask a trusted
    person to help identify practical support. Distress is not material that must be mined for growth.
  expected_burden: About 15 minutes of optional reflection and one low-demand commitment; pause whenever
    needed.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Meaning after disillusionment protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Meaning after disillusionment action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a fictional
    disappointed achievement, respond by drawing, or ask a trusted person to help identify practical support.
    Distress is not material that must be mined for growth.
  actions:
  - stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A1
    sequence: 1
    title: Separate the failed promise from the whole story
    instructions: 'Finish three statements privately: I expected this to provide something; that expectation
      failed in this way; this does not tell me everything about my life. Distinguish a particular outcome,
      institution, relationship, or belief from the value it once represented. No forced positive reinterpretation
      is required.


      Observation checks: The failed expectation is specific; The loss is acknowledged; A broader totalizing
      conclusion is questioned. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01
      action_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A1
      competency_stable_id: '01.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0110_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0110_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_failed_expectation_is_specific
        - the_loss_is_acknowledged
        - a_broader_totalizing_conclusion_is_questioned
      - measurement_id: c0110_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0110_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A2
    sequence: 2
    title: Identify what remains worth protecting
    instructions: 'Name one relationship, responsibility, pleasure, principle, or source of support that
      does not require the old promise to be restored. Explain why it matters in its own right. If nothing
      is clear, identify a person or service with whom uncertainty can be held without pressure to solve
      it.


      Observation checks: A remaining good or support is identified; Its value is independent of the old
      outcome; Uncertainty is permitted. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01
      action_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A2
      competency_stable_id: '01.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0110_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0110_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_remaining_good_or_support_is_identified
        - its_value_is_independent_of_the_old_outcome
        - uncertainty_is_permitted
      - measurement_id: c0110_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0110_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A3
    sequence: 3
    title: Make a commitment small enough to keep
    instructions: 'Take one low-demand action toward the remaining good, such as keeping a meal appointment
      or spending time on an enjoyed craft. Afterward describe what the action sustained, not whether
      it cured disappointment. Choose a gentle review point or seek appropriate support if functioning
      or safety is affected.


      Observation checks: A modest action is attempted; Its limited effect is described; Further support
      or review is considered. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: What can you commit to without pretending the disappointment has disappeared?


      Examples: Supportive: A disappointing promotion did not regain its meaning, but a modest valued
      commitment was restored.


      Mixed: A remaining good was identified while energy for action remained limited.


      Contradictory: The exercise demanded gratitude for harm or rushed someone into a replacement identity.


      Inconclusive: Only a general inspirational statement was produced, with no specific expectation
      or commitment.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01
      action_stable_id: PRACTICE-COMP-0110-MEANING-AFTER-DISILLUSIONMENT-01-A3
      competency_stable_id: '01.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0110_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0110_a3_primary
