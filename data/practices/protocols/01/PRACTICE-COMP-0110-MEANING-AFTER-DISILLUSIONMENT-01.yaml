  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Meaning after disillusionment; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Meaning after disillusionment; assistive technology, interpretation, a support person,
      and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Meaning after disillusionment to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Meaning after disillusionment opportunity is unavailable or inappropriate, use a fictional,
      historical, public, simulated, or planning-only equivalent and retain the narrower evidence classification.
  pause_conditions:
  - Pause Meaning after disillusionment when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Meaning after disillusionment practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Meaning after disillusionment situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Meaning after disillusionment actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0110_a1_primary
  - c0110_a1_boundary
  - c0110_a1_adverse
  - c0110_a2_primary
  - c0110_a2_boundary
  - c0110_a2_adverse
  - c0110_a3_primary
  - c0110_a3_boundary
  - c0110_a3_adverse
  adverse_or_contradictory_indicators:
  - The Meaning after disillusionment action exceeded consent, authority, privacy, qualification, role,
    burden, or safety boundaries.
  - The evidence contradicted the intended Meaning after disillusionment criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Meaning after disillusionment explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Meaning after disillusionment context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Meaning after disillusionment observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Meaning after disillusionment rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can name what failed, what remains true, and a next commitment that does not depend on restoring
    the old certainty.—not completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Meaning after disillusionment requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Meaning after
    disillusionment evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L01
  - L04
  - L11
  minimum_evidence_before_state_update: No current-state update is permitted for this Meaning after disillusionment
    draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Meaning after disillusionment evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The choose a declared frame for meaning after disillusionment action was attempted or explicitly deferred.
  - The complete two bounded meaning after disillusionment practices action was attempted or explicitly
    deferred.
  - The interpret the meaning after disillusionment experience modestly action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0110_a1_primary
    - c0110_a2_primary
    - c0110_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Meaning after disillusionment only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Meaning after disillusionment across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Meaning after disillusionment require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Meaning after disillusionment criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can name what failed, what remains true, and a next commitment
      that does not depend on restoring the old certainty.', what contradiction or missing context matters
      most, and should this Meaning after disillusionment design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Meaning after disillusionment design only when the context and burden
      remain appropriate.
    adapt: Change the Meaning after disillusionment medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Meaning after disillusionment when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Meaning after disillusionment questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Meaning after disillusionment criteria were observed with provenance and no
      adverse boundary signal in the selected context.
    mixed: Some Meaning after disillusionment criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Meaning after disillusionment criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Meaning after disillusionment action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
