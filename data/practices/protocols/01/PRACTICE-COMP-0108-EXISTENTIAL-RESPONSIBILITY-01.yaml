        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Existential responsibility; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - A support person can help communicate or implement your choice. Choosing rest, declining an unsafe
      demand, or seeking assistance is an exercise of agency.
    cultural_context:
    - Adapt the expression of Existential responsibility to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - A support person can help communicate or implement your choice. Choosing rest, declining an unsafe
      demand, or seeking assistance is an exercise of agency.
  pause_conditions:
  - Pause Existential responsibility when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Existential responsibility practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Existential responsibility situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Existential responsibility actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0108_a1_primary
  - c0108_a1_boundary
  - c0108_a1_adverse
  - c0108_a2_primary
  - c0108_a2_boundary
  - c0108_a2_adverse
  - c0108_a3_primary
  - c0108_a3_boundary
  - c0108_a3_adverse
  adverse_or_contradictory_indicators:
  - The person accepted blame for another's conduct or repeatedly pressured them to respond.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Existential responsibility explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Existential responsibility context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Existential responsibility observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Existential responsibility rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Sort the situation without assigning blame. Observed checks: All three
    categories are distinguished; Entries describe concrete conditions; Responsibility is not expanded
    into blame. Action 2: Take one proportionate action. Observed checks: A controllable action is attempted;
    Any request respects refusal; An escalation or checking limit is set. Action 3: Review agency and
    remaining constraint. Observed checks: Action and outcome are separated; Remaining constraints are
    acknowledged; A proportionate next disposition is chosen.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The columns contain only broad labels such as everything
    or nothing.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Existential
    responsibility contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L01
  - L05
  - L10
  - L11
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Existential responsibility evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Sort the situation without assigning blame. Observed checks: All three categories are distinguished;
    Entries describe concrete conditions; Responsibility is not expanded into blame.'
  - 'Action 2: Take one proportionate action. Observed checks: A controllable action is attempted; Any
    request respects refusal; An escalation or checking limit is set.'
  - 'Action 3: Review agency and remaining constraint. Observed checks: Action and outcome are separated;
    Remaining constraints are acknowledged; A proportionate next disposition is chosen.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0108_a1_primary
    - c0108_a2_primary
    - c0108_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Where did you have a choice, and where would demanding more control become unfair
    to yourself or others?
  transfer_limit: The three categories apply responsibility without denying constraint. One successful
    action does not remove structural limits or establish control over another person.
  reflection:
    before: 'What would count as doing this honestly? Goal: Distinguish control, influence, and external
      conditions while taking one proportionate action.'
    during: Which checks have actually been observed? The action was useful but the main constraint remains
      outside the person's influence.
    after: Where did you have a choice, and where would demanding more control become unfair to yourself
      or others?
  review_guidance:
    repeat: Repeat the same bounded Existential responsibility design only when the context and burden
      remain appropriate.
    adapt: A support person can help communicate or implement your choice. Choosing rest, declining an
      unsafe demand, or seeking assistance is an exercise of agency.
    stop: Stop Existential responsibility when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A clear follow-up was sent and an alternative was chosen without blaming anyone for the
      delay.
    mixed: The action was useful but the main constraint remains outside the person's influence.
    contradictory: The person accepted blame for another's conduct or repeatedly pressured them to respond.
    inconclusive: The columns contain only broad labels such as everything or nothing.
