    timing_hint: Work through the numbered actions at a sustainable pace. Preserve their order; use the
      review point specified in the instructions and defer if the context is unsuitable.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Existential
      responsibility.
  check_in_labels:
    c0108_a1_primary: 'Observed checks: sort the situation without assigning blame'
    c0108_a1_boundary: Action 1 stayed inside its stated Existential responsibility boundary
    c0108_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c0108_a2_primary: 'Observed checks: take one proportionate action'
    c0108_a2_boundary: Action 2 stayed inside its stated Existential responsibility boundary
    c0108_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c0108_a3_primary: 'Observed checks: review agency and remaining constraint'
    c0108_a3_boundary: Action 3 stayed inside its stated Existential responsibility boundary
    c0108_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Where did you have a choice, and where would demanding more control become unfair to
    yourself or others? Completion is not mastery.
  plain_language_evidence: A clear follow-up was sent and an alternative was chosen without blaming anyone
    for the delay.
