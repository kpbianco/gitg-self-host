meaning_and_fit:
  purpose: Distinguish control, influence, and external conditions while taking one proportionate action.
  why_recommended: Distinguish control, influence, and external conditions while taking one proportionate
    action.
  claims:
  - statement: Distinguish control, influence, and external conditions while taking one proportionate
      action.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Existential responsibility practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Existential responsibility as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: A support person can help communicate or implement your choice. Choosing rest,
    declining an unsafe demand, or seeking assistance is an exercise of agency.
  opportunity_considerations: Choose a current minor frustration, such as a delayed response, a crowded
    schedule, or an unavailable resource. Do not use abuse, crisis, or traumatic events for this exercise.
  prerequisites:
  - Choose a current minor frustration, such as a delayed response, a crowded schedule, or an unavailable
    resource. Do not use abuse, crisis, or traumatic events for this exercise.
  dependencies: []
  safe_alternatives:
  - A support person can help communicate or implement your choice. Choosing rest, declining an unsafe
    demand, or seeking assistance is an exercise of agency.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Existential responsibility differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Existential responsibility
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a current minor frustration, such as a delayed response, a crowded schedule, or an unavailable
    resource. Do not use abuse, crisis, or traumatic events for this exercise. Goal: Distinguish control,
    influence, and external conditions while taking one proportionate action. Scope: The three categories
    apply responsibility without denying constraint. One successful action does not remove structural
    limits or establish control over another person. Time and effort: About 15 minutes to sort the situation,
    one proportionate action, and a brief review. Adaptation: A support person can help communicate or
    implement your choice. Choosing rest, declining an unsafe demand, or seeking assistance is an exercise
    of agency. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A support person can help communicate or implement your choice. Choosing rest,
    declining an unsafe demand, or seeking assistance is an exercise of agency.
  expected_burden: About 15 minutes to sort the situation, one proportionate action, and a brief review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Existential responsibility protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Existential responsibility action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A support person
    can help communicate or implement your choice. Choosing rest, declining an unsafe demand, or seeking
    assistance is an exercise of agency.
  actions:
  - stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01-A1
    sequence: 1
    title: Sort the situation without assigning blame
    instructions: 'Make three columns: my direct choices, things I can influence, and conditions I cannot
      decide. Place concrete facts in each. For a delayed reply, your follow-up timing is a choice, clarity
      may influence the response, and the other person''s availability is outside your control.


      Observation checks: All three categories are distinguished; Entries describe concrete conditions;
      Responsibility is not expanded into blame. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01-A1
      competency_stable_id: '01.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0108_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0108_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_three_categories_are_distinguished
        - entries_describe_concrete_conditions
        - responsibility_is_not_expanded_into_blame
      - measurement_id: c0108_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0108_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01-A2
    sequence: 2
    title: Take one proportionate action
    instructions: 'Choose one useful direct action and, if appropriate, one respectful request. Send a
      clear follow-up, adjust your own schedule, or use an available alternative. Specify when you will
      stop checking or escalating. Do not treat another person''s refusal as permission to pressure them.


      Observation checks: A controllable action is attempted; Any request respects refusal; An escalation
      or checking limit is set. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01-A2
      competency_stable_id: '01.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0108_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0108_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_controllable_action_is_attempted
        - any_request_respects_refusal
        - an_escalation_or_checking_limit_is_set
      - measurement_id: c0108_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0108_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01-A3
    sequence: 3
    title: Review agency and remaining constraint
    instructions: 'Record what your action changed and what it could not change. Decide whether to ask
      for support, pursue a different option, wait, or accept the limit. Retain the external obstacle
      in the explanation instead of interpreting a poor outcome as personal failure.


      Observation checks: Action and outcome are separated; Remaining constraints are acknowledged; A
      proportionate next disposition is chosen. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Where did you have a choice, and where would demanding more control become unfair
      to yourself or others?


      Examples: Supportive: A clear follow-up was sent and an alternative was chosen without blaming anyone
      for the delay.


      Mixed: The action was useful but the main constraint remains outside the person''s influence.


      Contradictory: The person accepted blame for another''s conduct or repeatedly pressured them to
      respond.


      Inconclusive: The columns contain only broad labels such as everything or nothing.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-0108-EXISTENTIAL-RESPONSIBILITY-01-A3
      competency_stable_id: '01.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0108_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0108_a3_primary
        kind: artifact
        role: primary
