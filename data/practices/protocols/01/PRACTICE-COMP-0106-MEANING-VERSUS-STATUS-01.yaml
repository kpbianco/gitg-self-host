  adverse_or_contradictory_indicators:
  - The exercise became shame about enjoying recognition or a reason to abandon necessary paid work.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Meaning versus status explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Meaning versus status context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Meaning versus status observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Meaning versus status rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Compare visible and invisible rewards. Observed checks: Private benefits
    are identified; Social rewards are acknowledged without shame; The audience-free version is considered.
    Action 2: Try the substance without the display. Observed checks: The underlying activity is attempted;
    Public display is unnecessary; The experience includes costs as well as appeal. Action 3: Rewrite
    the goal around what remains. Observed checks: A goal disposition follows the trial; A meaningful
    next action is specified; Legitimate social purposes are distinguished.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Motives were guessed without trying the underlying
    activity or revisiting the goal.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Meaning
    versus status contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
