meaning_and_fit:
  purpose: Separate meaningful motives from comparison and revise one goal accordingly.
  why_recommended: Separate meaningful motives from comparison and revise one goal accordingly.
  claims:
  - statement: Separate meaningful motives from comparison and revise one goal accordingly.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Philosophical value inquiry distinguishes goods valued for themselves from instrumental
      goods and considers plural values that may conflict or resist a single scale.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-VALUE-QUESTIONS
    limitations: Educational conceptual support only; does not prescribe the person's priority order or
      test the product's exercises or outcomes.
  applicability_question: Does a voluntary, bounded Meaning versus status practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Meaning versus status as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use existing materials, a library resource, or a simulated private comparison.
    Necessary public collaboration need not be hidden; this is a motive check, not enforced secrecy.
  opportunity_considerations: Pick a discretionary goal with a small next step, such as learning a skill,
    changing a room, or joining an activity. Avoid irreversible career or financial decisions in this
    exercise.
  prerequisites:
  - Pick a discretionary goal with a small next step, such as learning a skill, changing a room, or joining
    an activity. Avoid irreversible career or financial decisions in this exercise.
  dependencies: []
  safe_alternatives:
  - Use existing materials, a library resource, or a simulated private comparison. Necessary public collaboration
    need not be hidden; this is a motive check, not enforced secrecy.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Meaning versus status differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Meaning versus status as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Pick a discretionary goal with a small next step, such as learning a skill, changing a room,
    or joining an activity. Avoid irreversible career or financial decisions in this exercise. Goal: Separate
    meaningful motives from comparison and revise one goal accordingly. Scope: The trial separates substance
    from audience rewards for one goal. Motives can remain mixed, and one session cannot determine an
    entire career or life direction. Time and effort: About 15 minutes of motive review, one 10–30 minute
    activity, and 10 minutes to revise the goal. Adaptation: Use existing materials, a library resource,
    or a simulated private comparison. Necessary public collaboration need not be hidden; this is a motive
    check, not enforced secrecy. Keep personal working notes outside the check-in; record only the listed
    observations.


    Reference support:

    Introduction to Philosophy, 8.2 Basic Questions about Values: https://openstax.org/books/introduction-philosophy/pages/8-2-basic-questions-about-values'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use existing materials, a library resource, or a simulated private comparison.
    Necessary public collaboration need not be hidden; this is a motive check, not enforced secrecy.
  expected_burden: About 15 minutes of motive review, one 10–30 minute activity, and 10 minutes to revise
    the goal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Meaning versus status protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Meaning versus status action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use existing
    materials, a library resource, or a simulated private comparison. Necessary public collaboration need
    not be hidden; this is a motive check, not enforced secrecy.
  actions:
  - stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01-A1
    sequence: 1
    title: Compare visible and invisible rewards
    instructions: 'Write what the goal gives you if nobody learns about it, then what it gives you through
      approval or comparison. Mixed motives are allowed. Ask whether you would still want the activity
      with a plain title, modest equipment, and no public progress display.


      Observation checks: Private benefits are identified; Social rewards are acknowledged without shame;
      The audience-free version is considered. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01
      action_stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01-A1
      competency_stable_id: '01.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0106_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0106_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - private_benefits_are_identified
        - social_rewards_are_acknowledged_without_shame
        - the_audience_free_version_is_considered
      - measurement_id: c0106_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0106_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01-A2
    sequence: 2
    title: Try the substance without the display
    instructions: 'Spend one short session on the underlying activity without announcing it or buying
      a status upgrade. For example, practice a few musical phrases rather than shopping for an impressive
      instrument. Note attention, frustration, enjoyment, usefulness, and effort; an unexciting session
      is valid evidence.


      Observation checks: The underlying activity is attempted; Public display is unnecessary; The experience
      includes costs as well as appeal. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01
      action_stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01-A2
      competency_stable_id: '01.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0106_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0106_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_underlying_activity_is_attempted
        - public_display_is_unnecessary
        - the_experience_includes_costs_as_well_as_appeal
      - measurement_id: c0106_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0106_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01-A3
    sequence: 3
    title: Rewrite the goal around what remains
    instructions: 'Keep, shrink, replace, or retire the goal using the trial. Write a next action and
      remove one audience-dependent condition if it has no useful function. Preserve professional recognition
      or social participation when those serve a real purpose rather than treating all visibility as vanity.


      Observation checks: A goal disposition follows the trial; A meaningful next action is specified;
      Legitimate social purposes are distinguished. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which part of the goal survives without applause, and which external reward is still
      legitimately useful?


      Examples: Supportive: A prestige purchase was dropped while a modest weekly learning goal was retained.


      Mixed: The activity still matters, but recognition is also a significant motive.


      Contradictory: The exercise became shame about enjoying recognition or a reason to abandon necessary
      paid work.


      Inconclusive: Motives were guessed without trying the underlying activity or revisiting the goal.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01
      action_stable_id: PRACTICE-COMP-0106-MEANING-VERSUS-STATUS-01-A3
      competency_stable_id: '01.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
