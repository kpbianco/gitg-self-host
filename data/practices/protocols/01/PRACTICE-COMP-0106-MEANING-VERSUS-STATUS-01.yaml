completion_and_review:
  completion_criteria:
  - 'Action 1: Compare visible and invisible rewards. Observed checks: Private benefits are identified;
    Social rewards are acknowledged without shame; The audience-free version is considered.'
  - 'Action 2: Try the substance without the display. Observed checks: The underlying activity is attempted;
    Public display is unnecessary; The experience includes costs as well as appeal.'
  - 'Action 3: Rewrite the goal around what remains. Observed checks: A goal disposition follows the trial;
    A meaningful next action is specified; Legitimate social purposes are distinguished.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0106_a1_primary
    - c0106_a2_primary
    - c0106_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Which part of the goal survives without applause, and which external reward is
    still legitimately useful?
  transfer_limit: The trial separates substance from audience rewards for one goal. Motives can remain
    mixed, and one session cannot determine an entire career or life direction.
  reflection:
    before: 'What would count as doing this honestly? Goal: Separate meaningful motives from comparison
      and revise one goal accordingly.'
    during: Which checks have actually been observed? The activity still matters, but recognition is also
      a significant motive.
    after: Which part of the goal survives without applause, and which external reward is still legitimately
      useful?
  review_guidance:
    repeat: Repeat the same bounded Meaning versus status design only when the context and burden remain
      appropriate.
    adapt: Use existing materials, a library resource, or a simulated private comparison. Necessary public
      collaboration need not be hidden; this is a motive check, not enforced secrecy.
    stop: Stop Meaning versus status when the practice becomes coercive, unsafe, privacy-invasive, role-inappropriate,
      professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A prestige purchase was dropped while a modest weekly learning goal was retained.
    mixed: The activity still matters, but recognition is also a significant motive.
    contradictory: The exercise became shame about enjoying recognition or a reason to abandon necessary
      paid work.
    inconclusive: Motives were guessed without trying the underlying activity or revisiting the goal.
