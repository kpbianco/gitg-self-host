        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Meaning versus status; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use existing materials, a library resource, or a simulated private comparison. Necessary public
      collaboration need not be hidden; this is a motive check, not enforced secrecy.
    cultural_context:
    - Adapt the expression of Meaning versus status to direct or indirect communication, collective or
      individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use existing materials, a library resource, or a simulated private comparison. Necessary public
      collaboration need not be hidden; this is a motive check, not enforced secrecy.
  pause_conditions:
  - Pause Meaning versus status when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Meaning versus status practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Meaning versus status situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
