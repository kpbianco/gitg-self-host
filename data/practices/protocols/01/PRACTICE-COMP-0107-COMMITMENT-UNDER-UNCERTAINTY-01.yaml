  - c0107_a3_adverse
  adverse_or_contradictory_indicators:
  - The trial exceeded its resource limit or its review point was repeatedly avoided.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Commitment under uncertainty explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Commitment under uncertainty context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Commitment under uncertainty observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Commitment under uncertainty rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Separate facts from decision assumptions. Observed checks: Facts and
    assumptions are separated; Options are feasible; A decision-relevant unknown is named. Action 2: Choose
    the smallest informative trial. Observed checks: A bounded trial is selected; Downside and stop conditions
    are explicit; The trial is actually attempted. Action 3: Reassess at the promised point. Observed
    checks: The review occurs at a stated point; Observations test the assumptions; Uncertainty survives
    where evidence is missing.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The options were compared but no trial or explicit
    simulation occurred.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Commitment
    under uncertainty contribution under typed evaluation; protocol performance remains distinct and is
    never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L11
  - L14
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Commitment under uncertainty evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Separate facts from decision assumptions. Observed checks: Facts and assumptions are separated;
    Options are feasible; A decision-relevant unknown is named.'
  - 'Action 2: Choose the smallest informative trial. Observed checks: A bounded trial is selected; Downside
    and stop conditions are explicit; The trial is actually attempted.'
  - 'Action 3: Reassess at the promised point. Observed checks: The review occurs at a stated point; Observations
    test the assumptions; Uncertainty survives where evidence is missing.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0107_a1_primary
    - c0107_a2_primary
    - c0107_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: What did acting teach you that more speculation would not, and what remains worth
    investigating?
  transfer_limit: A reversible trial practices assumptions and review under uncertainty. Consequential
    or irreversible decisions require additional information and safeguards beyond this exercise.
  reflection:
    before: 'What would count as doing this honestly? Goal: Act under uncertainty using explicit assumptions,
      a limited downside, and a review trigger.'
    during: Which checks have actually been observed? The trial occurred but an interruption prevented
      a fair comparison.
    after: What did acting teach you that more speculation would not, and what remains worth investigating?
  review_guidance:
    repeat: Repeat the same bounded Commitment under uncertainty design only when the context and burden
      remain appropriate.
    adapt: Use the study-time example as a paper simulation when live experimentation is impractical.
      Simulation exercises decision structure but does not show real-world results.
    stop: Stop Commitment under uncertainty when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A one-session trial overturned an assumption and the next session was rescheduled accordingly.
    mixed: The trial occurred but an interruption prevented a fair comparison.
    contradictory: The trial exceeded its resource limit or its review point was repeatedly avoided.
    inconclusive: The options were compared but no trial or explicit simulation occurred.
