    c0107_a1_boundary: Action 1 stayed inside its stated Commitment under uncertainty boundary
    c0107_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c0107_a2_primary: The bounded Commitment under uncertainty criterion for action 2 was observed
    c0107_a2_boundary: Action 2 stayed inside its stated Commitment under uncertainty boundary
    c0107_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c0107_a3_primary: The bounded Commitment under uncertainty criterion for action 3 was observed
    c0107_a3_boundary: Action 3 stayed inside its stated Commitment under uncertainty boundary
    c0107_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record shows what happened in one limited Commitment under uncertainty
    practice, including support, contradiction, defer, no result, or harm.
  display_order: 16
