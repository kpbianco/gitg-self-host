  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Commitment under uncertainty; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use the study-time example as a paper simulation when live experimentation is impractical. Simulation
      exercises decision structure but does not show real-world results.
    cultural_context:
    - Adapt the expression of Commitment under uncertainty to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use the study-time example as a paper simulation when live experimentation is impractical. Simulation
      exercises decision structure but does not show real-world results.
  pause_conditions:
  - Pause Commitment under uncertainty when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Commitment under uncertainty practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Commitment under uncertainty situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Commitment under uncertainty actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
