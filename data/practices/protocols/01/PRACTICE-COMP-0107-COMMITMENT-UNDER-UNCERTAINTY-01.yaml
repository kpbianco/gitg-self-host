meaning_and_fit:
  purpose: Act under uncertainty using explicit assumptions, a limited downside, and a review trigger.
  why_recommended: Act under uncertainty using explicit assumptions, a limited downside, and a review
    trigger.
  claims:
  - statement: Act under uncertainty using explicit assumptions, a limited downside, and a review trigger.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Commitment under uncertainty practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Commitment under uncertainty as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the study-time example as a paper simulation when live experimentation
    is impractical. Simulation exercises decision structure but does not show real-world results.
  opportunity_considerations: Pick a reversible ordinary decision, such as trying a different study time
    or asking about an activity. Exclude contracts, treatment changes, investments, and choices with serious
    consequences.
  prerequisites:
  - Pick a reversible ordinary decision, such as trying a different study time or asking about an activity.
    Exclude contracts, treatment changes, investments, and choices with serious consequences.
  dependencies: []
  safe_alternatives:
  - Use the study-time example as a paper simulation when live experimentation is impractical. Simulation
    exercises decision structure but does not show real-world results.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Commitment under uncertainty differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Commitment under uncertainty
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Pick a reversible ordinary decision, such as trying a different study time or asking about an
    activity. Exclude contracts, treatment changes, investments, and choices with serious consequences.
    Goal: Act under uncertainty using explicit assumptions, a limited downside, and a review trigger.
    Scope: A reversible trial practices assumptions and review under uncertainty. Consequential or irreversible
    decisions require additional information and safeguards beyond this exercise. Time and effort: About
    15 minutes of decision preparation, one ordinary trial, and a 10-minute reassessment. Adaptation:
    Use the study-time example as a paper simulation when live experimentation is impractical. Simulation
    exercises decision structure but does not show real-world results. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the study-time example as a paper simulation when live experimentation is impractical.
    Simulation exercises decision structure but does not show real-world results.
  expected_burden: About 15 minutes of decision preparation, one ordinary trial, and a 10-minute reassessment.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Commitment under uncertainty protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Commitment under uncertainty action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the study-time
    example as a paper simulation when live experimentation is impractical. Simulation exercises decision
    structure but does not show real-world results.
  actions:
  - stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01-A1
    sequence: 1
    title: Separate facts from decision assumptions
    instructions: 'Write the decision, two feasible options, three facts you know, and two assumptions
      you are making. Identify one missing fact that would genuinely change the choice. Give information
      gathering a small time limit so investigation serves the decision rather than postpones it indefinitely.


      Observation checks: Facts and assumptions are separated; Options are feasible; A decision-relevant
      unknown is named. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01
      action_stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01-A1
      competency_stable_id: '01.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0107_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0107_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - facts_and_assumptions_are_separated
        - options_are_feasible
        - a_decision_relevant_unknown_is_named
      - measurement_id: c0107_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0107_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01-A2
    sequence: 2
    title: Choose the smallest informative trial
    instructions: 'Select the option that offers useful information with an acceptable, reversible cost.
      State the trial length, maximum time or resource cost, and stop condition. Carry it out once; for
      a study-time trial, use one ordinary session and keep other conditions as similar as practical.


      Observation checks: A bounded trial is selected; Downside and stop conditions are explicit; The
      trial is actually attempted. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01
      action_stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01-A2
      competency_stable_id: '01.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0107_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0107_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_bounded_trial_is_selected
        - downside_and_stop_conditions_are_explicit
        - the_trial_is_actually_attempted
      - measurement_id: c0107_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0107_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01-A3
    sequence: 3
    title: Reassess at the promised point
    instructions: 'At the chosen review point, compare observations with the assumptions. Decide continue,
      alter, or stop, and name what is still unknown. If the result is inconclusive, choose whether another
      bounded trial is worth its cost rather than declaring success to justify the decision.


      Observation checks: The review occurs at a stated point; Observations test the assumptions; Uncertainty
      survives where evidence is missing. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What did acting teach you that more speculation would not, and what remains worth
      investigating?


      Examples: Supportive: A one-session trial overturned an assumption and the next session was rescheduled
      accordingly.


      Mixed: The trial occurred but an interruption prevented a fair comparison.


      Contradictory: The trial exceeded its resource limit or its review point was repeatedly avoided.


      Inconclusive: The options were compared but no trial or explicit simulation occurred.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01
      action_stable_id: PRACTICE-COMP-0107-COMMITMENT-UNDER-UNCERTAINTY-01-A3
      competency_stable_id: '01.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0107_a3_primary
