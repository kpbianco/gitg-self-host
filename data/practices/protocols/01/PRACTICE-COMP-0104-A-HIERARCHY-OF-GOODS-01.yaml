  performance_rubric: 'Action 1: Name the goods and the actual conflict. Observed checks: Both options
    serve a real good; Affected people are considered; The unavoidable tradeoff is specified. Action 2:
    Choose a priority with an exception. Observed checks: A priority is explicit; A reversal condition
