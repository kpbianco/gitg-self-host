meaning_and_fit:
  purpose: 'Practice A hierarchy of goods through a consent-respecting relational practice bounded by
    the canonical scope: Rank competing goods such as truth, love, justice, loyalty, freedom, security,
    achievement, pleasure, family, and service.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can use the hierarchy
    to resolve a real conflict instead of claiming every value is equally important. The protocol creates
    a small opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for A hierarchy of goods is a traceable product-design
      basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded A hierarchy of goods practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record A hierarchy of goods as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited A hierarchy of goods
    context, understand the source-only status, and stop without losing safety, care, employment, housing,
    services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to A hierarchy
    of goods; do not manufacture conflict, deprivation, exposure, disclosure, danger, urgency, or dependence
    for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of A hierarchy of goods.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for A hierarchy of goods instead of
    a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    A hierarchy of goods differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about A hierarchy of goods as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Complete three bounded A hierarchy of goods actions over ten days, preserving explicit not-applicable,
    defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for A hierarchy of goods; copy the canonical scope and evidence target into
    a private working note; define the action boundary, valid supports, privacy limit, and stop condition
    before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for A hierarchy
    of goods. Do not store private prose, names, identities, diagnoses, allegations, credentials, account
    data, protected work information, intimate detail, artifact contents, observer narrative, or another
    person's secrets. This source-only draft is not surveillance, professional advice, treatment, certification,
    or proof of character.
  expected_burden: About 45-75 minutes total across setup, three A hierarchy of goods actions, and review;
    scope may be reduced or deferred for access, care, health, workload, conscience, or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the A hierarchy of goods protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed A hierarchy of goods action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Any A hierarchy of goods situation involving emergency response, abuse, retaliation, illegal conduct,
    medical treatment, legal representation, financial-loss decisions, safeguarding, hazardous equipment,
    or other consequences beyond a reversible source-only exercise.
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
  actions:
  - stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01-A1
    sequence: 1
    title: Prepare a consent-safe A hierarchy of goods interaction
    instructions: 'Choose one welcome, low-stakes relationship context for A hierarchy of goods. Translate
      the canonical scope into one observable communication act, identify power or retaliation concerns,
      and obtain or preserve the other person''s freedom not to participate: Rank competing goods such
