meaning_and_fit:
  purpose: Use an explicit, revisable priority order when two legitimate goods cannot both be fully served.
  why_recommended: Use an explicit, revisable priority order when two legitimate goods cannot both be
    fully served.
  claims:
  - statement: Use an explicit, revisable priority order when two legitimate goods cannot both be fully
      served.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Philosophical value inquiry distinguishes goods valued for themselves from instrumental
      goods and considers plural values that may conflict or resist a single scale.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-VALUE-QUESTIONS
    limitations: Educational conceptual support only; does not prescribe the person's priority order or
      test the product's exercises or outcomes.
  applicability_question: Does a voluntary, bounded A hierarchy of goods practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record A hierarchy of goods as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Sort cards or speak the comparison instead of writing. A person receiving
    care can prioritize care and rest without justifying those needs as productivity.
  opportunity_considerations: Use a minor conflict such as rest versus volunteering or candor versus confidentiality.
    Write two feasible options and keep essential care and safety outside the tradeoff.
  prerequisites:
  - Use a minor conflict such as rest versus volunteering or candor versus confidentiality. Write two
    feasible options and keep essential care and safety outside the tradeoff.
  dependencies: []
  safe_alternatives:
  - Sort cards or speak the comparison instead of writing. A person receiving care can prioritize care
    and rest without justifying those needs as productivity.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    A hierarchy of goods differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about A hierarchy of goods as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a minor conflict such as rest versus volunteering or candor versus confidentiality. Write
    two feasible options and keep essential care and safety outside the tradeoff. Goal: Use an explicit,
    revisable priority order when two legitimate goods cannot both be fully served. Scope: A priority
    order is tested in one conflict. Other goods and emergencies may require different judgments; this
    is a revisable ordering, not a universal numerical ranking. Time and effort: About 20 minutes of comparison
    plus one small decision and its review. Adaptation: Sort cards or speak the comparison instead of
    writing. A person receiving care can prioritize care and rest without justifying those needs as productivity.
    Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Introduction to Philosophy, 8.2 Basic Questions about Values: https://openstax.org/books/introduction-philosophy/pages/8-2-basic-questions-about-values'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Sort cards or speak the comparison instead of writing. A person receiving care
    can prioritize care and rest without justifying those needs as productivity.
  expected_burden: About 20 minutes of comparison plus one small decision and its review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the A hierarchy of goods protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed A hierarchy of goods action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Sort cards
    or speak the comparison instead of writing. A person receiving care can prioritize care and rest without
    justifying those needs as productivity.
  actions:
  - stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01-A1
    sequence: 1
    title: Name the goods and the actual conflict
    instructions: 'For each option, name who benefits, which good it serves, and which good it sacrifices.
      Example: accepting an extra shift supports income but displaces a promised family visit. Separate
      needs, promises, preferences, and status concerns before ordering them.


      Observation checks: Both options serve a real good; Affected people are considered; The unavoidable
      tradeoff is specified. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01
      action_stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01-A1
      competency_stable_id: '01.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0104_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0104_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_options_serve_a_real_good
        - affected_people_are_considered
        - the_unavoidable_tradeoff_is_specified
      - measurement_id: c0104_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0104_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01-A2
    sequence: 2
    title: Choose a priority with an exception
    instructions: 'State which good takes precedence in this case and why. Name a threshold that would
      reverse the choice, such as an essential expense rather than discretionary spending. Test whether
      you would accept the same reasoning if the inconvenience fell on you instead of someone else.


      Observation checks: A priority is explicit; A reversal condition is defined; The role-reversal check
      is performed. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01
      action_stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01-A2
      competency_stable_id: '01.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0104_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0104_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_priority_is_explicit
        - a_reversal_condition_is_defined
        - the_role_reversal_check_is_performed
      - measurement_id: c0104_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0104_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01-A3
    sequence: 3
    title: Make and review the bounded choice
    instructions: 'Carry out the small choice or rehearse the supplied case. Communicate any changed commitment
      to the affected person where appropriate. Afterward note the preserved good, the remaining cost,
      and whether the priority should change next time. Do not rewrite the cost as though nothing was
      lost.


      Observation checks: The choice is enacted or explicitly rehearsed; Consequences are reviewed; The
      forgone good remains acknowledged. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Would your stated hierarchy still make sense if you received less benefit from this
      choice?


      Examples: Supportive: A prior promise took precedence over optional income, with an explicit essential-expense
      exception.


      Mixed: A defensible priority was chosen but another person''s inconvenience was not discussed.


      Contradictory: Every good was called equally important and the choice was justified only after the
      fact.


      Inconclusive: No conflict, consequence, or feasible choice was identified.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01
      action_stable_id: PRACTICE-COMP-0104-A-HIERARCHY-OF-GOODS-01-A3
      competency_stable_id: '01.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
