  adverse_or_contradictory_indicators:
  - The A hierarchy of goods action exceeded consent, authority, privacy, qualification, role, burden,
    or safety boundaries.
  - The evidence contradicted the intended A hierarchy of goods criterion, depended on coercion or hidden
    private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for A hierarchy of goods explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen A hierarchy of goods context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each A hierarchy of goods observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated A hierarchy of goods rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can use the hierarchy to resolve a real conflict instead of claiming every value is equally
    important.—not completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for A hierarchy of goods requires a bounded context, allowlisted observations,
    provenance, contradiction and adverse handling, and preserved uncertainty; free text and artifact
    contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct A hierarchy
    of goods contribution under typed evaluation; protocol performance remains distinct and is never counted
    twice.
