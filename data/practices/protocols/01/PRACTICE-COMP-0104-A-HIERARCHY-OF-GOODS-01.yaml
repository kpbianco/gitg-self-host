completion_and_review:
  completion_criteria:
  - The prepare a consent-safe a hierarchy of goods interaction action was attempted or explicitly deferred.
  - The practice one a hierarchy of goods communication act action was attempted or explicitly deferred.
  - The review a hierarchy of goods without scoring the person action preserved a limited conclusion,
