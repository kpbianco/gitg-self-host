    - c0104_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden A hierarchy of goods only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish A hierarchy of goods across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does A hierarchy of goods require in this exact context, what remains outside my role
      or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable A hierarchy of goods criterion is present, absent, mixed, or unknown, and
      are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can use the hierarchy to resolve a real conflict instead of
      claiming every value is equally important.', what contradiction or missing context matters most,
      and should this A hierarchy of goods design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded A hierarchy of goods design only when the context and burden remain
      appropriate.
    adapt: Change the A hierarchy of goods medium, scope, support, timing, criteria, or context while
      preserving provenance and the narrower evidence claim.
    stop: Stop A hierarchy of goods when the practice becomes coercive, unsafe, privacy-invasive, role-inappropriate,
      professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for A hierarchy of goods questions beyond
      this educational source-only boundary.
  evidence_examples:
    supportive: The bounded A hierarchy of goods criteria were observed with provenance and no adverse
      boundary signal in the selected context.
    mixed: Some A hierarchy of goods criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended A hierarchy of goods criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The A hierarchy of goods action was deferred, not observed, not applicable, stale, insufficiently
      bounded, or too confounded to interpret.
