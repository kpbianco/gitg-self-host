  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      A hierarchy of goods; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Sort cards or speak the comparison instead of writing. A person receiving care can prioritize care
      and rest without justifying those needs as productivity.
    cultural_context:
    - Adapt the expression of A hierarchy of goods to direct or indirect communication, collective or
      individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Sort cards or speak the comparison instead of writing. A person receiving care can prioritize care
      and rest without justifying those needs as productivity.
  pause_conditions:
  - Pause A hierarchy of goods when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the A hierarchy of goods practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a A hierarchy of goods situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
