  adverse_or_contradictory_indicators:
  - The comparison dismissed rest as laziness or treated another person's way of life as inferior.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Conceptions of flourishing explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Conceptions of flourishing context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Conceptions of flourishing observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Conceptions of flourishing rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Give three accounts a fair hearing. Observed checks: Three distinct reasons
    are explained; Each account has a genuine limitation; The same choice is used for comparison. Action
    2: Make the tradeoff visible. Observed checks: An allocation is specified; A forgone good is named;
    The allocation is tried or explicitly simulated. Action 3: Test the account against changed circumstances.
    Observed checks: A changed circumstance is considered; Reasoning is revised or defended; A limit on
    generalization is recorded.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A preference was stated without explaining any competing
    account or testing a choice.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Conceptions
    of flourishing contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L01
  - L02
  - L36
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Conceptions of flourishing evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Give three accounts a fair hearing. Observed checks: Three distinct reasons are explained;
    Each account has a genuine limitation; The same choice is used for comparison.'
  - 'Action 2: Make the tradeoff visible. Observed checks: An allocation is specified; A forgone good
    is named; The allocation is tried or explicitly simulated.'
  - 'Action 3: Test the account against changed circumstances. Observed checks: A changed circumstance
    is considered; Reasoning is revised or defended; A limit on generalization is recorded.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0101_a1_primary
    - c0101_a2_primary
    - c0101_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Which account illuminated a neglected good, and where would your chosen rule fail?
  transfer_limit: This compares three lenses on one choice. Wider flourishing includes faith, freedom,
    relationships, service and contentment; the optional fourth lens begins that extension without settling
    every account.
  reflection:
    before: 'What would count as doing this honestly? Goal: Explain competing accounts of flourishing
      and use their differences to make one defensible choice.'
    during: Which checks have actually been observed? Three accounts were named but two gave indistinguishable
      reasons; the comparison needs clarification.
    after: Which account illuminated a neglected good, and where would your chosen rule fail?
  review_guidance:
    repeat: Repeat the same bounded Conceptions of flourishing design only when the context and burden
      remain appropriate.
    adapt: Explain the comparison aloud or with three symbols. Rest and receiving care may be the whole
      appropriate afternoon; no purchase, productivity target, or religious commitment is required.
    stop: Stop Conceptions of flourishing when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: The allocation protected a promise and rest, and its author explained why urgent care
      would change it.
    mixed: Three accounts were named but two gave indistinguishable reasons; the comparison needs clarification.
    contradictory: The comparison dismissed rest as laziness or treated another person's way of life as
      inferior.
    inconclusive: A preference was stated without explaining any competing account or testing a choice.
