meaning_and_fit:
  purpose: Explain competing accounts of flourishing and use their differences to make one defensible
    choice.
  why_recommended: Explain competing accounts of flourishing and use their differences to make one defensible
    choice.
  claims:
  - statement: Explain competing accounts of flourishing and use their differences to make one defensible
      choice.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Philosophical value inquiry distinguishes goods valued for themselves from instrumental
      goods and considers plural values that may conflict or resist a single scale.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-VALUE-QUESTIONS
    limitations: Educational conceptual support only; does not prescribe the person's priority order or
      test the product's exercises or outcomes.
  - statement: Consequentialist reasoning evaluates consequences for those affected; considering only
      the decision maker's own benefit is not an adequate account of that approach.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-CONSEQUENTIALISM
    limitations: One family of normative positions, not the uniquely correct morality, a numerical wellbeing
      measure, or evidence of the effectiveness of this exercise.
  applicability_question: Does a voluntary, bounded Conceptions of flourishing practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Conceptions of flourishing as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Explain the comparison aloud or with three symbols. Rest and receiving care
    may be the whole appropriate afternoon; no purchase, productivity target, or religious commitment
    is required.
  opportunity_considerations: Use paper or an offline note. Work with a free afternoon divided between
    rest, keeping a promise, and learning something useful; substitute an equally small real choice if
    preferred.
  prerequisites:
  - Use paper or an offline note. Work with a free afternoon divided between rest, keeping a promise,
    and learning something useful; substitute an equally small real choice if preferred.
  dependencies: []
  safe_alternatives:
  - Explain the comparison aloud or with three symbols. Rest and receiving care may be the whole appropriate
    afternoon; no purchase, productivity target, or religious commitment is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Conceptions of flourishing differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Conceptions of flourishing
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper or an offline note. Work with a free afternoon divided between rest, keeping a promise,
    and learning something useful; substitute an equally small real choice if preferred. Goal: Explain
    competing accounts of flourishing and use their differences to make one defensible choice. Scope:
    This compares three lenses on one choice. Wider flourishing includes faith, freedom, relationships,
    service and contentment; the optional fourth lens begins that extension without settling every account.
    Time and effort: About 30 minutes of comparison, one ordinary choice, and a 10-minute review. Adaptation:
    Explain the comparison aloud or with three symbols. Rest and receiving care may be the whole appropriate
    afternoon; no purchase, productivity target, or religious commitment is required. Keep personal working
    notes outside the check-in; record only the listed observations.


    Reference support:

    Introduction to Philosophy, 8.2 Basic Questions about Values: https://openstax.org/books/introduction-philosophy/pages/8-2-basic-questions-about-values

    Introduction to Philosophy, 9.2 Consequentialism: https://openstax.org/books/introduction-philosophy/pages/9-2-consequentialism'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Explain the comparison aloud or with three symbols. Rest and receiving care may
    be the whole appropriate afternoon; no purchase, productivity target, or religious commitment is required.
  expected_burden: About 30 minutes of comparison, one ordinary choice, and a 10-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Conceptions of flourishing protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Conceptions of flourishing action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Explain the
    comparison aloud or with three symbols. Rest and receiving care may be the whole appropriate afternoon;
    no purchase, productivity target, or religious commitment is required.
  actions:
  - stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01-A1
    sequence: 1
    title: Give three accounts a fair hearing
    instructions: 'Describe a good afternoon through character development, obligations to others, and
      overall benefit. For each, write its recommended choice, strongest reason, and one good it might
      neglect. Add a faith, freedom, care, or contentment perspective if it changes the answer. Do not
      rank people by their preferred account.


      Observation checks: Three distinct reasons are explained; Each account has a genuine limitation;
      The same choice is used for comparison. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01
      action_stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01-A1
      competency_stable_id: '01.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0101_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0101_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_distinct_reasons_are_explained
        - each_account_has_a_genuine_limitation
        - the_same_choice_is_used_for_comparison
      - measurement_id: c0101_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0101_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01-A2
    sequence: 2
    title: Make the tradeoff visible
    instructions: 'Allocate the afternoon''s actual available time. Explain which account drives the allocation
      and what another account would change. For example, keeping a short promise before resting may protect
      reliability and recovery while postponing learning. Try the allocation once, or walk through the
      supplied case if no free time is available.


      Observation checks: An allocation is specified; A forgone good is named; The allocation is tried
      or explicitly simulated. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01
      action_stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01-A2
      competency_stable_id: '01.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0101_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0101_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_allocation_is_specified
        - a_forgone_good_is_named
        - the_allocation_is_tried_or_explicitly_simulated
      - measurement_id: c0101_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0101_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01-A3
    sequence: 3
    title: Test the account against changed circumstances
    instructions: 'Reconsider the afternoon with an exhausted person, a dependent needing help, or an
      urgent promise. State what changes and why. Keep or revise your original reasoning, explaining how
      circumstances influence flourishing without making one lifestyle mandatory.


      Observation checks: A changed circumstance is considered; Reasoning is revised or defended; A limit
      on generalization is recorded. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which account illuminated a neglected good, and where would your chosen rule fail?


      Examples: Supportive: The allocation protected a promise and rest, and its author explained why
      urgent care would change it.


      Mixed: Three accounts were named but two gave indistinguishable reasons; the comparison needs clarification.


      Contradictory: The comparison dismissed rest as laziness or treated another person''s way of life
      as inferior.


      Inconclusive: A preference was stated without explaining any competing account or testing a choice.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01
      action_stable_id: PRACTICE-COMP-0101-CONCEPTIONS-OF-FLOURISHING-01-A3
      competency_stable_id: '01.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0101_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0101_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_changed_circumstance_is_considered
        - reasoning_is_revised_or_defended
        - a_limit_on_generalization_is_recorded
      - measurement_id: c0101_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0101_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Conceptions of flourishing; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Explain the comparison aloud or with three symbols. Rest and receiving care may be the whole appropriate
      afternoon; no purchase, productivity target, or religious commitment is required.
    cultural_context:
    - Adapt the expression of Conceptions of flourishing to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Explain the comparison aloud or with three symbols. Rest and receiving care may be the whole appropriate
      afternoon; no purchase, productivity target, or religious commitment is required.
  pause_conditions:
  - Pause Conceptions of flourishing when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Conceptions of flourishing practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Conceptions of flourishing situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
