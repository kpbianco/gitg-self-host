meaning_and_fit:
  purpose: 'Practice Family labor, provision, and invisible work through a qualified-support preparation
    bounded by the canonical scope: Recognize domestic, emotional, logistical, financial, and caregiving
    labor and distribute it fairly.'
  why_recommended: 'The parent competency identifies this limited evidence target: Responsibilities are
    visible, negotiated, and reviewed rather than silently assigned. The protocol creates a small opportunity
    to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Family labor, provision, and invisible
      work is a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Family labor, provision, and invisible work practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Family labor, provision, and invisible work as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Family labor, provision,
    and invisible work context, understand the source-only status, and stop without losing safety, care,
    employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Family labor,
    provision, and invisible work; do not manufacture conflict, deprivation, exposure, disclosure, danger,
    urgency, or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Family labor, provision, and invisible
    work.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Family labor, provision, and invisible
    work instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Family labor, provision, and invisible work differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Family labor, provision, and
    invisible work as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Complete three bounded Family labor, provision, and invisible work actions over ten days, preserving
    explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Family labor, provision, and invisible work; copy the canonical scope
    and evidence target into a private working note; define the action boundary, valid supports, privacy
    limit, and stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Family labor,
    provision, and invisible work. Do not store private prose, names, identities, diagnoses, allegations,
    credentials, account data, protected work information, intimate detail, artifact contents, observer
    narrative, or another person's secrets. This source-only draft is not surveillance, professional advice,
    treatment, certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Family labor, provision, and invisible
    work actions, and review; scope may be reduced or deferred for access, care, health, workload, conscience,
    or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Family labor, provision, and invisible work protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Family labor, provision, and invisible work action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Family labor, provision, and invisible work situation involving emergency response, abuse, retaliation,
    illegal conduct, medical treatment, legal representation, financial-loss decisions, safeguarding,
    hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
    guidance.
