  - c1915_a3_adverse
  adverse_or_contradictory_indicators:
  - The Caregiver limits, respite, and shared responsibility action exceeded consent, authority, privacy,
    qualification, role, burden, or safety boundaries.
  - The evidence contradicted the intended Caregiver limits, respite, and shared responsibility criterion,
    depended on coercion or hidden private content, or could not distinguish the protocol from contextual
    change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Caregiver limits, respite, and shared responsibility explicitly; support can enable access and
    never reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Caregiver limits, respite, and shared
    responsibility context, action, role, pathway, and assessment epoch; it does not establish cross-context
    reliability.
  repetition_rule: Each Caregiver limits, respite, and shared responsibility observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Caregiver limits, respite, and shared responsibility rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Care remains safer and more sustainable because limits and backup are explicit.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Caregiver limits, respite, and shared responsibility requires a
    bounded context, allowlisted observations, provenance, contradiction and adverse handling, and preserved
    uncertainty; free text and artifact contents are excluded.
  scoring_eligibility: This package is non-scored and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Caregiver
    limits, respite, and shared responsibility evidence only under offline typed evaluation; protocol
    performance remains distinct and is never counted twice.
