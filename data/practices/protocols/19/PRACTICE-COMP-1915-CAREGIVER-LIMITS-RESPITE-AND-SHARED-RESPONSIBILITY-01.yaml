completion_and_review:
  completion_criteria:
  - The bound the qualified question for caregiver limits, respite, and shared responsibility action was
    attempted or explicitly deferred.
  - The prepare minimum information for caregiver limits, respite, and shared responsibility action was
    attempted or explicitly deferred.
  - The record a bounded caregiver limits, respite, and shared responsibility disposition action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1915_a1_primary
    - c1915_a2_primary
    - c1915_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Caregiver limits, respite, and shared responsibility only when
    the initial context remained safe, the evidence criteria were usable, burden was acceptable, and a
    new context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Caregiver limits, respite, and shared responsibility
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Caregiver limits, respite, and shared responsibility require in this exact context,
      what remains outside my role or authority, and which scope sentence or evidence criterion will keep
      the practice honest?
    during: Which observable Caregiver limits, respite, and shared responsibility criterion is present,
      absent, mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Care remains safer and more sustainable because limits and
      backup are explicit.', what contradiction or missing context matters most, and should this Caregiver
      limits, respite, and shared responsibility design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Caregiver limits, respite, and shared responsibility design only when
      the context and burden remain appropriate.
    adapt: Change the Caregiver limits, respite, and shared responsibility medium, scope, support, timing,
      criteria, or context while preserving provenance and the narrower evidence claim.
    stop: Stop Caregiver limits, respite, and shared responsibility when the practice becomes coercive,
      unsafe, privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Caregiver limits, respite, and shared
      responsibility questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Caregiver limits, respite, and shared responsibility criteria were observed
      with provenance and no adverse boundary signal in the selected context.
    mixed: Some Caregiver limits, respite, and shared responsibility criteria were observed while burden,
      support, contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Caregiver limits, respite, and shared responsibility
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Caregiver limits, respite, and shared responsibility action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
