  repetition_rule: Each Education, formation, and modeling in family life observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Education, formation, and modeling in family life rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—A dependent person gains real capability and voice rather than merely compliance.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Education, formation, and modeling in family life requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Education,
    formation, and modeling in family life contribution under typed evaluation; protocol performance remains
