  reflection:
    before: What does Education, formation, and modeling in family life require in this exact context,
      what remains outside my role or authority, and which scope sentence or evidence criterion will keep
      the practice honest?
    during: Which observable Education, formation, and modeling in family life criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'A dependent person gains real capability and voice rather
      than merely compliance.', what contradiction or missing context matters most, and should this Education,
      formation, and modeling in family life design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Education, formation, and modeling in family life design only when
      the context and burden remain appropriate.
    adapt: Change the Education, formation, and modeling in family life medium, scope, support, timing,
      criteria, or context while preserving provenance and the narrower evidence claim.
    stop: Stop Education, formation, and modeling in family life when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Education, formation, and modeling in
      family life questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Education, formation, and modeling in family life criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Education, formation, and modeling in family life criteria were observed while burden,
      support, contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Education, formation, and modeling in family
      life criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Education, formation, and modeling in family life action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
