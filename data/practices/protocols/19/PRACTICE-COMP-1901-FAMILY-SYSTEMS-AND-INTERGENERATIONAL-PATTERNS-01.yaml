  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The bound the qualified question for family systems and intergenerational patterns action was attempted
    or explicitly deferred.
  - The prepare minimum information for family systems and intergenerational patterns action was attempted
    or explicitly deferred.
  - The record a bounded family systems and intergenerational patterns disposition action preserved a
    limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1901_a1_primary
    - c1901_a2_primary
    - c1901_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Family systems and intergenerational patterns only when the
    initial context remained safe, the evidence criteria were usable, burden was acceptable, and a new
    context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Family systems and intergenerational patterns
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Family systems and intergenerational patterns require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Family systems and intergenerational patterns criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Preserves what is good and interrupts a harmful pattern with
      proportionate boundaries or repair.', what contradiction or missing context matters most, and should
      this Family systems and intergenerational patterns design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Family systems and intergenerational patterns design only when the
      context and burden remain appropriate.
    adapt: Change the Family systems and intergenerational patterns medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Family systems and intergenerational patterns when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Family systems and intergenerational
      patterns questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Family systems and intergenerational patterns criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Family systems and intergenerational patterns criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Family systems and intergenerational patterns
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Family systems and intergenerational patterns action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
