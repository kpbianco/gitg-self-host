  - stable_id: PRACTICE-COMP-2609-WONDER-AND-AWE-01-A2
    sequence: 2
    title: Complete two bounded Wonder and awe practices
    instructions: Complete two short, freely chosen Wonder and awe practices appropriate to the declared
      frame, such as reading, silence, prayer, observation, ritual, dialogue, or reflection. Stop for
      distress, coercion, altered-state risk, conscience conflict, or pressure from an authority or group.
    expected_time: 15-25 minutes
