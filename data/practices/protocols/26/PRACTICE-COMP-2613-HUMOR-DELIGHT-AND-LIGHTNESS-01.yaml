  adverse_or_contradictory_indicators:
  - The Humor, delight, and lightness action exceeded consent, authority, privacy, qualification, role,
    burden, or safety boundaries.
  - The evidence contradicted the intended Humor, delight, and lightness criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Humor, delight, and lightness explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Humor, delight, and lightness context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Humor, delight, and lightness observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Humor, delight, and lightness rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Brings relief or connection to a difficult season without denying what is serious.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Humor, delight, and lightness requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Humor,
    delight, and lightness contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L07
  - L23
  - L26
  - L34
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Humor, delight, and lightness evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The define a rubric for humor, delight, and lightness action was attempted or explicitly deferred.
  - The build one humor, delight, and lightness artifact action was attempted or explicitly deferred.
  - The stress-test and revise the humor, delight, and lightness artifact action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2613_a1_primary
    - c2613_a2_primary
    - c2613_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Humor, delight, and lightness only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Humor, delight, and lightness across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Humor, delight, and lightness require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Humor, delight, and lightness criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Brings relief or connection to a difficult season without
      denying what is serious.', what contradiction or missing context matters most, and should this Humor,
      delight, and lightness design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Humor, delight, and lightness design only when the context and burden
      remain appropriate.
    adapt: Change the Humor, delight, and lightness medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Humor, delight, and lightness when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Humor, delight, and lightness questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Humor, delight, and lightness criteria were observed with provenance and no
      adverse boundary signal in the selected context.
    mixed: Some Humor, delight, and lightness criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Humor, delight, and lightness criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Humor, delight, and lightness action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
