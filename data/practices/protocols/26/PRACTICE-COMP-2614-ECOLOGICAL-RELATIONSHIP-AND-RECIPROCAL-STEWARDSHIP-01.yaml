  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Ecological relationship and reciprocal stewardship; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Ecological relationship and reciprocal stewardship; assistive technology, interpretation,
      a support person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Ecological relationship and reciprocal stewardship to direct or indirect
      communication, collective or individual decision structures, local norms, faith or secular commitments,
      and role obligations while preserving consent and dignity.
    resource_variants:
    - When a real Ecological relationship and reciprocal stewardship opportunity is unavailable or inappropriate,
      use a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause Ecological relationship and reciprocal stewardship when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Ecological relationship and reciprocal stewardship practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Ecological relationship and reciprocal stewardship situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Ecological relationship and reciprocal stewardship
    actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c2614_a1_primary
  - c2614_a1_boundary
  - c2614_a1_adverse
  - c2614_a2_primary
  - c2614_a2_boundary
  - c2614_a2_adverse
  - c2614_a3_primary
  - c2614_a3_boundary
  - c2614_a3_adverse
  adverse_or_contradictory_indicators:
  - The Ecological relationship and reciprocal stewardship action exceeded consent, authority, privacy,
    qualification, role, burden, or safety boundaries.
  - The evidence contradicted the intended Ecological relationship and reciprocal stewardship criterion,
    depended on coercion or hidden private content, or could not distinguish the protocol from contextual
    change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Ecological relationship and reciprocal stewardship explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Ecological relationship and reciprocal
    stewardship context, action, role, pathway, and assessment epoch; it does not establish cross-context
    reliability.
  repetition_rule: Each Ecological relationship and reciprocal stewardship observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Ecological relationship and reciprocal stewardship rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Contributes to the health or understanding of a specific place over time.—not completion, confidence,
    conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Ecological relationship and reciprocal stewardship requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Ecological
    relationship and reciprocal stewardship evidence only under offline typed evaluation; protocol performance
    remains distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L03
  - L30
  - L31
  - L35
  minimum_evidence_before_state_update: No current-state update is permitted for this Ecological relationship
    and reciprocal stewardship draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Ecological relationship and reciprocal stewardship evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The define a rubric for ecological relationship and reciprocal stewardship action was attempted or
    explicitly deferred.
  - The build one ecological relationship and reciprocal stewardship artifact action was attempted or
    explicitly deferred.
  - The stress-test and revise the ecological relationship and reciprocal stewardship artifact action
    preserved a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2614_a1_primary
    - c2614_a2_primary
    - c2614_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Ecological relationship and reciprocal stewardship only when
    the initial context remained safe, the evidence criteria were usable, burden was acceptable, and a
    new context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Ecological relationship and reciprocal stewardship
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Ecological relationship and reciprocal stewardship require in this exact context,
      what remains outside my role or authority, and which scope sentence or evidence criterion will keep
      the practice honest?
    during: Which observable Ecological relationship and reciprocal stewardship criterion is present,
      absent, mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Contributes to the health or understanding of a specific place
      over time.', what contradiction or missing context matters most, and should this Ecological relationship
      and reciprocal stewardship design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Ecological relationship and reciprocal stewardship design only when
      the context and burden remain appropriate.
    adapt: Change the Ecological relationship and reciprocal stewardship medium, scope, support, timing,
      criteria, or context while preserving provenance and the narrower evidence claim.
    stop: Stop Ecological relationship and reciprocal stewardship when the practice becomes coercive,
      unsafe, privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Ecological relationship and reciprocal
      stewardship questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Ecological relationship and reciprocal stewardship criteria were observed
      with provenance and no adverse boundary signal in the selected context.
    mixed: Some Ecological relationship and reciprocal stewardship criteria were observed while burden,
      support, contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Ecological relationship and reciprocal stewardship
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Ecological relationship and reciprocal stewardship action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
