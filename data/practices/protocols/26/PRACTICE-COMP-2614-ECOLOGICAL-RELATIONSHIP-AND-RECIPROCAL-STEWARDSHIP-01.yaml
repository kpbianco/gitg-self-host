  - stable_id: PRACTICE-COMP-2614-ECOLOGICAL-RELATIONSHIP-AND-RECIPROCAL-STEWARDSHIP-01-A2
    sequence: 2
    title: Build one Ecological relationship and reciprocal stewardship artifact
    instructions: Create the smallest useful plan, checklist, diagram, record, or other artifact that
