  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Hobbies and lifelong interests; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Hobbies and lifelong interests; assistive technology, interpretation, a support person,
      and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Hobbies and lifelong interests to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Hobbies and lifelong interests opportunity is unavailable or inappropriate, use a fictional,
      historical, public, simulated, or planning-only equivalent and retain the narrower evidence classification.
  pause_conditions:
  - Pause Hobbies and lifelong interests when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Hobbies and lifelong interests practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Hobbies and lifelong interests situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Hobbies and lifelong interests actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c2603_a1_primary
  - c2603_a1_boundary
  - c2603_a1_adverse
  - c2603_a2_primary
  - c2603_a2_boundary
  - c2603_a2_adverse
  - c2603_a3_primary
  - c2603_a3_boundary
  - c2603_a3_adverse
  adverse_or_contradictory_indicators:
  - The Hobbies and lifelong interests action exceeded consent, authority, privacy, qualification, role,
    burden, or safety boundaries.
  - The evidence contradicted the intended Hobbies and lifelong interests criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Hobbies and lifelong interests explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Hobbies and lifelong interests context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Hobbies and lifelong interests observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Hobbies and lifelong interests rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Maintains at least one durable interest without needing monetization or prestige.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Hobbies and lifelong interests requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Hobbies
    and lifelong interests contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L15
  - L16
  - L34
  - L36
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Hobbies and lifelong interests evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The listen for a bounded hobbies and lifelong interests need action was attempted or explicitly deferred.
  - The agree and complete one hobbies and lifelong interests contribution action was attempted or explicitly
    deferred.
  - The review the hobbies and lifelong interests contribution with proportionate feedback action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2603_a1_primary
    - c2603_a2_primary
    - c2603_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Hobbies and lifelong interests only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Hobbies and lifelong interests across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Hobbies and lifelong interests require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Hobbies and lifelong interests criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Maintains at least one durable interest without needing monetization
      or prestige.', what contradiction or missing context matters most, and should this Hobbies and lifelong
      interests design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Hobbies and lifelong interests design only when the context and burden
      remain appropriate.
    adapt: Change the Hobbies and lifelong interests medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Hobbies and lifelong interests when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Hobbies and lifelong interests questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Hobbies and lifelong interests criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Hobbies and lifelong interests criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Hobbies and lifelong interests criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Hobbies and lifelong interests action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
