  - stable_id: PRACTICE-COMP-2107-SYSTEMS-AND-ORGANIZATIONAL-AWARENESS-01-A2
    sequence: 2
    title: Rehearse Systems and organizational awareness twice
    instructions: Perform two bounded attempts of the selected Systems and organizational awareness component
      under comparable safe conditions. Use self-review, a consensual observer, or a reviewed artifact;
      do not require public exposure, coerced feedback, licensed work, or high-consequence performance.
