        expected: true
  - stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01-A2
    sequence: 2
    title: Practice one Collaboration and team contribution communication act
    instructions: Use the prepared Collaboration and team contribution act once without covert testing,
      pressure, diagnosis, deception inference, or a demand for disclosure. Ask one direct clarification
      when appropriate and allow refusal, delay, indirect communication, language access, or another format.
    expected_time: 15-25 minutes
