        criteria:
        - c2109_a1_communication_act_specific
        - c2109_a1_consent_boundary_present
        - c2109_a1_power_checked
      - measurement_id: c2109_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2109_a1_adverse
        kind: boolean
        role: adverse
