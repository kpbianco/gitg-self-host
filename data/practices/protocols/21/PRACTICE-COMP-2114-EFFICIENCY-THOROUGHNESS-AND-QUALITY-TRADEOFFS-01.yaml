  - stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01-A2
    sequence: 2
    title: Rehearse Efficiency, thoroughness, and quality tradeoffs twice
    instructions: Perform two bounded attempts of the selected Efficiency, thoroughness, and quality tradeoffs
