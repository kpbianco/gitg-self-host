  - c2114_a2_adverse
  - c2114_a3_primary
  - c2114_a3_boundary
  - c2114_a3_adverse
  adverse_or_contradictory_indicators:
  - The Efficiency, thoroughness, and quality tradeoffs action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Efficiency, thoroughness, and quality tradeoffs criterion,
    depended on coercion or hidden private content, or could not distinguish the protocol from contextual
    change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Efficiency, thoroughness, and quality tradeoffs explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Efficiency, thoroughness, and quality
    tradeoffs context, action, role, pathway, and assessment epoch; it does not establish cross-context
    reliability.
  repetition_rule: Each Efficiency, thoroughness, and quality tradeoffs observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Efficiency, thoroughness, and quality tradeoffs rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Quality level is consciously matched to consequence rather than driven by haste or perfectionism.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Efficiency, thoroughness, and quality tradeoffs requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Efficiency,
    thoroughness, and quality tradeoffs contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L02
  - L10
  - L14
  - L32
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Efficiency, thoroughness, and quality tradeoffs evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The define observable criteria for efficiency, thoroughness, and quality tradeoffs action was attempted
    or explicitly deferred.
  - The rehearse efficiency, thoroughness, and quality tradeoffs twice action was attempted or explicitly
    deferred.
  - The use feedback for one efficiency, thoroughness, and quality tradeoffs retry action preserved a
    limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2114_a1_primary
    - c2114_a2_primary
    - c2114_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Efficiency, thoroughness, and quality tradeoffs only when the
    initial context remained safe, the evidence criteria were usable, burden was acceptable, and a new
    context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Efficiency, thoroughness, and quality tradeoffs
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Efficiency, thoroughness, and quality tradeoffs require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Efficiency, thoroughness, and quality tradeoffs criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Quality level is consciously matched to consequence rather
      than driven by haste or perfectionism.', what contradiction or missing context matters most, and
      should this Efficiency, thoroughness, and quality tradeoffs design be repeated, adapted, deferred,
      stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Efficiency, thoroughness, and quality tradeoffs design only when the
      context and burden remain appropriate.
    adapt: Change the Efficiency, thoroughness, and quality tradeoffs medium, scope, support, timing,
      criteria, or context while preserving provenance and the narrower evidence claim.
    stop: Stop Efficiency, thoroughness, and quality tradeoffs when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Efficiency, thoroughness, and quality
      tradeoffs questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Efficiency, thoroughness, and quality tradeoffs criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Efficiency, thoroughness, and quality tradeoffs criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Efficiency, thoroughness, and quality tradeoffs
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Efficiency, thoroughness, and quality tradeoffs action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
