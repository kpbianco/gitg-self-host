  - stable_id: PRACTICE-COMP-1010-TEACHING-AND-EXPLANATION-01-A3
    sequence: 3
    title: Review Teaching and explanation without scoring the person
    instructions: 'Review only the observable interaction and its boundaries. Do not infer motives or
