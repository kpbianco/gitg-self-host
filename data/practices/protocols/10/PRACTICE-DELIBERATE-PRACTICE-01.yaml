meaning_and_fit:
  purpose: Isolate one observable weak component of a safe low-stakes skill, make a bounded baseline attempt,
    apply criterion-based feedback, and retry once under comparable conditions.
  why_recommended: The selected competency concerns structured work on a weak component through feedback
    and repetition rather than equating time spent with improvement.
  claims:
  - statement: Practice designed around a specific component, informative feedback, and another attempt
      is a reasonable basis for this bounded skill-rehearsal protocol.
    classification: empirical_finding
    source_ids:
    - SRC-M6D-DELIBERATE-PRACTICE
    limitations: Findings about deliberate practice vary by domain and do not show that this protocol
      guarantees improvement, expertise, transfer, or equal access to coaching and time.
  - statement: Deliberate practice is not a complete explanation of expert performance and should not
      be represented as sufficient, universal, or independent of opportunity and domain conditions.
    classification: empirical_finding
    source_ids:
    - SRC-M6D-DELIBERATE-PRACTICE-LIMITS
    limitations: This scope limit does not calibrate the protocol or determine an appropriate training
      dose for any specific skill.
  applicability_question: Is there one safe, lawful, low-stakes skill with a component that can be observed
    in two short comparable attempts without physical danger, professional stakes, public exposure, or
    coerced feedback?
  not_applicable_behavior: Mark not applicable or defer without penalty when the skill cannot be isolated
    or practiced safely and lawfully; ordinary novice performance and access needs do not imply deficit.
  readiness_considerations: The participant must choose the skill, component, difficulty, feedback method,
    and stop point, with enough familiarity to recognize a low-consequence rehearsal.
  opportunity_considerations: Requires two 5-to-15-minute comparable attempts and one feedback pass within
    14 days; real-world high-stakes performance is not required.
  prerequisites:
  - One user-chosen safe, lawful, low-stakes skill component with two to four observable criteria.
  - A private self-review, automated non-sensitive indicator, model comparison, or freely consented reviewer
    method.
  dependencies: []
  safe_alternatives:
  - Use a simulation, synthetic input, slowed rehearsal, smaller component, or self-review checklist.
  - Defer until an accessible and non-coercive feedback method is available.
  role_conditions:
  - Employment, licensure, coaching, education, and apprenticeship rules take precedence; this protocol
    must not authorize work beyond competence or supervision.
  pathway_conditions:
  - Assistive technology, adapted technique, rest, alternative modalities, models, prompts, and guided
    support are legitimate practice conditions and not penalties.
  worldview_conditions:
  - The practice does not rank talent, intelligence, productivity, professional worth, or moral character
    and does not require competitive comparison.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 14
  cadence: Define one component, attempt it once, review against fixed criteria, then retry once at comparable
    or reduced difficulty.
  setup: Choose a low-stakes component such as one keyboard shortcut sequence, a short pronunciation contrast
    in a language already being learned, one spreadsheet formula on synthetic data, or one craft motion
    using safe materials. Define two to four observable criteria before attempting.
  privacy_and_boundaries: Use synthetic or non-sensitive material. Evidence stores only criterion IDs,
    bounded indicators, and minimal provenance—not recordings, artifact contents, prose, observer identity,
    student or client data, or workplace material. Feedback may be self-generated and never requires another
    person, public posting, humiliation, abusive instruction, or unlicensed practice.
  expected_burden: About 45–60 minutes across design, two attempts, feedback, and review.
  action_count_rationale: null
  foreseeable_misuse:
  - Escalating difficulty through pain, danger, exhaustion, humiliation, or unauthorized professional
    work.
  - Treating one improved attempt, a coach's authority, or time spent as proof of talent, mastery, broad
    transfer, or worth.
  exclusions:
  - Physical danger, clinical rehabilitation, licensed or regulated work, emergency response, weapons,
    driving, hazardous equipment, abusive instruction, and high-consequence performance.
  - Skills involving sensitive people, protected data, public evaluation, or feedback that cannot be freely
    refused.
  actions:
  - stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A1
    sequence: 1
    title: Define the weak component and fixed criteria
    instructions: Select one observable component and write two to four allowlisted criterion labels for
      a competent attempt. Choose a safe attempt length and difficulty that permits error without consequence.
      Record the feedback method and privacy boundary, not skill content or personal narrative.
    expected_time: 15 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DELIBERATE-PRACTICE-01
      action_stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A1
      competency_stable_id: '10.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 45
      competency_measurement_ids:
      - component_plan_criteria
      transfer_disposition: context_bound
      measurements:
      - measurement_id: component_plan_criteria
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_component_named
        - criteria_fixed_before_attempt
        - safe_difficulty_selected
        - feedback_method_selected
        - privacy_boundary_selected
      - measurement_id: unsafe_component_selected
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A2
    sequence: 2
    title: Make one bounded baseline attempt
    instructions: Attempt only the selected component for the planned interval using synthetic or non-sensitive
      material. Mark which predeclared criteria were observed and end at the time or safety boundary.
      Do not increase difficulty mid-attempt or interpret error count as personal worth.
    expected_time: 10 minutes
    due_within_days: 6
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DELIBERATE-PRACTICE-01
      action_stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A2
      competency_stable_id: '10.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 45
      competency_measurement_ids:
      - baseline_component_criteria
      transfer_disposition: context_bound
      measurements:
      - measurement_id: baseline_component_criteria
        kind: bounded_frequency
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        direction: at_least
        minimum: '0'
        target: '0.5'
        maximum: '1'
      - measurement_id: baseline_attempt_duration
        kind: duration
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        direction: at_most
        minimum: '0'
        target: '15'
        maximum: '20'
        unit: minutes
      - measurement_id: baseline_safety_boundary_breached
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A3
    sequence: 3
    title: Select one feedback correction
    instructions: Compare the baseline indicators with the criteria using the chosen private feedback
      method. Select exactly one missed or unstable criterion and one concrete adjustment for the retry.
      If another person offers feedback, participation must be voluntary and evidence must omit their
      identity and words.
    expected_time: 10 minutes
    due_within_days: 9
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DELIBERATE-PRACTICE-01
      action_stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A3
      competency_stable_id: '10.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 45
      competency_measurement_ids:
      - feedback_correction_criteria
      transfer_disposition: context_bound
      measurements:
      - measurement_id: feedback_correction_criteria
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - fixed_criteria_used
        - one_component_selected
        - one_adjustment_selected
        - retry_condition_defined
      - measurement_id: feedback_consent_and_privacy
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - self_review_or_consent_confirmed
        - no_observer_identity
        - no_feedback_narrative
        - no_public_artifact
      - measurement_id: abusive_or_coerced_feedback
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A4
    sequence: 4
    title: Retry the component and compare
    instructions: Repeat the same component once with the selected adjustment at comparable or lower safe
      difficulty. Mark the same criteria and compare the two bounded attempts as improved, unchanged,
      mixed, worse, or not comparable. Preserve evidence of no improvement or harm and do not add unplanned
      repetitions.
    expected_time: 15 minutes
    due_within_days: 14
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DELIBERATE-PRACTICE-01
      action_stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A4
      competency_stable_id: '10.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 45
      competency_measurement_ids:
      - retry_component_criteria
      - correction_applied
      transfer_disposition: context_bound
      measurements:
      - measurement_id: retry_component_criteria
        kind: bounded_frequency
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        direction: at_least
        minimum: '0'
        target: '0.5'
        maximum: '1'
      - measurement_id: correction_applied
        kind: boolean
        role: primary
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: retry_comparability
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - same_component
        - same_criteria
        - comparable_or_lower_difficulty
        - result_category_recorded
      - measurement_id: retry_harm_or_overpractice
