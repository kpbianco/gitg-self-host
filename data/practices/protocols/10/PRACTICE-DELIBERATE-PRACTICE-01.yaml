        expected: true
  adaptations:
    low_resource:
    - Use a self-review checklist, freely available model, synthetic input, and two short attempts; paid
      coaching or specialized equipment is not required.
    accessibility:
    - Reduce pace, repetition, sensory load, movement range, or component size; use assistive technology,
      rest, alternative modalities, and guided support while preserving comparable criteria.
    cultural_context:
    - Choose a skill and feedback style that respects the participant's community, role, learning tradition,
      consent norms, and authority without presuming competitive individual performance.
    resource_variants:
    - If comparable feedback is unavailable, complete the plan and baseline as inconclusive and defer
      the retry rather than inventing feedback.
  pause_conditions:
  - Pause for pain, distress, fatigue, access barriers, unsafe equipment, unclear authorization, abusive
    instruction, or inability to keep attempts low consequence.
  stop_conditions:
  - Stop if practice creates physical danger, clinical or licensed-work risk, coercion, humiliation, public
    exposure, protected-data use, or escalating repetition beyond the planned boundary.
  escalation_conditions:
  - Escalate abusive instruction, unsafe training demands, safeguarding concerns, or unauthorized professional
    expectations through an appropriate support or organizational channel.
  professional_referral_conditions:
  - Use appropriately qualified instruction, clinical rehabilitation, supervision, or certification when
    the skill domain requires it; this protocol cannot authorize or replace that support.
evidence_and_scoring:
  accepted_evidence_types:
  - component-plan criteria artifact
  - bounded scenario or performance criteria
  - privacy-minimized feedback-and-retry criteria
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - component_plan_criteria
  - unsafe_component_selected
  - baseline_component_criteria
  - baseline_attempt_duration
  - baseline_safety_boundary_breached
  - feedback_correction_criteria
  - feedback_consent_and_privacy
  - abusive_or_coerced_feedback
  - retry_component_criteria
  - correction_applied
  - retry_comparability
  - retry_harm_or_overpractice
  adverse_or_contradictory_indicators:
  - Practice involved danger, pain escalation, unauthorized professional work, protected data, coercion,
    humiliation, or abusive instruction.
  - The feedback criteria changed after the baseline or the retry used a non-comparable task while claiming
    improvement.
  - Practice continued beyond the planned boundary or treated a worse result as a demand for more repetition.
  independence_rule: Self-review, planning aids, models, guided instruction, and voluntary feedback are
    recorded as support conditions, not hidden verification or a measure of worth.
  context_transfer_rule: Evidence concerns one component, criterion set, difficulty, and attempt pair;
    it cannot establish broad skill, expertise, or transfer.
  repetition_rule: The baseline and retry retain distinct immutable origins; further repetitions use explicit
    multipliers and duplicate origins fail closed.
  recency_rule: Observations older than the explicit 45-day bound are stale; no long-term retention or
    improvement is inferred.
  performance_rubric: Performance concerns predeclared criteria, a bounded baseline, one criterion-based
    correction, and one comparable retry—not time spent, effort, talent, or output volume.
  evidence_quality_rubric: Quality requires fixed criteria, explicit provenance, safe attempt bounds,
    and comparable conditions; recordings, prose, artifact content, and observer identity are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated plan, attempt, correction, and retry measurements may form context-bound
    direct competency shadow evidence distinct from protocol performance.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L15
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unsafe, non-comparable, stale, adverse, duplicate, cross-epoch, unattempted, unknown, not-observed,
    not-applicable, deferred, or inconclusive evidence.
  - Withhold feedback narrative, recordings, artifact contents, observer identity, public performance,
    and any result from an excluded domain.
completion_and_review:
  completion_criteria:
  - One safe component and fixed criteria were defined.
  - One bounded baseline and one feedback selection were completed.
  - One comparable retry was attempted with unchanged criteria; a safe deferral closes the protocol without
    claiming completion.
  completion_rules:
    minimum_completed: 3
    substantive_markers:
    - component_plan_criteria
    - baseline_component_criteria
    - feedback_correction_criteria
    - retry_component_criteria
    marker_mode: all
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat only when the same safety boundaries hold and the participant can identify
    a specific next criterion without increasing consequences.
  transfer_limit: Two attempts cannot establish retained improvement, broad skill, expertise, or performance
    in a real high-stakes setting.
  reflection:
    before: Which single component and fixed criteria can be practiced safely without private material
      or real-world consequence?
    during: Which one criterion was unstable, what feedback method was used, and was participation freely
      chosen?
    after: Did the same criterion change on a comparable retry, remain unchanged, worsen, or remain unknown?
  review_guidance:
    repeat: Repeat the same safe component only when another bounded attempt adds useful evidence.
    adapt: Lower difficulty, shrink the component, change modality, add access support, or use a private
      self-review.
    stop: Stop for danger, pain, coercion, humiliation, protected information, scope drift, or unplanned
      overpractice.
    escalate: Use qualified instruction or support when domain safety, rehabilitation, licensing, or supervision
      matters.
  evidence_examples:
    supportive: Fixed criteria identified one weak component, one correction was applied, and the comparable
      retry met more of the same criteria.
    mixed: The correction improved one criterion while another was unchanged or less stable.
    contradictory: The retry met fewer fixed criteria, the correction was not applied, or practice exceeded
      a safe boundary.
    inconclusive: The attempts differed materially, feedback was unavailable, or the observations were
      unknown, deferred, or not observed.
presentation:
  setup_copy:
    context_heading: Isolate one safe low-stakes skill component.
    boundary_heading: Feedback is voluntary; no public artifact or observer identity is required.
    timing_hint: Plan two short comparable attempts within 14 days.
    applicability_heading: One component with two to four observable criteria
  check_in_labels:
    component_plan_criteria: Component plan meets the fixed criteria
    unsafe_component_selected: An unsafe or excluded component was selected
    baseline_component_criteria: Baseline criteria observed
    baseline_attempt_duration: Baseline attempt duration
    baseline_safety_boundary_breached: The baseline attempt breached a safety boundary
    feedback_correction_criteria: One correction selected
    feedback_consent_and_privacy: Feedback consent and privacy criteria present
    abusive_or_coerced_feedback: Feedback was abusive or coerced
    retry_component_criteria: Retry criteria observed
    correction_applied: The selected correction was applied
    retry_comparability: Retry comparability criteria present
    retry_harm_or_overpractice: The retry caused harm or exceeded its practice boundary
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record checks whether a weak component, feedback correction,
    and comparable retry were completed without storing performance contents or identities.
  display_order: 8
