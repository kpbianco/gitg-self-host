  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: What exactly are you loyal to, and which method would betray that commitment?
  transfer_limit: An ordinary reporting case tests loyalty and dissent. Whistleblowing, employment disputes
    and serious wrongdoing need additional local and professional guidance.
  reflection:
    before: 'What would count as doing this honestly? Goal: Distinguish legitimate loyalty from complicity
      and express a principled disagreement constructively.'
    during: Which checks have actually been observed? The misleading wording was rejected but no constructive
      alternative was offered.
    after: What exactly are you loyal to, and which method would betray that commitment?
  review_guidance:
