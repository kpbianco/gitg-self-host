  - stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01-A2
    sequence: 2
    title: Try the Loyalty and principled dissent behavior in three windows
    instructions: Attempt the same small Loyalty and principled dissent behavior in up to three naturally
      occurring windows. Record attempt, defer, interruption, support used, and adverse effect separately;
