  adverse_or_contradictory_indicators:
  - Loyalty was defined as endorsing whatever the group requested, regardless of truth.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Loyalty and principled dissent explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Loyalty and principled dissent context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Loyalty and principled dissent observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Loyalty and principled dissent rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Separate the group''s good from its proposed method. Observed checks:
    A legitimate shared aim is recognized; The problematic method is identified precisely; Responsibility
    follows the person''s actual role. Action 2: Draft dissent with a usable alternative. Observed checks:
    The objection states a concrete principle; A truthful alternative serves the shared aim; Unsupported
    accusations are excluded. Action 3: Define what you will and will not endorse. Observed checks: Acceptance
    and resistance are both rehearsed; Endorsement has an explicit boundary; Any next channel is proportionate
    to the case.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The person praised honesty without specifying what
    they would refuse to approve.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Loyalty
    and principled dissent contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
