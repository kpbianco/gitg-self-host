meaning_and_fit:
  purpose: Distinguish legitimate loyalty from complicity and express a principled disagreement constructively.
  why_recommended: Distinguish legitimate loyalty from complicity and express a principled disagreement
    constructively.
  claims:
  - statement: Distinguish legitimate loyalty from complicity and express a principled disagreement constructively.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Loyalty and principled dissent practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Loyalty and principled dissent as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a written hypothetical response. Real dissent should account for safety
    and power; the exercise does not require exposing wrongdoing publicly.
  opportunity_considerations: 'Use this fictional case: a club wants to describe an event as fully attended
    although several seats were empty. You value the club and have been asked to help write its summary.'
  prerequisites:
  - 'Use this fictional case: a club wants to describe an event as fully attended although several seats
    were empty. You value the club and have been asked to help write its summary.'
  dependencies: []
  safe_alternatives:
  - Use a written hypothetical response. Real dissent should account for safety and power; the exercise
    does not require exposing wrongdoing publicly.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Loyalty and principled dissent differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Loyalty and principled dissent
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: a club wants to describe an event as fully attended although several
    seats were empty. You value the club and have been asked to help write its summary. Goal: Distinguish
    legitimate loyalty from complicity and express a principled disagreement constructively. Scope: An
    ordinary reporting case tests loyalty and dissent. Whistleblowing, employment disputes and serious
    wrongdoing need additional local and professional guidance. Time and effort: About 25 minutes to analyze
    the obligation and rehearse a truthful alternative. Adaptation: Use a written hypothetical response.
    Real dissent should account for safety and power; the exercise does not require exposing wrongdoing
    publicly. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written hypothetical response. Real dissent should account for safety and
    power; the exercise does not require exposing wrongdoing publicly.
  expected_burden: About 25 minutes to analyze the obligation and rehearse a truthful alternative.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Loyalty and principled dissent protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Loyalty and principled dissent action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written
    hypothetical response. Real dissent should account for safety and power; the exercise does not require
    exposing wrongdoing publicly.
  actions:
  - stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01-A1
    sequence: 1
    title: Separate the group's good from its proposed method
    instructions: 'Name the legitimate aim, such as encouraging future participation, and the misleading
      claim proposed to serve it. Identify who relies on the summary and what responsibility your role
      creates. Explain why supporting the group does not require endorsing every method it chooses.


      Observation checks: A legitimate shared aim is recognized; The problematic method is identified
      precisely; Responsibility follows the person''s actual role. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01
      action_stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01-A1
      competency_stable_id: '02.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0210_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0210_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_legitimate_shared_aim_is_recognized
        - the_problematic_method_is_identified_precisely
        - responsibility_follows_the_person_s_actual_role
      - measurement_id: c0210_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0210_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01-A2
    sequence: 2
    title: Draft dissent with a usable alternative
    instructions: 'Write a respectful objection that names the inaccurate wording and offers a truthful
      version, such as noting strong discussion without claiming full attendance. Explain how the alternative
      serves the shared aim. Avoid attacking motives you cannot know or presenting personal preference
      as a moral requirement.


      Observation checks: The objection states a concrete principle; A truthful alternative serves the
      shared aim; Unsupported accusations are excluded. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01
      action_stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01-A2
      competency_stable_id: '02.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0210_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0210_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_objection_states_a_concrete_principle
        - a_truthful_alternative_serves_the_shared_aim
        - unsupported_accusations_are_excluded
      - measurement_id: c0210_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0210_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01-A3
    sequence: 3
    title: Define what you will and will not endorse
    instructions: 'Rehearse two replies: the group accepts the correction, or it insists on the false
      wording. In the second case, state the contribution you can still offer and what you cannot approve
      or sign. Identify a proportionate next channel while acknowledging the limits and costs of your
      role.


      Observation checks: Acceptance and resistance are both rehearsed; Endorsement has an explicit boundary;
      Any next channel is proportionate to the case. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What exactly are you loyal to, and which method would betray that commitment?


      Examples: Supportive: The objection preserved the club''s legitimate aim while replacing its inaccurate
      attendance claim.


      Mixed: The misleading wording was rejected but no constructive alternative was offered.


      Contradictory: Loyalty was defined as endorsing whatever the group requested, regardless of truth.


      Inconclusive: The person praised honesty without specifying what they would refuse to approve.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01
      action_stable_id: PRACTICE-COMP-0210-LOYALTY-AND-PRINCIPLED-DISSENT-01-A3
      competency_stable_id: '02.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
