      Moral frameworks; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Compare four spoken explanations or use cards. The fictional case permits participation without
      revealing private beliefs or confronting a real authority.
    cultural_context:
    - Adapt the expression of Moral frameworks to direct or indirect communication, collective or individual
      decision structures, local norms, faith or secular commitments, and role obligations while preserving
      consent and dignity.
    resource_variants:
    - Compare four spoken explanations or use cards. The fictional case permits participation without
      revealing private beliefs or confronting a real authority.
  pause_conditions:
  - Pause Moral frameworks when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Moral frameworks practice for harm, coercion, retaliation risk, emergency conditions, unsafe
    exposure, worsening symptoms, protected information, legal or policy conflict, or pressure to exceed
    the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Moral frameworks situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
