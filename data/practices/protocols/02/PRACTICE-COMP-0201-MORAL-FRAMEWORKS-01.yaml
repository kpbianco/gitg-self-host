meaning_and_fit:
  purpose: Explain how different moral frameworks identify reasons, obligations and unresolved costs in
    one choice.
  why_recommended: Explain how different moral frameworks identify reasons, obligations and unresolved
    costs in one choice.
  claims:
  - statement: Explain how different moral frameworks identify reasons, obligations and unresolved costs
      in one choice.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Deontological approaches evaluate conduct through duties and moral norms rather than consequences
      alone.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-DEONTOLOGY
    limitations: Conceptual orientation only; does not settle competing duties or validate the product's
      shared-camera exercise.
  - statement: Virtue ethics attends to character and practical judgment; Aristotle's account distinguishes
      appropriate conduct from deficiency and excess.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-VIRTUE-ETHICS
    limitations: One normative tradition, not a universal character metric or empirical proof that the
      product's courage rehearsal develops virtue.
  - statement: Care ethics gives moral attention to particular relationships, needs and circumstances,
      including responsibilities that abstract rules alone may overlook.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-CARE-ETHICS
    limitations: Conceptual support only. No claim that caring roles or ethical capacities are determined
      by gender; no effectiveness claim for the product's care-burden exercise.
  - statement: Consequentialist reasoning evaluates consequences for those affected; considering only
      the decision maker's own benefit is not an adequate account of that approach.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-CONSEQUENTIALISM
    limitations: One family of normative positions, not the uniquely correct morality, a numerical wellbeing
      measure, or evidence of the effectiveness of this exercise.
  applicability_question: Does a voluntary, bounded Moral frameworks practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Moral frameworks as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Compare four spoken explanations or use cards. The fictional case permits
    participation without revealing private beliefs or confronting a real authority.
  opportunity_considerations: 'Use this case: a shared camera was promised to a friend, but a community
    group now requests it for a useful event at the same time. No emergency or uniquely correct answer
    is assumed.'
  prerequisites:
  - 'Use this case: a shared camera was promised to a friend, but a community group now requests it for
    a useful event at the same time. No emergency or uniquely correct answer is assumed.'
  dependencies: []
  safe_alternatives:
  - Compare four spoken explanations or use cards. The fictional case permits participation without revealing
    private beliefs or confronting a real authority.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Moral frameworks differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Moral frameworks as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this case: a shared camera was promised to a friend, but a community group now requests
    it for a useful event at the same time. No emergency or uniquely correct answer is assumed. Goal:
    Explain how different moral frameworks identify reasons, obligations and unresolved costs in one choice.
    Scope: One case introduces several moral frameworks. Religious ethics, natural law, rights, justice
    and particularism require further study; the comparison does not make every framework interchangeable.
    Time and effort: About 30–45 minutes for the comparison and one revision; no live dispute is required.
    Adaptation: Compare four spoken explanations or use cards. The fictional case permits participation
    without revealing private beliefs or confronting a real authority. Keep personal working notes outside
    the check-in; record only the listed observations.


    Reference support:

    Introduction to Philosophy, 9.3 Deontology: https://openstax.org/books/introduction-philosophy/pages/9-3-deontology

    Introduction to Philosophy, 9.4 Virtue Ethics: https://openstax.org/books/introduction-philosophy/pages/9-4-virtue-ethics

    Introduction to Philosophy, 9.6 Feminist Theories of Ethics: https://openstax.org/books/introduction-philosophy/pages/9-6-feminist-theories-of-ethics

    Introduction to Philosophy, 9.2 Consequentialism: https://openstax.org/books/introduction-philosophy/pages/9-2-consequentialism'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Compare four spoken explanations or use cards. The fictional case permits participation
    without revealing private beliefs or confronting a real authority.
  expected_burden: About 30–45 minutes for the comparison and one revision; no live dispute is required.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Moral frameworks protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Moral frameworks action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Compare four
    spoken explanations or use cards. The fictional case permits participation without revealing private
    beliefs or confronting a real authority.
  actions:
  - stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01-A1
    sequence: 1
    title: Compare four kinds of moral reason
    instructions: 'Write the strongest reason each lens offers: virtue asks what a practically wise, reliable
      person would do; duty asks what the promise requires; consequences consider benefits and harms for
      everyone affected; care attends to the relationships and dependencies involved. Give each a possible
      recommendation and an objection rather than assuming all reach the same answer.


      Observation checks: Four lenses supply distinct reasons; All affected parties enter the comparison;
      Each recommendation faces a serious objection. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01
      action_stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01-A1
      competency_stable_id: '02.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0201_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0201_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - four_lenses_supply_distinct_reasons
        - all_affected_parties_enter_the_comparison
        - each_recommendation_faces_a_serious_objection
      - measurement_id: c0201_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0201_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01-A2
    sequence: 2
    title: Test ownership and changed circumstances
    instructions: 'Ask who has authority over the camera and what legitimate claims each party has. Change
      one fact: the friend needs it for an irreplaceable family occasion, or the group has another camera
      available. Explain which reasons change and which persist. Do not add invented facts merely to make
      your preferred option win.


      Observation checks: Authority and legitimate claims are considered; One changed fact is tested consistently;
      Stable and changing reasons are distinguished. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01
      action_stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01-A2
      competency_stable_id: '02.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0201_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0201_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - authority_and_legitimate_claims_are_considered
        - one_changed_fact_is_tested_consistently
        - stable_and_changing_reasons_are_distinguished
      - measurement_id: c0201_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0201_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01-A3
    sequence: 3
    title: Defend a decision without erasing its cost
    instructions: 'Choose lend, keep the promise, seek an agreed rearrangement, or another feasible option.
      State your decisive reason, strongest remaining objection and who bears the cost. Draft an honest
      explanation to the affected parties and identify the further information that could change your
      judgment.


      Observation checks: The decision has an explicit moral reason; A remaining cost is acknowledged;
      A revision condition is identified. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which framework exposed a reason you initially missed, and where does your decision
      remain contestable?


      Examples: Supportive: The decision preserved the promise while explaining the lost community benefit
      and a possible agreed alternative.


      Mixed: Four frameworks were named but their reasons were reduced to personal preference.


      Contradictory: Only the decision maker''s convenience counted, or missing facts were invented to
      dismiss an objection.


      Inconclusive: An answer was chosen without identifying obligations, consequences or relationships.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01
      action_stable_id: PRACTICE-COMP-0201-MORAL-FRAMEWORKS-01-A3
      competency_stable_id: '02.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0201_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0201_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
