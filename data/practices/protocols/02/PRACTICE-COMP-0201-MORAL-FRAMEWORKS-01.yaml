  recency_rule: Generated Moral frameworks rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Compare four kinds of moral reason. Observed checks: Four lenses supply
    distinct reasons; All affected parties enter the comparison; Each recommendation faces a serious objection.
    Action 2: Test ownership and changed circumstances. Observed checks: Authority and legitimate claims
    are considered; One changed fact is tested consistently; Stable and changing reasons are distinguished.
    Action 3: Defend a decision without erasing its cost. Observed checks: The decision has an explicit
    moral reason; A remaining cost is acknowledged; A revision condition is identified.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. An answer was chosen without identifying obligations,
    consequences or relationships.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Moral
    frameworks contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
