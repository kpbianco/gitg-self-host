  - c0206_a3_adverse
  adverse_or_contradictory_indicators:
  - The criteria changed only when they disadvantaged the decision maker's friend.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Justice, fairness, and equal dignity explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Justice, fairness, and equal dignity context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Justice, fairness, and equal dignity observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Justice, fairness, and equal dignity rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: State relevant criteria before choosing people. Observed checks: Criteria
    are stated before the allocation; Relevant differences have explicit reasons; Personal connection
    is not an unexamined advantage. Action 2: Apply the rule and reverse the identities. Observed checks:
    The same rule is applied to everyone; Identity reversal is performed; An unsupported preference is
    detected or explicitly ruled out. Action 3: Revise and explain the remaining disadvantage. Observed
    checks: Any inconsistent allocation is corrected; Remaining disadvantage has an intelligible reason;
    A review or later-opportunity route is provided.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Fairness was asserted without a rule, allocation or
    identity reversal.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Justice,
    fairness, and equal dignity contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
