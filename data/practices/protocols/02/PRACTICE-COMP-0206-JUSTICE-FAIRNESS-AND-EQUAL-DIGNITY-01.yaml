meaning_and_fit:
  purpose: Apply comparable reasons across self, allies and less influential people while recognizing
    relevant differences in need.
  why_recommended: Apply comparable reasons across self, allies and less influential people while recognizing
    relevant differences in need.
  claims:
  - statement: Apply comparable reasons across self, allies and less influential people while recognizing
      relevant differences in need.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Justice, fairness, and equal dignity practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Justice, fairness, and equal dignity as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use tokens, spoken choices or a simple table. The case can remain fictional;
    do not collect sensitive characteristics to prove fairness.
  opportunity_considerations: Use a fictional allocation of three one-hour slots in a shared room among
    four people. One is a close friend, one is unfamiliar, and one has a genuine access constraint. No
    employment or legal selection decision is involved.
  prerequisites:
  - Use a fictional allocation of three one-hour slots in a shared room among four people. One is a close
    friend, one is unfamiliar, and one has a genuine access constraint. No employment or legal selection
    decision is involved.
  dependencies: []
  safe_alternatives:
  - Use tokens, spoken choices or a simple table. The case can remain fictional; do not collect sensitive
    characteristics to prove fairness.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Justice, fairness, and equal dignity differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Justice, fairness, and equal
    dignity as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional allocation of three one-hour slots in a shared room among four people. One is
    a close friend, one is unfamiliar, and one has a genuine access constraint. No employment or legal
    selection decision is involved. Goal: Apply comparable reasons across self, allies and less influential
    people while recognizing relevant differences in need. Scope: A small allocation tests consistency
    and equal dignity. It does not settle every theory of justice or prove the absence of bias across
    real institutions. Time and effort: About 25–35 minutes to specify, test and revise a resource rule.
    Adaptation: Use tokens, spoken choices or a simple table. The case can remain fictional; do not collect
    sensitive characteristics to prove fairness. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use tokens, spoken choices or a simple table. The case can remain fictional; do
    not collect sensitive characteristics to prove fairness.
  expected_burden: About 25–35 minutes to specify, test and revise a resource rule.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Justice, fairness, and equal dignity protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Justice, fairness, and equal dignity action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use tokens,
    spoken choices or a simple table. The case can remain fictional; do not collect sensitive characteristics
    to prove fairness.
  actions:
  - stable_id: PRACTICE-COMP-0206-JUSTICE-FAIRNESS-AND-EQUAL-DIGNITY-01-A1
    sequence: 1
    title: State relevant criteria before choosing people
    instructions: 'List legitimate criteria such as prior booking, urgency, access needs and fair rotation.
      Explain why friendship, status or your own convenience should or should not matter for this resource.
      State how an exception will be justified so equal treatment is not confused with ignoring relevant
      need.


      Observation checks: Criteria are stated before the allocation; Relevant differences have explicit
      reasons; Personal connection is not an unexamined advantage. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0206-JUSTICE-FAIRNESS-AND-EQUAL-DIGNITY-01
      action_stable_id: PRACTICE-COMP-0206-JUSTICE-FAIRNESS-AND-EQUAL-DIGNITY-01-A1
      competency_stable_id: '02.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0206_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0206_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - criteria_are_stated_before_the_allocation
        - relevant_differences_have_explicit_reasons
        - personal_connection_is_not_an_unexamined_advantage
      - measurement_id: c0206_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0206_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0206-JUSTICE-FAIRNESS-AND-EQUAL-DIGNITY-01-A2
    sequence: 2
    title: Apply the rule and reverse the identities
    instructions: 'Allocate the slots, then swap the friend and unfamiliar person''s names while keeping
      their circumstances unchanged. Check whether your answer changes. Next place yourself in the least
      favored position. Identify any preference that cannot be defended using the original criteria.


      Observation checks: The same rule is applied to everyone; Identity reversal is performed; An unsupported
      preference is detected or explicitly ruled out. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0206-JUSTICE-FAIRNESS-AND-EQUAL-DIGNITY-01
      action_stable_id: PRACTICE-COMP-0206-JUSTICE-FAIRNESS-AND-EQUAL-DIGNITY-01-A2
      competency_stable_id: '02.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0206_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0206_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_same_rule_is_applied_to_everyone
        - identity_reversal_is_performed
        - an_unsupported_preference_is_detected_or_explicitly_ruled_out
      - measurement_id: c0206_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0206_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0206-JUSTICE-FAIRNESS-AND-EQUAL-DIGNITY-01-A3
    sequence: 3
    title: Revise and explain the remaining disadvantage
    instructions: 'Correct a double standard, clarify a defensible exception and give an explanation someone
      denied a slot could understand. Include a fair way to request review or receive a later turn. Acknowledge
      scarcity instead of describing the losing person as less deserving of dignity.


      Observation checks: Any inconsistent allocation is corrected; Remaining disadvantage has an intelligible
      reason; A review or later-opportunity route is provided. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which part of your rule would you still endorse if you were the person who lost out?


      Examples: Supportive: A friendship preference was removed while an access-based exception was retained
      with a stated reason.


      Mixed: The allocation was consistent but gave no way to question mistaken information.


      Contradictory: The criteria changed only when they disadvantaged the decision maker''s friend.


      Inconclusive: Fairness was asserted without a rule, allocation or identity reversal.'
    expected_time: 15-25 minutes
    due_within_days: 10
