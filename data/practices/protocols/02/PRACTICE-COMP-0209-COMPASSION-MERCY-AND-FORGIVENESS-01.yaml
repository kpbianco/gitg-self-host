  - c0209_a3_adverse
  adverse_or_contradictory_indicators:
  - The Compassion, mercy, and forgiveness action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Compassion, mercy, and forgiveness criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Compassion, mercy, and forgiveness explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Compassion, mercy, and forgiveness context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Compassion, mercy, and forgiveness observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Compassion, mercy, and forgiveness rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can release vengeance or contempt without automatically restoring trust or access.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Compassion, mercy, and forgiveness requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Compassion,
    mercy, and forgiveness evidence only under offline typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L02
  - L24
  - L29
  minimum_evidence_before_state_update: No current-state update is permitted for this Compassion, mercy,
    and forgiveness draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
