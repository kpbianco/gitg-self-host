meaning_and_fit:
  purpose: Separate compassion and release of retaliation from automatic forgiveness, restored trust or
    renewed access.
  why_recommended: Separate compassion and release of retaliation from automatic forgiveness, restored
    trust or renewed access.
  claims:
  - statement: Separate compassion and release of retaliation from automatic forgiveness, restored trust
      or renewed access.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Compassion, mercy, and forgiveness practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Compassion, mercy, and forgiveness as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the fictional book case or a symbolic drawing. No contact, disclosure,
    absolution or restored relationship is required.
  opportunity_considerations: 'Use a manageable irritation or this fictional case: a borrowed book was
    returned damaged. Do not revisit abuse, trauma or a dangerous relationship. Contact with the other
    person is optional.'
  prerequisites:
  - 'Use a manageable irritation or this fictional case: a borrowed book was returned damaged. Do not
    revisit abuse, trauma or a dangerous relationship. Contact with the other person is optional.'
  dependencies: []
  safe_alternatives:
  - Use the fictional book case or a symbolic drawing. No contact, disclosure, absolution or restored
    relationship is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Compassion, mercy, and forgiveness differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Compassion, mercy, and forgiveness
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a manageable irritation or this fictional case: a borrowed book was returned damaged. Do
    not revisit abuse, trauma or a dangerous relationship. Contact with the other person is optional.
    Goal: Separate compassion and release of retaliation from automatic forgiveness, restored trust or
    renewed access. Scope: A minor wrong permits practice with humanity and accountability. This exercise
    does not require forgiveness or establish what reconciliation should mean after serious harm. Time
    and effort: About 20 minutes of private reflection and one optional low-stakes response. Adaptation:
    Use the fictional book case or a symbolic drawing. No contact, disclosure, absolution or restored
    relationship is required. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional book case or a symbolic drawing. No contact, disclosure, absolution
    or restored relationship is required.
  expected_burden: About 20 minutes of private reflection and one optional low-stakes response.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Compassion, mercy, and forgiveness protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Compassion, mercy, and forgiveness action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    book case or a symbolic drawing. No contact, disclosure, absolution or restored relationship is required.
  actions:
  - stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01-A1
    sequence: 1
    title: Describe the wrong without reducing the person to it
    instructions: 'State the act, its effect and what you know about intention. Mark unknown intention
      as unknown. Name the anger or disappointment without treating it as an instruction to retaliate.
      Describe the other person''s humanity without supplying excuses that cancel the actual harm.


      Observation checks: Act and impact are specific; Unknown intention remains unknown; Humanity and
      accountability are held together. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01
      action_stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01-A1
      competency_stable_id: '02.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0209_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0209_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - act_and_impact_are_specific
        - unknown_intention_remains_unknown
        - humanity_and_accountability_are_held_together
      - measurement_id: c0209_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0209_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01-A2
    sequence: 2
    title: Choose repair and access separately
    instructions: 'For the damaged book, compare a repair request, a future lending limit and the decision
      not to pursue revenge. Explain what each choice does. Forgiving, if freely chosen, need not restore
      lending privileges; requesting repair need not involve humiliation or repeated demands for an emotional
      response.


      Observation checks: Repair and access are separate decisions; Retaliation is distinguished from
      accountability; Forgiveness remains a voluntary possibility. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01
      action_stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01-A2
      competency_stable_id: '02.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0209_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0209_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - repair_and_access_are_separate_decisions
        - retaliation_is_distinguished_from_accountability
        - forgiveness_remains_a_voluntary_possibility
      - measurement_id: c0209_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0209_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01-A3
    sequence: 3
    title: Make or rehearse the humane boundary
    instructions: 'Write or deliver one proportionate response: describe the damage, request an agreed
      repair if appropriate and state a future limit you control. Review whether the response preserved
      truth without contempt. If you keep it private, record that you practiced judgment and wording rather
      than a real reconciliation.


      Observation checks: The response preserves the fact of harm; Any limit concerns the speaker''s own
      choices; Private rehearsal is not claimed as reconciliation. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What can you release without denying what happened or surrendering a necessary limit?


      Examples: Supportive: A reasonable repair request was paired with a lending boundary and no demand
      for public shame.


      Mixed: Retaliation was avoided but the proposed boundary was still vague.


      Contradictory: Compassion was used to pressure someone into restored access or to deny the harm.


      Inconclusive: Forgiveness was declared without distinguishing trust, access, repair or intention.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01
      action_stable_id: PRACTICE-COMP-0209-COMPASSION-MERCY-AND-FORGIVENESS-01-A3
      competency_stable_id: '02.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
