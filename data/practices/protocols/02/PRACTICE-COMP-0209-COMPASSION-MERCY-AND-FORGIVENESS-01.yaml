  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The define one small compassion, mercy, and forgiveness behavior action was attempted or explicitly
    deferred.
  - The try the compassion, mercy, and forgiveness behavior in three windows action was attempted or explicitly
    deferred.
  - The review the compassion, mercy, and forgiveness repetition pattern action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0209_a1_primary
    - c0209_a2_primary
    - c0209_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Compassion, mercy, and forgiveness only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Compassion, mercy, and forgiveness across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Compassion, mercy, and forgiveness require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Compassion, mercy, and forgiveness criterion is present, absent, mixed, or
      unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can release vengeance or contempt without automatically restoring
      trust or access.', what contradiction or missing context matters most, and should this Compassion,
      mercy, and forgiveness design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Compassion, mercy, and forgiveness design only when the context and
      burden remain appropriate.
    adapt: Change the Compassion, mercy, and forgiveness medium, scope, support, timing, criteria, or
      context while preserving provenance and the narrower evidence claim.
    stop: Stop Compassion, mercy, and forgiveness when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Compassion, mercy, and forgiveness questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Compassion, mercy, and forgiveness criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Compassion, mercy, and forgiveness criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Compassion, mercy, and forgiveness criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Compassion, mercy, and forgiveness action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
