  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Compassion, mercy, and forgiveness; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use the fictional book case or a symbolic drawing. No contact, disclosure, absolution or restored
      relationship is required.
    cultural_context:
    - Adapt the expression of Compassion, mercy, and forgiveness to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use the fictional book case or a symbolic drawing. No contact, disclosure, absolution or restored
      relationship is required.
  pause_conditions:
  - Pause Compassion, mercy, and forgiveness when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Compassion, mercy, and forgiveness practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Compassion, mercy, and forgiveness situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
