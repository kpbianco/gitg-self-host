  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Responsibility, apology, and restitution explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Responsibility, apology, and restitution
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Responsibility, apology, and restitution observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Responsibility, apology, and restitution rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Describe your responsibility and its effect. Observed checks: The action
    or omission is owned specifically; Foreseeable impact is acknowledged; Explanation does not transfer
    responsibility. Action 2: Give an apology with a repair the recipient can assess. Observed checks:
    The apology names the actual failure; The proposed repair is feasible and relevant; The recipient
    is free to respond without granting forgiveness. Action 3: Complete the repair and prevent a repeat.
    Observed checks: Repair or its genuine limit is recorded; A contributing behavior is changed; Practical
    closure is separated from forgiveness.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Regret was expressed without identifying an action,
    impact or repair.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Responsibility,
    apology, and restitution contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
