meaning_and_fit:
  purpose: Own an action and its impact, propose repair, and follow through without demanding forgiveness.
  why_recommended: Own an action and its impact, propose repair, and follow through without demanding
    forgiveness.
  claims:
  - statement: Own an action and its impact, propose repair, and follow through without demanding forgiveness.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Responsibility, apology, and restitution practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Responsibility, apology, and restitution as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use written communication, an agreed intermediary or a clearly labeled rehearsal.
    Respect a request for no further contact.
  opportunity_considerations: Choose a minor failure within your responsibility, such as returning a borrowed
    item late. Use a fictional case if contact is unwelcome or unsafe; do not use this task to reopen
    a prohibited or harmful relationship.
  prerequisites:
  - Choose a minor failure within your responsibility, such as returning a borrowed item late. Use a fictional
    case if contact is unwelcome or unsafe; do not use this task to reopen a prohibited or harmful relationship.
  dependencies: []
  safe_alternatives:
  - Use written communication, an agreed intermediary or a clearly labeled rehearsal. Respect a request
    for no further contact.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Responsibility, apology, and restitution differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Responsibility, apology, and
    restitution as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a minor failure within your responsibility, such as returning a borrowed item late. Use
    a fictional case if contact is unwelcome or unsafe; do not use this task to reopen a prohibited or
    harmful relationship. Goal: Own an action and its impact, propose repair, and follow through without
    demanding forgiveness. Scope: A small repair practices responsibility, apology and restitution. Serious
    harms may require processes and support beyond a direct personal apology. Time and effort: About 15
    minutes to prepare, a short permitted exchange, and the agreed repair''s actual time. Adaptation:
    Use written communication, an agreed intermediary or a clearly labeled rehearsal. Respect a request
    for no further contact. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use written communication, an agreed intermediary or a clearly labeled rehearsal.
    Respect a request for no further contact.
  expected_burden: About 15 minutes to prepare, a short permitted exchange, and the agreed repair's actual
    time.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Responsibility, apology, and restitution protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Responsibility, apology, and restitution action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use written
    communication, an agreed intermediary or a clearly labeled rehearsal. Respect a request for no further
    contact.
  actions:
  - stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01-A1
    sequence: 1
    title: Describe your responsibility and its effect
    instructions: 'Write what you did or failed to do, what you reasonably knew at the time and what inconvenience
      or harm followed. Separate an explanation from an excuse. For the late item, acknowledge the missed
      return and the owner''s lost use without assuming how they must feel.


      Observation checks: The action or omission is owned specifically; Foreseeable impact is acknowledged;
      Explanation does not transfer responsibility. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01
      action_stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01-A1
      competency_stable_id: '02.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0211_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0211_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_action_or_omission_is_owned_specifically
        - foreseeable_impact_is_acknowledged
        - explanation_does_not_transfer_responsibility
      - measurement_id: c0211_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0211_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01-A2
    sequence: 2
    title: Give an apology with a repair the recipient can assess
    instructions: 'State the action, acknowledge the effect, express regret and offer a feasible repair,
      such as returning the item at a time convenient to its owner. Ask whether another proportionate
      remedy would help. Do not add a request for reassurance, absolution or immediate restored trust.


      Observation checks: The apology names the actual failure; The proposed repair is feasible and relevant;
      The recipient is free to respond without granting forgiveness. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01
      action_stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01-A2
      competency_stable_id: '02.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0211_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0211_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_apology_names_the_actual_failure
        - the_proposed_repair_is_feasible_and_relevant
        - the_recipient_is_free_to_respond_without_granting_forgiveness
      - measurement_id: c0211_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0211_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01-A3
    sequence: 3
    title: Complete the repair and prevent a repeat
    instructions: 'Do the agreed repair and confirm practical completion without repeatedly pursuing an
      emotional response. Change one contributing habit, such as setting an earlier return reminder or
      declining loans you cannot manage. If repair is refused or impossible, record the limit and what
      responsibility remains.


      Observation checks: Repair or its genuine limit is recorded; A contributing behavior is changed;
      Practical closure is separated from forgiveness. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: What became materially better for the affected person, and what responsibility remains
      yours?


      Examples: Supportive: The item was returned, the inconvenience acknowledged and a reminder changed
      without demanding forgiveness.


      Mixed: The apology was specific but the promised practical repair has not yet happened.


      Contradictory: The apology required the recipient to provide comfort or accept renewed contact.


      Inconclusive: Regret was expressed without identifying an action, impact or repair.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01
      action_stable_id: PRACTICE-COMP-0211-RESPONSIBILITY-APOLOGY-AND-RESTITUTION-01-A3
      competency_stable_id: '02.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
