    without granting forgiveness.'
  - 'Action 3: Complete the repair and prevent a repeat. Observed checks: Repair or its genuine limit
    is recorded; A contributing behavior is changed; Practical closure is separated from forgiveness.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
