meaning_and_fit:
  purpose: Distinguish intention, control, negligence, benefit and residual responsibility when outcomes
    are partly outside anyone's control.
  why_recommended: Distinguish intention, control, negligence, benefit and residual responsibility when
    outcomes are partly outside anyone's control.
  claims:
  - statement: Distinguish intention, control, negligence, benefit and residual responsibility when outcomes
      are partly outside anyone's control.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Moral-luck debates examine the tension between judging responsibility by what a person
      controls and judging outcomes influenced by circumstances outside that control.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-SEP-MORAL-LUCK
    limitations: Date is the inspected substantive revision. Philosophers disagree about the resolution;
      the fictional equipment case supplies no legal-liability judgment or validated measure of responsibility.
  applicability_question: Does a voluntary, bounded Moral luck, complicity, and dirty hands practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Moral luck, complicity, and dirty hands as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a diagram, tokens or spoken roles. Stay with the fictional equipment case
    rather than reenacting a morally distressing event.
  opportunity_considerations: Use two fictional volunteers who ignore the same instruction to cover borrowed
    equipment before rain. One item happens to stay dry; the other is damaged. The event organizer also
    omitted an available shelter from the plan.
  prerequisites:
  - Use two fictional volunteers who ignore the same instruction to cover borrowed equipment before rain.
    One item happens to stay dry; the other is damaged. The event organizer also omitted an available
    shelter from the plan.
  dependencies: []
  safe_alternatives:
  - Use a diagram, tokens or spoken roles. Stay with the fictional equipment case rather than reenacting
    a morally distressing event.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Moral luck, complicity, and dirty hands differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Moral luck, complicity, and
    dirty hands as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use two fictional volunteers who ignore the same instruction to cover borrowed equipment before
    rain. One item happens to stay dry; the other is damaged. The event organizer also omitted an available
    shelter from the plan. Goal: Distinguish intention, control, negligence, benefit and residual responsibility
    when outcomes are partly outside anyone''s control. Scope: The case illustrates moral luck and shared
    responsibility. It does not quantify blame or resolve legal liability, trauma or every no-win moral
    conflict. Time and effort: About 30 minutes to compare responsibility and formulate a proportionate
    response. Adaptation: Use a diagram, tokens or spoken roles. Stay with the fictional equipment case
    rather than reenacting a morally distressing event. Keep personal working notes outside the check-in;
    record only the listed observations.


    Reference support:

    Moral Luck: https://plato.stanford.edu/entries/moral-luck/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a diagram, tokens or spoken roles. Stay with the fictional equipment case rather
    than reenacting a morally distressing event.
  expected_burden: About 30 minutes to compare responsibility and formulate a proportionate response.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Moral luck, complicity, and dirty hands protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Moral luck, complicity, and dirty hands action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a diagram,
    tokens or spoken roles. Stay with the fictional equipment case rather than reenacting a morally distressing
    event.
  actions:
  - stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01-A1
    sequence: 1
    title: Hold conduct constant while comparing outcomes
    instructions: 'List what each volunteer knew, chose and controlled before the rain, then what happened
      afterward. Identify the role of chance in the different outcomes. Explain why a fortunate outcome
      does not automatically make the same careless choice responsible, while actual damage still creates
      practical repair needs.


      Observation checks: Prior knowledge and choices are distinguished from outcomes; The role of chance
      is explicit; Good fortune does not erase the conduct under review. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01
      action_stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01-A1
      competency_stable_id: '02.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0213_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0213_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - prior_knowledge_and_choices_are_distinguished_from_outcomes
        - the_role_of_chance_is_explicit
        - good_fortune_does_not_erase_the_conduct_under_review
      - measurement_id: c0213_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0213_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01-A2
    sequence: 2
    title: Map the system without dissolving agency
    instructions: 'Add the organizer''s planning omission and any resource constraints. Distinguish direct
      action, preventable omission, benefit from the arrangement and conditions nobody could change. State
      what each role could reasonably have done differently without assigning every participant equal
      responsibility merely because all were present.


      Observation checks: Several forms of involvement are distinguished; Constraints and available alternatives
      are considered; Responsibility is proportionate to actual agency. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01
      action_stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01-A2
      competency_stable_id: '02.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0213_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0213_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - several_forms_of_involvement_are_distinguished
        - constraints_and_available_alternatives_are_considered
        - responsibility_is_proportionate_to_actual_agency
      - measurement_id: c0213_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0213_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01-A3
    sequence: 3
    title: Propose repair and acknowledge what remains unresolved
    instructions: 'Suggest equipment repair, an honest account to its owner and a changed shelter plan.
      Separate the practical response to damage from a final verdict on anyone''s worth. Name any remaining
      unfairness, such as one person facing greater consequences for similarly careless conduct, and explain
      why the response cannot erase it.


      Observation checks: Repair addresses actual damage and future prevention; Moral judgment is separated
      from human worth; Residual unfairness remains acknowledged. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What does the outcome change about repair, and what does it leave unchanged about
      the original choice?


      Examples: Supportive: The analysis distinguished equal carelessness, unequal damage and the organizer''s
      separate planning responsibility.


      Mixed: Chance was recognized but every participant was assigned the same responsibility without
      examining their roles.


      Contradictory: The fortunate volunteer was declared blameless merely because no damage occurred.


      Inconclusive: Blame was assigned from the outcome alone without examining knowledge, choice or constraints.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01
      action_stable_id: PRACTICE-COMP-0213-MORAL-LUCK-COMPLICITY-AND-DIRTY-HANDS-01-A3
      competency_stable_id: '02.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
