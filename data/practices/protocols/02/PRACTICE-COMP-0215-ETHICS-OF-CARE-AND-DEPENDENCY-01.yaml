  transfer_limit: One care arrangement examines invisible work, unequal capacity and shared responsibility.
    It does not replace professional care planning or make every relationship voluntary in the same way.
  reflection:
    before: 'What would count as doing this honestly? Goal: Recognize responsibilities created by dependence
      and relationships, then negotiate care around needs and actual capacity.'
    during: Which checks have actually been observed? The visible errand changed hands but the original
      coordinator still carried all planning and follow-up.
    after: Whose load became lighter in practice, and whose needs might still be missing from the arrangement?
  review_guidance:
