        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Ethics of care and dependency; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use an accessible task map, agreed advocate or fictional care arrangement. Receiving care and communicating
      preferences are legitimate contributions; assistance is not a deficit.
    cultural_context:
    - Adapt the expression of Ethics of care and dependency to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use an accessible task map, agreed advocate or fictional care arrangement. Receiving care and communicating
      preferences are legitimate contributions; assistance is not a deficit.
  pause_conditions:
  - Pause Ethics of care and dependency when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Ethics of care and dependency practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Ethics of care and dependency situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Ethics of care and dependency actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0215_a1_primary
  - c0215_a1_boundary
  - c0215_a1_adverse
  - c0215_a2_primary
  - c0215_a2_boundary
  - c0215_a2_adverse
  - c0215_a3_primary
  - c0215_a3_boundary
  - c0215_a3_adverse
  adverse_or_contradictory_indicators:
  - A duty was imposed without agreement or the care recipient's preferences were ignored.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Ethics of care and dependency explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Ethics of care and dependency context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Ethics of care and dependency observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Ethics of care and dependency rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Include noticing and coordination in the work. Observed checks: Invisible
    coordination is included; The dependent person''s preferences are considered; Responsibilities and
    capacity limits are both identified. Action 2: Propose a fair share with the affected people. Observed
    checks: One burden has a specific proposed owner or reduction; Agreement and necessary information
    are addressed; Allocation reflects relevant differences in capacity. Action 3: Check whether the new
    arrangement actually relieved burden. Observed checks: Follow-through includes coordination as well
    as the visible task; Care recipient and coordinator perspectives are checked; A remaining burden receives
    an explicit next step.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Tasks were listed without identifying invisible work,
    capacity or a concrete change.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Ethics
    of care and dependency contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L02
  - L24
  - L28
  - L31
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Ethics of care and dependency evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
