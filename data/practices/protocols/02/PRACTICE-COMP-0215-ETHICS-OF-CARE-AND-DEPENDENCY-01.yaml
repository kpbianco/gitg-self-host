meaning_and_fit:
  purpose: Recognize responsibilities created by dependence and relationships, then negotiate care around
    needs and actual capacity.
  why_recommended: Recognize responsibilities created by dependence and relationships, then negotiate
    care around needs and actual capacity.
  claims:
  - statement: Recognize responsibilities created by dependence and relationships, then negotiate care
      around needs and actual capacity.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Care ethics gives moral attention to particular relationships, needs and circumstances,
      including responsibilities that abstract rules alone may overlook.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-CARE-ETHICS
    limitations: Conceptual support only. No claim that caring roles or ethical capacities are determined
      by gender; no effectiveness claim for the product's care-burden exercise.
  applicability_question: Does a voluntary, bounded Ethics of care and dependency practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Ethics of care and dependency as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible task map, agreed advocate or fictional care arrangement.
    Receiving care and communicating preferences are legitimate contributions; assistance is not a deficit.
  opportunity_considerations: 'Use an ordinary agreed household responsibility or this fictional case:
    one person coordinates all appointments and reminders for a shared dependent''s care. Keep health
    details and identifying information out of the record.'
  prerequisites:
  - 'Use an ordinary agreed household responsibility or this fictional case: one person coordinates all
    appointments and reminders for a shared dependent''s care. Keep health details and identifying information
    out of the record.'
  dependencies: []
  safe_alternatives:
  - Use an accessible task map, agreed advocate or fictional care arrangement. Receiving care and communicating
    preferences are legitimate contributions; assistance is not a deficit.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Ethics of care and dependency differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Ethics of care and dependency
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an ordinary agreed household responsibility or this fictional case: one person coordinates
    all appointments and reminders for a shared dependent''s care. Keep health details and identifying
    information out of the record. Goal: Recognize responsibilities created by dependence and relationships,
    then negotiate care around needs and actual capacity. Scope: One care arrangement examines invisible
    work, unequal capacity and shared responsibility. It does not replace professional care planning or
    make every relationship voluntary in the same way. Time and effort: About 20 minutes to map the work,
    a welcomed short discussion or rehearsal, and one agreed follow-through. Adaptation: Use an accessible
    task map, agreed advocate or fictional care arrangement. Receiving care and communicating preferences
    are legitimate contributions; assistance is not a deficit. Keep personal working notes outside the
    check-in; record only the listed observations.


    Reference support:

    Introduction to Philosophy, 9.6 Feminist Theories of Ethics: https://openstax.org/books/introduction-philosophy/pages/9-6-feminist-theories-of-ethics'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible task map, agreed advocate or fictional care arrangement. Receiving
    care and communicating preferences are legitimate contributions; assistance is not a deficit.
  expected_burden: About 20 minutes to map the work, a welcomed short discussion or rehearsal, and one
    agreed follow-through.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Ethics of care and dependency protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Ethics of care and dependency action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    task map, agreed advocate or fictional care arrangement. Receiving care and communicating preferences
    are legitimate contributions; assistance is not a deficit.
  actions:
  - stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01-A1
    sequence: 1
    title: Include noticing and coordination in the work
    instructions: 'List not only visible tasks but also noticing needs, arranging help, remembering dates
      and checking whether care occurred. Identify who currently does each part, whose needs are least
      heard and which duties arise from dependence rather than an explicit contract. Do not assume the
      most capable person has unlimited capacity.


      Observation checks: Invisible coordination is included; The dependent person''s preferences are
      considered; Responsibilities and capacity limits are both identified. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01
      action_stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01-A1
      competency_stable_id: '02.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0215_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0215_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - invisible_coordination_is_included
        - the_dependent_person_s_preferences_are_considered
        - responsibilities_and_capacity_limits_are_both_identified
      - measurement_id: c0215_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0215_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01-A2
    sequence: 2
    title: Propose a fair share with the affected people
    instructions: 'Choose one burden that could be shared or reduced. Propose who will own it, what information
      they actually need and when help or backup is necessary. Seek agreement from those affected instead
      of assigning duties unilaterally. Equal dignity does not require identical tasks when people have
      different capacities.


      Observation checks: One burden has a specific proposed owner or reduction; Agreement and necessary
      information are addressed; Allocation reflects relevant differences in capacity. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01
      action_stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01-A2
      competency_stable_id: '02.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0215_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0215_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_burden_has_a_specific_proposed_owner_or_reduction
        - agreement_and_necessary_information_are_addressed
        - allocation_reflects_relevant_differences_in_capacity
      - measurement_id: c0215_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0215_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01-A3
    sequence: 3
    title: Check whether the new arrangement actually relieved burden
    instructions: 'Carry out the agreed change or rehearse it in the case. Ask whether the original coordinator
      still had to notice, remind and rescue the task. Check that the person receiving care experienced
      the arrangement as useful and respectful. Revise ownership or seek additional support if the work
      merely became less visible.


      Observation checks: Follow-through includes coordination as well as the visible task; Care recipient
      and coordinator perspectives are checked; A remaining burden receives an explicit next step. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.


      Final review: Whose load became lighter in practice, and whose needs might still be missing from
      the arrangement?


      Examples: Supportive: A second person took responsibility for both arranging and confirming transport,
      reducing repeated reminders.


      Mixed: The visible errand changed hands but the original coordinator still carried all planning
      and follow-up.


      Contradictory: A duty was imposed without agreement or the care recipient''s preferences were ignored.


      Inconclusive: Tasks were listed without identifying invisible work, capacity or a concrete change.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01
      action_stable_id: PRACTICE-COMP-0215-ETHICS-OF-CARE-AND-DEPENDENCY-01-A3
      competency_stable_id: '02.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0215_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0215_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - follow_through_includes_coordination_as_well_as_the_visible_task
        - care_recipient_and_coordinator_perspectives_are_checked
        - a_remaining_burden_receives_an_explicit_next_step
      - measurement_id: c0215_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0215_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
