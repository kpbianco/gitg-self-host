  - c0204_a3_primary
  - c0204_a3_boundary
  - c0204_a3_adverse
  adverse_or_contradictory_indicators:
  - A knowingly unrealistic promise replaced the old one or another person's private situation was exposed.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Truthfulness and candor explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Truthfulness and candor context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Truthfulness and candor observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Truthfulness and candor rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Separate the facts from excuses and private details. Observed checks:
    The promise and actual outcome are accurate; Uncertainty is stated where needed; Irrelevant private
    details are excluded. Action 2: Deliver a clear statement with a practical next step. Observed checks:
    The difficult fact is stated directly; The next step is realistic; The recipient can question or decline
    the proposed arrangement. Action 3: Check what the listener could reasonably infer. Observed checks:
    Misleading implications are checked; A reasonable question receives a truthful response; Follow-through
    or the limits of rehearsal are recorded.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A draft was polished without identifying the difficult
    fact or checking its implications.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Truthfulness
    and candor contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L02
  - L23
  - L25
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Truthfulness and candor evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
