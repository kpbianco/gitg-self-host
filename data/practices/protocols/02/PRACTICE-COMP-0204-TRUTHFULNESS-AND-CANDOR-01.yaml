meaning_and_fit:
  purpose: Give a relevant truthful account while protecting confidentiality, uncertainty and the listener's
    dignity.
  why_recommended: Give a relevant truthful account while protecting confidentiality, uncertainty and
    the listener's dignity.
  claims:
  - statement: Give a relevant truthful account while protecting confidentiality, uncertainty and the
      listener's dignity.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Truthfulness and candor practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Truthfulness and candor as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a written message, extra processing time or communication support. A fictional
    exchange can develop clarity when direct contact would be unsafe.
  opportunity_considerations: Use a minor missed commitment, such as sending a promised draft late. Choose
    a safe recipient or rehearse a fictional exchange; exclude confidential investigations and dangerous
    confrontations.
  prerequisites:
  - Use a minor missed commitment, such as sending a promised draft late. Choose a safe recipient or rehearse
    a fictional exchange; exclude confidential investigations and dangerous confrontations.
  dependencies: []
  safe_alternatives:
  - Use a written message, extra processing time or communication support. A fictional exchange can develop
    clarity when direct contact would be unsafe.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Truthfulness and candor differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Truthfulness and candor as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a minor missed commitment, such as sending a promised draft late. Choose a safe recipient
    or rehearse a fictional exchange; exclude confidential investigations and dangerous confrontations.
    Goal: Give a relevant truthful account while protecting confidentiality, uncertainty and the listener''s
    dignity. Scope: One statement practices candor in an ordinary responsibility. Professional confidentiality,
    protected disclosures and serious conflict require context-specific guidance. Time and effort: About
    15 minutes to prepare, one short exchange or rehearsal, and a brief review. Adaptation: Use a written
    message, extra processing time or communication support. A fictional exchange can develop clarity
    when direct contact would be unsafe. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written message, extra processing time or communication support. A fictional
    exchange can develop clarity when direct contact would be unsafe.
  expected_burden: About 15 minutes to prepare, one short exchange or rehearsal, and a brief review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Truthfulness and candor protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Truthfulness and candor action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written
    message, extra processing time or communication support. A fictional exchange can develop clarity
    when direct contact would be unsafe.
  actions:
  - stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01-A1
    sequence: 1
    title: Separate the facts from excuses and private details
    instructions: 'Write what was promised, what actually happened, what is uncertain and what the recipient
      needs to know. Exclude another person''s private information and explanations that merely shift
      blame. Example: I promised the draft today; it is unfinished; I can send the checked section tomorrow.


      Observation checks: The promise and actual outcome are accurate; Uncertainty is stated where needed;
      Irrelevant private details are excluded. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01
      action_stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01-A1
      competency_stable_id: '02.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0204_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0204_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_promise_and_actual_outcome_are_accurate
        - uncertainty_is_stated_where_needed
        - irrelevant_private_details_are_excluded
      - measurement_id: c0204_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0204_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01-A2
    sequence: 2
    title: Deliver a clear statement with a practical next step
    instructions: 'Use a suitable private channel and state the gap plainly. Acknowledge its likely inconvenience,
      offer a realistic correction and ask whether the recipient needs a different arrangement. Avoid
      misleading optimism, a confession that demands comfort, or criticism disguised as honesty.


      Observation checks: The difficult fact is stated directly; The next step is realistic; The recipient
      can question or decline the proposed arrangement. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01
      action_stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01-A2
      competency_stable_id: '02.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0204_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0204_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_difficult_fact_is_stated_directly
        - the_next_step_is_realistic
        - the_recipient_can_question_or_decline_the_proposed_arrangement
      - measurement_id: c0204_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0204_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01-A3
    sequence: 3
    title: Check what the listener could reasonably infer
    instructions: 'Review the wording for an implication stronger than the facts support. If an exchange
      occurred, clarify a misunderstanding and follow through on the revised arrangement. In rehearsal,
      write the listener''s strongest reasonable question and answer it without inventing certainty or
      disclosing someone else''s information.


      Observation checks: Misleading implications are checked; A reasonable question receives a truthful
      response; Follow-through or the limits of rehearsal are recorded. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Did the recipient receive the truth they needed without being made responsible for
      your discomfort?


      Examples: Supportive: A missed deadline was acknowledged with a feasible replacement and an honest
      account of what remained incomplete.


      Mixed: The facts were accurate but the message hid the missed commitment inside a long explanation.


      Contradictory: A knowingly unrealistic promise replaced the old one or another person''s private
      situation was exposed.


      Inconclusive: A draft was polished without identifying the difficult fact or checking its implications.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01
      action_stable_id: PRACTICE-COMP-0204-TRUTHFULNESS-AND-CANDOR-01-A3
      competency_stable_id: '02.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
