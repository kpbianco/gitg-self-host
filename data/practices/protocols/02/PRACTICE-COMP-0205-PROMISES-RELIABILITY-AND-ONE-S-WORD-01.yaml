meaning_and_fit:
  purpose: Make a commitment another person can reasonably rely on, and fulfill or renegotiate it before
    failure.
  why_recommended: Make a commitment another person can reasonably rely on, and fulfill or renegotiate
    it before failure.
  claims:
  - statement: Make a commitment another person can reasonably rely on, and fulfill or renegotiate it
      before failure.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Promises, reliability, and one's word practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Promises, reliability, and one's word as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an accessible reminder or agreed helper. A fictional commitment can rehearse
    the tracking process, but only real follow-through demonstrates keeping a promise.
  opportunity_considerations: Select one small commitment within your control, such as returning a borrowed
    item or supplying a short note. Use a calendar or paper reminder and avoid promising on another person's
    behalf.
  prerequisites:
  - Select one small commitment within your control, such as returning a borrowed item or supplying a
    short note. Use a calendar or paper reminder and avoid promising on another person's behalf.
  dependencies: []
  safe_alternatives:
  - Use an accessible reminder or agreed helper. A fictional commitment can rehearse the tracking process,
    but only real follow-through demonstrates keeping a promise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Promises, reliability, and one's word differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Promises, reliability, and
    one's word as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Select one small commitment within your control, such as returning a borrowed item or supplying
    a short note. Use a calendar or paper reminder and avoid promising on another person''s behalf. Goal:
    Make a commitment another person can reasonably rely on, and fulfill or renegotiate it before failure.
    Scope: One completed commitment demonstrates a bounded instance of reliability. Trust across changing
    conditions depends on a longer pattern and honest repair after failures. Time and effort: About 10
    minutes to agree scope, the ordinary work involved, and 5 minutes to close the loop. Adaptation: Use
    an accessible reminder or agreed helper. A fictional commitment can rehearse the tracking process,
    but only real follow-through demonstrates keeping a promise. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible reminder or agreed helper. A fictional commitment can rehearse
    the tracking process, but only real follow-through demonstrates keeping a promise.
  expected_burden: About 10 minutes to agree scope, the ordinary work involved, and 5 minutes to close
    the loop.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Promises, reliability, and one's word protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Promises, reliability, and one's word action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    reminder or agreed helper. A fictional commitment can rehearse the tracking process, but only real
    follow-through demonstrates keeping a promise.
  actions:
  - stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01-A1
    sequence: 1
    title: Agree what is promised and by when
    instructions: 'Specify the deliverable, recipient, deadline, dependencies and a reasonable check that
      it is done. Compare the promise with your actual capacity before accepting. Replace a vague offer
      such as soon with an agreed date, or decline a commitment you cannot responsibly make.


      Observation checks: Deliverable and deadline are explicit; Capacity and dependencies are checked;
      The recipient can understand what to rely on. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01
      action_stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01-A1
      competency_stable_id: '02.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0205_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0205_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - deliverable_and_deadline_are_explicit
        - capacity_and_dependencies_are_checked
        - the_recipient_can_understand_what_to_rely_on
      - measurement_id: c0205_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0205_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01-A2
    sequence: 2
    title: Use a reminder before the promise is at risk
    instructions: 'Set a reminder early enough to act or renegotiate. At that point, inspect actual progress.
      If a dependency or capacity problem threatens delivery, inform the recipient before the deadline,
      describe the gap and seek an agreed change; silently moving your private deadline does not renegotiate
      a promise.


      Observation checks: A timely reminder is used; Progress is checked against the promise; Any threatened
      failure is communicated before the deadline. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01
      action_stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01-A2
      competency_stable_id: '02.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0205_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0205_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_timely_reminder_is_used
        - progress_is_checked_against_the_promise
        - any_threatened_failure_is_communicated_before_the_deadline
      - measurement_id: c0205_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0205_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01-A3
    sequence: 3
    title: Deliver and confirm closure or repair
    instructions: 'Deliver what was agreed and confirm that the recipient can access it. If you failed,
      name the missed commitment, acknowledge the effect and propose proportionate repair without demanding
      immediate restored trust. Record which promise-making assumption should change next time.


      Observation checks: Delivery or failure is confirmed honestly; Any failure has a concrete repair
      proposal; A reliability lesson changes a future assumption. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Could the other person plan around your word, and what would make the next promise
      more dependable?


      Examples: Supportive: The item was returned on the agreed day and receipt was confirmed.


      Mixed: Delivery was late, but the failure was acknowledged and a proportionate repair was completed.


      Contradictory: The deadline was silently changed or the recipient was blamed for relying on the
      original promise.


      Inconclusive: A reminder was created but the delivery point has not occurred.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01
      action_stable_id: PRACTICE-COMP-0205-PROMISES-RELIABILITY-AND-ONE-S-WORD-01-A3
      competency_stable_id: '02.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
