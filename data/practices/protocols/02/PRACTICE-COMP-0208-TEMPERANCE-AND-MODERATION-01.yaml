  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Temperance and moderation explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Temperance and moderation context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Temperance and moderation observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Temperance and moderation rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Define the good and what it must leave room for. Observed checks: The
    pleasure is valued without shame; A competing need is explicit; A stopping point and reasonable exception
    are chosen. Action 2: Take part and notice the stopping decision. Observed checks: The activity is
