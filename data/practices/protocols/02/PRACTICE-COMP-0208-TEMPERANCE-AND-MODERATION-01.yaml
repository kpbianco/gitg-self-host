meaning_and_fit:
  purpose: Practice enjoying a discretionary good without letting it displace an obligation or turn into
    a purity test.
  why_recommended: Practice enjoying a discretionary good without letting it displace an obligation or
    turn into a purity test.
  claims:
  - statement: Practice enjoying a discretionary good without letting it displace an obligation or turn
      into a purity test.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Temperance and moderation practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Temperance and moderation as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a natural activity boundary instead of a timer when timing creates stress.
    Restful or supported leisure is as eligible as an active hobby.
  opportunity_considerations: Choose a familiar low-stakes leisure activity, such as a puzzle, game or
    entertainment session. Use ordinary access; do not experiment with food restriction, substance use,
    medication or activities associated with serious harm.
  prerequisites:
  - Choose a familiar low-stakes leisure activity, such as a puzzle, game or entertainment session. Use
    ordinary access; do not experiment with food restriction, substance use, medication or activities
    associated with serious harm.
  dependencies: []
  safe_alternatives:
  - Use a natural activity boundary instead of a timer when timing creates stress. Restful or supported
    leisure is as eligible as an active hobby.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Temperance and moderation differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Temperance and moderation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a familiar low-stakes leisure activity, such as a puzzle, game or entertainment session.
    Use ordinary access; do not experiment with food restriction, substance use, medication or activities
    associated with serious harm. Goal: Practice enjoying a discretionary good without letting it displace
    an obligation or turn into a purity test. Scope: One leisure session tests moderation in a bounded
    context. Compulsion, dependence and other high-consequence patterns require support beyond a recreational
    trial. Time and effort: About 5 minutes to choose a boundary, one ordinary leisure session, and a
    5-minute review. Adaptation: Use a natural activity boundary instead of a timer when timing creates
    stress. Restful or supported leisure is as eligible as an active hobby. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a natural activity boundary instead of a timer when timing creates stress.
    Restful or supported leisure is as eligible as an active hobby.
  expected_burden: About 5 minutes to choose a boundary, one ordinary leisure session, and a 5-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Temperance and moderation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Temperance and moderation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a natural
    activity boundary instead of a timer when timing creates stress. Restful or supported leisure is as
    eligible as an active hobby.
  actions:
  - stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01-A1
    sequence: 1
    title: Define the good and what it must leave room for
    instructions: 'Name what you enjoy in the activity and one other legitimate need it should not displace,
      such as sleep, a prior agreement or time with someone. Choose a natural stopping point, such as
      the end of one round, and a reasonable exception for an agreed change of plans.


      Observation checks: The pleasure is valued without shame; A competing need is explicit; A stopping
      point and reasonable exception are chosen. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01
      action_stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01-A1
      competency_stable_id: '02.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0208_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0208_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_pleasure_is_valued_without_shame
        - a_competing_need_is_explicit
        - a_stopping_point_and_reasonable_exception_are_chosen
      - measurement_id: c0208_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0208_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01-A2
    sequence: 2
    title: Take part and notice the stopping decision
    instructions: 'Enjoy the activity. At the chosen point, pause long enough to check whether continuing
      serves enjoyment or merely avoids stopping. Stop, or consciously revise the plan when the exception
      actually applies. Record the decision rather than demanding flawless self-control or manufacturing
      guilt about pleasure.


      Observation checks: The activity is actually enjoyed or honestly evaluated; The stopping decision
      is noticed; Any extension follows an explicit reason. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01
      action_stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01-A2
      competency_stable_id: '02.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0208_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0208_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_activity_is_actually_enjoyed_or_honestly_evaluated
        - the_stopping_decision_is_noticed
        - any_extension_follows_an_explicit_reason
      - measurement_id: c0208_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0208_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01-A3
    sequence: 3
    title: Review both excess and unnecessary rigidity
    instructions: 'Compare the session with the protected need. Note whether the activity crowded it out,
      whether the boundary was unnecessarily harsh, and whether you could return to ordinary life afterward.
      Adjust one feature, such as a clearer endpoint or a more generous window, and retain enjoyment as
      part of the goal.


      Observation checks: The effect on the protected need is checked; Rigidity as well as excess is considered;
      One proportionate adjustment is chosen. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Did the boundary protect another good while still allowing this one to be enjoyed?


      Examples: Supportive: A game ended at the agreed point and remained enjoyable without displacing
      a promised call.


      Mixed: The session overran slightly, revealing that the chosen endpoint was difficult to recognize.


      Contradictory: Enjoyment was treated as a moral failure or repeated extensions displaced an essential
      need.


      Inconclusive: A limit was announced without participating in the activity or observing the stopping
      decision.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01
      action_stable_id: PRACTICE-COMP-0208-TEMPERANCE-AND-MODERATION-01-A3
      competency_stable_id: '02.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
