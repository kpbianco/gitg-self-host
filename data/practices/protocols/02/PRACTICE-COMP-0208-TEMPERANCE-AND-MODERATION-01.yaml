  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Temperance and moderation; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use a natural activity boundary instead of a timer when timing creates stress. Restful or supported
      leisure is as eligible as an active hobby.
    cultural_context:
    - Adapt the expression of Temperance and moderation to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a natural activity boundary instead of a timer when timing creates stress. Restful or supported
      leisure is as eligible as an active hobby.
  pause_conditions:
  - Pause Temperance and moderation when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Temperance and moderation practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Temperance and moderation situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
