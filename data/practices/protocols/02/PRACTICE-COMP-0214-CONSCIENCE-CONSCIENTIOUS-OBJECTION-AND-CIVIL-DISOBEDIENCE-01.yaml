    specific act and principle; Reasons are intelligible outside the speaker''s worldview; Conscience
    is distinguished from mere convenience.'
  - 'Action 2: Compare proportionate ways to resist. Observed checks: Several feasible responses are compared;
    Effects on others and proportionality are considered; The response preserves others'' freedom of conscience.'
  - 'Action 3: Explain accountability without accepting unlimited mistreatment. Observed checks: The refusal
    and any offered alternative are clear; Foreseeable consequences are acknowledged; Accountability includes
    correction and legitimate support.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
