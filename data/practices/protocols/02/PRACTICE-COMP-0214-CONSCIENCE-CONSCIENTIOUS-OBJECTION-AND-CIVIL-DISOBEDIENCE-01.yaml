        expected: true
  - stable_id: PRACTICE-COMP-0214-CONSCIENCE-CONSCIENTIOUS-OBJECTION-AND-CIVIL-DISOBEDIENCE-01-A2
    sequence: 2
    title: Compare proportionate ways to resist
    instructions: 'Compare requesting an exemption, proposing a respectful replacement, declining the
      initiation or leaving the club. Consider effects on other members and whether a quiet or public
      response serves the reason for refusal. Keep the methods nonviolent and avoid coercing others to
      declare agreement.


      Observation checks: Several feasible responses are compared; Effects on others and proportionality
      are considered; The response preserves others'' freedom of conscience. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0214-CONSCIENCE-CONSCIENTIOUS-OBJECTION-AND-CIVIL-DISOBEDIENCE-01
      action_stable_id: PRACTICE-COMP-0214-CONSCIENCE-CONSCIENTIOUS-OBJECTION-AND-CIVIL-DISOBEDIENCE-01-A2
      competency_stable_id: '02.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
