  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Conscience, conscientious objection, and civil disobedience explicitly; support can enable access
    and never reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Conscience, conscientious objection, and
    civil disobedience context, action, role, pathway, and assessment epoch; it does not establish cross-context
    reliability.
  repetition_rule: Each Conscience, conscientious objection, and civil disobedience observation requires
    a distinct immutable origin; duplicate origins are rejected and later repetitions use the typed contract's
    explicit diminishing multipliers.
  recency_rule: Generated Conscience, conscientious objection, and civil disobedience rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: State the principle and its public reasons. Observed checks: The objection
    identifies a specific act and principle; Reasons are intelligible outside the speaker''s worldview;
    Conscience is distinguished from mere convenience. Action 2: Compare proportionate ways to resist.
    Observed checks: Several feasible responses are compared; Effects on others and proportionality are
    considered; The response preserves others'' freedom of conscience. Action 3: Explain accountability
    without accepting unlimited mistreatment. Observed checks: The refusal and any offered alternative
    are clear; Foreseeable consequences are acknowledged; Accountability includes correction and legitimate
    support.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A refusal was announced without reasons, a specific
    objection or consideration of consequences.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Conscience,
    conscientious objection, and civil disobedience contribution under typed evaluation; protocol performance
    remains distinct and is never counted twice.
