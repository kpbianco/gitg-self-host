  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Conscience, conscientious objection, and civil disobedience; no purchase, subscription, travel,
      credential, or public artifact is required.
    accessibility:
    - Use the fictional case or a written statement. People dependent on a group may need a safer route
      or an advocate; direct confrontation is not a completion requirement.
    cultural_context:
    - Adapt the expression of Conscience, conscientious objection, and civil disobedience to direct or
      indirect communication, collective or individual decision structures, local norms, faith or secular
      commitments, and role obligations while preserving consent and dignity.
    resource_variants:
    - Use the fictional case or a written statement. People dependent on a group may need a safer route
      or an advocate; direct confrontation is not a completion requirement.
  pause_conditions:
  - Pause Conscience, conscientious objection, and civil disobedience when capacity, consent, authority,
    privacy, access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed
    circumstances make the next action unwise.
  stop_conditions:
  - Stop the Conscience, conscientious objection, and civil disobedience practice for harm, coercion,
    retaliation risk, emergency conditions, unsafe exposure, worsening symptoms, protected information,
    legal or policy conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Conscience, conscientious objection, and civil disobedience situation
    exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
