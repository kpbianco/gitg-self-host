    and the responsibilities you accept?
  transfer_limit: The case practices principled refusal within a group. Civil disobedience involves further
    questions about law, legitimacy, public action and consequences that this rehearsal does not settle.
  reflection:
    before: 'What would count as doing this honestly? Goal: Explain a conscientious objection using reasons
      others can examine, proportionate methods and accountability.'
    during: Which checks have actually been observed? The principle was clear but the proposed response
      imposed unnecessary costs on uninvolved members.
    after: Could someone disagree with your conclusion while still understanding the principle and the
      responsibilities you accept?
  review_guidance:
    repeat: Repeat the same bounded Conscience, conscientious objection, and civil disobedience design
      only when the context and burden remain appropriate.
    adapt: Use the fictional case or a written statement. People dependent on a group may need a safer
      route or an advocate; direct confrontation is not a completion requirement.
    stop: Stop Conscience, conscientious objection, and civil disobedience when the practice becomes coercive,
      unsafe, privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: The member proposed a respectful replacement and explained a principled limit without
      demanding universal agreement.
    mixed: The principle was clear but the proposed response imposed unnecessary costs on uninvolved members.
    contradictory: Personal conviction was treated as permission to intimidate others or as freedom from
