  - stable_id: PRACTICE-COMP-0214-CONSCIENCE-CONSCIENTIOUS-OBJECTION-AND-CIVIL-DISOBEDIENCE-01-A3
    sequence: 3
    title: Explain accountability without accepting unlimited mistreatment
    instructions: 'Write the chosen refusal, the alternative you offer and the ordinary consequences you
      understand may follow. Identify how you would answer criticism or correct a factual error. Accepting
      responsibility for a choice does not require accepting abuse or abandoning access to appropriate
      advice and support.


      Observation checks: The refusal and any offered alternative are clear; Foreseeable consequences
      are acknowledged; Accountability includes correction and legitimate support. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Could someone disagree with your conclusion while still understanding the principle
      and the responsibilities you accept?


      Examples: Supportive: The member proposed a respectful replacement and explained a principled limit
      without demanding universal agreement.


      Mixed: The principle was clear but the proposed response imposed unnecessary costs on uninvolved
      members.


      Contradictory: Personal conviction was treated as permission to intimidate others or as freedom
      from every consequence.


      Inconclusive: A refusal was announced without reasons, a specific objection or consideration of
      consequences.'
    expected_time: 15-25 minutes
    due_within_days: 10
