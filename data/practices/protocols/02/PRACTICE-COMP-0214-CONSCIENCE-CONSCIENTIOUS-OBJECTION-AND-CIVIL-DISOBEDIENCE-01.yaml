meaning_and_fit:
  purpose: Explain a conscientious objection using reasons others can examine, proportionate methods and
    accountability.
  why_recommended: Explain a conscientious objection using reasons others can examine, proportionate methods
    and accountability.
  claims:
  - statement: Explain a conscientious objection using reasons others can examine, proportionate methods
      and accountability.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Conscience, conscientious objection, and civil disobedience
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Conscience, conscientious objection, and civil disobedience as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use the fictional case or a written statement. People dependent on a group
    may need a safer route or an advocate; direct confrontation is not a completion requirement.
  opportunity_considerations: Use a fictional club policy requiring an insulting initiation phrase that
    a member refuses to repeat. Draft a response; no actual lawbreaking, protest, employment dispute or
    confrontation is required.
  prerequisites:
  - Use a fictional club policy requiring an insulting initiation phrase that a member refuses to repeat.
    Draft a response; no actual lawbreaking, protest, employment dispute or confrontation is required.
  dependencies: []
  safe_alternatives:
  - Use the fictional case or a written statement. People dependent on a group may need a safer route
    or an advocate; direct confrontation is not a completion requirement.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Conscience, conscientious objection, and civil disobedience differently while preserving consent,
    evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Conscience, conscientious
    objection, and civil disobedience as inferiority; competing reasonable interpretations and conscientious
    refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional club policy requiring an insulting initiation phrase that a member refuses to
    repeat. Draft a response; no actual lawbreaking, protest, employment dispute or confrontation is required.
    Goal: Explain a conscientious objection using reasons others can examine, proportionate methods and
    accountability. Scope: The case practices principled refusal within a group. Civil disobedience involves
    further questions about law, legitimacy, public action and consequences that this rehearsal does not
    settle. Time and effort: About 30 minutes to write the objection, compare methods and review accountability.
    Adaptation: Use the fictional case or a written statement. People dependent on a group may need a
    safer route or an advocate; direct confrontation is not a completion requirement. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case or a written statement. People dependent on a group may
    need a safer route or an advocate; direct confrontation is not a completion requirement.
  expected_burden: About 30 minutes to write the objection, compare methods and review accountability.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Conscience, conscientious objection, and civil disobedience protocol to rank worth, coerce
    participation, demand disclosure, override rest or care, certify competence, or justify decisions
    beyond the recorded context.
  - Treating a completed Conscience, conscientious objection, and civil disobedience action, a polished
    artifact, agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case or a written statement. People dependent on a group may need a safer route or an advocate; direct
    confrontation is not a completion requirement.
  actions:
  - stable_id: PRACTICE-COMP-0214-CONSCIENCE-CONSCIENTIOUS-OBJECTION-AND-CIVIL-DISOBEDIENCE-01-A1
    sequence: 1
    title: State the principle and its public reasons
    instructions: 'Describe the required act, why conscience objects and who may be harmed or demeaned.
      Give reasons another member could examine even if they do not share your worldview. Distinguish
      objection to the degrading act from a preference to avoid ordinary inconvenience or a claim that
      every personal conviction overrides every obligation.


      Observation checks: The objection identifies a specific act and principle; Reasons are intelligible
      outside the speaker''s worldview; Conscience is distinguished from mere convenience. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0214-CONSCIENCE-CONSCIENTIOUS-OBJECTION-AND-CIVIL-DISOBEDIENCE-01
      action_stable_id: PRACTICE-COMP-0214-CONSCIENCE-CONSCIENTIOUS-OBJECTION-AND-CIVIL-DISOBEDIENCE-01-A1
      competency_stable_id: '02.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0214_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0214_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_objection_identifies_a_specific_act_and_principle
        - reasons_are_intelligible_outside_the_speaker_s_worldview
        - conscience_is_distinguished_from_mere_convenience
      - measurement_id: c0214_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
