  - stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01-A2
    sequence: 2
    title: Try the Integrity across contexts behavior in three windows
    instructions: Attempt the same small Integrity across contexts behavior in up to three naturally occurring
      windows. Record attempt, defer, interruption, support used, and adverse effect separately; never
      manufacture deprivation, distress, conflict, or unsafe conditions to obtain a repetition.
    expected_time: 15-25 minutes
