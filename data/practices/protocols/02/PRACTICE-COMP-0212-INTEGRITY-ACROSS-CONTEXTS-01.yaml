meaning_and_fit:
  purpose: Identify and correct a gap between publicly claimed principles and private or rewarded conduct.
  why_recommended: Identify and correct a gap between publicly claimed principles and private or rewarded
    conduct.
  claims:
  - statement: Identify and correct a gap between publicly claimed principles and private or rewarded
      conduct.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Integrity across contexts practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Integrity across contexts as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a private example, an audio comparison or a fictional document. Confidentiality
    can justify different public wording while the underlying principle remains consistent.
  opportunity_considerations: Choose a principle relevant to a small action, such as giving accurate credit
    for shared work. Use your own non-sensitive notes or a fictional comparison; do not monitor another
    person's private behavior.
  prerequisites:
  - Choose a principle relevant to a small action, such as giving accurate credit for shared work. Use
    your own non-sensitive notes or a fictional comparison; do not monitor another person's private behavior.
  dependencies: []
  safe_alternatives:
  - Use a private example, an audio comparison or a fictional document. Confidentiality can justify different
    public wording while the underlying principle remains consistent.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Integrity across contexts differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Integrity across contexts
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a principle relevant to a small action, such as giving accurate credit for shared work.
    Use your own non-sensitive notes or a fictional comparison; do not monitor another person''s private
    behavior. Goal: Identify and correct a gap between publicly claimed principles and private or rewarded
    conduct. Scope: One audience comparison examines consistency in a bounded setting. Integrity across
    pressure, incentives and unobserved conduct depends on a sustained pattern. Time and effort: About
    20 minutes to compare cases, one small correction, and a later 5-minute check. Adaptation: Use a private
    example, an audio comparison or a fictional document. Confidentiality can justify different public
    wording while the underlying principle remains consistent. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a private example, an audio comparison or a fictional document. Confidentiality
    can justify different public wording while the underlying principle remains consistent.
  expected_burden: About 20 minutes to compare cases, one small correction, and a later 5-minute check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Integrity across contexts protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Integrity across contexts action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a private
    example, an audio comparison or a fictional document. Confidentiality can justify different public
    wording while the underlying principle remains consistent.
  actions:
  - stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01-A1
    sequence: 1
    title: Compare public, private and rewarded versions
    instructions: 'Describe how you would apply the principle when others can see, when nobody is checking
      and when ignoring it offers an advantage. For credit, compare a public thank-you, a private draft
      and a summary where claiming sole authorship would impress someone. Identify the exact behavior
      that changes.


      Observation checks: Three incentive or audience conditions are compared; The principle has an observable
      expression; Any behavioral difference is identified precisely. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01
      action_stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01-A1
      competency_stable_id: '02.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0212_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0212_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_incentive_or_audience_conditions_are_compared
        - the_principle_has_an_observable_expression
        - any_behavioral_difference_is_identified_precisely
      - measurement_id: c0212_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0212_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01-A2
    sequence: 2
    title: Examine the excuse and choose a consistent rule
    instructions: 'Write the strongest justification for the inconsistent behavior and test whether you
      would accept it from someone else. Distinguish a legitimate contextual difference, such as required
      confidentiality, from self-serving convenience. Specify the smallest correction that aligns the
      means with the professed end.


      Observation checks: The justification faces a reciprocal test; Relevant context is distinguished
      from convenience; A specific consistency correction is chosen. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01
      action_stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01-A2
      competency_stable_id: '02.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0212_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0212_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_justification_faces_a_reciprocal_test
        - relevant_context_is_distinguished_from_convenience
        - a_specific_consistency_correction_is_chosen
      - measurement_id: c0212_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0212_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01-A3
    sequence: 3
    title: Apply the correction where recognition is unnecessary
    instructions: 'Make the permitted correction in your own work or rehearse it in the supplied case.
      At a later similar opportunity, check whether the rule still guided the action without an audience.
      Do not create publicity about the correction merely to transform private integrity into another
      reward.


      Observation checks: A correction is enacted or explicitly rehearsed; A later opportunity is checked
      when available; Recognition is not treated as the criterion of success. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which incentive made the principle hardest to keep, and what concrete rule survived
      that pressure?


      Examples: Supportive: A private draft accurately credited shared work even though claiming sole
      authorship would have been easier.


      Mixed: The first correction was made but a later rewarded opportunity remains untested.


      Contradictory: A convenient exception was defended for oneself while condemning the same conduct
      in others.


      Inconclusive: Integrity was affirmed without comparing behavior across any different conditions.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01
      action_stable_id: PRACTICE-COMP-0212-INTEGRITY-ACROSS-CONTEXTS-01-A3
      competency_stable_id: '02.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
