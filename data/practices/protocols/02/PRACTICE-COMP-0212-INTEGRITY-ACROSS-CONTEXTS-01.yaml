  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Integrity across contexts; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use a private example, an audio comparison or a fictional document. Confidentiality can justify
      different public wording while the underlying principle remains consistent.
    cultural_context:
    - Adapt the expression of Integrity across contexts to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a private example, an audio comparison or a fictional document. Confidentiality can justify
      different public wording while the underlying principle remains consistent.
  pause_conditions:
  - Pause Integrity across contexts when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Integrity across contexts practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Integrity across contexts situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
