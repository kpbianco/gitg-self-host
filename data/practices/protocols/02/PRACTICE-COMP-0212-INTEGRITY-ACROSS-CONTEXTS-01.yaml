  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Integrity across contexts explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Integrity across contexts context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Integrity across contexts observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Integrity across contexts rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Compare public, private and rewarded versions. Observed checks: Three
    incentive or audience conditions are compared; The principle has an observable expression; Any behavioral
    difference is identified precisely. Action 2: Examine the excuse and choose a consistent rule. Observed
    checks: The justification faces a reciprocal test; Relevant context is distinguished from convenience;
    A specific consistency correction is chosen. Action 3: Apply the correction where recognition is unnecessary.
    Observed checks: A correction is enacted or explicitly rehearsed; A later opportunity is checked when
    available; Recognition is not treated as the criterion of success.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Integrity was affirmed without comparing behavior across
    any different conditions.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Integrity
    across contexts contribution under typed evaluation; protocol performance remains distinct and is
    never counted twice.
