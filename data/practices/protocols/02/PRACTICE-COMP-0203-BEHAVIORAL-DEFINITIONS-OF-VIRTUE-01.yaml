      level for Behavioral definitions of virtue; assistive technology, interpretation, a support person,
      and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Behavioral definitions of virtue to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
