meaning_and_fit:
  purpose: Distinguish a virtue from its deficiency, excess and impressive-looking counterfeit.
  why_recommended: Distinguish a virtue from its deficiency, excess and impressive-looking counterfeit.
  claims:
  - statement: Distinguish a virtue from its deficiency, excess and impressive-looking counterfeit.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Virtue ethics attends to character and practical judgment; Aristotle's account distinguishes
      appropriate conduct from deficiency and excess.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-VIRTUE-ETHICS
    limitations: One normative tradition, not a universal character metric or empirical proof that the
      product's courage rehearsal develops virtue.
  applicability_question: Does a voluntary, bounded Behavioral definitions of virtue practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Behavioral definitions of virtue as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use text, a private recording or a supporter who helps communicate. Speaking
    loudly, acting alone and confronting authority are not requirements.
  opportunity_considerations: 'Use courage in a low-stakes correction: a shared note credits the wrong
    person. Work on paper or choose an equally safe ordinary situation.'
  prerequisites:
  - 'Use courage in a low-stakes correction: a shared note credits the wrong person. Work on paper or
    choose an equally safe ordinary situation.'
  dependencies: []
  safe_alternatives:
  - Use text, a private recording or a supporter who helps communicate. Speaking loudly, acting alone
    and confronting authority are not requirements.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Behavioral definitions of virtue differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Behavioral definitions of
    virtue as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use courage in a low-stakes correction: a shared note credits the wrong person. Work on paper
    or choose an equally safe ordinary situation. Goal: Distinguish a virtue from its deficiency, excess
    and impressive-looking counterfeit. Scope: Courage supplies a worked example of behavioral definition.
    Honesty, compassion, temperance and other virtues require their own distinctions and repeated practice.
    Time and effort: About 20 minutes to define the distinction and 10 minutes to rehearse or apply it.
    Adaptation: Use text, a private recording or a supporter who helps communicate. Speaking loudly, acting
    alone and confronting authority are not requirements. Keep personal working notes outside the check-in;
    record only the listed observations.


    Reference support:

    Introduction to Philosophy, 9.4 Virtue Ethics: https://openstax.org/books/introduction-philosophy/pages/9-4-virtue-ethics'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, a private recording or a supporter who helps communicate. Speaking loudly,
    acting alone and confronting authority are not requirements.
  expected_burden: About 20 minutes to define the distinction and 10 minutes to rehearse or apply it.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Behavioral definitions of virtue protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Behavioral definitions of virtue action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, a
    private recording or a supporter who helps communicate. Speaking loudly, acting alone and confronting
    authority are not requirements.
  actions:
  - stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01-A1
    sequence: 1
    title: Describe four different responses
    instructions: 'Describe silence despite a safe opportunity, a proportionate correction, an aggressive
      public accusation, and a dramatic correction designed mainly to attract praise. Explain why avoidance,
      recklessness and performance can all differ from courage. Include fear, purpose, evidence and proportionality
      in the distinction.


      Observation checks: Four responses differ in observable conduct; Purpose and proportionality are
      considered; Confidence or visibility alone does not define virtue. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01
      action_stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01-A1
      competency_stable_id: '02.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0203_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0203_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - four_responses_differ_in_observable_conduct
        - purpose_and_proportionality_are_considered
        - confidence_or_visibility_alone_does_not_define_virtue
      - measurement_id: c0203_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0203_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01-A2
    sequence: 2
    title: Write a behavioral standard that can fail
    instructions: 'Specify what a courageous correction would include: checking the credit, naming the
      discrepancy, using an appropriate channel and accepting a modest social cost. Name a condition that
      would make the same act unwise, such as uncertainty about the facts or a serious retaliation risk.


      Observation checks: The standard names concrete behavior; A possible cost is acknowledged; A counterexample
      or limiting condition is explicit. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01
      action_stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01-A2
      competency_stable_id: '02.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0203_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0203_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_standard_names_concrete_behavior
        - a_possible_cost_is_acknowledged
        - a_counterexample_or_limiting_condition_is_explicit
      - measurement_id: c0203_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0203_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01-A3
    sequence: 3
    title: Rehearse the proportionate response and correct it
    instructions: 'Speak or write the correction once, then compare it with your standard. Remove an accusation,
      unnecessary audience or claim you cannot support. If a real safe opportunity exists, act within
      your role; otherwise retain the rehearsal as evidence of preparation and state what live courage
      remains untested.


      Observation checks: A specific response is rehearsed or enacted; One weakness is corrected or deliberately
      checked; Rehearsal and live conduct remain distinct. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What observable feature distinguishes the virtue from merely looking brave?


      Examples: Supportive: The correction became factual and proportionate, with a clear account of the
      cost and its limits.


      Mixed: The response was direct but used an unnecessarily humiliating audience.


      Contradictory: Risk-taking or public dominance was treated as sufficient proof of courage.


      Inconclusive: Courage was described only with another abstract adjective.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01
      action_stable_id: PRACTICE-COMP-0203-BEHAVIORAL-DEFINITIONS-OF-VIRTUE-01-A3
      competency_stable_id: '02.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
