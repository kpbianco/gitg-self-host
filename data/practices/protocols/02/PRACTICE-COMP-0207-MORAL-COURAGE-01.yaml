        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Moral courage; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use writing, an agreed advocate or a fictional rehearsal. Declining unsafe confrontation is compatible
      with moral seriousness.
    cultural_context:
    - Adapt the expression of Moral courage to direct or indirect communication, collective or individual
      decision structures, local norms, faith or secular commitments, and role obligations while preserving
      consent and dignity.
    resource_variants:
    - Use writing, an agreed advocate or a fictional rehearsal. Declining unsafe confrontation is compatible
      with moral seriousness.
  pause_conditions:
  - Pause Moral courage when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Moral courage practice for harm, coercion, retaliation risk, emergency conditions, unsafe
    exposure, worsening symptoms, protected information, legal or policy conflict, or pressure to exceed
    the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Moral courage situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Moral courage actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0207_a1_primary
  - c0207_a1_boundary
  - c0207_a1_adverse
  - c0207_a2_primary
  - c0207_a2_boundary
  - c0207_a2_adverse
  - c0207_a3_primary
  - c0207_a3_boundary
  - c0207_a3_adverse
  adverse_or_contradictory_indicators:
  - An unverified accusation was escalated to prove bravery or to attract attention.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Moral courage explicitly; support can enable access and never reduces dignity or silently changes
    the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Moral courage context, action, role, pathway,
    and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Moral courage observation requires a distinct immutable origin; duplicate origins
    are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Moral courage rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Name the concern, evidence and possible cost. Observed checks: The concern
    has factual support; Affected people and uncertainty are considered; The anticipated cost and moral
    purpose are distinct. Action 2: Choose the least harmful effective intervention. Observed checks:
    The channel fits the issue and risk; The request is specific and proportionate; The affected person''s
    preferences are respected. Action 3: Review outcome and responsibility after speaking. Observed checks:
    Action and outcome are separately recorded; Unintended costs are examined; Further action has a proportionate
    reason.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A stand was imagined but no action or explicit rehearsal
    was carried out.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Moral
    courage contribution under typed evaluation; protocol performance remains distinct and is never counted
    twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L02
  - L25
  - L30
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Moral courage evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - 'Action 1: Name the concern, evidence and possible cost. Observed checks: The concern has factual
    support; Affected people and uncertainty are considered; The anticipated cost and moral purpose are
    distinct.'
  - 'Action 2: Choose the least harmful effective intervention. Observed checks: The channel fits the
    issue and risk; The request is specific and proportionate; The affected person''s preferences are
    respected.'
  - 'Action 3: Review outcome and responsibility after speaking. Observed checks: Action and outcome are
    separately recorded; Unintended costs are examined; Further action has a proportionate reason.'
  - For minimum completion, finish at least 2 of these 3 actions and record a meaningful observation,
    then explicitly submit your final review. Finish every action for full completion. Deferral and N/A
    are not completed actions.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0207_a1_primary
    - c0207_a2_primary
    - c0207_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Did the stand serve the affected person or principle, and what would make the
    method wiser next time?
  transfer_limit: One low-stakes stand practices moral courage and practical judgment. It does not test
    action under serious threat or require confrontation to prove character.
  reflection:
    before: 'What would count as doing this honestly? Goal: Act on a defensible moral concern despite
      modest discomfort, then review whether the action helped.'
    during: Which checks have actually been observed? The concern was valid but the chosen public channel
      embarrassed the person it was intended to help.
    after: Did the stand serve the affected person or principle, and what would make the method wiser
      next time?
  review_guidance:
    repeat: Repeat the same bounded Moral courage design only when the context and burden remain appropriate.
    adapt: Use writing, an agreed advocate or a fictional rehearsal. Declining unsafe confrontation is
      compatible with moral seriousness.
    stop: Stop Moral courage when the practice becomes coercive, unsafe, privacy-invasive, role-inappropriate,
      professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A factual private request corrected missing credit while allowing an honest mistake to
      be acknowledged.
    mixed: The concern was valid but the chosen public channel embarrassed the person it was intended
      to help.
    contradictory: An unverified accusation was escalated to prove bravery or to attract attention.
    inconclusive: A stand was imagined but no action or explicit rehearsal was carried out.
