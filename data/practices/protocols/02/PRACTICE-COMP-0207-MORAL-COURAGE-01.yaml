meaning_and_fit:
  purpose: Act on a defensible moral concern despite modest discomfort, then review whether the action
    helped.
  why_recommended: Act on a defensible moral concern despite modest discomfort, then review whether the
    action helped.
  claims:
  - statement: Act on a defensible moral concern despite modest discomfort, then review whether the action
      helped.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Moral courage practice fit the person's current role,
    pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Moral courage as not applicable, consciously unchosen, or deferred without
    penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use writing, an agreed advocate or a fictional rehearsal. Declining unsafe
    confrontation is compatible with moral seriousness.
  opportunity_considerations: Choose a safely correctable issue, such as omitted credit in a shared document.
    Check facts and authority first; use a fictional case when speaking could threaten safety, livelihood
    or essential support.
  prerequisites:
  - Choose a safely correctable issue, such as omitted credit in a shared document. Check facts and authority
    first; use a fictional case when speaking could threaten safety, livelihood or essential support.
  dependencies: []
  safe_alternatives:
  - Use writing, an agreed advocate or a fictional rehearsal. Declining unsafe confrontation is compatible
    with moral seriousness.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Moral courage differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Moral courage as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a safely correctable issue, such as omitted credit in a shared document. Check facts
    and authority first; use a fictional case when speaking could threaten safety, livelihood or essential
    support. Goal: Act on a defensible moral concern despite modest discomfort, then review whether the
    action helped. Scope: One low-stakes stand practices moral courage and practical judgment. It does
    not test action under serious threat or require confrontation to prove character. Time and effort:
    About 15 minutes of preparation, one short intervention, and 10 minutes of review. Adaptation: Use
    writing, an agreed advocate or a fictional rehearsal. Declining unsafe confrontation is compatible
    with moral seriousness. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, an agreed advocate or a fictional rehearsal. Declining unsafe confrontation
    is compatible with moral seriousness.
  expected_burden: About 15 minutes of preparation, one short intervention, and 10 minutes of review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Moral courage protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Moral courage action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    an agreed advocate or a fictional rehearsal. Declining unsafe confrontation is compatible with moral
    seriousness.
  actions:
  - stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01-A1
    sequence: 1
    title: Name the concern, evidence and possible cost
    instructions: 'Describe the unfairness in concrete terms, who is affected, what supports your account
      and what remains uncertain. Name the cost you fear, such as an awkward conversation. Distinguish
      moral purpose from a wish to win an argument, punish someone or appear brave.


      Observation checks: The concern has factual support; Affected people and uncertainty are considered;
      The anticipated cost and moral purpose are distinct. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01
      action_stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01-A1
      competency_stable_id: '02.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0207_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0207_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_concern_has_factual_support
        - affected_people_and_uncertainty_are_considered
        - the_anticipated_cost_and_moral_purpose_are_distinct
      - measurement_id: c0207_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0207_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01-A2
    sequence: 2
    title: Choose the least harmful effective intervention
    instructions: 'Use a proportionate channel: ask the document owner to check missing credit, offer
      a factual correction or request clarification privately. Keep the affected person''s preferences
      in view and avoid exposing them without agreement. State the request calmly and leave room for correction
      of your own facts.


      Observation checks: The channel fits the issue and risk; The request is specific and proportionate;
      The affected person''s preferences are respected. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01
      action_stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01-A2
      competency_stable_id: '02.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0207_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0207_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_channel_fits_the_issue_and_risk
        - the_request_is_specific_and_proportionate
        - the_affected_person_s_preferences_are_respected
      - measurement_id: c0207_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0207_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01-A3
    sequence: 3
    title: Review outcome and responsibility after speaking
    instructions: 'Record what you actually did, how the issue changed and whether your intervention caused
      an avoidable cost. Correct your own error if needed. Decide whether a follow-up, different channel
      or no further action is warranted; resistance alone does not prove your stand was wise.


      Observation checks: Action and outcome are separately recorded; Unintended costs are examined; Further
      action has a proportionate reason. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Did the stand serve the affected person or principle, and what would make the method
      wiser next time?


      Examples: Supportive: A factual private request corrected missing credit while allowing an honest
      mistake to be acknowledged.


      Mixed: The concern was valid but the chosen public channel embarrassed the person it was intended
      to help.


      Contradictory: An unverified accusation was escalated to prove bravery or to attract attention.


      Inconclusive: A stand was imagined but no action or explicit rehearsal was carried out.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01
      action_stable_id: PRACTICE-COMP-0207-MORAL-COURAGE-01-A3
      competency_stable_id: '02.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
