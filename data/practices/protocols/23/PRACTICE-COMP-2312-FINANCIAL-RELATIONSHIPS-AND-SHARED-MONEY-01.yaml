completion_and_review:
  completion_criteria:
  - The identify the non-emergency boundary for financial relationships and shared money action was attempted
    or explicitly deferred.
  - The prepare one safe financial relationships and shared money support step action was attempted or
    explicitly deferred.
  - The review the financial relationships and shared money plan against stop conditions action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2312_a1_primary
    - c2312_a2_primary
    - c2312_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Financial relationships and shared money only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Financial relationships and shared money across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Financial relationships and shared money require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Financial relationships and shared money criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Shared financial expectations and decision rights are explicit
      and reviewable.', what contradiction or missing context matters most, and should this Financial
      relationships and shared money design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Financial relationships and shared money design only when the context
      and burden remain appropriate.
    adapt: Change the Financial relationships and shared money medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Financial relationships and shared money when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Financial relationships and shared money
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Financial relationships and shared money criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Financial relationships and shared money criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Financial relationships and shared money criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Financial relationships and shared money action was deferred, not observed, not
      applicable, stale, insufficiently bounded, or too confounded to interpret.
