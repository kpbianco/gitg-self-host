    c2309_a2_boundary: Action 2 stayed inside its stated Family and intergenerational stewardship boundary
    c2309_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c2309_a3_primary: The bounded Family and intergenerational stewardship criterion for action 3 was
      observed
    c2309_a3_boundary: Action 3 stayed inside its stated Family and intergenerational stewardship boundary
    c2309_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record shows what happened in one limited Family and intergenerational
    stewardship practice, including support, contradiction, defer, no result, or harm.
