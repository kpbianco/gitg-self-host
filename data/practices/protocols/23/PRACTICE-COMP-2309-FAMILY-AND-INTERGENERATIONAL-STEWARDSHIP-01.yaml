    c2309_a1_boundary: Action 1 stayed inside its stated Family and intergenerational stewardship boundary
    c2309_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c2309_a2_primary: The bounded Family and intergenerational stewardship criterion for action 2 was
