    sequence: 1
    title: Bound the qualified question for Family and intergenerational stewardship
    instructions: 'Turn Family and intergenerational stewardship into one educational or planning question
      and identify the qualification and jurisdiction needed to answer it. Use the canonical scope to
      separate general learning from diagnosis, treatment, legal advice, financial advice, safeguarding
      decisions, or other professional judgment: Plan for children, elders, education, inheritance, shared
      property, and financial teaching.'
    expected_time: 15-25 minutes
