  - c2307_a3_adverse
  adverse_or_contradictory_indicators:
  - The Consumption, status, and enoughness action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Consumption, status, and enoughness criterion, depended on
    coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Consumption, status, and enoughness explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Consumption, status, and enoughness context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Consumption, status, and enoughness observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Consumption, status, and enoughness rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Reduces impulsive or status-driven spending without treating all comfort as vice.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Consumption, status, and enoughness requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: This package is non-scored and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Consumption,
    status, and enoughness evidence only under offline typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L05
  - L09
  - L21
  - L36
  minimum_evidence_before_state_update: No current-state update is permitted for this Consumption, status,
    and enoughness draft under SP-NON-SCORED-REFLECTION, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Consumption, status, and enoughness evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The bound the qualified question for consumption, status, and enoughness action was attempted or explicitly
    deferred.
  - The prepare minimum information for consumption, status, and enoughness action was attempted or explicitly
    deferred.
  - The record a bounded consumption, status, and enoughness disposition action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2307_a1_primary
    - c2307_a2_primary
    - c2307_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Consumption, status, and enoughness only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Consumption, status, and enoughness across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Consumption, status, and enoughness require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Consumption, status, and enoughness criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Reduces impulsive or status-driven spending without treating
      all comfort as vice.', what contradiction or missing context matters most, and should this Consumption,
      status, and enoughness design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Consumption, status, and enoughness design only when the context and
      burden remain appropriate.
    adapt: Change the Consumption, status, and enoughness medium, scope, support, timing, criteria, or
      context while preserving provenance and the narrower evidence claim.
    stop: Stop Consumption, status, and enoughness when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Consumption, status, and enoughness questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Consumption, status, and enoughness criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Consumption, status, and enoughness criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Consumption, status, and enoughness criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Consumption, status, and enoughness action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
