  - stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01-A1
    sequence: 1
    title: Bound the qualified question for Consumption, status, and enoughness
    instructions: 'Turn Consumption, status, and enoughness into one educational or planning question
      and identify the qualification and jurisdiction needed to answer it. Use the canonical scope to
      separate general learning from diagnosis, treatment, legal advice, financial advice, safeguarding
      decisions, or other professional judgment: Purchase according to purpose, durability, total cost,
      maintenance, and actual enjoyment.'
    expected_time: 15-25 minutes
    due_within_days: 3
