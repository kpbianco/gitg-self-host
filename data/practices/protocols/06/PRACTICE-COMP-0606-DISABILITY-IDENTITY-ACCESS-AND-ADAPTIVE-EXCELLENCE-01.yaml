meaning_and_fit:
  purpose: Use medical, social and identity perspectives to understand disability, request an appropriate
    accommodation, and define success by chosen participation rather than unsupported performance.
  why_recommended: Use medical, social and identity perspectives to understand disability, request an
    appropriate accommodation, and define success by chosen participation rather than unsupported performance.
  claims:
  - statement: Use medical, social and identity perspectives to understand disability, request an appropriate
      accommodation, and define success by chosen participation rather than unsupported performance.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Disability involves interaction between health conditions and personal or environmental
      factors; inaccessible environments and negative attitudes can obstruct participation.
    classification: professional_or_public_standard
    source_ids:
    - SRC-WHO-DISABILITY-AND-BARRIERS
    limitations: Conceptual and inclusion support only. It does not assign an identity, establish a local
      legal entitlement or prove that a proposed accommodation works for a particular person.
  applicability_question: Does a voluntary, bounded Disability identity, access, and adaptive excellence
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Disability identity, access, and adaptive excellence as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Dictate the request or use a chosen advocate while retaining the affected
    person's preferences. A person without a current access need can analyze the supplied case without
    pretending to have the experience. No disability simulation, forced disclosure, removal of accommodation
    or expensive purchase is required.
  opportunity_considerations: 'Use a real event you want to access, or this supplied case: an advertised
    community talk mentions only stairs, long standing periods and spoken questions. A participant wants
    to understand the talk and contribute a question using a suitable format. Read the WHO disability
    overview. Do not simulate an impairment or remove an existing aid.'
  prerequisites:
  - 'Use a real event you want to access, or this supplied case: an advertised community talk mentions
    only stairs, long standing periods and spoken questions. A participant wants to understand the talk
    and contribute a question using a suitable format. Read the WHO disability overview. Do not simulate
    an impairment or remove an existing aid.'
  dependencies: []
  safe_alternatives:
  - Dictate the request or use a chosen advocate while retaining the affected person's preferences. A
    person without a current access need can analyze the supplied case without pretending to have the
    experience. No disability simulation, forced disclosure, removal of accommodation or expensive purchase
    is required.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Disability identity, access, and adaptive excellence differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Disability identity, access,
    and adaptive excellence as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a real event you want to access, or this supplied case: an advertised community talk mentions
    only stairs, long standing periods and spoken questions. A participant wants to understand the talk
    and contribute a question using a suitable format. Read the WHO disability overview. Do not simulate
    an impairment or remove an existing aid. Goal: Use medical, social and identity perspectives to understand
    disability, request an appropriate accommodation, and define success by chosen participation rather
    than unsupported performance. Scope: One access case illustrates distinct perspectives and a concrete
    request. It does not certify accessibility, determine legal eligibility, or assign a disability identity
    to anyone. Time and effort: About 20 minutes to examine the case, one request or draft, and a short
    review of the response or supplied variation. Adaptation: Dictate the request or use a chosen advocate
    while retaining the affected person''s preferences. A person without a current access need can analyze
    the supplied case without pretending to have the experience. No disability simulation, forced disclosure,
    removal of accommodation or expensive purchase is required. Keep personal working notes outside the
    check-in; record only the listed observations.


    Reference support:

    Disability: https://www.who.int/health-topics/disability'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Dictate the request or use a chosen advocate while retaining the affected person's
    preferences. A person without a current access need can analyze the supplied case without pretending
    to have the experience. No disability simulation, forced disclosure, removal of accommodation or expensive
    purchase is required.
  expected_burden: About 20 minutes to examine the case, one request or draft, and a short review of the
    response or supplied variation.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Disability identity, access, and adaptive excellence protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Disability identity, access, and adaptive excellence action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Dictate the
    request or use a chosen advocate while retaining the affected person's preferences. A person without
    a current access need can analyze the supplied case without pretending to have the experience. No
    disability simulation, forced disclosure, removal of accommodation or expensive purchase is required.
  actions:
  - stable_id: PRACTICE-COMP-0606-DISABILITY-IDENTITY-ACCESS-AND-ADAPTIVE-EXCELLENCE-01-A1
    sequence: 1
    title: Examine the same barrier through three different perspectives
    instructions: 'Write three short accounts. A medical perspective asks about relevant function, symptoms
      and individual care needs; a social perspective asks how stairs, standing and one communication
      format restrict participation; an identity perspective asks how the person understands and wishes
      to describe their own experience. Each can matter without one erasing the others. Identify the goal
      of understanding and asking a question, then choose one barrier to address. For a real case, use
      only information the affected person chooses to share; access needs do not authorize guessing a
      diagnosis or imposing a label.


      Observation checks: Medical social and identity perspectives are distinguished; A specific environmental
      or participation barrier is selected; The person''s chosen goal is explicit; No diagnosis or identity
      is assigned from an access need. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0606-DISABILITY-IDENTITY-ACCESS-AND-ADAPTIVE-EXCELLENCE-01
      action_stable_id: PRACTICE-COMP-0606-DISABILITY-IDENTITY-ACCESS-AND-ADAPTIVE-EXCELLENCE-01-A1
      competency_stable_id: '06.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0606_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0606_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - medical_social_and_identity_perspectives_are_distinguished
        - a_specific_environmental_or_participation_barrier_is_selected
        - the_person_s_chosen_goal_is_explicit
        - no_diagnosis_or_identity_is_assigned_from_an_access_need
      - measurement_id: c0606_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0606_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0606-DISABILITY-IDENTITY-ACCESS-AND-ADAPTIVE-EXCELLENCE-01-A2
    sequence: 2
    title: Write an access request with a concrete usable alternative
    instructions: 'Use this structure: I would like to participate in the talk. The standing-only format
      prevents that for me; can seating be available with the same view and a way to submit a question?
      Replace the barrier and requested change with the actual need. Ask who can confirm the arrangement
      and by when, and identify what remains unknown rather than assuming a promise. Offer a suitable
      alternative such as equivalent remote participation if it genuinely serves the goal. Drafting is
      sufficient for the supplied case; a real request is sent only with the affected person''s agreement.
      Local rights and formal documentation requirements need appropriate local guidance.


      Observation checks: The request connects a barrier to a participation goal; The proposed change
      is specific enough to answer; Responsibility and confirmation timing are requested; Disclosure and
      any real contact remain the person''s choice. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0606-DISABILITY-IDENTITY-ACCESS-AND-ADAPTIVE-EXCELLENCE-01
      action_stable_id: PRACTICE-COMP-0606-DISABILITY-IDENTITY-ACCESS-AND-ADAPTIVE-EXCELLENCE-01-A2
      competency_stable_id: '06.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0606_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0606_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_request_connects_a_barrier_to_a_participation_goal
        - the_proposed_change_is_specific_enough_to_answer
        - responsibility_and_confirmation_timing_are_requested
        - disclosure_and_any_real_contact_remain_the_person_s_choice
      - measurement_id: c0606_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0606_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0606-DISABILITY-IDENTITY-ACCESS-AND-ADAPTIVE-EXCELLENCE-01-A3
    sequence: 3
    title: Evaluate the arrangement against the chosen function
    instructions: 'Define success as access to the content and a usable way to ask a question, not standing
      for the entire event or appearing independent. Examine an actual response, or this variation: seating
      is offered but placed where the talk cannot be heard. State which barrier is reduced, what still
      blocks participation and what clarification is needed. If an appropriate arrangement is used, record
      the actual result; an organizer''s assurance alone is not evidence that it worked. Retain the person''s
      preferred description and consider whether another request or a different format is warranted.


      Observation checks: Success is defined by chosen function and values; A response or supplied variation
      is actually evaluated; Partial access is distinguished from effective participation; Any live result
      is distinguished from an assurance or draft. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which perspective helped reveal the barrier, what would confirm a usable change, and
      what remains unresolved? Excellence can include skilled use of support; this exercise cannot decide
      another person''s identity, legal entitlement or overall ability.


      Examples: Supportive: A request specified seating with a usable view and question format; the response
      was checked against those functions rather than mere attendance.


      Mixed: Seating was available but the audio was inaccessible, so the arrangement was recognized as
      partial and a further change was requested.


      Contradictory: The person was told to prove commitment by managing without an aid, or participation
      was celebrated while the actual access barrier remained.


      Inconclusive: The learner endorsed inclusion in general but identified neither a concrete barrier
      nor a request someone could answer.'
    expected_time: 15-25 minutes
    due_within_days: 10
