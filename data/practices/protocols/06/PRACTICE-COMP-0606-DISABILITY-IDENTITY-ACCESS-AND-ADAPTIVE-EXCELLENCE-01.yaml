  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Disability identity, access, and adaptive excellence; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Dictate the request or use a chosen advocate while retaining the affected person's preferences.
      A person without a current access need can analyze the supplied case without pretending to have
      the experience. No disability simulation, forced disclosure, removal of accommodation or expensive
      purchase is required.
    cultural_context:
    - Adapt the expression of Disability identity, access, and adaptive excellence to direct or indirect
      communication, collective or individual decision structures, local norms, faith or secular commitments,
      and role obligations while preserving consent and dignity.
    resource_variants:
    - Dictate the request or use a chosen advocate while retaining the affected person's preferences.
      A person without a current access need can analyze the supplied case without pretending to have
      the experience. No disability simulation, forced disclosure, removal of accommodation or expensive
      purchase is required.
  pause_conditions:
  - Pause Disability identity, access, and adaptive excellence when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Disability identity, access, and adaptive excellence practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Disability identity, access, and adaptive excellence situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
