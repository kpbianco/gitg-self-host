meaning_and_fit:
  purpose: Recognize variation in attention, sensory processing, communication, executive function, learning
    and regulation, then test a support suited to a specific task without imposing a diagnostic stereotype.
  why_recommended: Recognize variation in attention, sensory processing, communication, executive function,
    learning and regulation, then test a support suited to a specific task without imposing a diagnostic
    stereotype.
  claims:
  - statement: Recognize variation in attention, sensory processing, communication, executive function,
      learning and regulation, then test a support suited to a specific task without imposing a diagnostic
      stereotype.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Cognitive access needs vary across functions, and clear structure, understandable language,
      predictable interaction and suitable formats can address design barriers.
    classification: professional_or_public_standard
    source_ids:
    - SRC-W3C-COGNITIVE-ACCESS-NEEDS
    limitations: Web-accessibility guidance, not a diagnostic taxonomy or a guarantee that the product's
      support works for every neurodivergent person. A self-check is not a full accessibility audit or
      representative user testing.
  applicability_question: Does a voluntary, bounded Neurodiversity and cognitive variation practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Neurodiversity and cognitive variation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use spoken, visual, tactile or assistive communication that already works
    for the person. One short use may be enough to identify a problem; do not create overload for evidence.
    A trusted helper can take notes with permission. Significant unmet needs may warrant qualified assessment,
    but an exercise does not require a diagnostic label.
  opportunity_considerations: 'Use the supplied instruction: choose a time for a short catch-up, identify
    one question to discuss, and note how a change of plan will be communicated. Use an existing comfortable
    note or communication tool. Read the W3C cognitive-accessibility reference for examples of varied
    needs and design barriers. No diagnosis or disclosure is required.'
  prerequisites:
  - 'Use the supplied instruction: choose a time for a short catch-up, identify one question to discuss,
    and note how a change of plan will be communicated. Use an existing comfortable note or communication
    tool. Read the W3C cognitive-accessibility reference for examples of varied needs and design barriers.
    No diagnosis or disclosure is required.'
  dependencies: []
  safe_alternatives:
  - Use spoken, visual, tactile or assistive communication that already works for the person. One short
    use may be enough to identify a problem; do not create overload for evidence. A trusted helper can
    take notes with permission. Significant unmet needs may warrant qualified assessment, but an exercise
    does not require a diagnostic label.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Neurodiversity and cognitive variation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Neurodiversity and cognitive
    variation as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied instruction: choose a time for a short catch-up, identify one question to discuss,
    and note how a change of plan will be communicated. Use an existing comfortable note or communication
    tool. Read the W3C cognitive-accessibility reference for examples of varied needs and design barriers.
    No diagnosis or disclosure is required. Goal: Recognize variation in attention, sensory processing,
    communication, executive function, learning and regulation, then test a support suited to a specific
    task without imposing a diagnostic stereotype. Scope: A small task comparison examines whether a support
    is useful in that context. It does not diagnose neurodivergence, measure intelligence or require suppressing
    harmless differences to look typical. Time and effort: About 15 minutes to map the task and two short
    ordinary uses with a 10-minute comparison. Adaptation: Use spoken, visual, tactile or assistive communication
    that already works for the person. One short use may be enough to identify a problem; do not create
    overload for evidence. A trusted helper can take notes with permission. Significant unmet needs may
    warrant qualified assessment, but an exercise does not require a diagnostic label. Keep personal working
    notes outside the check-in; record only the listed observations.


    Reference support:

    Cognitive and learning in Diverse Abilities and Barriers: https://www.w3.org/WAI/people-use-web/abilities-barriers/cognitive/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use spoken, visual, tactile or assistive communication that already works for the
    person. One short use may be enough to identify a problem; do not create overload for evidence. A
    trusted helper can take notes with permission. Significant unmet needs may warrant qualified assessment,
    but an exercise does not require a diagnostic label.
  expected_burden: About 15 minutes to map the task and two short ordinary uses with a 10-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Neurodiversity and cognitive variation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Neurodiversity and cognitive variation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use spoken,
    visual, tactile or assistive communication that already works for the person. One short use may be
    enough to identify a problem; do not create overload for evidence. A trusted helper can take notes
    with permission. Significant unmet needs may warrant qualified assessment, but an exercise does not
    require a diagnostic label.
  actions:
  - stable_id: PRACTICE-COMP-0607-NEURODIVERSITY-AND-COGNITIVE-VARIATION-01-A1
    sequence: 1
    title: Locate the obstacle before choosing a label or solution
    instructions: 'Examine six task demands: attention involves keeping the relevant step in view; sensory
      processing concerns distracting or uncomfortable input; social communication concerns interpreting
      an unclear request; executive function concerns starting, ordering and switching steps; learning
      concerns understanding and retaining the method; regulation concerns noticing overload and taking
      an appropriate pause. For each, record an observed difficulty, a useful support already present
      or unknown. Choose one specific mismatch, such as losing the next step in a long message. Do not
      infer an entire profile from a single difficulty or assume that a diagnostic label predicts everyone''s
      strengths and needs.


      Observation checks: Six cognitive task demands are considered; Observation and unknowns remain distinct;
      One specific task mismatch is chosen; A difficulty is not turned into a diagnosis or global deficit.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0607-NEURODIVERSITY-AND-COGNITIVE-VARIATION-01
      action_stable_id: PRACTICE-COMP-0607-NEURODIVERSITY-AND-COGNITIVE-VARIATION-01-A1
      competency_stable_id: '06.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0607_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0607_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - six_cognitive_task_demands_are_considered
        - observation_and_unknowns_remain_distinct
        - one_specific_task_mismatch_is_chosen
        - a_difficulty_is_not_turned_into_a_diagnosis_or_global_deficit
      - measurement_id: c0607_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0607_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0607-NEURODIVERSITY-AND-COGNITIVE-VARIATION-01-A2
    sequence: 2
    title: Create a support that changes the task rather than judging the person
    instructions: 'For the default mismatch, rewrite the instruction as three short entries labeled time,
      question and change of plan; add a visible next-step marker. If another mismatch was actually observed,
      choose one suitable alternative: reduce an unwanted notification, offer text instead of ambiguous
      speech, supply an example, or allow an agreed pause. State what the support is expected to make
      easier and keep other helpful supports in place. Do not aim for compulsory eye contact, stillness,
      faster work or concealment of an identity. If helping someone else, ask which change they want instead
      of assigning it from a label.


      Observation checks: The support addresses the selected mismatch; Its intended practical effect is
      stated; Existing useful supports are preserved; Affected people choose rather than receive a stereotyped
      intervention. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0607-NEURODIVERSITY-AND-COGNITIVE-VARIATION-01
      action_stable_id: PRACTICE-COMP-0607-NEURODIVERSITY-AND-COGNITIVE-VARIATION-01-A2
      competency_stable_id: '06.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0607_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0607_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_support_addresses_the_selected_mismatch
        - its_intended_practical_effect_is_stated
        - existing_useful_supports_are_preserved
        - affected_people_choose_rather_than_receive_a_stereotyped_intervention
      - measurement_id: c0607_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0607_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0607-NEURODIVERSITY-AND-COGNITIVE-VARIATION-01-A3
    sequence: 3
    title: Try the supported format and look for cost as well as benefit
    instructions: 'Use the supported format to prepare one ordinary catch-up plan, then use it again on
      another suitable occasion without removing the support to create a control condition. Compare with
      the earlier observed difficulty or existing notes: was the next step easier to find, did needed
      information remain, and did the support create extra work or distraction? If the original difficulty
      was not observed, record only whether the supplied format was usable. Keep mixed results and avoid
      a claim that one trial explains an entire cognitive profile. Retain, revise or stop the support
      based on the actual task and the person''s preference.


      Observation checks: The support receives an actual task-based use; Benefit and burden are both examined;
      Comparison does not require removing needed assistance; The conclusion stays within the observed
      task and person. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What particular mismatch did the support address, what did it cost, and does the person
      want to keep it? Describe an observed function without romanticizing impairment, treating every
      difference as illness or claiming a general cognitive improvement.


      Examples: Supportive: Three labeled entries made the next step findable during two ordinary plans,
      and the person chose to keep the format without a diagnostic claim.


      Mixed: The next-step marker helped but excessive reminders created distraction, so the reminder
      was removed while the useful structure stayed.


      Contradictory: A label was used to assign a stereotyped strength, or the trial rewarded appearing
      typical instead of making the task accessible.


      Inconclusive: A support was proposed but never used, or a profile was inferred from a difficulty
      that had not actually been observed.'
