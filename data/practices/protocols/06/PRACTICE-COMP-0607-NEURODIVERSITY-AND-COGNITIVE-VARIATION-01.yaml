  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Neurodiversity and cognitive variation; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use spoken, visual, tactile or assistive communication that already works for the person. One short
      use may be enough to identify a problem; do not create overload for evidence. A trusted helper can
      take notes with permission. Significant unmet needs may warrant qualified assessment, but an exercise
      does not require a diagnostic label.
    cultural_context:
    - Adapt the expression of Neurodiversity and cognitive variation to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use spoken, visual, tactile or assistive communication that already works for the person. One short
      use may be enough to identify a problem; do not create overload for evidence. A trusted helper can
      take notes with permission. Significant unmet needs may warrant qualified assessment, but an exercise
      does not require a diagnostic label.
  pause_conditions:
  - Pause Neurodiversity and cognitive variation when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Neurodiversity and cognitive variation practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Neurodiversity and cognitive variation situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
