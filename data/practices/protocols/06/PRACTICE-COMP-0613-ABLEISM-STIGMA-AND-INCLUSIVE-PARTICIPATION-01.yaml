meaning_and_fit:
  purpose: Recognize ableist stereotypes, stigma, inaccessible defaults and unequal treatment, then change
    language and participation arrangements within your authority.
  why_recommended: Recognize ableist stereotypes, stigma, inaccessible defaults and unequal treatment,
    then change language and participation arrangements within your authority.
  claims:
  - statement: Recognize ableist stereotypes, stigma, inaccessible defaults and unequal treatment, then
      change language and participation arrangements within your authority.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Disability involves interaction between health conditions and personal or environmental
      factors; inaccessible environments and negative attitudes can obstruct participation.
    classification: professional_or_public_standard
    source_ids:
    - SRC-WHO-DISABILITY-AND-BARRIERS
    limitations: Conceptual and inclusion support only. It does not assign an identity, establish a local
      legal entitlement or prove that a proposed accommodation works for a particular person.
  applicability_question: Does a voluntary, bounded Ableism, stigma, and inclusive participation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Ableism, stigma, and inclusive participation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a private invitation, small group or fictional notice if you lack policy
    authority. Work in the person's preferred language and format. No disability simulation, public confrontation,
    compulsory disclosure or claim that good intentions prove access is required. Formal legal questions
    need relevant local expertise.
  opportunity_considerations: 'Use this fictional club notice: Everyone must stand to introduce themselves;
    special seating is available only after explaining your condition to the group. Members who overcome
    disability will be celebrated as an inspiration. Work on a private replacement, or choose a similarly
    manageable notice or invitation you have authority to change. No actual person supplies a diagnosis
    or an inspirational story.'
  prerequisites:
  - 'Use this fictional club notice: Everyone must stand to introduce themselves; special seating is available
    only after explaining your condition to the group. Members who overcome disability will be celebrated
    as an inspiration. Work on a private replacement, or choose a similarly manageable notice or invitation
    you have authority to change. No actual person supplies a diagnosis or an inspirational story.'
  dependencies: []
  safe_alternatives:
  - Use a private invitation, small group or fictional notice if you lack policy authority. Work in the
    person's preferred language and format. No disability simulation, public confrontation, compulsory
    disclosure or claim that good intentions prove access is required. Formal legal questions need relevant
    local expertise.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Ableism, stigma, and inclusive participation differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Ableism, stigma, and inclusive
    participation as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional club notice: Everyone must stand to introduce themselves; special seating
    is available only after explaining your condition to the group. Members who overcome disability will
    be celebrated as an inspiration. Work on a private replacement, or choose a similarly manageable notice
    or invitation you have authority to change. No actual person supplies a diagnosis or an inspirational
    story. Goal: Recognize ableist stereotypes, stigma, inaccessible defaults and unequal treatment, then
    change language and participation arrangements within your authority. Scope: One invitation or participation
    rule is revised and checked against concrete cases. This is a bounded inclusion improvement, not a
    legal finding about discrimination or certification of an organization''s accessibility. Time and
    effort: About 15 minutes to analyze, 20 minutes to replace the default, and a short review. Adaptation:
    Use a private invitation, small group or fictional notice if you lack policy authority. Work in the
    person''s preferred language and format. No disability simulation, public confrontation, compulsory
    disclosure or claim that good intentions prove access is required. Formal legal questions need relevant
    local expertise. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Disability: https://www.who.int/health-topics/disability'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a private invitation, small group or fictional notice if you lack policy authority.
    Work in the person's preferred language and format. No disability simulation, public confrontation,
    compulsory disclosure or claim that good intentions prove access is required. Formal legal questions
    need relevant local expertise.
  expected_burden: About 15 minutes to analyze, 20 minutes to replace the default, and a short review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Ableism, stigma, and inclusive participation protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Ableism, stigma, and inclusive participation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a private
    invitation, small group or fictional notice if you lack policy authority. Work in the person's preferred
    language and format. No disability simulation, public confrontation, compulsory disclosure or claim
    that good intentions prove access is required. Formal legal questions need relevant local expertise.
  actions:
  - stable_id: PRACTICE-COMP-0613-ABLEISM-STIGMA-AND-INCLUSIVE-PARTICIPATION-01-A1
    sequence: 1
    title: Identify what the wording makes people do or disclose
    instructions: 'Mark five problems in the notice: a stereotype about the right way to participate,
      stigma attached to asking for support, compelled personal disclosure, an inaccessible standing-and-speaking
      default, and an inspiration story imposed on a person. For each, explain its likely practical effect
      rather than merely labeling the writer bad. Separate intent from the rule''s consequences and identify
      who controls the change. Ask what the club actually needs from an introduction, such as a preferred
      name and an optional interest, and which demands do not serve that purpose.


      Observation checks: Five distinct exclusion mechanisms are examined; Each mechanism is linked to
      a practical participation effect; The legitimate purpose is separated from unnecessary demands;
      Authority to change the notice or only propose a change is stated. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0613-ABLEISM-STIGMA-AND-INCLUSIVE-PARTICIPATION-01
      action_stable_id: PRACTICE-COMP-0613-ABLEISM-STIGMA-AND-INCLUSIVE-PARTICIPATION-01-A1
      competency_stable_id: '06.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0613_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0613_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - five_distinct_exclusion_mechanisms_are_examined
        - each_mechanism_is_linked_to_a_practical_participation_effect
        - the_legitimate_purpose_is_separated_from_unnecessary_demands
        - authority_to_change_the_notice_or_only_propose_a_change_is_stated
      - measurement_id: c0613_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0613_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0613-ABLEISM-STIGMA-AND-INCLUSIVE-PARTICIPATION-01-A2
    sequence: 2
    title: Write a replacement that makes ordinary participation possible
    instructions: 'Produce a complete invitation: You may introduce yourself seated, standing, in writing,
      through your usual communication method, or pass. Share the name and interest you choose. Ask the
      organizer privately about access arrangements; personal medical details are not part of the group
      introduction. Remove the compulsory inspiration feature and offer recognition for chosen contributions
      only with consent. For an actual event, include a real contact route and only access arrangements
      that can be delivered; identify anything still unconfirmed. A private draft must remain labeled
      a proposal until the responsible person adopts it.


      Observation checks: A complete replacement notice is produced; Participation has usable choices
      including passing; Medical disclosure and inspirational storytelling are not required; Any real
      access promise is within authority and confirmed. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0613-ABLEISM-STIGMA-AND-INCLUSIVE-PARTICIPATION-01
      action_stable_id: PRACTICE-COMP-0613-ABLEISM-STIGMA-AND-INCLUSIVE-PARTICIPATION-01-A2
      competency_stable_id: '06.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0613_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0613_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_complete_replacement_notice_is_produced
        - participation_has_usable_choices_including_passing
        - medical_disclosure_and_inspirational_storytelling_are_not_required
        - any_real_access_promise_is_within_authority_and_confirmed
      - measurement_id: c0613_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0613_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0613-ABLEISM-STIGMA-AND-INCLUSIVE-PARTICIPATION-01-A3
    sequence: 3
    title: Check inclusion through two different participation needs
    instructions: 'Apply the replacement to a person who cannot stand and a person who communicates through
      text or a device. Can each learn how to join, choose what to share and take part without becoming
      a special public case? Then consider someone who prefers not to disclose an access need: which options
      are already available by default? Record a remaining practical issue such as an organizer who cannot
      receive text, and specify a realistic correction. If real participants voluntarily provide feedback,
      use only what they choose to share and do not make them unpaid representatives of an entire group.


      Observation checks: Two different participation cases are examined concretely; Non-disclosure remains
      compatible with available default options; A remaining practical barrier is checked and addressed
      or recorded; Feedback does not turn an individual into a representative of all disabled people.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: What can someone now do without standing, speaking aloud or explaining a diagnosis
      to the group? Identify the actual changed default, its remaining delivery conditions and whether
      it was adopted or remains a proposal. Respectful wording must connect to a workable participation
      option.


      Examples: Supportive: The replacement allowed seated and written participation, offered private
      access contact and removed compulsory public disclosure and inspiration framing.


      Mixed: The new wording offered text participation, but nobody had arranged how text would reach
      the organizer; that practical gap remained to resolve.


      Contradictory: The notice used kinder language while still requiring public medical disclosure or
      rewarding disabled members for appearing to overcome their needs.


      Inconclusive: The learner objected to the original notice but produced no replacement or concrete
      test of how someone would participate.'
    expected_time: 15-25 minutes
    due_within_days: 10
