  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Ableism, stigma, and inclusive participation; no purchase, subscription, travel, credential, or
      public artifact is required.
    accessibility:
    - Use a private invitation, small group or fictional notice if you lack policy authority. Work in
      the person's preferred language and format. No disability simulation, public confrontation, compulsory
      disclosure or claim that good intentions prove access is required. Formal legal questions need relevant
      local expertise.
    cultural_context:
    - Adapt the expression of Ableism, stigma, and inclusive participation to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a private invitation, small group or fictional notice if you lack policy authority. Work in
      the person's preferred language and format. No disability simulation, public confrontation, compulsory
      disclosure or claim that good intentions prove access is required. Formal legal questions need relevant
      local expertise.
  pause_conditions:
  - Pause Ableism, stigma, and inclusive participation when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Ableism, stigma, and inclusive participation practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Ableism, stigma, and inclusive participation situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
