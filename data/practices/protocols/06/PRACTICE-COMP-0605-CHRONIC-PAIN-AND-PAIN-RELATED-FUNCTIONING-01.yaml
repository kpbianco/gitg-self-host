meaning_and_fit:
  purpose: Distinguish pain treatment, management and adaptation, raise questions about uncertainty and
    feared activity, and prepare a sustainable participation plan with qualified care.
  why_recommended: Distinguish pain treatment, management and adaptation, raise questions about uncertainty
    and feared activity, and prepare a sustainable participation plan with qualified care.
  claims:
  - statement: Distinguish pain treatment, management and adaptation, raise questions about uncertainty
      and feared activity, and prepare a sustainable participation plan with qualified care.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: ME/CFS can involve delayed symptom worsening after exertion; activity management must respect
      individual limits, and standard exercise advice for healthy people can be unsuitable.
    classification: safety_precaution
    source_ids:
    - SRC-CDC-MECFS-CAPACITY-BOUNDARY
    limitations: Disease-specific caution against a universal activity-increase rule, not a diagnosis
      or a pacing prescription for every illness. The exercise preserves existing qualified care and does
      not set activity doses or change treatment.
  - statement: Chronic pain can affect daily function and wellbeing, and care may involve different approaches
      and professional support.
    classification: safety_precaution
    source_ids:
    - SRC-MEDLINEPLUS-CHRONIC-PAIN
    limitations: General pain literacy only; does not establish a cause, certify an activity as safe,
      prescribe a regimen or validate the original participation-planning exercise. Cure, management and
      adaptation are used as explanatory distinctions, not promised outcomes.
  applicability_question: Does a voluntary, bounded Chronic pain and pain-related functioning practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Chronic pain and pain-related functioning as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a helper to prepare the agenda, reduce writing or stay with the fictional
    concern. Follow individual guidance for fatigue or delayed worsening as well as pain. New severe or
    concerning symptoms require appropriate medical help, not an experiment. No physical challenge or
    medication change is part of completion.
  opportunity_considerations: 'Use the linked MedlinePlus chronic-pain overview and a private note. Start
    with this fictional concern: a person wants to join a regular conversation, but pain and worry about
    a flare make planning difficult. If using a personal example, use an ordinary activity already covered
    by your care guidance; keep treatment instructions unchanged.'
  prerequisites:
  - 'Use the linked MedlinePlus chronic-pain overview and a private note. Start with this fictional concern:
    a person wants to join a regular conversation, but pain and worry about a flare make planning difficult.
    If using a personal example, use an ordinary activity already covered by your care guidance; keep
    treatment instructions unchanged.'
  dependencies: []
  safe_alternatives:
  - Use a helper to prepare the agenda, reduce writing or stay with the fictional concern. Follow individual
    guidance for fatigue or delayed worsening as well as pain. New severe or concerning symptoms require
    appropriate medical help, not an experiment. No physical challenge or medication change is part of
    completion.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Chronic pain and pain-related functioning differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Chronic pain and pain-related
    functioning as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the linked MedlinePlus chronic-pain overview and a private note. Start with this fictional
    concern: a person wants to join a regular conversation, but pain and worry about a flare make planning
    difficult. If using a personal example, use an ordinary activity already covered by your care guidance;
    keep treatment instructions unchanged. Goal: Distinguish pain treatment, management and adaptation,
    raise questions about uncertainty and feared activity, and prepare a sustainable participation plan
    with qualified care. Scope: This is care-conversation preparation and review of an existing plan.
    It does not diagnose pain, prescribe movement, decide which pain is safe, or test tolerance through
    deliberate provocation. Time and effort: Two preparation sessions of about 15 minutes and one review
    after an ordinary permitted activity or the supplied fictional scenario. Adaptation: Use a helper
    to prepare the agenda, reduce writing or stay with the fictional concern. Follow individual guidance
    for fatigue or delayed worsening as well as pain. New severe or concerning symptoms require appropriate
    medical help, not an experiment. No physical challenge or medication change is part of completion.
    Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Manage ME/CFS: https://www.cdc.gov/me-cfs/management/index.html

    Chronic Pain: https://medlineplus.gov/chronicpain.html'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a helper to prepare the agenda, reduce writing or stay with the fictional concern.
    Follow individual guidance for fatigue or delayed worsening as well as pain. New severe or concerning
    symptoms require appropriate medical help, not an experiment. No physical challenge or medication
    change is part of completion.
  expected_burden: Two preparation sessions of about 15 minutes and one review after an ordinary permitted
    activity or the supplied fictional scenario.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Chronic pain and pain-related functioning protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Chronic pain and pain-related functioning action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a helper
    to prepare the agenda, reduce writing or stay with the fictional concern. Follow individual guidance
    for fatigue or delayed worsening as well as pain. New severe or concerning symptoms require appropriate
    medical help, not an experiment. No physical challenge or medication change is part of completion.
  actions:
  - stable_id: PRACTICE-COMP-0605-CHRONIC-PAIN-AND-PAIN-RELATED-FUNCTIONING-01-A1
    sequence: 1
    title: Separate the pain experience from three different care goals
    instructions: 'Explain three aims in your own words: cure would resolve an underlying problem where
      possible; management seeks to reduce symptoms or their effects; adaptation changes how a valued
      activity is done. They can coexist without a promise that pain will disappear. For the fictional
      concern, separate the reported pain, the feared consequence of joining the conversation and what
      remains medically unknown. Describe pacing as planning activity and rest around individually appropriate
      limits, not a rule to do more each time. Neither fear nor normal-looking test results establish
      that pain is imaginary or that an activity is safe.


      Observation checks: Cure management and adaptation are distinguished; Reported pain feared consequences
      and uncertainty are separated; Pacing does not become an automatic increase rule; Pain is not treated
      as a measure of weakness or honesty. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0605-CHRONIC-PAIN-AND-PAIN-RELATED-FUNCTIONING-01
      action_stable_id: PRACTICE-COMP-0605-CHRONIC-PAIN-AND-PAIN-RELATED-FUNCTIONING-01-A1
      competency_stable_id: '06.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0605_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0605_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - cure_management_and_adaptation_are_distinguished
        - reported_pain_feared_consequences_and_uncertainty_are_separated
        - pacing_does_not_become_an_automatic_increase_rule
        - pain_is_not_treated_as_a_measure_of_weakness_or_honesty
      - measurement_id: c0605_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0605_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0605-CHRONIC-PAIN-AND-PAIN-RELATED-FUNCTIONING-01-A2
    sequence: 2
    title: Prepare questions that a qualified care conversation must answer
    instructions: 'Make a short agenda with the valued activity, its practical difficulty and these questions:
      what needs further assessment; what existing activities and adaptations fit my situation; what changes
      should prompt contact; and when should the plan be reviewed? Include a question about fear of activity
      without asking a peer to decide whether to push through it. Identify the actual clinician or service
      to contact and any access difficulty. If there is no current care relationship, locate a qualified
      entry point rather than approving a plan yourself. Keep medication changes, tests and rehabilitation
      decisions outside this exercise.


      Observation checks: The agenda connects care questions to a valued activity; Uncertainty and contact
      conditions have explicit questions; A qualified service or existing clinician is identified; The
      exercise does not approve treatment or activity limits. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0605-CHRONIC-PAIN-AND-PAIN-RELATED-FUNCTIONING-01
      action_stable_id: PRACTICE-COMP-0605-CHRONIC-PAIN-AND-PAIN-RELATED-FUNCTIONING-01-A2
      competency_stable_id: '06.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0605_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0605_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_agenda_connects_care_questions_to_a_valued_activity
        - uncertainty_and_contact_conditions_have_explicit_questions
        - a_qualified_service_or_existing_clinician_is_identified
        - the_exercise_does_not_approve_treatment_or_activity_limits
      - measurement_id: c0605_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0605_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0605-CHRONIC-PAIN-AND-PAIN-RELATED-FUNCTIONING-01-A3
    sequence: 3
    title: Make the participation plan conditional on real care guidance
    instructions: 'Using existing guidance, specify an allowed form of the ordinary activity, available
      support, the agreed way to pause or stop and the next review. For the fictional case, compare a
      shorter remote conversation with a visit and identify what the person and care team would need to
      decide before either is called suitable. A personal trial occurs only within existing guidance and
      ordinary capacity; record what participation was possible and any concern to take back to care.
      An unanswered care question means the plan remains a proposal. Do not generate pain or remove useful
      aids to test a claim about avoidance.


      Observation checks: The plan identifies guidance or clearly states what is unapproved; Participation
      has an available supported form; Pause and review arrangements are explicit; Any actual result is
      distinguished from a fictional comparison. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What does the person want to participate in, which clinical question remains open,
      and what next contact or review is appropriate? Distinguish a useful care conversation from symptom
      relief, and an approved supported activity from an untested proposal.


      Examples: Supportive: A person brought a specific participation goal to their existing care plan,
      used an already agreed shorter format and recorded a question for follow-up.


      Mixed: The agenda was useful but the activity limits were not yet clear, so the proposal remained
      unapproved instead of becoming a self-prescribed trial.


      Contradictory: Pain was dismissed as weak character, or the exercise was used to push through a
      feared activity without appropriate guidance.


      Inconclusive: The learner listed treatments but did not connect a valued activity to a qualified
      contact, a question or a conditional plan.'
    expected_time: 15-25 minutes
