  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Chronic pain and pain-related functioning; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a helper to prepare the agenda, reduce writing or stay with the fictional concern. Follow individual
      guidance for fatigue or delayed worsening as well as pain. New severe or concerning symptoms require
      appropriate medical help, not an experiment. No physical challenge or medication change is part
      of completion.
    cultural_context:
    - Adapt the expression of Chronic pain and pain-related functioning to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a helper to prepare the agenda, reduce writing or stay with the fictional concern. Follow individual
      guidance for fatigue or delayed worsening as well as pain. New severe or concerning symptoms require
      appropriate medical help, not an experiment. No physical challenge or medication change is part
      of completion.
  pause_conditions:
  - Pause Chronic pain and pain-related functioning when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Chronic pain and pain-related functioning practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Chronic pain and pain-related functioning situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
