        expected: true
  - stable_id: PRACTICE-COMP-0609-ACCOMMODATION-ASSISTIVE-TECHNOLOGY-AND-UNIVERSAL-DESIGN-01-A2
    sequence: 2
    title: Produce a usable version without inventing access assurances
    instructions: 'Rewrite the notice with clear labels for day and time, place, materials and questions,
      using the supplied facts. State that physical access is unconfirmed rather than claiming the room
      is accessible. Put the necessary information in ordinary text, not only an image, color code or
      unexplained abbreviation. Keep a usable text or speech question route. If an actual user has requested
      a different format, obtain their preference and prepare that version within your authority. For
      personal assistive tools, preserve existing settings and supports; specialized fitting or clinical
      equipment needs an appropriate service.


      Observation checks: A revised notice is actually produced; Required facts appear in clear retrievable
      text; Unknown physical access is not falsely certified; Communication options and existing supports
      are preserved. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0609-ACCOMMODATION-ASSISTIVE-TECHNOLOGY-AND-UNIVERSAL-DESIGN-01
      action_stable_id: PRACTICE-COMP-0609-ACCOMMODATION-ASSISTIVE-TECHNOLOGY-AND-UNIVERSAL-DESIGN-01-A2
      competency_stable_id: '06.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0609_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0609_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_revised_notice_is_actually_produced
        - required_facts_appear_in_clear_retrievable_text
        - unknown_physical_access_is_not_falsely_certified
        - communication_options_and_existing_supports_are_preserved
      - measurement_id: c0609_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0609_a2_adverse
        kind: boolean
        role: adverse
