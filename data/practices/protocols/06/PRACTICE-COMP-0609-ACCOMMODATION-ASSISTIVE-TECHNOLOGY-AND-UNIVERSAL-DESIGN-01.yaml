meaning_and_fit:
  purpose: Choose and test a tool, environmental adjustment, communication support or design change that
    makes a real participation task more accessible.
  why_recommended: Choose and test a tool, environmental adjustment, communication support or design change
    that makes a real participation task more accessible.
  claims:
  - statement: Choose and test a tool, environmental adjustment, communication support or design change
      that makes a real participation task more accessible.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Cognitive access needs vary across functions, and clear structure, understandable language,
      predictable interaction and suitable formats can address design barriers.
    classification: professional_or_public_standard
    source_ids:
    - SRC-W3C-COGNITIVE-ACCESS-NEEDS
    limitations: Web-accessibility guidance, not a diagnostic taxonomy or a guarantee that the product's
      support works for every neurodivergent person. A self-check is not a full accessibility audit or
      representative user testing.
  - statement: Assistive technology includes products and related services that support functions such
      as cognition, communication and mobility, with participation as a practical purpose.
    classification: professional_or_public_standard
    source_ids:
    - SRC-WHO-ASSISTIVE-TECHNOLOGY
    limitations: General purpose and examples only, not product selection, medical-device fitting or a
      claim that one tool is suitable for all users. The exercise requires no purchase or removal of existing
      aids.
  applicability_question: Does a voluntary, bounded Accommodation, assistive technology, and universal
    design practice fit the person's current role, pathway, capacity, authority, resources, and safety
    conditions?
  not_applicable_behavior: Record Accommodation, assistive technology, and universal design as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use large text, speech, a screen reader, another familiar aid or a willing
    reader. Avoid purchasing equipment or changing a public notice without authority. If no personal barrier
    is present, the supplied ambiguity still permits an honest design task; do not impersonate a disabled
    user to create evidence.
  opportunity_considerations: 'Use a private copy of an ordinary notice you control, or this fictional
    notice: Meeting tomorrow at the usual place; bring what you need and call if anything changes. The
    supplied facts are Tuesday at 18:00, library room 2, a notebook if useful, and questions accepted
    by text or speech through the organizer. Physical access has not been checked. Use an ordinary text
    editor, paper or an existing assistive tool.'
  prerequisites:
  - 'Use a private copy of an ordinary notice you control, or this fictional notice: Meeting tomorrow
    at the usual place; bring what you need and call if anything changes. The supplied facts are Tuesday
    at 18:00, library room 2, a notebook if useful, and questions accepted by text or speech through the
    organizer. Physical access has not been checked. Use an ordinary text editor, paper or an existing
    assistive tool.'
  dependencies: []
  safe_alternatives:
  - Use large text, speech, a screen reader, another familiar aid or a willing reader. Avoid purchasing
    equipment or changing a public notice without authority. If no personal barrier is present, the supplied
    ambiguity still permits an honest design task; do not impersonate a disabled user to create evidence.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Accommodation, assistive technology, and universal design differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Accommodation, assistive technology,
    and universal design as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private copy of an ordinary notice you control, or this fictional notice: Meeting tomorrow
    at the usual place; bring what you need and call if anything changes. The supplied facts are Tuesday
    at 18:00, library room 2, a notebook if useful, and questions accepted by text or speech through the
    organizer. Physical access has not been checked. Use an ordinary text editor, paper or an existing
    assistive tool. Goal: Choose and test a tool, environmental adjustment, communication support or design
    change that makes a real participation task more accessible. Scope: A before-and-after information
    task demonstrates a bounded design change. It does not certify universal accessibility or establish
    that a particular assistive product suits every user. Time and effort: About 15 minutes to inspect,
    15 minutes to revise, and a short comparison. Adaptation: Use large text, speech, a screen reader,
    another familiar aid or a willing reader. Avoid purchasing equipment or changing a public notice without
    authority. If no personal barrier is present, the supplied ambiguity still permits an honest design
    task; do not impersonate a disabled user to create evidence. Keep personal working notes outside the
    check-in; record only the listed observations.


    Reference support:

    Cognitive and learning in Diverse Abilities and Barriers: https://www.w3.org/WAI/people-use-web/abilities-barriers/cognitive/

    Assistive technology: https://www.who.int/news-room/fact-sheets/detail/assistive-technology'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use large text, speech, a screen reader, another familiar aid or a willing reader.
    Avoid purchasing equipment or changing a public notice without authority. If no personal barrier is
    present, the supplied ambiguity still permits an honest design task; do not impersonate a disabled
    user to create evidence.
  expected_burden: About 15 minutes to inspect, 15 minutes to revise, and a short comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Accommodation, assistive technology, and universal design protocol to rank worth, coerce
    participation, demand disclosure, override rest or care, certify competence, or justify decisions
    beyond the recorded context.
  - Treating a completed Accommodation, assistive technology, and universal design action, a polished
    artifact, agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use large text,
    speech, a screen reader, another familiar aid or a willing reader. Avoid purchasing equipment or changing
    a public notice without authority. If no personal barrier is present, the supplied ambiguity still
    permits an honest design task; do not impersonate a disabled user to create evidence.
  actions:
  - stable_id: PRACTICE-COMP-0609-ACCOMMODATION-ASSISTIVE-TECHNOLOGY-AND-UNIVERSAL-DESIGN-01-A1
    sequence: 1
    title: Identify the task and select the right kind of access change
    instructions: 'Try to answer five questions from the original notice: when, where, what to bring,
      how to ask a question and what access information is known? Mark missing or ambiguous information.
      Compare four kinds of response: an assistive tool such as text-to-speech; an environmental change
      such as a quieter place to read; communication support such as a plain written explanation; and
      a clearer default notice available to everyone. A personal accommodation answers an individual need,
      while an inclusive default can reduce the need to ask repeatedly. Choose the actual information
      barrier rather than a product to buy.


      Observation checks: The five information needs are checked against the original; Missing facts are
      distinguished from difficult presentation; Four types of access change are explained; The chosen
      change targets a concrete barrier. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0609-ACCOMMODATION-ASSISTIVE-TECHNOLOGY-AND-UNIVERSAL-DESIGN-01
      action_stable_id: PRACTICE-COMP-0609-ACCOMMODATION-ASSISTIVE-TECHNOLOGY-AND-UNIVERSAL-DESIGN-01-A1
      competency_stable_id: '06.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0609_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0609_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_five_information_needs_are_checked_against_the_original
        - missing_facts_are_distinguished_from_difficult_presentation
        - four_types_of_access_change_are_explained
        - the_chosen_change_targets_a_concrete_barrier
      - measurement_id: c0609_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0609_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
