        expected: true
  - stable_id: PRACTICE-COMP-0609-ACCOMMODATION-ASSISTIVE-TECHNOLOGY-AND-UNIVERSAL-DESIGN-01-A3
    sequence: 3
    title: Test whether the change solves the original task
    instructions: 'Answer the same five questions from the revised notice and compare with the original.
      Use your ordinary access method, or invite a willing person to try their preferred method without
      asking them to simulate an impairment or disclose a diagnosis. Check whether labels, reading order
      and the question route make sense in that method. Record which missing or hard-to-find answer is
      now available, what remains unresolved and whether the change adds a new obstacle. Improve one remaining
      issue or identify who can verify it. A self-check is not equivalent to testing with all intended
      users.


      Observation checks: The original five-question task is repeated; A concrete before-and-after difference
      is recorded; Remaining or newly introduced barriers stay visible; The scope of the actual access
      test is stated accurately. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Which answer became accessible because of the change, through which actual access
      method, and what still needs checking? Keep the improved version if useful and name one realistic
      follow-up. A clearer notice is a specific improvement, not proof that every participation barrier
      is removed.


      Examples: Supportive: The revised notice made the exact time and question route findable, retained
      ordinary text and explicitly left physical access unconfirmed.


      Mixed: The words were clearer but a text-to-speech check exposed an ambiguous reading order, prompting
      another revision.


      Contradictory: A decorative image replaced usable text, or the organizer claimed full accessibility
      without checking the relevant barriers.


      Inconclusive: An accessibility tool was named but no notice was changed and the original information
      task was not repeated.'
    expected_time: 15-25 minutes
    due_within_days: 10
