  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Accommodation, assistive technology, and universal design; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Use large text, speech, a screen reader, another familiar aid or a willing reader. Avoid purchasing
      equipment or changing a public notice without authority. If no personal barrier is present, the
      supplied ambiguity still permits an honest design task; do not impersonate a disabled user to create
      evidence.
    cultural_context:
    - Adapt the expression of Accommodation, assistive technology, and universal design to direct or indirect
      communication, collective or individual decision structures, local norms, faith or secular commitments,
      and role obligations while preserving consent and dignity.
    resource_variants:
    - Use large text, speech, a screen reader, another familiar aid or a willing reader. Avoid purchasing
      equipment or changing a public notice without authority. If no personal barrier is present, the
      supplied ambiguity still permits an honest design task; do not impersonate a disabled user to create
      evidence.
  pause_conditions:
  - Pause Accommodation, assistive technology, and universal design when capacity, consent, authority,
    privacy, access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed
    circumstances make the next action unwise.
  stop_conditions:
  - Stop the Accommodation, assistive technology, and universal design practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Accommodation, assistive technology, and universal design situation
    exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
