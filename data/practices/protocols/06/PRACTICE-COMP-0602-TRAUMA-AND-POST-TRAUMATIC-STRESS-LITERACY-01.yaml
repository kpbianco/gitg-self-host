meaning_and_fit:
  purpose: Understand possible trauma-related responses, distinguish observations from diagnoses, and
    prepare to seek qualified help without forcing disclosure or exposure.
  why_recommended: Understand possible trauma-related responses, distinguish observations from diagnoses,
    and prepare to seek qualified help without forcing disclosure or exposure.
  claims:
  - statement: Understand possible trauma-related responses, distinguish observations from diagnoses,
      and prepare to seek qualified help without forcing disclosure or exposure.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Trauma-related experiences can involve unwanted recollections, avoidance, heightened arousal,
      detachment and changes in mood or cognition; diagnosis and treatment require an appropriate mental
      health professional.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-PTSD-LITERACY
    limitations: Supports literacy and professional boundaries, not diagnosis from a short case, a screening
      score, forced exposure or the effectiveness of the product-authored exercise. The attachment concept
      is a broader educational category rather than an added diagnostic criterion.
  - statement: US life-threatening emergencies call for 911; 988 provides suicide and emotional-crisis
      support by call or text, and ordinary mental health care requires an appropriate provider.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-HELP-ROUTES
    limitations: US public resource guidance only. Local availability, accessibility, eligibility and
      other countries' services need current verification. A resource card or rehearsal is not a clinical
      assessment or emergency-response qualification.
  applicability_question: Does a voluntary, bounded Trauma and post-traumatic stress literacy practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Trauma and post-traumatic stress literacy as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a short spoken glossary or a reader's help with public information. Skip
    distressing detail and retain the fictional case. This is not exposure practice; a professional can
    advise on appropriate personal work. If the topic is destabilizing, stop and seek suitable support
    rather than recording endurance as success.
  opportunity_considerations: 'Read the NIMH PTSD overview through the reference. Use this fictional case:
    following a frightening accident, someone startles at noises, has unwanted recollections, avoids a
    familiar route and finds it harder to trust others. No account of the accident is needed. Do not substitute
    an active personal trauma for this case.'
  prerequisites:
  - 'Read the NIMH PTSD overview through the reference. Use this fictional case: following a frightening
    accident, someone startles at noises, has unwanted recollections, avoids a familiar route and finds
    it harder to trust others. No account of the accident is needed. Do not substitute an active personal
    trauma for this case.'
  dependencies: []
  safe_alternatives:
  - Use a short spoken glossary or a reader's help with public information. Skip distressing detail and
    retain the fictional case. This is not exposure practice; a professional can advise on appropriate
    personal work. If the topic is destabilizing, stop and seek suitable support rather than recording
    endurance as success.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Trauma and post-traumatic stress literacy differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Trauma and post-traumatic
    stress literacy as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Read the NIMH PTSD overview through the reference. Use this fictional case: following a frightening
    accident, someone startles at noises, has unwanted recollections, avoids a familiar route and finds
    it harder to trust others. No account of the accident is needed. Do not substitute an active personal
    trauma for this case. Goal: Understand possible trauma-related responses, distinguish observations
    from diagnoses, and prepare to seek qualified help without forcing disclosure or exposure. Scope:
    This is literacy and support preparation using a fictional case. It is not a symptom screen, diagnosis,
    trauma narrative, memory-recovery exercise or treatment. Time and effort: Three sessions of up to
    15 minutes, with reading split or deferred as needed. Adaptation: Use a short spoken glossary or a
    reader''s help with public information. Skip distressing detail and retain the fictional case. This
    is not exposure practice; a professional can advise on appropriate personal work. If the topic is
    destabilizing, stop and seek suitable support rather than recording endurance as success. Keep personal
    working notes outside the check-in; record only the listed observations.


    Reference support:

    Post-Traumatic Stress Disorder: https://www.nimh.nih.gov/health/publications/post-traumatic-stress-disorder-ptsd

    Help for Mental Illnesses: https://www.nimh.nih.gov/health/find-help'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a short spoken glossary or a reader's help with public information. Skip distressing
    detail and retain the fictional case. This is not exposure practice; a professional can advise on
    appropriate personal work. If the topic is destabilizing, stop and seek suitable support rather than
    recording endurance as success.
  expected_burden: Three sessions of up to 15 minutes, with reading split or deferred as needed.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Trauma and post-traumatic stress literacy protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Trauma and post-traumatic stress literacy action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a short
    spoken glossary or a reader's help with public information. Skip distressing detail and retain the
    fictional case. This is not exposure practice; a professional can advise on appropriate personal work.
    If the topic is destabilizing, stop and seek suitable support rather than recording endurance as success.
  actions:
  - stable_id: PRACTICE-COMP-0602-TRAUMA-AND-POST-TRAUMATIC-STRESS-LITERACY-01-A1
    sequence: 1
    title: Explain eight concepts without diagnosing the case
    instructions: 'Make a short glossary: threat means perceived danger; avoidance means steering away
      from reminders; intrusion means unwelcome recollections or images; dissociation can involve feeling
      detached or unreal; shame concerns negative judgment of oneself; hyperarousal means being persistently
      on guard; memory difficulties can include gaps or trouble concentrating; attachment concerns security
      and trust in relationships. Match only the case''s stated observations to possible concepts and
      mark the rest unknown. Consult the NIMH account to check the symptom-related terms. These experiences
      can have different causes; neither a matching word nor an absent sign decides a diagnosis.


      Observation checks: All eight concepts receive a plain-language explanation; Case observations are
      kept separate from inferred causes; Unstated experiences remain unknown; Clinical diagnosis is reserved
      for a qualified assessment. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0602-TRAUMA-AND-POST-TRAUMATIC-STRESS-LITERACY-01
      action_stable_id: PRACTICE-COMP-0602-TRAUMA-AND-POST-TRAUMATIC-STRESS-LITERACY-01-A1
      competency_stable_id: '06.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0602_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0602_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_eight_concepts_receive_a_plain_language_explanation
        - case_observations_are_kept_separate_from_inferred_causes
        - unstated_experiences_remain_unknown
        - clinical_diagnosis_is_reserved_for_a_qualified_assessment
      - measurement_id: c0602_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0602_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0602-TRAUMA-AND-POST-TRAUMATIC-STRESS-LITERACY-01-A2
    sequence: 2
    title: Compare a supportive response with pressure to perform recovery
    instructions: 'Write a two-sentence response to the fictional person: You do not have to describe
      the accident to me. Would help finding a clinician or practical support with an ordinary task be
      useful? Contrast it with being told to retell the event, confront reminders alone or recover on
      someone else''s timetable. Explain how choice, predictability and control over disclosure alter
      the interaction. Identify a peer''s role in listening or practical help and the clinician''s role
      in assessment and treatment. Do not test reactions to reminders or ask anyone to recount a traumatic
      event.


      Observation checks: The response gives a choice about support; Disclosure is optional and limited;
      Pressure or unsupervised exposure is explicitly rejected; Peer support and clinical treatment have
      different roles. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0602-TRAUMA-AND-POST-TRAUMATIC-STRESS-LITERACY-01
      action_stable_id: PRACTICE-COMP-0602-TRAUMA-AND-POST-TRAUMATIC-STRESS-LITERACY-01-A2
      competency_stable_id: '06.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0602_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0602_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_response_gives_a_choice_about_support
        - disclosure_is_optional_and_limited
        - pressure_or_unsupervised_exposure_is_explicitly_rejected
        - peer_support_and_clinical_treatment_have_different_roles
      - measurement_id: c0602_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0602_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0602-TRAUMA-AND-POST-TRAUMATIC-STRESS-LITERACY-01-A3
    sequence: 3
    title: Find an actual professional entry point and prepare questions
    instructions: 'Use the linked NIMH help page or an official health-service directory for your location
      to locate a real route to a clinician experienced with trauma. Record the service name, public contact
      route, area served and what eligibility or cost information still needs checking. Prepare these
      questions: how do you assess fit; how is consent handled during treatment; and what choices are
      available if a method is unsuitable? No appointment or disclosure is required for this preparation.
      If there is a current urgent concern, use qualified or emergency help now rather than finishing
      the exercise; in the US, 988 offers crisis support and 911 is for life-threatening emergencies.
      Elsewhere use local services.


      Observation checks: A real service has a retrievable contact route; Eligibility and unknown access
      conditions are recorded; Questions address expertise consent and alternatives; Preparation is distinguished
      from obtaining assessment or treatment. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Can you explain what might be happening without claiming to know its cause, and identify
      a usable next support step? Preserve unanswered access questions. Success here is informed preparation
      and appropriate boundaries, not reduced symptoms or demonstrated recovery.


      Examples: Supportive: The case was described without a diagnosis, missing experiences stayed unknown,
      and a local clinical entry point and consent questions were identified.


      Mixed: The glossary was accurate but the selected service had unclear eligibility, so access remained
      a question to resolve.


      Contradictory: A learner declared PTSD from the short case or proposed forcing a return to the feared
      location as a test of progress.


      Inconclusive: Symptom words were copied but neither their meaning nor a real professional entry
      point was established.'
    expected_time: 15-25 minutes
