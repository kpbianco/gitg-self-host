  - stable_id: PRACTICE-COMP-0612-CARE-RECIPIENT-AGENCY-AND-SAFEGUARDING-01-A3
    sequence: 3
    title: Test the handover against preference refusal and a missed need
    instructions: 'Walk through three variations: the adult changes the visit time, declines an offered
      nonessential task, and reports the missed need. For each, identify who listens, how the choice or
      concern is recorded privately, who follows up and how the person learns what happened. Locate an
      actual public advocacy or safeguarding contact for the relevant area and note access conditions
      without sending a fictional report. In an authorized real care arrangement, ask the affected person
      whether the route is usable and seek professional help for unresolved concerns. A written plan alone
      does not prove that care is safe or that a complaint was resolved.


      Observation checks: Three distinct preference and concern scenarios are worked through; Follow-up
      ownership and feedback to the person are explicit; A real relevant public contact is retrievable;
      A plan is not represented as proof of safe care or resolved harm. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Can the person change a choice, refuse an ordinary offer and raise a concern through
      a route that does not depend entirely on the helper? Identify any remaining barrier and who can
      address it. The person''s voice must remain visible even when substantial assistance is necessary.


      Examples: Supportive: The arrangement used the recipient''s communication device, preserved private
      choices and identified an independent contact with a clear follow-up route.


      Mixed: Preferences were recorded, but the only complaint route required the same helper being questioned;
      an independent accessible route was added.


      Contradictory: The helper answered every question and treated dependence as blanket consent, or
      an unresolved missed need was dismissed to keep the plan looking successful.


      Inconclusive: A care schedule existed but offered no usable way for the recipient to refuse, communicate
      privately or learn what happened after a concern.'
    expected_time: 15-25 minutes
