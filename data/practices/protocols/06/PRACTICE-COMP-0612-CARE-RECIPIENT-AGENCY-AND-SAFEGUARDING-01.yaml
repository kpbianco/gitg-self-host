  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Care-recipient agency and safeguarding; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Care-recipient agency and safeguarding; assistive technology, interpretation, a support
      person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Care-recipient agency and safeguarding to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - When a real Care-recipient agency and safeguarding opportunity is unavailable or inappropriate,
      use a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause Care-recipient agency and safeguarding when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Care-recipient agency and safeguarding practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Care-recipient agency and safeguarding situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Care-recipient agency and safeguarding actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c0612_a1_primary
  - c0612_a1_boundary
  - c0612_a1_adverse
  - c0612_a2_primary
  - c0612_a2_boundary
  - c0612_a2_adverse
  - c0612_a3_primary
  - c0612_a3_boundary
  - c0612_a3_adverse
  adverse_or_contradictory_indicators:
  - The Care-recipient agency and safeguarding action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Care-recipient agency and safeguarding criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Care-recipient agency and safeguarding explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Care-recipient agency and safeguarding
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Care-recipient agency and safeguarding observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Care-recipient agency and safeguarding rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—A care plan contains mechanisms for the dependent person's preferences, complaints, and protection.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Care-recipient agency and safeguarding requires a bounded context,
    allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Care-recipient
    agency and safeguarding contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L20
  - L25
  - L28
  - L31
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Care-recipient agency and safeguarding evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The bound the qualified question for care-recipient agency and safeguarding action was attempted or
    explicitly deferred.
  - The prepare minimum information for care-recipient agency and safeguarding action was attempted or
    explicitly deferred.
  - The record a bounded care-recipient agency and safeguarding disposition action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0612_a1_primary
    - c0612_a2_primary
    - c0612_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Care-recipient agency and safeguarding only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Care-recipient agency and safeguarding across
    roles, cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Care-recipient agency and safeguarding require in this exact context, what remains
      outside my role or authority, and which scope sentence or evidence criterion will keep the practice
      honest?
    during: Which observable Care-recipient agency and safeguarding criterion is present, absent, mixed,
      or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'A care plan contains mechanisms for the dependent person's
      preferences, complaints, and protection.', what contradiction or missing context matters most, and
      should this Care-recipient agency and safeguarding design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Care-recipient agency and safeguarding design only when the context
      and burden remain appropriate.
    adapt: Change the Care-recipient agency and safeguarding medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Care-recipient agency and safeguarding when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Care-recipient agency and safeguarding
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Care-recipient agency and safeguarding criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Care-recipient agency and safeguarding criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Care-recipient agency and safeguarding criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Care-recipient agency and safeguarding action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
