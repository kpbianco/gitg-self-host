meaning_and_fit:
  purpose: Build preferences, consent, privacy, complaints and protection from neglect or abuse into a
    practical care-support arrangement.
  why_recommended: Build preferences, consent, privacy, complaints and protection from neglect or abuse
    into a practical care-support arrangement.
  claims:
  - statement: Build preferences, consent, privacy, complaints and protection from neglect or abuse into
      a practical care-support arrangement.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The general consent principle requires an informed and voluntary choice; agreeing to one
      act is not an unlimited permission, and preferences can change.
    classification: professional_or_public_standard
    source_ids:
    - SRC-NHS-CONSENT-PRINCIPLES
    limitations: Used only for the general consent principle. The displayed review is overdue; jurisdiction-specific
      legal rules, exceptions, capacity decisions and treatment authority are not adopted or certified
      as current by this exercise. An ordinary help agreement is not a legal consent form.
  - statement: Abuse and neglect may occur within care relationships; concerns can require appropriate
      professional or safeguarding support, and helpers should not promise absolute secrecy.
    classification: safety_precaution
    source_ids:
    - SRC-NHS-ADULT-SAFEGUARDING
    limitations: UK service examples and safeguarding literacy only. Local duties, complaint channels,
      emergency routes and legal authority require relevant local guidance; the exercise does not investigate
      allegations or certify care as safe.
  applicability_question: Does a voluntary, bounded Care-recipient agency and safeguarding practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Care-recipient agency and safeguarding as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a communication aid, interpreter, chosen advocate or plain-language version
    without bypassing the recipient. Do not record personal allegations or care details in the app. If
    there is an actual concern, use appropriate local safeguarding or emergency help promptly; completing
    a worksheet is never a condition for receiving protection.
  opportunity_considerations: 'Use this fictional case: an adult uses a communication device to express
    choices, but a helper routinely answers instead. The adult wants to choose visit times and discuss
    a concern privately; an agreed daily need was missed during a handover. Use a private note and the
    NHS safeguarding reference for examples of concerns and appropriate professional routes, with its
    UK scope kept explicit.'
  prerequisites:
  - 'Use this fictional case: an adult uses a communication device to express choices, but a helper routinely
    answers instead. The adult wants to choose visit times and discuss a concern privately; an agreed
    daily need was missed during a handover. Use a private note and the NHS safeguarding reference for
    examples of concerns and appropriate professional routes, with its UK scope kept explicit.'
  dependencies: []
  safe_alternatives:
  - Use a communication aid, interpreter, chosen advocate or plain-language version without bypassing
    the recipient. Do not record personal allegations or care details in the app. If there is an actual
    concern, use appropriate local safeguarding or emergency help promptly; completing a worksheet is
    never a condition for receiving protection.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Care-recipient agency and safeguarding differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Care-recipient agency and
    safeguarding as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: an adult uses a communication device to express choices, but a helper
    routinely answers instead. The adult wants to choose visit times and discuss a concern privately;
    an agreed daily need was missed during a handover. Use a private note and the NHS safeguarding reference
    for examples of concerns and appropriate professional routes, with its UK scope kept explicit. Goal:
    Build preferences, consent, privacy, complaints and protection from neglect or abuse into a practical
    care-support arrangement. Scope: This is an ordinary preference and safeguarding-plan review using
    a fictional case unless a suitable real context is authorized. It is not a legal capacity judgment,
    investigation, substitute clinical care plan or authorization to override consent. Time and effort:
    Three sessions of up to 15 minutes; no real concern should wait for the exercise to finish. Adaptation:
    Use a communication aid, interpreter, chosen advocate or plain-language version without bypassing
    the recipient. Do not record personal allegations or care details in the app. If there is an actual
    concern, use appropriate local safeguarding or emergency help promptly; completing a worksheet is
    never a condition for receiving protection. Keep personal working notes outside the check-in; record
    only the listed observations.


    Reference support:

    Consent to treatment — overview: https://www.nhs.uk/tests-and-treatments/consent-to-treatment/

    Abuse and neglect of adults at risk: https://www.nhs.uk/social-care-and-support/help-from-social-services-and-charities/abuse-and-neglect-adults-at-risk/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a communication aid, interpreter, chosen advocate or plain-language version
    without bypassing the recipient. Do not record personal allegations or care details in the app. If
    there is an actual concern, use appropriate local safeguarding or emergency help promptly; completing
    a worksheet is never a condition for receiving protection.
  expected_burden: Three sessions of up to 15 minutes; no real concern should wait for the exercise to
    finish.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Care-recipient agency and safeguarding protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Care-recipient agency and safeguarding action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a communication
    aid, interpreter, chosen advocate or plain-language version without bypassing the recipient. Do not
    record personal allegations or care details in the app. If there is an actual concern, use appropriate
    local safeguarding or emergency help promptly; completing a worksheet is never a condition for receiving
    protection.
  actions:
  - stable_id: PRACTICE-COMP-0612-CARE-RECIPIENT-AGENCY-AND-SAFEGUARDING-01-A1
    sequence: 1
    title: Put the person's communication and choices into the arrangement
    instructions: 'Write a brief preference section in the person''s chosen form: what matters to them,
      which everyday choices they want to make, how to ask permission before help, how they express no
      or uncertainty, and who may receive private information. In the case, address the adult directly
      through the device and allow time for an answer before asking a helper to interpret. Record the
      request for a private conversation and chosen visit times. A diagnosis, reliance on care or a nonspeaking
      communication method does not by itself settle decision-making authority; genuine legal or clinical
      questions need qualified local assessment.


      Observation checks: Preferences are expressed through the person''s usable communication method;
      Ordinary choices and permission checks are explicit; Refusal uncertainty and privacy have practical
      arrangements; Care dependence is not treated as blanket loss of decision authority. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0612-CARE-RECIPIENT-AGENCY-AND-SAFEGUARDING-01
      action_stable_id: PRACTICE-COMP-0612-CARE-RECIPIENT-AGENCY-AND-SAFEGUARDING-01-A1
      competency_stable_id: '06.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0612_a1_primary
      transfer_disposition: context_bound
      measurements:
