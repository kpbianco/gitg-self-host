  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Care-recipient agency and safeguarding; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a communication aid, interpreter, chosen advocate or plain-language version without bypassing
      the recipient. Do not record personal allegations or care details in the app. If there is an actual
      concern, use appropriate local safeguarding or emergency help promptly; completing a worksheet is
      never a condition for receiving protection.
    cultural_context:
    - Adapt the expression of Care-recipient agency and safeguarding to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a communication aid, interpreter, chosen advocate or plain-language version without bypassing
      the recipient. Do not record personal allegations or care details in the app. If there is an actual
      concern, use appropriate local safeguarding or emergency help promptly; completing a worksheet is
      never a condition for receiving protection.
  pause_conditions:
  - Pause Care-recipient agency and safeguarding when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Care-recipient agency and safeguarding practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Care-recipient agency and safeguarding situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
