  - stable_id: PRACTICE-COMP-0612-CARE-RECIPIENT-AGENCY-AND-SAFEGUARDING-01-A2
    sequence: 2
    title: Build a complaints and protection route beyond the immediate helper
    instructions: 'Add a way to raise concerns privately with an appropriate person independent of the
      immediate helper: a service supervisor, patient advocate, safeguarding professional or relevant
      local protection service. Specify how the care recipient can access that route using their communication
      method and what happens if the first contact is unavailable or implicated. Identify the missed daily
      need as a concern requiring follow-up without deciding from one sentence whether neglect is established.
      Do not promise absolute secrecy, investigate a suspected abuser yourself or require the care recipient
      to confront someone who controls essential support. Immediate danger requires local emergency assistance.


      Observation checks: An independent concern route is identified; It is accessible without relying
      solely on the person complained about; A missed essential need receives appropriate follow-up; Investigation
      and urgent protection stay with suitable services. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0612-CARE-RECIPIENT-AGENCY-AND-SAFEGUARDING-01
      action_stable_id: PRACTICE-COMP-0612-CARE-RECIPIENT-AGENCY-AND-SAFEGUARDING-01-A2
      competency_stable_id: '06.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
