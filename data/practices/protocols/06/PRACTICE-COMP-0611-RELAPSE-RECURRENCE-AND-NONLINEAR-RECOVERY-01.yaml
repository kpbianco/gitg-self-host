        expected: true
  - stable_id: PRACTICE-COMP-0611-RELAPSE-RECURRENCE-AND-NONLINEAR-RECOVERY-01-A2
    sequence: 2
    title: Write a recurrence plan with concrete actions and contacts
    instructions: 'Make four entries: changes to notice under existing guidance; demands that can be reduced;
      a willing support person or qualified service; and how to revisit a valued routine. For the fictional
      person, reduce an optional meeting, ask the agreed helper to handle logistics, and contact the care
      team for new concerns rather than deciding a cause. Record a real public contact route and what
      to do if it is unavailable. Keep clinician-provided urgent instructions intact; an exercise cannot
      replace them. Substance-related recurrence or withdrawal concerns require qualified help rather
      than a home detox plan.


      Observation checks: The plan names observable changes without diagnosing them; Reduced demands and
      practical support are specific; A real support route and unavailable-contact alternative are recorded;
      Existing clinical and urgent guidance remains authoritative. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0611-RELAPSE-RECURRENCE-AND-NONLINEAR-RECOVERY-01
      action_stable_id: PRACTICE-COMP-0611-RELAPSE-RECURRENCE-AND-NONLINEAR-RECOVERY-01-A2
      competency_stable_id: '06.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0611_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0611_a2_primary
        kind: artifact
        role: primary
