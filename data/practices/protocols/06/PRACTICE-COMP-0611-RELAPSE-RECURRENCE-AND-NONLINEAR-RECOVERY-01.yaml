        criteria:
        - the_plan_names_observable_changes_without_diagnosing_them
        - reduced_demands_and_practical_support_are_specific
        - a_real_support_route_and_unavailable_contact_alternative_are_recorded
        - existing_clinical_and_urgent_guidance_remains_authoritative
      - measurement_id: c0611_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0611_a2_adverse
        kind: boolean
        role: adverse
