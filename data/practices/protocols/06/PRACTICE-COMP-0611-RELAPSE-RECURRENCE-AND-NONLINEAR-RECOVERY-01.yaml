      Relapse, recurrence, and nonlinear recovery; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Keep only a few entries, use a trusted helper or store an accessible contact reminder. No deliberate
      setback, stopping treatment, sleep loss, substance use or forced activity is permitted as a test.
      Seek prompt professional help for new or worsening concerns; do not wait for the scheduled review
      when urgent support is needed.
    cultural_context:
    - Adapt the expression of Relapse, recurrence, and nonlinear recovery to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Keep only a few entries, use a trusted helper or store an accessible contact reminder. No deliberate
      setback, stopping treatment, sleep loss, substance use or forced activity is permitted as a test.
      Seek prompt professional help for new or worsening concerns; do not wait for the scheduled review
      when urgent support is needed.
  pause_conditions:
  - Pause Relapse, recurrence, and nonlinear recovery when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Relapse, recurrence, and nonlinear recovery practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Relapse, recurrence, and nonlinear recovery situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
