        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - earlier_and_current_observations_are_both_preserved
        - an_unknown_cause_or_duration_is_not_invented
        - ordinary_setbacks_familiar_fluctuations_and_concerning_changes_are_distinguished
        - a_useful_continuing_support_is_identified
      - measurement_id: c0611_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0611_a1_adverse
        kind: boolean
        role: adverse
