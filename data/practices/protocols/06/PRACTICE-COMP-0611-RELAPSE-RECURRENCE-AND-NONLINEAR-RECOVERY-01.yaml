meaning_and_fit:
  purpose: Recognize fluctuating capacity and recurrence, and maintain a practical plan for support, reduced
    demands and a considered return that respects existing care.
  why_recommended: Recognize fluctuating capacity and recurrence, and maintain a practical plan for support,
    reduced demands and a considered return that respects existing care.
  claims:
  - statement: Recognize fluctuating capacity and recurrence, and maintain a practical plan for support,
      reduced demands and a considered return that respects existing care.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: RAINN describes survivor support that prioritizes safety, trust, autonomy and choices without
      pressure; it recognizes that recovery follows different paths.
    classification: safety_precaution
    source_ids:
    - SRC-RAINN-CHOICE-AND-SUPPORT
    limitations: A sexual-violence support provider's description of its approach, not empirical validation
      of the exercise or a claim that this service handles every kind of betrayal. No treatment method
      or published support mnemonic is reproduced.
  - statement: ME/CFS can involve delayed symptom worsening after exertion; activity management must respect
      individual limits, and standard exercise advice for healthy people can be unsuitable.
    classification: safety_precaution
    source_ids:
    - SRC-CDC-MECFS-CAPACITY-BOUNDARY
    limitations: Disease-specific caution against a universal activity-increase rule, not a diagnosis
      or a pacing prescription for every illness. The exercise preserves existing qualified care and does
      not set activity doses or change treatment.
  applicability_question: Does a voluntary, bounded Relapse, recurrence, and nonlinear recovery practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Relapse, recurrence, and nonlinear recovery as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Keep only a few entries, use a trusted helper or store an accessible contact
    reminder. No deliberate setback, stopping treatment, sleep loss, substance use or forced activity
    is permitted as a test. Seek prompt professional help for new or worsening concerns; do not wait for
    the scheduled review when urgent support is needed.
  opportunity_considerations: 'Use an existing clinician-supported plan if you have one, or this fictional
    record: a person resumed one valued routine with support, later needed more help again, and now wonders
    whether the earlier progress counted. No diagnosis or cause is supplied. A private note or accessible
    reminder is enough.'
  prerequisites:
  - 'Use an existing clinician-supported plan if you have one, or this fictional record: a person resumed
    one valued routine with support, later needed more help again, and now wonders whether the earlier
    progress counted. No diagnosis or cause is supplied. A private note or accessible reminder is enough.'
  dependencies: []
  safe_alternatives:
  - Keep only a few entries, use a trusted helper or store an accessible contact reminder. No deliberate
    setback, stopping treatment, sleep loss, substance use or forced activity is permitted as a test.
    Seek prompt professional help for new or worsening concerns; do not wait for the scheduled review
    when urgent support is needed.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Relapse, recurrence, and nonlinear recovery differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Relapse, recurrence, and nonlinear
    recovery as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an existing clinician-supported plan if you have one, or this fictional record: a person
    resumed one valued routine with support, later needed more help again, and now wonders whether the
    earlier progress counted. No diagnosis or cause is supplied. A private note or accessible reminder
    is enough. Goal: Recognize fluctuating capacity and recurrence, and maintain a practical plan for
    support, reduced demands and a considered return that respects existing care. Scope: This is a recurrence-plan
    exercise, not a relapse prediction tool or treatment protocol. It does not prescribe substance withdrawal,
    medication changes or a fixed recovery schedule. Time and effort: About 20 minutes to prepare and
    one short later check of the plan''s usability; no setback needs to occur. Adaptation: Keep only a
    few entries, use a trusted helper or store an accessible contact reminder. No deliberate setback,
    stopping treatment, sleep loss, substance use or forced activity is permitted as a test. Seek prompt
    professional help for new or worsening concerns; do not wait for the scheduled review when urgent
    support is needed. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Help and Healing: https://rainn.org/help-and-healing/

    Manage ME/CFS: https://www.cdc.gov/me-cfs/management/index.html'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Keep only a few entries, use a trusted helper or store an accessible contact reminder.
    No deliberate setback, stopping treatment, sleep loss, substance use or forced activity is permitted
    as a test. Seek prompt professional help for new or worsening concerns; do not wait for the scheduled
    review when urgent support is needed.
  expected_burden: About 20 minutes to prepare and one short later check of the plan's usability; no setback
    needs to occur.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Relapse, recurrence, and nonlinear recovery protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Relapse, recurrence, and nonlinear recovery action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Keep only a
    few entries, use a trusted helper or store an accessible contact reminder. No deliberate setback,
    stopping treatment, sleep loss, substance use or forced activity is permitted as a test. Seek prompt
    professional help for new or worsening concerns; do not wait for the scheduled review when urgent
    support is needed.
  actions:
  - stable_id: PRACTICE-COMP-0611-RELAPSE-RECURRENCE-AND-NONLINEAR-RECOVERY-01-A1
    sequence: 1
    title: Read the changing record without turning it into an all-or-nothing verdict
    instructions: 'Separate three observations: the earlier routine happened with support, current capacity
      has changed, and the reason or duration of the change is not yet established. State what the setback
      does show and what it does not prove about the earlier period. Distinguish a missed commitment,
      a familiar fluctuation already addressed in care and a new or concerning change that needs qualified
      advice. Do not label them interchangeable relapses. Identify an existing helpful support that can
      remain useful even when independent activity is reduced.


      Observation checks: Earlier and current observations are both preserved; An unknown cause or duration
      is not invented; Ordinary setbacks familiar fluctuations and concerning changes are distinguished;
      A useful continuing support is identified. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0611-RELAPSE-RECURRENCE-AND-NONLINEAR-RECOVERY-01
      action_stable_id: PRACTICE-COMP-0611-RELAPSE-RECURRENCE-AND-NONLINEAR-RECOVERY-01-A1
      competency_stable_id: '06.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0611_a1_primary
      transfer_disposition: context_bound
      measurements:
