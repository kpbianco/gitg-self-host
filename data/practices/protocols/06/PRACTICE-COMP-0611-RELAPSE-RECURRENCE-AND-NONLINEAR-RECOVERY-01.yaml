        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0611-RELAPSE-RECURRENCE-AND-NONLINEAR-RECOVERY-01-A3
    sequence: 3
    title: Walk through the plan and make re-entry conditional on actual capacity
    instructions: 'Test the plan with this change: the usual helper is unavailable and the next optional
      commitment is tomorrow. Find the recorded alternative, decide which demand can wait and locate the
      appropriate qualified contact for a new concern. Then describe a possible return to the valued routine
      with an agreed supported form and a review, not a deadline or automatic increase. Revisit the plan
      once later to check whether contacts and arrangements are still usable. Record only what was actually
      verified; a fictional walk-through is not a real recurrence or evidence that symptoms improved.


      Observation checks: The unavailable-helper scenario is worked through; At least one unnecessary
      demand can be reduced; Re-entry depends on capacity and relevant care guidance; The later check
      records actual usability rather than invented recovery. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Would the plan still work on a difficult day, including when the usual helper is unavailable?
      Keep earlier gains and current needs both visible. Update a contact, reduce a demand or seek advice
      without requiring a smooth upward recovery curve.


      Examples: Supportive: The plan retained evidence of earlier participation, offered an alternative
      helper and allowed a supported return based on current capacity.


      Mixed: The main contact was valid but the backup route was missing, so the walk-through exposed
      a gap before any real setback occurred.


      Contradictory: A setback was treated as proof that all previous progress was fake, or the plan required
      catching up through an automatic increase in activity.


      Inconclusive: A hopeful return date was written without reduced demands, a usable contact or a walk-through
      of an unavailable helper.'
