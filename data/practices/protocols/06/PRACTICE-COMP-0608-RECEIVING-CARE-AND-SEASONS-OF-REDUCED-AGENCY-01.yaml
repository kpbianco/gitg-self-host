        expected: true
  - stable_id: PRACTICE-COMP-0608-RECEIVING-CARE-AND-SEASONS-OF-REDUCED-AGENCY-01-A3
    sequence: 3
    title: Use the agreement and check whose decision actually prevailed
    instructions: 'Carry out the agreed ordinary help if the context is real. Otherwise rehearse this
      variation: the helper recommends a different item because it is convenient, while the person prefers
      the original. Resolve it through the person''s accessible communication and the helper''s genuine
      practical limits, not by assuming dependence settles the disagreement. Review whether help met the
      stated need, whether privacy was respected and whether the person could pause or revise the arrangement.
      If essential needs are unmet, seek an appropriate support service rather than treating self-sufficiency
      as the required solution.


      Observation checks: An actual exchange or explicitly labeled variation is examined; The person''s
      stated preference affects the outcome; Privacy and the option to pause remain effective; Unmet essential
      needs lead to appropriate support rather than blame. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Did assistance make the person''s chosen participation possible, and could they meaningfully
      revise or refuse it? Identify one improvement to communication or backup. Accepting care is compatible
      with dignity even when independent performance is not possible.


      Examples: Supportive: The recipient chose the items, the helper handled agreed logistics, and a
      changed preference was checked without demanding private credentials.


      Mixed: The task was completed but the pause signal was missed, so the agreement was revised before
      another exchange.


      Contradictory: The helper overruled an expressed preference because providing care was treated as
      entitlement to decide everything.


      Inconclusive: A general offer to help was made without clarifying the person''s choices, information
      boundaries or a usable way to change the agreement.'
