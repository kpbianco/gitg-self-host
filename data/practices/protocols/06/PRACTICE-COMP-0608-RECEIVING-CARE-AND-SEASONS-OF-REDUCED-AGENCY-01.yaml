  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Receiving care and seasons of reduced agency; no purchase, subscription, travel, credential, or
      public artifact is required.
    accessibility:
    - Use accessible yes/no options, extra processing time, an interpreter or a chosen advocate without
      bypassing the person. No one is required to provide intimate care, disclose credentials or surrender
      an existing support. If decision-making ability is genuinely uncertain, use qualified local guidance
      instead of a peer verdict.
    cultural_context:
    - Adapt the expression of Receiving care and seasons of reduced agency to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use accessible yes/no options, extra processing time, an interpreter or a chosen advocate without
      bypassing the person. No one is required to provide intimate care, disclose credentials or surrender
      an existing support. If decision-making ability is genuinely uncertain, use qualified local guidance
      instead of a peer verdict.
  pause_conditions:
  - Pause Receiving care and seasons of reduced agency when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Receiving care and seasons of reduced agency practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Receiving care and seasons of reduced agency situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Educational and developmental only; trauma, suicidality, abuse, psychosis, addiction, severe functional
    decline, and medical concerns require qualified professional or emergency support.
