meaning_and_fit:
  purpose: Accept appropriate care during a season of reduced agency while communicating preferences and
    participating in decisions through an accessible form.
  why_recommended: Accept appropriate care during a season of reduced agency while communicating preferences
    and participating in decisions through an accessible form.
  claims:
  - statement: Accept appropriate care during a season of reduced agency while communicating preferences
      and participating in decisions through an accessible form.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The general consent principle requires an informed and voluntary choice; agreeing to one
      act is not an unlimited permission, and preferences can change.
    classification: professional_or_public_standard
    source_ids:
    - SRC-NHS-CONSENT-PRINCIPLES
    limitations: Used only for the general consent principle. The displayed review is overdue; jurisdiction-specific
      legal rules, exceptions, capacity decisions and treatment authority are not adopted or certified
      as current by this exercise. An ordinary help agreement is not a legal consent form.
  applicability_question: Does a voluntary, bounded Receiving care and seasons of reduced agency practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Receiving care and seasons of reduced agency as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible yes/no options, extra processing time, an interpreter or a
    chosen advocate without bypassing the person. No one is required to provide intimate care, disclose
    credentials or surrender an existing support. If decision-making ability is genuinely uncertain, use
    qualified local guidance instead of a peer verdict.
  opportunity_considerations: 'Use an ordinary, genuinely needed offer of help or this fictional case:
    someone recovering under an existing care plan wants assistance arranging a grocery delivery but wants
    to choose the items and keep financial details private. Use a note, preferred communication aid or
    willing helper. Nobody needs to enact illness or intimate care.'
  prerequisites:
  - 'Use an ordinary, genuinely needed offer of help or this fictional case: someone recovering under
    an existing care plan wants assistance arranging a grocery delivery but wants to choose the items
    and keep financial details private. Use a note, preferred communication aid or willing helper. Nobody
    needs to enact illness or intimate care.'
  dependencies: []
  safe_alternatives:
  - Use accessible yes/no options, extra processing time, an interpreter or a chosen advocate without
    bypassing the person. No one is required to provide intimate care, disclose credentials or surrender
    an existing support. If decision-making ability is genuinely uncertain, use qualified local guidance
    instead of a peer verdict.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Receiving care and seasons of reduced agency differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Receiving care and seasons
    of reduced agency as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an ordinary, genuinely needed offer of help or this fictional case: someone recovering under
    an existing care plan wants assistance arranging a grocery delivery but wants to choose the items
    and keep financial details private. Use a note, preferred communication aid or willing helper. Nobody
    needs to enact illness or intimate care. Goal: Accept appropriate care during a season of reduced
    agency while communicating preferences and participating in decisions through an accessible form.
    Scope: One ordinary help agreement practices receiving care and retaining a voice. A rehearsal does
    not establish experience of illness, injury, grief, unemployment, aging or crisis. It is not a legal
    capacity assessment or medical consent form. Time and effort: About 15 minutes to prepare, one short
    agreement or rehearsal, and a brief review. Adaptation: Use accessible yes/no options, extra processing
    time, an interpreter or a chosen advocate without bypassing the person. No one is required to provide
    intimate care, disclose credentials or surrender an existing support. If decision-making ability is
    genuinely uncertain, use qualified local guidance instead of a peer verdict. Keep personal working
    notes outside the check-in; record only the listed observations.


    Reference support:

    Consent to treatment — overview: https://www.nhs.uk/tests-and-treatments/consent-to-treatment/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible yes/no options, extra processing time, an interpreter or a chosen
    advocate without bypassing the person. No one is required to provide intimate care, disclose credentials
    or surrender an existing support. If decision-making ability is genuinely uncertain, use qualified
    local guidance instead of a peer verdict.
  expected_burden: About 15 minutes to prepare, one short agreement or rehearsal, and a brief review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Receiving care and seasons of reduced agency protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Receiving care and seasons of reduced agency action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    yes/no options, extra processing time, an interpreter or a chosen advocate without bypassing the person.
    No one is required to provide intimate care, disclose credentials or surrender an existing support.
    If decision-making ability is genuinely uncertain, use qualified local guidance instead of a peer
    verdict.
  actions:
  - stable_id: PRACTICE-COMP-0608-RECEIVING-CARE-AND-SEASONS-OF-REDUCED-AGENCY-01-A1
    sequence: 1
    title: Make the person's choices visible before assigning the helper's tasks
    instructions: 'Divide the activity into choices the person wants to make, practical work they want
      help with and information they want kept private. For the case, the person chooses items; the helper
      may explain or enter agreed delivery options; payment credentials remain private. State how the
      person communicates yes, no, uncertainty and a request for more time, using their usual reliable
      method. Ask rather than assume which choices they want help considering. Reduced speed, fatigue
      or use of a communication aid does not itself establish that the person cannot decide.


      Observation checks: Decision choices and practical assistance are separated; Privacy preferences
      are explicit; Yes no uncertainty and pause have usable communication forms; Reduced capacity is
      not automatically treated as loss of decision authority. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0608-RECEIVING-CARE-AND-SEASONS-OF-REDUCED-AGENCY-01
