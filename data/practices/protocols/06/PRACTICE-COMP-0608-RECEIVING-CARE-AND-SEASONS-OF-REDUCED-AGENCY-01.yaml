  - stable_id: PRACTICE-COMP-0608-RECEIVING-CARE-AND-SEASONS-OF-REDUCED-AGENCY-01-A2
    sequence: 2
    title: Negotiate a bounded agreement that can be changed
    instructions: 'Use this opening: I would like help with the delivery options; I want to choose the
      items, and please check before changing anything. Agree on the task, timing, information the helper
      needs, the pause signal and a backup if the helper is unavailable. The helper states their own limits
      without threatening abandonment or demanding gratitude. Rehearse a change of mind, such as declining
      a substitution, and require a fresh check rather than treating the earlier agreement as blanket
      permission. Clinical or legal decisions need the relevant professional process; this ordinary agreement
      creates no such authority.


      Observation checks: The agreement identifies task timing and helper limits; Help is limited to what
      was agreed; A changed preference prompts a fresh check; Backup arrangements do not depend on coercion
      or unlimited access. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0608-RECEIVING-CARE-AND-SEASONS-OF-REDUCED-AGENCY-01
      action_stable_id: PRACTICE-COMP-0608-RECEIVING-CARE-AND-SEASONS-OF-REDUCED-AGENCY-01-A2
      competency_stable_id: '06.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
