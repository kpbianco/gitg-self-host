meaning_and_fit:
  purpose: Identify protective supports and survivor-chosen steps that address safety, agency, trust,
    bodily ownership, boundaries and meaning without blaming the harmed person.
  why_recommended: Identify protective supports and survivor-chosen steps that address safety, agency,
    trust, bodily ownership, boundaries and meaning without blaming the harmed person.
  claims:
  - statement: Identify protective supports and survivor-chosen steps that address safety, agency, trust,
      bodily ownership, boundaries and meaning without blaming the harmed person.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: RAINN describes survivor support that prioritizes safety, trust, autonomy and choices without
      pressure; it recognizes that recovery follows different paths.
    classification: safety_precaution
    source_ids:
    - SRC-RAINN-CHOICE-AND-SUPPORT
    limitations: A sexual-violence support provider's description of its approach, not empirical validation
      of the exercise or a claim that this service handles every kind of betrayal. No treatment method
      or published support mnemonic is reproduced.
  applicability_question: Does a voluntary, bounded Recovery after violation and betrayal practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Recovery after violation and betrayal as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Keep the exercise fictional or work with a qualified support person. Use a
    neutral written response if speech or role-play is uncomfortable. Do not ask a survivor to supply
    training material, remove their supports or document private evidence here. Immediate danger requires
    local emergency help rather than finishing this plan.
  opportunity_considerations: 'Use this fictional case: a trusted person shared private correspondence
    after repeatedly pressuring its owner; the owner wants privacy and support but does not want physical
    comfort or a detailed retelling. Do not invent additional violence. Read RAINN''s explanation of its
    approach to choice and support as one provider''s example, not as a service for every kind of betrayal.'
  prerequisites:
  - 'Use this fictional case: a trusted person shared private correspondence after repeatedly pressuring
    its owner; the owner wants privacy and support but does not want physical comfort or a detailed retelling.
    Do not invent additional violence. Read RAINN''s explanation of its approach to choice and support
    as one provider''s example, not as a service for every kind of betrayal.'
  dependencies: []
  safe_alternatives:
  - Keep the exercise fictional or work with a qualified support person. Use a neutral written response
    if speech or role-play is uncomfortable. Do not ask a survivor to supply training material, remove
    their supports or document private evidence here. Immediate danger requires local emergency help rather
    than finishing this plan.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Recovery after violation and betrayal differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Recovery after violation and
    betrayal as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: a trusted person shared private correspondence after repeatedly pressuring
    its owner; the owner wants privacy and support but does not want physical comfort or a detailed retelling.
    Do not invent additional violence. Read RAINN''s explanation of its approach to choice and support
    as one provider''s example, not as a service for every kind of betrayal. Goal: Identify protective
    supports and survivor-chosen steps that address safety, agency, trust, bodily ownership, boundaries
    and meaning without blaming the harmed person. Scope: The supplied case supports planning and response
    rehearsal. It does not demonstrate recovery from assault, abuse, coercion or betrayal, and it does
    not authorize investigating harm or confronting a suspected perpetrator. Time and effort: About 20
    minutes for the plan, a short private rehearsal, and 10 minutes to check a support route. Adaptation:
    Keep the exercise fictional or work with a qualified support person. Use a neutral written response
    if speech or role-play is uncomfortable. Do not ask a survivor to supply training material, remove
    their supports or document private evidence here. Immediate danger requires local emergency help rather
    than finishing this plan. Keep personal working notes outside the check-in; record only the listed
    observations.


    Reference support:

    Help and Healing: https://rainn.org/help-and-healing/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Keep the exercise fictional or work with a qualified support person. Use a neutral
    written response if speech or role-play is uncomfortable. Do not ask a survivor to supply training
    material, remove their supports or document private evidence here. Immediate danger requires local
    emergency help rather than finishing this plan.
  expected_burden: About 20 minutes for the plan, a short private rehearsal, and 10 minutes to check a
    support route.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Recovery after violation and betrayal protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Recovery after violation and betrayal action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Keep the exercise
    fictional or work with a qualified support person. Use a neutral written response if speech or role-play
    is uncomfortable. Do not ask a survivor to supply training material, remove their supports or document
    private evidence here. Immediate danger requires local emergency help rather than finishing this plan.
  actions:
  - stable_id: PRACTICE-COMP-0603-RECOVERY-AFTER-VIOLATION-AND-BETRAYAL-01-A1
    sequence: 1
    title: Give each area of recovery a concrete protective option
    instructions: 'Create six entries for the fictional person: safety may require advice about further
      access to private material; agency means choosing the next step; trust can begin with a limited
      agreed task; bodily ownership means asking before touch; boundaries define what information may
      be shared; meaning can include an ordinary valued activity without a redemptive explanation. For
      each, write what the person can choose and what a supporter must ask before doing. Separate the
      violator''s responsibility from the harmed person''s options now. Safety planning for ongoing abuse
      belongs with an appropriate trained service, not a generic instruction to confront or abruptly leave.


      Observation checks: Six recovery areas have concrete protective options; Choices remain with the
      harmed person; Harm is not attributed to insufficient resilience or prevention; Ongoing danger calls
      for appropriate professional safety support. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0603-RECOVERY-AFTER-VIOLATION-AND-BETRAYAL-01
      action_stable_id: PRACTICE-COMP-0603-RECOVERY-AFTER-VIOLATION-AND-BETRAYAL-01-A1
      competency_stable_id: '06.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0603_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0603_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - six_recovery_areas_have_concrete_protective_options
        - choices_remain_with_the_harmed_person
        - harm_is_not_attributed_to_insufficient_resilience_or_prevention
        - ongoing_danger_calls_for_appropriate_professional_safety_support
      - measurement_id: c0603_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0603_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0603-RECOVERY-AFTER-VIOLATION-AND-BETRAYAL-01-A2
    sequence: 2
    title: Rehearse support without taking control of the account
    instructions: 'Privately practice this opening: What happened to your privacy matters; you can choose
      what to tell me. Would you prefer company, practical help finding support, or space? Then rehearse
      the person declining touch, declining details and accepting help finding a service. Respond to each
      choice directly. Do not add a demand to forgive, reconcile, report, explain a lesson or prove credibility
      to you. State that confidentiality has limits where immediate safety or applicable reporting duties
      require help; avoid promises you cannot keep. No message is sent and no real person''s story is
      solicited for the rehearsal.


      Observation checks: The opening acknowledges the particular violation; Three different preferences
      receive respectful responses; Forgiveness reporting and reconciliation are not imposed; Confidentiality
      is described without an absolute promise. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0603-RECOVERY-AFTER-VIOLATION-AND-BETRAYAL-01
      action_stable_id: PRACTICE-COMP-0603-RECOVERY-AFTER-VIOLATION-AND-BETRAYAL-01-A2
      competency_stable_id: '06.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0603_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0603_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
