        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0603-RECOVERY-AFTER-VIOLATION-AND-BETRAYAL-01-A3
    sequence: 3
    title: Make one protective support option usable
    instructions: 'Choose one need from the plan and locate a relevant public service: a survivor-support
      organization for sexual violence, an abuse-support service for coercion, a qualified clinician,
      or an appropriate privacy or advocacy service for the supplied case. Check what it actually offers,
      who can use it and how someone can ask about privacy before sharing details. Add a draft request
      limited to the help wanted. For an actual manageable situation, any contact is the affected person''s
      choice and may require a safer device or channel advised by the service. A saved public route is
      preparation; it is not a completed recovery step for someone else.


      Observation checks: The service fits the specific support need; Its scope and access conditions
      are checked; The draft request discloses only necessary information; The record distinguishes preparation
      from chosen live contact. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Which concrete choice does each part of the plan protect? Where could helpful intent
      become pressure or takeover? Keep unresolved safety and access questions visible, and name the next
      appropriate support step without assigning a recovery deadline.


      Examples: Supportive: The plan covered privacy, bodily choice and trust, and the rehearsal accepted
      a refusal of touch while identifying an appropriate support route.


      Mixed: The supporter respected the person''s wishes but initially selected a service outside its
      stated scope; the mismatch was recorded and corrected.


      Contradictory: Help was made conditional on reporting, reconciliation or a detailed account, or
      blame was placed on the person whose boundary was violated.


      Inconclusive: The plan contained general encouragement but no specific choice, protective option
      or usable support route.'
