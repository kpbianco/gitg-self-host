        criteria:
        - the_opening_acknowledges_the_particular_violation
        - three_different_preferences_receive_respectful_responses
        - forgiveness_reporting_and_reconciliation_are_not_imposed
        - confidentiality_is_described_without_an_absolute_promise
      - measurement_id: c0603_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0603_a2_adverse
        kind: boolean
        role: adverse
