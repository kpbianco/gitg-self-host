    title: Bound the qualified question for Chronic illness adaptation
    instructions: 'Turn Chronic illness adaptation into one educational or planning question and identify
      the qualification and jurisdiction needed to answer it. Use the canonical scope to separate general
      learning from diagnosis, treatment, legal advice, financial advice, safeguarding decisions, or other
      professional judgment: Build a meaningful life around fluctuating symptoms, treatment, uncertainty,
      fatigue, and changed capacity.'
