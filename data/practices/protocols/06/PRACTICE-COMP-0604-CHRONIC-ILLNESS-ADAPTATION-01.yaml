  - c0604_a3_adverse
  adverse_or_contradictory_indicators:
  - The Chronic illness adaptation action exceeded consent, authority, privacy, qualification, role, burden,
    or safety boundaries.
  - The evidence contradicted the intended Chronic illness adaptation criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Chronic illness adaptation explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Chronic illness adaptation context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Chronic illness adaptation observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Chronic illness adaptation rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can plan with variable energy, communicate limits, and preserve identity beyond illness.—not
    completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Chronic illness adaptation requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Chronic
    illness adaptation contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L07
  - L11
  - L17
  - L36
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Chronic illness adaptation evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The bound the qualified question for chronic illness adaptation action was attempted or explicitly
    deferred.
  - The prepare minimum information for chronic illness adaptation action was attempted or explicitly
    deferred.
  - The record a bounded chronic illness adaptation disposition action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0604_a1_primary
    - c0604_a2_primary
    - c0604_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Chronic illness adaptation only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Chronic illness adaptation across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Chronic illness adaptation require in this exact context, what remains outside my
      role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Chronic illness adaptation criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can plan with variable energy, communicate limits, and preserve
      identity beyond illness.', what contradiction or missing context matters most, and should this Chronic
      illness adaptation design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Chronic illness adaptation design only when the context and burden
      remain appropriate.
    adapt: Change the Chronic illness adaptation medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Chronic illness adaptation when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Chronic illness adaptation questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Chronic illness adaptation criteria were observed with provenance and no adverse
      boundary signal in the selected context.
    mixed: Some Chronic illness adaptation criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Chronic illness adaptation criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Chronic illness adaptation action was deferred, not observed, not applicable, stale,
      insufficiently bounded, or too confounded to interpret.
