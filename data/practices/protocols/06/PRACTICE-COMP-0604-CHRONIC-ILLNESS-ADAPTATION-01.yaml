  adverse_or_contradictory_indicators:
  - A good morning was used to justify catching up on every task, or care was skipped to meet an activity
    target invented by the exercise.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Chronic illness adaptation explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Chronic illness adaptation context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Chronic illness adaptation observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Chronic illness adaptation rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Write a day plan that can change without becoming a failure. Observed
    checks: Existing care commitments are preserved or referred to the care team; Ordinary activities
    have reduced or supported alternatives; A valued interest or relationship remains visible; The plan
    allows uncertainty without invented capacity scores. Action 2: Communicate the limit before an obligation
    silently expands. Observed checks: The message specifies a current limit and valued purpose; A feasible
    alternative is offered; Unnecessary medical disclosure is avoided; The response does not create an
    obligation to overcompensate. Action 3: Use the flexible plan and review immediate and later effects.
    Observed checks: A changed-capacity situation is actually observed or explicitly simulated; The plan
    changes without abandoning the valued purpose by default; Immediate and delayed effects are distinguished
    where observed; Revision does not impose automatic activity increases.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A flexible schedule was written but neither an actual
    day nor the supplied changed-capacity scenario was examined.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Chronic
    illness adaptation contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
