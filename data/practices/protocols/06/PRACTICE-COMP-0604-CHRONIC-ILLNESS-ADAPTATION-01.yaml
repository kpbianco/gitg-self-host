meaning_and_fit:
  purpose: Adapt ordinary commitments around fluctuating symptoms, treatment and uncertainty while communicating
    limits and preserving valued identity beyond illness.
  why_recommended: Adapt ordinary commitments around fluctuating symptoms, treatment and uncertainty while
    communicating limits and preserving valued identity beyond illness.
  claims:
  - statement: Adapt ordinary commitments around fluctuating symptoms, treatment and uncertainty while
      communicating limits and preserving valued identity beyond illness.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: ME/CFS can involve delayed symptom worsening after exertion; activity management must respect
      individual limits, and standard exercise advice for healthy people can be unsuitable.
    classification: safety_precaution
    source_ids:
    - SRC-CDC-MECFS-CAPACITY-BOUNDARY
    limitations: Disease-specific caution against a universal activity-increase rule, not a diagnosis
      or a pacing prescription for every illness. The exercise preserves existing qualified care and does
      not set activity doses or change treatment.
  applicability_question: Does a voluntary, bounded Chronic illness adaptation practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Chronic illness adaptation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use one activity, spoken choices or a trusted helper if planning itself is
    burdensome. Rest and receiving help can be appropriate choices. Keep medication, diet, rehabilitation
    and activity limits with qualified care. Do not use a healthy-person challenge, push through worsening
    symptoms or impose graded increases as part of this exercise.
  opportunity_considerations: 'Use an ordinary upcoming day if you already manage variable capacity, or
    this fictional day: a person has an established care appointment, a household task and a valued conversation,
    but cannot predict how much energy will be available. Do not invent a diagnosis or alter care. Read
    the CDC ME/CFS reference for a specific reason that pushing activity can be unsuitable; its disease-specific
    guidance is not universal.'
  prerequisites:
  - 'Use an ordinary upcoming day if you already manage variable capacity, or this fictional day: a person
    has an established care appointment, a household task and a valued conversation, but cannot predict
    how much energy will be available. Do not invent a diagnosis or alter care. Read the CDC ME/CFS reference
    for a specific reason that pushing activity can be unsuitable; its disease-specific guidance is not
    universal.'
  dependencies: []
  safe_alternatives:
  - Use one activity, spoken choices or a trusted helper if planning itself is burdensome. Rest and receiving
    help can be appropriate choices. Keep medication, diet, rehabilitation and activity limits with qualified
    care. Do not use a healthy-person challenge, push through worsening symptoms or impose graded increases
    as part of this exercise.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Chronic illness adaptation differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Chronic illness adaptation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an ordinary upcoming day if you already manage variable capacity, or this fictional day:
    a person has an established care appointment, a household task and a valued conversation, but cannot
    predict how much energy will be available. Do not invent a diagnosis or alter care. Read the CDC ME/CFS
    reference for a specific reason that pushing activity can be unsuitable; its disease-specific guidance
    is not universal. Goal: Adapt ordinary commitments around fluctuating symptoms, treatment and uncertainty
    while communicating limits and preserving valued identity beyond illness. Scope: This is practical
    scheduling and communication, not a treatment or exercise prescription. A fictional plan demonstrates
    preparedness; personal adaptation requires an actual usable trial within existing care guidance. Time
    and effort: About 20 minutes to prepare, one ordinary day or fictional walk-through, and a short later
    review that allows delayed effects to be noticed. Adaptation: Use one activity, spoken choices or
    a trusted helper if planning itself is burdensome. Rest and receiving help can be appropriate choices.
    Keep medication, diet, rehabilitation and activity limits with qualified care. Do not use a healthy-person
    challenge, push through worsening symptoms or impose graded increases as part of this exercise. Keep
    personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Manage ME/CFS: https://www.cdc.gov/me-cfs/management/index.html'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use one activity, spoken choices or a trusted helper if planning itself is burdensome.
    Rest and receiving help can be appropriate choices. Keep medication, diet, rehabilitation and activity
    limits with qualified care. Do not use a healthy-person challenge, push through worsening symptoms
    or impose graded increases as part of this exercise.
  expected_burden: About 20 minutes to prepare, one ordinary day or fictional walk-through, and a short
    later review that allows delayed effects to be noticed.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Chronic illness adaptation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Chronic illness adaptation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use one activity,
    spoken choices or a trusted helper if planning itself is burdensome. Rest and receiving help can be
    appropriate choices. Keep medication, diet, rehabilitation and activity limits with qualified care.
    Do not use a healthy-person challenge, push through worsening symptoms or impose graded increases
    as part of this exercise.
  actions:
  - stable_id: PRACTICE-COMP-0604-CHRONIC-ILLNESS-ADAPTATION-01-A1
    sequence: 1
    title: Write a day plan that can change without becoming a failure
    instructions: 'List essential care commitments under the existing plan, necessary daily needs and
      one personally meaningful connection or interest. For each ordinary activity, describe a usual form,
      a reduced form and a way to defer or ask for help. In the supplied case, the conversation could
      be a short text instead of a visit; the household task could be delegated rather than caught up
      later. Keep the care appointment or ask the service how to adjust it instead of deciding medical
      priorities yourself. Leave room for uncertainty rather than assigning an invented energy score or
      promising what a good morning will permit.


      Observation checks: Existing care commitments are preserved or referred to the care team; Ordinary
      activities have reduced or supported alternatives; A valued interest or relationship remains visible;
      The plan allows uncertainty without invented capacity scores. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0604-CHRONIC-ILLNESS-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-0604-CHRONIC-ILLNESS-ADAPTATION-01-A1
      competency_stable_id: '06.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0604_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0604_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - existing_care_commitments_are_preserved_or_referred_to_the_care_team
        - ordinary_activities_have_reduced_or_supported_alternatives
        - a_valued_interest_or_relationship_remains_visible
        - the_plan_allows_uncertainty_without_invented_capacity_scores
      - measurement_id: c0604_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0604_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0604-CHRONIC-ILLNESS-ADAPTATION-01-A2
    sequence: 2
    title: Communicate the limit before an obligation silently expands
    instructions: 'Prepare a concrete message for one affected person: I would like to stay connected;
      today I can offer a short message, and I cannot commit to a visit. Can we use that form and revisit
      the plan later? State the limit, the valued purpose and the offered alternative without supplying
      medical details or promising to compensate through overexertion. In a real context, send or say
      it only to the appropriate person. For the fictional case, rehearse both acceptance and disappointment;
      acknowledge the other person''s needs while retaining the limit.


      Observation checks: The message specifies a current limit and valued purpose; A feasible alternative
      is offered; Unnecessary medical disclosure is avoided; The response does not create an obligation
      to overcompensate. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0604-CHRONIC-ILLNESS-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-0604-CHRONIC-ILLNESS-ADAPTATION-01-A2
      competency_stable_id: '06.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0604_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0604_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_message_specifies_a_current_limit_and_valued_purpose
        - a_feasible_alternative_is_offered
        - unnecessary_medical_disclosure_is_avoided
        - the_response_does_not_create_an_obligation_to_overcompensate
      - measurement_id: c0604_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0604_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0604-CHRONIC-ILLNESS-ADAPTATION-01-A3
    sequence: 3
    title: Use the flexible plan and review immediate and later effects
    instructions: 'Follow the appropriate version during the ordinary day, or walk through the fictional
      day with this change: capacity is lower than expected before the conversation. Record which choice
      changed, what support was used and what happened to the valued purpose. For a personal trial, leave
      room to notice later effects before deciding the activity was sustainable; follow existing clinical
      advice and seek it for new or concerning changes. Do not increase a quota because one occasion went
      well. Revise one scheduling assumption or keep the supported version.


      Observation checks: A changed-capacity situation is actually observed or explicitly simulated; The
      plan changes without abandoning the valued purpose by default; Immediate and delayed effects are
      distinguished where observed; Revision does not impose automatic activity increases. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which part of the plan remained meaningful when capacity changed, and which assumption
      was too rigid? Keep any unobserved later effects unknown. Choose a sustainable revision or a question
      for the care team; ordinary planning cannot establish improved health.


      Examples: Supportive: A person replaced a visit with an agreed short message, preserved established
      care and reviewed later effects before deciding whether the plan was sustainable.


      Mixed: The reduced activity fit the morning but its later effects were unclear, so the person kept
      that uncertainty and avoided increasing the commitment.


      Contradictory: A good morning was used to justify catching up on every task, or care was skipped
      to meet an activity target invented by the exercise.


      Inconclusive: A flexible schedule was written but neither an actual day nor the supplied changed-capacity
      scenario was examined.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0604-CHRONIC-ILLNESS-ADAPTATION-01
