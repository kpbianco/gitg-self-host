  pause_conditions:
  - Pause Dignity under limitation and loss of role when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Dignity under limitation and loss of role practice for harm, coercion, retaliation risk,
