meaning_and_fit:
  purpose: Separate human worth from independence, productivity, cognition, appearance and usefulness,
    then choose conduct that sustains self-respect and relationship under limitation.
  why_recommended: Separate human worth from independence, productivity, cognition, appearance and usefulness,
    then choose conduct that sustains self-respect and relationship under limitation.
  claims:
  - statement: Separate human worth from independence, productivity, cognition, appearance and usefulness,
      then choose conduct that sustains self-respect and relationship under limitation.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Dignity under limitation and loss of role practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Dignity under limitation and loss of role as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Stay with the fictional case, use a trusted reader or express the choices
    through a familiar communication aid. Do not require memory tests, appearance changes, job replacement
    or proof of resilience. If personal reflection is too painful, defer it without interpreting that
    choice as a deficit in dignity.
  opportunity_considerations: 'Use this fictional case: a former community organizer can no longer manage
    events and fears being welcome only when useful. A small manageable personal role change is optional.
    Use a private note or spoken reflection; no painful personal history or public statement is required.'
  prerequisites:
  - 'Use this fictional case: a former community organizer can no longer manage events and fears being
    welcome only when useful. A small manageable personal role change is optional. Use a private note
    or spoken reflection; no painful personal history or public statement is required.'
  dependencies: []
  safe_alternatives:
  - Stay with the fictional case, use a trusted reader or express the choices through a familiar communication
    aid. Do not require memory tests, appearance changes, job replacement or proof of resilience. If personal
    reflection is too painful, defer it without interpreting that choice as a deficit in dignity.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Dignity under limitation and loss of role differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Dignity under limitation and
    loss of role as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: a former community organizer can no longer manage events and fears
    being welcome only when useful. A small manageable personal role change is optional. Use a private
    note or spoken reflection; no painful personal history or public statement is required. Goal: Separate
    human worth from independence, productivity, cognition, appearance and usefulness, then choose conduct
    that sustains self-respect and relationship under limitation. Scope: The exercise examines a changed-role
    situation and one relational action. It does not require feeling positive about loss or prove adaptation
    to a permanent disability or cognitive change. Time and effort: About 15 minutes for the distinction,
    one modest relational step or rehearsal, and a 10-minute review. Adaptation: Stay with the fictional
    case, use a trusted reader or express the choices through a familiar communication aid. Do not require
    memory tests, appearance changes, job replacement or proof of resilience. If personal reflection is
    too painful, defer it without interpreting that choice as a deficit in dignity. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Stay with the fictional case, use a trusted reader or express the choices through
    a familiar communication aid. Do not require memory tests, appearance changes, job replacement or
    proof of resilience. If personal reflection is too painful, defer it without interpreting that choice
    as a deficit in dignity.
  expected_burden: About 15 minutes for the distinction, one modest relational step or rehearsal, and
    a 10-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Dignity under limitation and loss of role protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Dignity under limitation and loss of role action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Stay with the
    fictional case, use a trusted reader or express the choices through a familiar communication aid.
    Do not require memory tests, appearance changes, job replacement or proof of resilience. If personal
    reflection is too painful, defer it without interpreting that choice as a deficit in dignity.
  actions:
  - stable_id: PRACTICE-COMP-0610-DIGNITY-UNDER-LIMITATION-AND-LOSS-OF-ROLE-01-A1
    sequence: 1
    title: Identify five conditions that must not become a price of belonging
    instructions: 'Consider five mistaken conditions: being independent enough, producing enough, remembering
      or reasoning quickly enough, looking a certain way, and being useful to others. For each, name a
      concrete respectful response that does not depend on meeting the condition: asking how help is wanted,
      including someone without an assigned job, allowing communication time, respecting appearance preferences,
      or offering company without repayment. In the case, distinguish the real loss of organizing ability
      from the unsupported claim that the person no longer deserves welcome. Let sadness or anger about
      the loss remain.


      Observation checks: Five conditional judgments of worth are examined; Each is paired with a concrete
      respectful response; Actual loss is distinguished from loss of human worth; Difficult feelings are
      not treated as a failed attitude. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0610-DIGNITY-UNDER-LIMITATION-AND-LOSS-OF-ROLE-01
      action_stable_id: PRACTICE-COMP-0610-DIGNITY-UNDER-LIMITATION-AND-LOSS-OF-ROLE-01-A1
      competency_stable_id: '06.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0610_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0610_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - five_conditional_judgments_of_worth_are_examined
        - each_is_paired_with_a_concrete_respectful_response
        - actual_loss_is_distinguished_from_loss_of_human_worth
        - difficult_feelings_are_not_treated_as_a_failed_attitude
      - measurement_id: c0610_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0610_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0610-DIGNITY-UNDER-LIMITATION-AND-LOSS-OF-ROLE-01-A2
    sequence: 2
    title: Offer or request connection without requiring a replacement achievement
    instructions: 'Choose a low-demand form of contact with a suitable person, or draft this for the fictional
      organizer: I would like to stay in touch as a participant; I cannot run the event, but I would welcome
      a short conversation if it suits us both. The other person''s response can offer genuine company
      without immediately assigning a new useful role. Agree on timing, form and a way to decline or end
      the exchange. An actual message is sent only in an appropriate relationship; fictional drafting
      remains rehearsal. No one must earn connection by telling an inspiring story or displaying cheerful
      endurance.


      Observation checks: The proposed connection does not depend on a productive role; Limits and the
      desired form of contact are explicit; Both people can freely decline or end the exchange; Actual
      contact is distinguished from a fictional draft. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0610-DIGNITY-UNDER-LIMITATION-AND-LOSS-OF-ROLE-01
      action_stable_id: PRACTICE-COMP-0610-DIGNITY-UNDER-LIMITATION-AND-LOSS-OF-ROLE-01-A2
      competency_stable_id: '06.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0610_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0610_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_proposed_connection_does_not_depend_on_a_productive_role
        - limits_and_the_desired_form_of_contact_are_explicit
        - both_people_can_freely_decline_or_end_the_exchange
        - actual_contact_is_distinguished_from_a_fictional_draft
      - measurement_id: c0610_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0610_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0610-DIGNITY-UNDER-LIMITATION-AND-LOSS-OF-ROLE-01-A3
    sequence: 3
    title: Check whether respect survives the absence of improvement
    instructions: 'Review the actual exchange, or add this variation: the fictional organizer''s limitation
      persists and communication takes longer than before. Ask whether the same welcome, privacy and opportunity
      to express preferences still apply. Identify any subtle bargain such as inclusion only if the person
      becomes useful again, improves quickly or hides their needs. Revise one phrase or arrangement that
      makes dignity conditional. Choose a sustainable way to remain connected, including supported communication
      or quiet company, while allowing grief and realistic limits to coexist.


      Observation checks: Continuing limitation is considered without a recovery requirement; A conditional
      bargain is identified or explicitly checked for; One phrase or arrangement is reviewed against equal
      dignity; Connection can continue through supported or nonproductive forms. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What real loss needs acknowledgment, and what respect or relationship should not depend
      on recovering it? Identify one changed interaction or an unresolved need for support. No response
      to this exercise measures human worth.


      Examples: Supportive: The former organizer was invited to participate without a job, and the arrangement
      allowed more time and a shorter visit without demanding improvement.


      Mixed: A warm invitation still assumed the person would resume organizing soon; the expectation
      was named and removed.


      Contradictory: Belonging was made conditional on usefulness, looking well or presenting the limitation
      as an inspirational success story.


      Inconclusive: The learner affirmed dignity in general but examined no conditional judgment or concrete
      relational choice.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0610-DIGNITY-UNDER-LIMITATION-AND-LOSS-OF-ROLE-01
