      Professional and emergency boundaries; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Prepare text or communication-aid wording and a locally appropriate accessible contact route. A
      trusted helper may assist with public information. Keep the rehearsal fictional and brief. Contact
      details and service scope can change, so check the card before relying on it later; actual urgency
      takes precedence over this practice.
    cultural_context:
    - Adapt the expression of Professional and emergency boundaries to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Prepare text or communication-aid wording and a locally appropriate accessible contact route. A
      trusted helper may assist with public information. Keep the rehearsal fictional and brief. Contact
      details and service scope can change, so check the card before relying on it later; actual urgency
