  - stable_id: PRACTICE-COMP-0614-PROFESSIONAL-AND-EMERGENCY-BOUNDARIES-01-A3
    sequence: 3
    title: Rehearse a brief handoff without trying to become the clinician
    instructions: 'Privately rehearse: I am concerned because of this observed change. I can help contact
      the appropriate service; this needs more than our exercise. Supply only a plain observation, not
      a diagnosis, and ask how to make contact in the person''s usable communication form. Compare a nonurgent
      care appointment, a suicidal statement needing prompt crisis support and an immediate life-threatening
      medical situation needing emergency help. Do not promise secrecy, argue someone out of an unusual
      belief, investigate abuse or improvise treatment. In a real event, use the appropriate service promptly
      and follow trained guidance while keeping your own safety in view; never wait to collect exercise
      evidence.


      Observation checks: The handoff states an observation and a concrete help route; Three scenarios
      receive distinct appropriate contact responses; Privacy is respected without promising absolute
      secrecy; No treatment investigation or delay for evidence is introduced. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Can you find the right kind of help and communicate a concern without diagnosing or
      delaying? Identify an unresolved access detail and a realistic way to clarify it. Completing a card
      or rehearsal does not qualify someone to manage a crisis alone.


      Examples: Supportive: The card contained verified local routes and the rehearsal distinguished an
      ordinary appointment from prompt crisis contact and a life-threatening emergency.


      Mixed: The emergency route was clear but the preferred crisis contact had an unresolved communication-access
      question, which remained explicitly open.


      Contradictory: A peer labeled a situation safe without assessment, promised secrecy, or delayed
      seeking help until the curriculum exercise was complete.


      Inconclusive: The learner listed professional titles without usable contact routes or a concrete
      handoff for the supplied scenarios.'
