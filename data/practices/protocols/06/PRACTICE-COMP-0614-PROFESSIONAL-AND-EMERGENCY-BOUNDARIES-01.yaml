meaning_and_fit:
  purpose: Recognize the limits of peer and self-guided support across trauma, suicidality, abuse, psychosis,
    addiction, severe functional decline and medical concerns, and identify appropriate professional or
    emergency routes.
  why_recommended: Recognize the limits of peer and self-guided support across trauma, suicidality, abuse,
    psychosis, addiction, severe functional decline and medical concerns, and identify appropriate professional
    or emergency routes.
  claims:
  - statement: Recognize the limits of peer and self-guided support across trauma, suicidality, abuse,
      psychosis, addiction, severe functional decline and medical concerns, and identify appropriate professional
      or emergency routes.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: US life-threatening emergencies call for 911; 988 provides suicide and emotional-crisis
      support by call or text, and ordinary mental health care requires an appropriate provider.
    classification: safety_precaution
    source_ids:
    - SRC-NIMH-HELP-ROUTES
    limitations: US public resource guidance only. Local availability, accessibility, eligibility and
      other countries' services need current verification. A resource card or rehearsal is not a clinical
      assessment or emergency-response qualification.
  applicability_question: Does a voluntary, bounded Professional and emergency boundaries practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Professional and emergency boundaries as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Prepare text or communication-aid wording and a locally appropriate accessible
    contact route. A trusted helper may assist with public information. Keep the rehearsal fictional and
    brief. Contact details and service scope can change, so check the card before relying on it later;
    actual urgency takes precedence over this practice.
  opportunity_considerations: Use the linked NIMH help page and official services for the country where
    the plan would be used. Work with fictional categories rather than a real person's private symptoms.
    If a concern is occurring now, contact suitable support promptly instead of completing the exercise.
    In the US, call 911 for life-threatening emergencies and call or text 988 for suicide or emotional-crisis
    support; outside the US use local emergency and crisis services.
  prerequisites:
  - Use the linked NIMH help page and official services for the country where the plan would be used.
    Work with fictional categories rather than a real person's private symptoms. If a concern is occurring
    now, contact suitable support promptly instead of completing the exercise. In the US, call 911 for
    life-threatening emergencies and call or text 988 for suicide or emotional-crisis support; outside
    the US use local emergency and crisis services.
  dependencies: []
  safe_alternatives:
  - Prepare text or communication-aid wording and a locally appropriate accessible contact route. A trusted
    helper may assist with public information. Keep the rehearsal fictional and brief. Contact details
    and service scope can change, so check the card before relying on it later; actual urgency takes precedence
    over this practice.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Professional and emergency boundaries differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Professional and emergency
    boundaries as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the linked NIMH help page and official services for the country where the plan would be
    used. Work with fictional categories rather than a real person''s private symptoms. If a concern is
    occurring now, contact suitable support promptly instead of completing the exercise. In the US, call
    911 for life-threatening emergencies and call or text 988 for suicide or emotional-crisis support;
    outside the US use local emergency and crisis services. Goal: Recognize the limits of peer and self-guided
    support across trauma, suicidality, abuse, psychosis, addiction, severe functional decline and medical
    concerns, and identify appropriate professional or emergency routes. Scope: This is resource preparation
    and fictional response rehearsal, not diagnosis, a risk score, emergency-response certification or
    a substitute for contacting help in a real situation. Time and effort: About 20 minutes to locate
    resources and a short private handoff rehearsal; no real emergency or test call is needed. Adaptation:
    Prepare text or communication-aid wording and a locally appropriate accessible contact route. A trusted
    helper may assist with public information. Keep the rehearsal fictional and brief. Contact details
    and service scope can change, so check the card before relying on it later; actual urgency takes precedence
    over this practice. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Help for Mental Illnesses: https://www.nimh.nih.gov/health/find-help'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Prepare text or communication-aid wording and a locally appropriate accessible
    contact route. A trusted helper may assist with public information. Keep the rehearsal fictional and
    brief. Contact details and service scope can change, so check the card before relying on it later;
    actual urgency takes precedence over this practice.
  expected_burden: About 20 minutes to locate resources and a short private handoff rehearsal; no real
    emergency or test call is needed.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Professional and emergency boundaries protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Professional and emergency boundaries action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Prepare text
    or communication-aid wording and a locally appropriate accessible contact route. A trusted helper
    may assist with public information. Keep the rehearsal fictional and brief. Contact details and service
    scope can change, so check the card before relying on it later; actual urgency takes precedence over
    this practice.
  actions:
  - stable_id: PRACTICE-COMP-0614-PROFESSIONAL-AND-EMERGENCY-BOUNDARIES-01-A1
    sequence: 1
    title: Recognize seven situations in which the curriculum is insufficient
    instructions: 'Make seven short entries: persistent trauma-related distress needs a qualified assessment
      rather than forced retelling; suicidal thoughts need prompt crisis or professional help rather than
      a promise to cope alone; suspected abuse needs appropriate protection support; new experiences such
      as hearing things others do not or losing touch with reality need prompt clinical assessment; substance
      dependence or withdrawal concerns need qualified treatment advice; marked decline in basic functioning
      needs medical or clinical evaluation; and concerning physical symptoms need appropriate medical
      care. These are reasons to seek help, not diagnoses or an exhaustive list of emergencies. If danger
      is immediate or life-threatening, use emergency services; uncertainty is a reason to ask a professional,
      not to award a low-risk label.


      Observation checks: All seven categories have an appropriate boundary explanation; The entries direct
      to qualified help without making diagnoses; Immediate danger is separated from a routine appointment
      process; Uncertainty does not become a claim that the situation is safe. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0614-PROFESSIONAL-AND-EMERGENCY-BOUNDARIES-01
      action_stable_id: PRACTICE-COMP-0614-PROFESSIONAL-AND-EMERGENCY-BOUNDARIES-01-A1
      competency_stable_id: '06.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
