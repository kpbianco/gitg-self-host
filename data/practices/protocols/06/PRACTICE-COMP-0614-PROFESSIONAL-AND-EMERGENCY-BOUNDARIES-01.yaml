        expected: true
  - stable_id: PRACTICE-COMP-0614-PROFESSIONAL-AND-EMERGENCY-BOUNDARIES-01-A2
    sequence: 2
    title: Build a small resource card that works in the relevant location
    instructions: 'Record the official local emergency number, a crisis-support route, an ordinary clinical
      entry point and an appropriate safeguarding or abuse-support route. For the US starting example,
      verify 911 and 988 through the NIMH reference, then locate the actual local clinical and protection
      services. Check location served, contact method, availability and any accessibility or eligibility
      information; leave unknown details explicit. Include an alternative when an ordinary service is
      closed or unreachable. Save public contact information where it is accessible; do not call emergency
      or crisis lines just to test them or submit a fictional report.


      Observation checks: Four types of help have location-appropriate public routes; Availability accessibility
      and eligibility are checked or marked unknown; An unavailable-service alternative is recorded; Verification
      uses public information without a test emergency contact. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0614-PROFESSIONAL-AND-EMERGENCY-BOUNDARIES-01
      action_stable_id: PRACTICE-COMP-0614-PROFESSIONAL-AND-EMERGENCY-BOUNDARIES-01-A2
