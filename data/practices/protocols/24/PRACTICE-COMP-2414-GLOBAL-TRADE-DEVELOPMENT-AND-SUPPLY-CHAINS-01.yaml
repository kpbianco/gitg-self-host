      level for Global trade, development, and supply chains; assistive technology, interpretation, a
      support person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Global trade, development, and supply chains to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
