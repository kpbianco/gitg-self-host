    c1107_a1_boundary: Action 1 stayed inside its stated Pacing and sustainable intensity boundary
    c1107_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c1107_a2_primary: The bounded Pacing and sustainable intensity criterion for action 2 was observed
    c1107_a2_boundary: Action 2 stayed inside its stated Pacing and sustainable intensity boundary
    c1107_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c1107_a3_primary: The bounded Pacing and sustainable intensity criterion for action 3 was observed
    c1107_a3_boundary: Action 3 stayed inside its stated Pacing and sustainable intensity boundary
    c1107_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Complete the bounded Pacing and sustainable intensity review without claiming mastery,
    broad transfer, professional validation, or score activation.
  plain_language_evidence: The structured record shows what happened in one limited Pacing and sustainable
    intensity practice, including support, contradiction, defer, no result, or harm.
