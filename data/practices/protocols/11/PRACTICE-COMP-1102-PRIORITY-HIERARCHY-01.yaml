meaning_and_fit:
  purpose: 'Practice Priority hierarchy through a bounded longitudinal review bounded by the canonical
    scope: Rank obligations, relationships, projects, maintenance, growth, and leisure using explicit
    criteria.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can decide what receives
    attention first and what will intentionally wait. The protocol creates a small opportunity to examine
    that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Priority hierarchy is a traceable product-design
      basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Priority hierarchy practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Priority hierarchy as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Priority hierarchy
    context, understand the source-only status, and stop without losing safety, care, employment, housing,
    services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Priority
    hierarchy; do not manufacture conflict, deprivation, exposure, disclosure, danger, urgency, or dependence
    for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Priority hierarchy.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Priority hierarchy instead of a
    live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Priority hierarchy differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Priority hierarchy as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Complete three bounded Priority hierarchy actions over ten days, preserving explicit not-applicable,
    defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Priority hierarchy; copy the canonical scope and evidence target into
    a private working note; define the action boundary, valid supports, privacy limit, and stop condition
    before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Priority
    hierarchy. Do not store private prose, names, identities, diagnoses, allegations, credentials, account
    data, protected work information, intimate detail, artifact contents, observer narrative, or another
    person's secrets. This source-only draft is not surveillance, professional advice, treatment, certification,
    or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Priority hierarchy actions, and review;
    scope may be reduced or deferred for access, care, health, workload, conscience, or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Priority hierarchy protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Priority hierarchy action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Any Priority hierarchy situation involving emergency response, abuse, retaliation, illegal conduct,
    medical treatment, legal representation, financial-loss decisions, safeguarding, hazardous equipment,
    or other consequences beyond a reversible source-only exercise.
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
  actions:
  - stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A1
    sequence: 1
    title: Define indicators for Priority hierarchy
    instructions: 'Choose two to four observable, privacy-minimized indicators for Priority hierarchy,
      plus a missing-data rule and one contradiction indicator. Bound the review to one role or context
      using this scope: Rank obligations, relationships, projects, maintenance, growth, and leisure using
      explicit criteria.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01
      action_stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A1
      competency_stable_id: '11.02'
      scoring_policy_id: SP-SHADOW-ONLY
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1102_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1102_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - c1102_a1_indicators_observable
        - c1102_a1_missing_data_rule_present
        - c1102_a1_contradiction_indicator_present
      - measurement_id: c1102_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1102_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A2
    sequence: 2
    title: Observe Priority hierarchy across three checkpoints
    instructions: Collect up to three brief Priority hierarchy checkpoints across the selected period
      or contexts. Record unknown, not observed, not applicable, defer, and adverse outcomes as valid
      states; do not infer a trend from prose length, mood, or one unusually good or bad event.
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01
      action_stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A2
