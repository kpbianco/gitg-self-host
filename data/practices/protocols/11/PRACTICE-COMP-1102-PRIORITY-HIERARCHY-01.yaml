  - stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A3
    sequence: 3
    title: Review the limited Priority hierarchy pattern
    instructions: 'Compare the checkpoints, name the strongest contradiction or missing context, and choose
      repeat, adapt, stop, or seek support. Treat this target as a review criterion rather than proof
      of transfer: Can decide what receives attention first and what will intentionally wait.'
    expected_time: 15-25 minutes
    due_within_days: 10
