    boundary_heading: A boundary is not coercion or punishment.
    timing_hint: Choose a date when this specific situation is likely to arise safely.
    context_help: Use a short private label for the request, expectation, or commitment. Do not record
      identifying or sensitive details.
    applicability_heading: A specific, likely situation—not a test of another person
    applicability_yes_label: Yes, one safe, low-stakes situation is likely to arise
    completion_signal_label: One boundary stated directly and one proportionate follow-through within
      seven days
    history_marker_label: direct boundary statement
    boundary_acknowledgement: I will use a low-stakes context where direct communication is reasonably
      safe, state only what I control, and not use threats, punishment, silent tests, or pressure.
    check_in_labels:
      user_initiated: I chose a specific limit and a response that I control
      moved_beyond_transactional: I stated the boundary directly in specific words
      follow_up_question_asked: I checked understanding without bargaining or testing
      follow_up_within_seven_days: I followed through proportionately or restated the boundary within
        seven days
  check_in_labels:
    user_initiated: I chose a specific limit and a response that I control
    moved_beyond_transactional: I stated the boundary directly in specific words
    follow_up_question_asked: I checked understanding without bargaining or testing
    follow_up_within_seven_days: I followed through proportionately or restated the boundary within seven
      days
    internal_resistance: I noticed how difficult or unsafe the boundary felt
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The record describes what limit you controlled, whether you stated it safely,
    and whether your own proportionate follow-through occurred.
  display_order: 4
