  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Mortality and impermanence explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Mortality and impermanence context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Mortality and impermanence observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Mortality and impermanence rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Notice what changes and what cannot be kept indefinitely. Observed checks:
    All four areas include a concrete form of change; A valued good is connected to the change; Finite
    time is separated from a predicted deadline; The reflection remains manageable and specific. Action
    2: Choose a priority with an actual tradeoff. Observed checks: A finite-time insight leads to a concrete
    priority; A real tradeoff creates room for the action; Any relational action respects safety and consent;
    A feasible time and method are specified. Action 3: Make the change and examine what it served. Observed
    checks: The chosen action is actually carried out; Its value is compared with the displaced activity;
    Unfinished matters are acknowledged without a total-life verdict; Any continuation remains sustainable.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A list of life goals was produced without changing
    an actual use of time or attention.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Mortality
    and impermanence contribution under typed evaluation; protocol performance remains distinct and is
    never counted twice.
