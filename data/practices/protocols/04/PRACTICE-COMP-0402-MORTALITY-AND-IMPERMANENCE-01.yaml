meaning_and_fit:
  purpose: Recognize impermanence in bodies, relationships, possessions and achievements, and translate
    that recognition into one concrete priority or appropriate reconciliation.
  why_recommended: Recognize impermanence in bodies, relationships, possessions and achievements, and
    translate that recognition into one concrete priority or appropriate reconciliation.
  claims:
  - statement: Recognize impermanence in bodies, relationships, possessions and achievements, and translate
      that recognition into one concrete priority or appropriate reconciliation.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Mortality and impermanence practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Mortality and impermanence as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a neutral object, a supplied fictional example or spoken reflection. Rest
    may be the right priority. No bucket list, major purchase, medical forecast, farewell conversation
    or forced reconciliation is required. Defer if mortality reflection is destabilizing.
  opportunity_considerations: Use a familiar object that has aged, a photograph you can comfortably view,
    or the supplied case of a favorite book whose pages are wearing out. No graphic material, illness
    scenario, cemetery visit or death countdown is needed. Keep the focus on an ordinary choice you can
    make safely.
  prerequisites:
  - Use a familiar object that has aged, a photograph you can comfortably view, or the supplied case of
    a favorite book whose pages are wearing out. No graphic material, illness scenario, cemetery visit
    or death countdown is needed. Keep the focus on an ordinary choice you can make safely.
  dependencies: []
  safe_alternatives:
  - Use a neutral object, a supplied fictional example or spoken reflection. Rest may be the right priority.
    No bucket list, major purchase, medical forecast, farewell conversation or forced reconciliation is
    required. Defer if mortality reflection is destabilizing.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Mortality and impermanence differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Mortality and impermanence
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a familiar object that has aged, a photograph you can comfortably view, or the supplied
    case of a favorite book whose pages are wearing out. No graphic material, illness scenario, cemetery
    visit or death countdown is needed. Keep the focus on an ordinary choice you can make safely. Goal:
    Recognize impermanence in bodies, relationships, possessions and achievements, and translate that
    recognition into one concrete priority or appropriate reconciliation. Scope: This considers finitude
    without predicting your death or assigning an expiry date to someone else. One changed priority is
    evidence of conduct, not proof of peace with mortality. Time and effort: About 20 minutes to reflect,
    one small action within a week and a 15-minute review. Adaptation: Use a neutral object, a supplied
    fictional example or spoken reflection. Rest may be the right priority. No bucket list, major purchase,
    medical forecast, farewell conversation or forced reconciliation is required. Defer if mortality reflection
    is destabilizing. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a neutral object, a supplied fictional example or spoken reflection. Rest may
    be the right priority. No bucket list, major purchase, medical forecast, farewell conversation or
    forced reconciliation is required. Defer if mortality reflection is destabilizing.
  expected_burden: About 20 minutes to reflect, one small action within a week and a 15-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Mortality and impermanence protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Mortality and impermanence action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a neutral
    object, a supplied fictional example or spoken reflection. Rest may be the right priority. No bucket
    list, major purchase, medical forecast, farewell conversation or forced reconciliation is required.
    Defer if mortality reflection is destabilizing.
  actions:
  - stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01-A1
    sequence: 1
    title: Notice what changes and what cannot be kept indefinitely
    instructions: 'Use four headings: body and capacity; relationships; possessions; achievements and
      roles. For each, name one ordinary way time changes it, and one thing you value that the change
      makes visible. The worn book may prompt preserving a note from its giver rather than buying more
      copies. Distinguish the fact that time is finite from a claim to know how much time remains. Include
      aging and loss without requiring yourself to imagine a frightening death or decide what follows
      it.


      Observation checks: All four areas include a concrete form of change; A valued good is connected
      to the change; Finite time is separated from a predicted deadline; The reflection remains manageable
      and specific. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01
      action_stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01-A1
      competency_stable_id: '04.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0402_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0402_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_four_areas_include_a_concrete_form_of_change
        - a_valued_good_is_connected_to_the_change
        - finite_time_is_separated_from_a_predicted_deadline
        - the_reflection_remains_manageable_and_specific
      - measurement_id: c0402_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0402_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01-A2
    sequence: 2
    title: Choose a priority with an actual tradeoff
    instructions: 'Pick one feasible change: spend twenty attentive minutes on a valued relationship,
      preserve a meaningful record, use an owned item well or make a small overdue repair. State what
      optional activity you will reduce to make room. If considering reconciliation, distinguish a safe
      invitation or acknowledgment from demanding contact or forgiveness; no unsafe relationship must
      be reopened. Use the default of preserving a short note about the book and making time to enjoy
      it. Decide when and how the action will happen.


      Observation checks: A finite-time insight leads to a concrete priority; A real tradeoff creates
      room for the action; Any relational action respects safety and consent; A feasible time and method
      are specified. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01
      action_stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01-A2
      competency_stable_id: '04.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0402_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0402_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_finite_time_insight_leads_to_a_concrete_priority
        - a_real_tradeoff_creates_room_for_the_action
        - any_relational_action_respects_safety_and_consent
        - a_feasible_time_and_method_are_specified
      - measurement_id: c0402_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0402_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01-A3
    sequence: 3
    title: Make the change and examine what it served
    instructions: 'Carry out the chosen action and record the ordinary result. Did you actually give attention,
      preserve something, make a repair or offer a welcome without coercion? Compare the use of time with
      the optional activity displaced. Name what remains unfinished and what you can let remain so. Choose
      one sustainable continuation or conclude that the small change is enough. The aim is a more considered
      allocation of finite time, not urgency about maximizing every moment.


      Observation checks: The chosen action is actually carried out; Its value is compared with the displaced
      activity; Unfinished matters are acknowledged without a total-life verdict; Any continuation remains
      sustainable. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Which specific choice changed because time is finite, and did it serve something you
      truly value?


      Examples: Supportive: The participant reduced an optional distraction, spent attentive time with
      a willing friend and kept one unfinished ambition in proportion.


      Mixed: The priority was sound, but the planned time was interrupted and a smaller attempt was honestly
      recorded.


      Contradictory: Finitude became panic to optimize every minute, pressure for forgiveness or a reason
      to neglect ordinary responsibilities.


      Inconclusive: A list of life goals was produced without changing an actual use of time or attention.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01
      action_stable_id: PRACTICE-COMP-0402-MORTALITY-AND-IMPERMANENCE-01-A3
      competency_stable_id: '04.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0402_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0402_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_chosen_action_is_actually_carried_out
        - its_value_is_compared_with_the_displaced_activity
        - unfinished_matters_are_acknowledged_without_a_total_life_verdict
        - any_continuation_remains_sustainable
      - measurement_id: c0402_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0402_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Mortality and impermanence; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use a neutral object, a supplied fictional example or spoken reflection. Rest may be the right priority.
      No bucket list, major purchase, medical forecast, farewell conversation or forced reconciliation
      is required. Defer if mortality reflection is destabilizing.
    cultural_context:
    - Adapt the expression of Mortality and impermanence to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a neutral object, a supplied fictional example or spoken reflection. Rest may be the right priority.
      No bucket list, major purchase, medical forecast, farewell conversation or forced reconciliation
      is required. Defer if mortality reflection is destabilizing.
  pause_conditions:
  - Pause Mortality and impermanence when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Mortality and impermanence practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Mortality and impermanence situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
