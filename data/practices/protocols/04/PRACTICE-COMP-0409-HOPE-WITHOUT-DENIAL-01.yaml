  adverse_or_contradictory_indicators:
  - Adverse evidence was hidden to protect optimism or someone was blamed for an outcome because they
    did not hope or pray hard enough.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Hope without denial explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Hope without denial context, action, role,
    pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Hope without denial observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Hope without denial rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Write the hopeful and adverse evidence on the same page. Observed checks:
    Hopeful and adverse considerations are both concrete; Facts assumptions and unknowns are distinguished;
    A reason for grief is acknowledged; Outcome hope is separated from hope about response. Action 2:
    Choose an action justified under more than one outcome. Observed checks: The action remains useful
    under different outcomes; A real ordinary action is attempted; Its reason for hope is honestly stated;
    Others are not required to supply reassurance or agreement. Action 3: Update hope when new information
    arrives. Observed checks: New information changes the expectation when appropriate; The action is
    evaluated by its actual effect; Grief and any remaining hope can coexist; The conclusion avoids guaranteed
    or unfalsifiable reassurance.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A reassuring prediction was repeated without considering
    evidence, grief or any worthwhile action.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Hope without
    denial contribution under typed evaluation; protocol performance remains distinct and is never counted
    twice.
