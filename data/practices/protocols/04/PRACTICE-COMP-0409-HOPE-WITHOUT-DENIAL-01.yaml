meaning_and_fit:
  purpose: Develop realistic hope through relationship, remaining possibility, faith, meaning or action
    while acknowledging adverse evidence and outcomes you cannot promise.
  why_recommended: Develop realistic hope through relationship, remaining possibility, faith, meaning
    or action while acknowledging adverse evidence and outcomes you cannot promise.
  claims:
  - statement: Develop realistic hope through relationship, remaining possibility, faith, meaning or action
      while acknowledging adverse evidence and outcomes you cannot promise.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Hope without denial practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Hope without denial as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use the fictional garden, spoken columns or a neutral uncertain hobby plan.
    Hope need not feel positive. No optimistic affirmation, religious explanation, public promise or pressure
    on another person's grief is required.
  opportunity_considerations: 'Use this fictional case: a community garden may lose access to its site,
    and an appeal might fail. Members still value one another and the knowledge they share. Alternatively
    choose a low-stakes uncertain outcome from ordinary life. Do not use an acute medical prognosis or
    someone else''s crisis.'
  prerequisites:
  - 'Use this fictional case: a community garden may lose access to its site, and an appeal might fail.
    Members still value one another and the knowledge they share. Alternatively choose a low-stakes uncertain
    outcome from ordinary life. Do not use an acute medical prognosis or someone else''s crisis.'
  dependencies: []
  safe_alternatives:
  - Use the fictional garden, spoken columns or a neutral uncertain hobby plan. Hope need not feel positive.
    No optimistic affirmation, religious explanation, public promise or pressure on another person's grief
    is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Hope without denial differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Hope without denial as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: a community garden may lose access to its site, and an appeal might
    fail. Members still value one another and the knowledge they share. Alternatively choose a low-stakes
    uncertain outcome from ordinary life. Do not use an acute medical prognosis or someone else''s crisis.
    Goal: Develop realistic hope through relationship, remaining possibility, faith, meaning or action
    while acknowledging adverse evidence and outcomes you cannot promise. Scope: Hope can concern a particular
    outcome or how people will meet it; those are different claims. This small practice does not manufacture
    optimism, predict recovery or require a hopeful feeling. Time and effort: About 15 minutes to map
    the situation, one small action and a 15-minute review at a natural decision point. Adaptation: Use
    the fictional garden, spoken columns or a neutral uncertain hobby plan. Hope need not feel positive.
    No optimistic affirmation, religious explanation, public promise or pressure on another person''s
    grief is required. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional garden, spoken columns or a neutral uncertain hobby plan. Hope
    need not feel positive. No optimistic affirmation, religious explanation, public promise or pressure
    on another person's grief is required.
  expected_burden: About 15 minutes to map the situation, one small action and a 15-minute review at a
    natural decision point.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Hope without denial protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Hope without denial action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    garden, spoken columns or a neutral uncertain hobby plan. Hope need not feel positive. No optimistic
    affirmation, religious explanation, public promise or pressure on another person's grief is required.
  actions:
  - stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01-A1
    sequence: 1
    title: Write the hopeful and adverse evidence on the same page
    instructions: 'Use two columns: reasons this outcome might improve, and reasons it might not. Mark
      facts, interpretations and unknowns in each. In the garden case, a review meeting is possible but
      continued access has not been promised. Add a separate line for what is already worth grieving.
      Name at least one kind of hope beyond winning the appeal, such as remaining connected or preserving
      knowledge, without claiming it replaces the lost place. Do not invent numerical odds; use them only
      if a trustworthy relevant source supplies them.


      Observation checks: Hopeful and adverse considerations are both concrete; Facts assumptions and
      unknowns are distinguished; A reason for grief is acknowledged; Outcome hope is separated from hope
      about response. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01
      action_stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01-A1
      competency_stable_id: '04.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0409_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0409_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - hopeful_and_adverse_considerations_are_both_concrete
        - facts_assumptions_and_unknowns_are_distinguished
        - a_reason_for_grief_is_acknowledged
        - outcome_hope_is_separated_from_hope_about_response
      - measurement_id: c0409_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0409_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01-A2
    sequence: 2
    title: Choose an action justified under more than one outcome
    instructions: 'For the case, design a modest plan to preserve a shared planting note and ask permission
      before sharing it. For a real ordinary application, do one useful action that remains worthwhile
      whether the preferred outcome happens or not, such as keeping a wanted connection or making accurate
      information easier to find. State how relationship, faith, meaning or practical possibility supports
      the action if that is genuinely your reason. Do not make others reassure you or commit to the same
      belief in order to participate.


      Observation checks: The action remains useful under different outcomes; A real ordinary action is
      attempted; Its reason for hope is honestly stated; Others are not required to supply reassurance
      or agreement. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01
      action_stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01-A2
      competency_stable_id: '04.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0409_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0409_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_action_remains_useful_under_different_outcomes
        - a_real_ordinary_action_is_attempted
        - its_reason_for_hope_is_honestly_stated
        - others_are_not_required_to_supply_reassurance_or_agreement
      - measurement_id: c0409_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0409_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01-A3
    sequence: 3
    title: Update hope when new information arrives
    instructions: 'At the decision point, add the actual result or state that it remains unknown. Revise
      the preferred-outcome expectation in light of evidence, and review what the action accomplished.
      Keep grief and disappointment visible even if some hope remains. If the outcome fails, identify
      whether a relationship, responsibility or possible next step still warrants care; if none is clear,
      uncertainty and rest are acceptable. Do not reinterpret a failed prediction as proof that it was
      secretly guaranteed all along.


      Observation checks: New information changes the expectation when appropriate; The action is evaluated
      by its actual effect; Grief and any remaining hope can coexist; The conclusion avoids guaranteed
      or unfalsifiable reassurance. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: What can you reasonably hope for, what must you still grieve, and what action remains
      worthwhile without a guarantee?


      Examples: Supportive: The appeal failed, the loss was acknowledged and a wanted connection and shared
      knowledge remained worth preserving without pretending the loss was good.


      Mixed: The useful action occurred but the outcome was still unknown, so both confidence and disappointment
      remained provisional.


      Contradictory: Adverse evidence was hidden to protect optimism or someone was blamed for an outcome
      because they did not hope or pray hard enough.


      Inconclusive: A reassuring prediction was repeated without considering evidence, grief or any worthwhile
      action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01
      action_stable_id: PRACTICE-COMP-0409-HOPE-WITHOUT-DENIAL-01-A3
      competency_stable_id: '04.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0409_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0409_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - new_information_changes_the_expectation_when_appropriate
        - the_action_is_evaluated_by_its_actual_effect
        - grief_and_any_remaining_hope_can_coexist
        - the_conclusion_avoids_guaranteed_or_unfalsifiable_reassurance
      - measurement_id: c0409_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0409_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Hope without denial; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use the fictional garden, spoken columns or a neutral uncertain hobby plan. Hope need not feel positive.
      No optimistic affirmation, religious explanation, public promise or pressure on another person's
      grief is required.
    cultural_context:
    - Adapt the expression of Hope without denial to direct or indirect communication, collective or individual
      decision structures, local norms, faith or secular commitments, and role obligations while preserving
      consent and dignity.
    resource_variants:
    - Use the fictional garden, spoken columns or a neutral uncertain hobby plan. Hope need not feel positive.
      No optimistic affirmation, religious explanation, public promise or pressure on another person's
      grief is required.
  pause_conditions:
  - Pause Hope without denial when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Hope without denial practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Hope without denial situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
