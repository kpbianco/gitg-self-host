  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Meaning after catastrophic loss explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Meaning after catastrophic loss context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Meaning after catastrophic loss observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Meaning after catastrophic loss rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can identify what has ended, what remains, what support is needed, and one life-giving commitment
    that is still possible.—not completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Meaning after catastrophic loss requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is non-scored and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Meaning after
    catastrophic loss evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
