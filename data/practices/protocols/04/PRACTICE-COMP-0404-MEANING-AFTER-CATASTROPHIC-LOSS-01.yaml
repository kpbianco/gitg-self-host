meaning_and_fit:
  purpose: Distinguish what a major loss has ended from what remains, identify practical and relational
    support, and choose one life-supporting commitment without requiring a redemptive story.
  why_recommended: Distinguish what a major loss has ended from what remains, identify practical and relational
    support, and choose one life-supporting commitment without requiring a redemptive story.
  claims:
  - statement: Distinguish what a major loss has ended from what remains, identify practical and relational
      support, and choose one life-supporting commitment without requiring a redemptive story.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Grief responses vary between people and can follow losses other than bereavement; support
      is available when coping is difficult.
    classification: safety_precaution
    source_ids:
    - SRC-NHS-GRIEF-AND-LOSS
    limitations: Supports acknowledging varied responses and appropriate support. It does not validate
      this educational exercise, prescribe a grief timetable or establish readiness for personal loss
      reflection.
  applicability_question: Does a voluntary, bounded Meaning after catastrophic loss practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Meaning after catastrophic loss as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the fictional case, four spoken words or a trusted helper who does not
    demand details. There is no schedule for rebuilding meaning. If the topic is overwhelming or basic
    needs are insecure, defer the exercise and prioritize suitable practical or professional help.
  opportunity_considerations: 'Use this fictional case: a community workshop is destroyed by a storm.
    Nobody is injured, but a craftsperson loses tools, routines, a shared place and part of an identity
    built around making things. Immediate safety and shelter are already arranged. The exercise begins
    after urgent needs; it must never delay them. No personal disaster story is required.'
  prerequisites:
  - 'Use this fictional case: a community workshop is destroyed by a storm. Nobody is injured, but a craftsperson
    loses tools, routines, a shared place and part of an identity built around making things. Immediate
    safety and shelter are already arranged. The exercise begins after urgent needs; it must never delay
    them. No personal disaster story is required.'
  dependencies: []
  safe_alternatives:
  - Use the fictional case, four spoken words or a trusted helper who does not demand details. There is
    no schedule for rebuilding meaning. If the topic is overwhelming or basic needs are insecure, defer
    the exercise and prioritize suitable practical or professional help.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Meaning after catastrophic loss differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Meaning after catastrophic
    loss as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: a community workshop is destroyed by a storm. Nobody is injured, but
    a craftsperson loses tools, routines, a shared place and part of an identity built around making things.
    Immediate safety and shelter are already arranged. The exercise begins after urgent needs; it must
    never delay them. No personal disaster story is required. Goal: Distinguish what a major loss has
    ended from what remains, identify practical and relational support, and choose one life-supporting
    commitment without requiring a redemptive story. Scope: Bereavement, betrayal, disaster, illness,
    displacement and identity collapse differ in their demands. The default is fictional preparation,
    not evidence of recovery from catastrophe; personal use is limited to what feels manageable alongside
    appropriate support. Time and effort: Three sessions of up to 15 minutes, separated by rest; a single
    short entry or deferral is acceptable when capacity is low. Adaptation: Use the fictional case, four
    spoken words or a trusted helper who does not demand details. There is no schedule for rebuilding
    meaning. If the topic is overwhelming or basic needs are insecure, defer the exercise and prioritize
    suitable practical or professional help. Keep personal working notes outside the check-in; record
    only the listed observations.


    Reference support:

    Grief after bereavement or loss: https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/grief-bereavement-loss/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case, four spoken words or a trusted helper who does not demand
    details. There is no schedule for rebuilding meaning. If the topic is overwhelming or basic needs
    are insecure, defer the exercise and prioritize suitable practical or professional help.
  expected_burden: Three sessions of up to 15 minutes, separated by rest; a single short entry or deferral
    is acceptable when capacity is low.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Meaning after catastrophic loss protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Meaning after catastrophic loss action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case, four spoken words or a trusted helper who does not demand details. There is no schedule for
    rebuilding meaning. If the topic is overwhelming or basic needs are insecure, defer the exercise and
    prioritize suitable practical or professional help.
  actions:
  - stable_id: PRACTICE-COMP-0404-MEANING-AFTER-CATASTROPHIC-LOSS-01-A1
    sequence: 1
    title: Separate what ended from what is still present
    instructions: 'Make four small sections: ended, changed, remains and unknown. In the workshop case,
      the building and some tools are gone; routines and access have changed; knowledge, some relationships
      and the person''s dignity remain; reopening is unknown. Include practical, relational and identity
      losses without calling remaining strengths compensation for everything lost. Name one thing that
      cannot currently be restored and one assumption you should not rush to settle. Do not require gratitude,
      forgiveness or a claim that the disaster happened for a reason.


      Observation checks: Ended changed remaining and unknown elements are distinguished; Practical relational
      and identity effects are considered; An irretrievable loss is named without erasure; A premature
      conclusion is kept open. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0404-MEANING-AFTER-CATASTROPHIC-LOSS-01
      action_stable_id: PRACTICE-COMP-0404-MEANING-AFTER-CATASTROPHIC-LOSS-01-A1
      competency_stable_id: '04.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0404_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0404_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - ended_changed_remaining_and_unknown_elements_are_distinguished
        - practical_relational_and_identity_effects_are_considered
        - an_irretrievable_loss_is_named_without_erasure
        - a_premature_conclusion_is_kept_open
      - measurement_id: c0404_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0404_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0404-MEANING-AFTER-CATASTROPHIC-LOSS-01-A2
    sequence: 2
    title: Identify support by the need it can actually meet
    instructions: 'Match each immediate nonemergency need to a realistic kind of support: information
      about the space, help with one practical task, companionship, financial or legal advice from a qualified
      source, or health support if needed. For the default, draft a bounded request to a trusted peer
      for a short conversation about accessible work space; do not send it as if the fictional loss were
      real. Specify what the helper is being asked to do and what remains outside that role. Include a
      second route if the first cannot help.


      Observation checks: Different needs have appropriate support roles; One bounded request is specific
      and feasible; Helpers are not assigned authority beyond their role; A second route or unresolved
      support gap is recorded. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0404-MEANING-AFTER-CATASTROPHIC-LOSS-01
      action_stable_id: PRACTICE-COMP-0404-MEANING-AFTER-CATASTROPHIC-LOSS-01-A2
      competency_stable_id: '04.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0404_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0404_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - different_needs_have_appropriate_support_roles
        - one_bounded_request_is_specific_and_feasible
        - helpers_are_not_assigned_authority_beyond_their_role
        - a_second_route_or_unresolved_support_gap_is_recorded
      - measurement_id: c0404_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0404_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0404-MEANING-AFTER-CATASTROPHIC-LOSS-01-A3
    sequence: 3
    title: Try one life-supporting commitment without declaring recovery
    instructions: 'Choose a small action that remains meaningful even if the former life cannot immediately
      return: maintain a basic routine, accept wanted company, care for an existing belonging or spend
      ten minutes on a familiar craft using available safe materials. In the fictional pathway, try one
      ordinary sustaining action yourself without claiming it proves recovery from loss. Later review
      effort, help and whether the action was tolerable or useful. Keep, reduce or stop it. A next step
      can coexist with grief, anger or uncertainty about identity.


      Observation checks: A small sustaining commitment is freely chosen; One ordinary action is actually
      attempted; Its burden and support are reviewed; The conclusion does not equate action with recovery.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: What has ended, what remains available, who can help with which need, and what is
      one tolerable next commitment?


      Examples: Supportive: The map preserved the scale of the loss, identified a bounded request and
      supported one small routine without claiming the former identity was restored.


      Mixed: One action was attempted but cost too much effort, so the participant reduced it and retained
      the need for more support.


      Contradictory: Remaining strengths were used to minimize catastrophe or the person was pressured
      to find growth, forgive betrayal or rebuild on a deadline.


      Inconclusive: A hopeful future story was written without identifying what ended, a realistic support
      need or any tolerable action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0404-MEANING-AFTER-CATASTROPHIC-LOSS-01
