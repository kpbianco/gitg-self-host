completion_and_review:
  completion_criteria:
  - The identify the non-emergency boundary for meaning after catastrophic loss action was attempted or
    explicitly deferred.
  - The prepare one safe meaning after catastrophic loss support step action was attempted or explicitly
    deferred.
  - The review the meaning after catastrophic loss plan against stop conditions action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0404_a1_primary
    - c0404_a2_primary
    - c0404_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Meaning after catastrophic loss only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Meaning after catastrophic loss across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Meaning after catastrophic loss require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Meaning after catastrophic loss criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can identify what has ended, what remains, what support is
      needed, and one life-giving commitment that is still possible.', what contradiction or missing context
      matters most, and should this Meaning after catastrophic loss design be repeated, adapted, deferred,
      stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Meaning after catastrophic loss design only when the context and burden
      remain appropriate.
    adapt: Change the Meaning after catastrophic loss medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Meaning after catastrophic loss when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Meaning after catastrophic loss questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Meaning after catastrophic loss criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Meaning after catastrophic loss criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Meaning after catastrophic loss criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Meaning after catastrophic loss action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
