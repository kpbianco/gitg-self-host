meaning_and_fit:
  purpose: Examine a feeling of emptiness, repetition or arbitrariness and choose a defensible act of
    responsibility, care or faith without pretending that the existential question is settled.
  why_recommended: Examine a feeling of emptiness, repetition or arbitrariness and choose a defensible
    act of responsibility, care or faith without pretending that the existential question is settled.
  claims:
  - statement: Examine a feeling of emptiness, repetition or arbitrariness and choose a defensible act
      of responsibility, care or faith without pretending that the existential question is settled.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Absurdity, existential anxiety, and meaninglessness
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Absurdity, existential anxiety, and meaninglessness as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use a tiny accessible task, a seated sorting action, dictation or assistance
    by consent. If nothing feels manageable, defer rather than using activity as a moral test. Seek suitable
    support for persistent low mood, hopelessness or difficulty functioning; immediate danger needs urgent
    local help.
  opportunity_considerations: 'Use the supplied thought: I keep doing the same household tasks; if they
    never stay finished, what is the point? Choose a neutral repetitive task such as returning reusable
    items to their places. No crisis, isolation, deprivation or dramatic life change is needed.'
  prerequisites:
  - 'Use the supplied thought: I keep doing the same household tasks; if they never stay finished, what
    is the point? Choose a neutral repetitive task such as returning reusable items to their places. No
    crisis, isolation, deprivation or dramatic life change is needed.'
  dependencies: []
  safe_alternatives:
  - Use a tiny accessible task, a seated sorting action, dictation or assistance by consent. If nothing
    feels manageable, defer rather than using activity as a moral test. Seek suitable support for persistent
    low mood, hopelessness or difficulty functioning; immediate danger needs urgent local help.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Absurdity, existential anxiety, and meaninglessness differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Absurdity, existential anxiety,
    and meaninglessness as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied thought: I keep doing the same household tasks; if they never stay finished,
    what is the point? Choose a neutral repetitive task such as returning reusable items to their places.
    No crisis, isolation, deprivation or dramatic life change is needed. Goal: Examine a feeling of emptiness,
    repetition or arbitrariness and choose a defensible act of responsibility, care or faith without pretending
    that the existential question is settled. Scope: An ordinary existential question is not a diagnosis.
    This exercise neither disproves meaninglessness nor treats depression; persistent distress or difficulty
    functioning calls for support beyond a philosophical task. Time and effort: About 15 minutes of clarification,
    one 10-minute ordinary action and a short review on the following day. Adaptation: Use a tiny accessible
    task, a seated sorting action, dictation or assistance by consent. If nothing feels manageable, defer
    rather than using activity as a moral test. Seek suitable support for persistent low mood, hopelessness
    or difficulty functioning; immediate danger needs urgent local help. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a tiny accessible task, a seated sorting action, dictation or assistance by
    consent. If nothing feels manageable, defer rather than using activity as a moral test. Seek suitable
    support for persistent low mood, hopelessness or difficulty functioning; immediate danger needs urgent
    local help.
  expected_burden: About 15 minutes of clarification, one 10-minute ordinary action and a short review
    on the following day.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Absurdity, existential anxiety, and meaninglessness protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Absurdity, existential anxiety, and meaninglessness action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a tiny
    accessible task, a seated sorting action, dictation or assistance by consent. If nothing feels manageable,
    defer rather than using activity as a moral test. Seek suitable support for persistent low mood, hopelessness
    or difficulty functioning; immediate danger needs urgent local help.
  actions:
  - stable_id: PRACTICE-COMP-0405-ABSURDITY-EXISTENTIAL-ANXIETY-AND-MEANINGLESSNESS-01-A1
    sequence: 1
    title: Make the question precise enough to examine
    instructions: 'Distinguish four claims: the task feels empty; it repeats; you cannot prove an ultimate
      purpose; and nothing you do can matter to anyone. Ask whether the first three actually establish
      the fourth. Name a concrete experience behind the thought and one thing still unknown. Consider
      both a secular chosen responsibility and a religious or philosophical commitment if genuinely yours;
      neither is required to resolve every question. Avoid arguing yourself into a preferred emotion or
      treating uncertainty as an intellectual failure.


      Observation checks: Feeling repetition uncertainty and a total conclusion are separated; The question
      is tied to a concrete example; A questionable inference is examined; A genuine commitment or honest
      uncertainty is retained. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0405-ABSURDITY-EXISTENTIAL-ANXIETY-AND-MEANINGLESSNESS-01
      action_stable_id: PRACTICE-COMP-0405-ABSURDITY-EXISTENTIAL-ANXIETY-AND-MEANINGLESSNESS-01-A1
      competency_stable_id: '04.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0405_a1_primary
      transfer_disposition: context_bound
      measurements:
