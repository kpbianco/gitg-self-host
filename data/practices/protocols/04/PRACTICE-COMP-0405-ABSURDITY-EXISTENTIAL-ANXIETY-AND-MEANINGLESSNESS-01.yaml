  - stable_id: PRACTICE-COMP-0405-ABSURDITY-EXISTENTIAL-ANXIETY-AND-MEANINGLESSNESS-01-A2
    sequence: 2
    title: Choose an action with a local reason you can defend
    instructions: 'For the default, return three shared or personal reusable items to their proper places
      so they are available when needed. State a local reason: preventing needless inconvenience is worthwhile
      to me even though the task will recur. If another small task better fits, identify its beneficiary
      and actual use before substituting. Spend no more than the planned ten minutes and record what you
      actually did. The action is an experiment in chosen responsibility, not a test that you must feel
      fulfilled afterward.


      Observation checks: An ordinary action has a specific beneficiary or use; The reason does not require
      a final metaphysical answer; The action is actually carried out; Time and expectations remain proportionate.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0405-ABSURDITY-EXISTENTIAL-ANXIETY-AND-MEANINGLESSNESS-01
      action_stable_id: PRACTICE-COMP-0405-ABSURDITY-EXISTENTIAL-ANXIETY-AND-MEANINGLESSNESS-01-A2
      competency_stable_id: '04.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0405_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0405_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_ordinary_action_has_a_specific_beneficiary_or_use
        - the_reason_does_not_require_a_final_metaphysical_answer
        - the_action_is_actually_carried_out
        - time_and_expectations_remain_proportionate
      - measurement_id: c0405_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0405_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0405-ABSURDITY-EXISTENTIAL-ANXIETY-AND-MEANINGLESSNESS-01-A3
    sequence: 3
    title: Review meaning conduct and mood as different things
    instructions: 'The next day, check the practical consequence: were the items available, did someone
      avoid extra effort, or is the use still unknown? Separately record whether the sense of emptiness
      changed. Decide whether the local reason remains one you endorse, even if the feeling persists.
      State the unresolved existential question accurately and choose repeat, another fitting action,
      rest or additional support. Do not turn one helpful act into a proof of universal meaning or one
      flat mood into proof that nothing matters.


      Observation checks: A practical consequence is checked or left unknown; Mood and endorsed responsibility
      are reviewed separately; The unresolved question is stated honestly; The next step does not depend
      on a forced conclusion. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: What could you reasonably care for without certainty, and what did doing it answer
      or leave unanswered?


      Examples: Supportive: The small task reduced avoidable inconvenience while the larger meaning question
      remained open and was described more precisely.


      Mixed: The action had a useful effect but did not change the empty feeling, and the participant
      kept those outcomes separate.


      Contradictory: A person was told that busy work proves life meaningful or that lingering emptiness
      shows laziness or deficient faith.


      Inconclusive: The philosophical question was debated without specifying or attempting any locally
      justified action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
