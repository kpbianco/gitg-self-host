meaning_and_fit:
  purpose: Distinguish irreversible consequence from remaining responsibility, make proportionate repair
    where possible and continue service or changed conduct without demanding that remorse erase the past.
  why_recommended: Distinguish irreversible consequence from remaining responsibility, make proportionate
    repair where possible and continue service or changed conduct without demanding that remorse erase
    the past.
  claims:
  - statement: Distinguish irreversible consequence from remaining responsibility, make proportionate
      repair where possible and continue service or changed conduct without demanding that remorse erase
      the past.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Irreversibility, remorse, and living after the unfixable
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Irreversibility, remorse, and living after the unfixable as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use only the fictional note, a spoken acknowledgment or an impersonal missed-opportunity
    case. No confession, apology delivery, self-punishment, reconciliation or forgiveness is required.
    If the topic is overwhelming or involves legal, trauma or safety concerns, use qualified support instead
    of escalating the exercise.
  opportunity_considerations: 'Use this fictional case: someone carelessly discards a friend''s handwritten
    note while tidying. The original cannot be recovered. An apology and a changed handling rule are possible,
    but a replacement would not be the same object. No participant needs to disclose a serious regret
    or contact a person harmed.'
  prerequisites:
  - 'Use this fictional case: someone carelessly discards a friend''s handwritten note while tidying.
    The original cannot be recovered. An apology and a changed handling rule are possible, but a replacement
    would not be the same object. No participant needs to disclose a serious regret or contact a person
    harmed.'
  dependencies: []
  safe_alternatives:
  - Use only the fictional note, a spoken acknowledgment or an impersonal missed-opportunity case. No
    confession, apology delivery, self-punishment, reconciliation or forgiveness is required. If the topic
    is overwhelming or involves legal, trauma or safety concerns, use qualified support instead of escalating
    the exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Irreversibility, remorse, and living after the unfixable differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Irreversibility, remorse,
    and living after the unfixable as inferiority; competing reasonable interpretations and conscientious
    refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: someone carelessly discards a friend''s handwritten note while tidying.
    The original cannot be recovered. An apology and a changed handling rule are possible, but a replacement
    would not be the same object. No participant needs to disclose a serious regret or contact a person
    harmed. Goal: Distinguish irreversible consequence from remaining responsibility, make proportionate
    repair where possible and continue service or changed conduct without demanding that remorse erase
    the past. Scope: This uses an ordinary fictional mistake, not a process for adjudicating serious wrongdoing
    or recovering from trauma. Repair can be incomplete, forgiveness belongs to others and personal growth
    does not cancel a consequence. Time and effort: About 20 minutes to examine the case, one bounded
    responsibility action and a review several days later. Adaptation: Use only the fictional note, a
    spoken acknowledgment or an impersonal missed-opportunity case. No confession, apology delivery, self-punishment,
    reconciliation or forgiveness is required. If the topic is overwhelming or involves legal, trauma
    or safety concerns, use qualified support instead of escalating the exercise. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use only the fictional note, a spoken acknowledgment or an impersonal missed-opportunity
    case. No confession, apology delivery, self-punishment, reconciliation or forgiveness is required.
    If the topic is overwhelming or involves legal, trauma or safety concerns, use qualified support instead
    of escalating the exercise.
  expected_burden: About 20 minutes to examine the case, one bounded responsibility action and a review
    several days later.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Irreversibility, remorse, and living after the unfixable protocol to rank worth, coerce
    participation, demand disclosure, override rest or care, certify competence, or justify decisions
    beyond the recorded context.
  - Treating a completed Irreversibility, remorse, and living after the unfixable action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use only the
    fictional note, a spoken acknowledgment or an impersonal missed-opportunity case. No confession, apology
    delivery, self-punishment, reconciliation or forgiveness is required. If the topic is overwhelming
    or involves legal, trauma or safety concerns, use qualified support instead of escalating the exercise.
  actions:
  - stable_id: PRACTICE-COMP-0410-IRREVERSIBILITY-REMORSE-AND-LIVING-AFTER-THE-UNFIXABLE-01-A1
    sequence: 1
    title: Separate the irreversible loss from what remains yours to do
    instructions: 'Make three entries: cannot undo, can still address and do not control. In the note
      case, the original is gone; the person can acknowledge the mistake, ask whether any practical response
      is wanted and change how belongings are handled; they cannot require forgiveness or renewed trust.
      State the particular responsibility without turning it into a verdict that the whole person is worthless.
      Consider the related cases of a missed opportunity and incomplete restitution: regret may remain
      even after an appropriate next action.


      Observation checks: Irreversible consequence and possible action are separated; A specific responsibility
      is acknowledged without a total worth verdict; Forgiveness and trust remain outside personal control;
      Incomplete restitution and missed opportunity are recognized. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0410-IRREVERSIBILITY-REMORSE-AND-LIVING-AFTER-THE-UNFIXABLE-01
      action_stable_id: PRACTICE-COMP-0410-IRREVERSIBILITY-REMORSE-AND-LIVING-AFTER-THE-UNFIXABLE-01-A1
