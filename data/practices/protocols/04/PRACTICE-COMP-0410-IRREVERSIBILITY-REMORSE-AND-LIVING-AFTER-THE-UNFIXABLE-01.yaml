  - stable_id: PRACTICE-COMP-0410-IRREVERSIBILITY-REMORSE-AND-LIVING-AFTER-THE-UNFIXABLE-01-A3
    sequence: 3
    title: Review continued conduct without asking it to absolve the past
    instructions: 'Several days later, check whether the rule or responsibility was followed at an actual
      opportunity; if none occurred, keep that part unverified. Distinguish remorse, practical learning
      and any remaining consequence. Choose a sustainable commitment to care or service that follows the
      value violated, such as careful treatment of shared belongings, without treating it as a purchase
      of forgiveness. Decide what must remain acknowledged and what repetitive self-punishment does not
      help repair. Support may be needed for continuing distress.


      Observation checks: A later opportunity or its absence is recorded; Learning remorse and permanent
      consequence remain distinct; Continued care is connected to the violated value; Service is not treated
      as entitlement to forgiveness. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What cannot be restored, what responsibility continues, and how can you live that
      responsibility without pretending either innocence or permanent worthlessness?


      Examples: Supportive: The learner acknowledged the permanent loss, practiced a permission rule and
      reviewed a later opportunity without treating better conduct as restoration of the original.


      Mixed: The prevention rule was installed but had not yet faced a real opportunity, and the continuing
      consequence remained explicit.


      Contradictory: Good deeds were presented as buying forgiveness, a replacement was said to erase
      the loss or remorse became an obligation to punish oneself indefinitely.


      Inconclusive: Regret was expressed repeatedly without distinguishing consequences, proposing appropriate
      repair or taking any responsible action.'
    expected_time: 15-25 minutes
