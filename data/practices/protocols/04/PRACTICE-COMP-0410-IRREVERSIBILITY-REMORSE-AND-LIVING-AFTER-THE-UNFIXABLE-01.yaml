  - stable_id: PRACTICE-COMP-0410-IRREVERSIBILITY-REMORSE-AND-LIVING-AFTER-THE-UNFIXABLE-01-A2
    sequence: 2
    title: Define repair that respects the affected person
    instructions: 'Draft a brief acknowledgment for the fictional case: name the mistake and consequence,
      omit excuses, ask whether a practical response would be welcome and allow no response. Do not claim
      a replacement will restore the original. Add a prevention rule: do not discard another person''s
      paper or objects without permission. For a real low-stakes application within your authority, put
      that handling rule into use or complete an already agreed small responsibility. Serious or unsafe
      contact requires appropriate independent advice rather than an exercise-driven apology.


      Observation checks: The acknowledgment names the consequence without erasing it; Any proposed repair
      respects the wishes of the affected person; A prevention rule addresses the actual failure; A safe
      ordinary responsibility action is actually taken. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0410-IRREVERSIBILITY-REMORSE-AND-LIVING-AFTER-THE-UNFIXABLE-01
      action_stable_id: PRACTICE-COMP-0410-IRREVERSIBILITY-REMORSE-AND-LIVING-AFTER-THE-UNFIXABLE-01-A2
      competency_stable_id: '04.10'
