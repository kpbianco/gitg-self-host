        expected: true
  - stable_id: PRACTICE-COMP-0408-DYING-END-OF-LIFE-CHOICES-AND-ACCOMPANIMENT-01-A2
    sequence: 2
    title: Rehearse presence that follows the person's wishes
    instructions: 'In the fictional visit, first ask whether the person wants company, quiet or practical
      help. Practice listening to fear or grief without promising recovery. Try: I cannot know what happens
      next; would quiet company or help asking the care team a question be useful? Let the person correct
      the offer rather than insisting it is comforting. Ask what would make the next few minutes easier
      and who should be consulted about discomfort. Offer a small choice, such as whether to continue
      the visit, and accept no. If unfinished relationships arise, ask whether the person wants help communicating;
      do not organize reconciliation, spiritual counsel or visitors without consent. Medical questions
      and symptoms go to the care team.


      Observation checks: The person chooses the kind and duration of company; Listening avoids false
      reassurance; Practical comfort is separated from medical advice; Relationships privacy and spiritual
      preferences remain voluntary. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0408-DYING-END-OF-LIFE-CHOICES-AND-ACCOMPANIMENT-01
      action_stable_id: PRACTICE-COMP-0408-DYING-END-OF-LIFE-CHOICES-AND-ACCOMPANIMENT-01-A2
      competency_stable_id: '04.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0408_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0408_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_person_chooses_the_kind_and_duration_of_company
        - listening_avoids_false_reassurance
        - practical_comfort_is_separated_from_medical_advice
        - relationships_privacy_and_spiritual_preferences_remain_voluntary
      - measurement_id: c0408_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
