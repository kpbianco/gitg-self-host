        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - planning_legal_documentation_and_current_treatment_are_distinguished
        - comfort_and_support_are_included_in_the_care_questions
        - values_decision_support_and_unknown_preferences_are_identified
        - a_qualified_local_route_for_formal_documents_is_located
      - measurement_id: c0408_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0408_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
