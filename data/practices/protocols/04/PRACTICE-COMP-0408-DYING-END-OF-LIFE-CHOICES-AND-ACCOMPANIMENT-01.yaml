        expected: true
  - stable_id: PRACTICE-COMP-0408-DYING-END-OF-LIFE-CHOICES-AND-ACCOMPANIMENT-01-A3
    sequence: 3
    title: Make one appropriate preparation step and preserve revisability
    instructions: 'Choose one step within your authority: organize your own care questions, ask a willing
      prospective support person whether they could discuss the role, or locate a suitable appointment
      route. Do not assign someone legal authority merely by naming them. Review the fictional visit for
      dignity, grief and unwanted assumptions. Record when you will revisit your private notes and where
      they can be found by the appropriate people if formally completed. A rehearsal is not actual accompaniment,
      and a conversation note is not an executed directive.


      Observation checks: One preparation step is actually completed; Any proposed support role is voluntary;
      Preferences and questions have a review point; Rehearsal and informal notes are not claimed as legal
      or clinical completion. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: What do you want a future conversation to clarify, and how would you accompany someone
      without taking over their choices or denying their situation?


      Examples: Supportive: The participant prepared values and clinician questions, found the proper
      local documentation route and rehearsed a visit that respected refusal and uncertainty.


      Mixed: The private questions were ready, but the proposed support person''s willingness and the
      local document requirements remained unconfirmed.


      Contradictory: An informal note was treated as a valid directive, symptoms were managed without
      the care team or a visit imposed reassurance, reconciliation or belief.


      Inconclusive: A generic preference to be comfortable was recorded without understanding the terms,
      preparing questions or taking an appropriate next step.'
    expected_time: 15-25 minutes
