completion_and_review:
  completion_criteria:
  - The bound the qualified question for dying, end-of-life choices, and accompaniment action was attempted
    or explicitly deferred.
  - The prepare minimum information for dying, end-of-life choices, and accompaniment action was attempted
    or explicitly deferred.
  - The record a bounded dying, end-of-life choices, and accompaniment disposition action preserved a
    limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0408_a1_primary
    - c0408_a2_primary
    - c0408_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Dying, end-of-life choices, and accompaniment only when the
    initial context remained safe, the evidence criteria were usable, burden was acceptable, and a new
    context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Dying, end-of-life choices, and accompaniment
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Dying, end-of-life choices, and accompaniment require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Dying, end-of-life choices, and accompaniment criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can prepare basic preferences and accompany serious illness
      without imposing false reassurance.', what contradiction or missing context matters most, and should
      this Dying, end-of-life choices, and accompaniment design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Dying, end-of-life choices, and accompaniment design only when the
      context and burden remain appropriate.
    adapt: Change the Dying, end-of-life choices, and accompaniment medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Dying, end-of-life choices, and accompaniment when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Dying, end-of-life choices, and accompaniment
      questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Dying, end-of-life choices, and accompaniment criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Dying, end-of-life choices, and accompaniment criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Dying, end-of-life choices, and accompaniment
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Dying, end-of-life choices, and accompaniment action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
