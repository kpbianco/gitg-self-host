meaning_and_fit:
  purpose: Understand basic advance-care and comfort-care concepts, prepare questions about personal preferences
    and decision support, and practice presence that respects the dignity and choices of someone seriously
    ill.
  why_recommended: Understand basic advance-care and comfort-care concepts, prepare questions about personal
    preferences and decision support, and practice presence that respects the dignity and choices of someone
    seriously ill.
  claims:
  - statement: Understand basic advance-care and comfort-care concepts, prepare questions about personal
      preferences and decision support, and practice presence that respects the dignity and choices of
      someone seriously ill.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Advance care planning considers values, preferences and trusted decision support for a
      time when a person cannot communicate; formal advance directives are legal documents.
    classification: professional_or_public_standard
    source_ids:
    - SRC-NIH-ADVANCE-CARE-PREPARATION
    limitations: US public information used only for conceptual preparation. Local legal formalities,
      document validity, clinical choices and eligibility require qualified local guidance; the product
      does not reproduce a directive or prescribe universal signing requirements.
  - statement: Palliative support addresses comfort and psychological, social and spiritual needs; care
      should take account of the person's wishes and involve appropriate professionals.
    classification: professional_or_public_standard
    source_ids:
    - SRC-NHS-PALLIATIVE-CARE-OVERVIEW
    limitations: UK public guidance used for basic care literacy and accompaniment boundaries. It does
      not establish eligibility elsewhere, offer prognosis or authorize treatment decisions by a visitor
      or by this product.
  applicability_question: Does a voluntary, bounded Dying, end-of-life choices, and accompaniment practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Dying, end-of-life choices, and accompaniment as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use the fictional case, accessible official information, interpretation support
    or a trusted helper. No disclosure of diagnoses, treatment choices, family conflict or existing documents
    is required. Defer emotionally difficult material; urgent symptoms and immediate care needs take priority
    over this educational task.
  opportunity_considerations: Read the linked NIH MedlinePlus advance-care overview and NHS explanation
    of end-of-life and palliative care. Use the fictional case of an adult who wants understandable information,
    relief from discomfort and control over visitors. Keep any personal preferences in your own private
    document; the app needs only the observation checks.
  prerequisites:
  - Read the linked NIH MedlinePlus advance-care overview and NHS explanation of end-of-life and palliative
    care. Use the fictional case of an adult who wants understandable information, relief from discomfort
    and control over visitors. Keep any personal preferences in your own private document; the app needs
    only the observation checks.
  dependencies: []
  safe_alternatives:
  - Use the fictional case, accessible official information, interpretation support or a trusted helper.
    No disclosure of diagnoses, treatment choices, family conflict or existing documents is required.
    Defer emotionally difficult material; urgent symptoms and immediate care needs take priority over
    this educational task.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Dying, end-of-life choices, and accompaniment differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Dying, end-of-life choices,
    and accompaniment as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Read the linked NIH MedlinePlus advance-care overview and NHS explanation of end-of-life and
    palliative care. Use the fictional case of an adult who wants understandable information, relief from
    discomfort and control over visitors. Keep any personal preferences in your own private document;
    the app needs only the observation checks. Goal: Understand basic advance-care and comfort-care concepts,
    prepare questions about personal preferences and decision support, and practice presence that respects
    the dignity and choices of someone seriously ill. Scope: This prepares a conversation; it creates
    no legally effective directive, treatment decision, prognosis or consent on another person''s behalf.
    Advance-care requirements and clinical options need qualified local guidance. No dying person must
    participate in this exercise. Time and effort: About 25 minutes of reading and private preparation,
    a 15-minute conversation rehearsal and a short practical follow-through. Adaptation: Use the fictional
    case, accessible official information, interpretation support or a trusted helper. No disclosure of
    diagnoses, treatment choices, family conflict or existing documents is required. Defer emotionally
    difficult material; urgent symptoms and immediate care needs take priority over this educational task.
    Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Advance care plan: A checklist for the future: https://magazine.medlineplus.gov/article/advance-care-plan-a-checklist-for-the-future

    What end of life care involves: https://www.nhs.uk/tests-and-treatments/end-of-life-care/what-it-involves-and-when-it-starts/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case, accessible official information, interpretation support
    or a trusted helper. No disclosure of diagnoses, treatment choices, family conflict or existing documents
    is required. Defer emotionally difficult material; urgent symptoms and immediate care needs take priority
    over this educational task.
  expected_burden: About 25 minutes of reading and private preparation, a 15-minute conversation rehearsal
    and a short practical follow-through.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Dying, end-of-life choices, and accompaniment protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Dying, end-of-life choices, and accompaniment action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case, accessible official information, interpretation support or a trusted helper. No disclosure of
    diagnoses, treatment choices, family conflict or existing documents is required. Defer emotionally
    difficult material; urgent symptoms and immediate care needs take priority over this educational task.
  actions:
  - stable_id: PRACTICE-COMP-0408-DYING-END-OF-LIFE-CHOICES-AND-ACCOMPANIMENT-01-A1
    sequence: 1
    title: Prepare values and questions before choosing medical options
    instructions: 'Explain the distinction between planning for future decisions and making a current
      treatment choice. The sources describe advance directives as legal documents, while palliative care
      concerns relief and support during serious illness; specific eligibility and services need local
      confirmation. Privately note what matters in care, whom you would want involved if you could not
      communicate, what that person would need to understand, and questions for a clinician about options
      and tradeoffs. Unknown is a valid preference. Locate the appropriate local health-service or qualified
      advice route for forms rather than signing an invented template.


      Observation checks: Planning legal documentation and current treatment are distinguished; Comfort
      and support are included in the care questions; Values decision support and unknown preferences
      are identified; A qualified local route for formal documents is located. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0408-DYING-END-OF-LIFE-CHOICES-AND-ACCOMPANIMENT-01
      action_stable_id: PRACTICE-COMP-0408-DYING-END-OF-LIFE-CHOICES-AND-ACCOMPANIMENT-01-A1
      competency_stable_id: '04.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0408_a1_primary
      transfer_disposition: context_bound
      measurements:
