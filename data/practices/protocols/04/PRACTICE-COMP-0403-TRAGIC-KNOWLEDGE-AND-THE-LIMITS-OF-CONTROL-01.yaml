  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Tragic knowledge and the limits of control; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use drawings or spoken alternatives and a neutral scheduling conflict. No real vulnerable group
      should be involved to test your reasoning. If the case is personally distressing, use two recreational
      activities competing for one shared room instead.
    cultural_context:
    - Adapt the expression of Tragic knowledge and the limits of control to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use drawings or spoken alternatives and a neutral scheduling conflict. No real vulnerable group
      should be involved to test your reasoning. If the case is personally distressing, use two recreational
      activities competing for one shared room instead.
  pause_conditions:
