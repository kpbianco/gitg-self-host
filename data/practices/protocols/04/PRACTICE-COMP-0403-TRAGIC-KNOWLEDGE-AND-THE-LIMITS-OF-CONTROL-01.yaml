meaning_and_fit:
  purpose: Recognize that decent people can suffer, good efforts can fail and some choices preserve one
    good while losing another, then reason and act without denial or automatic nihilism.
  why_recommended: Recognize that decent people can suffer, good efforts can fail and some choices preserve
    one good while losing another, then reason and act without denial or automatic nihilism.
  claims:
  - statement: Recognize that decent people can suffer, good efforts can fail and some choices preserve
      one good while losing another, then reason and act without denial or automatic nihilism.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Tragic knowledge and the limits of control practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Tragic knowledge and the limits of control as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use drawings or spoken alternatives and a neutral scheduling conflict. No
    real vulnerable group should be involved to test your reasoning. If the case is personally distressing,
    use two recreational activities competing for one shared room instead.
  opportunity_considerations: 'Use this case: a volunteer group has one remaining quiet room and the same
    two-hour slot requested by a study group and a bereavement-support group. Both followed the rules
    and neither caused the shortage. No safe extra room or different date is currently available. Your
    task is to reason about a fair process, not decide a real group''s access.'
  prerequisites:
  - 'Use this case: a volunteer group has one remaining quiet room and the same two-hour slot requested
    by a study group and a bereavement-support group. Both followed the rules and neither caused the shortage.
    No safe extra room or different date is currently available. Your task is to reason about a fair process,
    not decide a real group''s access.'
  dependencies: []
  safe_alternatives:
  - Use drawings or spoken alternatives and a neutral scheduling conflict. No real vulnerable group should
    be involved to test your reasoning. If the case is personally distressing, use two recreational activities
    competing for one shared room instead.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Tragic knowledge and the limits of control differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Tragic knowledge and the limits
    of control as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this case: a volunteer group has one remaining quiet room and the same two-hour slot requested
    by a study group and a bereavement-support group. Both followed the rules and neither caused the shortage.
    No safe extra room or different date is currently available. Your task is to reason about a fair process,
    not decide a real group''s access. Goal: Recognize that decent people can suffer, good efforts can
    fail and some choices preserve one good while losing another, then reason and act without denial or
    automatic nihilism. Scope: A fictional low-stakes conflict develops tragic reasoning. It does not
    equip the participant to make emergency, clinical or life-and-death allocation decisions. Some losses
    can be reduced; that does not mean every conflict has a painless resolution. Time and effort: Three
    sessions of about 20 minutes using the supplied case and one ordinary application. Adaptation: Use
    drawings or spoken alternatives and a neutral scheduling conflict. No real vulnerable group should
    be involved to test your reasoning. If the case is personally distressing, use two recreational activities
    competing for one shared room instead. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use drawings or spoken alternatives and a neutral scheduling conflict. No real
    vulnerable group should be involved to test your reasoning. If the case is personally distressing,
    use two recreational activities competing for one shared room instead.
  expected_burden: Three sessions of about 20 minutes using the supplied case and one ordinary application.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Tragic knowledge and the limits of control protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Tragic knowledge and the limits of control action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use drawings
    or spoken alternatives and a neutral scheduling conflict. No real vulnerable group should be involved
    to test your reasoning. If the case is personally distressing, use two recreational activities competing
    for one shared room instead.
  actions:
  - stable_id: PRACTICE-COMP-0403-TRAGIC-KNOWLEDGE-AND-THE-LIMITS-OF-CONTROL-01-A1
    sequence: 1
    title: Identify the real goods and the loss in every available option
    instructions: 'Write what each group needs and why both claims matter. List three options: a transparent
      previously agreed rule, an agreed limited division if both activities can genuinely function, or
      a fair draw when no stronger relevant claim exists. For each, state who bears the cost and what
      remains unmet. Check the premises: if an accessible alternative room actually exists, the case changes.
      Do not invent one simply to avoid the hard part, blame either group for needing help, or assume
      that worthy effort guarantees a successful outcome.


      Observation checks: Both legitimate goods are represented fairly; Each available option has an explicit
      residual loss; Relevant facts and hypothetical escape routes are distinguished; Need or failure
      is not converted into blame. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0403-TRAGIC-KNOWLEDGE-AND-THE-LIMITS-OF-CONTROL-01
      action_stable_id: PRACTICE-COMP-0403-TRAGIC-KNOWLEDGE-AND-THE-LIMITS-OF-CONTROL-01-A1
      competency_stable_id: '04.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0403_a1_primary
      transfer_disposition: context_bound
      measurements:
