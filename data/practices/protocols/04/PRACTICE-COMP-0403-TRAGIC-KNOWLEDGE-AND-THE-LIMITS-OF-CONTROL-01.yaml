        expected: true
  - stable_id: PRACTICE-COMP-0403-TRAGIC-KNOWLEDGE-AND-THE-LIMITS-OF-CONTROL-01-A3
    sequence: 3
    title: Apply the distinction between loss and meaninglessness
    instructions: 'Choose a much smaller real conflict in your own time, such as two valued activities
      in one free hour. Decide, carry out the selected activity and acknowledge the other good left unsatisfied.
      Review whether disappointment led you to deny its value or declare all effort pointless. Return
      to the room case and state what good conduct still required even without a perfect outcome: honesty,
      fair process, care and practical mitigation. Keep the fictional high-consequence reasoning separate
      from your ordinary trial.


      Observation checks: A small real conflict receives a decision and action; The unchosen good retains
      its acknowledged value; Disappointment is separated from total meaninglessness; The limits of transfer
      from the fictional case are explicit. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What loss could you reduce, what loss remained, and what still made responsible conduct
      possible?


      Examples: Supportive: The process was explained honestly, mitigation stayed proportionate and the
      ordinary trial preserved respect for the activity that could not be chosen.


      Mixed: A fair process was proposed, but an assumption about room access remained uncertain and needed
      checking.


      Contradictory: A nonexistent solution was invented to avoid acknowledging loss, or disappointment
      was treated as proof that goodness and effort are pointless.


      Inconclusive: The conflict was called difficult without identifying its goods, costs, authority
      or a defensible process.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
