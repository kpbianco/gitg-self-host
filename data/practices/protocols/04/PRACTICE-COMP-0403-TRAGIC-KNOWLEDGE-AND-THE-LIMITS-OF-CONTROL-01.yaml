  - stable_id: PRACTICE-COMP-0403-TRAGIC-KNOWLEDGE-AND-THE-LIMITS-OF-CONTROL-01-A2
    sequence: 2
    title: Choose a process you can justify to the disadvantaged side
    instructions: 'Select a process for the stated facts, giving a reason connected to access, need, prior
      commitments or fair treatment. Explain it as if speaking to the group that loses the slot, without
      claiming they should be grateful. Name a mitigation that is genuinely available, such as first consideration
      at the next opening, and label it insufficient to replace the lost occasion. State who would have
      actual authority to decide and how a factual mistake could be corrected. Acknowledging moral remainder
      is part of the answer.


      Observation checks: A decision process has a relevant reason; The explanation acknowledges the disadvantaged
      side; Mitigation does not erase the remaining loss; Authority and a route for factual correction
      are specified. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0403-TRAGIC-KNOWLEDGE-AND-THE-LIMITS-OF-CONTROL-01
      action_stable_id: PRACTICE-COMP-0403-TRAGIC-KNOWLEDGE-AND-THE-LIMITS-OF-CONTROL-01-A2
      competency_stable_id: '04.03'
