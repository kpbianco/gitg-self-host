completion_and_review:
  completion_criteria:
  - The choose a declared frame for suffering, evil, and lament action was attempted or explicitly deferred.
  - The complete two bounded suffering, evil, and lament practices action was attempted or explicitly
    deferred.
  - The interpret the suffering, evil, and lament experience modestly action preserved a limited conclusion,
    contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c0401_a1_primary
    - c0401_a2_primary
    - c0401_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Suffering, evil, and lament only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Suffering, evil, and lament across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Suffering, evil, and lament require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Suffering, evil, and lament criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can lament without denial and continue acting without requiring
      a simplistic explanation.', what contradiction or missing context matters most, and should this
      Suffering, evil, and lament design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Suffering, evil, and lament design only when the context and burden
      remain appropriate.
    adapt: Change the Suffering, evil, and lament medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Suffering, evil, and lament when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Suffering, evil, and lament questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Suffering, evil, and lament criteria were observed with provenance and no
      adverse boundary signal in the selected context.
    mixed: Some Suffering, evil, and lament criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Suffering, evil, and lament criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Suffering, evil, and lament action was deferred, not observed, not applicable, stale,
      insufficiently bounded, or too confounded to interpret.
