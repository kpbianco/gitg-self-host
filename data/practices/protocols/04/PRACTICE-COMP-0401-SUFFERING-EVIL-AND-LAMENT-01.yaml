meaning_and_fit:
  purpose: Respond to pain, injustice, tragedy or unanswered questions with truthful lament and a proportionate
    act of care, without requiring a tidy explanation before acting.
  why_recommended: Respond to pain, injustice, tragedy or unanswered questions with truthful lament and
    a proportionate act of care, without requiring a tidy explanation before acting.
  claims:
  - statement: Respond to pain, injustice, tragedy or unanswered questions with truthful lament and a
      proportionate act of care, without requiring a tidy explanation before acting.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Grief responses vary between people and can follow losses other than bereavement; support
      is available when coping is difficult.
    classification: safety_precaution
    source_ids:
    - SRC-NHS-GRIEF-AND-LOSS
    limitations: Supports acknowledging varied responses and appropriate support. It does not validate
      this educational exercise, prescribe a grief timetable or establish readiness for personal loss
      reflection.
  applicability_question: Does a voluntary, bounded Suffering, evil, and lament practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Suffering, evil, and lament as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a drawing, a few words or the fictional case. No public lament, theological
    agreement, painful disclosure or positive feeling is required. Stop if the topic becomes overwhelming;
    use support suited to your needs rather than pushing through for completion.
  opportunity_considerations: 'Use this fictional case: a much-used neighborhood meeting place closes
    after storm damage, disrupting connection despite volunteers'' sincere efforts. You may instead use
    a settled, manageable disappointment. Do not select an acute traumatic event, recent bereavement or
    someone else''s private pain for the sake of producing evidence.'
  prerequisites:
  - 'Use this fictional case: a much-used neighborhood meeting place closes after storm damage, disrupting
    connection despite volunteers'' sincere efforts. You may instead use a settled, manageable disappointment.
    Do not select an acute traumatic event, recent bereavement or someone else''s private pain for the
    sake of producing evidence.'
  dependencies: []
  safe_alternatives:
  - Use a drawing, a few words or the fictional case. No public lament, theological agreement, painful
    disclosure or positive feeling is required. Stop if the topic becomes overwhelming; use support suited
    to your needs rather than pushing through for completion.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Suffering, evil, and lament differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Suffering, evil, and lament
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: a much-used neighborhood meeting place closes after storm damage, disrupting
    connection despite volunteers'' sincere efforts. You may instead use a settled, manageable disappointment.
    Do not select an acute traumatic event, recent bereavement or someone else''s private pain for the
    sake of producing evidence. Goal: Respond to pain, injustice, tragedy or unanswered questions with
    truthful lament and a proportionate act of care, without requiring a tidy explanation before acting.
    Scope: This is an exercise in honest language and humane response, not a treatment for distress or
    a solution to evil. Lament may be religious, secular, spoken, written or silent; no explanation of
    another person''s suffering is imposed. Time and effort: Three short sessions of up to 15 minutes,
    with pauses or deferral whenever useful. Adaptation: Use a drawing, a few words or the fictional case.
    No public lament, theological agreement, painful disclosure or positive feeling is required. Stop
    if the topic becomes overwhelming; use support suited to your needs rather than pushing through for
    completion. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Grief after bereavement or loss: https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/grief-bereavement-loss/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a drawing, a few words or the fictional case. No public lament, theological
    agreement, painful disclosure or positive feeling is required. Stop if the topic becomes overwhelming;
    use support suited to your needs rather than pushing through for completion.
  expected_burden: Three short sessions of up to 15 minutes, with pauses or deferral whenever useful.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Suffering, evil, and lament protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Suffering, evil, and lament action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a drawing,
    a few words or the fictional case. No public lament, theological agreement, painful disclosure or
    positive feeling is required. Stop if the topic becomes overwhelming; use support suited to your needs
    rather than pushing through for completion.
  actions:
  - stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01-A1
    sequence: 1
    title: Describe the hurt without correcting it into a lesson
    instructions: 'Make four short entries: what happened; what is lost or unfair; what you feel or cannot
      yet name; and what remains unanswered. In the supplied case, separate physical damage from the loss
      of a shared place and from any question about why this happened. If prayer is part of your pathway,
      an unanswered prayer may be named without inventing a divine answer. Otherwise address the situation
      in ordinary language. Do not add at least, everything happens for a reason or an obligatory growth
      lesson to make the lament acceptable.


      Observation checks: The event and its consequences are described concretely; Loss unfairness and
      unanswered questions are distinguished; Feeling or difficulty naming it is recorded honestly; No
      reassuring explanation is imposed. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01
      action_stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01-A1
      competency_stable_id: '04.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0401_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0401_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_event_and_its_consequences_are_described_concretely
        - loss_unfairness_and_unanswered_questions_are_distinguished
        - feeling_or_difficulty_naming_it_is_recorded_honestly
        - no_reassuring_explanation_is_imposed
      - measurement_id: c0401_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0401_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01-A2
    sequence: 2
    title: Make room for a response without demanding agreement
    instructions: 'Read the four entries privately or, if useful, share a limited version with a willing
      listener after asking whether they can listen without solving it. Use the request: I want this acknowledged;
      I am not asking you to explain why it happened. For the fictional case, rehearse an acknowledgment
      that names the lost place and effort, then contrast it with a response that minimizes the loss.
      Notice whether silence, anger, sorrow or uncertainty can remain without being judged as a failed
      performance.


      Observation checks: An acknowledgment names the particular loss; Any listener freely agrees to the
      request; A minimizing response is distinguished from acknowledgment; The experience need not resolve
      into a preferred emotion. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01
      action_stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01-A2
      competency_stable_id: '04.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0401_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0401_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_acknowledgment_names_the_particular_loss
        - any_listener_freely_agrees_to_the_request
        - a_minimizing_response_is_distinguished_from_acknowledgment
        - the_experience_need_not_resolve_into_a_preferred_emotion
      - measurement_id: c0401_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0401_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01-A3
    sequence: 3
    title: Act on a need that does not depend on solving the question
    instructions: 'Identify one ordinary need you can appropriately address: offer a wanted check-in,
      help someone find a permitted alternative meeting place, or take care of your own immediate rest
      or routine. In the fictional case, draft a practical notice separating confirmed closure information
      from unknown reopening dates; then make one comparable, modest act of care in ordinary life. Review
      what it helped and what it could not repair. Keep the unanswered question visible rather than calling
      the action an explanation of suffering.


      Observation checks: A proportionate need and action are identified; An ordinary act of care is actually
      attempted; Help provided and loss remaining are separated; The unanswered question is not concealed
      by the action. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What was acknowledged accurately, what care remained possible, and which question
      still deserves to remain unanswered?


      Examples: Supportive: The loss was named without a forced lesson, a wanted check-in occurred and
      uncertainty about the future remained explicit.


      Mixed: An honest lament was possible, but the offered help was not wanted and the participant respected
      that response.


      Contradictory: A listener insisted that suffering was deserved, secretly beneficial or evidence
      of insufficient faith.


      Inconclusive: A general statement about resilience replaced acknowledgment of the particular loss
      and no care action was attempted.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01
      action_stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01-A3
      competency_stable_id: '04.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
