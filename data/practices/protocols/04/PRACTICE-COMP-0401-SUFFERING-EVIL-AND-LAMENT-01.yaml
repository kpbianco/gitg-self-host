    multipliers.
  recency_rule: Generated Suffering, evil, and lament rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can lament without denial and continue acting without requiring a simplistic explanation.—not
