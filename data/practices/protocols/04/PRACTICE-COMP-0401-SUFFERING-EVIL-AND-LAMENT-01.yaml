  - stable_id: PRACTICE-COMP-0401-SUFFERING-EVIL-AND-LAMENT-01-A2
    sequence: 2
    title: Complete two bounded Suffering, evil, and lament practices
    instructions: Complete two short, freely chosen Suffering, evil, and lament practices appropriate
      to the declared frame, such as reading, silence, prayer, observation, ritual, dialogue, or reflection.
      Stop for distress, coercion, altered-state risk, conscience conflict, or pressure from an authority
