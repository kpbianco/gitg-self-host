        criteria:
        - three_ordinary_occasions_are_reviewed_without_inventing_success
        - care_and_difficulty_are_recorded_together
        - any_companionship_respects_the_limits_of_the_other_person
        - missed_care_leads_to_attention_rather_than_self_punishment
      - measurement_id: c0406_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0406_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0406-ENDURANCE-WITHOUT-SELF-OPTIMIZATION-01-A3
    sequence: 3
    title: Review what should be carried and what should be put down
    instructions: 'Compare the occasions for unnecessary burden, useful company, rest and responsibilities
      actually met. Ask whether the plan respected your capacity and whether a neglected need now requires
      practical or qualified help. Retain one sustainable commitment and release or reduce one unnecessary
      demand. The unresolved repair may still be unresolved; do not call that a failed exercise. If conditions
      can be improved or left safely, consider that option rather than treating avoidable suffering as
      a badge of endurance.


      Observation checks: Care and burden are reviewed without an improvement quota; A remaining need
      or help gap is identified; One commitment and one reduction are justified; Avoidable hardship is
      not made a virtue requirement. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What helped you remain humane while the situation stayed unresolved, and what demand
      can you reasonably stop carrying?


      Examples: Supportive: The participant kept a modest care floor, accepted a short visit and reduced
      an optional project even though the waiting continued.


      Mixed: Some basic care was missed, revealing that the plan needed less burden and more support rather
      than a stricter routine.


      Contradictory: Endurance became refusal of available help, neglect of basic needs or pride in tolerating
      preventable mistreatment.


      Inconclusive: A demanding improvement plan replaced attention to patience, company, lament or rest.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
