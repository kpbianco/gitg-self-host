  - stable_id: PRACTICE-COMP-0406-ENDURANCE-WITHOUT-SELF-OPTIMIZATION-01-A1
    sequence: 1
    title: Choose a declared frame for Endurance without self-optimization
    instructions: 'Select a religious, spiritual, philosophical, cultural, or secular frame through which
