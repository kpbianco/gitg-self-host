meaning_and_fit:
  purpose: Practice patience, lament, companionship, rest and faithful attention during a slow or unresolved
    season, without turning endurance into an obligation to optimize yourself.
  why_recommended: Practice patience, lament, companionship, rest and faithful attention during a slow
    or unresolved season, without turning endurance into an obligation to optimize yourself.
  claims:
  - statement: Practice patience, lament, companionship, rest and faithful attention during a slow or
      unresolved season, without turning endurance into an obligation to optimize yourself.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Grief responses vary between people and can follow losses other than bereavement; support
      is available when coping is difficult.
    classification: safety_precaution
    source_ids:
    - SRC-NHS-GRIEF-AND-LOSS
    limitations: Supports acknowledging varied responses and appropriate support. It does not validate
      this educational exercise, prescribe a grief timetable or establish readiness for personal loss
      reflection.
  applicability_question: Does a voluntary, bounded Endurance without self-optimization practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Endurance without self-optimization as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a single word per occasion, a reminder object or voluntary assistance.
    Rest, lament and accepting help are legitimate actions. There is no streak, forced gratitude, productivity
    target or requirement to tolerate mistreatment.
  opportunity_considerations: Use a manageable unresolved situation such as waiting for an ordinary repair
    you cannot accelerate. Identify what essential tasks still need doing and what can wait. No one is
    asked to create hardship or remain in an unsafe situation for practice.
  prerequisites:
  - Use a manageable unresolved situation such as waiting for an ordinary repair you cannot accelerate.
    Identify what essential tasks still need doing and what can wait. No one is asked to create hardship
    or remain in an unsafe situation for practice.
  dependencies: []
  safe_alternatives:
  - Use a single word per occasion, a reminder object or voluntary assistance. Rest, lament and accepting
    help are legitimate actions. There is no streak, forced gratitude, productivity target or requirement
    to tolerate mistreatment.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Endurance without self-optimization differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Endurance without self-optimization
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a manageable unresolved situation such as waiting for an ordinary repair you cannot accelerate.
    Identify what essential tasks still need doing and what can wait. No one is asked to create hardship
    or remain in an unsafe situation for practice. Goal: Practice patience, lament, companionship, rest
    and faithful attention during a slow or unresolved season, without turning endurance into an obligation
    to optimize yourself. Scope: The measure here is whether care and boundaries were honored, not whether
    the situation improved. Ordinary waiting provides a small practice; it does not demonstrate capacity
    to endure illness, deprivation or extreme suffering. Time and effort: About 15 minutes to prepare
    and three short observations during a week; no extra workload or endurance challenge is added. Adaptation:
    Use a single word per occasion, a reminder object or voluntary assistance. Rest, lament and accepting
    help are legitimate actions. There is no streak, forced gratitude, productivity target or requirement
    to tolerate mistreatment. Keep personal working notes outside the check-in; record only the listed
    observations.


    Reference support:

    Grief after bereavement or loss: https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/grief-bereavement-loss/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a single word per occasion, a reminder object or voluntary assistance. Rest,
    lament and accepting help are legitimate actions. There is no streak, forced gratitude, productivity
    target or requirement to tolerate mistreatment.
  expected_burden: About 15 minutes to prepare and three short observations during a week; no extra workload
    or endurance challenge is added.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Endurance without self-optimization protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Endurance without self-optimization action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a single
    word per occasion, a reminder object or voluntary assistance. Rest, lament and accepting help are
    legitimate actions. There is no streak, forced gratitude, productivity target or requirement to tolerate
    mistreatment.
  actions:
  - stable_id: PRACTICE-COMP-0406-ENDURANCE-WITHOUT-SELF-OPTIMIZATION-01-A1
    sequence: 1
    title: Define enough care for this period
    instructions: 'Choose a deliberately small care floor: one ordinary need to protect, one necessary
      responsibility and one optional demand to reduce. Add room to name disappointment, accept suitable
      company and rest without earning it. For the repair case, protect a normal meal or break, keep the
      agreed appointment information available and pause a nonessential improvement project. Say what
      patience means here: avoiding needless pressure while taking useful action when information changes.
      It does not mean silence about harm or refusing help.


      Observation checks: A small care floor and essential responsibility are defined; One optional demand
      is reduced; Lament companionship and rest have legitimate room; Patience is distinguished from enduring
      preventable harm. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0406-ENDURANCE-WITHOUT-SELF-OPTIMIZATION-01
      action_stable_id: PRACTICE-COMP-0406-ENDURANCE-WITHOUT-SELF-OPTIMIZATION-01-A1
      competency_stable_id: '04.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0406_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0406_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
