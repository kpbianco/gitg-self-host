  - stable_id: PRACTICE-COMP-0406-ENDURANCE-WITHOUT-SELF-OPTIMIZATION-01-A2
    sequence: 2
    title: Keep company with the situation without demanding a result
    instructions: 'At three natural points during the week, notice whether the care floor was met, what
      help was available and what was difficult. One occasion may include a short wanted conversation,
      shared ordinary activity or quiet company. Ask for listening or practical help plainly rather than
      making another person fix the season. If alone, use a familiar gentle activity or a public contribution
      you value without pretending it is reciprocal companionship. Record missed care as information about
      need, not a failed character test.


      Observation checks: Three ordinary occasions are reviewed without inventing success; Care and difficulty
      are recorded together; Any companionship respects the limits of the other person; Missed care leads
      to attention rather than self-punishment. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0406-ENDURANCE-WITHOUT-SELF-OPTIMIZATION-01
      action_stable_id: PRACTICE-COMP-0406-ENDURANCE-WITHOUT-SELF-OPTIMIZATION-01-A2
      competency_stable_id: '04.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0406_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0406_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
