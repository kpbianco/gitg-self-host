meaning_and_fit:
  purpose: Recognize distress around acting, witnessing, failing to prevent or being betrayed in morally
    serious events, and distinguish guilt, shame, trauma, responsibility, possible repair and qualified
    support.
  why_recommended: Recognize distress around acting, witnessing, failing to prevent or being betrayed
    in morally serious events, and distinguish guilt, shame, trauma, responsibility, possible repair and
    qualified support.
  claims:
  - statement: Recognize distress around acting, witnessing, failing to prevent or being betrayed in morally
      serious events, and distinguish guilt, shame, trauma, responsibility, possible repair and qualified
      support.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Moral injury concerns distress after events violating deeply held values; it can involve
      guilt, shame or betrayal and coexist with PTSD, but is not itself a diagnosis.
    classification: safety_precaution
    source_ids:
    - SRC-VA-MORAL-INJURY-LITERACY
    limitations: Supports terminology and qualified-support boundaries, not diagnosis, culpability judgments
      or a treatment protocol. No published therapy, questionnaire or symptom scoring is reproduced.
  applicability_question: Does a voluntary, bounded Moral injury and compromised action practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Moral injury and compromised action as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the fictional case throughout, read with support or skip details. No personal
    narrative, symptom score, exposure exercise, apology, forgiveness or contact with an affected person
    is required. Persistent distress merits qualified help; immediate danger requires urgent local support.
  opportunity_considerations: 'Use this fictional case: a volunteer coordinator made a decision with incomplete
    information, later learned someone lost access to needed help and feels both guilt about the choice
    and betrayed by withheld information. The case contains no details of violence. Read the linked National
    Center for PTSD explanation for terminology; no screening questionnaire or disclosure is required.'
  prerequisites:
  - 'Use this fictional case: a volunteer coordinator made a decision with incomplete information, later
    learned someone lost access to needed help and feels both guilt about the choice and betrayed by withheld
    information. The case contains no details of violence. Read the linked National Center for PTSD explanation
    for terminology; no screening questionnaire or disclosure is required.'
  dependencies: []
  safe_alternatives:
  - Use the fictional case throughout, read with support or skip details. No personal narrative, symptom
    score, exposure exercise, apology, forgiveness or contact with an affected person is required. Persistent
    distress merits qualified help; immediate danger requires urgent local support.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Moral injury and compromised action differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Moral injury and compromised
    action as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional case: a volunteer coordinator made a decision with incomplete information,
    later learned someone lost access to needed help and feels both guilt about the choice and betrayed
    by withheld information. The case contains no details of violence. Read the linked National Center
    for PTSD explanation for terminology; no screening questionnaire or disclosure is required. Goal:
    Recognize distress around acting, witnessing, failing to prevent or being betrayed in morally serious
    events, and distinguish guilt, shame, trauma, responsibility, possible repair and qualified support.
    Scope: This is literacy and support preparation using a fictional case. Moral injury is not itself
    a diagnosis, and this exercise cannot diagnose PTSD, determine culpability or provide trauma treatment.
    It does not ask for a personal account of a morally injurious event. Time and effort: Three sessions
    of up to 15 minutes; pause or stop if the material is uncomfortable. Adaptation: Use the fictional
    case throughout, read with support or skip details. No personal narrative, symptom score, exposure
    exercise, apology, forgiveness or contact with an affected person is required. Persistent distress
    merits qualified help; immediate danger requires urgent local support. Keep personal working notes
    outside the check-in; record only the listed observations.


    Reference support:

    Moral Injury and PTSD: https://www.ptsd.va.gov/understand/related/moral_injury_ptsd.asp'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case throughout, read with support or skip details. No personal
    narrative, symptom score, exposure exercise, apology, forgiveness or contact with an affected person
    is required. Persistent distress merits qualified help; immediate danger requires urgent local support.
  expected_burden: Three sessions of up to 15 minutes; pause or stop if the material is uncomfortable.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Moral injury and compromised action protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Moral injury and compromised action action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case throughout, read with support or skip details. No personal narrative, symptom score, exposure
    exercise, apology, forgiveness or contact with an affected person is required. Persistent distress
    merits qualified help; immediate danger requires urgent local support.
  actions:
  - stable_id: PRACTICE-COMP-0407-MORAL-INJURY-AND-COMPROMISED-ACTION-01-A1
    sequence: 1
    title: Separate feelings facts and judgments of the whole person
    instructions: 'Make six brief entries. Guilt concerns an action or omission; shame can become a judgment
      of the whole self; trauma-related symptoms need qualified assessment; responsibility concerns what
      the person knew, could control and owed; repair concerns what may still help; support concerns who
      is qualified and safe to assist. Apply these distinctions to the fictional case without assigning
      a diagnosis or declaring innocence or guilt. Note the four possible relations to a morally serious
      event: acting, witnessing, not preventing and betrayal. Feelings alone do not establish the facts
      of responsibility.


      Observation checks: All six distinctions are explained without diagnosis; Four possible relations
      to the event are recognized; Feelings and factual responsibility are separated; Missing knowledge
      and control are made explicit. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0407-MORAL-INJURY-AND-COMPROMISED-ACTION-01
      action_stable_id: PRACTICE-COMP-0407-MORAL-INJURY-AND-COMPROMISED-ACTION-01-A1
      competency_stable_id: '04.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0407_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0407_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_six_distinctions_are_explained_without_diagnosis
        - four_possible_relations_to_the_event_are_recognized
        - feelings_and_factual_responsibility_are_separated
        - missing_knowledge_and_control_are_made_explicit
      - measurement_id: c0407_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0407_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0407-MORAL-INJURY-AND-COMPROMISED-ACTION-01-A2
    sequence: 2
    title: Prepare questions that need a qualified or trusted response
    instructions: 'For the case, write four questions: what happened and what is still unknown; what responsibility
      was actually held; what repair could help without causing more harm; and what support is needed
      for continuing distress. Match needs to roles: a qualified mental health professional for symptoms,
      an appropriate independent adviser for institutional or legal responsibility, and a freely chosen
      trusted person or chaplain for companionship or meaning. Ask about confidentiality and its limits
      before sensitive disclosure. A friend cannot settle a diagnosis and a clinician does not automatically
      decide legal liability.


      Observation checks: Questions separate facts responsibility repair and support; Support roles fit
      the questions they can address; Confidentiality limits are considered before disclosure; No helper
      is treated as an all-purpose authority. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0407-MORAL-INJURY-AND-COMPROMISED-ACTION-01
      action_stable_id: PRACTICE-COMP-0407-MORAL-INJURY-AND-COMPROMISED-ACTION-01-A2
      competency_stable_id: '04.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0407_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0407_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - questions_separate_facts_responsibility_repair_and_support
        - support_roles_fit_the_questions_they_can_address
        - confidentiality_limits_are_considered_before_disclosure
        - no_helper_is_treated_as_an_all_purpose_authority
      - measurement_id: c0407_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0407_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0407-MORAL-INJURY-AND-COMPROMISED-ACTION-01-A3
    sequence: 3
    title: Create a safe next-step route without forcing confession or repair
    instructions: 'Locate one appropriate public support route or provider information page and note how
      an initial appointment or question could be requested. For the fictional case, draft a short request
      that names the type of help without private incident details. Identify why contacting an affected
      person, public confession or unsolicited restitution may be premature and requires care about their
      wishes and safety. Choose a low-risk interim step such as preserving ordinary care and gathering
      questions. Keep preparation distinct from treatment, actual repair or a decision about blame.


      Observation checks: An appropriate support route is actually located; A minimal initial request
      protects private details; Premature confession or repair risks are recognized; Preparation is not
      recorded as treatment or absolution. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which question belongs to facts, responsibility, care or qualified assessment, and
      what is the safest appropriate route for the next unanswered one?


      Examples: Supportive: The learner separated shame from a specific responsibility question, identified
      a suitable support route and drafted a private first inquiry without claiming a diagnosis or repair.


      Mixed: The distinctions were clear, but provider access or confidentiality remained uncertain and
      needed checking.


      Contradictory: A checklist assigned blame or a diagnosis, or the person was urged to confess publicly
      or contact someone harmed without regard for safety and consent.


      Inconclusive: Distress was labeled moral injury without distinguishing its questions or finding
      an appropriate support route.'
    expected_time: 15-25 minutes
    due_within_days: 10
