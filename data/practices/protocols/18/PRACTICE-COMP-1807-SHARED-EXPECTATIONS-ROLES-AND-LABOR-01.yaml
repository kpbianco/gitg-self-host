meaning_and_fit:
  purpose: 'Practice Shared expectations, roles, and labor through a qualified-support preparation bounded
    by the canonical scope: Negotiate money, home, time, sex, family, career, caregiving, privacy, and
    decision authority.'
  why_recommended: 'The parent competency identifies this limited evidence target: Responsibilities are
    explicit, revisable, and not silently assigned by resentment or stereotype. The protocol creates a
    small opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Shared expectations, roles, and labor
      is a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Shared expectations, roles, and labor practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Shared expectations, roles, and labor as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Shared expectations,
    roles, and labor context, understand the source-only status, and stop without losing safety, care,
    employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Shared expectations,
    roles, and labor; do not manufacture conflict, deprivation, exposure, disclosure, danger, urgency,
    or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Shared expectations, roles, and
    labor.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Shared expectations, roles, and
    labor instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Shared expectations, roles, and labor differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Shared expectations, roles,
    and labor as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Complete three bounded Shared expectations, roles, and labor actions over ten days, preserving
    explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Shared expectations, roles, and labor; copy the canonical scope and evidence
    target into a private working note; define the action boundary, valid supports, privacy limit, and
    stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Shared expectations,
    roles, and labor. Do not store private prose, names, identities, diagnoses, allegations, credentials,
    account data, protected work information, intimate detail, artifact contents, observer narrative,
    or another person's secrets. This source-only draft is not surveillance, professional advice, treatment,
    certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Shared expectations, roles, and labor
    actions, and review; scope may be reduced or deferred for access, care, health, workload, conscience,
    or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Shared expectations, roles, and labor protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Shared expectations, roles, and labor action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Shared expectations, roles, and labor situation involving emergency response, abuse, retaliation,
    illegal conduct, medical treatment, legal representation, financial-loss decisions, safeguarding,
    hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.
  actions:
  - stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01-A1
    sequence: 1
    title: Bound the qualified question for Shared expectations, roles, and labor
    instructions: 'Turn Shared expectations, roles, and labor into one educational or planning question
      and identify the qualification and jurisdiction needed to answer it. Use the canonical scope to
      separate general learning from diagnosis, treatment, legal advice, financial advice, safeguarding
      decisions, or other professional judgment: Negotiate money, home, time, sex, family, career, caregiving,
      privacy, and decision authority.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01
