meaning_and_fit:
  purpose: 'Practice Reproductive intentions and partnership communication through a non-confrontational
    safety preparation bounded by the canonical scope: Discuss desire for children, contraception, pregnancy
    risk, fertility uncertainty, timing, and responsibility before crisis.'
  why_recommended: 'The parent competency identifies this limited evidence target: Partners understand
    each other''s present intentions, boundaries, and unresolved questions. The protocol creates a small
    opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Reproductive intentions and partnership
      communication is a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Reproductive intentions and partnership communication
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Reproductive intentions and partnership communication as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Reproductive intentions
    and partnership communication context, understand the source-only status, and stop without losing
    safety, care, employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Reproductive
    intentions and partnership communication; do not manufacture conflict, deprivation, exposure, disclosure,
    danger, urgency, or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Reproductive intentions and partnership
    communication.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Reproductive intentions and partnership
    communication instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Reproductive intentions and partnership communication differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Reproductive intentions and
    partnership communication as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Complete three bounded Reproductive intentions and partnership communication actions over ten
    days, preserving explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Reproductive intentions and partnership communication; copy the canonical
    scope and evidence target into a private working note; define the action boundary, valid supports,
    privacy limit, and stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Reproductive
    intentions and partnership communication. Do not store private prose, names, identities, diagnoses,
    allegations, credentials, account data, protected work information, intimate detail, artifact contents,
    observer narrative, or another person's secrets. This source-only draft is not surveillance, professional
    advice, treatment, certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Reproductive intentions and partnership
    communication actions, and review; scope may be reduced or deferred for access, care, health, workload,
    conscience, or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Reproductive intentions and partnership communication protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Reproductive intentions and partnership communication action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Reproductive intentions and partnership communication situation involving emergency response,
    abuse, retaliation, illegal conduct, medical treatment, legal representation, financial-loss decisions,
    safeguarding, hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.
