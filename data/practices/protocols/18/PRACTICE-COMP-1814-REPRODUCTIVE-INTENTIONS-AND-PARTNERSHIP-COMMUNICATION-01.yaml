    title: Identify the non-emergency boundary for Reproductive intentions and partnership communication
    instructions: 'Define one planning-only question for Reproductive intentions and partnership communication,
      the hazards that must not be rehearsed, and the local qualified or emergency authority that supersedes
      this source-only protocol. Do not create, approach, or simulate danger: Discuss desire for children,
      contraception, pregnancy risk, fertility uncertainty, timing, and responsibility before crisis.'
