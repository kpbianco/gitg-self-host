  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Reproductive intentions and partnership communication; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Reproductive intentions and partnership communication; assistive technology, interpretation,
      a support person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Reproductive intentions and partnership communication to direct or indirect
      communication, collective or individual decision structures, local norms, faith or secular commitments,
      and role obligations while preserving consent and dignity.
    resource_variants:
    - When a real Reproductive intentions and partnership communication opportunity is unavailable or
      inappropriate, use a fictional, historical, public, simulated, or planning-only equivalent and retain
      the narrower evidence classification.
  pause_conditions:
  - Pause Reproductive intentions and partnership communication when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Reproductive intentions and partnership communication practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Reproductive intentions and partnership communication situation
    exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.
evidence_and_scoring:
  accepted_evidence_types:
