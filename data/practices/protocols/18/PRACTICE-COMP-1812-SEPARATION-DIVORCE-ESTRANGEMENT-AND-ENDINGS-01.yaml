  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The identify the non-emergency boundary for separation, divorce, estrangement, and endings action
    was attempted or explicitly deferred.
  - The prepare one safe separation, divorce, estrangement, and endings support step action was attempted
    or explicitly deferred.
  - The review the separation, divorce, estrangement, and endings plan against stop conditions action
    preserved a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c1812_a1_primary
    - c1812_a2_primary
    - c1812_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Separation, divorce, estrangement, and endings only when the
    initial context remained safe, the evidence criteria were usable, burden was acceptable, and a new
    context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Separation, divorce, estrangement, and endings
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Separation, divorce, estrangement, and endings require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Separation, divorce, estrangement, and endings criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Avoids unnecessary cruelty, ambiguity, retaliation, and denial
      of real obligations.', what contradiction or missing context matters most, and should this Separation,
      divorce, estrangement, and endings design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Separation, divorce, estrangement, and endings design only when the
      context and burden remain appropriate.
    adapt: Change the Separation, divorce, estrangement, and endings medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Separation, divorce, estrangement, and endings when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Separation, divorce, estrangement, and
      endings questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Separation, divorce, estrangement, and endings criteria were observed with
      provenance and no adverse boundary signal in the selected context.
    mixed: Some Separation, divorce, estrangement, and endings criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Separation, divorce, estrangement, and endings
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Separation, divorce, estrangement, and endings action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
