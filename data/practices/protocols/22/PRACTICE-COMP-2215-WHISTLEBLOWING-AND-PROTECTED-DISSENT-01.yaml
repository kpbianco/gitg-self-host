meaning_and_fit:
  purpose: 'Practice Whistleblowing and protected dissent through a bounded audit and redesign bounded
    by the canonical scope: Assess evidence, severity, internal channels, retaliation risk, confidentiality,
    legal protection, and public interest.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can create a defensible
    escalation plan that protects evidence, affected people, and due process. The protocol creates a small
    opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Whistleblowing and protected dissent
      is a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Whistleblowing and protected dissent practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Whistleblowing and protected dissent as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Whistleblowing and
    protected dissent context, understand the source-only status, and stop without losing safety, care,
    employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Whistleblowing
    and protected dissent; do not manufacture conflict, deprivation, exposure, disclosure, danger, urgency,
    or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Whistleblowing and protected dissent.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Whistleblowing and protected dissent
    instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Whistleblowing and protected dissent differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Whistleblowing and protected
    dissent as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Complete three bounded Whistleblowing and protected dissent actions over ten days, preserving
    explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Whistleblowing and protected dissent; copy the canonical scope and evidence
    target into a private working note; define the action boundary, valid supports, privacy limit, and
    stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Whistleblowing
    and protected dissent. Do not store private prose, names, identities, diagnoses, allegations, credentials,
    account data, protected work information, intimate detail, artifact contents, observer narrative,
    or another person's secrets. This source-only draft is not surveillance, professional advice, treatment,
    certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Whistleblowing and protected dissent
    actions, and review; scope may be reduced or deferred for access, care, health, workload, conscience,
    or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Whistleblowing and protected dissent protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Whistleblowing and protected dissent action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Whistleblowing and protected dissent situation involving emergency response, abuse, retaliation,
    illegal conduct, medical treatment, legal representation, financial-loss decisions, safeguarding,
    hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
  actions:
  - stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01-A1
    sequence: 1
    title: Audit one bounded Whistleblowing and protected dissent context
    instructions: 'Inspect one user-controlled, low-consequence context relevant to Whistleblowing and
      protected dissent. Use the canonical scope to name observable conditions without diagnosing people
      or systems: Assess evidence, severity, internal channels, retaliation risk, confidentiality, legal
      protection, and public interest.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01
      action_stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01-A1
      competency_stable_id: '22.15'
      scoring_policy_id: SP-SHADOW-ONLY
    evidence_rules:
