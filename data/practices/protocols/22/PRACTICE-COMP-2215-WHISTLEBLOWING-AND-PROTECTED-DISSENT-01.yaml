    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Whistleblowing
      and protected dissent.
  check_in_labels:
    c2215_a1_primary: The bounded Whistleblowing and protected dissent criterion for action 1 was observed
    c2215_a1_boundary: Action 1 stayed inside its stated Whistleblowing and protected dissent boundary
    c2215_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c2215_a2_primary: The bounded Whistleblowing and protected dissent criterion for action 2 was observed
    c2215_a2_boundary: Action 2 stayed inside its stated Whistleblowing and protected dissent boundary
    c2215_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c2215_a3_primary: The bounded Whistleblowing and protected dissent criterion for action 3 was observed
