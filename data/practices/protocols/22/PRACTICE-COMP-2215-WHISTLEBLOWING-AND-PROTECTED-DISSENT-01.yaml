  completion_copy: Complete the bounded Whistleblowing and protected dissent review without claiming mastery,
    broad transfer, professional validation, or score activation.
  plain_language_evidence: The structured record shows what happened in one limited Whistleblowing and
    protected dissent practice, including support, contradiction, defer, no result, or harm.
