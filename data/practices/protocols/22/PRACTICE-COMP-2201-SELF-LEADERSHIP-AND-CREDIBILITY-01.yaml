  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Self-leadership and credibility; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Self-leadership and credibility; assistive technology, interpretation, a support person,
      and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Self-leadership and credibility to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Self-leadership and credibility opportunity is unavailable or inappropriate, use a fictional,
      historical, public, simulated, or planning-only equivalent and retain the narrower evidence classification.
  pause_conditions:
  - Pause Self-leadership and credibility when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Self-leadership and credibility practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Self-leadership and credibility situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Self-leadership and credibility actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c2201_a1_primary
  - c2201_a1_boundary
  - c2201_a1_adverse
  - c2201_a2_primary
  - c2201_a2_boundary
  - c2201_a2_adverse
  - c2201_a3_primary
  - c2201_a3_boundary
  - c2201_a3_adverse
  adverse_or_contradictory_indicators:
  - The Self-leadership and credibility action exceeded consent, authority, privacy, qualification, role,
    burden, or safety boundaries.
  - The evidence contradicted the intended Self-leadership and credibility criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Self-leadership and credibility explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Self-leadership and credibility context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Self-leadership and credibility observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Self-leadership and credibility rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Influence is supported by conduct rather than title or image alone.—not completion, confidence,
    conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Self-leadership and credibility requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Self-leadership
    and credibility evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L02
  - L05
  - L10
  - L33
  minimum_evidence_before_state_update: No current-state update is permitted for this Self-leadership
    and credibility draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Self-leadership and credibility evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The audit one bounded self-leadership and credibility context action was attempted or explicitly deferred.
  - The make one reversible self-leadership and credibility redesign action was attempted or explicitly
    deferred.
  - The compare the self-leadership and credibility context after the change action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2201_a1_primary
    - c2201_a2_primary
    - c2201_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Self-leadership and credibility only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Self-leadership and credibility across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Self-leadership and credibility require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Self-leadership and credibility criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Influence is supported by conduct rather than title or image
      alone.', what contradiction or missing context matters most, and should this Self-leadership and
      credibility design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Self-leadership and credibility design only when the context and burden
      remain appropriate.
    adapt: Change the Self-leadership and credibility medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Self-leadership and credibility when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Self-leadership and credibility questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Self-leadership and credibility criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Self-leadership and credibility criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Self-leadership and credibility criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Self-leadership and credibility action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
presentation:
  setup_copy:
    context_heading: Choose one bounded context for Self-leadership and credibility.
    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Self-leadership
      and credibility.
  check_in_labels:
    c2201_a1_primary: The bounded Self-leadership and credibility criterion for action 1 was observed
    c2201_a1_boundary: Action 1 stayed inside its stated Self-leadership and credibility boundary
    c2201_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c2201_a2_primary: The bounded Self-leadership and credibility criterion for action 2 was observed
    c2201_a2_boundary: Action 2 stayed inside its stated Self-leadership and credibility boundary
    c2201_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c2201_a3_primary: The bounded Self-leadership and credibility criterion for action 3 was observed
    c2201_a3_boundary: Action 3 stayed inside its stated Self-leadership and credibility boundary
    c2201_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Complete the bounded Self-leadership and credibility review without claiming mastery,
    broad transfer, professional validation, or score activation.
  plain_language_evidence: The structured record shows what happened in one limited Self-leadership and
    credibility practice, including support, contradiction, defer, no result, or harm.
  display_order: 300
