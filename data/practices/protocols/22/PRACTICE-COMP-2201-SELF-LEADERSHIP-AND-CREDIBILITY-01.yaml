meaning_and_fit:
  purpose: 'Practice Self-leadership and credibility through a bounded audit and redesign bounded by the
    canonical scope: Model the standards, preparation, emotional regulation, and responsibility expected
    of others.'
  why_recommended: 'The parent competency identifies this limited evidence target: Influence is supported
    by conduct rather than title or image alone. The protocol creates a small opportunity to examine that
    target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Self-leadership and credibility is a
      traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Self-leadership and credibility practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Self-leadership and credibility as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Self-leadership and
    credibility context, understand the source-only status, and stop without losing safety, care, employment,
    housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Self-leadership
    and credibility; do not manufacture conflict, deprivation, exposure, disclosure, danger, urgency,
    or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Self-leadership and credibility.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Self-leadership and credibility
    instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Self-leadership and credibility differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Self-leadership and credibility
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Complete three bounded Self-leadership and credibility actions over ten days, preserving explicit
    not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Self-leadership and credibility; copy the canonical scope and evidence
    target into a private working note; define the action boundary, valid supports, privacy limit, and
    stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Self-leadership
    and credibility. Do not store private prose, names, identities, diagnoses, allegations, credentials,
    account data, protected work information, intimate detail, artifact contents, observer narrative,
    or another person's secrets. This source-only draft is not surveillance, professional advice, treatment,
    certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Self-leadership and credibility actions,
    and review; scope may be reduced or deferred for access, care, health, workload, conscience, or resource
    reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Self-leadership and credibility protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Self-leadership and credibility action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Self-leadership and credibility situation involving emergency response, abuse, retaliation, illegal
    conduct, medical treatment, legal representation, financial-loss decisions, safeguarding, hazardous
    equipment, or other consequences beyond a reversible source-only exercise.
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
  actions:
  - stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01-A1
    sequence: 1
    title: Audit one bounded Self-leadership and credibility context
    instructions: 'Inspect one user-controlled, low-consequence context relevant to Self-leadership and
      credibility. Use the canonical scope to name observable conditions without diagnosing people or
      systems: Model the standards, preparation, emotional regulation, and responsibility expected of
      others.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01
      action_stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01-A1
      competency_stable_id: '22.01'
      scoring_policy_id: SP-SHADOW-ONLY
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2201_a1_primary
      transfer_disposition: context_bound
