  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Institutional capture and concentrated power; no purchase, subscription, travel, credential, or
      public artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Institutional capture and concentrated power; assistive technology, interpretation, a
      support person, and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Institutional capture and concentrated power to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - When a real Institutional capture and concentrated power opportunity is unavailable or inappropriate,
      use a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause Institutional capture and concentrated power when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Institutional capture and concentrated power practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Institutional capture and concentrated power situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Institutional capture and concentrated power actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c2214_a1_primary
  - c2214_a1_boundary
  - c2214_a1_adverse
  - c2214_a2_primary
  - c2214_a2_boundary
  - c2214_a2_adverse
  - c2214_a3_primary
  - c2214_a3_boundary
  - c2214_a3_adverse
  adverse_or_contradictory_indicators:
  - The Institutional capture and concentrated power action exceeded consent, authority, privacy, qualification,
    role, burden, or safety boundaries.
  - The evidence contradicted the intended Institutional capture and concentrated power criterion, depended
    on coercion or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Institutional capture and concentrated power explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Institutional capture and concentrated
    power context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Institutional capture and concentrated power observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Institutional capture and concentrated power rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can identify capture mechanisms and propose checks, transparency, rotation, or countervailing
    power.—not completion, confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Institutional capture and concentrated power requires a bounded
    context, allowlisted observations, provenance, contradiction and adverse handling, and preserved uncertainty;
    free text and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Institutional
    capture and concentrated power evidence only under offline typed evaluation; protocol performance
    remains distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L13
  - L14
  - L31
  - L33
  minimum_evidence_before_state_update: No current-state update is permitted for this Institutional capture
    and concentrated power draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Institutional capture and concentrated power evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The audit one bounded institutional capture and concentrated power context action was attempted or
    explicitly deferred.
  - The make one reversible institutional capture and concentrated power redesign action was attempted
    or explicitly deferred.
  - The compare the institutional capture and concentrated power context after the change action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2214_a1_primary
    - c2214_a2_primary
    - c2214_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Institutional capture and concentrated power only when the initial
    context remained safe, the evidence criteria were usable, burden was acceptable, and a new context
    can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Institutional capture and concentrated power
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Institutional capture and concentrated power require in this exact context, what
      remains outside my role or authority, and which scope sentence or evidence criterion will keep the
      practice honest?
    during: Which observable Institutional capture and concentrated power criterion is present, absent,
      mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can identify capture mechanisms and propose checks, transparency,
      rotation, or countervailing power.', what contradiction or missing context matters most, and should
      this Institutional capture and concentrated power design be repeated, adapted, deferred, stopped,
      or referred?
  review_guidance:
    repeat: Repeat the same bounded Institutional capture and concentrated power design only when the
      context and burden remain appropriate.
    adapt: Change the Institutional capture and concentrated power medium, scope, support, timing, criteria,
      or context while preserving provenance and the narrower evidence claim.
    stop: Stop Institutional capture and concentrated power when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Institutional capture and concentrated
      power questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Institutional capture and concentrated power criteria were observed with provenance
      and no adverse boundary signal in the selected context.
    mixed: Some Institutional capture and concentrated power criteria were observed while burden, support,
      contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Institutional capture and concentrated power
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Institutional capture and concentrated power action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
