  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Pluralism and peaceful coexistence; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Pluralism and peaceful coexistence; assistive technology, interpretation, a support person,
      and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Pluralism and peaceful coexistence to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - When a real Pluralism and peaceful coexistence opportunity is unavailable or inappropriate, use
      a fictional, historical, public, simulated, or planning-only equivalent and retain the narrower
      evidence classification.
  pause_conditions:
  - Pause Pluralism and peaceful coexistence when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Pluralism and peaceful coexistence practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Pluralism and peaceful coexistence situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
    and can involve serious risk.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Pluralism and peaceful coexistence actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c2011_a1_primary
