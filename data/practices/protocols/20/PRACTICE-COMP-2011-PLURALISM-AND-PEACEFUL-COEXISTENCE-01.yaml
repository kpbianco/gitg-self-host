  - stable_id: PRACTICE-COMP-2011-PLURALISM-AND-PEACEFUL-COEXISTENCE-01-A1
    sequence: 1
    title: Define a rubric for Pluralism and peaceful coexistence
    instructions: 'Turn the canonical scope for Pluralism and peaceful coexistence into three to five
      inspectable criteria: Build rules and norms that allow deep disagreement without domination or dehumanization.
      Keep the rubric bounded to one current context and include one criterion for uncertainty, access,
      or competing obligations.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
