meaning_and_fit:
  purpose: 'Practice Institutional and media-system literacy through a artifact-and-review practice bounded
    by the canonical scope: Understand how journalism, parties, agencies, courts, universities, corporations,
    nonprofits, and platforms create and filter public knowledge.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can trace a public
    claim through institutions, incentives, evidence, and accountability mechanisms. The protocol creates
    a small opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Institutional and media-system literacy
      is a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Institutional and media-system literacy practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Institutional and media-system literacy as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Institutional and
    media-system literacy context, understand the source-only status, and stop without losing safety,
    care, employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Institutional
    and media-system literacy; do not manufacture conflict, deprivation, exposure, disclosure, danger,
    urgency, or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Institutional and media-system
    literacy.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Institutional and media-system
    literacy instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Institutional and media-system literacy differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Institutional and media-system
    literacy as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Complete three bounded Institutional and media-system literacy actions over ten days, preserving
    explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Institutional and media-system literacy; copy the canonical scope and
    evidence target into a private working note; define the action boundary, valid supports, privacy limit,
    and stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Institutional
    and media-system literacy. Do not store private prose, names, identities, diagnoses, allegations,
    credentials, account data, protected work information, intimate detail, artifact contents, observer
    narrative, or another person's secrets. This source-only draft is not surveillance, professional advice,
    treatment, certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Institutional and media-system literacy
    actions, and review; scope may be reduced or deferred for access, care, health, workload, conscience,
    or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Institutional and media-system literacy protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Institutional and media-system literacy action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Institutional and media-system literacy situation involving emergency response, abuse, retaliation,
    illegal conduct, medical treatment, legal representation, financial-loss decisions, safeguarding,
    hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
    and can involve serious risk.
  actions:
  - stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01-A1
    sequence: 1
    title: Define a rubric for Institutional and media-system literacy
    instructions: 'Turn the canonical scope for Institutional and media-system literacy into three to
      five inspectable criteria: Understand how journalism, parties, agencies, courts, universities, corporations,
      nonprofits, and platforms create and filter public knowledge. Keep the rubric bounded to one current
      context and include one criterion for uncertainty, access, or competing obligations.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01
      action_stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01-A1
      competency_stable_id: '20.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
