meaning_and_fit:
  purpose: 'Practice Nonviolent action and conflict transformation through a consent-respecting relational
    practice bounded by the canonical scope: Understand negotiation, mediation, boycotts, strikes, protest,
    civil resistance, restorative practice, and escalation dynamics.'
  why_recommended: 'The parent competency identifies this limited evidence target: Can design a proportionate
    nonviolent campaign or conflict process with goals, stakeholders, risks, and safeguards. The protocol
    creates a small opportunity to examine that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Nonviolent action and conflict transformation
      is a traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Nonviolent action and conflict transformation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Nonviolent action and conflict transformation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Nonviolent action
    and conflict transformation context, understand the source-only status, and stop without losing safety,
    care, employment, housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Nonviolent
    action and conflict transformation; do not manufacture conflict, deprivation, exposure, disclosure,
    danger, urgency, or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Nonviolent action and conflict
    transformation.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Nonviolent action and conflict
    transformation instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Nonviolent action and conflict transformation differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Nonviolent action and conflict
    transformation as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Complete three bounded Nonviolent action and conflict transformation actions over ten days,
    preserving explicit not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Nonviolent action and conflict transformation; copy the canonical scope
    and evidence target into a private working note; define the action boundary, valid supports, privacy
    limit, and stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Nonviolent
    action and conflict transformation. Do not store private prose, names, identities, diagnoses, allegations,
    credentials, account data, protected work information, intimate detail, artifact contents, observer
    narrative, or another person's secrets. This source-only draft is not surveillance, professional advice,
    treatment, certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Nonviolent action and conflict transformation
    actions, and review; scope may be reduced or deferred for access, care, health, workload, conscience,
    or resource reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Nonviolent action and conflict transformation protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Nonviolent action and conflict transformation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Nonviolent action and conflict transformation situation involving emergency response, abuse, retaliation,
    illegal conduct, medical treatment, legal representation, financial-loss decisions, safeguarding,
    hazardous equipment, or other consequences beyond a reversible source-only exercise.
  - Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
    and can involve serious risk.
  actions:
  - stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01-A1
    sequence: 1
    title: Prepare a consent-safe Nonviolent action and conflict transformation interaction
    instructions: 'Choose one welcome, low-stakes relationship context for Nonviolent action and conflict
      transformation. Translate the canonical scope into one observable communication act, identify power
      or retaliation concerns, and obtain or preserve the other person''s freedom not to participate:
      Understand negotiation, mediation, boycotts, strikes, protest, civil resistance, restorative practice,
      and escalation dynamics.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01
      action_stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01-A1
      competency_stable_id: '20.14'
      scoring_policy_id: SP-SHADOW-ONLY
