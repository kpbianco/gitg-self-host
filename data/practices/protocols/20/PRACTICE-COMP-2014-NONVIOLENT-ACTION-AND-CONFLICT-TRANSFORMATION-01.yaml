    c2014_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Complete the bounded Nonviolent action and conflict transformation review without claiming
    mastery, broad transfer, professional validation, or score activation.
  plain_language_evidence: The structured record shows what happened in one limited Nonviolent action
    and conflict transformation practice, including support, contradiction, defer, no result, or harm.
