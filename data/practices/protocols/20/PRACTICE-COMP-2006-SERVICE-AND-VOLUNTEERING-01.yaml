  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Service and volunteering; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Service and volunteering; assistive technology, interpretation, a support person, and
      a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Service and volunteering to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Service and volunteering opportunity is unavailable or inappropriate, use a fictional,
      historical, public, simulated, or planning-only equivalent and retain the narrower evidence classification.
  pause_conditions:
  - Pause Service and volunteering when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Service and volunteering practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Service and volunteering situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
    and can involve serious risk.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Service and volunteering actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c2006_a1_primary
  - c2006_a1_boundary
  - c2006_a1_adverse
  - c2006_a2_primary
  - c2006_a2_boundary
  - c2006_a2_adverse
  - c2006_a3_primary
  - c2006_a3_boundary
  - c2006_a3_adverse
  adverse_or_contradictory_indicators:
  - The Service and volunteering action exceeded consent, authority, privacy, qualification, role, burden,
    or safety boundaries.
  - The evidence contradicted the intended Service and volunteering criterion, depended on coercion or
    hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Service and volunteering explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Service and volunteering context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Service and volunteering observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Service and volunteering rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Service produces tangible benefit and is maintained beyond initial enthusiasm.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Service and volunteering requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: Replay-verified structured evidence is score eligible under the explicit activation
    ledger; action-specific provenance and withholding rules still apply.
  competency_contribution: Designated primary measurements may produce one context-bound direct Service
    and volunteering contribution under typed evaluation; protocol performance remains distinct and is
    never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L24
  - L26
  - L30
  minimum_evidence_before_state_update: One submitted replay-verified event with an observed competency
    measurement and no applicable withholding condition may update current state; completion alone never
    does.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Service and volunteering evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The listen for a bounded service and volunteering need action was attempted or explicitly deferred.
  - The agree and complete one service and volunteering contribution action was attempted or explicitly
    deferred.
  - The review the service and volunteering contribution with proportionate feedback action preserved
    a limited conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2006_a1_primary
    - c2006_a2_primary
    - c2006_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Service and volunteering only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Service and volunteering across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Service and volunteering require in this exact context, what remains outside my
      role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Service and volunteering criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Service produces tangible benefit and is maintained beyond
      initial enthusiasm.', what contradiction or missing context matters most, and should this Service
      and volunteering design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Service and volunteering design only when the context and burden remain
      appropriate.
    adapt: Change the Service and volunteering medium, scope, support, timing, criteria, or context while
      preserving provenance and the narrower evidence claim.
    stop: Stop Service and volunteering when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Service and volunteering questions beyond
      this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Service and volunteering criteria were observed with provenance and no adverse
      boundary signal in the selected context.
    mixed: Some Service and volunteering criteria were observed while burden, support, contextual change,
      or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Service and volunteering criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Service and volunteering action was deferred, not observed, not applicable, stale,
      insufficiently bounded, or too confounded to interpret.
presentation:
  setup_copy:
    context_heading: Choose one bounded context for Service and volunteering.
    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Service and
      volunteering.
  check_in_labels:
    c2006_a1_primary: The bounded Service and volunteering criterion for action 1 was observed
    c2006_a1_boundary: Action 1 stayed inside its stated Service and volunteering boundary
    c2006_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c2006_a2_primary: The bounded Service and volunteering criterion for action 2 was observed
    c2006_a2_boundary: Action 2 stayed inside its stated Service and volunteering boundary
    c2006_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c2006_a3_primary: The bounded Service and volunteering criterion for action 3 was observed
    c2006_a3_boundary: Action 3 stayed inside its stated Service and volunteering boundary
    c2006_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Review the bounded evidence without claiming mastery, broad transfer, professional
    validation, identity, dignity, or human worth.
  plain_language_evidence: The structured record shows what happened in one limited Service and volunteering
    practice, including support, contradiction, defer, no result, or harm.
  display_order: 268
