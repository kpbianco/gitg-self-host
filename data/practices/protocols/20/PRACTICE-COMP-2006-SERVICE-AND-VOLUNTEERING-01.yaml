  - stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01-A2
    sequence: 2
    title: Agree and complete one Service and volunteering contribution
    instructions: Agree on one limited Service and volunteering contribution, its owner, time boundary,
      access needs, and exit condition. Complete only the agreed scope without replacing local leadership,
      creating dependency, claiming representation, or escalating conflict.
    expected_time: 15-25 minutes
