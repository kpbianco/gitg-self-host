  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Engagement across difference explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Engagement across difference context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Engagement across difference observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Engagement across difference rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can represent a competing view fairly while preserving conviction and boundaries.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Engagement across difference requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Engagement
    across difference evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
