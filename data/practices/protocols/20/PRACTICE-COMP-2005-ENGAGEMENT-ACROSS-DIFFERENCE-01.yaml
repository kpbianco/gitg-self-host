  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Engagement across difference only when the initial context remained
    safe, the evidence criteria were usable, burden was acceptable, and a new context can be named without
    assuming transfer.
  transfer_limit: Three bounded actions do not establish Engagement across difference across roles, cultures,
    relationships, seasons, stress levels, disability states, institutions, or high-consequence settings.
  reflection:
    before: What does Engagement across difference require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Engagement across difference criterion is present, absent, mixed, or unknown,
      and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can represent a competing view fairly while preserving conviction
      and boundaries.', what contradiction or missing context matters most, and should this Engagement
      across difference design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Engagement across difference design only when the context and burden
      remain appropriate.
    adapt: Change the Engagement across difference medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Engagement across difference when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Engagement across difference questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Engagement across difference criteria were observed with provenance and no
      adverse boundary signal in the selected context.
    mixed: Some Engagement across difference criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Engagement across difference criterion, introduced
      harm or coercion, or showed the design was not workable.
    inconclusive: The Engagement across difference action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
