  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Collective action and organizing; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Change timing, duration, medium, language, sensory load, location, posture, response mode, or support
      level for Collective action and organizing; assistive technology, interpretation, a support person,
      and a deferred action are valid without penalty.
    cultural_context:
    - Adapt the expression of Collective action and organizing to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - When a real Collective action and organizing opportunity is unavailable or inappropriate, use a
      fictional, historical, public, simulated, or planning-only equivalent and retain the narrower evidence
      classification.
  pause_conditions:
  - Pause Collective action and organizing when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Collective action and organizing practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Collective action and organizing situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
    and can involve serious risk.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Collective action and organizing actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c2008_a1_primary
  - c2008_a1_boundary
  - c2008_a1_adverse
  - c2008_a2_primary
  - c2008_a2_boundary
  - c2008_a2_adverse
  - c2008_a3_primary
  - c2008_a3_boundary
  - c2008_a3_adverse
  adverse_or_contradictory_indicators:
  - The Collective action and organizing action exceeded consent, authority, privacy, qualification, role,
    burden, or safety boundaries.
  - The evidence contradicted the intended Collective action and organizing criterion, depended on coercion
    or hidden private content, or could not distinguish the protocol from contextual change.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Collective action and organizing explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Collective action and organizing context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Collective action and organizing observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Collective action and organizing rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—A community effort reaches a concrete result and captures lessons.—not completion, confidence,
    conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Collective action and organizing requires a bounded context, allowlisted
    observations, provenance, contradiction and adverse handling, and preserved uncertainty; free text
    and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Collective
    action and organizing evidence only under offline typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L23
  - L30
  - L33
  minimum_evidence_before_state_update: No current-state update is permitted for this Collective action
    and organizing draft under SP-SHADOW-ONLY, regardless of completion or evidence quantity.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Collective action and organizing evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
completion_and_review:
  completion_criteria:
  - The define a rubric for collective action and organizing action was attempted or explicitly deferred.
  - The build one collective action and organizing artifact action was attempted or explicitly deferred.
  - The stress-test and revise the collective action and organizing artifact action preserved a limited
    conclusion, contradiction, or inconclusive result.
  completion_rules:
    minimum_completed: 2
    substantive_markers:
    - c2008_a1_primary
    - c2008_a2_primary
    - c2008_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Collective action and organizing only when the initial context
    remained safe, the evidence criteria were usable, burden was acceptable, and a new context can be
    named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Collective action and organizing across roles,
    cultures, relationships, seasons, stress levels, disability states, institutions, or high-consequence
    settings.
  reflection:
    before: What does Collective action and organizing require in this exact context, what remains outside
      my role or authority, and which scope sentence or evidence criterion will keep the practice honest?
    during: Which observable Collective action and organizing criterion is present, absent, mixed, or
      unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'A community effort reaches a concrete result and captures
      lessons.', what contradiction or missing context matters most, and should this Collective action
      and organizing design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Collective action and organizing design only when the context and
      burden remain appropriate.
    adapt: Change the Collective action and organizing medium, scope, support, timing, criteria, or context
      while preserving provenance and the narrower evidence claim.
    stop: Stop Collective action and organizing when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Collective action and organizing questions
      beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Collective action and organizing criteria were observed with provenance and
      no adverse boundary signal in the selected context.
    mixed: Some Collective action and organizing criteria were observed while burden, support, contextual
      change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Collective action and organizing criterion,
      introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Collective action and organizing action was deferred, not observed, not applicable,
      stale, insufficiently bounded, or too confounded to interpret.
presentation:
  setup_copy:
    context_heading: Choose one bounded context for Collective action and organizing.
    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Use three short actions over ten days; do not manufacture an opportunity.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Collective
      action and organizing.
  check_in_labels:
    c2008_a1_primary: The bounded Collective action and organizing criterion for action 1 was observed
    c2008_a1_boundary: Action 1 stayed inside its stated Collective action and organizing boundary
    c2008_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c2008_a2_primary: The bounded Collective action and organizing criterion for action 2 was observed
    c2008_a2_boundary: Action 2 stayed inside its stated Collective action and organizing boundary
    c2008_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c2008_a3_primary: The bounded Collective action and organizing criterion for action 3 was observed
    c2008_a3_boundary: Action 3 stayed inside its stated Collective action and organizing boundary
    c2008_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Complete the bounded Collective action and organizing review without claiming mastery,
    broad transfer, professional validation, or score activation.
  plain_language_evidence: The structured record shows what happened in one limited Collective action
    and organizing practice, including support, contradiction, defer, no result, or harm.
  display_order: 270
