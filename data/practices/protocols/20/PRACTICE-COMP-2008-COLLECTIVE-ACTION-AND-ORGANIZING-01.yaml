        criteria:
        - c2008_a1_criteria_trace_to_scope
        - c2008_a1_context_bounded
        - c2008_a1_constraint_included
      - measurement_id: c2008_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2008_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A2
    sequence: 2
    title: Build one Collective action and organizing artifact
    instructions: Create the smallest useful plan, checklist, diagram, record, or other artifact that
      applies the rubric for Collective action and organizing. Store only category-level information and
      omit names, secrets, credentials, diagnoses, protected work detail, and unnecessary third-party
      information.
    expected_time: 15-25 minutes
    due_within_days: 7
