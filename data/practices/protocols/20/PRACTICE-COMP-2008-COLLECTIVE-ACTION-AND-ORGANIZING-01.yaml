meaning_and_fit:
  purpose: 'Practice Collective action and organizing through a artifact-and-review practice bounded by
    the canonical scope: Define a shared problem, recruit stakeholders, assign roles, coordinate work,
    and measure outcomes.'
  why_recommended: 'The parent competency identifies this limited evidence target: A community effort
    reaches a concrete result and captures lessons. The protocol creates a small opportunity to examine
    that target without treating completion as broad capability.'
  claims:
  - statement: Using the canonical scope and evidence target for Collective action and organizing is a
      traceable product-design basis for a source-only draft protocol.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: The canonical curriculum is not empirical intervention validation, a professional standard,
      a diagnosis, a universal prescription, or evidence that this exact protocol improves the competency.
  applicability_question: Does a voluntary, bounded Collective action and organizing practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Collective action and organizing as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Proceed only when the person can freely choose a limited Collective action
    and organizing context, understand the source-only status, and stop without losing safety, care, employment,
    housing, services, relationship access, or dignity.
  opportunity_considerations: Use one naturally available low-stakes opportunity relevant to Collective
    action and organizing; do not manufacture conflict, deprivation, exposure, disclosure, danger, urgency,
    or dependence for evidence.
  prerequisites:
  - One user-chosen context that genuinely fits the canonical scope of Collective action and organizing.
  - Enough authority, consent, capacity, and resources to stop or defer safely.
  dependencies: []
  safe_alternatives:
  - Use a fictional, public, retrospective, or category-level case for Collective action and organizing
    instead of a live situation.
  - Defer, reduce scope, use an accessible equivalent, or seek appropriate support without a deficit interpretation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Collective action and organizing differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Collective action and organizing
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Complete three bounded Collective action and organizing actions over ten days, preserving explicit
    not-applicable, defer, interruption, adverse, and unknown outcomes.
  setup: Choose one context for Collective action and organizing; copy the canonical scope and evidence
    target into a private working note; define the action boundary, valid supports, privacy limit, and
    stop condition before beginning.
  privacy_and_boundaries: Store only allowlisted criteria and category-level observations for Collective
    action and organizing. Do not store private prose, names, identities, diagnoses, allegations, credentials,
    account data, protected work information, intimate detail, artifact contents, observer narrative,
    or another person's secrets. This source-only draft is not surveillance, professional advice, treatment,
    certification, or proof of character.
  expected_burden: About 45-75 minutes total across setup, three Collective action and organizing actions,
    and review; scope may be reduced or deferred for access, care, health, workload, conscience, or resource
    reasons.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Collective action and organizing protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Collective action and organizing action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Any Collective action and organizing situation involving emergency response, abuse, retaliation, illegal
    conduct, medical treatment, legal representation, financial-loss decisions, safeguarding, hazardous
    equipment, or other consequences beyond a reversible source-only exercise.
  - Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
    and can involve serious risk.
  actions:
  - stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A1
    sequence: 1
    title: Define a rubric for Collective action and organizing
    instructions: 'Turn the canonical scope for Collective action and organizing into three to five inspectable
      criteria: Define a shared problem, recruit stakeholders, assign roles, coordinate work, and measure
      outcomes. Keep the rubric bounded to one current context and include one criterion for uncertainty,
      access, or competing obligations.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01
      action_stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A1
      competency_stable_id: '20.08'
      scoring_policy_id: SP-SHADOW-ONLY
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2008_a1_primary
      transfer_disposition: context_bound
      measurements:
