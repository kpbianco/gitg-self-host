  repetition_rule: Each Propaganda, polarization, and democratic resilience observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Propaganda, polarization, and democratic resilience rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: Performance concerns only the action-specific criteria derived from the canonical
    target—Can resist sharing manipulative content and engage without reproducing the tactic.—not completion,
    confidence, conformity, output, independence, or worth.
  evidence_quality_rubric: Quality for Propaganda, polarization, and democratic resilience requires a
    bounded context, allowlisted observations, provenance, contradiction and adverse handling, and preserved
    uncertainty; free text and artifact contents are excluded.
  scoring_eligibility: This package is source-only, shadow-only, and production-ineligible.
  competency_contribution: Designated primary measurements may produce context-bound direct Propaganda,
    polarization, and democratic resilience evidence only under offline typed evaluation; protocol performance
    remains distinct and is never counted twice.
