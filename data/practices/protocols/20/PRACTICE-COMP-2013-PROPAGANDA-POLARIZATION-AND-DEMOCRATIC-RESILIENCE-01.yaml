    - c2013_a3_primary
    marker_mode: any
  mastery_disclaimer: Completing this practice does not establish mastery.
  progression_criteria: Repeat or broaden Propaganda, polarization, and democratic resilience only when
    the initial context remained safe, the evidence criteria were usable, burden was acceptable, and a
    new context can be named without assuming transfer.
  transfer_limit: Three bounded actions do not establish Propaganda, polarization, and democratic resilience
    across roles, cultures, relationships, seasons, stress levels, disability states, institutions, or
    high-consequence settings.
  reflection:
    before: What does Propaganda, polarization, and democratic resilience require in this exact context,
      what remains outside my role or authority, and which scope sentence or evidence criterion will keep
      the practice honest?
    during: Which observable Propaganda, polarization, and democratic resilience criterion is present,
      absent, mixed, or unknown, and are consent, privacy, access, burden, and stop conditions still intact?
    after: How did the result compare with 'Can resist sharing manipulative content and engage without
      reproducing the tactic.', what contradiction or missing context matters most, and should this Propaganda,
      polarization, and democratic resilience design be repeated, adapted, deferred, stopped, or referred?
  review_guidance:
    repeat: Repeat the same bounded Propaganda, polarization, and democratic resilience design only when
      the context and burden remain appropriate.
    adapt: Change the Propaganda, polarization, and democratic resilience medium, scope, support, timing,
      criteria, or context while preserving provenance and the narrower evidence claim.
    stop: Stop Propaganda, polarization, and democratic resilience when the practice becomes coercive,
      unsafe, privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Use appropriate qualified or emergency support for Propaganda, polarization, and democratic
      resilience questions beyond this educational source-only boundary.
  evidence_examples:
    supportive: The bounded Propaganda, polarization, and democratic resilience criteria were observed
      with provenance and no adverse boundary signal in the selected context.
    mixed: Some Propaganda, polarization, and democratic resilience criteria were observed while burden,
      support, contextual change, or a contradiction limited the conclusion.
    contradictory: The observed result opposed the intended Propaganda, polarization, and democratic resilience
      criterion, introduced harm or coercion, or showed the design was not workable.
    inconclusive: The Propaganda, polarization, and democratic resilience action was deferred, not observed,
      not applicable, stale, insufficiently bounded, or too confounded to interpret.
