schema_version: GG-PRACTICE-RESEARCH-GAPS-1.0
gaps:
  - gap_id: RG-M6A-001
    scope: full_catalog
    status: open
    priority: blocking_before_mass_authoring
    blocking_gates:
      - source_complete
      - release_candidate
      - mass_authoring
    question: Which external primary, systematic-review, official, professional, or authoritative sources support each intervention and evidence design?
    current_evidence: Internal curriculum, decision, scope-audit, and pilot records only.
    resolution_gate: Every authored protocol identifies claim-level sources and limitations before release-candidate status.
  - gap_id: RG-M6A-002
    scope: full_catalog
    status: open
    priority: M6B
    blocking_gates:
      - m6b_acceptance
      - mass_authoring
      - score_activation
    question: How should direct competency evidence remain distinct from immutable protocol evidence and lever score state?
    current_evidence: M6B proposes GG-TYPED-EVIDENCE-1.0, evidence-only GG-COMPETENCY-EVIDENCE-SHADOW-1.0, one-way GG-COMPETENCY-LEVER-SHADOW-1.0, and separate GG-PRODUCTION-SCORE-ELIGIBILITY-1.0 while preserving the frozen v1 runtime.
    resolution_gate: Passing GG-COMPETENCY-EVIDENCE-READINESS-1.0 plus accepted ADRs and completed ER-M6A-003 measurement, accessibility, and privacy/safety review. Software readiness alone does not resolve this gap.
  - gap_id: RG-M6A-003
    scope: PRACTICE-FRIENDSHIP-01
    status: open
    priority: before_content_release_claim
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: What evidence supports the chosen friendship-maintenance actions, burden, and transfer limits across cultures, disability, age, and relationship forms?
    current_evidence: Internal product design plus one bounded owner-operated pilot.
    resolution_gate: Claim-level external review and accessibility/cultural review.
  - gap_id: RG-M6A-004
    scope: PRACTICE-PLAY-01
    status: open
    priority: before_content_release_claim
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: What evidence supports non-instrumental play interventions without turning leisure, disability, or enjoyment into a deficit measure?
    current_evidence: Internal product design only.
    resolution_gate: External research review plus non-scored and shadow-only evidence fixtures.
  - gap_id: RG-M6A-005
    scope: PRACTICE-EMOTIONAL-CUES-01
    status: open
    priority: specialist_review
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: What evidence and safeguards distinguish cautious cue observation from unreliable inference, stereotyping, diagnosis, or deception detection?
    current_evidence: Internal product and safety design only.
    resolution_gate: Communication, disability, cultural, and clinical specialist review before expansion release or scoring.
  - gap_id: RG-M6A-006
    scope: PRACTICE-BOUNDARY-01
    status: open
    priority: specialist_review
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: Which contexts make direct boundary practice unsafe, and how should role, power, abuse, retaliation, legal, and organizational conditions alter the pathway?
    current_evidence: Internal product and safety design only.
    resolution_gate: Trauma-informed, interpersonal-safety, employment, and legal-boundary review before expansion release or scoring.
  - gap_id: RG-M6A-007
    scope: PRACTICE-PRESENCE-01
    status: open
    priority: before_content_release_claim
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: What evidence supports a condition-comparison attention experiment across disability, neurodiversity, pain, fatigue, stress, and varied tasks?
    current_evidence: Internal product and accessibility design only.
    resolution_gate: External research and disability-access review before content release claims or scoring.
  - gap_id: RG-M6D-001
    scope: PRACTICE-MOTIVATION-INDEPENDENT-START-01
    status: open
    priority: before_content_release_claim
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: How does a bounded start comparison perform across disability, fatigue, depression, pain, caregiving load, resource scarcity, and culturally varied expectations without turning rest or support into deficit?
    current_evidence: One implementation-intention meta-analysis plus bounded product-design and safety constraints; no specialist, accessibility-population, cultural, or participant review.
    resolution_gate: Trained content and accessibility/privacy-safety review plus relevant population evidence before release-candidate or scoring status.
  - gap_id: RG-M6D-002
    scope: PRACTICE-DECISION-RECORD-01
    status: open
    priority: before_content_release_claim
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: Which minimal prospective record and update criteria improve review without increasing surveillance, hindsight reconstruction, legal exposure, or sensitive third-party data?
    current_evidence: Outcome-bias primary research plus a privacy-minimized product-design judgment; no intervention-effectiveness or cross-context validation.
    resolution_gate: Decision-science, privacy, and context review of the exact artifact criteria before release-candidate or scoring status.
  - gap_id: RG-M6D-003
    scope: PRACTICE-DELIBERATE-PRACTICE-01
    status: open
    priority: before_content_release_claim
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: Which feedback and retry designs are valid across low-stakes skills, access needs, teaching relationships, and domains where expert practice structures differ?
    current_evidence: Foundational deliberate-practice research and a limiting meta-analysis; no validation of this short protocol or its typed rubric.
    resolution_gate: Domain, accessibility, and measurement review of the exact practice loop before release-candidate or scoring status.
  - gap_id: RG-M6D-004
    scope: PRACTICE-HOME-UPKEEP-SYSTEM-01
    status: open
    priority: before_content_release_claim
    blocking_gates:
      - source_complete
      - release_candidate
      - score_activation
    question: How should a home-upkeep audit adapt to disability, tenancy, household roles, scarcity, culture, and different housing types while reliably excluding hazardous work?
    current_evidence: General NCHH healthy-home guidance plus a bounded non-hazardous product-design protocol; no participant or housing/accessibility specialist review.
    resolution_gate: Housing-safety, tenancy/privacy, and accessibility review before release-candidate or scoring status.
