curriculum:
  title: The Ideal Person Curriculum - Pluralist Full-Scope Revision
  version: 3.0-lever-mapped
  purpose: A comprehensive, pluralist map of adult flourishing, responsibility, capability, relationship, contribution, receptivity,
    and transcendence. It is an orienting curriculum, not a definition of human worth or a clinically validated universal
    assessment.
  claim_scope:
    supported_claim: A deliberately broad, cross-tradition curriculum covering the major recurring domains of human flourishing
      and responsibility, with explicit accommodation for role, culture, disability, dependency, and multiple legitimate life
      paths.
    unsupported_claims:
    - A final or culture-free definition of the perfect human.
    - A psychometrically validated single score of moral worth or human value.
    - A substitute for medical, psychological, legal, financial, pastoral, or emergency care.
    - A requirement that every person pursue every optional role, tradition, or calling.
    perfection_policy: The word 'ideal' names an aspirational horizon. No person is expected to complete or maximize every
      competency; wisdom includes choosing roles, receiving care, accepting limitation, and balancing competing goods.
  counts:
    domain_count: 27
    master_competency_count: 383
  design_principles:
  - Coverage-driven rather than count-driven; domain sizes are intentionally uneven.
  - Universal human dignity is not scored.
  - Competence, need, importance, readiness, and applicability are separate variables.
  - Self-report alone cannot establish mastery.
  - Task completion is evidence of exposure or practice, not automatic trait improvement.
  - Role-conditional domains may be marked not applicable without penalty.
  - Multiple cultural, religious, secular, and disability-adapted pathways may instantiate the same underlying good.
  - Agency, receptivity, interdependence, stewardship, and transcendence are all treated as modes of formation.
  - The curriculum favors explicit tradeoff reasoning over pretending every good can be maximized simultaneously.
  - Sensitive topics include professional and emergency boundaries.
  - Unsafe, manipulative, dehumanizing, class-coded, gender-essentialist, ableist, and medically unsound formulations are
    excluded or reframed.
  applicability_framework:
    cross_context_core: Broadly relevant to adult life, but expression must be culturally and individually adapted.
    pathway_dependent: The underlying human question is broad, but legitimate religious, spiritual, or secular pathways differ.
    role_conditional: Relevant only when the person holds or seeks the associated role; not applicable is not a deficit.
    context_contingent: Literacy is broadly useful, while intensive practice depends on circumstance, risk, health, or resources.
    elective_cultivation: A genuine dimension of flourishing that may be expressed through many forms and should not be treated
      as a compulsory professional identity.
  assessment_architecture:
    prohibited_use: Do not collapse the curriculum into a single moral-worth, virtue, or 'perfect person' score.
    recommended_profile_dimensions:
    - evidence_based_competence
    - current_need_or_deficit
    - personal_or_role_importance
    - readiness_for_change
    - opportunity_and_resource_access
    - risk_or_urgency
    - confidence_and_evidence_quality
    rating_scale:
      NA: Not applicable or consciously unchosen role; excluded from denominators.
      '0': Not yet assessed or insufficient evidence.
      '1': Awareness only.
      '2': Conceptual understanding or initial guided practice.
      '3': Repeated practice with inconsistent real-world transfer.
      '4': Reliable independent application across ordinary contexts.
      '5': Integrated application under stress, adaptation across contexts, and ability to support others.
    evidence_types:
    - conceptual_explanation
    - real_world_application
    - behavioral_adherence
    - external_observer_feedback
    - artifact_completion
    - objective_or_performance_indicator
    - qualified_assessment
    - longitudinal_review
    - community_or_audience_feedback
    advancement_rule: A score increase normally requires at least two independent evidence types and cannot be triggered solely
      by checking off a task.
    priority_model: Rank developmental work from evidence-based need, personal or role importance, readiness, risk, and opportunity.
      Keep personality archetype, values, goals, and cultural or faith commitments as weighting lenses, not deterministic
      diagnoses.
    anti_gaming_rules:
    - Repeated low-effort tasks cannot substitute for transfer under realistic conditions.
    - Evidence quality and recency must be tracked separately from quantity.
    - Observer feedback must not come exclusively from dependent or coerced relationships.
    - Health, trauma, legal, safety, and financial outcomes require appropriate qualified evidence.
    - Scores decay in confidence when evidence is old, context-limited, or contradicted.
  cultural_and_pathway_adaptation:
    rules:
    - Distinguish underlying good from culturally specific expression.
    - Support both direct and indirect communication traditions.
    - Support individual, family-centered, communal, and religious decision structures while preserving consent and human
      dignity.
    - Permit faith-specific interpretation overlays without presenting one tradition as empirically proven by the assessment.
    - Account for class, housing, institutional access, geography, language, disability, and caregiving constraints.
    - Use functional equivalents when a standard practice is inaccessible or inappropriate.
    - Audit differential scoring and burden across gender, age, faith, culture, disability, neurotype, and socioeconomic position.
    interpretive_overlays:
    - pluralist_default
    - classical_virtue
    - Stoic
    - Confucian
    - Christian
    - Jewish
    - Islamic
    - Buddhist
    - Hindu
    - secular_humanist
    - existentialist
    overlay_rule: Overlays change language, examples, authorities, and optional weighting; they do not change the equal dignity
      of users or permit coercion, abuse, or discrimination.
  validation_status:
    taxonomy_status: structurally revised and conceptually audit-ready
    assessment_status: not psychometrically validated
    outcome_status: not yet demonstrated to cause broad human-development outcomes
    required_before_strong_claims:
    - Expert review across philosophy, religion, psychology, education, disability, public health, family studies, and cultural
      anthropology.
    - Cognitive interviews with diverse users.
    - Pilot testing for burden, clarity, and completion behavior.
    - Reliability and construct-validity testing at the domain and subscale level.
    - Convergent and discriminant validity against established measures.
    - Differential item functioning and fairness analysis.
    - Longitudinal outcome testing using behavior, artifacts, observer feedback, and external anchors.
    - Revision or removal of competencies that do not perform as intended.
    external_anchors:
    - Harvard Flourishing Measure
    - Self-Determination Theory basic psychological needs measures
    - OECD social and emotional skill frameworks
    - validated mental and physical health indicators
    - relationship quality and social support measures
    - objective skill, safety, finance, and domestic-function artifacts
    - context-specific professional standards and certifications
  audit_changes:
    added_domains:
    - Mortality, Suffering, Tragedy, and Hope
    - Vulnerability, Trauma, Disability, Neurodiversity, and Dependency
    - Digital Life, Media, AI, and Information Security
    split_domains:
    - Love, Sexuality, Partnership, Family, and Caregiving -> Intimacy, Sexuality, and Partnership + Family, Parenting, Reproduction,
      and Caregiving
    - Money, Business, and Resource Stewardship -> Personal Finance, Provision, and Material Stewardship + Entrepreneurship,
      Markets, Economics, and Social Systems
    renamed_or_expanded:
    - Practical Independence, Home, and Material Life -> Domestic Competence, Infrastructure, and Material Life
    - Community and citizenship expanded with nonviolent action, propaganda resistance, peacebuilding, media institutions,
      and shared risk.
    - Work expanded with labor rights, exploitation, worker voice, inclusion, and boundaries.
    - Leadership expanded with anti-corruption, institutional capture, whistleblowing, governance, and abuse response.
    - Play expanded with communal festivity, pilgrimage, inclusive recreation, humor, and ecological reciprocity.
    - Reasoning expanded with statistics, scientific reasoning, causal inference, models, and adversarial information.
    - Spirituality expanded with liturgy, authority and reform, interfaith humility, and mystical experience.
    - Family expanded with fertility, pregnancy, reproductive loss, diverse family forms, safeguarding, and caregiver sustainability.
    redundancy_control:
    - Execution and review remain in one operational domain and one integrative capstone rather than proliferating separate
      productivity categories.
    - Digital attention moved from general discipline into a dedicated digital-life domain while general impulse regulation
      remains in self-mastery.
    - Quality tradeoffs moved into work and craft rather than remaining a generic productivity competency.
    - Mortality and tragedy are separated from routine emotional regulation while retaining cross-links.
