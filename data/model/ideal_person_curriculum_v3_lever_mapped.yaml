    scoring_summary:
      lever_mastery: M_l = sum_q(a_q * w_ql * m_q) / sum_q(a_q * w_ql), over assessed competencies q
      development_need: N_l = applicability_l * importance_l * readiness_l * urgency_l * confidence_l * (1 - M_l)^1.5
      task_priority: P_final_t = P_t * (0.95 + 0.10 * F_t)
      completion_rule: Update from rubric-scored evidence. Completing a task logs practice or evidence but does not automatically
        increase mastery.
