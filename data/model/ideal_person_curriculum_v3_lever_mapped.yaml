    orientation_modes:
    - id: O01
      slug: discernment
      name: Discernment
      definition: Preference for understanding, truth-seeking, reflection, pattern recognition, and sound judgment.
      high_expression: Pauses to understand, tests assumptions, seeks coherence, and differentiates signal from noise.
      possible_excess: Analysis, detachment, hesitation, or treating lived problems as intellectual puzzles.
    - id: O02
      slug: agency
      name: Agency
      definition: Preference for initiating, asserting, deciding, persisting, and producing change.
      high_expression: Moves toward difficulty, makes choices, takes responsibility, and creates momentum.
      possible_excess: Control, impatience, domination, overwork, or action without sufficient listening.
    - id: O03
      slug: connection
      name: Connection
      definition: Preference for empathy, belonging, cooperation, mutual understanding, and relational attunement.
      high_expression: Reads people, builds trust, includes others, and protects relationship quality.
      possible_excess: Approval-seeking, enmeshment, conflict avoidance, or sacrificing truth and self-respect.
    - id: O04
      slug: stewardship
      name: Stewardship
      definition: Preference for responsibility, reliability, maintenance, protection, provision, and long-term continuity.
      high_expression: Preserves what matters, anticipates consequences, fulfills duties, and builds durable structures.
      possible_excess: Rigidity, burden, paternalism, risk aversion, or loyalty to obsolete structures.
    - id: O05
      slug: exploration
      name: Exploration
      definition: Preference for novelty, experimentation, creativity, discovery, and possibility.
      high_expression: Generates options, crosses boundaries, learns through experience, and adapts quickly.
      possible_excess: Scattered attention, impulsivity, unfinished work, or novelty without depth.
    - id: O06
      slug: transcendence
      name: Transcendence
      definition: Preference for meaning, virtue, reverence, service, beauty, legacy, and realities larger than the isolated
        self.
      high_expression: Connects action to purpose, conscience, sacred concern, or the common good.
      possible_excess: Moralism, abstraction, self-sacrifice without boundaries, or bypassing practical reality.
