schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '07'
exercises:
  '07.01':
    title: "Describe a difficult feeling precisely enough to choose a response"
    goal: "Separate emotions, physical sensations, interpretations and action urges, then choose a response that fits the actual concern."
    scope_note: "Two ordinary moments exercise emotional differentiation. Labels are working descriptions, not diagnoses or evidence that an interpretation of another person is true."
    setup: "Use a private note or voice memo and a recent manageable moment, or this supplied case: a friend cancels a visit; you feel hot and tired, want to send a sharp message, and think you do not matter. The reason for cancellation is unknown. No distressing memory is required."
    burden: "About 15 minutes for the first description and 10 minutes for a second ordinary moment or case variation."
    actions:
      - title: "Separate what happened from what the moment seemed to mean"
        instructions: "Write six short lines: the observable event; possible emotions; their mild, moderate or strong intensity; bodily sensations or unknown; the meaning you gave the event; and the action urge. For the supplied case, cancellation is the event, feeling unimportant is an interpretation, heat is a sensation and sending a sharp reply is an urge. Do not turn I feel ignored into proof of the friend's intention. Allow several feelings and different intensities to coexist. If using the fictional case, mark inferred feelings as possibilities rather than claiming to know the person's inner state."
        checks: [The observable event is separated from interpretation, Emotions and intensity are described provisionally, Sensations are distinguished from action urges, Unknown intentions remain unknown]
      - title: "Distinguish neighboring feelings by the concern each points toward"
        instructions: "Compare these possible meanings: anger about a broken agreement; hurt about disconnection; shame about seeing oneself as unwanted; fear about losing the relationship; envy about someone else receiving time; grief about an actual loss; and exhaustion about depleted capacity. These are prompts, not definitions that fit everyone. Select the one or two best-supported descriptions and explain why a nearby label fits less well. In the cancellation case, no evidence yet establishes envy or a permanent loss. Write one question that could clarify the situation, such as whether the friend wants to reschedule, without demanding that they certify your worth."
        checks: [All seven neighboring states are considered, Selected labels have case-specific reasons, An unsupported label is left uncertain, A clarifying question addresses the actual concern]
      - title: "Check whether greater precision changes the next response"
        instructions: "Choose a proportionate response to the leading concern: ask about another date for disconnection, state an agreement that needs repair, or postpone an optional discussion until rested. Draft or make that response in a suitable real context. Repeat the six-line description at a second ordinary moment. For a fictional variation, the friend explains they are ill and offers another date; reconsider what changes and what remains unknown. Compare the original urge with the chosen response. Keep an unchanged feeling visible; a clearer description can be useful without immediately changing mood."
        checks: [The response fits the identified concern, A second moment or explicit case variation is examined, New information can revise the interpretation, Mood change is not required to claim clearer description]
    adaptation: "Use familiar words in any language, pictures, intensity words or a communication partner who does not select feelings for you. Bodily sensations can remain unknown. A fictional comparison exercises vocabulary and reasoning, not live emotional regulation."
    review: "Which distinction changed your response, and which label remains tentative? Keep the useful question or response and revisit it after new information. Two descriptions do not establish emotional accuracy across relationships."
    examples:
      supportive: "A cancelled visit was first called anger; distinguishing hurt and exhaustion led to a clear rescheduling request instead of an accusation."
      mixed: "The person identified hurt but still did not know the reason for cancellation, so the interpretation stayed provisional."
      contradictory: "A feeling of rejection was recorded as proof that the friend intended harm, and the label justified a hostile reply."
      inconclusive: "A list of emotion words was copied without connecting any word to an event, meaning or possible response."
  '07.02':
    title: "Notice an early body cue before an ordinary reaction takes over"
    goal: "Observe personally accessible physical signals and use an early cue to choose a practical response before it becomes an unwanted behavior."
    scope_note: "This is brief everyday observation, not a diagnostic body scan or a requirement to detect every internal sensation. New or concerning symptoms need appropriate medical assessment rather than an emotional explanation."
    setup: "Choose a familiar low-pressure activity such as reading an ordinary message. Keep a private note with before, early cue, response and afterward. Observe without changing your breathing or provoking stress. If internal attention is uncomfortable, use an external cue such as typing speed or an urge to interrupt."
    burden: "Two ordinary opportunities over several days, with less than two minutes of observation at each and a short review."
    actions:
      - title: "Describe a baseline without interpreting it as an emotional diagnosis"
        instructions: "Before the selected activity, briefly consider breathing, tension, temperature, energy, posture, pain and overall activation. For each, write an ordinary description, unchanged, or not noticed; do not search repeatedly for a sensation. Activation means your sense of being keyed up, settled or slowed down, not a measured nervous-system state. Include ordinary context such as heat, an uncomfortable chair or a tiring day. End the observation and start the activity. A tense shoulder alone cannot identify an emotion or rule out a physical cause."
        checks: [All seven cue categories are considered without forced detection, Unknown or unchanged cues are allowed, Ordinary physical context is recorded, Sensations are not used to diagnose an emotion or condition]
      - title: "Connect one early cue to a specific interruptible behavior"
        instructions: "During the ordinary activity, notice whether one accessible cue appears before a behavior you would prefer to choose deliberately. For example, faster typing may precede sending an abrupt reply; raised shoulders may accompany continuing an uncomfortable task. If a cue occurs, stop the optional behavior briefly, reread the message or adjust the ordinary setup, then choose the next step. Record the order of cue, response and behavior afterward. If you noticed only after acting, say so; retrospective awareness is useful but is not earlier intervention."
        checks: [One cue is linked to a specific behavior, The actual order of events is recorded, A practical response is attempted when appropriate, Late recognition is distinguished from early intervention]
      - title: "Try the cue-response link again and keep its limits visible"
        instructions: "At another natural occurrence of the same activity, use the same cue as a reminder to reread, adjust the setup or request a moment before responding. Compare whether the cue appeared, whether you caught it earlier, what you did and what happened. If the cue was absent or unreliable, select a visible alternative such as reaching for Send rather than inventing a physiological pattern. If noticing sensations increases distress or preoccupation, discontinue the internal observation and use an external prompt or seek appropriate help. Do not manufacture a stressful event for a second trial."
        checks: [A second natural opportunity is examined, Earlier recognition is assessed from the recorded sequence, An unreliable cue can be replaced by an external prompt, Increased distress does not trigger more intensive self-monitoring]
    adaptation: "A visual timer, a pause card or a chosen external behavior can substitute for inaccessible body awareness. These alternatives test earlier response selection, not improved interoception. Keep prescribed supports and care unchanged; this practice never asks you to ignore pain or hold your breath."
    review: "Was the cue observable before action and useful enough to keep? Retain one practical reminder, change it or stop monitoring. Do not infer improved health or universal emotional regulation from two occasions."
    examples:
      supportive: "Faster typing was noticed before an abrupt reply; rereading allowed a factual question, and the sequence was observed again later."
      mixed: "Shoulder tension was noticed only afterward on the first occasion, while an external Send prompt supported a timely pause on the second."
      contradictory: "A new concerning physical symptom was dismissed as emotion, or repeated checking made the activity harder and was intensified."
      inconclusive: "The person planned to watch for tension but recorded no opportunity, cue or response sequence."
  '07.03':
    title: "Pause a consequential reply and return to the issue deliberately"
    goal: "Create room between an emotional urge and a consequential reaction while preserving both the feeling and a concrete route back to the underlying issue."
    scope_note: "One pause-and-return sequence practices response choice. It is not a demand to be calm before speaking, suppress emotion, tolerate mistreatment or delay urgent protective action."
    setup: "Use an ordinary low-stakes disagreement or this case: someone writes that your contribution was late, but the agreed deadline was unclear. You want to reply that they are always unfair. Use an unsent draft; no real recipient is needed for rehearsal."
    burden: "About 10 minutes to prepare, a chosen brief pause during one opportunity, and 10 minutes to review the return."
    actions:
      - title: "Choose a pause method that leaves the issue available for repair"
        instructions: "Write the feeling, the impulse and what could be damaged by an immediate response. Choose one suitable pause: leave the draft unsent and write privately; orient to an ordinary object in the room; take comfortable movement; allow an unforced breath; pray if it fits your beliefs; or consult a willing trusted person. Do not combine every method into a ritual. State when or under what practical condition you will return, such as after rereading the agreement later today. In the supplied case, the unresolved issue is the deadline, not whether either person is always unfair."
        checks: [Feeling and consequential urge are both named, One accessible pause method is selected, A concrete return condition is specified, The underlying issue remains explicit]
      - title: "Perform the pause before sending or committing to the reaction"
        instructions: "When the ordinary opportunity occurs, leave the consequential response unsent and carry out the selected pause. If another person is waiting, use a direct statement such as I want to answer this carefully; I will return to the deadline question this afternoon. Do not require them to soothe you or punish them with unexplained silence. In rehearsal, read the fictional message, speak the pause statement and actually set aside the draft before reconsidering it. Record whether the pause preceded the reaction; imagining a pause afterward is not the same event."
        checks: [The chosen pause is actually performed, Its timing relative to the reaction is recorded, Any delay is communicated proportionately, Rehearsal is distinguished from a live disagreement]
      - title: "Return with an issue-focused response and assess its consequences"
        instructions: "At the return point, write or say what happened, what still matters and one next request. For the case: I understood the deadline differently; can we check what was agreed and set a clear date for the remaining work? Retain a legitimate boundary or correction; the pause does not require agreement. Compare this response with the original impulse for accusations, clarity and likely practical effect. If a real reaction already caused harm, include a specific repair. Record whether you actually returned, even if still upset, and what remains unresolved."
        checks: [The underlying issue is revisited at the return point, The response makes a concrete request or boundary clear, Any earlier harm receives a specific repair proposal, Remaining emotion and disagreement are not hidden]
    adaptation: "Use a written message, supported communication or a longer explicitly agreed return period. Skip body-focused methods if they are uncomfortable. During danger, prioritize safety and appropriate help; the exercise is for ordinary consequential reactions, not crisis delay."
    review: "Did the pause change the chosen behavior, and did you return rather than avoid? Keep one workable method and one clear return condition. Success means more deliberate action, not mandatory calm or agreement."
    examples:
      supportive: "The sharp draft remained unsent, the person paused, and they returned to clarify the deadline while still feeling annoyed."
      mixed: "The pause prevented an accusation but the promised return was missed; the unresolved issue and missed commitment were recorded."
      contradictory: "A pause became days of punitive silence, or the person denied having any concern to avoid returning to the disagreement."
      inconclusive: "Several calming methods were listed, but none was performed before a real or explicitly rehearsed response."
  '07.04':
    title: "Test one manageable fear prediction through repeated ordinary attempts"
    goal: "Approach a worthwhile, suitably safe situation gradually and compare a specific feared outcome with what actually happens on repeated attempts."
    scope_note: "This is a bounded experiment with ordinary mild apprehension, not treatment for an anxiety disorder, trauma, panic or compulsions. Rehearsing a fictional case does not demonstrate exposure to a personally feared situation."
    setup: "Read the NHS Facing your fears reference. Choose a genuinely useful ordinary step, such as asking a routine clarification in a setting where questions are welcome. Exclude danger, trauma reminders, severe distress, medical challenges and violations of another person's boundaries. If suitability is unclear or symptoms impair daily functioning, use qualified help to plan rather than starting self-directed exposure."
    burden: "About 15 minutes to prepare, two or more naturally available brief attempts over a week, and 10 minutes to compare them. No escalation deadline applies."
    actions:
      - title: "Choose the smallest worthwhile step and a prediction you can observe"
        instructions: "Name the value served, such as obtaining information needed to participate. Write two or three genuinely feasible versions in increasing personal difficulty: ask a familiar person privately, ask a routine question in a welcoming small group, or ask in a larger suitable setting. Start with the manageable version, not the most impressive one. Write a testable prediction, such as the person will call the question foolish, and what would count as a different outcome. Keep necessary accessibility and safety supports. If there is no personally relevant fear, analyze the supplied ladder as preparation and leave live attempts unclaimed."
        checks: [The step serves a chosen worthwhile purpose, Difficulty is ordered for this person rather than assumed, The feared outcome is observable and specific, Suitability and necessary supports are preserved]
      - title: "Make a first ordinary attempt and record the actual response"
        instructions: "At an appropriate opportunity, ask the selected question and allow the ordinary exchange to finish without adding an endurance challenge. Record what you predicted, what you actually asked, the other person's observable reply, and any uncertainty. Note whether apprehension was present and what you managed while it was present; do not use a required reduction in anxiety as the completion rule. A neutral answer can contradict a prediction of ridicule without proving every future interaction safe. Stop for actual danger or unmanageable distress and seek suitable support rather than pushing through for credit."
        checks: [A suitable live attempt actually occurs, Prediction and observable outcome are compared, Participation is distinguished from symptom reduction, Uncertainty or a difficult outcome is recorded honestly]
      - title: "Repeat a suitable step and revise the prediction from both occasions"
        instructions: "Use another natural opportunity for the same manageable step. Repeat rather than automatically increasing difficulty; choose a modest next version only if appropriate and freely chosen. Compare both predictions with both outcomes, including any dismissive response. If something went badly, distinguish the actual problem, such as an unsuitable setting, from a conclusion that all questions are unsafe. Decide to repeat, adjust the setting, ask for help or stop this experiment. Keep a missed second opportunity pending instead of counting a plan as repeated exposure."
        checks: [A second suitable live attempt is recorded, Both outcomes inform the revised prediction, Difficulty is not increased automatically, The next choice follows evidence and current suitability]
    adaptation: "Text, AAC, an interpreter or another accessible channel can be the actual communication route; necessary supports are not failures. With no safe opportunity, work through the case privately and label it preparation. An existing clinician-led plan takes precedence; do not alter treatment or attempt trauma exposure here."
    review: "What exactly did each attempt teach about the feared outcome and your ability to participate with uncertainty? Retain adverse evidence as well as reassuring evidence. Repeated ordinary attempts do not establish treatment success or general fearlessness."
    examples:
      supportive: "Two routine questions received usable replies rather than the predicted ridicule; apprehension remained, but the person obtained the needed information."
      mixed: "One reply was helpful and one was curt, so the person revised the prediction narrowly and considered whether the setting was suitable."
      contradictory: "The person entered an actually unsafe situation or removed a needed communication support to make the challenge count as courage."
      inconclusive: "A fear ladder was written or rehearsed, but no personally relevant live attempt occurred, so exposure remains untested."
  '07.05':
    title: "Turn one angry reaction into a clear boundary and proportionate repair"
    goal: "Distinguish a real violation from an injured self-image, reduce escalation and state a concrete concern without intimidation, suppression or indirect punishment."
    scope_note: "One ordinary disagreement tests assertive communication and responsibility for impact. It is not mediation for abuse or a requirement to confront a person who may retaliate."
    setup: "Use a manageable disagreement with a reasonably safe counterpart, or this case: a shared item was used without asking and returned late; you want to call the person selfish. Paper or an unsent message is enough for rehearsal. Do not manufacture a violation."
    burden: "About 15 minutes of preparation, one suitable conversation or rehearsal, and 10 minutes afterward."
    actions:
      - title: "Locate the violation without treating anger as proof of intent"
        instructions: "Write what happened, the agreement or value affected, the impact and what remains unknown. In the case, permission and access to the item are at issue; the person's character is not established. Then examine the ego-threat possibility: are you upset because an agreement was broken, because you were not given special deference, or both? An injured self-image does not erase a real violation, and a strong feeling does not create one. Choose a concrete outcome such as return by an agreed time or asking permission next time, rather than making the other person feel small."
        checks: [The concern is anchored to an event and value or agreement, Impact is separated from inferred intent, Possible ego threat is considered without dismissing a real boundary, The desired outcome is concrete and proportionate]
      - title: "State the concern directly while reducing escalation"
        instructions: "Before a suitable exchange, remove threats, insults, sarcasm and unrelated past grievances from the opening. If needed, take a brief communicated pause with a return time. Say or rehearse: When the item was used without asking and returned late, I could not use it as planned. I am angry about that. Please ask before borrowing it and agree a return time. Invite correction of the facts and listen to the reply without surrendering the boundary automatically. Keep volume, distance and communication format appropriate; anger need not be disguised as a joke or expressed through withdrawal."
        checks: [The statement names behavior impact feeling and request, Intimidation and indirect punishment are removed, A factual correction can be heard, The boundary remains explicit without requiring agreement]
      - title: "Repair your contribution and follow through on an agreed boundary"
        instructions: "Record the reply and whether a workable agreement exists. If you insulted or threatened earlier, acknowledge the specific act and offer a concrete correction without making the apology conditional on their apology. In the case, a proportionate follow-through could be declining further lending until a return arrangement is reliable; damaging their property would not repair the issue. In rehearsal, try both an accepting response and a refusal, then state what you can choose yourself. Review whether your expression clarified the concern, escalated it or concealed it. Do not count a drafted agreement as accepted by another person."
        checks: [The other person's actual or rehearsed response is recorded accurately, Any harmful contribution receives a specific repair, Follow-through stays within the person's own choices, Agreement is not inferred from an unsent draft or silence]
    adaptation: "Use a written exchange, an agreed mediator or rehearsal when direct discussion is unsuitable. For coercion or credible retaliation, use an appropriate support route instead of confrontation. A boundary can be clear in different cultural communication styles without requiring personal humiliation."
    review: "Was anger expressed in a way that protected the legitimate value and respected the other person's agency? Identify one repair, boundary or unresolved issue to carry forward. An unsuccessful negotiation does not mean the feeling was illegitimate."
    examples:
      supportive: "The person named the borrowing problem, acknowledged an earlier insult and agreed a permission-and-return arrangement without attacking character."
      mixed: "The concern was stated clearly but the counterpart refused an agreement; further lending was declined without threats."
      contradictory: "The person used anger to demand submission, retaliated against property or hid the concern behind sarcasm and punishment."
      inconclusive: "The person wrote that anger was valid but did not identify a violation, state a request or rehearse a response."
  '07.06':
    title: "Make room for one loss while carrying a valued part of life forward"
    goal: "Name what has been lost, allow an honest response, and combine remembrance, support and a realistic next part of living without demanding that sorrow disappear."
    scope_note: "A small remembrance-and-continuation practice explores grief and changed expectations. It cannot measure recovery, prescribe a grief timetable or require positive meaning from a loss."
    setup: "Use a loss you freely choose to approach, or this fictional case: a weekly community gathering has ended, leaving someone missing companionship and a familiar role. Keep a private note and an optional object, image or song that is appropriate to the loss. Read the NHS grief reference for the variability of responses and help options."
    burden: "Three brief periods over several days; shorten, postpone or use the fictional case if approaching the loss is too much."
    actions:
      - title: "Name the loss and the expectations that no longer fit"
        instructions: "Complete three statements: what is no longer available; what I miss or feel, including numbness or uncertainty; and which ordinary expectation now needs revision. In the supplied case, the gathering, casual companionship and the expectation of a ready-made weekly plan are different losses. Add what remains without using it to cancel what is gone. Avoid ranking the loss against someone else's or assigning yourself a stage you should have reached. If using the case, distinguish the stated loss from an imagined emotional response."
        checks: [The loss is named in concrete terms, The present response is allowed without a prescribed stage, A changed expectation is identified, What remains does not minimize what was lost]
      - title: "Choose a bounded act of remembrance and a form of support"
        instructions: "Choose a small act that fits the loss and your beliefs: write one memory, quietly view an image, say a prayer, play a meaningful song or set aside a brief moment without words. Carry it out if freely chosen; no public disclosure is required. Then name a support preference, such as company without advice or help changing a routine. Ask an appropriate willing person if useful, allowing them to decline. For the fictional gathering, draft a short memory and a request to keep one existing connection; do not claim that someone received support from a fictional exchange."
        checks: [A fitting remembrance or acknowledgment is actually performed, The act follows the person's beliefs and choice, A specific support preference is articulated, A request is distinguished from support actually received]
      - title: "Carry one valued element into a changed ordinary day"
        instructions: "Choose a modest next action consistent with both the loss and current capacity. In the supplied case, carry companionship forward through an invitation to a brief conversation while acknowledging that the old gathering cannot be recreated by that invitation. In a personal context, attempt the chosen action and note what it made possible and what still hurt. A revised expectation might be leaving the former meeting time partly unplanned rather than immediately replacing the whole activity. Review whether further support is needed; continued difficulty is not a failure of remembrance or effort."
        checks: [The next action carries a named value into changed circumstances, Actual action and fictional planning remain distinct, Continuing sorrow is recorded without a recovery deadline, Support needs and changed expectations are reviewed]
    adaptation: "Use a secular, religious, silent, spoken or sensory-accessible form. For an overwhelming or recent loss, use the fictional case or defer and seek suitable support. Persistent difficulty coping or impaired functioning deserves qualified help; immediate safety concerns take priority over this practice."
    review: "What was lost, what remains, and what do you want to carry forward without pretending the loss has been replaced? Keep the support preference and revise one expectation. Completion says nothing about how long grief should last."
    examples:
      supportive: "A memory of the ended gathering was honored, one connection was contacted and the empty weekly time was acknowledged without claiming the loss was solved."
      mixed: "Remembrance mattered but the invitation was declined; the person retained the loss and considered a different source of companionship."
      contradictory: "The person forced a cheerful meaning, treated ongoing sorrow as disobedience or demanded disclosure to prove they had processed the loss."
      inconclusive: "General advice about moving on was collected without naming the loss, acknowledging it or choosing a realistic continuation."
  '07.07':
    title: "Replace a verdict on your whole self with responsibility and repair"
    goal: "Separate global self-condemnation from a specific responsibility, make a proportionate repair and identify conduct that can change."
    scope_note: "One manageable lapse exercises remorse and repair. The exercise does not establish legal fault, require confession of private history or assume that every guilty feeling reflects actual wrongdoing."
    setup: "Use an ordinary lapse or this supplied case: you promised to return a borrowed book yesterday, forgot and have not yet told its owner. You now think you are an entirely unreliable person. Do not select abuse, a legal dispute or a traumatic event for this exercise."
    burden: "About 15 minutes to separate claims, one practical repair opportunity, and a short review at the next comparable commitment."
    actions:
      - title: "Translate self-condemnation into a checkable account of conduct"
        instructions: "Write the global verdict, then replace it with the specific action or omission, the actual agreement, known impact and uncertainty. For the case, I missed the agreed return date is supported; I can never be trusted goes beyond the evidence. Ask whether the obligation was freely yours and realistic, rather than accepting blame assigned by someone else. If no wrongdoing is supported, write a clarification or boundary instead of manufacturing an apology. Where responsibility is real, name it plainly without using contextual difficulty as automatic absolution."
        checks: [The global verdict is distinguished from a specific act, Responsibility is checked against a real obligation, Known impact is separated from imagined blame, Context neither erases responsibility nor establishes total badness]
      - title: "Offer a repair that addresses the impact without demanding absolution"
        instructions: "For a real lapse, communicate the act you own, its known impact and an achievable correction. In the case: I missed the return date and should have told you. I can return the book this afternoon; does that work, or is another arrangement needed? Avoid asking the owner to reassure you that you are good, explain away the harm or forgive on demand. Carry out the agreed correction if possible and record what actually happened. In rehearsal, write the offer and respond to a delayed or declined arrangement without inventing acceptance."
        checks: [The repair addresses the specific impact, The offer does not demand reassurance or forgiveness, Promised correction is distinguished from completed correction, The affected person's response remains their choice]
      - title: "Change one repeatable behavior and revisit it at the next opportunity"
        instructions: "Choose a change directly connected to the lapse: record the return date where you will see it, agree a date you can meet, or notify the owner before a delay. Put the change in place and use it at the next comparable ordinary commitment when available. Compare what you did with the earlier pattern, including any repeat lapse. Renew responsibility and adjust the arrangement if needed; do not turn a second mistake into proof that change is impossible. If no new opportunity occurs, record the installed support and leave changed future conduct untested."
        checks: [A prevention change is tied to the original lapse, The change is actually put in place, Its use is checked at a real later opportunity when available, A repeat lapse prompts specific revision rather than global condemnation]
    adaptation: "Use a private draft or an accessible communication channel. An apology is not required when the supposed obligation was coercive or no wrongdoing is established. Seek appropriate professional advice for high-stakes responsibility questions; this exercise cannot adjudicate them."
    review: "What responsibility was yours, what repair occurred and what changed in conduct? Leave the other person's forgiveness and the next opportunity unknown when unavailable. Neither remorse nor a completed repair measures total character."
    examples:
      supportive: "The late return was acknowledged, the book was returned as agreed and a visible reminder was used for the next borrowing arrangement."
      mixed: "The correction was completed but the owner remained upset; the person accepted that response and kept the prevention change."
      contradictory: "An apology became a demand for reassurance, or self-hatred replaced returning the item and changing the unreliable arrangement."
      inconclusive: "The person wrote that everyone makes mistakes but did not examine responsibility, propose a correction or install a conduct change."
  '07.08':
    title: "Turn one comparison into a chosen goal without controlling another person"
    goal: "Identify the need, insecurity or admiration beneath envy or jealousy and choose a constructive response that respects both your agency and another person's freedom."
    scope_note: "One comparison episode explores threatened needs and a practical response. It does not infer betrayal, diagnose attachment or require gratitude to erase a legitimate unmet need."
    setup: "Use a manageable comparison or this case: a peer is praised for a clear explanation, and you think there is no room for your contribution. Their technique is to state the point before the details: Please reply by Friday so I can arrange the room. Your practice sentence is I need to arrange the room and was hoping to hear from you sometime soon; rewrite it with a clear request first. A second variation is that a friend spends time with someone else and you want to demand exclusive attention. Use a private note; no social-media account or personal disclosure is needed."
    burden: "About 20 minutes of analysis, one modest constructive action and a brief later review."
    actions:
      - title: "Separate admiration and threatened needs from a scarcity story"
        instructions: "Describe the visible event, what you want, what you fear losing and what the event does not establish. In the praise case, admiration may point to a learnable skill, while the claim that another person's recognition leaves none for you needs evidence. In the friendship variation, insecurity about connection differs from proof of betrayal. Examine whether the urge is to learn, obtain reassurance, withdraw, compete or control another person's choices. Name any real scarcity, such as a single available role, without extending it into a verdict that all belonging or opportunity is scarce."
        checks: [The event is separated from a scarcity or betrayal interpretation, A wanted good and threatened need are named, Admiration and insecurity are both considered, Possessive or controlling urges are identified without justification]
      - title: "Choose the response that fits the actual need"
        instructions: "Compare four routes and select the best fit: appreciate a present good without denying the missing one; set a boundary around your own participation; learn a specific admired skill; or pursue a chosen goal. For the praise case, identify one technique in the admired work and practice it on a small example. For the friendship case, request mutually welcome time rather than passwords, surveillance or exclusivity. Write the concrete next step and why it serves the underlying need. A boundary states your choices; it does not secretly turn another person's independent relationship into disobedience."
        checks: [Appreciation boundary learning and goal routes are considered, The chosen route addresses the identified need, The next step is specific enough to attempt, The response preserves the other person's independent choices]
      - title: "Act on the chosen route and compare its effect with the original urge"
        instructions: "Perform the modest step: practice the identified technique on your own work, make an appropriate invitation, adjust your own comparison exposure or acknowledge a specific present good. Record the action and what changed in your choices, even if envy or jealousy remains. For the supplied cases, a private skill attempt is real practice, while a drafted invitation is only communication preparation until sent appropriately. Check whether the action moved toward the wanted good or merely hid competition behind praise. Revise the goal or request if the original interpretation was unsupported."
        checks: [A concrete constructive step is actually attempted, Its effect on choices is recorded separately from mood, Rehearsed communication is not described as a live agreement, Remaining comparison does not justify control or surveillance]
    adaptation: "Use the supplied sentence and technique without obtaining another person's work, or use a fictional friendship draft. Spoken or supported writing is suitable. If comparison concerns coercion or credible danger, prioritize support and safety rather than treating it as ordinary jealousy."
    review: "Which wanted good became clearer, and did your action pursue it without diminishing someone else? Keep one learning step, request or self-directed boundary. Feeling less envy is possible but is not required proof of a useful choice."
    examples:
      supportive: "Admiration for a peer's clear explanation led to practicing a concise summary instead of undermining the peer's recognition."
      mixed: "A request for time clarified a need for connection, but the friend was unavailable; the disappointment remained without an exclusivity demand."
      contradictory: "Jealousy was used to demand account access, restrict another person's friendships or sabotage an admired person's work."
      inconclusive: "The person declared comparison unhealthy but did not identify a wanted good or attempt a constructive alternative."
  '07.09':
    title: "Express one difficult feeling and need to a suitable willing listener"
    goal: "Communicate a difficult emotional truth clearly and proportionately, with a concrete request and room for the listener's boundaries."
    scope_note: "One bounded disclosure practices expression and listening. It does not require revealing trauma, making every feeling public or proving that another person is trustworthy through a risky disclosure."
    setup: "Choose an ordinary feeling you are willing to share with someone who has previously respected boundaries. Default example: repeated last-minute changes leave you disappointed, and you would prefer earlier notice. If no suitable listener is available, use an unsent draft and rehearsal; do not approach an unsafe person to satisfy the exercise."
    burden: "About 10 minutes to prepare, a brief agreed exchange and 10 minutes afterward."
    actions:
      - title: "Prepare a feeling statement with the right amount of disclosure"
        instructions: "Write four parts: the specific event, your feeling, the need or value involved and a feasible request. For the example: When plans change at the last minute, I feel disappointed and unsettled. Predictability matters to me; could you let me know earlier when possible? Remove mind-reading, global accusations and private details not needed for the request. Identify how the feeling might otherwise leak out through unexplained withdrawal, hostility, acting cheerful for approval or attempts to control. Choose one direct sentence to replace that pattern without requiring an elaborate emotional performance."
        checks: [Event feeling need and request are all explicit, The statement avoids mind-reading and global accusation, Disclosure is limited to what the person freely chooses, A specific indirect expression pattern is replaced]
      - title: "Ask for listening space and communicate the chosen truth"
        instructions: "Ask whether this is a suitable time for a short conversation or message, and whether you want listening, advice or a practical answer. Share the prepared statement in your own words. Allow the listener to say that now is not a good time or that they cannot meet the request. If you are rehearsing, speak or write the statement and practice a response to Not now without pretending consent was obtained. Do not increase the disclosure to force engagement, or treat the listener's different feelings as proof that your own were wrong."
        checks: [The listener's availability and willingness are checked, The feeling and concrete request are actually communicated or explicitly rehearsed, The preferred kind of response is stated, A refusal or different response can be accepted without pressure]
      - title: "Clarify what was understood and agree only what is mutual"
        instructions: "Ask what the listener understood if they are willing, or summarize the practical answer you received and invite correction. In the example, earlier notice when possible differs from a promise that plans never change. Acknowledge any part you expressed unclearly and restate it once without escalating. Record what was shared, what response actually occurred, what was mutually agreed and what remains private or unresolved. Check whether the exchange replaced withdrawal, hostility, performance or control with clearer communication. Do not equate being heard with having every request granted."
        checks: [Understanding is checked without demanding a particular emotional response, Any agreement is specific and mutual, Unclear wording can be corrected proportionately, Being heard is distinguished from having a request granted]
    adaptation: "Use text, sign, AAC, an interpreter or a culturally suitable indirect opening that still makes the request understandable. A trusted communication partner may help convey your words without deciding your feelings. Rehearsal is valid preparation; actual disclosure remains untested until a suitable exchange occurs."
    review: "Did you say what mattered in a form the listener could understand and freely respond to? Keep the useful wording, clarify one ambiguity or choose a different support route. Disclosure itself does not establish intimacy or trustworthiness."
    examples:
      supportive: "The person asked for a short conversation, named disappointment and requested earlier notice; both agreed on a practical message when plans changed."
      mixed: "The feeling was understood but earlier notice could not always be promised, so the person retained that limit and considered their own planning options."
      contradictory: "The disclosure demanded agreement, exposed unwanted private details or used tears and accusations to override the listener's refusal."
      inconclusive: "The person rehearsed the statement alone and accurately recorded preparation, with no claim of being heard by another person."
  '07.10':
    title: "Respond to a failure with care and a standard you can act on"
    goal: "Offer a humane response to suffering while preserving responsibility, reasonable consequences and a concrete renewed effort."
    scope_note: "One ordinary failure response explores self-compassion with accountability. Kind language alone is not repair, and meeting a standard is not a measure of human worth."
    setup: "Use a manageable disappointment or this case: you missed a promised contribution because you took on more than you could realistically do. Someone else had to adjust their plans. You feel like either abandoning the commitment or working without rest to make up for it. Use a private note and the actual agreed requirement if available."
    burden: "About 15 minutes of reflection, one feasible repair or work step and a later check of the revised commitment."
    actions:
      - title: "Write a caring response that does not erase the consequence"
        instructions: "Address yourself as you would a person whose dignity matters and whose conduct still has effects. Write three sentences: this is difficult because; the specific responsibility I own is; and this failure does not establish a verdict on my whole person. For the case, acknowledge disappointment and overload while retaining the missed promise and the other person's inconvenience. Remove both punishment such as I must not rest until I deserve it and indulgence such as nobody should expect anything from me. If the obligation was impossible or coercive, examine that fact rather than automatically accepting its standard."
        checks: [Suffering is acknowledged in specific humane language, Real responsibility and impact remain visible, Punishment and blanket absolution are both identified, The standard is checked for legitimacy and feasibility]
      - title: "Define the smallest repair that still respects the real standard"
        instructions: "Specify what needs correction, what acceptable work would contain, what support or reduced scope is needed and which consequence cannot simply be undone. In the case, contact the affected person with a realistic deliverable and date, ask whether it is still useful and acknowledge that their earlier inconvenience remains. Do not promise impossible extra work to purchase relief from guilt. If the original contribution is no longer useful, ask about an appropriate correction rather than completing it solely to feel redeemed. Keep the standard observable, such as supplying the two agreed missing sections, instead of proving you are hardworking."
        checks: [The repair targets an actual impact or unmet requirement, Acceptable work is concretely defined, Capacity and needed support shape the revised commitment, Unavoidable consequences are not denied]
      - title: "Attempt the repair and assess whether your inner response supported action"
        instructions: "Do the first feasible part of the agreed correction, or work through a small example if the case is fictional. Record what was completed, what remains and whether you used care to support effort or to avoid the standard. At the next agreed checkpoint, compare the actual work with the stated requirement. If it still falls short, revise scope, obtain help or communicate the delay rather than using self-attack as a substitute for action. A reassuring sentence can be retained, but only the actual behavior shows whether renewed effort occurred."
        checks: [A feasible correction or explicit worked example is attempted, Completed work is compared with the stated requirement, Care is assessed by its relation to responsible action, Further shortfalls prompt communication or revision rather than punishment]
    adaptation: "Use voice notes, a trusted helper or a smaller legitimate scope. Rest and support can be part of a responsible plan; they do not have to be earned through distress. This exercise does not adjudicate employment, care or legal obligations."
    review: "Did the response make repair more possible while retaining the consequence and a realistic standard? Keep the sentence or support that helped and revise one overcommitment. Feeling better and performing better remain separate observations."
    examples:
      supportive: "The person acknowledged overload and the missed promise, agreed a useful smaller deliverable and completed it without a punitive catch-up schedule."
      mixed: "The kinder response supported a first work step, but the revised date was still unrealistic and had to be renegotiated."
      contradictory: "Self-compassion was used to deny the effect on others, or accountability became deprivation and an impossible promise of perfection."
      inconclusive: "An encouraging statement was written without identifying responsibility, a legitimate standard or any attempted correction."
  '07.11':
    title: "Hold a hard fact alongside a present good and a realistic possibility"
    goal: "Practice appreciation, receptivity to joy and enoughness while building a realistic next possibility that does not deny hardship or meaningful ambition."
    scope_note: "A brief everyday exercise explores hopeful attention and action. It is not a requirement to feel happy, a treatment for low mood or a claim that optimism changes external constraints."
    setup: "Use an ordinary difficult week or this case: a desired opportunity is unavailable, but an existing activity and one supportive connection remain. Have a private note and choose an accessible ordinary good such as music, daylight, a familiar object or a welcome conversation. Nothing needs to be bought."
    burden: "About 10 minutes to prepare, a short period with the chosen good and one modest next action over the following days."
    actions:
      - title: "State the hard fact and a future possibility without guarantees"
        instructions: "Write the unpleasant fact without softening it, then distinguish what is known, what is unknown and what remains possible. For the case, this opportunity is unavailable is known; nothing worthwhile will ever be available is a forecast. Identify one realistic path and one obstacle, such as improving an existing piece of work while acknowledging limited time. Define hope here as a reason to take a useful next step under uncertainty, not certainty of success. Keep disappointment visible beside the possibility rather than replacing it with a compulsory positive interpretation."
        checks: [The unpleasant fact is stated plainly, Known facts and forecasts are distinguished, A realistic possibility includes a concrete obstacle, Hope is not presented as a guarantee or denial of disappointment]
      - title: "Attend to a present good without demanding a particular feeling"
        instructions: "Spend a brief comfortable period with the chosen accessible good. Notice two concrete qualities, such as a phrase in the music and the memory it evokes, rather than grading how joyful you are. If appreciation, pleasure, neutrality or sadness appears, record it without forcing a replacement feeling. Acknowledge another person's contribution if relevant and freely appropriate, but do not turn gratitude into debt. Then name what is enough for this moment, such as enjoying one song without searching for a better one; enoughness here does not require abandoning a valued longer-term ambition."
        checks: [An accessible present good receives actual attention, Two concrete qualities are noticed, Neutral or difficult feelings remain acceptable, Enoughness is distinguished from abandoning meaningful ambition]
      - title: "Take one realistic step and set a proportionate stopping point"
        instructions: "Choose and attempt a small action along the possibility identified earlier: revise one paragraph of existing work, request factual information about a future opportunity or arrange a welcome conversation. Define a stopping point before starting so the action does not become an attempt to outrun disappointment. Record the actual result and whether the obstacle changed. End by retaining both one present good and one unresolved fact. If no positive feeling followed, do not mark the whole exercise as a failure; review whether attention and action were honest and chosen."
        checks: [A concrete step toward the realistic possibility is attempted, A proportionate stopping point is used, Actual results are separated from hoped-for results, A present good and an unresolved hard fact can coexist]
    adaptation: "Use a sensory or social form that is accessible and welcome; solitary appreciation is sufficient. No purchase, spiritual belief or public gratitude statement is required. If persistent low mood or loss of interest affects functioning, seek qualified support rather than escalating a positivity exercise."
    review: "What could you appreciate without denying the hard fact, and which future step was justified by reality? Keep enoughness for the present alongside a chosen ambition. This record does not establish improved mental health."
    examples:
      supportive: "The unavailable opportunity remained disappointing, but the person attended to a familiar song and completed a bounded revision of existing work."
      mixed: "The present activity brought no pleasure, yet the person recorded that honestly and took a realistic information-seeking step."
      contradictory: "The person used gratitude to dismiss hardship or promised inevitable success while ignoring the actual obstacle and their limits."
      inconclusive: "Positive slogans were collected without attending to a present good, facing the hard fact or attempting a realistic next step."
  '07.12':
    title: "Use a setback to redesign and retry one meaningful attempt"
    goal: "Separate facts, responsibility, lessons, support and recovery needs, then make and evaluate a concrete adjustment after a setback."
    scope_note: "One revised attempt practices adaptation. It does not require enduring a harmful goal, overcoming structural barriers alone or interpreting every disruption as personal failure."
    setup: "Use a modest real setback, or perform this supplied exercise: in two minutes draft a clear invitation containing a purpose, time, place or access route, and a way to reply. Check it against those four requirements. If nothing is missing, use the case variation that the proposed time is unavailable; do not claim your first draft failed."
    burden: "About 20 minutes to reconstruct and redesign, one bounded retry and a short review."
    actions:
      - title: "Reconstruct the setback without collapsing every cause into blame"
        instructions: "Describe the intended result, what actually happened and the evidence for the gap. Sort contributing factors into choices you controlled, constraints you did not control and questions still unresolved. For the invitation, an omitted reply route differs from a recipient's unavailable time. Name your actual responsibility and one recoverable lesson without attributing motives to others. Add what recovery requires before a useful retry, such as a break, clarification or reduced scope. Do not make exhaustion, shame or immediately working harder the price of showing resilience."
        checks: [The intended and actual outcomes are concretely compared, Controlled factors constraints and unknowns are separated, Responsibility and a usable lesson are stated proportionately, Recovery needs are included before the next attempt]
      - title: "Change the mechanism that contributed to the setback"
        instructions: "Select one adjustment with a reason it addresses the observed gap. In the invitation example, use a four-item check before sending if information was omitted; ask about availability before proposing a single fixed time if timing was the problem. Identify useful support, such as a willing reader checking clarity, and ask only if needed. Define the next experiment's outcome before attempting it: all four details are understandable, or a mutually available option is identified. If the original goal is no longer worthwhile or safe, explain a reasoned change rather than repeating it to prove perseverance."
        checks: [The adjustment addresses an observed cause rather than generic effort, Support is considered as a legitimate resource, The retry has a concrete outcome criterion, Continuing the original goal is checked for suitability]
      - title: "Retry with the adjustment and compare the actual outcomes"
        instructions: "Carry out the revised attempt. For the supplied exercise, produce a new invitation and check each required detail; if using the unavailable-time variation, write a message offering two feasible alternatives and a way to suggest another. A private draft tests completeness, not whether anyone attends. Compare the new outcome with the first, including any remaining defect. Retain the adjustment, change it again or close the goal for an explicit reason. Record the renewed attempt itself separately from success, so an informative second setback is not hidden."
        checks: [A revised attempt is actually performed, The stated criterion is applied to its result, Draft quality is distinguished from real-world uptake, Remaining defects inform a concrete next decision]
    adaptation: "Use dictation, an accessible checklist or a willing helper. A small supplied writing task is a valid adaptation exercise but does not reproduce resilience after major loss. Do not create a stressful failure or withhold support to make a retry harder."
    review: "Which adjustment changed the result, what support or recovery mattered and what remains outside your control? Keep, revise or end the approach with reasons. Persistence alone is not proof that a goal is wise."
    examples:
      supportive: "A missing reply route was identified, a four-part check was added and the second invitation contained all necessary information."
      mixed: "The revised invitation was complete but no shared time was available; communication improved while the real-world constraint remained."
      contradictory: "The person repeated the same approach with more pressure, blamed themselves for another person's availability or ignored the need for recovery."
      inconclusive: "A lesson about trying harder was written without a specific adjustment or a renewed attempt."
  '07.13':
    title: "Build and rehearse a practical route to the right kind of help"
    goal: "Recognize when self-help is insufficient, distinguish different professional and community roles, and make a support plan that can be used when functioning or safety is affected."
    scope_note: "This is literacy and support preparation, not diagnosis or a clinical risk assessment. A completed plan does not demonstrate that help was accessed, and urgent need must never wait for the exercise to finish."
    setup: "Read the NIMH Do I Need Help reference and official service information for your actual location. Use three fictional cases: an ordinary difficult day with daily tasks intact; persistent distress disrupting sleep and usual tasks; and someone saying they may hurt themselves now. Keep only service details and a short request in the practice record, not private symptom narratives or another person's disclosures."
    burden: "About 30 minutes to read and check practical routes, then a short non-emergency rehearsal. An actual urgent need takes immediate priority."
    actions:
      - title: "Match the level and kind of need to an appropriate support role"
        instructions: "For each case, state what is known about functioning and safety, what is unknown and why self-help may or may not be enough. Use NIMH to check that worsening or persistent distress and interference with daily life warrant professional attention, while thoughts of self-harm need immediate help. Do not interpret a duration example as a requirement to wait. Distinguish medical assessment for health concerns, psychological care for mental-health difficulties, spiritual support for freely chosen belief-related questions, legal advice for rights or disputes and emergency help for immediate danger. Spiritual or legal help may complement care but cannot replace urgent clinical support."
        checks: [Functioning and safety guide the three case dispositions, Unknown facts are not converted into diagnoses, All five support roles and their limits are distinguished, Urgent help is not delayed by a duration threshold or worksheet]
      - title: "Check that a support route is usable in the person's actual circumstances"
        instructions: "Create a private card with a routine qualified-care route, an urgent mental-health route and a life-threatening-emergency route for your location. Verify each on the provider's or public service's official page, recording contact method, hours, eligibility, cost information or unknown, and available accessibility or language options. Add a fallback if the first route is closed or unavailable. In the US, NIMH identifies 988 for suicide or emotional-crisis support and 911 for life-threatening emergencies; do not assume those numbers apply elsewhere. Identify a suitable spiritual or legal resource only if relevant, and record its distinct scope."
        checks: [Routine urgent and emergency routes are location-specific, Official information is checked for contact hours and eligibility, Access cost or language uncertainties remain visible, A fallback exists without substituting an unqualified role for urgent care]
      - title: "Rehearse a concise request and identify what would trigger actual contact"
        instructions: "Use the persistent-distress case to say or write: I am having difficulty with usual tasks and would like an assessment; how can I arrange an appropriate appointment? Add one access requirement and ask what to do if the service cannot help. Walk through the urgent case by locating the verified urgent or emergency route immediately; do not place a test call to an emergency service. For a real current need, use the appropriate service rather than stopping at rehearsal. Record only whether contact was attempted, reached or still unavailable, and the next practical step; do not award a successful handoff for having a phone number."
        checks: [A concise help request is actually rehearsed or appropriately used, An access requirement and unavailable-service fallback are included, Emergency services are not contacted for a practice drill, Preparation contact and successful access remain distinct]
    adaptation: "Use text, relay, interpretation or a trusted helper where the service supports it, with the person's permission and privacy preserved. If no local route can be verified, mark the plan incomplete and seek official service navigation. Immediate danger requires local emergency help; self-harm thoughts or urges warrant immediate crisis support."
    review: "Could the card be used under stress, and which access uncertainty still needs resolution? Keep official details current and leave an unsuccessful contact visible. This exercise does not certify a person to assess someone else's safety or replace professional judgment."
    examples:
      supportive: "The person verified local routine and urgent routes, rehearsed an assessment request with an access need and identified a fallback without making a test emergency call."
      mixed: "A suitable provider was found, but cost and language access remained unknown; the plan kept those questions and another verified route."
      contradictory: "Persistent impairment was treated as a motivation problem, or a person in immediate danger was told to finish the plan before seeking help."
      inconclusive: "A generic hotline list was copied without checking location, availability or the difference between having a contact and reaching help."
  '07.14':
    title: "Test two regulation options across ordinary contexts and notice their limits"
    goal: "Practice more than one response strategy across naturally occurring triggers, relationships and settings, and identify when a strategy needs adjustment or qualified support."
    scope_note: "This small transfer test examines everyday strategy use, not treatment for chronic dysregulation or proof that skills generalize to severe stress. No trigger or conflict should be manufactured."
    setup: "Choose two already tolerable options: briefly leave a message unsent and reread it before responding; and state a concrete need or ask for a short break with a return time. Keep a private three-row note with context, trigger, stress level in words, strategy, action and result. Use ordinary situations only and preserve any existing care plan."
    burden: "About 15 minutes to prepare and three naturally occurring opportunities over one or two weeks, with a brief note afterward. Missing opportunities remain pending."
    actions:
      - title: "Prepare two strategies and the conditions in which each fits"
        instructions: "Describe how to perform both options and where they are suitable. An unsent-message pause fits a non-urgent written exchange; a direct need or agreed break fits a reasonably safe interaction where clarification can help. Name an early cue for each, such as starting to type an accusation or noticing an urge to interrupt. Define signs that an option is not helping: repeated rereading becomes stuck rumination, or a requested break becomes indefinite avoidance. Identify a fallback, such as ending the optional exchange, using another accessible format or seeking suitable support."
        checks: [Two strategies have concrete performance instructions, Their suitable contexts and early cues are specified, A recognizable limit is stated for each option, A fallback preserves access safety and a route back when appropriate]
      - title: "Use both options during naturally different ordinary opportunities"
        instructions: "At two suitable opportunities, use each strategy at least once. Record the trigger, setting, relationship if any, ordinary stress level and the sequence from cue to chosen action. Aim for a genuine difference, such as a written coordination message and a spoken conversation, rather than claiming two identical drafts demonstrate broad transfer. Note whether the response clarified the issue, delayed it appropriately or failed to help. If all suitable events are very low stress, record that narrow range; do not create higher stress or provoke another person to fill the record."
        checks: [Both strategies are actually attempted in suitable ordinary situations, Trigger setting relationship and stress context are recorded, At least one genuine context difference is identified, An unobserved stress range is not claimed as tested]
      - title: "Try a third opportunity and revise a strategy that reaches its limit"
        instructions: "At another naturally occurring event, choose the option that fits the context and record why. If it stops helping, use the prepared fallback and note the observable sign rather than repeating it more intensely. Compare all three records for differences in triggers, relationships, settings and stress levels. Identify one supported transfer claim, one untested context and one revision or question for qualified help if difficulties persist or impair functioning. If the third event never occurs, retain the two observations and leave this transfer check pending. A strategy's failure in one setting is information, not proof of personal failure."
        checks: [A third actual opportunity informs strategy choice, Any observed limit leads to an appropriate fallback or revision, Transfer claims are restricted to recorded contexts, Persistent impairment prompts qualified support rather than escalating self-help]
    adaptation: "Use accessible written, spoken or supported communication instead of a specific format. If no suitable live contexts occur, rehearse an ordinary message and conversation privately; label both rehearsals and leave real-world generalization untested. Severe or persistent dysregulation calls for qualified care, not a harder practice challenge."
    review: "Which strategy worked where, where did it stop helping, and which contexts remain unknown? Keep a conditional choice rather than a universal favorite. Three ordinary attempts cannot establish recovery or reliable use during crisis."
    examples:
      supportive: "A message pause and a direct request were used in different ordinary situations; a third event revealed that repeated rereading was unhelpful, so the person used a clear return plan."
      mixed: "Both strategies helped at low stress with familiar people, but no unfamiliar or higher-stress context occurred and those limits remained explicit."
      contradictory: "The person provoked conflict to test a skill, intensified an unhelpful strategy or claimed low-stress rehearsals proved crisis competence."
      inconclusive: "Two strategies were described but no real use was recorded, so generalization across everyday situations remains untested."
