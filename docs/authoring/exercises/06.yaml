schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '06'
exercises:
  '06.01':
    title: "Receive one useful act of help while keeping your own voice"
    goal: "Recognize ordinary vulnerability and interdependence, express a real need, and receive bounded help without treating dependence as a loss of dignity."
    scope_note: "One everyday exchange explores bodily fragility, emotional exposure, dependence and uncertainty. It does not reproduce disability or prove how someone would respond during a crisis or prolonged dependency."
    setup: "Choose a real, modest uncertainty such as understanding a public timetable or an unfamiliar set of ordinary instructions. Ask a willing person for clarification only if you need it. Use paper, dictation or a private note; do not create a difficulty, withhold an existing support or disclose sensitive history to make the exercise possible."
    burden: "About 10 minutes to prepare, one brief exchange, and 10 minutes afterward."
    actions:
      - title: "Locate the need inside an ordinary network of support"
        instructions: "Trace one normal day through five questions: what does your body need; where could misunderstanding or rejection matter; whose work or assistance makes the day possible; what remains uncertain; and what could you not provide entirely alone? Use ordinary examples such as rest, a question to a stranger, reliable transport and accessible information. Then identify the actual uncertainty selected in setup. Separate the useful statement I need this explained from a global verdict that needing help makes you incapable. Name one choice you still want to make yourself."
        checks: [Five dimensions of ordinary vulnerability are considered, A real limited need is named, Dependence is separated from a judgment of worth, One retained choice is identified]
      - title: "Ask for a specific contribution with a real option to decline"
        instructions: "Use this request, adapted to the actual question: I am unsure which instruction applies here; would you explain that part, or is now inconvenient? State the exact part you need help with, the form that works for you, and what you will decide afterward. Let the person decline or offer a different time. Avoid apologizing for your existence, demanding reassurance or promising an unlimited return favor. If the first person cannot help, consider an appropriate information service or leave the need unresolved rather than inventing a successful exchange."
        checks: [The request names the needed contribution, The helper can freely decline, The preferred form of help is communicated, Any agreement preserves the retained choice]
      - title: "Receive the help and distinguish assistance from takeover"
        instructions: "If help is agreed, listen or read, ask a clarifying question if needed, and use the explanation to make your own next decision. Acknowledge the specific assistance in a proportionate way. Review what became possible, what remains uncertain, and whether you or the helper took over a choice that was not offered. If an unwanted extra step was proposed, state that the agreed clarification is enough. Keep an unsuccessful request visible; preparing or asking alone does not demonstrate receiving help."
        checks: [Agreed help is actually received, Its practical effect is identified, Unoffered choices remain with the person receiving help, Appreciation does not create unlimited obligation]
    adaptation: "Use text, sign, an interpreter or a trusted communication partner as appropriate. Asking for accessible information is legitimate help. If no suitable exchange is available, rehearse the supplied request and label it rehearsal; defer the receiving action. No personal disclosure or performance of helplessness is required."
    review: "What assistance was useful, which choice remained yours, and what did the exchange reveal about ordinary dependence? Decide whether the need is met, another clarification is needed, or this source of help is unsuitable. Neither receiving nor providing help establishes greater human worth."
    examples:
      supportive: "A person asked about an unfamiliar timetable, received a clear explanation, chose their own route and thanked the helper without promising a favor."
      mixed: "The explanation was useful, but the helper also began making unrelated plans; the recipient clarified what help was actually wanted."
      contradictory: "The recipient felt obliged to accept an unwanted decision because receiving any help was treated as surrendering the right to choose."
      inconclusive: "The request was drafted but no exchange occurred, so the record supports preparation rather than receiving assistance."
  '06.02':
    title: "Recognize possible trauma effects and prepare a suitable support route"
    goal: "Understand possible trauma-related responses, distinguish observations from diagnoses, and prepare to seek qualified help without forcing disclosure or exposure."
    scope_note: "This is literacy and support preparation using a fictional case. It is not a symptom screen, diagnosis, trauma narrative, memory-recovery exercise or treatment."
    setup: "Read the NIMH PTSD overview through the reference. Use this fictional case: following a frightening accident, someone startles at noises, has unwanted recollections, avoids a familiar route and finds it harder to trust others. No account of the accident is needed. Do not substitute an active personal trauma for this case."
    burden: "Three sessions of up to 15 minutes, with reading split or deferred as needed."
    actions:
      - title: "Explain eight concepts without diagnosing the case"
        instructions: "Make a short glossary: threat means perceived danger; avoidance means steering away from reminders; intrusion means unwelcome recollections or images; dissociation can involve feeling detached or unreal; shame concerns negative judgment of oneself; hyperarousal means being persistently on guard; memory difficulties can include gaps or trouble concentrating; attachment concerns security and trust in relationships. Match only the case's stated observations to possible concepts and mark the rest unknown. Consult the NIMH account to check the symptom-related terms. These experiences can have different causes; neither a matching word nor an absent sign decides a diagnosis."
        checks: [All eight concepts receive a plain-language explanation, Case observations are kept separate from inferred causes, Unstated experiences remain unknown, Clinical diagnosis is reserved for a qualified assessment]
      - title: "Compare a supportive response with pressure to perform recovery"
        instructions: "Write a two-sentence response to the fictional person: You do not have to describe the accident to me. Would help finding a clinician or practical support with an ordinary task be useful? Contrast it with being told to retell the event, confront reminders alone or recover on someone else's timetable. Explain how choice, predictability and control over disclosure alter the interaction. Identify a peer's role in listening or practical help and the clinician's role in assessment and treatment. Do not test reactions to reminders or ask anyone to recount a traumatic event."
        checks: [The response gives a choice about support, Disclosure is optional and limited, Pressure or unsupervised exposure is explicitly rejected, Peer support and clinical treatment have different roles]
      - title: "Find an actual professional entry point and prepare questions"
        instructions: "Use the linked NIMH help page or an official health-service directory for your location to locate a real route to a clinician experienced with trauma. Record the service name, public contact route, area served and what eligibility or cost information still needs checking. Prepare these questions: how do you assess fit; how is consent handled during treatment; and what choices are available if a method is unsuitable? No appointment or disclosure is required for this preparation. If there is a current urgent concern, use qualified or emergency help now rather than finishing the exercise; in the US, 988 offers crisis support and 911 is for life-threatening emergencies. Elsewhere use local services."
        checks: [A real service has a retrievable contact route, Eligibility and unknown access conditions are recorded, Questions address expertise consent and alternatives, Preparation is distinguished from obtaining assessment or treatment]
    adaptation: "Use a short spoken glossary or a reader's help with public information. Skip distressing detail and retain the fictional case. This is not exposure practice; a professional can advise on appropriate personal work. If the topic is destabilizing, stop and seek suitable support rather than recording endurance as success."
    review: "Can you explain what might be happening without claiming to know its cause, and identify a usable next support step? Preserve unanswered access questions. Success here is informed preparation and appropriate boundaries, not reduced symptoms or demonstrated recovery."
    examples:
      supportive: "The case was described without a diagnosis, missing experiences stayed unknown, and a local clinical entry point and consent questions were identified."
      mixed: "The glossary was accurate but the selected service had unclear eligibility, so access remained a question to resolve."
      contradictory: "A learner declared PTSD from the short case or proposed forcing a return to the feared location as a test of progress."
      inconclusive: "Symptom words were copied but neither their meaning nor a real professional entry point was established."
  '06.03':
    title: "Build a choice-preserving support plan after a violation"
    goal: "Identify protective supports and survivor-chosen steps that address safety, agency, trust, bodily ownership, boundaries and meaning without blaming the harmed person."
    scope_note: "The supplied case supports planning and response rehearsal. It does not demonstrate recovery from assault, abuse, coercion or betrayal, and it does not authorize investigating harm or confronting a suspected perpetrator."
    setup: "Use this fictional case: a trusted person shared private correspondence after repeatedly pressuring its owner; the owner wants privacy and support but does not want physical comfort or a detailed retelling. Do not invent additional violence. Read RAINN's explanation of its approach to choice and support as one provider's example, not as a service for every kind of betrayal."
    burden: "About 20 minutes for the plan, a short private rehearsal, and 10 minutes to check a support route."
    actions:
      - title: "Give each area of recovery a concrete protective option"
        instructions: "Create six entries for the fictional person: safety may require advice about further access to private material; agency means choosing the next step; trust can begin with a limited agreed task; bodily ownership means asking before touch; boundaries define what information may be shared; meaning can include an ordinary valued activity without a redemptive explanation. For each, write what the person can choose and what a supporter must ask before doing. Separate the violator's responsibility from the harmed person's options now. Safety planning for ongoing abuse belongs with an appropriate trained service, not a generic instruction to confront or abruptly leave."
        checks: [Six recovery areas have concrete protective options, Choices remain with the harmed person, Harm is not attributed to insufficient resilience or prevention, Ongoing danger calls for appropriate professional safety support]
      - title: "Rehearse support without taking control of the account"
        instructions: "Privately practice this opening: What happened to your privacy matters; you can choose what to tell me. Would you prefer company, practical help finding support, or space? Then rehearse the person declining touch, declining details and accepting help finding a service. Respond to each choice directly. Do not add a demand to forgive, reconcile, report, explain a lesson or prove credibility to you. State that confidentiality has limits where immediate safety or applicable reporting duties require help; avoid promises you cannot keep. No message is sent and no real person's story is solicited for the rehearsal."
        checks: [The opening acknowledges the particular violation, Three different preferences receive respectful responses, Forgiveness reporting and reconciliation are not imposed, Confidentiality is described without an absolute promise]
      - title: "Make one protective support option usable"
        instructions: "Choose one need from the plan and locate a relevant public service: a survivor-support organization for sexual violence, an abuse-support service for coercion, a qualified clinician, or an appropriate privacy or advocacy service for the supplied case. Check what it actually offers, who can use it and how someone can ask about privacy before sharing details. Add a draft request limited to the help wanted. For an actual manageable situation, any contact is the affected person's choice and may require a safer device or channel advised by the service. A saved public route is preparation; it is not a completed recovery step for someone else."
        checks: [The service fits the specific support need, Its scope and access conditions are checked, The draft request discloses only necessary information, The record distinguishes preparation from chosen live contact]
    adaptation: "Keep the exercise fictional or work with a qualified support person. Use a neutral written response if speech or role-play is uncomfortable. Do not ask a survivor to supply training material, remove their supports or document private evidence here. Immediate danger requires local emergency help rather than finishing this plan."
    review: "Which concrete choice does each part of the plan protect? Where could helpful intent become pressure or takeover? Keep unresolved safety and access questions visible, and name the next appropriate support step without assigning a recovery deadline."
    examples:
      supportive: "The plan covered privacy, bodily choice and trust, and the rehearsal accepted a refusal of touch while identifying an appropriate support route."
      mixed: "The supporter respected the person's wishes but initially selected a service outside its stated scope; the mismatch was recorded and corrected."
      contradictory: "Help was made conditional on reporting, reconciliation or a detailed account, or blame was placed on the person whose boundary was violated."
      inconclusive: "The plan contained general encouragement but no specific choice, protective option or usable support route."
  '06.04':
    title: "Plan a meaningful day with room for changing capacity"
    goal: "Adapt ordinary commitments around fluctuating symptoms, treatment and uncertainty while communicating limits and preserving valued identity beyond illness."
    scope_note: "This is practical scheduling and communication, not a treatment or exercise prescription. A fictional plan demonstrates preparedness; personal adaptation requires an actual usable trial within existing care guidance."
    setup: "Use an ordinary upcoming day if you already manage variable capacity, or this fictional day: a person has an established care appointment, a household task and a valued conversation, but cannot predict how much energy will be available. Do not invent a diagnosis or alter care. Read the CDC ME/CFS reference for a specific reason that pushing activity can be unsuitable; its disease-specific guidance is not universal."
    burden: "About 20 minutes to prepare, one ordinary day or fictional walk-through, and a short later review that allows delayed effects to be noticed."
    actions:
      - title: "Write a day plan that can change without becoming a failure"
        instructions: "List essential care commitments under the existing plan, necessary daily needs and one personally meaningful connection or interest. For each ordinary activity, describe a usual form, a reduced form and a way to defer or ask for help. In the supplied case, the conversation could be a short text instead of a visit; the household task could be delegated rather than caught up later. Keep the care appointment or ask the service how to adjust it instead of deciding medical priorities yourself. Leave room for uncertainty rather than assigning an invented energy score or promising what a good morning will permit."
        checks: [Existing care commitments are preserved or referred to the care team, Ordinary activities have reduced or supported alternatives, A valued interest or relationship remains visible, The plan allows uncertainty without invented capacity scores]
      - title: "Communicate the limit before an obligation silently expands"
        instructions: "Prepare a concrete message for one affected person: I would like to stay connected; today I can offer a short message, and I cannot commit to a visit. Can we use that form and revisit the plan later? State the limit, the valued purpose and the offered alternative without supplying medical details or promising to compensate through overexertion. In a real context, send or say it only to the appropriate person. For the fictional case, rehearse both acceptance and disappointment; acknowledge the other person's needs while retaining the limit."
        checks: [The message specifies a current limit and valued purpose, A feasible alternative is offered, Unnecessary medical disclosure is avoided, The response does not create an obligation to overcompensate]
      - title: "Use the flexible plan and review immediate and later effects"
        instructions: "Follow the appropriate version during the ordinary day, or walk through the fictional day with this change: capacity is lower than expected before the conversation. Record which choice changed, what support was used and what happened to the valued purpose. For a personal trial, leave room to notice later effects before deciding the activity was sustainable; follow existing clinical advice and seek it for new or concerning changes. Do not increase a quota because one occasion went well. Revise one scheduling assumption or keep the supported version."
        checks: [A changed-capacity situation is actually observed or explicitly simulated, The plan changes without abandoning the valued purpose by default, Immediate and delayed effects are distinguished where observed, Revision does not impose automatic activity increases]
    adaptation: "Use one activity, spoken choices or a trusted helper if planning itself is burdensome. Rest and receiving help can be appropriate choices. Keep medication, diet, rehabilitation and activity limits with qualified care. Do not use a healthy-person challenge, push through worsening symptoms or impose graded increases as part of this exercise."
    review: "Which part of the plan remained meaningful when capacity changed, and which assumption was too rigid? Keep any unobserved later effects unknown. Choose a sustainable revision or a question for the care team; ordinary planning cannot establish improved health."
    examples:
      supportive: "A person replaced a visit with an agreed short message, preserved established care and reviewed later effects before deciding whether the plan was sustainable."
      mixed: "The reduced activity fit the morning but its later effects were unclear, so the person kept that uncertainty and avoided increasing the commitment."
      contradictory: "A good morning was used to justify catching up on every task, or care was skipped to meet an activity target invented by the exercise."
      inconclusive: "A flexible schedule was written but neither an actual day nor the supplied changed-capacity scenario was examined."
  '06.05':
    title: "Prepare a pain-care conversation around sustainable participation"
    goal: "Distinguish pain treatment, management and adaptation, raise questions about uncertainty and feared activity, and prepare a sustainable participation plan with qualified care."
    scope_note: "This is care-conversation preparation and review of an existing plan. It does not diagnose pain, prescribe movement, decide which pain is safe, or test tolerance through deliberate provocation."
    setup: "Use the linked MedlinePlus chronic-pain overview and a private note. Start with this fictional concern: a person wants to join a regular conversation, but pain and worry about a flare make planning difficult. If using a personal example, use an ordinary activity already covered by your care guidance; keep treatment instructions unchanged."
    burden: "Two preparation sessions of about 15 minutes and one review after an ordinary permitted activity or the supplied fictional scenario."
    actions:
      - title: "Separate the pain experience from three different care goals"
        instructions: "Explain three aims in your own words: cure would resolve an underlying problem where possible; management seeks to reduce symptoms or their effects; adaptation changes how a valued activity is done. They can coexist without a promise that pain will disappear. For the fictional concern, separate the reported pain, the feared consequence of joining the conversation and what remains medically unknown. Describe pacing as planning activity and rest around individually appropriate limits, not a rule to do more each time. Neither fear nor normal-looking test results establish that pain is imaginary or that an activity is safe."
        checks: [Cure management and adaptation are distinguished, Reported pain feared consequences and uncertainty are separated, Pacing does not become an automatic increase rule, Pain is not treated as a measure of weakness or honesty]
      - title: "Prepare questions that a qualified care conversation must answer"
        instructions: "Make a short agenda with the valued activity, its practical difficulty and these questions: what needs further assessment; what existing activities and adaptations fit my situation; what changes should prompt contact; and when should the plan be reviewed? Include a question about fear of activity without asking a peer to decide whether to push through it. Identify the actual clinician or service to contact and any access difficulty. If there is no current care relationship, locate a qualified entry point rather than approving a plan yourself. Keep medication changes, tests and rehabilitation decisions outside this exercise."
        checks: [The agenda connects care questions to a valued activity, Uncertainty and contact conditions have explicit questions, A qualified service or existing clinician is identified, The exercise does not approve treatment or activity limits]
      - title: "Make the participation plan conditional on real care guidance"
        instructions: "Using existing guidance, specify an allowed form of the ordinary activity, available support, the agreed way to pause or stop and the next review. For the fictional case, compare a shorter remote conversation with a visit and identify what the person and care team would need to decide before either is called suitable. A personal trial occurs only within existing guidance and ordinary capacity; record what participation was possible and any concern to take back to care. An unanswered care question means the plan remains a proposal. Do not generate pain or remove useful aids to test a claim about avoidance."
        checks: [The plan identifies guidance or clearly states what is unapproved, Participation has an available supported form, Pause and review arrangements are explicit, Any actual result is distinguished from a fictional comparison]
    adaptation: "Use a helper to prepare the agenda, reduce writing or stay with the fictional concern. Follow individual guidance for fatigue or delayed worsening as well as pain. New severe or concerning symptoms require appropriate medical help, not an experiment. No physical challenge or medication change is part of completion."
    review: "What does the person want to participate in, which clinical question remains open, and what next contact or review is appropriate? Distinguish a useful care conversation from symptom relief, and an approved supported activity from an untested proposal."
    examples:
      supportive: "A person brought a specific participation goal to their existing care plan, used an already agreed shorter format and recorded a question for follow-up."
      mixed: "The agenda was useful but the activity limits were not yet clear, so the proposal remained unapproved instead of becoming a self-prescribed trial."
      contradictory: "Pain was dismissed as weak character, or the exercise was used to push through a feared activity without appropriate guidance."
      inconclusive: "The learner listed treatments but did not connect a valued activity to a qualified contact, a question or a conditional plan."
  '06.06':
    title: "Translate one access barrier into a specific participation request"
    goal: "Use medical, social and identity perspectives to understand disability, request an appropriate accommodation, and define success by chosen participation rather than unsupported performance."
    scope_note: "One access case illustrates distinct perspectives and a concrete request. It does not certify accessibility, determine legal eligibility, or assign a disability identity to anyone."
    setup: "Use a real event you want to access, or this supplied case: an advertised community talk mentions only stairs, long standing periods and spoken questions. A participant wants to understand the talk and contribute a question using a suitable format. Read the WHO disability overview. Do not simulate an impairment or remove an existing aid."
    burden: "About 20 minutes to examine the case, one request or draft, and a short review of the response or supplied variation."
    actions:
      - title: "Examine the same barrier through three different perspectives"
        instructions: "Write three short accounts. A medical perspective asks about relevant function, symptoms and individual care needs; a social perspective asks how stairs, standing and one communication format restrict participation; an identity perspective asks how the person understands and wishes to describe their own experience. Each can matter without one erasing the others. Identify the goal of understanding and asking a question, then choose one barrier to address. For a real case, use only information the affected person chooses to share; access needs do not authorize guessing a diagnosis or imposing a label."
        checks: [Medical social and identity perspectives are distinguished, A specific environmental or participation barrier is selected, The person's chosen goal is explicit, No diagnosis or identity is assigned from an access need]
      - title: "Write an access request with a concrete usable alternative"
        instructions: "Use this structure: I would like to participate in the talk. The standing-only format prevents that for me; can seating be available with the same view and a way to submit a question? Replace the barrier and requested change with the actual need. Ask who can confirm the arrangement and by when, and identify what remains unknown rather than assuming a promise. Offer a suitable alternative such as equivalent remote participation if it genuinely serves the goal. Drafting is sufficient for the supplied case; a real request is sent only with the affected person's agreement. Local rights and formal documentation requirements need appropriate local guidance."
        checks: [The request connects a barrier to a participation goal, The proposed change is specific enough to answer, Responsibility and confirmation timing are requested, Disclosure and any real contact remain the person's choice]
      - title: "Evaluate the arrangement against the chosen function"
        instructions: "Define success as access to the content and a usable way to ask a question, not standing for the entire event or appearing independent. Examine an actual response, or this variation: seating is offered but placed where the talk cannot be heard. State which barrier is reduced, what still blocks participation and what clarification is needed. If an appropriate arrangement is used, record the actual result; an organizer's assurance alone is not evidence that it worked. Retain the person's preferred description and consider whether another request or a different format is warranted."
        checks: [Success is defined by chosen function and values, A response or supplied variation is actually evaluated, Partial access is distinguished from effective participation, Any live result is distinguished from an assurance or draft]
    adaptation: "Dictate the request or use a chosen advocate while retaining the affected person's preferences. A person without a current access need can analyze the supplied case without pretending to have the experience. No disability simulation, forced disclosure, removal of accommodation or expensive purchase is required."
    review: "Which perspective helped reveal the barrier, what would confirm a usable change, and what remains unresolved? Excellence can include skilled use of support; this exercise cannot decide another person's identity, legal entitlement or overall ability."
    examples:
      supportive: "A request specified seating with a usable view and question format; the response was checked against those functions rather than mere attendance."
      mixed: "Seating was available but the audio was inaccessible, so the arrangement was recognized as partial and a further change was requested."
      contradictory: "The person was told to prove commitment by managing without an aid, or participation was celebrated while the actual access barrier remained."
      inconclusive: "The learner endorsed inclusion in general but identified neither a concrete barrier nor a request someone could answer."
  '06.07':
    title: "Design a cognitive support around an observed task difficulty"
    goal: "Recognize variation in attention, sensory processing, communication, executive function, learning and regulation, then test a support suited to a specific task without imposing a diagnostic stereotype."
    scope_note: "A small task comparison examines whether a support is useful in that context. It does not diagnose neurodivergence, measure intelligence or require suppressing harmless differences to look typical."
    setup: "Use the supplied instruction: choose a time for a short catch-up, identify one question to discuss, and note how a change of plan will be communicated. Use an existing comfortable note or communication tool. Read the W3C cognitive-accessibility reference for examples of varied needs and design barriers. No diagnosis or disclosure is required."
    burden: "About 15 minutes to map the task and two short ordinary uses with a 10-minute comparison."
    actions:
      - title: "Locate the obstacle before choosing a label or solution"
        instructions: "Examine six task demands: attention involves keeping the relevant step in view; sensory processing concerns distracting or uncomfortable input; social communication concerns interpreting an unclear request; executive function concerns starting, ordering and switching steps; learning concerns understanding and retaining the method; regulation concerns noticing overload and taking an appropriate pause. For each, record an observed difficulty, a useful support already present or unknown. Choose one specific mismatch, such as losing the next step in a long message. Do not infer an entire profile from a single difficulty or assume that a diagnostic label predicts everyone's strengths and needs."
        checks: [Six cognitive task demands are considered, Observation and unknowns remain distinct, One specific task mismatch is chosen, A difficulty is not turned into a diagnosis or global deficit]
      - title: "Create a support that changes the task rather than judging the person"
        instructions: "For the default mismatch, rewrite the instruction as three short entries labeled time, question and change of plan; add a visible next-step marker. If another mismatch was actually observed, choose one suitable alternative: reduce an unwanted notification, offer text instead of ambiguous speech, supply an example, or allow an agreed pause. State what the support is expected to make easier and keep other helpful supports in place. Do not aim for compulsory eye contact, stillness, faster work or concealment of an identity. If helping someone else, ask which change they want instead of assigning it from a label."
        checks: [The support addresses the selected mismatch, Its intended practical effect is stated, Existing useful supports are preserved, Affected people choose rather than receive a stereotyped intervention]
      - title: "Try the supported format and look for cost as well as benefit"
        instructions: "Use the supported format to prepare one ordinary catch-up plan, then use it again on another suitable occasion without removing the support to create a control condition. Compare with the earlier observed difficulty or existing notes: was the next step easier to find, did needed information remain, and did the support create extra work or distraction? If the original difficulty was not observed, record only whether the supplied format was usable. Keep mixed results and avoid a claim that one trial explains an entire cognitive profile. Retain, revise or stop the support based on the actual task and the person's preference."
        checks: [The support receives an actual task-based use, Benefit and burden are both examined, Comparison does not require removing needed assistance, The conclusion stays within the observed task and person]
    adaptation: "Use spoken, visual, tactile or assistive communication that already works for the person. One short use may be enough to identify a problem; do not create overload for evidence. A trusted helper can take notes with permission. Significant unmet needs may warrant qualified assessment, but an exercise does not require a diagnostic label."
    review: "What particular mismatch did the support address, what did it cost, and does the person want to keep it? Describe an observed function without romanticizing impairment, treating every difference as illness or claiming a general cognitive improvement."
    examples:
      supportive: "Three labeled entries made the next step findable during two ordinary plans, and the person chose to keep the format without a diagnostic claim."
      mixed: "The next-step marker helped but excessive reminders created distraction, so the reminder was removed while the useful structure stayed."
      contradictory: "A label was used to assign a stereotyped strength, or the trial rewarded appearing typical instead of making the task accessible."
      inconclusive: "A support was proposed but never used, or a profile was inferred from a difficulty that had not actually been observed."
  '06.08':
    title: "Agree on help that preserves consent during reduced capacity"
    goal: "Accept appropriate care during a season of reduced agency while communicating preferences and participating in decisions through an accessible form."
    scope_note: "One ordinary help agreement practices receiving care and retaining a voice. A rehearsal does not establish experience of illness, injury, grief, unemployment, aging or crisis. It is not a legal capacity assessment or medical consent form."
    setup: "Use an ordinary, genuinely needed offer of help or this fictional case: someone recovering under an existing care plan wants assistance arranging a grocery delivery but wants to choose the items and keep financial details private. Use a note, preferred communication aid or willing helper. Nobody needs to enact illness or intimate care."
    burden: "About 15 minutes to prepare, one short agreement or rehearsal, and a brief review."
    actions:
      - title: "Make the person's choices visible before assigning the helper's tasks"
        instructions: "Divide the activity into choices the person wants to make, practical work they want help with and information they want kept private. For the case, the person chooses items; the helper may explain or enter agreed delivery options; payment credentials remain private. State how the person communicates yes, no, uncertainty and a request for more time, using their usual reliable method. Ask rather than assume which choices they want help considering. Reduced speed, fatigue or use of a communication aid does not itself establish that the person cannot decide."
        checks: [Decision choices and practical assistance are separated, Privacy preferences are explicit, Yes no uncertainty and pause have usable communication forms, Reduced capacity is not automatically treated as loss of decision authority]
      - title: "Negotiate a bounded agreement that can be changed"
        instructions: "Use this opening: I would like help with the delivery options; I want to choose the items, and please check before changing anything. Agree on the task, timing, information the helper needs, the pause signal and a backup if the helper is unavailable. The helper states their own limits without threatening abandonment or demanding gratitude. Rehearse a change of mind, such as declining a substitution, and require a fresh check rather than treating the earlier agreement as blanket permission. Clinical or legal decisions need the relevant professional process; this ordinary agreement creates no such authority."
        checks: [The agreement identifies task timing and helper limits, Help is limited to what was agreed, A changed preference prompts a fresh check, Backup arrangements do not depend on coercion or unlimited access]
      - title: "Use the agreement and check whose decision actually prevailed"
        instructions: "Carry out the agreed ordinary help if the context is real. Otherwise rehearse this variation: the helper recommends a different item because it is convenient, while the person prefers the original. Resolve it through the person's accessible communication and the helper's genuine practical limits, not by assuming dependence settles the disagreement. Review whether help met the stated need, whether privacy was respected and whether the person could pause or revise the arrangement. If essential needs are unmet, seek an appropriate support service rather than treating self-sufficiency as the required solution."
        checks: [An actual exchange or explicitly labeled variation is examined, The person's stated preference affects the outcome, Privacy and the option to pause remain effective, Unmet essential needs lead to appropriate support rather than blame]
    adaptation: "Use accessible yes/no options, extra processing time, an interpreter or a chosen advocate without bypassing the person. No one is required to provide intimate care, disclose credentials or surrender an existing support. If decision-making ability is genuinely uncertain, use qualified local guidance instead of a peer verdict."
    review: "Did assistance make the person's chosen participation possible, and could they meaningfully revise or refuse it? Identify one improvement to communication or backup. Accepting care is compatible with dignity even when independent performance is not possible."
    examples:
      supportive: "The recipient chose the items, the helper handled agreed logistics, and a changed preference was checked without demanding private credentials."
      mixed: "The task was completed but the pause signal was missed, so the agreement was revised before another exchange."
      contradictory: "The helper overruled an expressed preference because providing care was treated as entitlement to decide everything."
      inconclusive: "A general offer to help was made without clarifying the person's choices, information boundaries or a usable way to change the agreement."
  '06.09':
    title: "Remove one concrete barrier from a piece of everyday information"
    goal: "Choose and test a tool, environmental adjustment, communication support or design change that makes a real participation task more accessible."
    scope_note: "A before-and-after information task demonstrates a bounded design change. It does not certify universal accessibility or establish that a particular assistive product suits every user."
    setup: "Use a private copy of an ordinary notice you control, or this fictional notice: Meeting tomorrow at the usual place; bring what you need and call if anything changes. The supplied facts are Tuesday at 18:00, library room 2, a notebook if useful, and questions accepted by text or speech through the organizer. Physical access has not been checked. Use an ordinary text editor, paper or an existing assistive tool."
    burden: "About 15 minutes to inspect, 15 minutes to revise, and a short comparison."
    actions:
      - title: "Identify the task and select the right kind of access change"
        instructions: "Try to answer five questions from the original notice: when, where, what to bring, how to ask a question and what access information is known? Mark missing or ambiguous information. Compare four kinds of response: an assistive tool such as text-to-speech; an environmental change such as a quieter place to read; communication support such as a plain written explanation; and a clearer default notice available to everyone. A personal accommodation answers an individual need, while an inclusive default can reduce the need to ask repeatedly. Choose the actual information barrier rather than a product to buy."
        checks: [The five information needs are checked against the original, Missing facts are distinguished from difficult presentation, Four types of access change are explained, The chosen change targets a concrete barrier]
      - title: "Produce a usable version without inventing access assurances"
        instructions: "Rewrite the notice with clear labels for day and time, place, materials and questions, using the supplied facts. State that physical access is unconfirmed rather than claiming the room is accessible. Put the necessary information in ordinary text, not only an image, color code or unexplained abbreviation. Keep a usable text or speech question route. If an actual user has requested a different format, obtain their preference and prepare that version within your authority. For personal assistive tools, preserve existing settings and supports; specialized fitting or clinical equipment needs an appropriate service."
        checks: [A revised notice is actually produced, Required facts appear in clear retrievable text, Unknown physical access is not falsely certified, Communication options and existing supports are preserved]
      - title: "Test whether the change solves the original task"
        instructions: "Answer the same five questions from the revised notice and compare with the original. Use your ordinary access method, or invite a willing person to try their preferred method without asking them to simulate an impairment or disclose a diagnosis. Check whether labels, reading order and the question route make sense in that method. Record which missing or hard-to-find answer is now available, what remains unresolved and whether the change adds a new obstacle. Improve one remaining issue or identify who can verify it. A self-check is not equivalent to testing with all intended users."
        checks: [The original five-question task is repeated, A concrete before-and-after difference is recorded, Remaining or newly introduced barriers stay visible, The scope of the actual access test is stated accurately]
    adaptation: "Use large text, speech, a screen reader, another familiar aid or a willing reader. Avoid purchasing equipment or changing a public notice without authority. If no personal barrier is present, the supplied ambiguity still permits an honest design task; do not impersonate a disabled user to create evidence."
    review: "Which answer became accessible because of the change, through which actual access method, and what still needs checking? Keep the improved version if useful and name one realistic follow-up. A clearer notice is a specific improvement, not proof that every participation barrier is removed."
    examples:
      supportive: "The revised notice made the exact time and question route findable, retained ordinary text and explicitly left physical access unconfirmed."
      mixed: "The words were clearer but a text-to-speech check exposed an ambiguous reading order, prompting another revision."
      contradictory: "A decorative image replaced usable text, or the organizer claimed full accessibility without checking the relevant barriers."
      inconclusive: "An accessibility tool was named but no notice was changed and the original information task was not repeated."
  '06.10':
    title: "Preserve dignity and connection when a valued role changes"
    goal: "Separate human worth from independence, productivity, cognition, appearance and usefulness, then choose conduct that sustains self-respect and relationship under limitation."
    scope_note: "The exercise examines a changed-role situation and one relational action. It does not require feeling positive about loss or prove adaptation to a permanent disability or cognitive change."
    setup: "Use this fictional case: a former community organizer can no longer manage events and fears being welcome only when useful. A small manageable personal role change is optional. Use a private note or spoken reflection; no painful personal history or public statement is required."
    burden: "About 15 minutes for the distinction, one modest relational step or rehearsal, and a 10-minute review."
    actions:
      - title: "Identify five conditions that must not become a price of belonging"
        instructions: "Consider five mistaken conditions: being independent enough, producing enough, remembering or reasoning quickly enough, looking a certain way, and being useful to others. For each, name a concrete respectful response that does not depend on meeting the condition: asking how help is wanted, including someone without an assigned job, allowing communication time, respecting appearance preferences, or offering company without repayment. In the case, distinguish the real loss of organizing ability from the unsupported claim that the person no longer deserves welcome. Let sadness or anger about the loss remain."
        checks: [Five conditional judgments of worth are examined, Each is paired with a concrete respectful response, Actual loss is distinguished from loss of human worth, Difficult feelings are not treated as a failed attitude]
      - title: "Offer or request connection without requiring a replacement achievement"
        instructions: "Choose a low-demand form of contact with a suitable person, or draft this for the fictional organizer: I would like to stay in touch as a participant; I cannot run the event, but I would welcome a short conversation if it suits us both. The other person's response can offer genuine company without immediately assigning a new useful role. Agree on timing, form and a way to decline or end the exchange. An actual message is sent only in an appropriate relationship; fictional drafting remains rehearsal. No one must earn connection by telling an inspiring story or displaying cheerful endurance."
        checks: [The proposed connection does not depend on a productive role, Limits and the desired form of contact are explicit, Both people can freely decline or end the exchange, Actual contact is distinguished from a fictional draft]
      - title: "Check whether respect survives the absence of improvement"
        instructions: "Review the actual exchange, or add this variation: the fictional organizer's limitation persists and communication takes longer than before. Ask whether the same welcome, privacy and opportunity to express preferences still apply. Identify any subtle bargain such as inclusion only if the person becomes useful again, improves quickly or hides their needs. Revise one phrase or arrangement that makes dignity conditional. Choose a sustainable way to remain connected, including supported communication or quiet company, while allowing grief and realistic limits to coexist."
        checks: [Continuing limitation is considered without a recovery requirement, A conditional bargain is identified or explicitly checked for, One phrase or arrangement is reviewed against equal dignity, Connection can continue through supported or nonproductive forms]
    adaptation: "Stay with the fictional case, use a trusted reader or express the choices through a familiar communication aid. Do not require memory tests, appearance changes, job replacement or proof of resilience. If personal reflection is too painful, defer it without interpreting that choice as a deficit in dignity."
    review: "What real loss needs acknowledgment, and what respect or relationship should not depend on recovering it? Identify one changed interaction or an unresolved need for support. No response to this exercise measures human worth."
    examples:
      supportive: "The former organizer was invited to participate without a job, and the arrangement allowed more time and a shorter visit without demanding improvement."
      mixed: "A warm invitation still assumed the person would resume organizing soon; the expectation was named and removed."
      contradictory: "Belonging was made conditional on usefulness, looking well or presenting the limitation as an inspirational success story."
      inconclusive: "The learner affirmed dignity in general but examined no conditional judgment or concrete relational choice."
  '06.11':
    title: "Prepare for a setback without erasing earlier progress"
    goal: "Recognize fluctuating capacity and recurrence, and maintain a practical plan for support, reduced demands and a considered return that respects existing care."
    scope_note: "This is a recurrence-plan exercise, not a relapse prediction tool or treatment protocol. It does not prescribe substance withdrawal, medication changes or a fixed recovery schedule."
    setup: "Use an existing clinician-supported plan if you have one, or this fictional record: a person resumed one valued routine with support, later needed more help again, and now wonders whether the earlier progress counted. No diagnosis or cause is supplied. A private note or accessible reminder is enough."
    burden: "About 20 minutes to prepare and one short later check of the plan's usability; no setback needs to occur."
    actions:
      - title: "Read the changing record without turning it into an all-or-nothing verdict"
        instructions: "Separate three observations: the earlier routine happened with support, current capacity has changed, and the reason or duration of the change is not yet established. State what the setback does show and what it does not prove about the earlier period. Distinguish a missed commitment, a familiar fluctuation already addressed in care and a new or concerning change that needs qualified advice. Do not label them interchangeable relapses. Identify an existing helpful support that can remain useful even when independent activity is reduced."
        checks: [Earlier and current observations are both preserved, An unknown cause or duration is not invented, Ordinary setbacks familiar fluctuations and concerning changes are distinguished, A useful continuing support is identified]
      - title: "Write a recurrence plan with concrete actions and contacts"
        instructions: "Make four entries: changes to notice under existing guidance; demands that can be reduced; a willing support person or qualified service; and how to revisit a valued routine. For the fictional person, reduce an optional meeting, ask the agreed helper to handle logistics, and contact the care team for new concerns rather than deciding a cause. Record a real public contact route and what to do if it is unavailable. Keep clinician-provided urgent instructions intact; an exercise cannot replace them. Substance-related recurrence or withdrawal concerns require qualified help rather than a home detox plan."
        checks: [The plan names observable changes without diagnosing them, Reduced demands and practical support are specific, A real support route and unavailable-contact alternative are recorded, Existing clinical and urgent guidance remains authoritative]
      - title: "Walk through the plan and make re-entry conditional on actual capacity"
        instructions: "Test the plan with this change: the usual helper is unavailable and the next optional commitment is tomorrow. Find the recorded alternative, decide which demand can wait and locate the appropriate qualified contact for a new concern. Then describe a possible return to the valued routine with an agreed supported form and a review, not a deadline or automatic increase. Revisit the plan once later to check whether contacts and arrangements are still usable. Record only what was actually verified; a fictional walk-through is not a real recurrence or evidence that symptoms improved."
        checks: [The unavailable-helper scenario is worked through, At least one unnecessary demand can be reduced, Re-entry depends on capacity and relevant care guidance, The later check records actual usability rather than invented recovery]
    adaptation: "Keep only a few entries, use a trusted helper or store an accessible contact reminder. No deliberate setback, stopping treatment, sleep loss, substance use or forced activity is permitted as a test. Seek prompt professional help for new or worsening concerns; do not wait for the scheduled review when urgent support is needed."
    review: "Would the plan still work on a difficult day, including when the usual helper is unavailable? Keep earlier gains and current needs both visible. Update a contact, reduce a demand or seek advice without requiring a smooth upward recovery curve."
    examples:
      supportive: "The plan retained evidence of earlier participation, offered an alternative helper and allowed a supported return based on current capacity."
      mixed: "The main contact was valid but the backup route was missing, so the walk-through exposed a gap before any real setback occurred."
      contradictory: "A setback was treated as proof that all previous progress was fake, or the plan required catching up through an automatic increase in activity."
      inconclusive: "A hopeful return date was written without reduced demands, a usable contact or a walk-through of an unavailable helper."
  '06.12':
    title: "Give a care recipient a usable voice and an independent help route"
    goal: "Build preferences, consent, privacy, complaints and protection from neglect or abuse into a practical care-support arrangement."
    scope_note: "This is an ordinary preference and safeguarding-plan review using a fictional case unless a suitable real context is authorized. It is not a legal capacity judgment, investigation, substitute clinical care plan or authorization to override consent."
    setup: "Use this fictional case: an adult uses a communication device to express choices, but a helper routinely answers instead. The adult wants to choose visit times and discuss a concern privately; an agreed daily need was missed during a handover. Use a private note and the NHS safeguarding reference for examples of concerns and appropriate professional routes, with its UK scope kept explicit."
    burden: "Three sessions of up to 15 minutes; no real concern should wait for the exercise to finish."
    actions:
      - title: "Put the person's communication and choices into the arrangement"
        instructions: "Write a brief preference section in the person's chosen form: what matters to them, which everyday choices they want to make, how to ask permission before help, how they express no or uncertainty, and who may receive private information. In the case, address the adult directly through the device and allow time for an answer before asking a helper to interpret. Record the request for a private conversation and chosen visit times. A diagnosis, reliance on care or a nonspeaking communication method does not by itself settle decision-making authority; genuine legal or clinical questions need qualified local assessment."
        checks: [Preferences are expressed through the person's usable communication method, Ordinary choices and permission checks are explicit, Refusal uncertainty and privacy have practical arrangements, Care dependence is not treated as blanket loss of decision authority]
      - title: "Build a complaints and protection route beyond the immediate helper"
        instructions: "Add a way to raise concerns privately with an appropriate person independent of the immediate helper: a service supervisor, patient advocate, safeguarding professional or relevant local protection service. Specify how the care recipient can access that route using their communication method and what happens if the first contact is unavailable or implicated. Identify the missed daily need as a concern requiring follow-up without deciding from one sentence whether neglect is established. Do not promise absolute secrecy, investigate a suspected abuser yourself or require the care recipient to confront someone who controls essential support. Immediate danger requires local emergency assistance."
        checks: [An independent concern route is identified, It is accessible without relying solely on the person complained about, A missed essential need receives appropriate follow-up, Investigation and urgent protection stay with suitable services]
      - title: "Test the handover against preference refusal and a missed need"
        instructions: "Walk through three variations: the adult changes the visit time, declines an offered nonessential task, and reports the missed need. For each, identify who listens, how the choice or concern is recorded privately, who follows up and how the person learns what happened. Locate an actual public advocacy or safeguarding contact for the relevant area and note access conditions without sending a fictional report. In an authorized real care arrangement, ask the affected person whether the route is usable and seek professional help for unresolved concerns. A written plan alone does not prove that care is safe or that a complaint was resolved."
        checks: [Three distinct preference and concern scenarios are worked through, Follow-up ownership and feedback to the person are explicit, A real relevant public contact is retrievable, A plan is not represented as proof of safe care or resolved harm]
    adaptation: "Use a communication aid, interpreter, chosen advocate or plain-language version without bypassing the recipient. Do not record personal allegations or care details in the app. If there is an actual concern, use appropriate local safeguarding or emergency help promptly; completing a worksheet is never a condition for receiving protection."
    review: "Can the person change a choice, refuse an ordinary offer and raise a concern through a route that does not depend entirely on the helper? Identify any remaining barrier and who can address it. The person's voice must remain visible even when substantial assistance is necessary."
    examples:
      supportive: "The arrangement used the recipient's communication device, preserved private choices and identified an independent contact with a clear follow-up route."
      mixed: "Preferences were recorded, but the only complaint route required the same helper being questioned; an independent accessible route was added."
      contradictory: "The helper answered every question and treated dependence as blanket consent, or an unresolved missed need was dismissed to keep the plan looking successful."
      inconclusive: "A care schedule existed but offered no usable way for the recipient to refuse, communicate privately or learn what happened after a concern."
  '06.13':
    title: "Replace an exclusionary default with a workable invitation"
    goal: "Recognize ableist stereotypes, stigma, inaccessible defaults and unequal treatment, then change language and participation arrangements within your authority."
    scope_note: "One invitation or participation rule is revised and checked against concrete cases. This is a bounded inclusion improvement, not a legal finding about discrimination or certification of an organization's accessibility."
    setup: "Use this fictional club notice: Everyone must stand to introduce themselves; special seating is available only after explaining your condition to the group. Members who overcome disability will be celebrated as an inspiration. Work on a private replacement, or choose a similarly manageable notice or invitation you have authority to change. No actual person supplies a diagnosis or an inspirational story."
    burden: "About 15 minutes to analyze, 20 minutes to replace the default, and a short review."
    actions:
      - title: "Identify what the wording makes people do or disclose"
        instructions: "Mark five problems in the notice: a stereotype about the right way to participate, stigma attached to asking for support, compelled personal disclosure, an inaccessible standing-and-speaking default, and an inspiration story imposed on a person. For each, explain its likely practical effect rather than merely labeling the writer bad. Separate intent from the rule's consequences and identify who controls the change. Ask what the club actually needs from an introduction, such as a preferred name and an optional interest, and which demands do not serve that purpose."
        checks: [Five distinct exclusion mechanisms are examined, Each mechanism is linked to a practical participation effect, The legitimate purpose is separated from unnecessary demands, Authority to change the notice or only propose a change is stated]
      - title: "Write a replacement that makes ordinary participation possible"
        instructions: "Produce a complete invitation: You may introduce yourself seated, standing, in writing, through your usual communication method, or pass. Share the name and interest you choose. Ask the organizer privately about access arrangements; personal medical details are not part of the group introduction. Remove the compulsory inspiration feature and offer recognition for chosen contributions only with consent. For an actual event, include a real contact route and only access arrangements that can be delivered; identify anything still unconfirmed. A private draft must remain labeled a proposal until the responsible person adopts it."
        checks: [A complete replacement notice is produced, Participation has usable choices including passing, Medical disclosure and inspirational storytelling are not required, Any real access promise is within authority and confirmed]
      - title: "Check inclusion through two different participation needs"
        instructions: "Apply the replacement to a person who cannot stand and a person who communicates through text or a device. Can each learn how to join, choose what to share and take part without becoming a special public case? Then consider someone who prefers not to disclose an access need: which options are already available by default? Record a remaining practical issue such as an organizer who cannot receive text, and specify a realistic correction. If real participants voluntarily provide feedback, use only what they choose to share and do not make them unpaid representatives of an entire group."
        checks: [Two different participation cases are examined concretely, Non-disclosure remains compatible with available default options, A remaining practical barrier is checked and addressed or recorded, Feedback does not turn an individual into a representative of all disabled people]
    adaptation: "Use a private invitation, small group or fictional notice if you lack policy authority. Work in the person's preferred language and format. No disability simulation, public confrontation, compulsory disclosure or claim that good intentions prove access is required. Formal legal questions need relevant local expertise."
    review: "What can someone now do without standing, speaking aloud or explaining a diagnosis to the group? Identify the actual changed default, its remaining delivery conditions and whether it was adopted or remains a proposal. Respectful wording must connect to a workable participation option."
    examples:
      supportive: "The replacement allowed seated and written participation, offered private access contact and removed compulsory public disclosure and inspiration framing."
      mixed: "The new wording offered text participation, but nobody had arranged how text would reach the organizer; that practical gap remained to resolve."
      contradictory: "The notice used kinder language while still requiring public medical disclosure or rewarding disabled members for appearing to overcome their needs."
      inconclusive: "The learner objected to the original notice but produced no replacement or concrete test of how someone would participate."
  '06.14':
    title: "Prepare a clear handoff when a concern exceeds self-help"
    goal: "Recognize the limits of peer and self-guided support across trauma, suicidality, abuse, psychosis, addiction, severe functional decline and medical concerns, and identify appropriate professional or emergency routes."
    scope_note: "This is resource preparation and fictional response rehearsal, not diagnosis, a risk score, emergency-response certification or a substitute for contacting help in a real situation."
    setup: "Use the linked NIMH help page and official services for the country where the plan would be used. Work with fictional categories rather than a real person's private symptoms. If a concern is occurring now, contact suitable support promptly instead of completing the exercise. In the US, call 911 for life-threatening emergencies and call or text 988 for suicide or emotional-crisis support; outside the US use local emergency and crisis services."
    burden: "About 20 minutes to locate resources and a short private handoff rehearsal; no real emergency or test call is needed."
    actions:
      - title: "Recognize seven situations in which the curriculum is insufficient"
        instructions: "Make seven short entries: persistent trauma-related distress needs a qualified assessment rather than forced retelling; suicidal thoughts need prompt crisis or professional help rather than a promise to cope alone; suspected abuse needs appropriate protection support; new experiences such as hearing things others do not or losing touch with reality need prompt clinical assessment; substance dependence or withdrawal concerns need qualified treatment advice; marked decline in basic functioning needs medical or clinical evaluation; and concerning physical symptoms need appropriate medical care. These are reasons to seek help, not diagnoses or an exhaustive list of emergencies. If danger is immediate or life-threatening, use emergency services; uncertainty is a reason to ask a professional, not to award a low-risk label."
        checks: [All seven categories have an appropriate boundary explanation, The entries direct to qualified help without making diagnoses, Immediate danger is separated from a routine appointment process, Uncertainty does not become a claim that the situation is safe]
      - title: "Build a small resource card that works in the relevant location"
        instructions: "Record the official local emergency number, a crisis-support route, an ordinary clinical entry point and an appropriate safeguarding or abuse-support route. For the US starting example, verify 911 and 988 through the NIMH reference, then locate the actual local clinical and protection services. Check location served, contact method, availability and any accessibility or eligibility information; leave unknown details explicit. Include an alternative when an ordinary service is closed or unreachable. Save public contact information where it is accessible; do not call emergency or crisis lines just to test them or submit a fictional report."
        checks: [Four types of help have location-appropriate public routes, Availability accessibility and eligibility are checked or marked unknown, An unavailable-service alternative is recorded, Verification uses public information without a test emergency contact]
      - title: "Rehearse a brief handoff without trying to become the clinician"
        instructions: "Privately rehearse: I am concerned because of this observed change. I can help contact the appropriate service; this needs more than our exercise. Supply only a plain observation, not a diagnosis, and ask how to make contact in the person's usable communication form. Compare a nonurgent care appointment, a suicidal statement needing prompt crisis support and an immediate life-threatening medical situation needing emergency help. Do not promise secrecy, argue someone out of an unusual belief, investigate abuse or improvise treatment. In a real event, use the appropriate service promptly and follow trained guidance while keeping your own safety in view; never wait to collect exercise evidence."
        checks: [The handoff states an observation and a concrete help route, Three scenarios receive distinct appropriate contact responses, Privacy is respected without promising absolute secrecy, No treatment investigation or delay for evidence is introduced]
    adaptation: "Prepare text or communication-aid wording and a locally appropriate accessible contact route. A trusted helper may assist with public information. Keep the rehearsal fictional and brief. Contact details and service scope can change, so check the card before relying on it later; actual urgency takes precedence over this practice."
    review: "Can you find the right kind of help and communicate a concern without diagnosing or delaying? Identify an unresolved access detail and a realistic way to clarify it. Completing a card or rehearsal does not qualify someone to manage a crisis alone."
    examples:
      supportive: "The card contained verified local routes and the rehearsal distinguished an ordinary appointment from prompt crisis contact and a life-threatening emergency."
      mixed: "The emergency route was clear but the preferred crisis contact had an unresolved communication-access question, which remained explicitly open."
      contradictory: "A peer labeled a situation safe without assessment, promised secrecy, or delayed seeking help until the curriculum exercise was complete."
      inconclusive: "The learner listed professional titles without usable contact routes or a concrete handoff for the supplied scenarios."
