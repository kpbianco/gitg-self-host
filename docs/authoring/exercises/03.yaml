schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '03'
exercises:
  '03.01':
    title: "Examine an ultimate question without manufacturing certainty"
    goal: "Compare religious, spiritual, philosophical and naturalistic accounts of ultimate questions, then state a reasoned position or uncertainty that represents alternatives fairly."
    scope_note: "The six-question map covers God, consciousness, soul, freedom, providence and transcendence; one comparison receives deeper examination. A reasoned position is an inquiry result, not a proof, conversion, or comprehensive survey of traditions."
    burden: "Three sessions of about 20 minutes, with an optional later return to an unresolved question."
    setup: "Use paper, dictation or a private note. No religious affiliation or previous philosophy study is required. Start with the supplied question: does the feeling that a helpful coincidence was meant to happen justify believing it was providential? Use the constructed viewpoints below as starting positions, not descriptions of every believer or nonbeliever."
    actions:
      - title: "Separate six questions that are easily collapsed together"
        instructions: "Make six short entries and consider a contrast for each: God as a personal creator versus impersonal ultimate reality or no divinity; consciousness as physically explained versus having an irreducible experiential aspect; soul as a persisting immaterial self versus a changing embodied pattern; freedom as acting from reasons within causes versus requiring another kind of agency; providence as guiding intention versus events without such direction; transcendence as contact with ultimate reality versus going beyond ordinary self-concern. These are constructed contrasts, not exhaustive accounts or labels for entire traditions. For each, state what the disagreement is and a present view or honest question. Separate experience, explanation, moral commitment and claims about reality; feeling awe alone does not answer all six."
        checks: [All six questions include a considered contrast, Experience and interpretation are distinguished, Present uncertainty is recorded rather than concealed, The focused question is stated in ordinary language]
      - title: "Give competing accounts their strongest reasons"
        instructions: "Apply four constructed accounts to the coincidence: a personal God may guide events; an impersonal spiritual order may make the event meaningful; a philosophical skeptic asks which inference is justified; a naturalistic account examines ordinary causes and attention to memorable events. Write a reason each proponent might offer and a serious difficulty for each. Ask what observation would distinguish the accounts, and which disagreement may remain metaphysical rather than experimentally decidable. Read Enchiridion 31 through the supplied reference for one actual providential account, and keep that author's claim separate from your reconstruction."
        checks: [Four distinct accounts are represented fairly, Each account has a reason and a difficulty, A possible discriminator or its absence is stated, A source-backed claim is distinguished from constructed viewpoints]
      - title: "State what you believe and how you could revise it"
        instructions: "Write or speak a short conclusion with five parts: my current view or suspension of judgment; my strongest reason; the strongest remaining objection; what could change my view; and one practical consequence that does not require others to agree. Revisit the other five entries and note whether the conclusion actually changes them. In the coincidence case, you might appreciate the help and thank the person while leaving divine intention unresolved. Explain an alternative without sarcasm before defending your own conclusion."
        checks: [The conclusion includes a reason and an unresolved objection, A revision condition is explicit, Practical conduct does not require manufactured agreement, Implications for the other questions are checked]
    adaptation: "Use the supplied coincidence instead of personal religious experiences. Definitions can be read aloud; a drawing can separate observation from explanation. A chosen faith commitment and principled nonbelief are both possible outcomes. Leave questions open or use N/A if this pathway is consciously unchosen."
    review: "Can someone who disagrees recognize their view in your account, and can you say why you hold or withhold your conclusion without pretending proof?"
    examples:
      supportive: "The inquiry separated a meaningful experience from an explanation, represented four alternatives, and retained uncertainty about providence while identifying a reasoned next question."
      mixed: "The competing accounts were fair, but the supposed discriminator would not actually separate them and the conclusion stayed provisional."
      contradictory: "The intensity of a feeling was presented as decisive proof, or a competing worldview was reduced to stupidity or moral inferiority."
      inconclusive: "Definitions were copied without comparing reasons or stating a position, objection or principled uncertainty."
  '03.02':
    title: "Study one wisdom tradition beyond its slogans"
    goal: "Build an account of one tradition from primary passages, historical setting, an exemplar, practice, internal differences and a present community's own account."
    scope_note: "This is a small study unit, not completion of a tradition. The default examines ancient Stoic texts and a contemporary organization; one organization never represents all adherents. Study does not require adopting the beliefs."
    burden: "Three study sessions of about 25 minutes over a week; allow more time or split the reading if needed."
    setup: "Use the linked Enchiridion sections 1, 17 and 31; Marcus Aurelius, Meditations Book One, opening entries through Rusticus; and Modern Stoicism's About Us page. The numbered passages and prompts below define the unit. Paper or spoken notes suffice. Another chosen tradition needs an accessible primary passage, historical context, an exemplar and a self-described living community before substitution; otherwise use this default."
    actions:
      - title: "Read a primary passage inside its setting"
        instructions: "Read the three Enchiridion sections and the opening Meditations entries. Record author, work and section so you can find each again. Contrast the handbook's counsel about choice, assigned roles and providential gods with Marcus's acknowledgments of teachers and family. Locate the ancient texts before the contemporary organization in a simple timeline; use the archive's dating as an approximate guide. In your own words, explain what kind of life these selected passages commend and what conception of the world supports it. Mark an unfamiliar term instead of silently translating it into a modern slogan."
        checks: [Primary passages have retrievable locations, Ancient and contemporary settings are distinguished, A way of life and its underlying view are connected, An unfamiliar term or assumption is investigated]
      - title: "Test an interpretation through a modest practice"
        instructions: "Use Marcus's account of Rusticus as the selected exemplar: careful reading and accepting correction matter more than displaying learned words. Re-read one passage and correct your first interpretation using its actual wording. Then try one ordinary action inspired by the texts, such as preparing a clear request while leaving the other person's reply to them. Record what you did and whether it served the stated purpose. Do not adopt ancient claims about illness, enslavement or obedience as instructions to dismiss suffering or tolerate abuse; explain that interpretive limit explicitly."
        checks: [An exemplar is connected to a concrete teaching, The first interpretation is checked against the passage, An ordinary practice receives an actual attempt, An ethical or historical limitation remains visible]
      - title: "Explain the tradition with its live differences intact"
        instructions: "Read Modern Stoicism's own description of its origins, activities and range of religious views. Compare that contemporary range with Enchiridion 31's providential account: identify the interpretive question rather than declaring them identical. Prepare a two-minute explanation with one primary teaching, its historical setting, an exemplar, your trial, this difference, and the organization's present activities. End by correcting a caricature, such as treating Stoicism as simply hiding every feeling, using the selected passages. Name what further reading or a voluntary community conversation would need to check."
        checks: [A present community is described from its own account, A real interpretive difference is preserved, The explanation connects all six study elements, A caricature is corrected without claiming total expertise]
    adaptation: "Use text to speech or divide the named sections into short readings. If source access fails, use the included summaries only for orientation and leave primary-text and community-study checks unmarked until the sources are available; do not invent a substitute quotation. No visit, membership, donation or assent is needed."
    review: "Could a beginner distinguish this account from a motivational slogan, and which claim would you most want a knowledgeable practitioner or scholar to correct?"
    examples:
      supportive: "The learner connected passage, setting, exemplar, a request they actually made, a disagreement over providence and a current organization's self-description."
      mixed: "The primary passages and practice were examined, but a contemporary community's account was unavailable and that part remained unverified."
      contradictory: "One modern adaptation was called the whole tradition, or an ancient prescription was used to excuse mistreatment without examination."
      inconclusive: "An attractive quotation was collected without its context, a practical attempt, or examination of interpretive differences."
  '03.03':
    title: "Build a short contemplative practice and examine its effects"
    goal: "Establish a freely chosen prayer, reading, silence or attention practice and examine whether it supports honesty, attention, gratitude, resolve or peace in ordinary conduct."
    scope_note: "Five brief occasions provide an initial pattern, not reliable clinical or spiritual efficacy. The practice may be useful, neutral or unwelcome; concentration, calm and religious feeling are not scores of worth."
    burden: "About 15 minutes to prepare, five three-minute occasions during a week, and a 15-minute review."
    setup: "Choose a familiar safe place and an ordinary daily cue. The usable default is an eyes-open three-minute pause: notice the room, attend to one ordinary sound or object, then name one honest next action. Prayer, sacred reading, examen or quiet recitation may replace the middle minute if already suitable to your tradition. No special posture, breath control, equipment or belief is required."
    actions:
      - title: "Define a practice small enough to repeat honestly"
        instructions: "Write the cue, the three-minute sequence and one conduct marker: for example, notice that you do not know before making a claim, thank a helper specifically, or return attention to the next task. Choose one of honesty, attention, gratitude, resolve or peace as the focus, while checking that the others are not being undermined. State how to stop comfortably. Rehearse the sequence once; record an interrupted rehearsal as interrupted rather than stretching it until it looks successful."
        checks: [A cue and exact short sequence are defined, One observable conduct marker is selected, A comfortable stopping option is available, One rehearsal is recorded accurately]
      - title: "Repeat without requiring a special internal state"
        instructions: "On five available occasions, follow the sequence or record why it was missed. After each, privately note the setting, whether you actually practiced, what happened to the chosen marker in the next ordinary activity, and any discomfort or distraction. If attention wanders, gently return once; wandering is information rather than misconduct. Do not increase intensity to force an effect. If the practice becomes distressing, stop, return to an ordinary activity and record that it was unsuitable."
        checks: [Five opportunities are accounted for without inventing attempts, Actual practice and missed opportunities are separated, Conduct after practice is observed, Discomfort and distractions remain in the record]
      - title: "Choose a sustainable next step from the whole pattern"
        instructions: "Compare the actual occasions, including neutral and difficult ones. Ask whether any apparent change could instead reflect sleep, workload, company or expectations. Look separately at honest acknowledgment, sustained attention, appreciation, follow-through and ease; do not require every effect. Keep, shorten, change or stop the sequence for a stated reason. A useful result might be admitting uncertainty twice even though you never felt peaceful. Describe the pattern as a small personal observation, not proof that this practice works for everyone."
        checks: [Helpful neutral and difficult occasions are compared, At least one competing explanation is considered, A specific keep adapt or stop decision follows, The conclusion stays within the observed pattern]
    adaptation: "Attend to touch, sound or an ordinary task using a comfortable posture; keep eyes open if preferred. Use a familiar prayer only by choice. No fasting, sleep deprivation, breath manipulation, isolation or altered-state induction belongs to this exercise. Stop an upsetting practice and seek suitable support if distress persists."
    review: "What happened to your chosen conduct marker, what did the practice cost, and is the next version justified by your actual experience?"
    examples:
      supportive: "Four brief attempts were recorded, one was missed, and two later conversations included honest acknowledgment of uncertainty; no general effectiveness claim was made."
      mixed: "The pause sometimes helped attention but also felt burdensome, so the participant shortened it and retained the uncertainty."
      contradictory: "A participant extended an upsetting session to force calm, concealed missed occasions or treated distraction as spiritual failure."
      inconclusive: "A preferred routine was planned but no actual occasions or later conduct were observed."
  '03.04':
    title: "Turn reverence into attentive and responsible conduct"
    goal: "Recognize what merits reverent attention and respond with care while retaining conscience, factual judgment and respect for people who understand sacredness differently."
    scope_note: "Life, nature, persons, ritual, truth, beauty and what is held holy are possible objects of reverence, not a required belief list. One chosen encounter tests sincere attention and conduct; it cannot establish the truth of a sacred claim."
    burden: "Three short sessions of about 15 minutes, including one ordinary encounter and a later care action."
    setup: "Use something safely accessible: a plant, the sky through a window, a piece of music you may play, an inherited object, or a freely chosen familiar ritual. The default is observing an ordinary plant without touching or removing it. No special journey, purchase, emotional response or religious assent is needed."
    actions:
      - title: "Name what deserves attention and what respect requires"
        instructions: "Consider the seven possibilities in the scope and choose one that matters to you. Describe what you value about this particular example rather than calling everything sacred. For the plant, consider its living processes and dependence on its surroundings. State appropriate conduct: observe without damage, follow access rules, and leave other people's interpretation free. If the object involves a person or tradition, distinguish your admiration from permission to photograph, touch, imitate or demand disclosure."
        checks: [A particular object of reverence and reason are identified, The chosen pathway is distinguished from required belief, Appropriate conduct is specified, Other people retain consent and interpretive freedom]
      - title: "Attend sincerely while keeping observation and meaning separate"
        instructions: "Spend five comfortable minutes with the chosen example. Notice three concrete details and one question you cannot answer. Describe any awe, gratitude, indifference or discomfort without forcing it. Then add your interpretation separately: for instance, the branching leaf pattern prompted care for living things, but did not prove a supernatural account. If a claim conflicts with evidence or conscience, record the disagreement while behaving respectfully; sincerity does not require saying something you believe false."
        checks: [Three details come from an actual encounter, A remaining question is acknowledged, Feeling and explanation are recorded separately, Respectful conduct preserves factual and conscientious judgment]
      - title: "Carry the attention into one proportionate act of care"
        instructions: "Within two days, take a small action that follows from the value you named: care correctly for your own plant, avoid damaging a shared place, listen attentively to a willing person, or return a meaningful object to its proper place. For the default, leave the plant undisturbed and improve care of something you are responsible for. Review whether the action served that good or mainly displayed your own sensitivity. State how someone who holds nothing holy in the same way still deserves equal respect."
        checks: [A proportionate care action is actually taken, The action relates to the stated value, Care and self-display are distinguished, Respect extends to people outside the chosen pathway]
    adaptation: "Use familiar music, a described object, a tactile item you own or an accessible view. No contact with sacred objects, restricted practices, wildlife or unwilling people is required. If nothing feels reverent, honest attention can be observed without claiming awe; this pathway may also be unchosen."
    review: "Did attention change how you treated something, and could you retain that care without forcing your interpretation on others?"
    examples:
      supportive: "The participant noticed details of a plant, left its meaning open, and changed how they cared for a living thing in their responsibility."
      mixed: "The encounter felt ordinary rather than moving, but the participant still acted carefully and reported the lack of awe."
      contradictory: "A moving experience was used to overrule another person's conscience, claim unsupported truth or damage a place while seeking a dramatic photograph."
      inconclusive: "A value was named without an actual attentive encounter or any related conduct."
  '03.05':
    title: "Trace a received good and answer it through conduct"
    goal: "Recognize dependence, gifts, contingency, sacrifice and inheritance in an ordinary good, then express gratitude through appropriate care, remembrance or generosity."
    scope_note: "Gratitude concerns a specific received good, not a duty to feel grateful for harm. Recognizing help does not erase your work, create unlimited debt or require contact with an unsafe benefactor."
    burden: "About 20 minutes to trace a good, one modest response, and a 15-minute review after a later use."
    setup: "Use a skill someone taught you, a book available to you, a useful tool or an ordinary meal. The default is a learned household skill such as mending a loose button or organizing a cupboard. No purchase, public thanks or religious interpretation is needed. Keep names and personal histories in your private notes."
    actions:
      - title: "Trace the good beyond your own contribution"
        instructions: "Draw a short chain from the good you now use to people, inherited knowledge, materials and circumstances that made it possible. Mark your own effort too. Identify one gift or unearned advantage, one dependence, one contingent opportunity, one cost someone may have borne and one inheritance worth preserving. Label an unknown cost as unknown rather than inventing a sacrifice. For the learned skill, distinguish a teacher's time from the practice you supplied and the tools that happened to be available."
        checks: [The chain includes personal effort and dependence, Gift contingency and inheritance are considered, A cost or sacrifice is identified without invention, Unknown parts of the chain remain explicit]
      - title: "Respond in a way that serves the good"
        instructions: "Choose a response from this concrete menu: use a borrowed item carefully and return it; thank a willing recipient for a specific help; maintain a tool you own; teach the skill to someone who wants it; or preserve a short private remembrance of a contribution. State why the response is suitable and what it will cost in time or effort. Carry it out without expecting recognition, access or forgiveness in return. If the benefactor also caused harm, acknowledge the limited good without surrendering a needed boundary."
        checks: [The response fits the particular received good, A real response is completed, The response does not demand a return favor, Gratitude preserves any necessary boundary]
      - title: "Let remembrance guide the next ordinary use"
        instructions: "When you next use the skill, object or opportunity, recall one part of the chain and make a concrete choice about care, restraint, sharing or preservation. Compare this conduct with your original expression of thanks. Ask whether you erased someone, overstated another person's sacrifice or made gratitude into self-accusation. Retain one truthful acknowledgment and one sustainable future behavior. A quiet act of care is sufficient; warm feelings and public display are not required."
        checks: [A later ordinary use is reviewed, Remembrance has a concrete consequence for conduct, An omission or overstatement is checked, The continuing response remains proportionate]
    adaptation: "Use spoken recollection or a simple object instead of writing. Choose an impersonal public good or a safe historical contribution when direct relationships are difficult. A private acknowledgment can replace contact; do not give money or labor you cannot reasonably spare."
    review: "Which received contribution became visible, and what did you actually do differently because of it?"
    examples:
      supportive: "The learner credited a teacher and their own practice, maintained a tool and later shared the skill with someone who had requested help."
      mixed: "A specific thanks was offered, but the contribution chain still contained unknowns and no later use had occurred."
      contradictory: "Gratitude was used to demand obedience, excuse harm or impose a debt that the recipient had never accepted."
      inconclusive: "A gratitude list was written without tracing a particular good or taking any related action."
  '03.06':
    title: "Release an uncontrollable outcome while taking your next step"
    goal: "Distinguish choice, influence and uncontrollable conditions, tolerate remaining uncertainty and dependence, and act on a proportionate responsibility without pretending to control the outcome."
    scope_note: "One low-stakes uncertainty practices the relation between acceptance and action. It does not prescribe passivity about injustice or claim that feelings, bodies and circumstances are entirely controllable."
    burden: "About 15 minutes to prepare, one ordinary action, and two brief reviews within a week."
    setup: "Use an unanswered nonurgent invitation, a hobby plan affected by weather, or the supplied case: you have invited a friend to a free activity but do not yet know whether they will attend. No serious loss, health concern, emergency or manufactured deprivation is needed."
    actions:
      - title: "Sort choice influence and the outcome you cannot promise"
        instructions: "Make three columns. Under choice, put a respectful invitation and your own fallback plan. Under influence, put clear timing and an easy way to decline. Under outside my control, put the other person's availability, preference and eventual answer. Add an uncertainty you must live with and a limit on your time or energy. Identify any appropriate help you depend on. Check whether acceptance is becoming an excuse to omit a responsibility, or whether planning is becoming a claim that you can guarantee the reply."
        checks: [Choice influence and uncontrollable conditions are separated, An unresolved uncertainty and personal limit are explicit, Relevant dependence or help is acknowledged, Both passivity and false control are checked]
      - title: "Take the action and stop at the agreed boundary"
        instructions: "Make or clarify the ordinary invitation once, with a reasonable decision point and an easy refusal. Prepare a satisfying solo or alternative activity. Until the decision point, return to another ordinary task rather than repeatedly demanding a reply. If new information requires action, respond proportionately; releasing control is not a ban on useful follow-up. Observe what you actually did when the urge to check or pressure appeared, without demanding that the feeling disappear."
        checks: [A proportionate action is actually taken, A fallback and decision point are available, The other person remains free to choose, The response to uncertainty is observed without forcing calm]
      - title: "Review your conduct separately from whether you got your way"
        instructions: "At the decision point, follow the available plan, then review again a day or two later. State the outcome, your contribution, help or constraints, and what remained outside your control. If the reply was disappointing, name the disappointment without using it as proof that acceptance failed. If it was favorable, do not infer that your attitude caused it. Decide whether to repeat the approach, change the invitation or leave the matter alone, giving a practical reason."
        checks: [The decision point leads to a real next step, Conduct and outcome are evaluated separately, Remaining emotion and dependence are acknowledged, The next decision follows the observed limits]
    adaptation: "Use a solo weather-dependent plan or the fictional invitation for analysis when no suitable live uncertainty exists. Fictional planning does not demonstrate release during a real wait. Prayer or secular language may frame acceptance; neither replaces necessary care, advocacy or professional support."
    review: "What did you release, what remained yours to do, and how did the result test that distinction?"
    examples:
      supportive: "The participant invited once, accepted a refusal and used the fallback while remaining disappointed but respectful."
      mixed: "The fallback worked, but repeated checking continued and became a specific target for a later attempt."
      contradictory: "Acceptance was used to abandon a responsibility, or surrender was demanded from someone facing mistreatment."
      inconclusive: "The control columns were completed for a fictional case but no real action or period of uncertainty was observed."
  '03.07':
    title: "Contribute to a chosen community while keeping conscience intact"
    goal: "Take part in a freely chosen community's shared practice, service, care and accountability, then examine whether belonging and celebration coexist with boundaries against coercion."
    scope_note: "One community contact and contribution can begin participation; they do not establish a trustworthy institution or lasting belonging. A secular ethical or contemplative community is a legitimate chosen pathway, and declining community participation remains possible."
    burden: "About 20 minutes of preparation, an agreed small contribution of up to 30 minutes, and a 15-minute review."
    setup: "Choose an existing community you can approach safely, such as a faith group, meditation circle, philosophical discussion group or mutual-care gathering. The default contribution is helping prepare or restore the space for an open gathering after asking the organizer. Confirm visitor access, an exit route and that participation does not require a donation, confession, private disclosure or agreement you do not hold."
    actions:
      - title: "Learn how this community practices care and accountability"
        instructions: "Use public information or a voluntary brief question to learn the gathering's purpose, a shared practice, how help is requested, how achievements or important occasions are marked, and where concerns can be raised. Ask what a newcomer may join or observe. Write one contribution you can genuinely offer and one limit, such as leaving after the agreed time. Treat an unanswered accountability question as missing information. Pressure for secrecy, isolation or personal access is a reason to pause, not a test of devotion."
        checks: [Shared practice care and celebration have concrete examples, An accountability route or its absence is identified, Visitor participation and a contribution are agreed, A personal limit and exit option are explicit]
      - title: "Make a useful contribution without purchasing belonging"
        instructions: "Carry out the agreed bounded help, such as setting out permitted materials or restoring the room. Ask how the work should be done and accept an ordinary correction when sound. Join or respectfully observe one permitted shared practice, and notice how participants acknowledge effort or care for someone who needs help. Do not record identifying details. Keep the promised time limit; contribution is not consent to membership, proselytizing, unpaid ongoing work or another person's authority over your life."
        checks: [An agreed contribution is actually made, A shared practice is joined or explicitly observed, An ordinary correction or care interaction is noticed, Time and personal boundaries remain intact]
      - title: "Decide whether further participation is warranted"
        instructions: "Compare what the group said with what you observed about welcome, care, celebration and accountability. Record one appreciated feature, one concern or unknown, and the response to your stated limit. If appropriate, ask one modest clarifying question or offer factual feedback through the stated route; do not confront a coercive situation. Choose return, a smaller role, another community or no further contact. A warm welcome is not proof of safety, and discomfort with an unfamiliar form is not by itself proof of abuse."
        checks: [Stated values and observed conduct are compared, A strength and concern or unknown are retained, The treatment of a boundary is reviewed, Further participation has a reasoned voluntary decision]
    adaptation: "A suitable online group may offer a small accessible task. If no safe community is available, use a fictional open reading circle to prepare questions and boundaries; leave live contribution and participation checks unmarked. No travel, donation, doctrinal assent, private interview or contact with an unsafe group is required."
    review: "Was the contribution useful, could you say no, and what evidence supports the amount of trust you are considering next?"
    examples:
      supportive: "The visitor helped restore a room, observed a shared reading, received a clear answer about concerns and left at the agreed time without pressure."
      mixed: "The group was welcoming and the task useful, but its accountability route remained unclear and further commitment was deferred."
      contradictory: "Help was treated as consent to escalating demands, or a boundary was framed as disloyalty or spiritual inferiority."
      inconclusive: "A group was researched but no agreed contribution or shared practice was experienced."
  '03.08':
    title: "Make a sustainable commitment to a good beyond yourself"
    goal: "Choose a freely endorsed commitment to truth, faith, community, craft, a cause or future people and let it make a real, proportionate claim on your time, comfort, resources or status."
    scope_note: "A small completed commitment tests service and follow-through, not discovery of a permanent calling or the moral value of a person. Service must meet a real use rather than treating recipients as props for identity."
    burden: "About 20 minutes to choose and agree the work, two 15-minute work periods within a week, and a 15-minute review."
    setup: "Choose a good you actually endorse and an appropriate recipient or future user. The default is preparing a clear care-and-return instruction card for a shared item, with the responsible person's permission. Use an item you know how to handle safely; do not invent technical instructions. A private reusable guide for your future household can substitute when no shared setting is available, with its narrower benefit stated."
    actions:
      - title: "Turn a large cause into a useful and bounded promise"
        instructions: "Name which good calls for your effort and who or what should benefit. Confirm one real need with the responsible person or observable use, such as repeated uncertainty about where a shared item belongs. Define a small deliverable, its recipient, an agreement or authority to act, and a finish date. Identify the real cost: two short blocks that displace optional leisure, a minor inconvenience, or giving another contributor due credit. Protect essential needs and existing commitments; a demanding promise is not automatically a better one."
        checks: [A chosen good has a specific beneficiary or future use, A real need and permission are checked, A deliverable and finish date are explicit, A proportionate cost is acknowledged without neglecting duties]
      - title: "Deliver something another person can actually use"
        instructions: "Use the first work period to make the instruction card: where the item is kept, how an authorized user checks it, and how it is returned or a problem reported. Verify each statement from known instructions or the responsible person. Use the second period to check readability and completeness with an intended user if willing, then hand it over or place it only where permitted. Credit contributions. Keep promises small enough to finish rather than turning the work into an impressive public project."
        checks: [The promised work receives both actual work periods, Content or workmanship is checked against its intended use, The deliverable reaches the agreed recipient or place, Other contributions and permissions are respected]
      - title: "Review service against benefit and actual cost"
        instructions: "Ask whether the deliverable was useful, or record that actual use remains unknown. Compare the time and convenience you gave up with the promise and the needs it served. Identify one correction, such as a missing return location, and make it if still within scope. Decide whether this commitment deserves continuation, a different form or a clear ending. A negative review of the deliverable is information about service, not proof that you lack a vocation."
        checks: [Benefit is checked or explicitly remains unknown, Actual sacrifice is compared with the promise, A needed bounded correction is addressed, Continuation or closure has a reason]
    adaptation: "Offer spoken or large-print instructions, a simple diagram or another requested accessible format. Use a familiar safe item and the authority you actually have. No money, unpaid professional work, recruitment, public credit or irreversible life commitment is required. A private future-use guide does not count as observed benefit to a community."
    review: "What received something useful, what did the commitment really cost, and what would justify continuing it?"
    examples:
      supportive: "Two short leisure periods produced a checked return card that an intended user could follow, and a missing location was corrected."
      mixed: "The work was delivered and cost real effort, but no later use had occurred, so benefit remained unverified."
      contradictory: "The helper ignored the recipient's actual request, sought recognition over usefulness or neglected essential responsibilities to prove devotion."
      inconclusive: "A noble cause and intended sacrifice were described without completing an agreed piece of work."
  '03.09':
    title: "Use a small ritual to connect remembrance with action"
    goal: "Create or freely adopt a meaningful sequence for a transition, remembrance or shared value, then examine whether its repetition supports memory, identity and practical conduct."
    scope_note: "Beginnings, endings, grief, gratitude, rest, commitment, repentance, celebration and belonging have different purposes. One appropriate ritual is practiced; painful loss or religious obligation need not be introduced to cover every possible use."
    burden: "About 20 minutes to prepare, two five-minute occasions and a 15-minute review."
    setup: "The default is a weekly closing ritual using an ordinary object you own: set it down, name one received good, acknowledge one unfinished matter, state one next action, then begin a short period of rest. No flame, food restriction, purchase, sacred object or public performance is required. Use private notes if speaking aloud is unsuitable."
    actions:
      - title: "Give each part of the sequence a purpose"
        instructions: "Choose a real beginning, ending or recurring pause. Briefly distinguish remembering a loss, expressing thanks, making repair, celebrating, belonging and committing: they ask different things of a ritual. For the default, map the object to an ending, thanks to remembrance, the unfinished matter to honesty, the next action to commitment and the final pause to rest. State when the ritual starts and ends and what it does not promise. If borrowing a tradition's form, verify that it is appropriate for you to use; otherwise keep the supplied ordinary sequence."
        checks: [The occasion and purpose are specific, Each chosen element has an intelligible meaning, Different ritual purposes are not collapsed together, Use of objects and any borrowed form is appropriate]
      - title: "Perform the sequence with attention and freedom"
        instructions: "On the chosen occasion, follow the five-part sequence at a comfortable pace. Name a concrete good and unfinished matter, then choose a small next action such as returning an item or correcting a misunderstanding. Begin the planned rest rather than turning the ceremony into more work. Notice which element helped you remember and which felt empty. If others join, explain the sequence first and make speaking, silence and declining equally available; do not require disclosure of grief, guilt or belief."
        checks: [The defined sequence is actually performed, Remembrance refers to a concrete good or event, A specific next action is named, Rest and any participant choice are respected]
      - title: "Check the action and revise the next observance"
        instructions: "Before the next occasion, check whether you did the named action and what prevented it if not. Repeat the ritual once, preserving or changing one element for a reason: an object may now remind you to return the borrowed item, while an ornate speech may be removed. Ask what identity or belonging the sequence expresses and whether your conduct supports it. A ritual can be sincere without strong emotion; repeated symbolism does not replace a repair or practical promise."
        checks: [The promised action is checked against what happened, A second observance is recorded, One retained or revised element has a reason, Symbolic meaning is compared with actual conduct]
    adaptation: "Use a tactile cue, a brief written line or a silent accessible pause. For grief or repentance, choose a manageable event or defer; no forced disclosure, forgiveness or reenactment belongs here. A familiar religious ritual may be used within its community's rules and your conscience."
    review: "What did the sequence help you remember, and what changed outside the ceremony?"
    examples:
      supportive: "The weekly pause recalled help received, prompted return of a borrowed item and made room for rest; the second observance removed an empty flourish."
      mixed: "The sequence felt meaningful, but the next action was missed and the review made that gap explicit."
      contradictory: "A ceremony substituted for making a needed repair, pressured others to disclose grief or borrowed a restricted practice without permission."
      inconclusive: "A ritual was described beautifully but never performed or linked to an observed action."
  '03.10':
    title: "Join a shared sacred practice with understanding and consent"
    goal: "Understand a community's chosen form of worship or remembrance, participate in an eligible and sincere way, and relate the experience to its tradition while preserving conscience and others' freedom."
    scope_note: "One permitted communal form is practiced, not every sacrament, pilgrimage or liturgy. Observation can develop understanding but remains distinct from participation. No one must profess belief, enter a restricted rite or convert to complete a checklist."
    burden: "About 20 minutes of preparation, a suitable short gathering or segment, and a 15-minute review; defer if no fitting occasion is available."
    setup: "Choose an open, familiar and freely endorsed communal service, recitation, shared silence or remembrance. Ask or read what visitors may do, its meaning, access needs and how to leave. A secular shared remembrance is suitable when that is your pathway. The supplied fallback below is a new shared remembrance with a willing companion, explicitly a small chosen form rather than membership in an established tradition."
    actions:
      - title: "Understand what participation means before joining"
        instructions: "Identify the gathering's tradition or shared story, the purpose of its words and gestures, who leads, and which parts require belief, preparation or membership. Choose your honest role: eligible participant, respectful observer or decline. For the fallback, invite a willing companion to a ten-minute remembrance of a shared teacher, place or event: explain an opening acknowledgment, optional shared recollections, one quiet pause and a closing commitment to care. Both people choose the subject and can omit any part. Do not label this invented form as another tradition's rite."
        checks: [The form has an identified tradition or honestly named shared story, Words gestures and leadership have an understood purpose, Eligibility and an honest role are established, Consent access and leaving are considered in advance]
      - title: "Take part only in what you can sincerely undertake"
        instructions: "Attend the suitable gathering or hold the agreed fallback. Follow visitor guidance, join only permitted and freely endorsed elements, and decline words or acts you cannot sincerely affirm. For the fallback, acknowledge why the shared subject matters, each offer an optional specific recollection, pause quietly and name one modest act of care before closing. Notice the other person's freedom and contribution. Do not photograph, record, evaluate devotion or turn the event into a test of someone else's belief. Record observer status honestly if you only watched."
        checks: [An actual communal occasion takes place, Participation or observation is described accurately, Endorsed elements are undertaken sincerely, Other people retain privacy and freedom to decline]
      - title: "Relate the experience to community and later conduct"
        instructions: "Afterwards, explain how one actual element connected the individual to the community's story, commitments or sacred meaning. Distinguish what you understood, what you did and what you still question. Ask one respectful question through an appropriate willing person if clarification is useful. Within two days, carry out the modest act of care or responsibility you endorsed; if none was promised, choose one consistent with the form's meaning. Decide whether future participation fits your conscience and circumstances without ranking other pathways."
        checks: [An experienced element is connected to shared meaning, Understanding action and remaining questions are distinguished, A related ordinary responsibility receives an attempt, Future participation remains a conscientious choice]
    adaptation: "Use an accessible online gathering if participation and privacy expectations are clear. The consented ten-minute fallback needs no travel, money, sacred language or disclosure of recent loss. With no willing companion or suitable group, prepare the map but leave communal participation untested; observing a recording is not a live shared occasion."
    review: "What did you understand and sincerely join, how did it locate you in a shared story, and what freedom did you preserve for yourself and others?"
    examples:
      supportive: "Two willing people used the plainly named remembrance, shared a specific story, honored silence and later carried out a modest care commitment."
      mixed: "A visitor understood the gathering better but chose to observe a restricted element and kept that limit explicit."
      contradictory: "Participation required a false profession of belief, a restricted rite was imitated without permission or another person's conscience was dismissed."
      inconclusive: "A video was watched alone and then recorded as evidence of taking part in a live communal practice."
  '03.11':
    title: "Reason through authority conscience and a disputed practice"
    goal: "Distinguish the legitimate roles and limits of texts, teachers, institutions, inherited practice, experience and conscience, then give a principled process for agreement, dissent or reform."
    scope_note: "The supplied low-stakes fictional case practices discernment. It neither adjudicates a real abuse allegation nor makes this app a religious, legal or safeguarding authority. A thoughtful decision is not measured by obedience or dissent alone."
    burden: "Three sessions of about 20 minutes, using the supplied case or a comparably safe ordinary disagreement."
    setup: "Use this fictional case: a community reading circle traditionally ends with a statement of gratitude. A respected teacher proposes requiring every visitor to say the same words, citing unity and a valued text. One visitor wants to remain silent honestly. The written visitor policy permits observation, and the coordinator can review meeting procedures. No real group needs to be contacted."
    actions:
      - title: "Map the sources of authority without treating them as identical"
        instructions: "Make six entries for the case: text, teacher, institution, inherited practice, experience and conscience. State what each contributes and what it cannot settle by itself. The text may guide gratitude but needs interpretation; the teacher may explain it but not rewrite the visitor policy alone; the coordinator manages procedure; tradition carries shared meaning; the visitor describes their own experience; conscience addresses sincere assent and conduct. Identify the exact disputed demand, who is affected and which facts are missing. Do not invent the text's wording to win the argument."
        checks: [All six sources of authority have distinct roles and limits, The disputed demand and affected people are specific, Interpretation is separated from an actual rule, Missing facts are retained rather than invented]
      - title: "Test legitimate direction and signs of coercion"
        instructions: "Give the strongest fair reason for shared words and the strongest fair reason for voluntary silence. Examine the demand against its proper scope, the stated visitor policy, truthful assent, proportionality and an available appeal. Distinguish ordinary coordination, such as ending on time, from compelled belief or punishment for respectful refusal. Consider a counterfactual: if the coordinator threatens exclusion from essential support for silence, the issue exceeds a meeting preference and requires safety-conscious outside advice. Do not rehearse a confrontation with a threatening authority."
        checks: [Both sides receive a fair reason, Scope consent and accountability are examined, Coordination is distinguished from compelled belief, A coercive escalation has an appropriately different response]
      - title: "Give a principled process and test it against a changed case"
        instructions: "Write a short proposed response: identify the text or policy to clarify, explain the conscientious concern, propose spoken words or respectful silence, and ask the coordinator to review the procedure through a fair route. State when you would comply, decline, seek independent advice or leave. Then change one fact: the group advertises a members-only rite and offers a separate open gathering. Re-evaluate without insisting that every form must be open to everyone. End with a reasoned disposition and an unresolved question, not a verdict that all tradition or all dissent is good."
        checks: [A concrete clarification and review process is proposed, Compliance dissent and exit have stated conditions, The changed case produces a reasoned reassessment, A conclusion and remaining question preserve conscience and the rights of others]
    adaptation: "Use spoken reasoning, six labeled objects or the supplied case without personal disclosure. In an actual coercive or abusive setting, do not use this exercise to investigate, negotiate safety or confront an authority; use independent support appropriate to the circumstances. No complaint, confession or change of belief is required."
    review: "Which authority was legitimate for which question, and what makes your process principled rather than convenient agreement or reflexive opposition?"
    examples:
      supportive: "The proposal preserved shared gratitude and honest silence, used the policy review route, and distinguished an open gathering from an appropriately restricted rite."
      mixed: "The reasoning recognized conscience but could not verify the cited text, so that interpretive question remained open."
      contradictory: "Respect for tradition became permission to coerce belief, or personal discomfort was treated as authority to erase every community boundary."
      inconclusive: "A preferred answer was announced without distinguishing authority roles, considering an objection or specifying a review process."
  '03.12':
    title: "Cooperate across a real worldview difference without false agreement"
    goal: "Describe another tradition accurately from its own account, state a genuine disagreement without contempt and define shared conduct that does not require deceptive consensus."
    scope_note: "The default compares two identified accounts, not every Christian or every humanist. A dialogue rehearsal tests understanding and cooperation design; it does not establish interfaith relationship skill until a real voluntary exchange occurs."
    burden: "About 20 minutes of reading, a 15-minute rehearsal or voluntary conversation and a 15-minute cooperation review."
    setup: "Read the Vatican-hosted Nicene Creed and Humanists UK's Humanism introduction using the provided references. The first affirms a divine creator; the second presents a nonreligious account centered on reason and human welfare. Neither summary is a complete tradition. Use the fictional shared-library event below or a willing person's own account; never assign someone's beliefs from a group label."
    actions:
      - title: "State each account so its proponent could recognize it"
        instructions: "Read both named accounts. For each, record one actual claim, its source location, one implication and one question the account does not answer for you. State the disagreement about a divine creator plainly; do not reduce it to different words for the same belief. Also identify a possible practical shared concern, such as care for neighbors, without pretending that its reasons must be identical. Correct your own summary against the source before evaluating it. With a willing conversation partner, ask them to correct their own view rather than speak for a whole tradition."
        checks: [Two accounts are traced to their own sources, Each summary is checked for accuracy, A real disagreement is stated without caricature, Shared conduct is distinguished from shared reasons]
      - title: "Practice a conversation that makes disagreement speakable"
        instructions: "Use this fictional case: two volunteers disagree about belief in God while organizing a library event. One requests an optional prayer before setup; the other asks not to be included in prayer or described as endorsing it. Rehearse both positions in three turns each: a fair summary, a sincere disagreement and a curious clarifying question. Replace you people with this claim or my view. Give neither side a conversion goal. If using a real willing partner, agree time and topic in advance and stop if either person wants to end. Label rehearsal and live dialogue separately."
        checks: [Both positions receive a fair summary and sincere disagreement, Questions invite clarification rather than a trap, No group is treated with contempt, Rehearsal or live dialogue is identified honestly]
      - title: "Design cooperation that does not borrow another person's assent"
        instructions: "For the library case, agree a shared practical task, optional prayer outside required work, truthful descriptions of who participates, and equal ability to help without worship. Identify any real venue rule that would need checking; do not invent permission. Test the arrangement against two changes: someone declines prayer, and someone asks to discuss belief during the task. State how each can decline without punishment. In a real opportunity, agree and carry out a comparably modest task; otherwise retain the result as a cooperation design and leave live cooperation untested."
        checks: [A useful shared task and voluntary boundaries are specified, Participation is described without false endorsement, The arrangement handles two concrete disagreements, Designed cooperation is separated from any actual joint work]
    adaptation: "Read the sources with text to speech or use an accurate accessible edition. If access is missing, the supplied summaries support rehearsal only; source-accuracy checks remain unverified. No debate, religious disclosure, interfaith event or contact with an unwilling person is required. Unchosen participation is N/A, not deficient tolerance."
    review: "What disagreement stayed real, what understanding improved, and exactly what could you do together without either person pretending agreement?"
    examples:
      supportive: "Both sourced accounts were represented fairly and the library arrangement let people cooperate while prayer and assent remained voluntary; live cooperation was not claimed from rehearsal."
      mixed: "The disagreement was respectful, but an assumed venue rule still needed checking before the arrangement could be used."
      contradictory: "One person's silence was presented as assent, a tradition was caricatured or cooperation was made conditional on conversion."
      inconclusive: "Everyone was declared basically the same without examining a real claim, disagreement or workable shared task."
  '03.13':
    title: "Interpret an intense experience with reason conduct and time"
    goal: "Separate a vivid experience from claims about its meaning and integrate it through careful reasoning, an appropriate outside perspective, ordinary conduct and later review."
    scope_note: "Awe, unity, devotion, revelation and transcendence describe different experiences and interpretations. Intensity does not automatically establish truth or authority. This exercise interprets a manageable past or fictional event; it does not induce altered states or assess mental health."
    burden: "About 20 minutes initially, one short perspective check and ordinary action, then a 15-minute review after several days."
    setup: "Use the supplied fictional case: after music and a striking sky, a person feels deeply connected to others and wonders whether they have been given a special mission. No unusual experience is required. A settled, non-distressing memory may replace the case if freely chosen. Do not seek substances, deprivation, hyperventilation, intense meditation or sensory overload."
    actions:
      - title: "Separate what happened from what it seems to mean"
        instructions: "Make three headings: experienced, interpreted and proposed action. In the case, music, the sky and a feeling of connection belong under experienced; a special mission is an interpretation; quitting commitments would be a proposed action. Distinguish awe, a sense of unity, devotion and an apparent revelation rather than treating them as one proof. Write at least two possible accounts, such as personally meaningful emotion and a spiritual interpretation, and identify what the experience alone cannot decide. Include context such as tiredness only if known."
        checks: [Experience interpretation and proposed action are separated, Different kinds of intense experience are distinguished, At least two possible accounts remain available, Unknown context and limits of inference are explicit]
      - title: "Check an interpretation without outsourcing judgment"
        instructions: "For a personal memory, discuss only what you choose with a trusted willing person who can question the interpretation without pressure; this might be a thoughtful peer or appropriate community member. Ask what would support the claim, what would count against it and whether the proposed action serves others responsibly. For the fictional case, compare two supplied responses: the feeling proves a unique mission, versus the feeling may matter while its explanation stays uncertain. Explain why reassurance, charisma or agreement alone does not settle the claim. No private disclosure or authority endorsement is required."
        checks: [An outside perspective or explicitly fictional comparison is considered, Supporting and disconfirming reasons are requested, Authority and agreement are not treated as proof, Disclosure and participation remain voluntary]
      - title: "Integrate through a reversible action and a later review"
        instructions: "Choose one ordinary action consistent with the constructive meaning but reasonable under either interpretation: return something borrowed, keep an existing promise or offer a small welcome that is wanted. For the default case, try one such action in your own ordinary life without claiming the fictional experience as yours. After several days, compare the action's effects, the remaining meaning and any revised explanation. Maintain ordinary responsibilities and postpone major commitments based solely on the experience. Conclude what you can retain and what remains uncertain; an enduring feeling still does not prove a metaphysical claim."
        checks: [A proportionate reversible action is actually attempted, Existing responsibilities are preserved, A later review examines conduct and interpretation separately, Retained meaning does not become automatic proof]
    adaptation: "Use the fictional case, spoken notes or a simple three-column diagram. Do not re-enter an upsetting state to obtain evidence. If an experience is frightening, disrupts ordinary functioning or seems to demand dangerous action, stop this educational exercise and seek suitable professional support; immediate danger needs urgent local help."
    review: "What meaning survived patient examination, what changed in ordinary conduct, and what claim still lacks evidence?"
    examples:
      supportive: "The person retained a sense of connection, kept an ordinary promise, welcomed a questioning perspective and left the proposed special mission unproven after later review."
      mixed: "The small action was constructive, but the interpretation remained uncertain and the outside perspective was only a fictional comparison."
      contradictory: "An intense feeling became unquestionable authority for a major commitment, or a skeptical question was treated as evidence that outsiders were hostile."
      inconclusive: "The event was described vividly without separating interpretation, checking a perspective or reviewing any ordinary action over time."
