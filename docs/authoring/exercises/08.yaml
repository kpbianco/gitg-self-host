schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '08'
exercises:
  '08.01':
    title: "Find one recurring attention leak and change its surroundings"
    goal: "Observe where attention goes, distinguish chosen engagement from unwanted drift, and redesign one recurring setting without treating all leisure as wasted time."
    scope_note: "A short sample identifies one testable attention pattern. It is not continuous monitoring, a productivity score or a diagnosis of attention difficulty."
    setup: "Keep a private six-line note headed devices, entertainment, work, relationships, repetitive worry, and deliberate practice. Sample three ordinary transitions today, such as finishing breakfast, finishing a work period and beginning leisure. No monitoring app or access to anyone else's device is needed."
    burden: "Three brief notes on one day, about 15 minutes of review and one comparable trial of a changed setting."
    actions:
      - title: "Sample actual attention and distinguish choice from unwanted drift"
        instructions: "At each chosen transition, recall the activity you intended, what actually held your attention and whether the change was freely chosen, necessary or unwanted. Place it under the six headings; leave unsampled categories unknown. For example, checking an essential message is different from opening unrelated feeds after the reply, and a welcome conversation is not a leak merely because work paused. For repetitive worry, describe only its effect on the activity, not private thought content. Record a concrete cue where available, such as a visible notification, and avoid reconstructing an entire day from memory."
        checks: [Three actual transitions are sampled, All six attention categories are considered with unknowns allowed, Chosen leisure and necessary interruption are distinguished from unwanted drift, A concrete cue or uncertainty is recorded]
      - title: "Redesign one recurring setting around the observed cue"
        instructions: "Choose an unwanted pattern that appeared in the sample and state the activity you want to protect. Change one controllable feature: close an unrelated tab before reading, place the needed page in view, silence only nonessential alerts or keep a note for later worries beside the task. If no pattern appeared, use a separate explicit experiment comparing reading with and without an unrelated visible tab; do not invent a personal leak. Preserve emergency contact, accessibility and caregiving needs. Write what would count as a useful change, such as returning to the selected page without opening the unrelated tab."
        checks: [The redesign targets an observed pattern or a labeled exploratory comparison, Exactly one controllable feature changes, Necessary communication and accessibility supports remain available, A useful result is defined in observable terms]
      - title: "Try the changed setting and compare its practical effect"
        instructions: "Use the changed setting during a comparable ordinary activity. Afterward, note whether the cue occurred, where attention went and how readily you returned. Compare it with a sampled usual occurrence while retaining differences in fatigue, urgency or interruptions. If the change blocked a legitimate need or merely moved the distraction elsewhere, record that cost. Keep the adjustment, revise it or restore the original setting based on the actual comparison. A single better occasion supports a local possibility, not a conclusion that all devices, entertainment or drifting thoughts are harmful."
        checks: [The changed setting is actually used, Its result is compared with a usual occurrence, Relevant context differences and costs remain visible, The next environmental choice follows the observation]
    adaptation: "Use spoken notes, symbols or a trusted recorder without exposing private content. Sample fewer details if recall is difficult. A planned comparison is preparation until performed; do not create a stressful interruption to obtain data."
    review: "Which cue repeatedly pulled attention away from a chosen purpose, and did the redesign help without blocking a real need? Retain one useful change and leave unsampled parts of life unknown."
    examples:
      supportive: "Unrelated tabs repeatedly drew attention after an essential reply; closing one before reading made returning to the page easier on the trial."
      mixed: "Silencing an alert reduced unwanted checking but also obscured a needed message, so the setting required a narrower exception."
      contradictory: "All conversation and leisure were classified as failure, or an essential accessibility alert was removed to improve apparent focus."
      inconclusive: "A general belief about screen time replaced actual samples, and no changed setting was tried."
  '08.03':
    title: "Delay one ordinary impulse long enough to make an endorsed choice"
    goal: "Create a brief choice point before an impulsive action, then act or decline for a reason you can explain rather than because the urge feels compulsory."
    scope_note: "One low-stakes impulse is practiced twice. This is not treatment for compulsions or a requirement to delay basic needs, consent decisions or urgent protective action."
    setup: "Choose a harmless recurring urge, such as opening an unrelated tab during a chosen task. Have a private note labeled urge, reason, choice and result. Use an unsent ordinary message as rehearsal if no suitable live opportunity occurs. No purchase, food restriction or sexual situation is needed."
    burden: "About 10 minutes to prepare and two naturally occurring choice points, with a short note afterward."
    actions:
      - title: "Locate a choice point before the impulse becomes a commitment"
        instructions: "Consider how impulses can arise in speech, spending, eating, sex, anger, quitting and novelty seeking. These are possible contexts, not a requirement to practice every one. Select one appropriate low-stakes context and identify the last reversible moment, such as before opening the tab or sending the message. State the chosen reason for delaying: I want to finish this paragraph before switching. Distinguish an optional urge from hunger, a safety need, a withdrawal of consent or a legitimate decision to stop. Those do not have to be overridden to demonstrate control."
        checks: [The seven possible contexts are considered without compulsory enactment, One suitable reversible choice point is identified, The reason for delay is consciously endorsed, Legitimate needs and protective choices are distinguished from optional urges]
      - title: "Perform a brief pause and choose what serves the actual reason"
        instructions: "At the selected choice point, leave the optional action uncommitted while you finish one small unit or read the drafted sentence once. Name the urge privately without arguing that having it makes you bad. Then choose to proceed, postpone or redirect and state why. For the tab example, finishing the paragraph before deciding whether to switch is sufficient; you need not forbid the tab for the rest of the day. For an unsent-message rehearsal, write both the impulsive reply and a considered alternative, and mark that the interaction itself did not occur."
        checks: [A pause occurs before the optional commitment, The urge is acknowledged without a judgment of worth, A proceed postpone or redirect choice has an explicit reason, Rehearsal and a real choice point remain distinct]
      - title: "Repeat and examine whether the choice remained yours"
        instructions: "Use the same choice point at another natural opportunity. Record whether the pause happened, what you chose and whether the original reason still fit. If continuing the task was no longer sensible, choose differently rather than obeying the pause rule mechanically. Compare both occasions for a workable cue, excessive delay or a rebound into unchosen behavior. Retain a small useful pause or change it. Do not create temptation or deprive yourself of a need to complete a second trial; an unavailable occasion remains pending."
        checks: [A second suitable opportunity is actually examined, The reason is reconsidered rather than obeyed mechanically, Costs or rebound behavior are recorded if observed, Missing opportunities are not counted as successful restraint]
    adaptation: "Use a visual prompt, dictation or a supported communication route. Apply this only to optional ordinary behavior; maintain food, rest, prescribed care and necessary supports. Distressing or unsafe loss of control belongs with qualified support, not a harder willpower challenge."
    review: "Did the pause give you a real choice, and what reason did that choice serve? Keep the smallest useful cue. Restraint on two occasions does not establish broad impulse control."
    examples:
      supportive: "The person noticed the tab-opening urge twice, finished the selected paragraph and then deliberately chose whether to switch."
      mixed: "The pause worked once but became unnecessary delay later; the person revised the rule to fit the actual task."
      contradictory: "Control was defined as ignoring hunger, refusing a necessary stop or pressuring someone after consent was withdrawn."
      inconclusive: "A promise to be disciplined was recorded without a reversible choice point or an attempted pause."
  '08.04':
    title: "Observe one desire without turning it into an obligation or entitlement"
    goal: "Notice how wanting narrows attention and shapes judgment, then make a bounded choice that respects people and goods beyond their usefulness to the desire."
    scope_note: "A harmless ordinary desire illustrates attention and choice. It does not require sexual disclosure, abstinence from necessities, deliberate craving or treatment of addiction."
    setup: "Use an ordinary desire such as checking an entertaining feed, or this case: an attractive new accessory seems essential even though an existing one serves its function. Use a private note; do not buy anything or view provocative material for the exercise."
    burden: "About 15 minutes for observation and one ordinary choice, followed by a short later review."
    actions:
      - title: "Describe what wanting makes prominent and what it hides"
        instructions: "Write the wanted experience, the promised benefit and the details receiving most attention. Then name two neglected facts, such as the existing item's usefulness or another commitment that matters. Separate I want this from I must have this and from a claim that obtaining it will settle your identity. In the case, attractive design may be a real preference without making the accessory necessary. Notice whether the desire changes what evidence you accept. Record the desire's presence without trying to intensify it or insisting it vanish before you can choose."
        checks: [The wanted experience and promised benefit are specific, Two neglected facts broaden the picture, Wanting is separated from necessity and identity claims, Changes in attention or evidence selection are identified]
      - title: "Check whether a person or good is being reduced to a means"
        instructions: "Ask what else matters about the person or object beyond satisfying the urge. For an object, consider its actual function, care and place among other chosen commitments. For a relational or sexual example considered privately, another person's preferences, boundaries and right to decline remain independent of your wanting; attraction creates no entitlement. Do not contact someone to test this. Write a sentence that restores the broader view, such as I can appreciate this design while using what already works, or Their choice is theirs even when I feel disappointed."
        checks: [The person or good is considered beyond satisfying the urge, Another person's independent boundaries are preserved where relevant, Desire is not treated as entitlement, A concrete broader-view statement is written]
      - title: "Make a bounded choice while allowing the desire to remain"
        instructions: "Choose a suitable action: continue the chosen task, take a freely chosen ordinary leisure break, keep using the existing item or decline an optional acquisition. Perform that choice and review later whether wanting remained and whether the action served your reasons. In the supplied case, return to an actual activity using what you already have; a purchase is unnecessary. If the desire returned, note the recurrence without turning it into a failed purity test. Record any unchosen checking or pressure honestly and revise the situation rather than defending it as irresistible."
        checks: [A bounded ordinary choice is actually performed, The choice has reasons beyond immediate wanting, Continuing desire does not automatically invalidate the action, Unchosen behavior or pressure is recorded without justification]
    adaptation: "Use the accessory case or a nonsexual ordinary desire. Privacy, consent and necessities remain intact. If craving concerns dependence or distressing compulsive behavior, seek suitable care rather than abruptly changing substance use or imposing deprivation through this exercise."
    review: "What did desire hide, and could you choose with the fuller picture available? Keep a useful reminder without claiming that appreciating or experiencing desire is itself wrong."
    examples:
      supportive: "The new item still appealed, but the person noticed the existing item's function and deliberately returned to using it."
      mixed: "The choice fit the person's reasons, yet repeated browsing continued; that unresolved pattern was retained for review."
      contradictory: "Wanting was used to justify pressuring another person or dismissing every fact that complicated an acquisition."
      inconclusive: "The person condemned desire in general without examining a specific promise, neglected fact or chosen action."
  '08.05':
    title: "Finish a small worthwhile task while allowing ordinary discomfort"
    goal: "Distinguish tolerable ordinary discomfort from a reason to stop, then complete a bounded useful action without requiring boredom or frustration to disappear."
    scope_note: "This exercise uses low-stakes boredom or uncertainty, not pain exposure, exhaustion training or a test of how much distress someone can endure."
    setup: "Use this two-minute task: rewrite the vague note Bring the stuff later into an actionable reminder naming the item, time and destination. Supply these facts: library book, tomorrow at 3 pm, front desk. Paper or dictation is sufficient. If you use a personal task, make it comparably small and appropriate."
    burden: "About 10 minutes including preparation, the bounded task and review."
    actions:
      - title: "Choose useful discomfort and define a stopping boundary"
        instructions: "Consider boredom, uncertainty, frustration, embarrassment, fatigue, craving and temporary pain as different experiences rather than one demand to push through. Choose ordinary boredom or uncertainty for this task; do not induce the others. Name the useful result and a short stopping point. For the supplied note, success is a reminder containing all three given facts. Identify a reason to stop or adapt, such as pain, worsening distress or an inaccessible writing method. Stopping for such a reason protects the task's purpose; it is not evidence of moral weakness."
        checks: [The seven kinds of discomfort are distinguished without inducing them, The selected task has a useful concrete result, A short stopping point is stated, Safety and accessibility limits are explicit]
      - title: "Attempt the bounded work without first negotiating away every feeling"
        instructions: "Begin the reminder and include the item, time and destination. If boredom, uncertainty or an urge to switch appears, name it briefly and return to the next concrete word or dictated phrase. Do not spend the whole window measuring discomfort. Use the supplied facts instead of searching for a perfect sentence. If no discomfort appears, simply complete the task and record that this occasion did not test tolerance. Respect the stopping boundary or use an accessible format if needed. An unfinished attempt remains visible rather than being redefined as success."
        checks: [The useful task is actually attempted, Any ordinary discomfort is recorded without required provocation, Attention returns to a concrete next step when appropriate, Completion absence of discomfort and stopping remain distinct]
      - title: "Check the work and separate willingness from endurance"
        instructions: "Compare the reminder with the three facts, correcting any omission. Record whether ordinary discomfort was present, whether you continued appropriately and what made the task workable. For example, Return the library book tomorrow at 3 pm to the front desk meets the requirement without elegant wording. If you stopped for a legitimate limit, identify an accessible next arrangement rather than prescribing a longer exposure. Choose whether this small method is useful for another ordinary task. Completing a trivial exercise does not demonstrate tolerance of pain, fatigue or a major uncertain situation."
        checks: [The result is checked against all three supplied facts, Actual willingness is distinguished from imagined endurance, A legitimate stop leads to adaptation rather than punishment, Transfer claims stay within the observed ordinary task]
    adaptation: "Use dictation, symbols or a helper transcribing your choices. Do not select an activity that aggravates pain or requires ignoring care guidance. A task completed without discomfort shows task performance only."
    review: "Could a small useful action proceed while ordinary discomfort was present, and where did stopping or support make more sense? Keep the practical lesson without making suffering the goal."
    examples:
      supportive: "The person felt bored, returned to the three facts and completed an actionable reminder without waiting to become interested."
      mixed: "The reminder was finished easily, so task completion was observed but discomfort tolerance was not tested on this occasion."
      contradictory: "Pain or worsening distress was deliberately ignored to make the task count as toughness, or the time limit was repeatedly extended."
      inconclusive: "The person planned to endure boredom but neither attempted the supplied task nor recorded a legitimate stopping decision."
  '08.06':
    title: Start a necessary small task at the chosen cue on two ordinary days
    goal: Begin useful work without making inspiration or confidence a prerequisite, while respecting actual capacity
      and legitimate reasons to revise the plan.
    scope_note: Two starts test beginning under the motivation actually present. They do not show endurance, productivity
      or an ability to override illness and exhaustion.
    setup: 'Choose a necessary low-stakes task and a reversible two-to-five-minute first step. Default: start a useful
      coordination note by writing its item, time and place; use library book, tomorrow 3 pm, front desk. Select two
      naturally occurring, suitable low-motivation windows. The first uses usual conditions; the second adds exactly
      one cue, such as materials placed safely in view. Do not record private task contents in the check-in.'
    burden: About 20 to 30 minutes across setup, two bounded starts and comparison within seven days; either start
      may end after its planned two-to-five-minute step.
    actions:
    - title: Observe the first bounded start under usual conditions
      instructions: In the first suitable low-motivation window, use your usual safe conditions without adding a new
        cue. Attempt the previously defined two-to-five-minute first step, such as beginning the coordination note
        with its item. Record whether the physical or communication start actually occurred and its duration, separately
        from any later output. End at the chosen boundary; continuing is optional and is not measured here. Record
        any capacity or safety concern honestly and stop when appropriate. If no suitable low-motivation window occurs,
        retain the deferral rather than manufacturing fatigue or calling an enthusiastic start evidence of low-motivation
        action.
      checks:
      - The first window uses usual conditions without an added cue
      - Whether the chosen start occurred is recorded directly
      - The start duration is recorded against its planned boundary
      - Capacity concerns and deferral remain explicit
    - title: Try the same sized start with one concrete cue
      instructions: At a separate suitable low-motivation opportunity, use the same sized first step with exactly
        one chosen cue or support. A cue can be the needed material placed safely in view, a calendar prompt or a
        willing helper's agreed reminder. Record whether the start occurred and the cue category, without private
        task content or the helper's identity. Keep necessary supports in both windows; the comparison is not independent
        versus unsupported. Defer if capacity, safety or responsibilities have changed. A missed or deferred start
        remains visible and cannot be replaced with a claim that preparing the cue was itself starting the task.
      checks:
      - The second opportunity is separate and suitable
      - Exactly one cue or support category is identified
      - Whether the cued start occurred is recorded directly
      - Private content and changed-capacity deferral are preserved
    - title: Compare the two starts without judging output or capacity
      instructions: Review the two structured records and state whether zero, one or two chosen starts actually occurred.
        Compare the cue as more workable, less workable or indistinguishable, giving an observed reason rather than
        a productivity judgment. Keep differences in timing, energy, pain, care duties and access visible as context;
        do not score them as character. The supplied note may still be unfinished because the evidence concerns beginning,
        not output. If both suitable windows did not occur, leave the comparison inconclusive. Decide to retain, adapt,
        defer or discard the cue; a stronger challenge or longer work period is not the automatic next step.
      checks:
      - The count reflects zero one or two actual starts
      - The two windows and any deferral are distinguished
      - The cue comparison is bounded by observed context differences
      - Capacity output and worth are not treated as performance scores
    adaptation: Use dictation, prepared materials, supported communication or a smaller legitimate task. Existing
      care and rest needs take precedence over the chosen cue. The exercise does not prescribe pushing through illness
      or impaired functioning.
    review: Did a chosen start occur in each naturally suitable low-motivation window, and did one cue make access
      more workable? Retain the existing Boolean start observations, duration, count and supporting checks. Keep missing
      windows inconclusive and choose whether to retain, adapt, defer or discard the arrangement; two starts do not
      establish broad reliability.
    examples:
      supportive: Both bounded starts occurred, one under usual conditions and one with a visible-material cue; the
        comparison retained timing and capacity differences without scoring output.
      mixed: The usual-condition start occurred but the cued window was safely deferred; the record retained one actual
        start and an inconclusive comparison.
      contradictory: The cue added pressure or the bounded start displaced a needed support; the adverse effect was
        recorded instead of being called discipline.
      inconclusive: No comparable low-motivation windows occurred, or start occurrence was unknown, so preparation
        alone did not establish repeated starting.
  '08.07':
    title: "Make one recurring action easier through a tested environmental change"
    goal: "Use a cue, default, manageable friction, a checklist and physical arrangement to support a chosen behavior, with optional accountability that preserves agency."
    scope_note: "Two opportunities test one local design. They do not establish a lasting habit, and reliability must not depend on removing necessary supports or recruiting someone to police behavior."
    setup: "Choose putting an ordinary needed item in its departure place, such as a notebook by your bag, or an equivalent recurring action. Use a card with three checks: item ready, necessary contents present, departure place suitable. Select a safe location that does not obstruct movement."
    burden: "About 15 minutes to design and install, two natural uses and a short review."
    actions:
      - title: "Map the current cue and the practical point where the action fails"
        instructions: "Describe one actual occurrence or the supplied case: the notebook is remembered at departure but left elsewhere after use. Identify the cue, the current default, friction that hinders the desired action and competing friction that makes forgetting easy. Consider layout and a short checklist, not just determination. Optional accountability could be a willing person's single agreed reminder, never surveillance or punishment. Choose one design hypothesis, such as placing the checklist beside the bag when putting work away will make the notebook easier to prepare. Leave uncertain causes as hypotheses."
        checks: [A specific recurring action and current cue are identified, Defaults and friction are distinguished from motivation, Layout checklist and optional accountability are considered, One testable design hypothesis is selected]
      - title: "Install the smallest change that supports the intended behavior"
        instructions: "Put the card and the needed item in the selected safe place. Make the desired next action obvious: after finishing with the notebook, check its contents and place it by the bag. Keep the three checks short enough to use at the moment of action. If another person is involved, ask for the exact reminder and let them decline. Do not reorganize the whole room or add unrelated goals. Record what changed so the next comparison tests an installed arrangement rather than an attractive plan. Preserve shared access and other people's belongings."
        checks: [The selected arrangement is actually installed, The next action is visible at a meaningful cue, The checklist remains brief and task-specific, Shared access and any helper's consent are preserved]
      - title: "Use the arrangement twice and revise the failed link"
        instructions: "At two natural opportunities, use the cue and three checks, then record whether the item was ready when needed. Note whether the card was seen, the action followed and the location remained workable. If it failed, identify the particular link: invisible cue, unsuitable place, missing contents or an action that was too burdensome. Change that link or restore the previous arrangement if the costs outweigh the benefit. Do not count two checks performed immediately after installation as two independent recurring opportunities, or treat a helper's reminder as unaided success."
        checks: [Two separate recurring opportunities are recorded, The cue action and practical result are distinguished, A failure is traced to a specific design link, Support and costs remain explicit in the comparison]
    adaptation: "Use tactile, visual or spoken cues and a reachable safe location. A helper may assist with the physical placement while you retain the choices. Keep accessibility aids, medication arrangements and emergency access unchanged."
    review: "Which part of the environment carried some of the remembering or preparation burden? Keep one useful arrangement, revise one failed link or remove an unhelpful design. Two uses are not proof of a permanent habit."
    examples:
      supportive: "The card was visible while putting work away, and the notebook was ready at two later departures with its contents checked."
      mixed: "The item was ready once but the location obstructed a shared surface, so the placement was revised."
      contradictory: "A helper was made responsible for policing compliance, or the new layout blocked access in pursuit of a tidier routine."
      inconclusive: "The arrangement was described but not installed, or both claimed uses occurred during the same setup rather than later opportunities."
  '08.08':
    title: "Define and test a difficult-day minimum without hiding the full standard"
    goal: "Maintain a meaningful thread of a chosen commitment during constrained days while keeping minimum, normal performance and unmet requirements visibly different."
    scope_note: "One normal and one reduced attempt test a practical standard. A minimum is appropriate only where reduced scope is legitimate; it cannot replace safety-critical or externally required work without agreement."
    setup: "Choose a flexible personal learning task. Default: explain this instruction in your own words and give an example: A useful reminder states the action, when it is needed and where it applies. Have two short note spaces labeled normal and minimum."
    burden: "About 15 minutes to define and try both versions, followed by a review at a naturally constrained opportunity if one occurs."
    actions:
      - title: "Write two observable standards and name what the minimum leaves out"
        instructions: "For the normal version, write a three-sentence explanation and an example reminder containing an action, time and place. For the minimum, write one accurate sentence naming the three components. Explain why that still serves learning and what remains untested: producing a usable example and explaining the idea more fully. State when reduced scope fits, such as limited discretionary time, and when stopping or renegotiation is needed instead. Do not turn a minimum into permission to omit essential care, safety steps or work promised to someone else."
        checks: [Normal and minimum standards are both observable, The minimum retains a meaningful part of the purpose, Omitted requirements are named explicitly, Reduced scope is limited to contexts where it is legitimate]
      - title: "Perform both versions and check that the minimum is still substantive"
        instructions: "Produce the normal explanation and example, then separately produce the minimum sentence. Check each against its own stated criteria. A usable normal example is Return the library book tomorrow at 3 pm to the front desk; the minimum might say A reminder needs an action, a time and a place. If the minimum is only opening the note or writing a title, it does not yet demonstrate this learning purpose. Label this a design trial when no actual difficult day is involved, rather than claiming continuity through hardship from an easy rehearsal."
        checks: [Both versions are actually attempted, Each is checked against its own requirements, The minimum includes substantive work rather than symbolic attendance, A design trial is distinguished from an actual constrained day]
      - title: "Choose the fitting standard and review continuity honestly"
        instructions: "At the next natural opportunity, choose normal, minimum, or a reasoned pause based on actual circumstances. Attempt the selected version if appropriate, and record which standard it met, what was omitted and what the next opportunity needs. If no constrained day occurs, keep the trial result and leave difficult-day continuity unknown. Do not create a debt requiring punitive catch-up after every minimum day. If reduced scope repeatedly fails the larger purpose, revise the commitment or seek needed support rather than hiding the gap behind an unbroken streak."
        checks: [The selected standard follows actual circumstances, The achieved level and omissions are recorded honestly, Missing constrained-day evidence stays unknown, Repeated reduced scope prompts review of the larger purpose]
    adaptation: "Use dictation or a diagram with the same informational requirements. Choose another genuinely flexible activity if writing is unsuitable. External obligations need agreement before their required standard changes."
    review: "Did the minimum preserve meaningful continuity, and which normal requirements remained unmet? Keep two clearly labeled standards or revise the commitment. A reduced attempt is not full performance."
    examples:
      supportive: "A short accurate sentence preserved the learning purpose on a constrained day, and the person clearly recorded that the full example was not produced."
      mixed: "Both versions worked in rehearsal, but no difficult-day opportunity occurred, so continuity under constraint remained untested."
      contradictory: "Opening a notebook was counted as learning, or the minimum was used to conceal repeatedly unmet essential requirements."
      inconclusive: "The person endorsed doing a little every day without defining either level or trying the proposed minimum."
  '08.09':
    title: "Try one modest voluntary simplification and examine freedom rather than toughness"
    goal: "Choose a safe optional restraint, observe its effect on choice and appreciation, and stop or revise it if it becomes pride, compulsion or needless burden."
    scope_note: "This practice chooses simplicity or reduced optional stimulation. It does not prescribe fasting, sleep loss, deprivation, pain or strenuous training; those are not interchangeable demonstrations of freedom."
    setup: "Choose one ordinary ten-minute period without optional background entertainment while doing a suitable routine activity. Keep communication, accessibility aids and anything needed for care or safety available. No personal hardship needs to be created."
    burden: "About 10 minutes of preparation, one ten-minute optional simplification and a short review."
    actions:
      - title: "Choose restraint for a purpose and compare legitimate alternatives"
        instructions: "Consider simplicity, silence, abstaining from an optional activity and reduced comfort as possible forms; fasting and difficult training involve additional health and context questions and are not selected here. State the purpose of this modest trial, such as noticing what you usually seek from background entertainment. Define the exact optional feature you will omit and what will stay available. Set the end time and a stopping reason, such as interference with an access need. Keep the choice voluntary; another person's different practice or decision not to participate is not a lower moral standard."
        checks: [Different forms of restraint are considered without treating them as equivalent, One modest optional omission has a concrete purpose, End time stopping reason and retained necessities are explicit, Participation remains voluntary without ranking other people]
      - title: "Perform the simplification without turning discomfort into the objective"
        instructions: "During the chosen period, do the ordinary activity with only the selected optional feature absent. Notice what you miss, what remains available and whether you can choose how to respond. You may restore the feature if the omission interferes with a legitimate need; record why. Do not increase the duration because the trial seems too easy, seek an audience for toughness or withhold ordinary care. If nothing significant happens, retain that neutral result. The action is the bounded simplification, not achieving a required amount of boredom or deprivation."
        checks: [Only the chosen optional feature is omitted, The ordinary activity remains safe and accessible, Actual effects including neutrality are recorded, Duration or hardship is not escalated to make the trial impressive]
      - title: "End on time and examine choice humility and appreciation"
        instructions: "End the trial as planned and freely decide whether to restore the optional feature. Name one thing you appreciate with or without it, one effect on your freedom to choose and any sign of pride or rigidity. For example, noticing the value of a quiet moment differs from claiming that people who enjoy music lack discipline. If you felt unable to stop the rule or wanted to extend it as punishment, treat that as a reason to discontinue and reconsider, not a breakthrough. Keep, revise or decline future trials on their practical merits."
        checks: [The trial ends at the chosen point, Appreciation is specific rather than compulsory gratitude, Choice and humility are assessed separately from endurance, Rigidity or punitive escalation leads to reconsideration]
    adaptation: "Choose another optional feature if quiet is uncomfortable or background sound is an access support. Do not remove food, water, sleep, medication, temperature protection or needed human contact. Health-related restraint belongs with suitable qualified guidance rather than this generic trial."
    review: "Did the restraint increase your ability to choose and appreciate, or did it add rigidity and status comparison? Keep only what serves the original purpose; no harder version is required."
    examples:
      supportive: "The person tried a brief optional quiet period, noticed a welcome detail of the activity and ended on time without judging others' preferences."
      mixed: "The background sound proved helpful for access, so it was restored and the trial's unsuitable choice was recorded."
      contradictory: "The person extended the omission as punishment, removed a necessity or used the exercise to claim superiority."
      inconclusive: "A difficult challenge was admired in principle but no bounded voluntary choice or actual effect was examined."
  '08.10':
    title: "Close one open commitment through completion or a reasoned ending"
    goal: "Limit competing work, define done, address a specific obstacle and either finish a meaningful commitment or explicitly end it for a defensible reason."
    scope_note: "One closed loop tests follow-through and judgment. It does not require finishing a harmful or obsolete goal, and quietly abandoning a promise is not the same as a reasoned ending."
    setup: "Choose one modest open personal commitment. Default: finish an invitation containing purpose, time, place or access route, and a way to reply. Use these facts: a voluntary reading discussion, Saturday 2 pm, community room, reply to the organizer by Thursday. A private draft is sufficient for the supplied task; do not send a fictional event invitation."
    burden: "About 15 minutes to choose and define done, one bounded work period and a short closeout."
    actions:
      - title: "Choose one open loop and define an honest endpoint"
        instructions: "List up to three current open commitments and choose one meaningful item to address now. Put the others explicitly on hold for this work period so novelty does not silently replace the selected task. Define done in observable terms and identify anyone affected by its completion or cancellation. For the supplied task, done is a complete four-part invitation draft, not an event that actually happens. Name the next physical action and a reasonable work limit. Check whether the goal still serves a purpose before committing to finish it."
        checks: [One meaningful open loop is selected from a limited list, Competing commitments are explicitly deferred for the work period, Done and affected people are identified concretely, The goal's continued usefulness is checked]
      - title: "Work through a specific plateau instead of switching goals automatically"
        instructions: "Begin the next action and compare progress with the endpoint. If you stall, name the actual obstacle: missing information, a decision, an oversized step, boredom or loss of usefulness. For the invitation, use the supplied facts rather than polishing an opening indefinitely. Choose a matching response, such as drafting the missing reply line, asking a relevant question or reducing nonessential embellishment. Continue within the chosen limit when appropriate. If the task is unsafe, obsolete or no longer justified, prepare a reasoned ending instead of disguising avoidance as a new exciting project."
        checks: [A concrete next action is actually attempted, Any plateau is described as a specific obstacle, The response addresses that obstacle rather than generic effort, A justified reason to end remains distinct from automatic switching]
      - title: "Close the loop and communicate any consequences"
        instructions: "Check the finished work against every stated requirement. For the default, confirm the purpose, Saturday time, community room and Thursday reply route are all present; label the result a draft. For a real commitment that should end, record the reason, unresolved effects, any handoff and an appropriate message to people relying on it. Do not claim cancellation occurred if the necessary communication was never made. Record finished, explicitly ended or still open accurately, and remove or reschedule reminders accordingly. A stopped work session is not automatically a closed commitment."
        checks: [The final disposition is finished explicitly ended or still open, Completion is checked against all stated requirements, A reasoned ending addresses affected people and remaining effects, Reminders and next actions match the actual disposition]
    adaptation: "Use a smaller legitimate deliverable, dictation or agreed assistance. A task involving others may need renegotiation before it can end; the exercise does not cancel obligations on their behalf. Retain safety and care needs over a completion target."
    review: "What made this loop genuinely closed, and which obstacle-handling choice was useful? Keep unfinished effects visible and select the next commitment deliberately rather than expanding the active list."
    examples:
      supportive: "The invitation draft was checked for all four facts and closed as a complete draft, without pretending a fictional gathering had been arranged."
      mixed: "Most of a real task was finished but a required reply was still missing, so it remained open with one concrete next step."
      contradictory: "An obsolete task was pursued for status, or a commitment affecting others was abandoned without addressing its consequences."
      inconclusive: "The person worked for a set time but never defined or checked what would make the commitment complete."
  '08.11':
    title: "Revise one discipline when its rule no longer serves its purpose"
    goal: "Use structure to support chosen health, duty or meaning while recognizing when rigidity, self-punishment or superiority requires a more proportionate rule."
    scope_note: "One optional personal rule is examined and revised. This does not authorize changing treatment, safety procedures or obligations owed to others without the appropriate agreement."
    setup: "Choose an ordinary self-imposed rule or use this case: someone insists on finishing every optional reading session even when an important agreed conversation is about to start. The reading serves learning, but the rule is now displacing a valued relationship. Use a private note; no actual conflict needs to be created."
    burden: "About 15 minutes to examine the rule, one appropriate trial or rehearsal and a short review."
    actions:
      - title: "Compare the rule's purpose with its actual costs"
        instructions: "Write the rule, the freedom or value it originally supported and its observed effects. Consider health, duties and meaning separately so a visible streak does not become the only criterion. In the case, regular reading supports learning, while never stopping can undermine an agreed conversation. Look for concrete signs of domination: insults toward yourself after a miss, escalating penalties, inability to revise an optional rule or judging other people as inferior. Distinguish these from ordinary effort and a legitimate commitment. Do not infer a clinical condition from a single rigid habit."
        checks: [The rule is connected to its original purpose, Effects on health duties and meaning are considered, Concrete rigidity or superiority signs are examined, Ordinary effort is distinguished from punishment and diagnosis]
      - title: "Write a proportionate exception that preserves the underlying value"
        instructions: "Define when the rule should hold, when it should yield and how the valued activity can resume without punishment. For the reading case: read during the chosen window; stop at the agreed conversation time; mark the next paragraph and return at the next suitable reading period. Explain why this protects both learning and the relationship. Avoid an exception so vague that it erases the commitment or a catch-up penalty that recreates the original rigidity. If the rule is actually a medical, safety or shared obligation, identify the appropriate person to consult rather than changing it unilaterally."
        checks: [The revised rule states normal use and a specific exception, The underlying value remains represented, Resumption does not require punitive compensation, External or safety obligations are not changed unilaterally]
      - title: "Use the exception and assess whether flexibility served the purpose"
        instructions: "At a suitable real opportunity, follow the revised rule and record its effects on the original value and the competing legitimate need. For the supplied case, rehearse by marking a stopping point in a short text, setting it aside and stating when reading would resume; do not claim the conversation occurred. Review whether you could stop without a self-attack or a status judgment, and whether the next commitment remained feasible. Keep, narrow or revise the exception from the evidence. Flexibility is useful when it serves a reason, not merely because every rule should be relaxed."
        checks: [The revised rule is actually used or explicitly rehearsed, Effects on both the original and competing values are assessed, Self-punishment and status judgments are not rewarded, Further revision follows practical evidence rather than blanket permissiveness]
    adaptation: "Use a written, spoken or supported rule and a fictional case if no appropriate personal rule exists. Choose an optional activity; leave prescribed care, safety controls and another person's boundaries intact."
    review: "Did the structure serve your chosen life, and could it change when the reason changed? Keep a rule with a clear purpose and legitimate exception rather than a test of personal purity."
    examples:
      supportive: "The reader stopped at the agreed time, marked the next paragraph and resumed later without penalizing themselves for respecting the conversation."
      mixed: "The exception protected the conversation, but the next reading period was vague and needed a more realistic cue."
      contradictory: "The person treated a missed optional session as moral failure, imposed deprivation or judged people with different routines as inferior."
      inconclusive: "The person praised balance but never identified a rule, a legitimate exception or an attempted revision."
